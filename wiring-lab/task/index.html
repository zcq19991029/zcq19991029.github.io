<!doctype html>
<!-- 接线仿真 · 课堂任务（教师端 + 学生端），2026-11-09
     教师：选班 → 选电路（2.1～2.6 / E1 / E2）→ 填课次/日期/说明 → 发布（= 新增一个 5 分项目）
           → 看实时进度 → 结束（冻结得分）/ 作废 / 导出名单 / 打开大屏
     学生：看本班当前任务、自己有没有完成、现在第几名、能拿几分。
     为什么不做成分步向导：老师在教室里只有 30 秒操作时间，一屏填完直接发出去最快。
     数据全靠 task-hx.js（HX.rpc），没有登录就只给登录入口，绝不白屏。 -->
<html lang="zh-CN" data-hx-peanut>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060e">
<title>课堂任务 · 接线仿真</title>
<link rel="stylesheet" href="task.css">
<!-- 全站外观 + 药丸下拉（2026-11-17）：data-hx-peanut 在 <html> 上，选班/选电路/课次这些原生 select
     由 hx-theme.js 换成铝箔药板，原生 select 仍留在 DOM 里负责取值，task.js 一行都不用改。
     ../../hx-theme.js 按线上深度写：本页发布在 /wiring-lab/task/（两层深），站点根是 / ——
     写成 ../hx-theme.js 会解析到 /wiring-lab/hx-theme.js（404），本地预览实测过，别再改回去。
     data-tool="wiring"：这一页正常是从 /wiring-lab/ 外壳（iframe）里点进来的，永远不会触发跳转；
     单独打开（顶层窗口）时和 /wiring-lab/ 一样回总入口 #wiring —— 登录、账号只在总入口。 -->
<script src="../../hx-theme.js" data-tool="wiring"></script>
</head>
<body class="page">
<div class="pg-top">
  <!-- 返回按钮（2026-11-13 用户反馈「点返回就回首页了，想回到上一级」）：
       回「上一级」= 接线仿真主页（/wiring-lab/），见 task.js 里 location.href = HOME。 -->
  <button class="back" id="lvBack" type="button">← 接线仿真</button>
  <h1>课堂任务<small>发布 · 实时进度 · 按排位用时赋分（每节课 +5 分项目）</small></h1>
  <div class="grow"></div>
  <div class="who" id="who"></div>
</div>
<main class="pg-main" id="main"><div class="panel span2"><div class="empty">读取身份…</div></div></main>
<script src="task-hx.js"></script>
<script src="task-lessons.js"></script>
<script src="task.js"></script>
</body>
</html>
