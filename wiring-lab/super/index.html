<!doctype html>
<!-- 超级排位 · 摆放 + 连线两阶段（2026-11-07 第十二批 T1/T2/T3/T4 + Q1～Q6；P4 连线；
     2026-11-08 加题目切换：2.1～2.6 / E1 / E2 八条都能玩，P 只练摆放）
     第一步「摆放」：学生自己按原理图把元器件拖到画布上，摆对了才放开连线。
     第二步「连线」：点两个端子接一根线；点已画的线两次删掉；检查只说还差多少，不说答案。
     顶栏的题目下拉 + 上一题/下一题：切题会清空画布和导线（清单来自 SUPER_CIRCUITS）。
     左侧元器件库 = 顶部浮动工具栏同款卡片（玻璃底、圆角、缩略图在上小字在下），可缩成一颗可拖的圆点；
     库里放**全量**元件（12 种器件、21 种外形，含复合按钮 / 三种时间继电器 / 竖放二极管…），
     不按题过滤 —— 「挑对元件」本身就是要考的一半；挑错形态由摆放校验明确提示。
     右侧上半部是电气原理图（2.2 是这里自绘的示意图，其他题提示对照教材），下半部是待布置/连线画布。
     摆放判定只看种类 + 个数，位置不算；连线判定只看「哪些端子连成了一片」，和摆在哪无关。
     版权和 guard.js 同其它页。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03050b">
<title>超级排位 · 摆元器件</title>
<style>
  /* ★ 这些变量只是「还没换主题时的默认值」，页面启动时会由 super.js 按 theme.js 的 TH/C 整体覆盖一遍
       （见 syncCss），所以换主题时整页跟着换 —— 之前这里写死了一整套深色，主题改了它不动，用户说的
       「背景不受主题控制」就是这一条。 */
  :root { --bg: #03050b; --card: rgba(26,32,56,.82); --ink: #e8ecff; --dim: #8e97bd; --edge: rgba(170,190,255,.16);
    --acc: #7c9cff; --acc2: #b18cff; --ok: #34d399; --bad: #fb7185;
    --tbbg: rgba(26,32,56,.82); --tbbg2: rgba(9,12,24,.88); --tbhov: rgba(124,156,255,.16); --tbsh: rgba(90,120,255,.20);
    /* 主色按钮上的字：四套主题的 --acc 都是饱和色，白字对比度均 ≥ 4.5，所以固定白字 */
    --onacc: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  body { background: var(--bg); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; }
  /* 顶栏：只放标题和这题的说明，不占高度 */
  .top { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 18px 8px;
    border-bottom: 1px solid var(--edge); background: var(--tbbg2); }
  .top h1 { margin: 0; font-size: 17px; letter-spacing: .08em; white-space: nowrap; }
  .top .tsk { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 10px;
    border: 1px solid var(--edge); background: var(--card); white-space: nowrap; }
  /* 题目切换（8 条电路都能玩，P 标注「只练摆放」）：下拉 + 上一题 / 下一题，和顶栏其它徽章同一套观感 */
  .tsel { flex: none; display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--acc) 34%, transparent); background: var(--card); }
  .tsel select { appearance: none; -webkit-appearance: none; border: 0; outline: none; background: transparent;
    color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    padding: 4px 6px 4px 8px; max-width: 216px; }
  .tsel select option { background: var(--tbbg2); color: var(--ink); }
  .tnav { flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0;
    border-radius: 7px; background: transparent; color: var(--acc); font: inherit; font-size: 15px; font-weight: 800;
    cursor: pointer; touch-action: manipulation; }
  .tnav:hover { background: var(--tbhov); }
  .top .sub { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .grow { flex: 1; }
  /* 阶段徽章：第一步「摆放」→ 第二步「连线」（点「开始连线」后切换，见 super.js 的 setPhase） */
  .top .step { flex: none; font-size: 12.5px; font-weight: 800; padding: 4px 10px; border-radius: 10px;
    color: var(--ink); border: 1px solid color-mix(in srgb, var(--acc) 50%, transparent); white-space: nowrap;
    background: linear-gradient(135deg, color-mix(in srgb, var(--acc) 30%, transparent), color-mix(in srgb, var(--acc2) 22%, transparent)); }
  .top .step.two { color: var(--ink); border-color: color-mix(in srgb, var(--ok) 55%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--ok) 30%, transparent), color-mix(in srgb, var(--acc) 22%, transparent)); }
  .top .tag { flex: none; font-size: 11.5px; font-weight: 700; color: var(--acc); padding: 4px 9px; border-radius: 9px;
    border: 1px dashed color-mix(in srgb, var(--acc) 45%, transparent); background: color-mix(in srgb, var(--acc) 10%, transparent); white-space: nowrap; }
  /* 返回练习页（独立页唯一的出口）：做成真按钮，样式跟 tag 同族，但用实线边 + 指针 */
  .top .tag.back { font: inherit; font-size: 11.5px; font-weight: 700; color: var(--dim); cursor: pointer;
    border-style: solid; background: transparent; }
  .top .tag.back:hover { color: var(--ink); border-color: var(--acc); }
  /* 主区：左元器件库 + 右（原理图 / 待布置画布） */
  .wrap { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; }
  /* ── 元器件库：和顶部浮动工具栏同一套观感（玻璃底、圆角 16、图标在上小字在下） ── */
  .tb { flex: none; width: 250px; min-height: 0; display: flex; flex-direction: column; border-radius: 16px;
    background: linear-gradient(180deg, var(--tbbg), var(--tbbg2)); border: 1px solid var(--edge); color: var(--ink);
    box-shadow: 0 18px 40px -16px var(--tbsh), 0 0 0 1px color-mix(in srgb, var(--ink) 4%, transparent) inset;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .tb-hd { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; border-bottom: 1px solid var(--edge); }
  .tb-hd b { font-size: 14px; font-weight: 800; letter-spacing: .02em; }
  .tb-hd .tb-note { flex: 1; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-min { flex: none; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border-radius: 9px;
    border: 1px solid var(--edge); background: transparent; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .tb-min:hover { background: var(--tbhov); }
  .tb-min svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 把画布上的元件拖到左栏上时，整块库亮红边 = 「松手就删」 */
  .tb.del { border-color: color-mix(in srgb, var(--bad) 75%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 35%, transparent), 0 18px 40px -16px var(--tbsh); }
  .tb-list { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 8px;
    padding: 8px 10px 12px; overflow-y: auto; overflow-x: hidden; }
  .grp { grid-column: 1 / -1; font-size: 11px; font-weight: 700; color: var(--dim); letter-spacing: .06em;
    padding: 4px 2px 0; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px 5px; border-radius: 12px;
    border: 1px solid transparent; background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink); font: inherit; cursor: grab;
    touch-action: none; -webkit-tap-highlight-color: transparent; transition: background .16s, border-color .16s, transform .16s; }
  .card:hover { background: var(--tbhov); border-color: var(--edge); }
  .card:active { transform: scale(.96); }
  .card.drag { opacity: .4; }
  /* 缩略图的底是画布自己画的（theme.js 的卡片渐变），所以这里底色透明 —— 换主题时小图跟着换，
     不再是一块固定的浅蓝台面。 */
  .card .thumb { display: block; width: 100%; border-radius: 8px; overflow: hidden; background: transparent; }
  .card .thumb img { display: block; width: 100%; height: auto; }
  .card b { font-size: 12.5px; font-weight: 800; line-height: 1.1; letter-spacing: .02em; }
  .card small { font-size: 10.5px; color: var(--dim); line-height: 1.2; text-align: center; }
  /* 工具栏收成圆钮（照 parallel.html 的 .tb-orb）。
     注意：这三个 body 状态类叫 lib-min，不能叫 tb-min —— 折叠按钮自己的类名就是 .tb-min，
     加到 body 上会让整页套上「28px 方按钮」那套样式（实测整页被压成 28×28、背景变白）。 */
  body.lib-min .tb { display: none; }
  .tb-orb { position: fixed; z-index: 40; left: 0; top: 0; display: none; place-items: center; width: 46px; height: 46px;
    border-radius: 50%; cursor: grab; touch-action: none; opacity: .9; padding: 0;
    background: radial-gradient(circle at 35% 30%, var(--tbbg), var(--tbbg2)); border: 1px solid var(--edge); color: var(--ink);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--acc) 22%, transparent), 0 10px 22px -10px var(--tbsh), 0 0 18px -6px var(--acc);
    transition: opacity .2s, transform .3s cubic-bezier(.34,1.56,.64,1); -webkit-tap-highlight-color: transparent; }
  .tb-orb:hover { opacity: 1; }
  .tb-orb.dragging { transition: none; transform: scale(1.08); cursor: grabbing; }
  .tb-orb svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tb-orb i { position: absolute; right: -2px; top: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--acc);
    box-shadow: 0 0 0 2px var(--bg), 0 0 10px var(--acc); }
  body.lib-min .tb-orb { display: grid; }
  /* 拖拽时跟着手指/鼠标走的那张小图（底图自带，边框和投影用主题令牌） */
  .ghost { position: fixed; z-index: 60; width: 96px; padding: 3px; border-radius: 10px; pointer-events: none;
    background: var(--card); border: 1px solid color-mix(in srgb, var(--acc) 60%, transparent);
    box-shadow: 0 14px 28px -12px var(--tbsh), 0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); opacity: .95; }
  .ghost img { display: block; width: 100%; height: auto; }
  /* ── 右列 ── */
  .right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  /* 原理图卡片整块由 schview.html 用练习页的 glass() 自己画（同一张卡片、同一套主题），这里只是容器 */
  .sch-card { flex: none; height: min(44vh, 430px); display: flex; flex-direction: column; min-height: 210px;
    border-radius: 16px; overflow: hidden; background: transparent; }
  .sch-hd { flex: none; display: flex; align-items: baseline; gap: 10px; padding: 8px 14px 6px; border-bottom: 1px solid var(--edge); }
  .sch-hd b { font-size: 13.5px; font-weight: 800; color: var(--ink); letter-spacing: .04em; }
  .sch-hd span { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sch { flex: 1; min-height: 0; padding: 2px 8px 8px; }
  .sch iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
  /* 不是 2.2 的那些题：原理图在教材上，这里只说清楚（不泄露元件清单） */
  .sch-ph { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 8px 20px 14px; text-align: center; }
  .sch-ph b { font-size: 15px; color: var(--ink); letter-spacing: .04em; }
  .sch-ph em { font-style: normal; font-size: 12.5px; line-height: 1.6; color: var(--dim); max-width: 560px; }
  /* 待布置画布 */
  .stage { position: relative; flex: 1; min-height: 200px; border-radius: 16px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--edge); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .stage-hd { position: absolute; left: 14px; top: 10px; z-index: 2; display: flex; align-items: baseline; gap: 10px; pointer-events: none; }
  .stage-hd b { font-size: 13px; font-weight: 800; color: var(--ink); letter-spacing: .06em; }
  .stage-hd span { font-size: 11.5px; color: var(--dim); }
  .go { position: absolute; right: 16px; bottom: 16px; z-index: 3; height: 44px; padding: 0 22px; border: 0; border-radius: 22px;
    background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--onacc); font-size: 15px; font-weight: 800;
    font-family: inherit; letter-spacing: .04em; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 12px 26px -10px color-mix(in srgb, var(--acc) 75%, transparent); transition: transform .15s, filter .2s; }
  .go:hover { filter: brightness(1.08); }
  .go:active { transform: scale(.96); }
  .go.done { background: linear-gradient(135deg, var(--ok), var(--acc)); box-shadow: 0 12px 26px -10px color-mix(in srgb, var(--ok) 70%, transparent); }
  /* 连线阶段才出现的小工具条（撤销 / 清空），放在画布右上角：不压左上的标题，也不压右下的按钮 */
  .tools { position: absolute; right: 16px; top: 10px; z-index: 3; display: none; gap: 8px; }
  .tools.on { display: flex; }
  .tools button { height: 32px; padding: 0 12px; border-radius: 16px; font: inherit; font-size: 12.5px; font-weight: 700;
    color: var(--ink); background: var(--tbbg2); border: 1px solid var(--edge); cursor: pointer; touch-action: manipulation; }
  .tools button:hover { background: var(--tbhov); }
  .tools button.warn { border-color: color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); }
  /* 状态条：已摆 / 已接 / 接通（数字口径见 super.js 的 updateStat） */
  .stat { position: absolute; left: 14px; bottom: 12px; z-index: 2; max-width: calc(100% - 150px); padding: 5px 10px;
    border-radius: 10px; background: var(--tbbg2); border: 1px solid var(--edge);
    color: var(--dim); font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none; }
  /* 连线阶段把光标换成十字，暗示「点端子」 */
  #c.wire { cursor: crosshair; }
  /* 提示条贴在「我摆好了」上方、靠右对齐：学生刚点完就在眼皮底下看到结果，
     又不挡住画布中间那一大块摆放区（放中间会压住底排的元件）。 */
  .toast { position: absolute; right: 16px; bottom: 72px; z-index: 3; max-width: min(460px, 66%); padding: 10px 16px;
    border-radius: 14px; background: var(--tbbg2); border: 1px solid var(--edge); color: var(--ink);
    font-size: 14px; font-weight: 700; line-height: 1.45; text-align: left; box-shadow: 0 18px 40px -16px var(--tbsh);
    opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.on { opacity: 1; transform: translateY(0); }
  .toast.bad { border-color: color-mix(in srgb, var(--bad) 60%, transparent); color: var(--bad); }
  .toast.ok { border-color: color-mix(in srgb, var(--ok) 60%, transparent); color: var(--ok); }
  /* 窄屏 / 手机：库变成顶上一条横向工具条，原理图和画布上下叠（画布仍然占最大的一块） */
  @media (max-width: 900px) {
    .wrap { flex-direction: column; gap: 8px; padding: 8px; }
    .tb { width: auto; flex: none; max-height: 178px; }
    .tb-list { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); overflow-y: auto; }
    .sch-card { height: 34vh; min-height: 170px; }
    .stage { min-height: 160px; }
    .top .sub, .top .tag:not(.back) { display: none; }
    .top .tsk { display: none; }
    .tsel select { max-width: 136px; font-size: 11.5px; }
    /* 手机竖屏：画布本来就不高，连线工具条 / 状态条 / 提示条都要收一号，别把绘图区挤没了 */
    .tools { right: 8px; top: 8px; gap: 6px; }
    .tools button { height: 28px; padding: 0 9px; font-size: 11.5px; border-radius: 14px; }
    .stat { left: 8px; bottom: 8px; padding: 4px 8px; font-size: 10.5px; max-width: calc(100% - 100px); }
    .go { right: 10px; bottom: 10px; height: 38px; padding: 0 16px; font-size: 13.5px; }
    .toast { right: 8px; bottom: 52px; max-width: 72%; padding: 6px 10px; font-size: 11.5px; line-height: 1.35; }
  }
  /* 再窄一点（手机竖屏）：原理图让一让，把高度留给连线画布 —— 第二步真正要操作的是画布 */
  @media (max-width: 520px) {
    .sch-card { height: 28vh; min-height: 150px; }
    .tb { max-height: 150px; }
    /* 手机竖屏顶栏一共要给「标题 + 题目下拉 + 阶段徽章」留位置，这里逐个数着缩 */
    .top { gap: 6px; padding: 8px 10px 6px; }
    .top h1 { font-size: 14px; letter-spacing: .03em; }
    .tsel { padding: 1px; }
    .tsel select { max-width: 104px; font-size: 11px; padding: 3px 2px 3px 6px; }
    .tnav { width: 20px; height: 22px; font-size: 13px; }
    .top .step { font-size: 11px; padding: 3px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .tb-orb, .card, .go, .toast { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>超级排位</h1>
  <!-- 题目切换：清单来自 SUPER_CIRCUITS（9 条），有标准网表的 8 条可判连线，P 标注「只练摆放」 -->
  <div class="tsel">
    <button class="tnav" id="tPrev" type="button" title="上一题" aria-label="上一题">‹</button>
    <select id="tPick" aria-label="选择题目"></select>
    <button class="tnav" id="tNext" type="button" title="下一题" aria-label="下一题">›</button>
  </div>
  <b class="tsk" id="tsk">2.2 电气互锁正反转</b>
  <b class="step" id="step">第一步：摆放</b>
  <span class="sub" id="sub">照着右边的电气原理图，把元器件拖到下面的画布上摆好</span>
  <span class="grow"></span>
  <!-- 2026-11-08 发布时补的出口：这是独立页（/wiring-lab/super/），从练习页的「排位」旁边点进来，
       在 iframe 里直接换页；没有返回入口就出不去（iframe 里的浏览器后退不可靠）。回到练习页 /wiring-lab/。 -->
  <button class="tag back" id="back" type="button" title="回到练习页">← 练习页</button>
  <span class="tag">不提示位置和数量</span>
</header>
<main class="wrap">
  <!-- 左侧：元器件库（本学期用到的元件；和顶部浮动工具栏同款，可收成圆点） -->
  <aside class="tb" id="tb" role="toolbar" aria-label="元器件库">
    <div class="tb-hd">
      <b>元器件库</b>
      <span class="tb-note">按住卡片拖到右边画布</span>
      <button class="tb-min" id="tbMin" type="button" title="收起元器件库：缩成一个可以拖动的圆钮" aria-label="收起元器件库">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <div class="tb-list" id="lib"></div>
  </aside>
  <!-- 收起后留下的圆钮：可拖到任意位置，位置记在浏览器里；点一下展开 -->
  <button class="tb-orb" id="tbOrb" type="button" aria-expanded="false" title="展开元器件库（按住可拖到任意位置）">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><path d="M9 4v6M15 14v6"/></svg><i></i>
  </button>
  <section class="right">
    <div class="sch-card">
      <div class="sch-hd"><b>电气原理图</b><span id="schT">2.2 三相异步电动机 电气互锁正反转</span></div>
      <div class="sch" id="sch"></div>
    </div>
    <div class="stage" id="stage">
      <canvas id="c"></canvas>
      <div class="stage-hd"><b>待布置区</b><span id="cnt">已摆 0 个元件</span></div>
