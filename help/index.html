<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>使用说明 · 华夏工具</title>
<!-- 主题按 data-tool="help" 分键：这个页面的背景 / 主题色独立存 hx-theme:s:help，和首页、别的工具互不影响。 -->
<script src="../hx-theme.js" data-tool="help"></script>
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --panel2:#f7f9fc; --edge:#e3e8f0; --ink:#1b2333; --dim:#77839a; --faint:#a2adbf;
  --fill:#eef1f6;
  --shadow:0 14px 34px -24px rgba(23,33,58,.5);
}
/* 深浅色跟随主题：hx-theme.js 会在 <html> 上写 data-hx-mode；这里只管背景/面板/文字这些中性色。
   没引到主题时退回系统偏好（:not([data-hx-mode])）。 */
@media (prefers-color-scheme: dark){
  :root:not([data-hx-mode]){ --bg:#0f1420; --panel:#161d2b; --panel2:#1c2536; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
    --fill:rgba(255,255,255,.14);
    --shadow:0 16px 38px -26px rgba(0,0,0,.9); }
}
:root[data-hx-mode="dark"]{ --bg:#0f1420; --panel:#161d2b; --panel2:#1c2536; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
  --fill:rgba(255,255,255,.14);
  --shadow:0 16px 38px -26px rgba(0,0,0,.9); }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.62 "Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.back{flex:none;text-decoration:none;font-size:13.5px;font-weight:700;color:var(--dim);padding:7px 12px;border-radius:10px;
  border:1px solid var(--edge);background:var(--panel)}
.back:hover{color:var(--ink);border-color:var(--acc)}
header.top h1{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
header.top h1 i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;
  background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;font-size:13px;font-weight:900}
main{padding-top:16px;padding-bottom:60px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
/* 分色块说明（.hd 也是卡片：底色跟「卡片通透度」走，用 --card 而不是死透明度） */
.hx-doc p{margin:0 0 8px;font-size:14px;line-height:1.65;color:var(--dim)}
.hx-doc b{color:var(--ink);font-weight:600}
.hx-doc kbd{padding:1px 6px;border-radius:5px;background:var(--fill,#f0f1f4);font-size:12.5px;font-family:inherit;color:var(--ink)}
.hd{position:relative;margin:0 0 12px;padding:13px 16px 12px 18px;border-radius:14px;
  background:color-mix(in srgb,var(--hc,var(--acc)) 8%,var(--card,var(--panel)));
  border:1px solid color-mix(in srgb,var(--hc,var(--acc)) 22%,transparent);
  scroll-margin-top:74px}
.hd::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--hc,var(--acc))}
.hd .hdt{display:block;margin-bottom:6px;font-size:14.5px;font-weight:700;color:var(--hc,var(--acc))}
.hd ul{margin:0;padding-left:17px;font-size:14px;line-height:1.75;color:var(--dim)}
.hd li{margin:3px 0}
.hd .iso{margin:8px 0 0;padding-top:7px;border-top:1px dashed color-mix(in srgb,var(--hc,var(--acc)) 34%,transparent);
  font-size:12.5px;line-height:1.55;color:var(--dim)}
@media (max-width:620px){ .wrap{padding:0 14px} .card{padding:14px} }

/* ── 2026-11-12 重写：目录 + 分区标题 + 角色标 ────────────────────────── */
.doc-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.doc-h h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.doc-h span{font-size:12.5px;color:var(--faint)}
.lead{font-size:14.5px;line-height:1.75;color:var(--dim);margin:6px 0 14px}
.sec{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sec b{font-size:15px;font-weight:800;letter-spacing:.01em}
.sec i{flex:1;height:1px;background:var(--edge);font-style:normal}
.sec em{font-style:normal;font-size:12px;color:var(--faint);font-weight:600}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:8px}
.toc a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;text-decoration:none;
  background:var(--panel);border:1px solid var(--edge);color:var(--ink);font-size:13.5px;font-weight:600;
  transition:border-color .18s,transform .18s}
.toc a:hover{border-color:var(--acc);transform:translateY(-1px)}
.toc a u{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;text-decoration:none;
  font-size:11px;font-weight:800;color:#fff;background:var(--tc,#4f8ce8);font-style:normal}
.toc a s{flex:none;margin-left:auto;text-decoration:none;font-size:11px;color:var(--faint);font-weight:600}
.hd .role{display:inline-block;margin-left:8px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;
  vertical-align:1px;background:color-mix(in srgb,var(--hc) 16%,transparent);color:var(--hc)}
.hd .why{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--dim)}
.hd .why b{color:var(--ink)}
.hd .steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.hd .steps li{counter-increment:s;position:relative;padding-left:24px;margin:4px 0}
.hd .steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;
  display:grid;place-items:center;font-size:10.5px;font-weight:800;
  background:color-mix(in srgb,var(--hc) 18%,transparent);color:var(--hc)}
.got{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.got span{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--panel2);border:1px solid var(--edge);color:var(--dim)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="../" target="_top">← 回首页</a>
  <h1><i>?</i>使用说明</h1>
</div></header>

<main class="wrap">
  <div class="card hx-doc" id="doc"><p style="color:var(--dim)">正在加载…</p></div>
</main>

<script>
(function () {
  'use strict';
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  /* hd(颜色, 标题, 内容, 注意行, 锚点 id, 角色标) */
  function hd(c,title,body,iso,anchor,role){
    return '<div class="hd" style="--hc:'+c+'"'+(anchor?' id="'+anchor+'"':'')+'><b class="hdt">'+title
      + (role?'<span class="role">'+role+'</span>':'') + '</b>'+body
      + (iso?'<p class="iso">'+iso+'</p>':'')+'</div>';
  }
  function sec(t,en){ return '<div class="sec"><b>'+t+'</b><i></i>'+(en?'<em>'+en+'</em>':'')+'</div>'; }
  function toc(items){
    return '<div class="toc">'+items.map(function(x){
      return '<a href="#'+x[0]+'"><u style="--tc:'+x[2]+'">'+x[3]+'</u>'+x[1]+'<s>→</s></a>';
    }).join('')+'</div>';
  }

  /* ============================================================
     教师 / 管理员版
     ============================================================ */
  function helpDocTeacher(){
    var TOC = toc([
      ['a-account','账号与登录','#4f8ce8','A'],
      ['a-home','首页与外观','#8a6fd0','B'],
      ['a-class','班级与名单','#e0a15a','C'],
      ['a-subject','科目','#5ad16f','D'],
      ['a-wiring','接线仿真','#ff9f43','1'],
      ['a-quiz','刷题','#5ad16f','2'],
      ['a-base','进制转换','#3ad6c6','3'],
      ['a-mcu','单片机上机','#3aa8d8','4'],
      ['a-exam','考试','#7d7aff','5'],
      ['a-kaoqin','考勤','#34d399','6'],
      ['a-ziliao','资料库','#a3e635','7'],
      ['a-paike','排课','#ff6b6b','8'],
      ['a-jiafen','小组加分','#d97ea3','9'],
      ['a-course','课程进度','#ffd166','10'],
      ['a-ai','AI 设置','#0891b2','11'],
      ['a-misc','备份 / 音乐 / 反馈','#9aa0a8','12'],
      ['a-student','学生端能做什么','#7c9cff','S'],
      ['a-faq','常见问题','#c99a3a','?']
    ]);

    return '<div class="doc-h"><h2>华夏工具 · 教师使用说明</h2><span>2026-11-12 全量更新 · 覆盖 14 个模块</span></div>'
      + '<p class="lead">华夏工具是一套给中职电气课用的网页工具集：<b>接线仿真、刷题、进制转换、单片机上机、考试、考勤、资料库、排课、小组加分、课程进度</b>十件事各占一个工具，数据各自独立、互不通用。<b>账号、班级、科目、外观是全站共用的</b>。下面按「先共用的四块，再逐个工具」讲，每个模块都写了面向谁、怎么用、要注意什么。</p>'
      + '<div class="got"><span>共 10 个教学工具</span><span>4 块全站共用设置</span><span>教师 / 管理员 / 开发者三档权限</span><span>深浅色 + 极简/标准模式</span></div>'
      + sec('目录 · 点击直达','共 18 节')
      + TOC

      + sec('一、全站共用','账号 / 首页 / 班级 / 科目')
      + hd('#4f8ce8','A · 账号与登录',
        '<p class="why">华夏工具的<b>所有数据都存在云端、绑在账号上</b>：换电脑、换浏览器，登录同一个账号就全都在。</p>'
        + '<ul>'
        + '<li>教师账号要<b>邀请码</b>才能注册：首页「登录 / 注册」→ 注册 → 填邀请码 → 账号名建议填工号 → 设密码。管理员 / 开发者也能发教师码。</li>'
        + '<li>也可以用 <b>GitHub 登录</b>；同一个账号可以再设账号名和密码，几种方式进的是同一份数据。</li>'
        + '<li><b>学生不用注册</b>：你导入名单时就批量开好了，<b>账号是学号、密码也是学号</b>。</li>'
        + '<li>右上角头像 → 账号面板：改头像（直接点那张图上传）、改资料、切换这台设备上登录过的账号、退出。</li>'
        + '</ul>','身份分三档：教师（默认）、管理员（多一个「排课」）、开发者（再多「音乐」「反馈」）。三档看到的卡片不一样，没权限的卡片压根不显示。','a-account','所有人')

      + hd('#8a6fd0','B · 首页与外观',
        '<p class="why">首页按<b>学习 / 教学 / 维护</b>三组排卡片，点卡片进工具，左上角「返回」回首页（手机返回键也是「上一步」）。</p>'
        + '<ul>'
        + '<li><b>顶栏</b>：左边是品牌名和开发者名单（赵成乾 · 宋耀龙 · 黄子欣 合作开发），右边是外观按钮、同步状态、账号。<b>开发者名单只在首页显示</b>，进工具后自动收起，不占地方。</li>'
        + '<li>右上角<b>外观</b>面板：<b>模式</b>两档 —— <b>极简</b>（默认，关掉氛围动效和光效，老机器不发烫）/ <b>标准</b>（全部特效打开）；<b>深浅</b>两档 —— 浅色 / 深色；再加主色、背景图、界面透明度、校徽水印。</li>'
        + '<li>外观<b>跟着账号走</b>：你在这台电脑调好的主题、背景、透明度，换一台电脑登录同一账号会自动带过去，不会被别人账号的设置覆盖。</li>'
        + '<li><b>极简模式</b>下：氛围像素动效、背景动效、光晕全部不显示，但<b>排位的开场/结尾特效会保留</b>（那是仪式感，不是装饰）。</li>'
        + '</ul>','极简模式 ≠ 降级功能：所有工具、按钮、计分逻辑一模一样，只是不跑动画。学校一体机建议就用极简。','a-home','所有人')

      + hd('#e0a15a','C · 班级与名单',
        '<p class="why">班级是<b>全站名单的唯一来源</b>：班级里加了人，单片机、考勤、小组加分自动跟上，不用各导一遍。</p>'
        + '<ul>'
        + '<li>「管理 → 班级」→ 导入考勤表（<kbd>.xls</kbd> / <kbd>.xlsx</kbd> / <kbd>.csv</kbd>，必须有<b>学号、姓名</b>两列）：一个文件一个班，可以一次选多个文件。</li>'
        + '<li>导入完账号就有了（会提示「新开号 N 个」）；老班可以点<b>一键开号 N</b> 补开。</li>'
        + '<li>每个班一排开关：<b>接线仿真 / 刷题 / 单片机 / 考试 / 小组加分</b>（考勤是每个班必备，不参与开关）。点亮哪个，这个班才在哪个工具里出现。</li>'
        + '<li><b>收起</b> = 本学期不用了，数据一条不删，随时「恢复使用」。</li>'
        + '<li><b>归档</b>（2026-11-12 新增）：把一个班从所有工具里移走，但<b>学生和成绩一条不删</b>，在「已归档（N）」里随时点「恢复」。<b>带完的班用归档，不要用删除。</b></li>'
        + '<li><b>移交</b>（2026-11-12 新增）：生成一个<b>一次性移交码</b>，对方老师在首页点「接收移交」填码，这个班（含名单和成绩）就转到他名下。码用一次就失效。</li>'
        + '<li><b>课堂码</b>一般不用发了（学生直接学号登录）。需要时在班级那行点「发课堂码」，<b>4 小时有效</b>，可分享可撤销。学生忘了密码，用首页的重置功能按学号重置。</li>'
        + '</ul>','「归档」和「收起」的区别：收起只是不在工具里出现、名单还在选班列表里；归档是整班移走、要专门去「已归档」里找回来。','a-class','教师')

      + hd('#5ad16f','D · 科目：一处建，处处用',
        '<p class="why">科目是<b>资料库 / 考试 / 考勤 / 刷题</b>共用的一个维度，<b>只在首页建</b>。</p>'
        + '<ul>'
        + '<li>「管理 → 科目」→ 右上角「＋ 新建科目」，填名字即可。建完会<b>顺手在刷题里建一个同名空题库</b>，学生马上能刷到。</li>'
        + '<li>之后去「资料库」上传教材、出题，再「发布到刷题」把题库填满。</li>'
        + '<li><b>改名</b>不影响资料和题；<b>删除</b>会连这个科目下的资料（含上传的文件）和题池一起删掉，已经发布到刷题的题不受影响。</li>'
        + '<li>科目<b>按账号分开</b>：你建的只有你看得到、选得到。</li>'
        + '</ul>','工具里看到的科目一律是只读的，没有「新建」按钮 —— 要建科目回首页，这是为了避免同一科目出现两份。','a-subject','教师')

      + sec('二、工具逐个','10 个工具，按首页顺序')
      + hd('#d68a4a','1 · 接线仿真',
        '<p class="why">最大的一个工具：电路练习 + 排位赛 + 课堂教学闭环。<b>独立站点 <kbd>/wiring-lab/</kbd></b>，数据与其它工具不互通。</p>'
        + '<ul>'
        + '<li><b>做题</b>：顶部 <kbd>2.1</kbd>～<kbd>2.6</kbd> 是主电路，<b>按住题号条左右拖</b>能滑到最后；右边箭头收起题号条，把高度让给电路。</li>'
        + '<li><b>接线</b>：点两个端子连一根线。工具栏有<b>提示（关 / 自由 / 顺序）</b>、撤销、清空、检查、答案。顺序提示会按教材顺序逐根指出下一根接哪里。</li>'
        + '<li><b>扩展练习</b>：电工证类题（E1 双重联锁正反转启动能耗制动、E2 C6140T 车床）；<b>并联专项（P）</b>是独立小题，专练「并到哪个点」。</li>'
        + '<li><b>普通排位</b>：选电路和学生 → 计时接线 → 全对自动停表 → 成绩进排行榜。教师还能在里面<b>随机抽人</b>（按当前班级抽，不重复）。</li>'
        + '<li><b>超级排位</b>：排位面板里选手卡右边那颗按钮。分两步 —— <b>先摆元器件</b>（照原理图把元件拖到画布，只看种类和个数，摆在哪不算），<b>再连线</b>。顶栏能切 2.1～2.6 / E1 / E2 八条题。</li>'
        + '<li><b>课堂任务</b>（教师）：发布一道题 → 学生在自己机器上做 → 大屏实时看进度 → 结束时按完成情况冻结分数，写进「小组加分」的<b>线上连线排位</b>列，自动计入个人平时分。</li>'
        + '<li><b>身份卡</b>：排位榜上的名字卡可以换成自己的背景图 —— 12 套预设 + 自己上传，<b>四种卡型（冠军 / 亚军 / 季军 / 常规）各存一组位置和缩放</b>，60%～300% 自由调，弹窗里 2×2 同屏预览。背景<b>存在账号上</b>，换设备跟着走。</li>'
        + '<li><b>教学视频 / 本节内容 / 元器件 / 符号 / 更新日志 / 关于</b>都在顶栏；窄屏只显示图标，长按出提示。手机支持双指放大（最多 4 倍），放大后照样点端子。</li>'
        + '</ul>','课堂任务结束后分「当前任务 / 历史任务」两区：冻结的任务进历史，点「看这份」可以回看当时的名单和进度，看完点「退出查看」回到当前。','a-wiring','所有人')

      + hd('#5ad16f','2 · 刷题',
        '<p class="why">学生练题、看掌握度、上排行榜的地方。<b>登录后才计分</b>，老师不上榜。</p>'
        + '<ul>'
        + '<li><b>选科目</b>：顶部切科目（内置电气接线原理、教育心理学、教育学，加上你在首页建的科目）。</li>'

  function render(t){
    var doc = document.getElementById('doc');
    doc.innerHTML = (t === 'student' ? helpDocStudent() : helpDocTeacher());
    /* 目录是页内锚点：默认跳转会被 sticky 顶栏盖住一截，这里补一次滚动偏移 */
    doc.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;
      e.preventDefault();
      var y = el.getBoundingClientRect().top + window.pageYOffset - 72;
      window.scrollTo({ top: y < 0 ? 0 : y, behavior: 'smooth' });
      try { history.replaceState(null, '', a.getAttribute('href')); } catch (err) { }
    });
  }
  /* 按登录身份自动判：教师 / 管理员 / 开发者看老师版，其余（学生、未登录）看学生版。
     身份从总入口的 HXPortal.me() 拿（teacher/admin/dev 字段）；嵌在 iframe 里时走 window.top.HXPortal，
     被单独打开时读不到就退回学生版（不会把老师版露给任何人）。 */
  var t = 'student';
  try {
    var p = (window.HXTheme && HXTheme.portal && HXTheme.portal()) || (window.top !== window && window.top.HXPortal);
    var m = p && p.me ? p.me() : null;
    if (m && (m.teacher || m.admin || m.dev)) t = 'teacher';
  } catch (e) { }
  render(t);
})();
</script>
