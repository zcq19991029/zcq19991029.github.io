<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>使用说明 · 华夏工具</title>
<!-- 主题按 data-tool="help" 分键：这个页面的背景 / 主题色独立存 hx-theme:s:help，和首页、别的工具互不影响。 -->
<script src="../hx-theme.js" data-tool="help"></script>
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --panel2:#f7f9fc; --edge:#e3e8f0; --ink:#1b2333; --dim:#77839a; --faint:#a2adbf;
  --shadow:0 14px 34px -24px rgba(23,33,58,.5);
}
/* 深浅色跟随主题：hx-theme.js 会在 <html> 上写 data-hx-mode；这里只管背景/面板/文字这些中性色。
   没引到主题时退回系统偏好（:not([data-hx-mode])）。 */
@media (prefers-color-scheme: dark){
  :root:not([data-hx-mode]){ --bg:#0f1420; --panel:#161d2b; --panel2:#1c2536; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
    --shadow:0 16px 38px -26px rgba(0,0,0,.9); }
}
:root[data-hx-mode="dark"]{ --bg:#0f1420; --panel:#161d2b; --panel2:#1c2536; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
  --shadow:0 16px 38px -26px rgba(0,0,0,.9); }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.62 "Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.back{flex:none;text-decoration:none;font-size:13.5px;font-weight:700;color:var(--dim);padding:7px 12px;border-radius:10px;
  border:1px solid var(--edge);background:var(--panel)}
.back:hover{color:var(--ink);border-color:var(--acc)}
header.top h1{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
header.top h1 i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;
  background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;font-size:13px;font-weight:900}
main{padding-top:16px;padding-bottom:60px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
/* 分色块说明（.hd 也是卡片：底色跟「卡片通透度」走，用 --card 而不是死透明度） */
.hx-doc p{margin:0 0 8px;font-size:14px;line-height:1.65;color:var(--dim)}
.hx-doc b{color:var(--ink);font-weight:600}
.hx-doc kbd{padding:1px 6px;border-radius:5px;background:var(--fill,#f0f1f4);font-size:12.5px;font-family:inherit;color:var(--ink)}
.hd{position:relative;margin:0 0 12px;padding:13px 16px 12px 18px;border-radius:14px;
  background:color-mix(in srgb,var(--hc,var(--acc)) 8%,var(--card,var(--panel)));
  border:1px solid color-mix(in srgb,var(--hc,var(--acc)) 22%,transparent)}
.hd::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--hc,var(--acc))}
.hd .hdt{display:block;margin-bottom:6px;font-size:14.5px;font-weight:700;color:var(--hc,var(--acc))}
.hd ul{margin:0;padding-left:17px;font-size:14px;line-height:1.75;color:var(--dim)}
.hd li{margin:3px 0}
.hd .iso{margin:8px 0 0;padding-top:7px;border-top:1px dashed color-mix(in srgb,var(--hc,var(--acc)) 34%,transparent);
  font-size:12.5px;line-height:1.55;color:var(--dim)}
@media (max-width:620px){ .wrap{padding:0 14px} .card{padding:14px} }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="../" target="_top">← 回首页</a>
  <h1><i>?</i>使用说明</h1>
</div></header>

<main class="wrap">
  <div class="card hx-doc" id="doc"><p style="color:var(--dim)">正在加载…</p></div>
</main>

<script>
(function () {
  'use strict';
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function hd(c,title,body,iso){
    return '<div class="hd" style="--hc:'+c+'"><b class="hdt">'+title+'</b>'+body+(iso?'<p class="iso">'+iso+'</p>':'')+'</div>';
  }

  function helpDocTeacher(){
    return '<p style="margin:0 0 12px;color:var(--dim)">这份说明按现在的功能写，<b>会持续更新</b>；发现哪一步对不上，用工具「关于」里的「提建议」告诉我们。每个工具的数据各自独立、互不通用。</p>'
      + hd('#4f8ce8','账号与登录','<ul>'
      + '<li>教师账号要<b>邀请码</b>才能注册：首页「登录 / 注册」→ 注册 → 填邀请码 → 账号名填工号、设密码。管理员 / 开发者也能发教师码。</li>'
      + '<li>也可以用 <b>GitHub 登录</b>；同一个账号可以再设一个账号名和密码，几种方式进的是同一份数据。</li>'
      + '<li><b>学生不用注册</b>：你导入考勤表的时候就批量开好了，<b>账号是学号、密码也是学号</b>。已经自己注册过的学生不受影响。</li>'
      + '<li>右上角头像 → 账号面板：改头像（含像素头像库）、改资料、切换这台设备上登录过的账号、退出登录。</li>'
      + '</ul>')
      + hd('#8a6fd0','首页：分组、班级、外观','<ul>'
      + '<li>卡片按<b>学习 / 教学 / 维护</b>三组排。点卡片进入工具，左上角「返回」回首页；手机返回键同样是「上一步」。</li>'
      + '<li>右上角那颗<b>外观</b>按钮：深浅色、主色、背景图、透明度、校徽水印开关，设置跟着账号走。</li>'
      + '<li>「管理」区里的<b>班级</b>卡片管名单和课堂码：导入考勤表（<kbd>.xls</kbd> / <kbd>.xlsx</kbd> / <kbd>.csv</kbd>，要有<b>学号、姓名</b>两列）、一个文件一个班、可一次选多个。</li>'
      + '<li>导入完账号就有了（提示里写「新开号 N 个」）；老班可以点<b>一键开号 N</b>。每个班四个开关（接线仿真 / 单片机 / 考试 / 小组加分），点亮哪个，这个班才在哪个工具里出现。</li>'
      + '<li>带完的班点<b>收起</b>，数据一条不删，随时「恢复使用」；带完的班不要删。</li>'
      + '<li><b>课堂码</b>一般不用发了（学生直接学号登录）。需要时在班级卡片那行点「发课堂码」，<b>4 小时有效</b>，可以分享或撤销；学生忘了密码用首页的重置功能按学号重置。</li>'
      + '</ul>')
      + hd('#5ad16f','科目：一处建，处处用','<ul>'
      + '<li><b>科目只在首页建</b>：「管理 → 科目」→ 右上角「＋ 新建科目」，填个名字就行。考试、资料库、考勤、刷题里的科目都从这儿来，那几处只看不改。</li>'
      + '<li>建完会<b>顺手在刷题里建一个同名空题库</b>，学生马上能刷到；之后到「资料库」出题、发布到刷题把它填满。</li>'
      + '<li><b>改名</b>不影响资料和题；<b>删除</b>会连这个科目下的资料（含上传的文件）和题池一起删掉，已经发布到刷题的题不受影响。</li>'
      + '<li>科目<b>按账号分开</b>：你建的只有你看得到、选得到，别的老师看不到你的科目。</li>'
      + '</ul>','科目是资料库 / 考试 / 考勤 / 刷题共用的一个维度：建一次，四个工具都能选到。')
      + hd('#43a06e','接线仿真','<ul>'
      + '<li>顶部 <kbd>2.1</kbd>～<kbd>2.6</kbd> 是主电路，<b>按住题号条左右拖</b>可以滑到最后；右边箭头能把整排收起，把高度让给电路。</li>'
      + '<li>顶栏还有：<b>排位</b>、<b>本节内容</b>、<b>教学视频</b>、<b>元器件</b>、<b>符号</b>、<b>扩展练习</b>、<b>更新日志</b>、<b>关于</b>、<b>全屏</b>。窄屏只显示图标，长按有文字提示。</li>'
      + '<li>点两个端子连一根线；工具栏有<b>提示</b>（关 / 自由 / 顺序）、撤销、清空、检查、答案。顺序提示会按教材顺序逐根指出下一根接哪里。</li>'
      + '<li><b>排位</b>：选电路和学生开始，计时接线，全对自动停表，成绩进排行榜；教师在里面还能<b>随机抽人</b>（按当前班级抽，不重复），抽到谁由你决定怎么用。</li>'
      + '<li><b>教学视频</b>：按节播放（2.1～2.6 已陆续做完），关窗口自动暂停。</li>'
      + '<li><b>扩展练习</b>：电工证类题（E1 双重联锁正反转启动能耗制动、E2 C6140T 车床），从「扩展练习」窗口打开；<b>并联专项</b>（P）是独立一套小题，专练「并到哪个点」。</li>'
      + '<li>手机支持双指放大（最多 4 倍），放大后照样点端子、按按钮；「超级排位」（先摆元件再连线）还在做，入口做好后会写在这里。</li>'
      + '</ul>','本工具成绩与排位独立，和刷题、考试、单片机互不通用。')
      + hd('#d68a4a','刷题','<ul>'
      + '<li>顶部切换<b>科目</b>：内置电气接线原理、教育心理学、教育学，加上你在首页建的科目（见上面「科目」那块）。</li>'
      + '<li>顶部的「<b>＋ 新建科目</b>」是给自己用的：导入自己的资料、自己刷，<b>只存在这台电脑上</b>，换电脑就没了，也不进排行榜。要给全班用的科目请回首页建。</li>'
      + '<li>按<b>题型 × 范围</b>（待掌握 / 错题 / 未做 / 已做 / 已记住）× 顺序或随机刷；单选、判断点一下就判，多选选完提交。题卡还能左滑「记住了」、右滑「再练」。</li>'
      + '<li><b>概览</b>看掌握度、各题型进度、正确率和错题列表；<b>排行</b>按答对的不同题数记分，可切「我的班」。</li>'
      + '<li><b>导入题库</b>走 AI：识题（PDF / Word / TXT / Markdown 里拆题）或出题两套提示词，图片走视觉模型。没有文件模板。</li>'
      + '<li>题库页最下面可以「说人话让 AI 帮你写学习卡」，不用手写 JSON；自己的科目还能「发布给学生」（不发布就只有自己刷）。</li>'
      + '</ul>','题库和刷题记录独立，与考试、接线仿真的数据不互通。')
      + hd('#2fa8b8','进制转换','<ul>'
      + '<li>课堂演示用：进制学习、实操教程、8421 拼数小花园三个入口。纯本地，不登录也能用，不记成绩。</li>'
      + '</ul>','纯本地演示、不记成绩，和别的工具零数据往来。')
      + hd('#3aa8d8','单片机上机','<ul>'
      + '<li>名单<b>不在这里导入</b>：全部来自首页「班级」的共享名单，首页加人、改名这里自动跟上。</li>'
      + '<li>老师菜单只有<b>班级名单</b>和<b>导入书上代码</b>；在班级名单页勾「上课的班级」（只记这台电脑），并把<b>查看答案密码</b>设好——<b>4 小时自动失效</b>，也可以立刻撤销。</li>'
      + '<li>学生做「平时练习」和「考试」取题；网页版有练习记录和耗时榜，用时由服务器计算，学生只报做的是哪道题、得了多少分。</li>'
      + '</ul>','名单来自首页班级（共享），练习/考试成绩只记在本工具。')
      + hd('#7d7aff','考试','<ul>'
      + '<li>教师侧栏两页：<b>考试</b>、<b>理论试卷</b>（教师账号登录自动进，学生看不到这两页）。</li>'
      + '<li><b>考试</b>页点「发布电子试卷」：从资料库题池勾题 → 填标题 / 科目 / 考试码（留空自动生成 6 位）→ 勾哪几个班 → 发布。把考试码公布给学生，学生输码 + 学号就能取到题，直接在网页里作答交卷，收卷前可以重交。</li>'
      + '<li>学生交卷后，在同一个页面点「交卷与批改」看答卷、批改、导出成绩；「预览」可以先自己走一遍学生的流程。</li>'
      + '<li><b>理论试卷</b>页：按题型比重从题池抽题，排成 A3 横向两栏双面卷，<b>每道题都能点着换</b>；导出 PDF / Word 试卷 / Word 参考答案，四档缩放（适应宽度 / 100% / 75% / 50%）。</li>'
      + '<li><b>试卷库</b>走云端：存好的卷子换电脑登录同一账号还在。</li>'
      + '</ul>','题目来自资料库的题池；考试数据与刷题、接线仿真不互通，学生只凭码取题、看不到批改。')
      + hd('#34d399','考勤','<ul>'
      + '<li>先按<b>科目 + 班级</b>建一门考勤课程（科目在首页建，合班在首页「班级」里绑）。</li>'
      + '<li>上课时点<b>发布考勤</b>：可以只发分享码、放大屏<b>动态二维码</b>（每隔几秒变一次，拍照转发没用）、或让学生划<b>九宫格手势</b>；还能限定<b>位置范围</b>，人不在教室签不上。</li>'
      + '<li>大屏实时显示<b>已到 / 未到</b>人数；学生在自己手机上签到，一台设备只能签一个人。</li>'
      + '<li>课后可以<b>手动改任意一格</b>（请假、迟到），每次改动都留日志；考勤表按原件版式预览，可导出 Excel / PDF。</li>'
      + '</ul>','名单来自首页「班级」（共享），考勤记录只在本工具。')
      + hd('#a3e635','资料库','<ul>'
      + '<li>按科目管资料：上传 <kbd>PDF</kbd> / <kbd>Word</kbd> / <kbd>TXT</kbd> / <kbd>Markdown</kbd> / <kbd>图片</kbd>，自动识别文字、切段入库，随时能看原文或删掉。</li>'
      + '<li><b>AI 出题</b>：在上面的资料列表里勾几份 → 设题型数量、难度、范围、思考程度、额外要求 → 出题 → 预览（没过的题会写原因）→ 进题池。</li>'
      + '<li>进题池时<b>自动去重</b>：题干一字不差的重复题直接拦下，不会灌一堆一样的题。</li>'
      + '<li><b>题池</b>里可以逐题改 / 删 / 清空；还有一颗「<b>AI 查重</b>」按钮，把换个说法、意思一样的题也找出来，勾选后一次删掉。</li>'
      + '<li>审好的题勾上 → <b>发布到刷题</b>：按题 id 和「题型 + 题干」去重，题库里已有的题原样不动。考试组卷、理论试卷也从这里取题。</li>'
      + '</ul>','资料和题池按科目存在云端；发布到刷题之后，那部分题就归刷题题库了。')
      + hd('#e06a6a','排课','<ul>'
      + '<li>月课表一列一个周一、一行一间教室；可切列表视图，整月或单周重排、换人、互换、锁定、停课、冲突提示。</li>'
      + '<li>右侧是「第 N 轮还没排」的待分配名单；名片可以直接拖进课表、课表里互拖 = 互换（触屏长按 0.3 秒再拖）。</li>'
      + '<li><b>老师与分配</b>、<b>班级与教室</b>、<b>统计</b>三个页签管规则和课时；导出有正式版 Excel、含轮次课时版、课表 / 列表 PNG。按 Ctrl+Alt+P 是排课偏好（只有排课人看得到）。</li>'
      + '<li>改动 1.2 秒后自动上云，多台设备用版本号核对，不会互相覆盖；冲突时选「用本机 / 用云端」，不会静默覆盖。</li>'
      + '</ul>','一个账号一份课表，老师之间互相看不见，和别的工具不互通。')
      + hd('#d97ea3','小组加分','<ul>'
      + '<li>班级和名单同样来自首页「班级」（点亮「小组加分」的班才出现）。先确认分组 → <b>新开一课</b>（日期、本节任务、值日组）→ 上课记分。</li>'
      + '<li>课堂小组合计 = <b>首个正确 + 小组分 + 值日分 − 手机未入袋次数</b>；点错了可以撤销（最多 60 步），右键 / 长按返还个人扣分。</li>'
      + '<li><b>组内个人评分</b>：10 个自定义项目，每项 0～5 分，独立小计 + 签名；项目分自动计入个人总分。</li>'
      + '<li><b>学期总分</b>把项目完成率和考勤（学期 9 分）合并算平时分，再折算总评；<b>成绩登分册</b>可导出 Excel / PDF。</li>'

      + '</ul>','分数只在本工具，学生端只读，和别的工具不互通。')
      + hd('#c99a3a','课程进度','<ul>'
      + '<li>首页是本周课表；另有按日期查课、进度总览、实际记录（可导出 CSV / 打印）、调课管理。</li>'
      + '<li>课表和教学进度可以用 Excel / CSV / Markdown / DOCX / PDF 统一导入，四步走完，提交前自动下载备份。</li>'
      + '<li>一个账号一份数据，老师之间互相看不见；学生用不了。</li>'
      + '</ul>','一个账号一份数据，学生用不了，和别的工具不互通。')

  function render(t){
    var doc = document.getElementById('doc');
    doc.innerHTML = (t === 'student' ? helpDocStudent() : helpDocTeacher());
  }
  /* 按登录身份自动判：教师 / 管理员 / 开发者看老师版，其余（学生、未登录）看学生版。
     身份从总入口的 HXPortal.me() 拿（teacher/admin/dev 字段）；嵌在 iframe 里时走 window.top.HXPortal，
     被单独打开时读不到就退回学生版（不会把老师版露给任何人）。 */
  var t = 'student';
  try {
    var p = (window.HXTheme && HXTheme.portal && HXTheme.portal()) || (window.top !== window && window.top.HXPortal);
    var m = p && p.me ? p.me() : null;
    if (m && (m.teacher || m.admin || m.dev)) t = 'teacher';
  } catch (e) { }
  render(t);
})();
