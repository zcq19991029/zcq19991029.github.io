<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>使用说明 · 华夏工具</title>
<!-- 主题按 data-tool="help" 分键：这个页面的背景 / 主题色独立存 hx-theme:s:help，和首页、别的工具互不影响。 -->
<script src="../hx-theme.js" data-tool="help"></script>
<style>
:root{
  /* 浅色底跟全站标准底色走（hx-theme.js 的 --hx-page = #f5f5f7）；没引到主题时退回 #f4f6fa。
     2026-11-17：浅色底全站统一。下面 :root[data-hx-mode="dark"] 那段（深色）不动。 */
  --bg:var(--hx-page,#f4f6fa); --panel:#fff; --panel2:#f7f9fc; --edge:#e3e8f0; --ink:#1b2333; --dim:#77839a; --faint:#a2adbf;
  --fill:#eef1f6;
  --shadow:0 14px 34px -24px rgba(23,33,58,.5);
}
/* 深浅色跟随主题：hx-theme.js 会在 <html> 上写 data-hx-mode；这里只管背景/面板/文字这些中性色。
   没引到主题时退回系统偏好（:not([data-hx-mode])）。 */
@media (prefers-color-scheme: dark){
  :root:not([data-hx-mode]){ --bg:#0f1420; --panel:#161d2b; --panel2:#1c2536; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
    --fill:rgba(255,255,255,.14);
    --card: rgb(22 29 43 / var(--hx-a, 1));
    /* 同下面 :root[data-hx-mode="dark"] 那条：文档页玻璃用白雾，不用黑纱（否则壁纸暗部全丢） */
    --glass-card: rgb(255 255 255 / calc(var(--hx-a, 1) * .12));
    --card2: rgb(12 15 20 / calc(var(--hx-a, 1) * .34));
    --shadow:0 16px 38px -26px rgba(0,0,0,.9); }
}
:root[data-hx-mode="dark"]{ --bg:#0f1420; --panel:#161d2b; --panel2:#1c2536; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
  --fill:rgba(255,255,255,.14);
  --shadow:0 16px 38px -26px rgba(0,0,0,.9); }
/* ── 本页的「卡片」底色：必须乘 --hx-a，否则「卡片通透度」滑杆对本页完全无效 ──
   2026-11-16 用户报障：「背景完全又不透明了　卡片也改不了　没反应」。
   根因不是壁纸丢了（body 是透明的、壁纸层在画），而是本页把卡片 alpha 写死成 .62 / .56：
   ① 从来没乘过 --hx-a（外观面板那根滑杆写的变量），拖到 0 或 150 都一模一样；
   ② `.hd` 那几十个分区用的是 var(--card, var(--panel))，而 --card 只在 hx-theme.css 里定义，
      本页没引那份 CSS → 每次 fallback 成 --panel，铁板一块实色。
   这里就地补一份 --card，配方与 hx-theme.css 同源：alpha = 基础值 × --hx-a
   （100 → ×1 原样；0 → ×2 被浏览器钳到 1 变实色；150 → ×0.5 更透）。
   ★ 定义在 :root 而不是 html.hx-bg 上：2026-11-15 用户定的口径是「通透度管卡片本身，
     跟有没有壁纸无关」。只挂 hx-bg 的话，背景选「无」时拖滑杆还是毫无反应（正是这次的报障）。 */
:root{
  /* --card：无壁纸时的卡片底 —— 默认（通透度 100 = --hx-a 1）就是实色，跟以前一模一样；
     往「更透」拖才会真的透出来。公式与 hx-theme.css 一致，别自己发明。 */
  --card: rgb(255 255 255 / var(--hx-a, 1));
  /* --glass-card：有壁纸时的玻璃底，基础浓度 .62 再乘 --hx-a */
  --glass-card: rgb(255 255 255 / calc(var(--hx-a, 1) * .62));
  --card2: rgb(255 255 255 / calc(var(--hx-a, 1) * .42));
}
:root[data-hx-mode="dark"]{
  --card: rgb(22 29 43 / var(--hx-a, 1));
  /* 2026-11-17 用户定（原话「还是模糊的」+ 截图）：深色玻璃原来是 rgb(12 15 20 / a) —— **在加黑**。
     深色壁纸（尤其本身偏暗的照片）上再压一层黑，暗部细节直接没了，观感就是「背景一片糊」。
     实测对照（同一页、只换这一个属性）：加黑 → 卡片里只剩色块；换成极淡白雾 → 猫的眼睛、
     睫毛、发丝全部回来了，而文字对比度几乎没变。所以文档页的玻璃改成「白雾」而不是「黑纱」。
     公式：白 × (--hx-a × .12)。--hx-a 语义不变（100→1、0→2、150→0.5），
     即 150（最透）→ .06，100（默认）→ .12，0（最实）→ .24。
     ★ 只给文档页（本页 / AI 设置）用白雾。功能页（刷题、排课、考勤那些）卡片密、文字多，
       仍用 hx-theme.css 的加黑配方保可读性 —— 别顺手把那边也改了。 */
  --glass-card: rgb(255 255 255 / calc(var(--hx-a, 1) * .12));
  --card2: rgb(12 15 20 / calc(var(--hx-a, 1) * .34));
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.62 "Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
header.top h1{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
header.top h1 i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;
  background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;font-size:13px;font-weight:900}
main{padding-top:16px;padding-bottom:60px}
.card{background:var(--card,var(--panel));border:1px solid var(--edge);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
/* ── 有壁纸时卡片换玻璃底（2026-11-12 建；模糊口径 2026-11-17 已改，见下面那条）──
   历史：2026-11-12 用户原话「没给每张卡加实时模糊这个不对　在标准模式允许啊」，
   当时这里配的是 backdrop-filter: blur(18px)。
   2026-11-17 用户改口：「我现在用的就是静态图　目前还是模糊的」→ 标准模式也不要实时模糊。
   现在这一段只负责「把卡片底换成玻璃色纱」，糊不糊由紧跟其后的那条 none 统一管。
   ★ 选 `html.hx-bg` 而不是 `html.hx-layer`：本页在总入口里是 iframe，嵌入时 hx-theme.js 故意不挂
     .hx-layer（背景由 body::before 自己铺一遍），只看 hx-layer 的话玻璃永远不生效。
     hx-bg = 「有壁纸」，嵌入/独立两种情形都在，是这里唯一正确的闸门。 */
html.hx-bg .card,
html.hx-bg .docmain{
  /* 用 --card（上面 :root 里那份，已经乘过 --hx-a），别再写死 alpha */
  background-color: var(--glass-card);
  border-color: rgba(18,22,30,.14);
  box-shadow: var(--glass-drop, 0 24px 48px -26px rgba(15,22,35,.38)), inset 0 .8px 0 rgba(255,255,255,.8);
}
html.hx-bg[data-hx-mode="dark"] .card,
html.hx-bg[data-hx-mode="dark"] .docmain{
  background-color: var(--glass-card);
  border-color: rgba(255,255,255,.12);
  box-shadow: var(--glass-drop, 0 22px 54px -28px rgba(0,0,0,.9)), inset 0 .8px 0 rgba(255,255,255,.12);
}
html.hx-bg .card,
html.hx-bg .docmain,
html.hx-bg .side{
  /* 2026-11-17 用户定（原话「我现在用的就是静态图　目前还是模糊的」）：**标准模式也不要实时模糊**。
     以前这里是 saturate(180%) blur(18px)，把背后的壁纸糊成一大团光晕 —— 背景图等于白放。
     玻璃感靠「半透明色纱（--glass-card）+ 1px 边框 + 顶部内高光 + 落影」撑起来就够了，
     背景必须一个像素都不糊地透出来。saturate 也一并去掉：它同样要开一个全屏合成层，收益抵不过代价。 */
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
/* ── 二级「卡」（2026-11-12 建，2026-11-17 统一改成不糊）─────────────────
   本页其实一张 .card 都没有：用户眼里的「每张卡」是正文里那 18 个分区（.hd）、
   目录条目（.toc a）和底部标签（.got span）。它们的底原本是 --card/--panel 实色，
   压在玻璃正文上就是一块块硬边黑板，所以要单独给它们一层玻璃底。
   2026-11-12 这里配的是 blur(12px)；2026-11-17 跟大卡一起改成 none —— 小卡上的模糊
   同样会把壁纸糊掉，而且这些元素又多又小，逐个小模糊层在教室一体机上更亏。 */

/* 次级「卡片」（分区 .hd / 目录条目 / 底部标签）同样乘 --hx-a：
   2026-11-16 之前这几个 alpha 也是写死的，所以拖通透度只有大卡在动、里面一块块还是不动。 */
html.hx-bg .hd{ background: color-mix(in srgb, var(--hc, var(--acc)) 9%, rgb(255 255 255 / calc(var(--hx-a, 1) * .14))); }
html.hx-bg[data-hx-mode="dark"] .hd{ background: color-mix(in srgb, var(--hc, var(--acc)) 13%, rgb(12 15 20 / calc(var(--hx-a, 1) * .42))); }
html.hx-bg .toc a{ background: rgb(255 255 255 / calc(var(--hx-a, 1) * .12)); }
html.hx-bg[data-hx-mode="dark"] .toc a{ background: rgb(12 15 20 / calc(var(--hx-a, 1) * .34)); }
html.hx-bg .got span{ background: rgb(255 255 255 / calc(var(--hx-a, 1) * .16)); }
html.hx-bg[data-hx-mode="dark"] .got span{ background: rgb(255 255 255 / calc(var(--hx-a, 1) * .07)); }
/* 次级「卡片」也一律不糊（2026-11-17 同上：原来这里是 blur(12px)，同样把壁纸糊掉） */
html.hx-bg .hd,
html.hx-bg .toc a,
html.hx-bg .got span{
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
/* 分色块说明（.hd 也是卡片：底色跟「卡片通透度」走，用 --card 而不是死透明度） */
.hx-doc p{margin:0 0 8px;font-size:14px;line-height:1.65;color:var(--dim)}
.hx-doc b{color:var(--ink);font-weight:600}
.hx-doc kbd{padding:1px 6px;border-radius:5px;background:var(--fill,#f0f1f4);font-size:12.5px;font-family:inherit;color:var(--ink)}
.hd{position:relative;margin:0 0 12px;padding:13px 16px 12px 18px;border-radius:14px;
  background:color-mix(in srgb,var(--hc,var(--acc)) 8%,var(--card,var(--panel)));
  border:1px solid color-mix(in srgb,var(--hc,var(--acc)) 22%,transparent);
  scroll-margin-top:74px}
.hd::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--hc,var(--acc))}
.hd .hdt{display:block;margin-bottom:6px;font-size:14.5px;font-weight:700;color:var(--hc,var(--acc))}
.hd ul{margin:0;padding-left:17px;font-size:14px;line-height:1.75;color:var(--dim)}
.hd li{margin:3px 0}
.hd .iso{margin:8px 0 0;padding-top:7px;border-top:1px dashed color-mix(in srgb,var(--hc,var(--acc)) 34%,transparent);
  font-size:12.5px;line-height:1.55;color:var(--dim)}
@media (max-width:620px){ .wrap{padding:0 14px} .card{padding:14px} }

/* ── 2026-11-12 重写：目录 + 分区标题 + 角色标 ────────────────────────── */
.doc-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.doc-h h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.doc-h span{font-size:12.5px;color:var(--faint)}
.lead{font-size:14.5px;line-height:1.75;color:var(--dim);margin:6px 0 14px}
.sec{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sec b{font-size:15px;font-weight:800;letter-spacing:.01em}
.sec i{flex:1;height:1px;background:var(--edge);font-style:normal}
.sec em{font-style:normal;font-size:12px;color:var(--faint);font-weight:600}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:8px}
.toc a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;text-decoration:none;
  background:var(--panel);border:1px solid var(--edge);color:var(--ink);font-size:13.5px;font-weight:600;
  transition:border-color .18s,transform .18s}
.toc a:hover{border-color:var(--acc);transform:translateY(-1px)}
.toc a u{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;text-decoration:none;
  font-size:11px;font-weight:800;color:#fff;background:var(--tc,#4f8ce8);font-style:normal}
.toc a s{flex:none;margin-left:auto;text-decoration:none;font-size:11px;color:var(--faint);font-weight:600}
.hd .role{display:inline-block;margin-left:8px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;
  vertical-align:1px;background:color-mix(in srgb,var(--hc) 16%,transparent);color:var(--hc)}
.hd .why{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--dim)}
.hd .why b{color:var(--ink)}
.hd .steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.hd .steps li{counter-increment:s;position:relative;padding-left:24px;margin:4px 0}
.hd .steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;
  display:grid;place-items:center;font-size:10.5px;font-weight:800;
  background:color-mix(in srgb,var(--hc) 18%,transparent);color:var(--hc)}
.got{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.got span{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--panel2);border:1px solid var(--edge);color:var(--dim)}

/* ── 宽屏左右布局（2026-11-12 用户截图反馈：「没利用上网页左右两边 很突兀在中间」）──
   原来正文是 max-width:860 的一根竖条，1920 屏上两边各空 500 多像素。
   现在 ≥1080px 改成「左侧目录常驻栏 + 右侧正文」：目录 sticky 跟着滚，正文吃满剩余宽度；
   窄屏退回单列（目录在正文上方），手机观感跟以前一样。 */
#doc{display:block}
.side{display:none}
@media (min-width:1080px){
  #doc{
    display:grid; grid-template-columns:264px minmax(0,1fr); gap:26px; align-items:start;
    /* 这一层只是布局容器，本身不该再画成一张卡 */
    background:none; border:0; box-shadow:none; padding:0;
  }
  .side{
    display:block; position:sticky; top:76px; max-height:calc(100dvh - 96px); overflow:auto;
    padding:14px; border-radius:16px; background:var(--card,var(--panel)); border:1px solid var(--edge);
    box-shadow:var(--shadow);
    /* 2026-11-16 用户：「这个滑轨删除 弄成无感的」——目录栏照样能滚（滚轮/触控板都行），
       但不再画那条滚动条。双写：scrollbar-width 管 Firefox / 新 Edge，
       ::-webkit-scrollbar 管 Chrome 和希沃一体机上的旧内核。 */
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .side::-webkit-scrollbar{width:0;height:0}
  .side .toc{grid-template-columns:1fr;gap:5px}
  .side .toc a{padding:8px 10px;font-size:13px}
  /* 侧栏也走玻璃（只在宽屏露出，窄屏那条媒体查询会把它退回透明/无边框）。底色同 --card，跟着通透度走 */
  html.hx-bg .side{ background-color: var(--glass-card); border-color: rgba(18,22,30,.14); }
  html.hx-bg[data-hx-mode="dark"] .side{ background-color: var(--glass-card); border-color: rgba(255,255,255,.12); }
  .docmain{padding:22px 26px 26px;border-radius:16px;background:var(--card,var(--panel));border:1px solid var(--edge);box-shadow:var(--shadow)}
  .docmain .lead{max-width:96ch}
  .docmain .hd ul{max-width:104ch}
}
@media (max-width:1079px){
  /* 窄屏：目录不能消失，退回「正文顶部的网格」，和改版前一样 */
  .side{display:block;position:static;max-height:none;padding:0;border:0;background:none;box-shadow:none;margin-bottom:4px}
  .side .toc{grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:8px}
  .side .toc a{padding:9px 12px;font-size:13.5px}
  .docmain{display:block}
}
@media (max-width:620px){ .wrap{padding:0 14px} .card{padding:14px} }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1><i>?</i>使用说明</h1>
</div></header>

<main class="wrap">
  <div class="card hx-doc" id="doc"><p style="color:var(--dim)">正在加载…</p></div>
</main>

<script>
(function () {
  'use strict';
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  /* hd(颜色, 标题, 内容, 注意行, 锚点 id, 角色标) */
  function hd(c,title,body,iso,anchor,role){
    return '<div class="hd" style="--hc:'+c+'"'+(anchor?' id="'+anchor+'"':'')+'><b class="hdt">'+title
      + (role?'<span class="role">'+role+'</span>':'') + '</b>'+body
      + (iso?'<p class="iso">'+iso+'</p>':'')+'</div>';
  }
  function sec(t,en){ return '<div class="sec"><b>'+t+'</b><i></i>'+(en?'<em>'+en+'</em>':'')+'</div>'; }
  function toc(items){
    return '<div class="toc">'+items.map(function(x){
      return '<a href="#'+x[0]+'"><u style="--tc:'+x[2]+'">'+x[3]+'</u>'+x[1]+'<s>→</s></a>';
    }).join('')+'</div>';
  }

  /* ============================================================
     教师 / 管理员版
     ============================================================ */
  function helpDocTeacher(){
    var TOC = toc([
      ['a-account','账号与权限','#4f8ce8','A'],
      ['a-home','首页与外观','#8a6fd0','B'],
      ['a-class','班级与名单','#e0a15a','C'],
      ['a-subject','科目','#5ad16f','D'],
      ['a-wiring','接线仿真','#ff9f43','1'],
      ['a-quiz','刷题','#5ad16f','2'],
      ['a-base','进制转换','#3ad6c6','3'],
      ['a-mcu','单片机上机','#3aa8d8','4'],
      ['a-exam','考试','#7d7aff','5'],
      ['a-kaoqin','考勤','#34d399','6'],
      ['a-ziliao','资料库','#a3e635','7'],
      ['a-paike','排课','#ff6b6b','8'],
      ['a-jiafen','小组加分','#d97ea3','9'],
      ['a-course','课程进度','#ffd166','10'],
      ['a-ai','AI 设置','#0891b2','11'],
      ['a-misc','备份 / 音乐 / 反馈','#9aa0a8','12'],
      ['a-uikit','UI 设计（开发者）','#8b5cf6','13'],
      ['a-student','学生端能做什么','#7c9cff','S'],
      ['a-faq','常见问题','#c99a3a','?']

  function render(t){
    var doc = document.getElementById('doc');
    /* 2026-11-12：宽屏改成「左侧目录 + 右侧正文」，所以目录从正文里搬出来单独放 aside。
       目录仍然是同一份 .toc（窄屏自动退回正文顶部的网格），只是位置换了。 */
    doc.innerHTML = '<div class="docmain">' + (t === 'student' ? helpDocStudent() : helpDocTeacher()) + '</div>';
    var toc = doc.querySelector('.toc');
    if (toc) {
      var n = toc.children.length;
      var aside = document.createElement('aside');
      aside.className = 'side';
      aside.id = 'docSide';
      aside.innerHTML = '<div class="sec"><b>目录</b><i></i><em>共 ' + n + ' 节</em></div>';
      aside.appendChild(toc);
      doc.insertBefore(aside, doc.firstChild);
    }
    /* 目录是页内锚点：默认跳转会被 sticky 顶栏盖住一截，这里补一次滚动偏移 */
    doc.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;
      e.preventDefault();
      var y = el.getBoundingClientRect().top + window.pageYOffset - 72;
      window.scrollTo({ top: y < 0 ? 0 : y, behavior: 'smooth' });
      try { history.replaceState(null, '', a.getAttribute('href')); } catch (err) { }
    });
  }
  /* 按登录身份自动判：教师 / 管理员 / 开发者看老师版，其余（学生、未登录）看学生版。
     身份从总入口的 HXPortal.me() 拿（teacher/admin/dev 字段）；嵌在 iframe 里时走 window.top.HXPortal，
     被单独打开时读不到就退回学生版（不会把老师版露给任何人）。 */
  var t = 'student';
  try {
    var p = (window.HXTheme && HXTheme.portal && HXTheme.portal()) || (window.top !== window && window.top.HXPortal);
    var m = p && p.me ? p.me() : null;
    if (m && (m.teacher || m.admin || m.dev)) t = 'teacher';
  } catch (e) { }
  render(t);
})();
