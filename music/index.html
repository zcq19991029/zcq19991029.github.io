<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音乐 · 华夏工具</title>
<link rel="stylesheet" href="../hx-theme.css">
<!-- 不带 data-tool：这一页不做「单独打开跳回总入口」的闸门（它本来就是能直接打开的页面），
     只借主题的配色/背景。播放器逻辑全在 /hx-player.js 里，和首页卡片、工具页顶部条同一份。 -->
<script src="../hx-theme.js"></script>
<link rel="icon" href="../logo-256.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 18px 48px;
  }
  /* 权限没通过时整页什么都不留：#page 默认就是 hidden，连顶栏也不会闪一下 */
  #page[hidden]{display:none!important}
  /* 主题的背景视频 / 水印是 hx-theme.js 自己往 body 里插的，权限没通过时一并藏掉，
     否则「空白页」背后还放着一整块背景，看着像没弄干净 */
  body.hx-blank .hx-bgvid-wrap,
  body.hx-blank .hx-wm,
  body.hx-blank .hx-bgmo{display:none!important}
  .top{
    max-width:760px;margin:0 auto;padding:16px 0 10px;
    display:flex;align-items:center;gap:12px;
  }
  .top a{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--dim);
    font-size:13px;padding:7px 13px;border-radius:99px;border:1px solid var(--edge);background:var(--card-solid);
  }
  .top a:hover{color:var(--ink)}
  .top h1{font-size:15px;font-weight:500;margin:0}
  .top .sp{flex:1}
  #app{max-width:760px;margin:0 auto}
  .tip{
    max-width:760px;margin:16px auto 0;font-size:12px;line-height:1.7;color:var(--faint);
  }
  .tip b{color:var(--dim);font-weight:500}
</style>
</head>
<body data-hxp-page="1">

<!-- 默认 hidden：身份没确认之前不渲染任何东西（顶栏、面板、提示文字都不给） -->
<div id="page" hidden>
  <div class="top">
    <a href="../">← 总入口</a>
    <h1>音乐</h1>
    <span class="sp"></span>
  </div>

  <main id="app"></main>

  <p class="tip">
    支持 <b>mp3</b>（最稳）、m4a / aac，部分浏览器支持 ogg / opus / wav / flac。<br>
    <b>仅管理员 / 开发者可用</b>：登录后歌单跟着账号走（换电脑也在），默认背景音乐自动出现。<br>
    从总入口进音乐是弹层，切工具音乐不断；直接打开这一页时换页面会重头加载。
  </p>
</div>

<script>window.HX_PLAYER_NO_BOOT = 1;</script>
<script src="../ui-dialog.js"></script>
<script src="../hx-player.js"></script>
<script>
/* 2026-11-11 权限收敛（第二轮）：这一页只对管理员 / 开发者开放，其余身份「整页不渲染」。
   用户原话：「不用显示 直接不显示隐藏即可 压根不给权限 不需要有」——
   所以不做「无权限」提示卡，也不提示登录，什么都没有，只有一张空白页。

   实现要点：
   1) 上面的 #page 默认 hidden，HTML 里没有任何会先闪一下的内容；
   2) window.HX_PLAYER_NO_BOOT=1 让 hx-player.js 不自动启动 —— 否则它一加载就会
      loadList()（登录态下会打 hx_music_list），没通过闸门也白跑一次请求；
   3) 身份判定两道：先看 hx_me 的 admin/dev（前端身份），再用 HXPlayer.allowed() 复核，
      任一为 false 就 purge()。云存储按流量计费，非管理员一个字节都不该拉。
   4) purge() 直接把 body 清空：顶栏、播放器、歌单、上传区、提示文字全部不存在。 */
(function(){
  var page = document.getElementById('page');
  var host = document.getElementById('app');

  function purge(){
    /* 什么都不留：顶栏/面板/提示整块摘掉，主题的壁纸也藏掉（body.hx-blank），
       标题保持中性，不出现「无权限 / 仅管理员 / 登录」等字样 */
    document.title = '音乐 · 华夏工具';
    var p = document.getElementById('page');
    if (p) p.remove();
    document.body.classList.add('hx-blank');
  }

  if (!window.HXPlayer || !HXPlayer.who || !HXPlayer.allowed) return purge();

  HXPlayer.who().then(function(me){
    /* 第一道：前端身份。口径与数据库 hx_is_admin() 一致（is_admin 或 is_dev） */
    if (!(me && (me.admin || me.dev))) return purge();
    /* 第二道：播放器自己的 allowed()（同一份 hx_me，命中缓存，不会多发请求） */
    return HXPlayer.allowed().then(function(ok){
      if (!ok) return purge();
      page.hidden = false;
      HXPlayer.panel(host);
      /* 面板挂好后再拉歌单（NO_BOOT 下不会自动加载），拉完 loadList 会自己重绘列表 */
      HXPlayer.ready();
    });
  }).catch(purge);
})();
</script>
</body>
</html>
