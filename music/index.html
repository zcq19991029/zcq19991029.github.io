<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音乐 · 华夏工具</title>
<link rel="stylesheet" href="../hx-theme.css">
<!-- 不带 data-tool：这一页不做「单独打开跳回总入口」的闸门（它本来就是能直接打开的页面），
     只借主题的配色/背景。播放器逻辑全在 /hx-player.js 里，和首页卡片、工具页顶部条同一份。 -->
<script src="../hx-theme.js"></script>
<link rel="icon" href="../logo-256.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 18px 48px;
  }
  .top{
    max-width:760px;margin:0 auto;padding:16px 0 10px;
    display:flex;align-items:center;gap:12px;
  }
  .top a{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--dim);
    font-size:13px;padding:7px 13px;border-radius:99px;border:1px solid var(--edge);background:var(--card-solid);
  }
  .top a:hover{color:var(--ink)}
  .top h1{font-size:15px;font-weight:500;margin:0}
  .top .sp{flex:1}
  #app{max-width:760px;margin:0 auto}
  .tip{
    max-width:760px;margin:16px auto 0;font-size:12px;line-height:1.7;color:var(--faint);
  }
  .tip b{color:var(--dim);font-weight:500}
  /* 无权限提示（2026-11-11）：卡片样式和播放面板同款，别看起来像报错页 */
  .deny{
    max-width:560px;margin:8vh auto 0;padding:34px 28px;border-radius:24px;
    background:var(--card-solid);border:1px solid var(--edge);text-align:center;
  }
  .deny-ic{width:52px;height:52px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;background:var(--fill);color:var(--dim)}
  .deny-ic svg{width:26px;height:26px}
  .deny h2{font-size:17px;font-weight:500;margin:0 0 10px;color:var(--ink)}
  .deny p{font-size:13px;line-height:1.8;color:var(--dim);margin:0 0 20px;text-align:left}
  .deny a{
    display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 20px;
    border-radius:99px;background:var(--ink);color:var(--bg);font-size:13px;text-decoration:none;
  }
  .deny a:hover{opacity:.88}
</style>
</head>
<body data-hxp-page="1">

<div class="top">
  <a href="../">← 总入口</a>
  <h1>音乐</h1>
  <span class="sp"></span>
</div>

<main id="app"></main>

<p class="tip">
  支持 <b>mp3</b>（最稳）、m4a / aac，部分浏览器支持 ogg / opus / wav / flac。<br>
  <b>仅管理员 / 开发者可用</b>：登录后歌单跟着账号走（换电脑也在），默认背景音乐自动出现。<br>
  从总入口进音乐是弹层，切工具音乐不断；直接打开这一页时换页面会重头加载。
</p>

<script src="../ui-dialog.js"></script>
<script src="../hx-player.js"></script>
<script>
/* 2026-11-11 权限收敛：这一页只对管理员 / 开发者开放。
   原因：音频存 Supabase Storage，免费版每月 5GB 出口流量，默认 BGM 一首 40MB，
   每播一次就要拉一整份 —— 教师、学生反复听会把额度吃光，连带整站 API 异常。
   入口在总入口首页卡已隐藏；这里再挡一道，防止有人直接把地址打开。
   判定口径与数据库 hx_is_admin() 一致（is_admin 或 is_dev），不新造。 */
(function(){
  var host = document.getElementById('app');

  function deny(){
    document.title = '音乐 · 仅管理员可见';
    host.innerHTML =
      '<div class="deny">' +
        '<div class="deny-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">' +
          '<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>' +
        '</svg></div>' +
        '<h2>音乐工具仅对管理员 / 开发者开放</h2>' +
        '<p>背景音乐存在云存储里，按流量计费。为了不让免费额度被播放吃光（一首歌 40MB，每播一次就要拉一整份），' +
        '这个工具目前只留给管理员和开发者使用。教师和学生的账号不受影响，其它工具照常用。</p>' +
        '<a href="../">返回总入口</a>' +
      '</div>';
  }

  if (!window.HXPlayer) return deny();   // 播放器脚本没加载出来时也别给空白页
  HXPlayer.ready().then(function(){
    HXPlayer.allowed().then(function(ok){
      if (!ok) return deny();
      HXPlayer.panel(host);
      document.title = '音乐 · 华夏工具';
    }).catch(deny);
  });
})();
</script>
</body>
</html>
