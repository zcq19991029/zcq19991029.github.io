<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>选桌组队 · 夜夜小组加分</title>
<meta name="theme-color" content="#f6f7fb">
<!-- 全站外观/校徽水印，和 scores.html 同一套（见那边的注释）。 -->
<script src="../hx-theme.js" data-tool="jiafen"></script>
<link rel="stylesheet" href="team.css?v=f205b88">
<!-- 桌卡样式（2026-11-06）：圆桌改成排课那套卡片。新规则全写在这一个文件里，
     不覆盖 team.css 已有的行（那边正有人在改深浅色变量）。 -->
<link rel="stylesheet" href="roster-board.css?v=f205b88">
<!-- 学生端共用外观层（2026-11-12）：深色主题 + 毛玻璃 + 细节统一。必须排在最后覆盖 -->
<link rel="stylesheet" href="student-ui.css?v=f205b88">
</head>
<body>
<header class="top">
  <!-- 身份卡（2026-11-13 重做）：用户原话「这里的是自己名字 id 卡 当然带背景自定义的那种
       右边是教师端这样子的样子 看我的分数这个跳转太丑了 重做」。
       原来顶部是「班名 / 姓名·学号」两行纯文本 + 一个裸文字「看我的分数 →」，
       现在整块是一张 ID 卡，和查分页（scores.html）那张同一套结构、同一份样式：
         · 左  首字母头像
         · 中  班级（小字，带「组队中 / 已结束」状态胶囊）+ 姓名（大字）+ 学号（小字）
         · 右  「看我的分数」玻璃胶囊按钮（不再是裸链接）
       背景由 team.js 读 hx_rank_bg 铺在 #idcBg 上（和教师端排位身份卡同一套预设）。 -->
  <div class="id-card" id="myCard">
    <span class="idc-bg" id="idcBg" aria-hidden="true"></span>
    <span class="idc-veil" aria-hidden="true"></span>
    <span class="idc-av" id="idcAv" aria-hidden="true">我</span>
    <div class="idc-main">
      <div class="idc-top">
        <span class="idc-cls" id="clsName">正在读取…</span>
        <span class="top-state" id="statePill"></span>
      </div>
      <div class="idc-nm">
        <b id="who"></b><span class="idc-no" id="whoNo"></span>
      </div>
    </div>
    <a class="idc-go" href="scores.html">看我的分数<i aria-hidden="true">→</i></a>
  </div>
</header>

<main id="main">
  <section id="notice" class="notice" hidden></section>

  <!-- 分组看板：未分组池子 + 组卡片。自己那条 chip 用身份牌背景，可拖进组/换组/回未分组 -->
  <div id="groupBoard" class="group-board"></div>
  <p class="tip" id="tip"></p>
</main>

<script src="config.js?v=f205b88"></script>
<!-- 排位身份卡预设背景（2026-11-12）：拖「我的身份卡」时读自己的 hx_rank_bg 背景 -->
<script src="../rank-bg.js"></script>
<!-- 班级头像/背景（2026-11-13）：整班头像 + 身份卡背景只在这一处定义，教师端分组看板共用 -->
<script src="faces.js?v=f205b88"></script>
<script src="team.js?v=f205b88"></script>
</body>
</html>
