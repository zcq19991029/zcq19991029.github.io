<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的分数 · 夜夜小组加分</title>
<meta name="theme-color" content="#f6f7fb">
<!-- 全站外观/校徽水印：和其他工具一样在 <head> 里同步引，打开就是选好的主题。
     带 data-tool="jiafen" 而不是 "scores"：这一页被单独打开时会被送回总入口的小组加分卡
     （学生这时候本来也要先登录），嵌在总入口框里则照常不跳。 -->
<script src="../hx-theme.js" data-tool="jiafen"></script>
<link rel="stylesheet" href="scores.css?v=5d1568a">
<!-- 学生端共用外观层（2026-11-12）：深色主题 + 毛玻璃 + 细节统一。必须排在 scores.css 之后覆盖 -->
<link rel="stylesheet" href="student-ui.css?v=5d1568a">
</head>
<body>
<header class="top">
  <div class="top-cta-row">
    <a class="top-cta" href="team.html">去选桌组队 →</a>
  </div>
  <div class="top-main">
    <b id="clsName">正在读取…</b>
    <span id="who" class="who"></span>
    <span class="readonly">只读</span>
  </div>
  <div class="sync-line">
    <span class="sync" id="sync"></span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="score" class="on">上课记分</button>
  <button data-tab="total">总分与登分册</button>
</nav>

<main>
  <section id="notice" class="notice" hidden></section>
  <div id="view-score" class="view"></div>
  <div id="view-total" class="view hide"></div>
</main>

<script src="config.js?v=5d1568a"></script>
<script src="scores.js?v=5d1568a"></script>
</body>
</html>
