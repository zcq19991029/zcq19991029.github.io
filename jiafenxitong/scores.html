<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的分数 · 夜夜小组加分</title>
<meta name="theme-color" content="#f6f7fb">
<!-- 全站外观/校徽水印：和其他工具一样在 <head> 里同步引，打开就是选好的主题。
     带 data-tool="jiafen" 而不是 "scores"：这一页被单独打开时会被送回总入口的小组加分卡
     （学生这时候本来也要先登录），嵌在总入口框里则照常不跳。 -->
<script src="../hx-theme.js" data-tool="jiafen"></script>
<link rel="stylesheet" href="scores.css?v=998becc-dirty">
<!-- 学生端共用外观层（2026-11-12）：深色主题 + 毛玻璃 + 细节统一。必须排在 scores.css 之后覆盖 -->
<link rel="stylesheet" href="student-ui.css?v=998becc-dirty">
</head>
<body>
<header class="top">
  <!-- 身份卡（2026-11-13 统一）：和 team.html 顶部是同一张卡、同一份样式（student-ui.css 的「⑪ 身份卡」）。
       结构固定在这里，scores.js 的 renderMyCard() 只负责填字 + 铺背景（hx_rank_bg，跟账号走）：
         第一行 = 班级 + 只读/可互评小标签 + 组别胶囊
         第二行 = 姓名（大）+ 学号（小）
         右侧   = 「去选桌组队」玻璃胶囊按钮（以前是实心蓝按钮摆在卡外面） -->
  <div class="id-card" id="myCard">
    <span class="idc-bg" id="idcBg" aria-hidden="true"></span>
    <span class="idc-veil" aria-hidden="true"></span>
    <span class="idc-av" id="idcAv" aria-hidden="true">我</span>
    <div class="idc-main">
      <div class="idc-top">
        <span class="idc-cls" id="clsName">正在读取…</span>
        <span class="readonly">只读</span>
        <span class="idc-g" id="idcG" hidden></span>
      </div>
      <div class="idc-nm">
        <b id="who"></b><span class="idc-no" id="whoNo"></span>
      </div>
    </div>
    <a class="idc-go" href="team.html">去选桌组队<i aria-hidden="true">→</i></a>
  </div>
  <div class="sync-line">
    <span class="sync" id="sync"></span>
  </div>
</header>

<!-- 2026-11-13 合并页签：原来「上课记分 / 总分与登分册」两个 tab 讲的是同一个平时分
     （88.6% 当前累计完成率 ＝ 88.6 平时分/100，同一个数换了个马甲），用户要求合成单页。
     合并后整页只有一个渲染容器 #view，纵向排：总分 → 平时分分解 → 课次 → 互评 → 登分册。
     注意：这里删了 #tabs / #view-score / #view-total，scores.js 里对应的引用已同步删干净，
     不要再按老 id 写代码，否则 getElementById 拿到 null 会直接中断整个脚本、页面全空。 -->
<main>
  <section id="notice" class="notice" hidden></section>
  <div id="view"></div>
</main>

<script src="config.js?v=998becc-dirty"></script>
<!-- 排位身份卡预设背景（2026-11-12）：和总入口同一份，读自己的 hx_rank_bg 背景用 -->
<script src="../rank-bg.js"></script>
<script src="scores.js?v=998becc-dirty"></script>
</body>
</html>
