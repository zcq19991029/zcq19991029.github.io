/* 点一格：互换模式下完成互换，否则打开选人对话框 */
function onCell(date,i){
  const w=E.weekOf(st,date),r=w.rows[i];
  if(swapFrom){
    if(swapFrom.date===date&&swapFrom.i===i){swapFrom=null;render();return;}
    const from=swapFrom,a=E.weekOf(st,from.date).rows[from.i];
    swapFrom=null;
    commit(()=>{[a.teacher,r.teacher]=[r.teacher,a.teacher];
      for(const x of [a,r]){x.locked=true;x.kind=x.teacher&&st.fixed[x.teacher]===x.gid?'fixed':(x.teacher?'rotate':'');}},'已互换（两格都已锁定）',[from.date+'|'+from.i,date+'|'+i]);
    return;
  }
  const {cnt,last,hrs}=E.tally(st,date);
  const inWeek=new Set(w.rows.filter((x,j)=>j!==i).map(x=>x.teacher).filter(Boolean));
  const q=E.queue(st,date).map(x=>x.name);
  /* 只和本周还没排的人比，免得本周已排的新人把最少次数拉成 0 */
  const minCnt=minOr(q.filter(n=>!inWeek.has(n)).map(n=>cnt[n]));
  const item=t=>{
    const why=[];
    if(inWeek.has(t.name))why.push('本周已排');
    if(t.status==='exclude')why.push(t.reason||'不排');
    if(t.status==='rotate'&&cnt[t.name]>minCnt)why.push('已比别人多上');
    const g=mapOf(t.name);
    if(g&&g!==r.gid)why.push((t.status==='fixed'?'固定带 ':'指定带 ')+E.groupLabel(st,g));
    return `<button class="pick ${t.name===r.teacher?'cur':''}" data-act="set-t" data-d="${date}" data-i="${i}" data-n="${h(t.name)}">
      <span class="av" style="${tc(t.name)}">${h(t.name.slice(-2))}</span><span class="nm">${h(t.name)}</span><span class="meta">已上 ${hrs[t.name]||0} 课时${t.status==='rotate'?' · 第'+((cnt[t.name]||0)+1)+'轮':''}${last[t.name]?' · 上次 '+E.md(last[t.name]):''}</span>${why.length?`<span class="why">${h(why.join('，'))}</span>`:'<span class="ok">可排</span>'}</button>`;
  };
  modal(`${E.md(date)} ${wd(date)} · ${h(r.room||'')}`,`${h([r.b1,r.b2].filter(Boolean).join(' → '))}`,
    `<div class="sec">轮换老师 · 按该轮到的先后</div>${q.map(n=>item(E.teacher(st,n))).join('')}
     <div class="sec">固定老师</div>${st.teachers.filter(t=>t.status==='fixed').map(item).join('')||'<p class="note">无</p>'}
     ${st.teachers.some(t=>t.status==='exclude')?`<details class="more"><summary>不排名单（周一有课等，一般不用选）</summary>${st.teachers.filter(t=>t.status==='exclude').map(item).join('')}</details>`:''}`,
    `<button class="ghost" data-act="cell-clear" data-d="${date}" data-i="${i}">清空</button>
     <button data-act="cell-swap" data-d="${date}" data-i="${i}">${svgI('swap','ic16')}与另一格互换</button>
     <button data-act="cell-lock" data-d="${date}" data-i="${i}">${svgI(r.locked?'unlock':'lock','ic16')}${r.locked?'解锁':'锁定'}</button>
     <button class="pri" data-act="close">完成</button>`);
}

/* ---------- 批量添加老师：一行一个，或用顿号/逗号/空格隔开；名字后面可写“固定”“不排 原因” ---------- */
const STATUS_WORD={'固定':'fixed','轮换':'rotate','不排':'exclude'};
function parseTeachers(text){
  const out=[],seen=new Set();
  for(const line of String(text).split(/\r?\n/)){
    const toks=line.replace(/[（(]/g,' ').replace(/[）)]/g,' ').split(/[、，,;；\s]+/).map(t=>t.trim()).filter(Boolean);
    if(!toks.length)continue;
    const k=toks.findIndex(t=>STATUS_WORD[t]);
    const add=(name,status,reason)=>{if(!name||seen.has(name))return;seen.add(name);out.push({name,status:status||'rotate',reason:reason||''});};
    if(k>0){add(toks[0],STATUS_WORD[toks[k]],toks.slice(k+1).join(' '));toks.slice(1,k).forEach(n=>add(n));}
    else toks.filter(t=>!STATUS_WORD[t]).forEach(n=>add(n));
  }
  return out;
}
function batchPreview(){
  const list=parseTeachers(($('#tbText')||{}).value||'');
  const neu=list.filter(x=>!E.teacher(st,x.name)),dup=list.filter(x=>E.teacher(st,x.name));
  const el=$('#tbPrev');if(!el)return;
  el.innerHTML=list.length?`<p>要添加 <b>${neu.length}</b> 位${dup.length?'，已在名单里、跳过 <b>'+dup.length+'</b> 位（'+dup.map(x=>h(x.name)).join('、')+'）':''}</p>

  const b=$('[data-act="tb-apply"]');if(b){b.disabled=!neu.length;b.textContent=neu.length?'添加 '+neu.length+' 位':'添加';}
}

let modalT=0;

/* 关闭：弹窗轻轻缩小下沉、背景淡出（0.22 秒），再真正收起 */
function closeModal(){
  const m=$('#modal');if(m.hidden)return Promise.resolve();
  clearTimeout(modalT);
  if(REDUCE){m.hidden=true;m.innerHTML='';return Promise.resolve();}
  m.classList.add('closing');
  return new Promise(res=>{modalT=setTimeout(()=>{m.hidden=true;m.innerHTML='';m.classList.remove('closing');res();},220);});
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const CHECK='<svg class="ok-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
/* 按钮的三种状态：加载中（转圈、宽度不变、不能连点）→ 成功（变绿打勾，停 0.7 秒）/ 失败（左右晃一下）
   成功后由调用方决定下一步（通常是让弹窗渐进退出）；按钮如果还在页面上，1.2 秒后自己恢复 */
async function busy(btn,fn,done){
  if(!btn||btn.classList.contains('is-loading'))return undefined;
  const html=btn.innerHTML;btn.style.minWidth=btn.offsetWidth+'px';
  btn.classList.add('is-loading');btn.disabled=true;
  const back=()=>{btn.classList.remove('is-loading','is-done','is-error');btn.innerHTML=html;btn.disabled=false;btn.style.minWidth='';};
  try{
    const r=await fn();
    btn.classList.remove('is-loading');btn.classList.add('is-done');btn.innerHTML=CHECK+'<span>'+(done||'完成')+'</span>';
    setTimeout(()=>{if(btn.isConnected)back();},1200);
    await wait(REDUCE?0:700);
    return r;
  }catch(e){
    back();btn.classList.add('is-error');setTimeout(()=>btn.classList.remove('is-error'),450);
    throw e;
  }
}
/* 不用等网络的确认按钮：打一下勾再关弹窗 */
async function doneThenClose(btn,text){
  if(btn&&!REDUCE){btn.style.minWidth=btn.offsetWidth+'px';btn.classList.add('is-done');btn.innerHTML=CHECK+'<span>'+(text||'好了')+'</span>';await wait(380);}
  await closeModal();
}

/* 老师改班：选的组已被别的固定老师占着时问一下“互换 / 让对方待分配” */
async function changeAssign(name,kind,ids){
  ids=ids.filter(Boolean);
  const same=ids.length&&st.groups.find(g=>g.classIds.length===ids.length&&ids.every(id=>g.classIds.includes(id)));
  const holder=same&&kind==='fixed'&&Object.keys(st.fixed).find(n=>n!==name&&st.fixed[n]===same.id);
  if(holder){
    modal('这组班现在由 '+h(holder)+' 固定带',h(E.groupLabel(st,same.id)),`<p>${h(name)} 改带这组后，${h(holder)} 怎么办？</p>`,
      `<button data-act="close">取消</button><button data-act="fix-do" data-n="${h(name)}" data-g="${same.id}" data-ids="${ids.join(',')}" data-m="evict">让 ${h(holder)} 进待分配</button><button class="pri" data-act="fix-do" data-n="${h(name)}" data-g="${same.id}" data-ids="${ids.join(',')}" data-m="swap">两人互换</button>`);
    return;
  }
  /* 会拆开别的老师的组：先问一下 */
  if(!same){
    const mine=kind==='fixed'?st.fixed[name]:(st.designate||{})[name];
    const hit=st.groups.filter(g=>g.id!==mine&&g.classIds.some(id=>ids.includes(id)));
    const others=[...new Set(hit.flatMap(g=>holdersOf(g.id)).filter(n=>n!==name))];
    if(others.length&&!await hxConfirm(ids.map(id=>E.cls(st,id).name).join('、')+' 里有 '+others.join('、')+' 正在带的班。继续会把他们原来的组拆开，他们进“待分配”。继续吗？'))return render();
  }
  let cleared=[];
  commit(()=>{cleared=E.assignClasses(st,name,ids,kind);afterConfig();});
  const n=Object.keys(E.check(st)).filter(d=>d.startsWith(view.month)).length;
  toast(cleared.length?cleared.join('、')+' 原来的班被拆开了，已进待分配':n?'已更新；教室数变了，建议点“整月重排”':'已更新，课表跟着变了');
}

async function inflateRaw(u){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());}

/* 图片卡片上的两行：只有一个班时，括号里的说明挪到第二行，名字不被截断 */
function imgLines(r){
  if(r.b2)return [[TM(0),r.b1],[TM(1),r.b2]];
  const m=String(r.b1).match(/^(.*?)(（.*）)$/);
  return m?[[TM(0),m[1]],['',m[2]+' · 这间只有一节']]:[[TM(0),r.b1],['','（这间只有一节）']];
}
function pngData(){
  const ds=monthDates(),rm=E.roundMap(st),hm=E.hoursMap(st);
  const isF=n=>(E.teacher(st,n)||{}).status==='fixed';
  const cardOf=(w,r)=>({teacher:r.teacher,slot:slotOf(r.teacher||'x'),fixed:!!r.teacher&&isF(r.teacher),round:r.teacher?rm[w.date][r.teacher]:0,hours:r.teacher?hm[w.date][r.teacher]:0,
    room:r.room,lines:imgLines(r)});
  const keys=[],rooms={};
  for(const d of ds){const w=E.weekOf(st,d);if(!w)continue;w.rows.forEach((r,i)=>{const k=r.gid||'h'+i;if(!(k in rooms)){keys.push(k);rooms[k]=r.room;}});}
  const end=E.addDays(ds[ds.length-1],1),{cnt,hrs}=E.tally(st,end);
  const people=[...new Set(ds.flatMap(d=>{const w=E.weekOf(st,d);return w&&!w.skip?w.rows.map(r=>r.teacher).filter(Boolean):[];}))]
    .sort((a,b)=>(isF(b)-isF(a))||a.localeCompare(b,'zh'))
    .map(n=>({name:n,slot:slotOf(n),fixed:isF(n),round:cnt[n]||0,hours:hrs[n]||0,dates:ds.filter(d=>{const w=E.weekOf(st,d);return w&&!w.skip&&w.rows.some(r=>r.teacher===n);}).map(d=>d.slice(5).replace('-','/')).join('、')}));
  return {info:{eyebrow:'华夏教研室 · 机电教研室晚修',title:monthLabel(view.month)+'晚修课表',
      sub:E.md(ds[0])+' — '+E.md(ds[ds.length-1])+' · 每'+wd(ds[0])+'晚 · 第一节 '+TM(0)+' · 第二节 '+TM(1)+' · '+keys.length+' 间教室',
      times:[TM(0),TM(1)],footer:'导出时间 '+new Date().toLocaleString()+' · 华夏教研室排课系统'},
    cols:ds.map(d=>{const w=E.weekOf(st,d);return {label:d.slice(5),wd:wd(d),skip:!!(w&&w.skip)};}),
    rows:keys.map(k=>({room:rooms[k],cells:ds.map(d=>{const w=E.weekOf(st,d);if(!w||w.skip)return null;const r=w.rows.find((x,i)=>(x.gid||'h'+i)===k);return r?cardOf(w,r):null;})})),
    weeks:ds.filter(d=>E.weekOf(st,d)).map(d=>{const w=E.weekOf(st,d);return {label:E.md(d),wd:wd(d),skip:!!w.skip,note:w.note,cards:w.skip?[]:w.rows.map(r=>cardOf(w,r))};}),people};
}
function wmImage(){return new Promise(res=>{const m=(getComputedStyle($('.wm')).backgroundImage.match(/url\("?(.*?)"?\)$/)||[])[1];if(!m)return res(null);const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=m;});}
async function exportPng(mode){
  if(!expDates().length)return toast('本月还没有排课');
  toast('正在生成高清图片…');
  const {canvas,scale}=Png.draw(mode,pngData(),await wmImage(),4);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  const out=Png.withDpi(await blob.arrayBuffer(),96*scale,Xlsx.crc32);
  download('华夏教研室晚修课表-'+(mode==='grid'?'课表视图':'列表视图')+suffix()+'.png',new Blob([out],{type:'image/png'}));
  toast('已导出 '+(mode==='grid'?'课表':'列表')+'视图图片（'+canvas.width+'×'+canvas.height+'）');
}

/* ---------- 拖动名片：课表↔课表互换、课表→名单移出、名单→课表排人（鼠标和触屏都用 pointer 事件） ---------- */
let drag=null,dragEndAt=0;
function cellOf(el){const w=E.weekOf(st,el.dataset.d);return {w,i:+el.dataset.i,r:w.rows[+el.dataset.i],key:el.dataset.d+'|'+el.dataset.i};}
function dropTarget(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const c=el.closest('.lesson[data-act="cell"]');if(c)return c;
  return el.closest('[data-drop="pool"]');
}
/* 鼠标、笔用 pointer 事件；手指用 touch 事件：平板上一滑动浏览器就当成滚动并发 pointercancel，拖到一半会被取消 */
function beginDrag(src,x,y,id,touch){
  if(drag)endDrag(null,true);
  drag={src,x,y,on:false,id,over:null,touch,armed:!touch};
  /* 触屏：按住 0.3 秒才开始拖，直接滑动仍然是滚动页面 */
  if(touch)drag.timer=setTimeout(()=>{if(drag&&drag.src===src){drag.armed=true;src.classList.add('armed');if(navigator.vibrate)navigator.vibrate(15);}},300);
}
function moveDrag(x,y){
  if(!drag.on){
    const moved=Math.hypot(x-drag.x,y-drag.y);
    if(!drag.armed){if(moved>8){clearTimeout(drag.timer);drag=null;}return false;}
    if(moved<6&&!drag.touch)return false;
    drag.src.classList.remove('armed');
    /* 开始拖：复制一张跟着指针走的名片 */
    const r=drag.src.getBoundingClientRect();
    const g=drag.src.cloneNode(true);g.classList.add('drag-ghost');g.removeAttribute('data-act');
    g.style.width=r.width+'px';g.style.height=r.height+'px';
    drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
    document.body.appendChild(g);drag.ghost=g;drag.on=true;
    drag.src.classList.add('dragging');document.body.classList.add('is-dragging',drag.src.dataset.drag==='cell'?'drag-cell':'drag-pool');
  }
  drag.ghost.style.transform=`translate(${x-drag.dx}px,${y-drag.dy}px) rotate(-2deg) scale(1.04)`;
  const t=dropTarget(x,y);
  const ok=t&&t!==drag.src&&!(t.dataset.drop==='pool'&&drag.src.dataset.drag==='pool');
  if(drag.over!==(ok?t:null)){if(drag.over)drag.over.classList.remove('drop-on');drag.over=ok?t:null;if(drag.over)drag.over.classList.add('drop-on');}
  drag.px=x;drag.py=y;
  if(!drag.raf)drag.raf=requestAnimationFrame(autoScroll);
  return true;
}
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.button!==0)return;
  const src=e.target.closest('[data-drag]');if(!src){if(drag)endDrag(null,true);return;}
  beginDrag(src,e.clientX,e.clientY,e.pointerId,e.pointerType!=='mouse');
});
document.addEventListener('pointermove',e=>{
  if(!drag||drag.id===-1||e.pointerId!==drag.id)return;
  if(moveDrag(e.clientX,e.clientY)){e.preventDefault();try{drag.src.releasePointerCapture&&drag.src.releasePointerCapture(e.pointerId);}catch(err){}}
},{passive:false});

  catch(e){if(!cache)return showGate(null,e.message);offline=true;}
  /* 本机缓存里有上次没传上去的改动：底稿版本和云端一致就补传；云端已经被别的设备改过，就让用户选 */
  const local=cache&&meta&&meta.dirty?E.migrate(JSON.parse(cache),UPGRADE):null;
  if(offline){st=E.migrate(JSON.parse(cache),UPGRADE);Sync.rev=meta?meta.rev:0;Sync.dirty=!!(meta&&meta.dirty);toast('连不上服务器，先显示这台电脑上次的数据');}
  else if(local&&(!row||row.rev===meta.rev)){st=local;Sync.rev=row?row.rev:0;Sync.dirty=true;then=()=>{Sync.push();toast('上次没传上去的改动，正在补传');};}
  else if(local){st=local;Sync.rev=meta.rev;Sync.dirty=true;then=conflict;}
  else if(row){st=E.migrate(row.data,UPGRADE);Sync.rev=row.rev;store.set(cacheKey(),JSON.stringify(st));}
  else{st=startData();Sync.rev=0;first=true;}
  if(row)Object.assign(Sync,{cloudAt:row.updated_at,cloudBy:(row.data&&row.data.savedBy)||'',checkedAt:Date.now()});
  keepMeta(Sync.dirty);Sync.ready=true;
  document.body.classList.remove('gated');renderAccount();render(true);
  if(offline)setStatus('连不上网：改动先存在本机，联网后自动同步',true);else if(row)Sync.ok();else setStatus('云端还没有数据');
  if(then)then();
  else if(r&&r.type==='recovery')setTimeout(passwordModal,400);
  else if(first)setTimeout(firstTimeModal,400);
  else if(r&&r.type==='signup')toast('邮箱已确认，欢迎！');
  Ver.check();
}
mountShell();Ver.show();
if(ONLINE)bootOnline();else render(true);

</script>
</body>
