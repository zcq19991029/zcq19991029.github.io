<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>华夏工具</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<!-- 华夏工具总入口 © 2026 zcq：首页是工具卡片（按身份：学生和没登录的人只看到学生工具），教师首页下面是共用的“班级名单”；点开一个工具全屏用，左上角回首页。
     工具都在 zcq19991029.github.io 下，用 iframe 嵌进来。登录、切换账号、个人信息、外观只在这一页：子工具不再有自己的账号和主题界面，
     要登录时调 window.HXPortal.login()；被单独打开时 hx-theme.js 会跳回这里（见 hx-theme.js 的 data-tool）。
     账号：Supabase 华夏工具项目，localStorage paike-session 和各工具共用；身份由数据库 hx_me() 决定。
     脚本里不用反引号模板字符串（本机测试时整页当字符串注入到线上同源页面里）。 -->
<link rel="stylesheet" href="hx-theme.css">
<script src="hx-theme.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink); font: 17px/1.47 var(--hx-font); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } } /* 小于 16px 苹果手机点输入框会自动放大且不回去 */
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  /* 顶栏：苹果官网的毛玻璃导航 */
  header { flex: none; position: relative; z-index: 10; height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 max(12px, env(safe-area-inset-left)); background: var(--bar); backdrop-filter: var(--hx-blur); -webkit-backdrop-filter: var(--hx-blur); border-bottom: 1px solid var(--edge); }
  .brand { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 10px 0 4px; border: 0; border-radius: 12px; background: none; font-weight: 600; font-size: 17px; white-space: nowrap; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; }
  .back { display: none; align-items: center; gap: 2px; height: 36px; padding: 0 12px 0 4px; border: 0; border-radius: 99px; background: none; color: var(--acc); font-size: 17px; white-space: nowrap; }
  .back svg { width: 22px; height: 22px; stroke-width: 2.2; }
  .back:hover { background: var(--hov); }
  .cur { display: none; position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 17px; white-space: nowrap; pointer-events: none; }
  body.tool .back, body.tool .cur { display: flex; } body.tool .brand { display: none; }
  .sp { flex: 1; }
  .ibtn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--ink); opacity: .8; transition: background .2s var(--hx-ease), opacity .2s; }
  .ibtn:hover, .ibtn[aria-expanded="true"] { background: var(--fill); opacity: 1; }
  .acct { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; border: 0; border-radius: 99px; background: none; white-space: nowrap; }
  .acct:hover, .acct[aria-expanded="true"] { background: var(--fill); }
  .acct b { max-width: 9em; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 500; padding-right: 8px; }
  .av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: var(--on-acc); background: var(--acc) center / cover; }
  .av.lg { width: 72px; height: 72px; font-size: 30px; }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--fill); color: var(--dim); }
  .pill.acc { background: var(--accbg); color: var(--acc); }
  .pill.dev { color: #fff; background: linear-gradient(120deg, #f59e0b, #ec4899); box-shadow: 0 4px 14px -6px #ec4899; }
  .pill.admin { color: #fff; background: linear-gradient(120deg, #2563eb, #06b6d4); box-shadow: 0 4px 14px -6px #2563eb; }
  .acct .pill { margin: 0 4px 0 -2px; } .hero p .pill { vertical-align: middle; margin-left: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; } .grid2 .panel { margin: 0 0 14px; }
  .panel h3 { margin: 0 0 12px; font-size: 19px; font-weight: 600; } .dim { color: var(--dim); } .ra { text-align: right; white-space: nowrap; } .mono { font-family: ui-monospace, Consolas, monospace; letter-spacing: .06em; }
  .lbtn { height: 32px; padding: 0 16px; border: 0; border-radius: 99px; background: var(--acc); color: var(--on-acc); font-size: 14px; font-weight: 500; }
  main { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  body.zen header { display: none; }
  /* 苹果手机的 iframe 会按里面内容撑宽，width:1px + min-width:100% 把它钉在屏幕宽 */
  main iframe { position: absolute; inset: 0; width: 1px; min-width: 100%; max-width: 100%; height: 100%; border: 0; background: var(--bg); visibility: hidden; opacity: 0; transition: opacity .35s var(--hx-ease); }
  main iframe.on { visibility: visible; opacity: 1; }
  html.hx-bg main iframe { background: transparent; }
  /* 首页 */
  #home { position: absolute; inset: 0; overflow-y: auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom, 0px)); scroll-behavior: smooth; }
  body.tool #home { visibility: hidden; }
  .wrap { width: min(1024px, 100%); margin: 0 auto; }
  .hero { text-align: center; padding: clamp(40px, 9vw, 96px) 0 clamp(28px, 5vw, 52px); }
  .hero img { width: clamp(64px, 12vw, 88px); aspect-ratio: 1; border-radius: 22%; object-fit: cover; box-shadow: 0 12px 32px -14px var(--shade); }
  .hero h1 { margin: 18px 0 0; font: 700 clamp(40px, 8vw, 64px)/1.06 var(--hx-font-d); letter-spacing: -.02em; }
  .hero p { margin: 10px 0 0; font-size: clamp(19px, 3vw, 24px); color: var(--dim); font-weight: 500; min-height: 1.4em; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: 16px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; min-height: 172px; padding: 26px 24px 22px; border: 0; border-radius: 28px; background: var(--card); text-align: left; box-shadow: 0 0 0 1px var(--edge) inset;
    transition: transform .45s var(--hx-spring), box-shadow .45s var(--hx-spring); animation: rise .7s var(--hx-spring) both; }
  .tile:hover { transform: scale(1.02); box-shadow: 0 0 0 1px var(--edge) inset, 0 22px 50px -26px var(--shade); }
  .tile:active { transform: scale(.98); transition-duration: .15s; }
  .tile .ic { width: 58px; height: 58px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: 0 8px 20px -10px var(--c2); }
  .tile .ic svg { width: 30px; height: 30px; stroke-width: 1.9; }
  .tile b { font-size: 21px; font-weight: 600; letter-spacing: -.01em; margin-top: auto; }
  .tile .go { position: absolute; right: 22px; bottom: 24px; color: var(--acc); width: 22px; height: 22px; transition: transform .3s var(--hx-ease); }
  .tile:hover .go { transform: translateX(3px); }
  .tile .sum { margin-top: -12px; padding-right: 26px; font-size: 14px; color: var(--dim); }
  html.hx-bg .tile, html.hx-bg .panel, html.hx-bg .cl { backdrop-filter: var(--hx-blur); -webkit-backdrop-filter: var(--hx-blur); }
  html.hx-bg .hero h1, html.hx-bg .hero p, html.hx-bg .sec h2 { text-shadow: 0 0 22px var(--bg), 0 0 6px var(--bg); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  /* 管理卡片的标题 */
  /* 分组：组间距明显大于卡片间距，小标题淡一档 */
  .sec { margin: 40px 0 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #tiles > .sec:first-child { margin-top: 0; }
  .sec h2 { margin: 0 0 0 4px; font: 600 15px/1.3 var(--hx-font); color: var(--dim); letter-spacing: .04em; }
  .tile.act { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; margin-bottom: 40px; background: var(--accbg); box-shadow: 0 0 0 1.5px var(--acc) inset; }
  .tile.act b { margin: 0; color: var(--acc); } .tile.act .go { position: static; margin-left: auto; display: block; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 20px; border: 0; border-radius: 99px; background: var(--acc); color: var(--on-acc); font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: filter .2s, transform .15s; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.97); } .btn:disabled { opacity: .45; cursor: default; }
  .btn.sub { background: var(--fill); color: var(--ink); } .btn.link { background: none; color: var(--acc); padding: 0 6px; height: 32px; }
  .btn.sm { height: 32px; padding: 0 14px; font-size: 14px; } .btn.bad { color: var(--bad); }
  .panel { padding: 22px 24px; border-radius: 24px; background: var(--card); box-shadow: 0 0 0 1px var(--edge) inset; margin-bottom: 14px; animation: rise .6s var(--hx-spring) both; }
  .cls { display: grid; gap: 12px; }
  .cl { display: grid; grid-template-columns: 1fr auto; gap: 12px 16px; align-items: center; padding: 18px 20px; border-radius: 22px; background: var(--card); box-shadow: 0 0 0 1px var(--edge) inset; }
  .cl h3 { margin: 0; font-size: 19px; font-weight: 600; } .cl small { color: var(--dim); font-size: 14px; }
  .cl .acts { display: flex; gap: 6px; }
  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 32px; padding: 0 14px; border: 0; border-radius: 99px; background: var(--fill); color: var(--dim); font-size: 14px; font-weight: 500; transition: background .2s, color .2s; }
  .chip[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); }
  .stu { grid-column: 1 / -1; max-height: 420px; overflow: auto; border-top: 1px solid var(--edge); padding-top: 8px; }
  .stu tr.gone td { color: var(--faint); }
  .stu .pill { white-space: nowrap; }
  .ti { width: 100%; min-width: 0; height: 32px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line2); background: var(--card-solid); outline: none; font-size: 14px; }
  .ti:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--ring); }
  .btn.ib { width: 32px; padding: 0; } .btn.ib[data-sure] { width: auto; padding: 0 8px; } .btn.ib svg { width: 17px; height: 17px; }
  @media (max-width: 640px) { .stu .sq { display: none; } .stu td, .stu th { padding: 7px 4px; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } td, th { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--edge); } th { color: var(--dim); font-weight: 500; }
  .code { display: grid; justify-items: center; gap: 4px; padding: 18px; border-radius: 18px; background: var(--accbg); margin-bottom: 14px; text-align: center; }
  .code b { font: 700 40px/1.1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; color: var(--acc); }
  .code small { color: var(--dim); }
  .empty { color: var(--dim); text-align: center; padding: 28px 0; }
  /* 弹出：外观、账号（电脑在右上角，手机从底部出来） */
  .scrim { position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .3s var(--hx-ease); }
  .pop { position: fixed; top: 60px; right: 12px; z-index: 20; width: 360px; max-height: calc(100vh - 76px); overflow: auto; padding: 22px; border-radius: 24px; background: var(--card-solid); box-shadow: 0 0 0 1px var(--edge), 0 30px 80px -20px var(--shade);
    opacity: 0; visibility: hidden; transform: translateY(-8px) scale(.97); transform-origin: top right; transition: opacity .25s var(--hx-ease), transform .45s var(--hx-spring), visibility 0s .45s; }
  .pop.show { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .pop h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--dim); }
  .pop h3 + * { margin-bottom: 20px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 11px; background: var(--fill); }
  .seg button { height: 32px; border: 0; border-radius: 9px; background: none; font-size: 14px; font-weight: 500; color: var(--dim); transition: background .25s var(--hx-ease), color .25s; }
  .seg button[aria-pressed="true"] { background: var(--card-solid); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
  .sw { display: flex; flex-wrap: wrap; gap: 12px; }
  .sw button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(128, 128, 128, .3) inset; transition: transform .3s var(--hx-spring); }
  .sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--card-solid), 0 0 0 4px var(--c); }
  .sw button:hover { transform: scale(1.12); }
  .bgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bgs button, .bgs label { position: relative; aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--b, var(--fill)) center / cover; box-shadow: 0 0 0 1px var(--edge) inset; font-size: 11px; color: var(--dim); display: grid; place-items: end center; padding-bottom: 4px; overflow: hidden; cursor: pointer; }
  .bgs [aria-pressed="true"] { box-shadow: 0 0 0 2px var(--card-solid), 0 0 0 4px var(--acc); }
  .bgs span { padding: 1px 6px; border-radius: 6px; background: var(--card-solid); }
  .rng { display: flex; align-items: center; gap: 12px; } .rng input { flex: 1; accent-color: var(--acc); } .rng output { min-width: 3em; text-align: right; font-weight: 600; font-size: 14px; }
  .who-top { display: grid; justify-items: center; gap: 6px; text-align: center; padding-bottom: 16px; margin-bottom: 8px; border-bottom: 1px solid var(--edge); }
  .who-top b { font-size: 21px; } .who-top small { color: var(--dim); word-break: break-all; font-size: 14px; }
  .rows { display: grid; margin-bottom: 14px; }
  .rows > * { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--edge); background: none; text-align: left; font-size: 15px; }
  .rows > * > span:first-child { color: var(--dim); min-width: 4.5em; } .rows > * > :nth-child(2) { flex: 1; text-align: right; word-break: break-all; }
  .rows > button:hover { color: var(--acc); }
  .f { display: grid; gap: 10px; }
  .f input, .f select { height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card-solid); outline: none; transition: border-color .2s, box-shadow .2s; }
  .f input:focus, .f select:focus { border-color: var(--acc); box-shadow: 0 0 0 4px var(--ring); }
  .f .btn { height: 44px; }
  #shareT { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card-solid); font: inherit; font-size: 15px; line-height: 1.6; resize: none; outline: none; }
  .msg { min-height: 1.2em; margin: 0; color: var(--bad); font-size: 13px; }
  dialog { width: min(400px, calc(100vw - 32px)); padding: 34px 28px 26px; border: 0; border-radius: 28px; background: var(--card-solid); color: var(--ink); box-shadow: 0 40px 100px -30px var(--shade); }
  dialog[open] { animation: pop .5s var(--hx-spring); }
  dialog::backdrop { background: rgba(0, 0, 0, .3); backdrop-filter: blur(6px); }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  dialog img { display: block; width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px; }
  dialog h2 { margin: 0 0 22px; font-size: 24px; text-align: center; font-weight: 700; }
  #lseg { margin-bottom: 18px; } .f[hidden], .seg[hidden] { display: none; }
  .gh { background: #24292f !important; color: #fff !important; } .gh svg { width: 18px; height: 18px; fill: #fff; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; } .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--edge); }
  /* 管理卡片点开的面板：电脑在中间，手机从底部出来 */
  dialog.sheet { width: min(820px, calc(100vw - 48px)); max-width: none; max-height: min(880px, calc(100dvh - 48px)); padding: 0; overflow: hidden; }
  dialog.sheet[open] { display: flex; flex-direction: column; }
  .sh-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px 28px; border-bottom: 1px solid var(--edge); }
  dialog .sh-h h2 { flex: 1; margin: 0; text-align: left; font-size: 24px; }
  .sh-b { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 22px 28px 28px; }
  .sh-b .cl, .sh-b .panel { background: var(--fill); box-shadow: none; animation: none; }
  .f.frow { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; } .frow > input, .frow > select { flex: 1 1 220px; min-width: 0; } .frow .btn { flex: none; }
  .toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 40; top: auto; right: auto; margin: 0; border: 0; overflow: visible; transform: translate(-50%, 16px); padding: 12px 20px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .3s var(--hx-ease), transform .5s var(--hx-spring); max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 640px) {
    .acct b { display: none; } .cur { font-size: 16px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
    .tiles { grid-template-columns: repeat(2, 1fr); gap: 12px; } .tile { min-height: 148px; padding: 20px 18px 18px; border-radius: 24px; gap: 14px; } .tile b { font-size: 18px; } .tile .ic { width: 50px; height: 50px; border-radius: 13px; } .tile .ic svg { width: 26px; height: 26px; } .tile .go { display: none; }
    .pop { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 86vh; border-radius: 26px 26px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transform-origin: bottom; }
    .pop.show { transform: none; } .scrim.show { opacity: 1; pointer-events: auto; }
    .cl { grid-template-columns: 1fr; } .cl .acts { flex-wrap: wrap; }
    .tile .sum { margin-top: -8px; padding-right: 0; font-size: 13px; }
    dialog.sheet { width: 100%; max-height: 92dvh; margin: auto 0 0; border-radius: 26px 26px 0 0; }
    dialog.sheet[open] { animation: up .5s var(--hx-spring); }
    .sh-h { padding: 14px 10px 12px 20px; } .sh-b { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  }
  @keyframes up { from { transform: translateY(100%); } }
  /* 平板：一行 3 张；电脑宽屏：用满宽度，一行 6 张，标题靠左 */
  @media (min-width: 641px) and (max-width: 1199px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1024px) {
    #home { padding: 0 clamp(32px, 4vw, 72px) 64px; }
    .hero { display: grid; grid-template-columns: auto 1fr; column-gap: 22px; align-items: center; text-align: left; padding: 52px 0 36px; }
    .hero img { grid-row: span 2; width: 76px; }
    .hero h1 { margin: 0; font-size: 46px; } .hero p { margin: 4px 0 0; font-size: 20px; }
    .sec { margin: 48px 0 16px; } .sec h2 { font-size: 16px; }
  }
  @media (min-width: 1200px) { .wrap { width: min(1600px, 100%); } .tiles { grid-template-columns: repeat(6, 1fr); } }
</style>
</head>
<body>
<header>
  <button class="brand" id="brand" type="button"><img src="logo.jpg" alt=""><span>华夏工具</span></button>
  <button class="back" id="back" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>首页</button>
  <div class="cur" id="cur"></div>
  <div class="sp"></div>
  <button class="ibtn" id="lookBtn" type="button" aria-label="外观" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg></button>
  <div id="who"></div>
</header>
<div class="scrim" id="scrim"></div>
<section class="pop" id="pop" aria-label="账号"></section>
<section class="pop" id="look" aria-label="外观"></section>
<main id="main">
  <section id="home">
    <div class="wrap">
      <div class="hero"><img src="logo.jpg" alt=""><h1>华夏工具</h1><p id="hi"></p></div>
      <div id="tiles"></div>
      <div id="mgmt"></div>
    </div>
  </section>
</main>

  if (A) html += codeBox(A.label, A.code, '', '<button class="btn sm" id="aShare">分享给' + (t ? '老师' : g ? '朋友' : '学生') + '</button>');
  C = C && C.filter(function (c) { return c.role === role; });
  html += !C ? '<p class="empty">加载中…</p>' : !C.length ? '' : '<table><tr><th>码</th><th>' + (t || g ? '给' : '班级') + '</th><th>已用</th><th></th></tr>' + C.map(function (c) {
    return '<tr><td><b class="mono">' + esc(c.code) + '</b></td><td>' + esc(c.class_name || c.note || '') + '</td><td>' + c.used + ' / ' + c.max_uses + '</td><td class="ra">' +
      (c.live ? '<button class="btn link sm" data-share="' + esc(c.code) + '" data-role="' + c.role + '">分享</button><button class="btn link bad sm" data-rev="' + esc(c.code) + '">撤销</button>' : '<span class="pill">已失效</span>') + '</td></tr>';
  }).join('') + '</table>';
  box.innerHTML = html;
  var made = function (code, label) { ST.aCode = { code: code, role: role, label: label }; box.scrollTop = 0; codesChanged(); };
  if ($('cGo')) $('cGo').onclick = async function () {
    var b = $('cGo'); b.disabled = true;
    try {
      if (g) {
        var gn = $('cNote').value.trim(), u = +$('cUses').value; if (!(u >= 1 && u <= 200 && u % 1 === 0)) throw new Error('可用次数填 1～200');
        made(await HX.rpc('hx_new_code', { p_role: 'guest', p_class: null, p_note: gn, p_uses: u }), '好友码 · ' + (gn ? gn + ' · ' : '') + u + ' 次，撤销前一直有效');
      }
      else if (t) { var n = $('cNote').value.trim(); made(await HX.rpc('hx_new_code', { p_role: 'teacher', p_class: null, p_note: n }), '教师码 · ' + (n || '一码一用')); }
      else { var o = $('cCls').selectedOptions[0]; ST.sCls = +o.value; made(await HX.rpc('hx_new_code', { p_role: 'student', p_class: +o.value, p_note: '' }), o.textContent + ' · 课堂码 · 4 小时有效'); }
    } catch (e) { toast(e.message); b.disabled = false; }
  };
  if ($('aShare')) $('aShare').onclick = function () { shareCode(A.code, A.role); };
  box.querySelectorAll('[data-share]').forEach(function (b) { b.onclick = function () { shareCode(b.dataset.share, b.dataset.role); }; });
  box.querySelectorAll('[data-rev]').forEach(function (b) { b.onclick = async function () { if (!sure(b, '确认撤销？')) return; try { await HX.rpc('hx_revoke_code', { p_code: b.dataset.rev }); if (ST.aCode && ST.aCode.code === b.dataset.rev) ST.aCode = null; toast('已撤销'); loadCodes(); } catch (e) { toast(e.message); } }; });
}
// 管理员面板（开发者）：填邮箱任命，或在教师名单里点按钮
function sheetAdm() {
  var box = $('shB'), T = ST.teachers;
  box.innerHTML = '<div class="f frow"><input id="aMail" type="email" placeholder="老师的登录邮箱"><button class="btn" id="aGo">设为管理员</button></div>' + (T === null ? '<p class="empty">加载中…</p>' : T.err ? '<p class="empty">名单读取失败：' + esc(T.err) + '</p>' : !T.length ? '<p class="empty">还没有教师</p>' :
    '<table><tr><th>老师</th><th>邮箱</th><th></th></tr>' + T.map(function (t) {
      return '<tr><td>' + esc(t.name) + '</td><td class="dim">' + esc(t.email || '') + '</td><td class="ra">' + (t.is_dev ? '<span class="pill dev">开发者</span>'
        : '<button type="button" class="chip" data-adm="' + esc(t.email || '') + '" aria-pressed="' + !!t.is_admin + '">' + (t.is_admin ? '管理员 ✓' : '设为管理员') + '</button>') + '</td></tr>';
    }).join('') + '</table>');
  $('aGo').onclick = async function () {
    var em = $('aMail').value.trim(); if (!em) return toast('先填邮箱');
    try { var r = await HX.rpc('hx_set_admin', { p_email: em, p_on: true }); toast(typeof r === 'string' && r ? r : '已设为管理员'); loadTeachers(); } catch (e) { toast(e.message); }
  };
  box.querySelectorAll('[data-adm]').forEach(function (b) {
    b.onclick = async function () {
      var on = b.getAttribute('aria-pressed') !== 'true';
      if (!b.dataset.adm) return toast('这个账号没有邮箱，没法设置');
      if (!sure(b, on ? '确认设为管理员？' : '确认取消？')) return;
      try { var r = await HX.rpc('hx_set_admin', { p_email: b.dataset.adm, p_on: on }); toast(typeof r === 'string' && r ? r : '已更新'); loadTeachers(); } catch (e) { toast(e.message); }
    };
  });
}
async function loadCodes() { try { ST.codes = await HX.rpc('hx_my_codes') || []; } catch (e) { ST.codes = []; toast('邀请码读取失败：' + e.message); } renderMgmt('codes'); }
async function loadTeachers() { try { ST.teachers = await HX.rpc('hx_teachers') || []; } catch (e) { ST.teachers = { err: e.message }; } renderMgmt('adm'); }
// 名单：第一行加学生；每人可改学号姓名、删除（已开通或有成绩的标为退学，灰着放最后，可恢复）
var PEN = '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>', BIN = '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>';
function renderStu(cid) {
  var el = $('stu' + cid), list = ST.studs[cid], E = ST.stuEdit; if (!el) return;
  if (!list) { el.innerHTML = '<p class="empty">加载中…</p>'; return; }
  var inp = function (s) { return '<td><input class="ti" data-f="no" inputmode="numeric" maxlength="20" placeholder="学号" value="' + esc(s ? s.student_no : '') + '"></td><td><input class="ti" data-f="nm" maxlength="20" placeholder="姓名" value="' + esc(s ? s.name : '') + '"></td>'; };
  el.innerHTML = '<table><tr><th class="sq">序号</th><th>学号</th><th>姓名</th><th></th></tr><tr data-sid=""><td class="sq"></td>' + inp(null) + '<td class="ra"><button class="btn sm" data-save>添加</button></td></tr>' +
    list.map(function (s) {
      var sq = '<td class="sq">' + (s.seq < 1000 && !s.left_school ? s.seq : '') + '</td>';
      if (E === s.id) return '<tr data-sid="' + s.id + '">' + sq + inp(s) + '<td class="ra"><button class="btn sm" data-save>保存</button><button class="btn link sm ib" data-x aria-label="取消">' + svg('<path d="M6 6l12 12M18 6L6 18"/>') + '</button></td></tr>';
      return '<tr' + (s.left_school ? ' class="gone"' : '') + '>' + sq + '<td>' + esc(s.student_no) + '</td><td>' + esc(s.name) + ' ' +
        (s.left_school ? '<span class="pill">退学</span>' : (s.bound ? '<span class="pill acc">已开通</span>' : '') + (s.self_reg ? ' <span class="pill">自己注册</span>' : '')) + '</td><td class="ra">' +
        (s.left_school ? '<button class="btn link sm" data-back="' + s.id + '">恢复</button>'
          : '<button class="btn link sm ib" data-ed="' + s.id + '" aria-label="修改">' + svg(PEN) + '</button><button class="btn link sm ib bad" data-del="' + s.id + '" aria-label="删除">' + svg(BIN) + '</button>') + '</td></tr>';
    }).join('') + '</table>';
  var c = ST.classes.filter(function (x) { return x.id === cid; })[0];
  var done = async function (msg) { // 改完重读名单，班级人数跟着变
    ST.stuEdit = null; toast(msg);
    try { ST.studs[cid] = await HX.rpc('hx_class_students', { p_class: cid }); } catch (e) { toast(e.message); }
    var L = ST.studs[cid] || []; c.total = L.filter(function (s) { return !s.left_school; }).length; c.bound = L.filter(function (s) { return s.bound; }).length;
    sheetCls(); renderMgmt('none');
  };
  var save = async function (tr) {
    var b = tr.querySelector('[data-save]'), id = tr.dataset.sid ? +tr.dataset.sid : null; b.disabled = true;
    try { await HX.rpc('hx_student_save', { p_class: cid, p_id: id, p_no: tr.querySelector('[data-f="no"]').value, p_name: tr.querySelector('[data-f="nm"]').value }); await done(id ? '已保存' : '已添加'); }
    catch (e) { toast(e.message); b.disabled = false; }
  };
  el.querySelectorAll('[data-save]').forEach(function (b) { b.onclick = function () { save(b.closest('tr')); }; });
  el.querySelectorAll('.ti').forEach(function (i) { i.onkeydown = function (e) { if (e.key === 'Enter') save(i.closest('tr')); else if (e.key === 'Escape' && ST.stuEdit) { e.preventDefault(); e.stopPropagation(); ST.stuEdit = null; renderStu(cid); } }; });
  el.querySelectorAll('[data-x]').forEach(function (b) { b.onclick = function () { ST.stuEdit = null; renderStu(cid); }; });
  el.querySelectorAll('[data-ed]').forEach(function (b) { b.onclick = function () { ST.stuEdit = +b.dataset.ed; renderStu(cid); var f = el.querySelector('tr[data-sid="' + ST.stuEdit + '"] .ti'); if (f) f.focus(); }; });
  el.querySelectorAll('[data-del]').forEach(function (b) {
    b.onclick = async function () {
      if (!sure(b, '确认删除？')) return;
      try { var r = await HX.rpc('hx_student_remove', { p_id: +b.dataset.del }); await done(r === 'deleted' ? '已删除' : '已标为退学，记录保留'); } catch (e) { toast(e.message); }
    };
  });
  el.querySelectorAll('[data-back]').forEach(function (b) { b.onclick = async function () { try { await HX.rpc('hx_student_restore', { p_id: +b.dataset.back }); await done('已恢复'); } catch (e) { toast(e.message); } }; });
}
async function loadClasses() {
  try { var r = await Promise.all([HX.rpc('hx_my_classes'), HX.rpc('hx_my_guests').catch(function () { return []; })]); ST.classes = r[0] || []; ST.guests = r[1] || []; } catch (e) { ST.classes = []; toast('班级名单读取失败：' + e.message); }
  ST.clsOk = true; renderMgmt('cls');
}
var xlsxP = null;
function loadXLSX() { return xlsxP || (xlsxP = new Promise(function (ok, no) { var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = function () { xlsxP = null; no(new Error('表格组件加载失败')); }; document.head.appendChild(s); })); }
// 考勤表：第 2 行“学期：… 班级：…”，下面每行 序号 | 学号 | 姓名；也认其他表：一行里第一个 6～20 位数字当学号，右边一格当姓名
function parseRoster(wb, file) {
  var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }), head = [].concat.apply([], rows.slice(0, 4)).join(' ');
  var cls = (head.match(/班级[：:]\s*(\S+)/) || [])[1] || String(file).replace(/[（(].*$|\.\w+$/g, ''), term = (head.match(/学期[：:]\s*(\S+)/) || [])[1] || '';
  var list = [], seen = {};
  rows.forEach(function (r) {
    var i = r.findIndex(function (v) { return /^\d{6,20}$/.test(String(v).trim()); }), no = i >= 0 && String(r[i]).trim(), name = i >= 0 && String(r[i + 1] || '').trim();
    if (no && name && !seen[no]) { seen[no] = 1; var q = +String(r[i - 1] || '').trim(); list.push({ no: no, name: name, seq: q > 0 && q < 1000 ? q : list.length + 1 }); }
  });
  return { cls: cls, term: term, list: list };
}

$('brand').onclick = $('back').onclick = function () { show(null); };
addEventListener('hashchange', function () { var id = location.hash.slice(1); if (id !== (ST.tab || '')) show(id); });
function reloadTools() { for (var k in frames) { if (k !== ST.tab) { frames[k].remove(); delete frames[k]; } else frames[k].src = frames[k].src; } } // 工具页把登录记在内存里，换人后重新打开
async function refresh() {
  ST.me = null; ST.user = null; ST.uname = null; ST.classes = null; ST.guests = null; ST.clsOk = false; ST.studs = {}; ST.newCode = null; ST.edit = null; ST.codes = undefined; ST.teachers = undefined; ST.aCode = null;
  if (HX.in()) {
    try { var res = await Promise.all([HX.rpc('hx_me'), HX.user()]); ST.me = res[0]; ST.user = res[1]; HXTheme.setDev(ST.me && ST.me.dev); }
    catch (e) { if (e.status === 401) { await HX.out(); HXTheme.setDev(false); } }
  } else HXTheme.setDev(false);
  show(ST.tab || location.hash.slice(1));
  if (role() === '未开通' && ST.actFor !== HX.uid() && !$('login').open) { ST.actFor = HX.uid(); openLogin('', 'act'); } // 每个账号每次打开网页只自动弹一次
}
// 给嵌在框里的工具用：要登录时弹登录窗口、问身份、回首页
window.HXPortal = {
  login: function () { openLogin(); },
  me: function () { return ST.me; },
  home: function () { show(null); },
  toast: toast
};

$('lf').onsubmit = async function (e) {
  e.preventDefault(); $('lmsg').textContent = '';
  try { await HX.signIn($('lid').value, $('lpw').value); $('login').close(); $('lpw').value = ''; was = true; reloadTools(); refresh(); }
  catch (err) { $('lmsg').textContent = err.message; }
};
$('lgh').onclick = function () { HX.github(); };
$('shareC').onclick = function () { $('shareT').select(); (navigator.clipboard ? navigator.clipboard.writeText($('shareT').value) : Promise.reject()).then(function () { toast('已复制'); }, function () { try { document.execCommand('copy'); toast('已复制'); } catch (e) { } }); };
$('shareX').onclick = function () { $('share').close(); };
$('lx').onclick = function () { $('login').close(); };
$('lseg').querySelectorAll('button').forEach(function (b) { b.onclick = function () { if (ST.lm !== b.dataset.m) { ST.lm = b.dataset.m; ST.reg = null; $('lmsg').textContent = ''; renderLogin(); focusLogin(); } }; });
// 注册 / 开通：先查邀请码（没登录也能查）；教师码再填账号名（注册还要名字），课堂码再选班级、填学号姓名（账号名就是学号）；
// 注册先让数据库把开通条件全检查一遍，通过了才建账号，然后马上开通
$('rf').onsubmit = async function (e) {
  e.preventDefault();
  var go = $('rgo'), msg = $('rmsg'), R = ST.reg, v = function (id) { return $(id) ? $(id).value.trim() : ''; };
  msg.textContent = ''; go.disabled = true;
  try {
    if (!R) {
      var code = v('rcode').toUpperCase(); if (!code) throw new Error('请填写邀请码');
      var ci = await HX.rpc('hx_code_info', { p_code: code });
      if (!ci) throw new Error('邀请码无效、已撤销或已用完');
      ST.reg = { code: code, role: ci.role, classes: ci.classes || [] }; renderLogin(); focusLogin(); return;
    }
    var t = R.role === 'teacher', un = v('run').toLowerCase(), nm = v('rnm'), no = v('rno');
    if (t && !/^[a-z0-9_.-]{3,32}$/.test(un)) throw new Error(un ? '账号名用 3～32 位字母、数字' : '请填写账号名');
    var g = R.role === 'guest', gc = v('rgc');
    if (!t && !g && !$('rcls')) throw new Error('这个课堂码的班级已经删除了，请找老师');
    if (g && !gc) throw new Error('请填写班级');
    if (!t && !/^\d{6,20}$/.test(no)) throw new Error('学号应为 6～20 位数字');
    if ((!t || ST.lm === 'reg') && !nm) throw new Error(t ? '请填写名字' : '请填写姓名');
    var args = { p_code: R.code, p_class: t || g ? null : +$('rcls').value, p_no: t ? null : no, p_name: t ? null : nm, p_username: t ? un : null, p_guest_class: g ? gc : null };
    if (ST.lm === 'reg') {
      var pw = $('rpw').value; if (pw.length < 6) throw new Error('密码至少 6 位'); if (pw !== $('rpw2').value) throw new Error('两次输的密码不一样');
      await HX.rpc('hx_redeem_check', args, false);
      await HX.signUp(t ? un : no, pw, nm); was = true;
    }
    var r = await HX.rpc('hx_redeem', args);
    $('login').close(); toast(r === 'teacher' ? '已开通教师账号' : '已开通，欢迎 ' + nm); reloadTools(); refresh();
  } catch (err) {
    msg.textContent = err.message; go.disabled = false;
    if (ST.lm === 'reg' && HX.in()) { ST.lm = 'act'; ST.actFor = HX.uid(); renderLogin(); $('rmsg').textContent = '账号已建好，但开通没成功：' + err.message; refresh(); } // 账号建了但开通失败：改成开通窗口重试
  }
};
// 嵌在下面的工具登录、退出时（同一网站共用 localStorage），这里跟着变
var was = HX.in();
addEventListener('storage', function (e) { if (e.key !== 'paike-session') return; var n = HX.in(); if (n !== was) { was = n; reloadTools(); refresh(); } });
var gerr = HX.grab(); was = HX.in();
refresh();
if (gerr) openLogin(gerr);
</script>
