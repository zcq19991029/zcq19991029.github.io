<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>华夏工具已迁到新地址</title>
<!-- 2026-11-28：华夏工具从 GitHub Pages 迁到自建服务器，原来直连 Supabase 的旧站已停用。
     这一页只做一件事：把旧书签、旧深层链接原样带到新站的同一个路径上。
     新站目录结构与此站一致（同一套打包产物），所以 /kaoshi/ 会落到新站的 /kaoshi/。 -->
<meta http-equiv="refresh" content="1;url=https://zcq1029zjy1216.cn/">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 16px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #1f2328; padding: 24px;
  }
  .card {
    max-width: 520px; width: 100%; background: #fff; border-radius: 14px;
    padding: 32px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
    text-align: center;
  }
  h1 { font-size: 19px; margin: 0 0 14px; font-weight: 600; }
  p { margin: 0 0 10px; color: #57606a; font-size: 14px; }
  a.go {
    display: inline-block; margin-top: 10px; padding: 10px 22px; border-radius: 9px;
    background: #1f6feb; color: #fff; text-decoration: none; font-size: 15px; font-weight: 500;
  }
  a.go:hover { background: #1a5fd0; }
  code { font-size: 13px; background: #f0f1f3; padding: 2px 6px; border-radius: 5px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .card { background: #161b22; box-shadow: none; border: 1px solid #30363d; }
    p { color: #9198a1; }
    code { background: #21262d; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>华夏工具已迁到新地址</h1>
  <p>原来的 GitHub Pages 版本已停用，正在把你带到新站。</p>
  <p><code>zcq1029zjy1216.cn</code></p>
  <a class="go" id="go" href="https://zcq1029zjy1216.cn/">手动前往</a>
  <p style="margin-top:16px;font-size:12px">如果书签打开的是某个工具，会自动落到新站对应的页面。</p>
</div>
<script>
(function () {
  var NEW = 'https://zcq1029zjy1216.cn';
  // 路径 + 查询串 + 锚点原样带过去：新站是同一套打包产物，目录结构一致
  var to = NEW + location.pathname + location.search + location.hash;
  document.getElementById('go').href = to;
  // refresh 用固定根地址兜底（有 JS 时这里立刻覆盖它，保留深层路径）
  setTimeout(function () { location.replace(to); }, 200);
})();
</script>
</body>
</html>
