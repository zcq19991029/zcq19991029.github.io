<!-- 华夏工具总入口 © 2026 zcq：首页是工具卡片（没登录只有“登录 / 注册”；按身份：学生只看到学生工具），教师首页下面是共用的“班级名单”；点开一个工具全屏用，左上角回首页。
     工具都在 zcq19991029.github.io 下，用 iframe 嵌进来。登录、切换账号、个人信息、外观只在这一页：子工具不再有自己的账号和主题界面，
     要登录时调 window.HXPortal.login()；被单独打开时 hx-theme.js 会跳回这里（见 hx-theme.js 的 data-tool）。
     账号：Supabase 华夏工具项目，localStorage paike-session 和各工具共用；身份由数据库 hx_me() 决定。
     脚本里不用反引号模板字符串（本机测试时整页当字符串注入到线上同源页面里）。 -->
<link rel="stylesheet" href="hx-theme.css?v=deb0cae">
<script src="hx-theme.js?v=deb0cae"></script>
<!-- 首页卡片上的像素小生物：pixelfx 的 12 个 critters（MIT），打包成一个 91 KB 的独立脚本。
     加载失败不影响首页——hx-critters.js 开头就有 window.PixelFX 存在性检查，没有就整段跳过。 -->
<script src="fx/pixelfx-critters.js?v=deb0cae" defer></script>
<script src="fx/hx-critters.js?v=deb0cae" defer></script>
<!-- 像素头像库（2026-11-04）：账号面板里除了传照片，还能从 200 多个像素动效里挑一个当头像。
     和上面 critters 同一套路：库（pixelfx-avatars.js）+ 渲染器（hx-avatar.js），都是 defer、
     不进首屏关键路径；不点「像素头像库」就一个动画都不跑。 -->
<script src="fx/pixelfx-avatars.js?v=deb0cae" defer></script>
<script src="fx/hx-avatar.js?v=deb0cae" defer></script>
<!-- 背景动效（2026-11-03）：12 种天气氛围特效铺在背景层，外观面板里选；加载失败或没选就完全不加载渲染器 -->
<script src="fx/pixelfx-weather.js?v=deb0cae" defer></script>
<script src="fx/hx-weather.js?v=deb0cae" defer></script>
<style>
  * { box-sizing: border-box; }

  @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } } /* 小于 16px 苹果手机点输入框会自动放大且不回去 */
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  /* 顶栏：苹果官网的毛玻璃导航 */
  header { flex: none; position: relative; z-index: 10; height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 max(12px, env(safe-area-inset-left)); background: var(--bar); backdrop-filter: var(--hx-blur); -webkit-backdrop-filter: var(--hx-blur); border-bottom: 1px solid var(--edge); }
  .brand { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 10px 0 4px; border: 0; border-radius: 12px; background: none; font-weight: 600; font-size: 17px; white-space: nowrap; }

  .back { display: none; align-items: center; gap: 2px; height: 36px; padding: 0 12px 0 4px; border: 0; border-radius: 99px; background: none; color: var(--acc); font-size: 17px; white-space: nowrap; }
  .back svg { width: 22px; height: 22px; stroke-width: 2.2; }
  .back:hover { background: var(--hov); }
  .cur { display: none; position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 17px; white-space: nowrap; pointer-events: none; }
  body.tool .back, body.tool .cur { display: flex; } body.tool .brand { display: none; }
  .sp { flex: 1; }
  .ibtn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--ink); opacity: .8; transition: background .2s var(--hx-ease), opacity .2s; }
  .ibtn:hover, .ibtn[aria-expanded="true"] { background: var(--fill); opacity: 1; }
  .acct { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; border: 0; border-radius: 99px; background: none; white-space: nowrap; }
  .acct:hover, .acct[aria-expanded="true"] { background: var(--fill); }
  .acct b { max-width: 9em; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 500; padding-right: 8px; }
  .av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: var(--on-acc); background: var(--acc) center / cover; }
  .av.lg { width: 72px; height: 72px; font-size: 30px; }
  .avl { cursor: pointer; border-radius: 50%; } .avl:hover { filter: brightness(.9); }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--fill); color: var(--dim); }
  .pill.acc { background: var(--accbg); color: var(--acc); }
  .pill.dev { color: #fff; background: linear-gradient(120deg, #f59e0b, #ec4899); box-shadow: 0 4px 14px -6px #ec4899; }
  .pill.admin { color: #fff; background: linear-gradient(120deg, #2563eb, #06b6d4); box-shadow: 0 4px 14px -6px #2563eb; }
  .acct .pill { margin: 0 4px 0 -2px; } .hero p .pill { vertical-align: middle; margin-left: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; } .grid2 .panel { margin: 0 0 14px; }
  .panel h3 { margin: 0 0 12px; font-size: 19px; font-weight: 600; } .dim { color: var(--dim); } .ra { text-align: right; white-space: nowrap; } .mono { font-family: ui-monospace, Consolas, monospace; letter-spacing: .06em; }
  .lbtn { height: 32px; padding: 0 16px; border: 0; border-radius: 99px; background: var(--acc); color: var(--on-acc); font-size: 14px; font-weight: 500; }
  main { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  body.zen header { display: none; }
  body.hxfull header { display: none; } body.hxfull main { position: fixed; inset: 0; height: 100vh; height: 100dvh; z-index: 50; }
  /* 苹果手机的 iframe 会按里面内容撑宽，width:1px + min-width:100% 把它钉在屏幕宽。
     2026-11-02：不在前台的 iframe 一律 display:none。原来只写 visibility:hidden + opacity:0，
     元素不画了但里面的 JS、定时器、requestAnimationFrame 照样跑（接线仿真有画布渲染循环），
     开着三四个工具就是三四个循环在后台抢 GPU，最后点哪个都崩。display:none 才会真正让它停。 */
  main iframe { position: absolute; inset: 0; width: 1px; min-width: 100%; max-width: 100%; height: 100%; border: 0; background: var(--bg); display: none; }
  main iframe.on { display: block; animation: fin .22s var(--hx-ease) both; }
  @keyframes fin { from { opacity: 0; } to { opacity: 1; } }
  html.hx-bg main iframe { background: transparent; }
  /* ── 加载动效（2026-11-03 用户要求「刷新加载动画缺一个 包括其他界面」）──
     统一做成「像素方块波浪」：7 个小方块错峰起伏，像一条跑动的像素带。
     为什么用纯 CSS 而不是 canvas：这是全站显示频率最高、生命周期最短的动画，
     CSS 动画走合成线程，不占主线程、不用 rAF，和首页小生物那套「全局只有一个循环」的规矩不冲突。
     方块尺寸用 clamp(9px, 2.4vw, 13px)：手机上是 8~9px，一体机大屏封顶 12px，
     不会在小屏上糊成一片、也不会在大屏上细得像根线。 */
  .hx-px { display: inline-flex; align-items: flex-end; gap: clamp(3px, .7vw, 5px); height: calc(clamp(9px, 2.4vw, 13px) * 2.2); }
  .hx-px i { width: clamp(9px, 2.4vw, 13px); height: clamp(9px, 2.4vw, 13px); border-radius: 2px;
    background: linear-gradient(180deg, var(--acc), var(--acc2));
    /* 一点落影：浅色背景（#f5f5f7 默认主题）下方块本来会糊成一片淡绿，
       加一层同色系的淡影之后才有「浮在桌面上跳」的实体感。 */
    box-shadow: 0 5px 12px -6px var(--acc);
    animation: hxPx 1.15s var(--hx-ease) infinite; animation-delay: calc(var(--i) * 90ms); }
  .hx-px i:nth-child(2n) { background: linear-gradient(180deg, var(--acc2), var(--acc3)); }
  @keyframes hxPx {
    /* 起始透明度不能太低：原来写 .35，在浅灰背景上几乎看不见方块（截图上只剩一抹淡绿）。
       提到 .55 起跳、1 到顶，起伏才看得出来，同时又不刺眼。
       位移用 -110%（相对方块自身高度）而不是写死的 px —— 这样同一套动画在首屏（大方块）
       和「正在加载」药丸（小方块）里都能用，不用各写一份。 */
    0%, 100% { transform: translateY(0); opacity: .55; }
    35% { transform: translateY(-110%); opacity: 1; }
    60% { transform: translateY(0); opacity: .7; }
  }

  /* 首屏加载层：刷新页面时先出这个，脚本跑完再淡出。
     它必须在样式生效的第一帧就可见（样式是内联的，所以不会白屏闪一下）。 */
  #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
    background: var(--bg); color: var(--ink);
    /* 离场：内容先走（0~120ms），背景紧跟（60~280ms），两段**重叠**着撤。
       踩过的坑：第一版让内容先淡完、背景再等 280ms 才撤，中间有约 200ms 是「只有一块底色、
       什么内容都没有」的纯空白（实测截图 2.7KB，几乎是一张纯色图）——学生看到的是
       「动画 → 白一下 → 首页」，比不做动画还难看。重叠之后画面是连续过渡，没有空档。 */
    transition: opacity .22s var(--hx-ease) .06s, visibility .3s;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #boot > * { transition: opacity .12s var(--hx-ease); }
  #boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot.done > * { opacity: 0; }
  #boot img { width: clamp(56px, 13vw, 76px); aspect-ratio: 1; border-radius: 22%; object-fit: cover;
    box-shadow: 0 12px 32px -14px var(--shade, rgba(0,0,0,.35)); animation: bootIn .7s var(--hx-spring) both; }
  #boot b { font: 600 clamp(17px, 4.2vw, 21px)/1 var(--hx-font-d, var(--hx-font)); letter-spacing: .18em; text-indent: .18em; color: var(--ink);
    animation: bootIn .7s .08s var(--hx-spring) both; }
  #boot .hx-px { animation: bootIn .7s .16s var(--hx-spring) both; }
  @keyframes bootIn { from { opacity: 0; transform: translateY(10px) scale(.94); } }
  /* 一体机 / 省电：不做动画，直接给静态帧（这台机器本来就在省电模式，动画越少越好） */
  html.hx-lite #boot .hx-px i { animation: none; opacity: .8; }
  @media (prefers-reduced-motion: reduce) {
    #boot img, #boot b, #boot .hx-px { animation: none; }
    .hx-px i { animation: none; opacity: .8; transform: none; }
  }

  /* 弱网下点了工具到页面出来之间要等几秒，给个「正在加载」的提示，免得以为卡死 */
  .loadtip { position: absolute; left: 50%; top: 46%; z-index: 3; display: none; align-items: center; gap: 10px;
    transform: translate(-50%, -50%); padding: 12px 20px; border-radius: 99px; background: var(--card); color: var(--ink);
    font-size: 14px; box-shadow: 0 18px 40px -18px rgba(0,0,0,.35); border: 1px solid var(--edge); pointer-events: none; }
  .loadtip.on { display: inline-flex; animation: pop .22s var(--hx-ease) both; }
  /* 工具加载中的转圈改成同一套像素方块，和首屏加载、和小生物是一条视觉语言。
     药丸里的方块要比首屏小一档，并且给足跳动空间 —— 否则方块向上跳时会顶出圆角外面。
     文字必须 nowrap：第一版没写，手机上「正在加载 · 接线仿真」被压成两行，药丸变成一个方块疙瘩。 */
  .loadtip .hx-px { height: 15px; gap: 3px; }
  .loadtip .hx-px i { width: 8px; height: 8px; border-radius: 1.5px; box-shadow: none; }
  .loadtip b { white-space: nowrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 首页 */
  #home { position: absolute; inset: 0; overflow-y: auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom, 0px)); scroll-behavior: smooth; }
  body.tool #home { visibility: hidden; content-visibility: hidden; } /* 打开工具后首页整棵子树不参与渲染，只留盒子占位（滚动位置不丢） */
  .wrap { width: min(1024px, 100%); margin: 0 auto; }
  .hero { text-align: center; padding: clamp(40px, 9vw, 96px) 0 clamp(28px, 5vw, 52px); }
  .hero img { width: clamp(64px, 12vw, 88px); aspect-ratio: 1; border-radius: 22%; object-fit: cover; box-shadow: 0 12px 32px -14px var(--shade); }
  .hero h1 { margin: 18px 0 0; font: 700 clamp(40px, 8vw, 64px)/1.06 var(--hx-font-d); letter-spacing: -.02em; }
  .hero p { margin: 10px 0 0; font-size: clamp(19px, 3vw, 24px); color: var(--dim); font-weight: 500; min-height: 1.4em; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: 16px; }
  /* 首页工具卡。
     ── 2026-11-02 大改：不再是「玻璃文件夹」──
     原来是：后片（.tile 本体，左上伸出一个舌片）+ 开口（top 44% 露出「照片位」）+ 前片（::after 玻璃）+
     拇指缺口（mask）+ 折角。照的是 概念片/玻璃文件夹/ 那版对照稿，本来为了给每张卡上部留一块照片位。
     问题是：**首页根本没有照片**。开口露出来的只是背景图，于是在每张卡中间横切出一道很怪的分界线，
     右侧还挂一道弧形的亮边——用户 2026-11-02 的原话是「上面目前是很诡异的莫名其妙的突出」。
     舌片先撤了，但那道横线是「开口」这条结构线，撤掉舌片它反而更明显（上面少了东西，下面一道杠）。
     现在整张卡就是一块完整的玻璃：去掉开口（前片从顶铺到底）、去掉缺口、去掉折角，
     卡片上端那个位置交给像素小生物（.fxc）。要重建「文件夹 / 照片位」那套观感，
     得先在 .tile 里真的放一张图，否则那条线永远是杂质。 */
  .tile { --fld-bg: rgba(0, 0, 0, .014); --fld-edge: rgba(0, 0, 0, .045); --fld-lip: rgba(255, 255, 255, .92);
    --fld-drop: 0 -6px 12px -12px rgba(0, 0, 0, .16); --fld-sheen: rgba(255, 255, 255, .55);
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; min-height: 172px; padding: 26px 24px 22px; border: 0; border-radius: 32px; background: var(--card); text-align: left; box-shadow: 0 0 0 1px var(--edge) inset;
    transition: transform .45s var(--hx-spring), box-shadow .45s var(--hx-spring); animation: rise .7s var(--hx-spring) both; }
  /* 舌片已于 2026-11-02 撤掉：用户指出卡片上端那个凸起「很诡异、莫名其妙」。
     现在这个位置由 .fxc（像素小生物）补上。留个空规则说明来历，避免以后有人照旧稿又加回来。 */
  .tile::before { content: none; display: none; }
  /* 玻璃面：从顶铺到底（原来是 top:44%，只盖下半张，上半露「照片位」——首页没照片，那条边就成了横贯卡片的怪线）。
     还留着 1px 的亮唇（border-radius 14px）和品牌色内晕（来自 Orbit 的静态光），
     但去掉了顶边那个拇指缺口 mask：缺口的意义是「让后片从开口里透一道」，
     没有开口之后它只会在卡片中上部啃出一个不规则的洞。
     box-shadow 里那道品牌色内晕来自 Orbit（见下方 Orbit 段）——压在玻璃里的静态光，不额外吃性能 */
  .tile::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    border-radius: inherit; background: var(--fld-bg);
    box-shadow: inset 0 .6px 0 var(--fld-lip), inset 0 2px 5px -2px var(--fld-sheen),
      inset 0 -24px 40px -30px color-mix(in srgb, var(--c2) 90%, transparent),
      0 0 0 .6px var(--fld-edge);
    transition: transform .45s var(--hx-spring), box-shadow .45s var(--hx-ease); }
  .tile > * { z-index: 1; } /* flex 项设 z-index 就成层，前片不会盖住图标和文字 */
  .tile:hover { transform: scale(1.02); box-shadow: 0 0 0 1px var(--edge) inset, 0 22px 50px -26px var(--shade); }
  .tile:hover::after { transform: translateY(-2px); }
  .tile:active { transform: scale(.98); transition-duration: .15s; }
  /* ── Orbit 设计语言：图标是一颗带着自己轨道的星 ──
     取自 概念片/index.html（Orbit 32 秒片），用户 2026-11-02 定的方向是「融进首页工具卡」，
     不是把那支片子上线。那边是 canvas 粒子场 + 体积雾，一帧几百个粒子，
     塞进首页 14 张卡就是 14 个渲染循环，希沃上必崩（见 2026-11-02 的崩溃修复）。
     所以只取「看得见的形」：一圈倾斜的轨道环 + 环上一颗光点 + 卡片底部内侧的品牌色光晕（已并进上面 .tile::after），
     全部用 transform / box-shadow 做，而且**默认停着不动，只有鼠标移上去那一张才转**——静止时零开销。 */
  .tile .ic { position: relative; width: 58px; height: 58px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: 0 8px 20px -10px var(--c2), 0 0 26px -8px color-mix(in srgb, var(--c2) 52%, transparent); }
  .tile .ic svg { position: relative; z-index: 2; width: 30px; height: 30px; stroke-width: 1.9; }
  .tile .ic::before, .tile .ic::after { content: ""; position: absolute; left: 50%; top: 50%; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; pointer-events: none; }
  .tile .ic::before { /* 轨道环：静态，只画一次 */
    border: 1px solid color-mix(in srgb, var(--c2) 58%, transparent); transform: rotateX(66deg);
    opacity: .45; transition: opacity .45s var(--hx-spring); }
  .tile .ic::after { /* 轨道上的光点：一条旋转的臂，亮点在臂尖 */
    background: radial-gradient(closest-side, #fff 0 40%, color-mix(in srgb, var(--c2) 88%, #fff) 40% 60%, transparent 64%) top center / 7px 7px no-repeat;
    transform: rotateX(66deg); animation: hx-orbit 3.6s linear infinite; animation-play-state: paused; opacity: 0; transition: opacity .45s var(--hx-spring); }
  .tile:hover .ic::before, .tile:focus-visible .ic::before { opacity: 1; }
  .tile:hover .ic::after, .tile:focus-visible .ic::after { opacity: 1; animation-play-state: running; }
  .tile.act .ic::before, .tile.act .ic::after { display: none; } /* “当前打开”那条横条不做轨道 */
  @keyframes hx-orbit { from { transform: rotateX(66deg) rotateZ(0deg); } to { transform: rotateX(66deg) rotateZ(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tile .ic::after { animation: none; } }
  /* 希沃 / 低配（hx-lite）：触屏的 :hover 会粘住不松，别让轨道一直转。

function smallPic(file) { // 头像缩成 128 像素的方图，存成小图片地址放在账号资料里
  return new Promise(function (ok, no) {
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function () {

    var me0 = null;
    try { me0 = await HX.rpc('hx_me'); } catch (e0) { }
    if (me0 && (me0.student || me0.teacher || me0.admin || me0.dev)) {
      ST.me = me0; $('login').close();
      toast(me0.student ? '你已经是' + (me0.student.class || '') + '的学生了，已登录' : '你之前已经注册好了，已登录');
      reloadTools(); refresh(); return;
    }
    var r;
    try { r = await HX.rpc('hx_redeem', args); }
    catch (re) {
      // 最后一道保险：开通失败但这个人其实已经有身份了（比如这个学号还挂在另一个班的名单里，
      // 数据库那边 user_id 唯一，绑第二行会报「账号名已有人用」）。这时候不该拦他，应该让他进去。
      var me1 = null;
      try { me1 = await HX.rpc('hx_me'); } catch (e1) { }
      if (me1 && (me1.student || me1.teacher || me1.admin || me1.dev)) {
        ST.me = me1; $('login').close();
        toast(me1.student ? '你已经是' + (me1.student.class || '') + '的学生了，已登录' : '你已经有账号了，已登录');
        reloadTools(); refresh(); return;
      }
      throw re;
    }
    $('login').close(); toast(r === 'teacher' ? '已开通教师账号' : '已开通，欢迎 ' + nm); reloadTools(); refresh();
  } catch (err) {
    msg.textContent = err.message; go.disabled = false;
    if (ST.lm === 'reg' && HX.in()) { ST.lm = 'act'; ST.actFor = HX.uid(); renderLogin(); $('rmsg').textContent = '账号已建好，但开通没成功：' + err.message; refresh(); } // 账号建了但开通失败：改成开通窗口重试
  }
};
// 嵌在下面的工具登录、退出时（同一网站共用 localStorage），这里跟着变
var was = HX.in();
addEventListener('storage', function (e) { if (e.key !== 'paike-session') return; var n = HX.in(); if (n !== was) { was = n; reloadTools(); refresh(); } });
var gerr = HX.grab(); was = HX.in();
refresh();
if (gerr) openLogin(gerr);
// ── 首屏加载层淡出 ──
// 两个时间点要一起满足：
//   ① 资源到位（window.load）后再撤 —— 否则页面还没画好就露出半成品；
//   ② **至少显示 520ms** —— 本地/教室局域网里首页往往 150ms 就加载完了，
//      不等就直接淡出，学生看到的是「白闪一下」，比没有加载动画更糟。
//      520ms 是「看得清一轮方块起伏、又不觉得被拖慢」的长度，实测低于 400ms 就像闪屏。
// 不等 refresh() 的接口返回：弱网下那个可能要几秒，让动画一直转反而更像卡死；
// 先把首页骨架露出来、名单随后填上，观感更好。
// 兜底：3 秒后无论如何都撤（万一某张图卡住，不能让它一直盖着页面）。
(function () {
  var b = $('boot'); if (!b) return;
  var off = false, MIN = 520;
  function doHide() {
    if (off) return; off = true;
    b.classList.add('done');
    setTimeout(function () { if (b.parentNode) b.remove(); }, 600); // 淡出 0.38s 后移出 DOM，别留着挡点击
  }
  function hide() {
    // performance.now() 从导航开始计时，正好是「加载层已经显示了多久」
    var left = MIN - (window.performance && performance.now ? performance.now() : MIN);
    setTimeout(doHide, Math.max(0, left));
  }
  if (document.readyState === 'complete') hide();
  else addEventListener('load', hide);
  setTimeout(doHide, 3000);
})();
</script>
