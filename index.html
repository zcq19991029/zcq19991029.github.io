<style>

  main { flex: 1; position: relative; min-height: 0; }

      if (i >= 0) tools.splice(i, 1); else tools.push(t);
      c.tools = tools; b.setAttribute('aria-pressed', i < 0);
      try { await HX.rpc('hx_class_tools', { p_class: c.id, p_tools: tools }); } catch (e) { toast(e.message); loadClasses(); }
    };
  });
  box.querySelectorAll('[data-open]').forEach(function (b) {
    b.onclick = async function () {
      var id = +b.dataset.open; ST.open = ST.open === id ? null : id; renderTeach();
      if (ST.open && !ST.studs[id]) { try { ST.studs[id] = await HX.rpc('hx_class_students', { p_class: id }); } catch (e) { ST.studs[id] = []; toast(e.message); } if ($('stu' + id)) $('stu' + id).innerHTML = stuTable(ST.studs[id]); }
    };
  });
  var top = function () { $('home').scrollTo({ top: $('teach').offsetTop - 20 }); };
  box.querySelectorAll('[data-code]').forEach(function (b) {
    b.onclick = async function () {
      var c = ST.classes.filter(function (x) { return x.id === +b.dataset.code; })[0];
      try { ST.newCode = { code: await HX.rpc('hx_new_code', { p_role: 'student', p_class: c.id, p_note: '' }), cls: c.name + ' · 课堂码', role: 'student' }; renderTeach(); top(); } catch (e) { toast(e.message); }
    };
  });
  renderAdmin();
}
// ---------- 管理（管理员、开发者，放在首页最后）：发教师码、学生码，看发过的码；开发者再任命管理员 ----------
function shareCode(code, role) {
  var t = (role === 'teacher' ? '华夏工具教师邀请码：' : '华夏工具课堂码：') + code + '\n打开 ' + location.origin + '/ ，登录后点右上角头像，填写邀请码开通。';
  if (navigator.share) return navigator.share({ text: t }).catch(function () { });
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('已复制，发给对方就行'); }, function () { prompt('复制下面的内容发给对方', t); });
}
function renderAdmin() {
  var box = $('admin'), m = ST.me;
  if (!m || !m.admin) { box.innerHTML = ''; return; }
  if (ST.codes === undefined) { ST.codes = null; loadCodes(); }
  if (m.dev && ST.teachers === undefined) { ST.teachers = null; loadTeachers(); }
  var A = ST.aCode, cls = ST.classes || [];
  var html = '<div class="sec"><h2>管理</h2>' + badge() + '</div>';
  if (A) html += '<div class="code"><small>' + esc(A.label) + '</small><b>' + esc(A.code) + '</b><button class="btn sm" id="aShare">分享给' + (A.role === 'teacher' ? '老师' : '学生') + '</button></div>';
  html += '<div class="grid2"><div class="panel f"><h3>教师邀请码</h3><input id="tNote" maxlength="30" placeholder="给谁（备注）"><button class="btn" id="tGo">生成</button></div>' +
    '<div class="panel f"><h3>学生课堂码</h3>' + (cls.length ? '<select id="sCls">' + cls.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select><button class="btn" id="sGo">生成</button>'
      : '<p class="empty" style="padding:8px 0">先在上面“班级”导入考勤表</p>') + '</div></div>';
  var C = ST.codes;
  html += '<div class="panel"><h3>发过的码</h3>' + (C === null ? '<p class="empty">加载中…</p>' : !C.length ? '<p class="empty">还没有</p>' :
    '<table><tr><th>码</th><th>给</th><th>已用</th><th></th></tr>' + C.map(function (c) {
      return '<tr><td><b class="mono">' + esc(c.code) + '</b></td><td>' + (c.role === 'teacher' ? '教师' : '学生') + (c.class_name || c.note ? ' · ' + esc(c.class_name || c.note) : '') + '</td><td>' + c.used + ' / ' + c.max_uses + '</td><td class="ra">' +
        (c.live ? '<button class="btn link sm" data-share="' + esc(c.code) + '" data-role="' + c.role + '">分享</button><button class="btn link bad sm" data-rev="' + esc(c.code) + '">撤销</button>' : '<span class="pill">已失效</span>') + '</td></tr>';
    }).join('') + '</table>') + '</div>';
  if (m.dev) {
    var T = ST.teachers;
    html += '<div class="panel"><h3>管理员</h3><div class="f" style="margin-bottom:10px"><input id="aMail" type="email" placeholder="老师的登录邮箱"><button class="btn" id="aGo">设为管理员</button></div>' + (T === null ? '<p class="empty">加载中…</p>' : T.err ? '<p class="empty">名单读取失败：' + esc(T.err) + '</p>' : !T.length ? '<p class="empty">还没有教师</p>' :
      '<table><tr><th>老师</th><th>邮箱</th><th></th></tr>' + T.map(function (t) {
        return '<tr><td>' + esc(t.name) + '</td><td class="dim">' + esc(t.email || '') + '</td><td class="ra">' + (t.is_dev ? '<span class="pill dev">开发者</span>'
          : '<button type="button" class="chip" data-adm="' + esc(t.email || '') + '" aria-pressed="' + !!t.is_admin + '">' + (t.is_admin ? '管理员 ✓' : '设为管理员') + '</button>') + '</td></tr>';
      }).join('') + '</table>') + '</div>';
  }
  box.innerHTML = html;
  var made = function (code, role, label) { ST.aCode = { code: code, role: role, label: label }; ST.codes = undefined; renderAdmin(); $('admin').scrollIntoView({ behavior: 'smooth' }); };
  $('tGo').onclick = async function () { var n = $('tNote').value.trim(); try { made(await HX.rpc('hx_new_code', { p_role: 'teacher', p_class: null, p_note: n }), 'teacher', '教师码 · ' + (n || '一码一用')); } catch (e) { toast(e.message); } };
  if ($('sGo')) $('sGo').onclick = async function () { var o = $('sCls').selectedOptions[0]; try { made(await HX.rpc('hx_new_code', { p_role: 'student', p_class: +o.value, p_note: '' }), 'student', o.textContent + ' · 课堂码 · 4 小时有效'); } catch (e) { toast(e.message); } };
  if ($('aShare')) $('aShare').onclick = function () { shareCode(A.code, A.role); };
  box.querySelectorAll('[data-share]').forEach(function (b) { b.onclick = function () { shareCode(b.dataset.share, b.dataset.role); }; });
  box.querySelectorAll('[data-rev]').forEach(function (b) { b.onclick = async function () { if (!confirm('撤销 ' + b.dataset.rev + '？撤销后不能再用')) return; try { await HX.rpc('hx_revoke_code', { p_code: b.dataset.rev }); if (ST.aCode && ST.aCode.code === b.dataset.rev) ST.aCode = null; toast('已撤销'); loadCodes(); } catch (e) { toast(e.message); } }; });
  if ($('aGo')) $('aGo').onclick = async function () {
    var em = $('aMail').value.trim(); if (!em) return toast('先填邮箱');
    try { var r = await HX.rpc('hx_set_admin', { p_email: em, p_on: true }); toast(typeof r === 'string' && r ? r : '已设为管理员'); loadTeachers(); } catch (e) { toast(e.message); }
  };
  box.querySelectorAll('[data-adm]').forEach(function (b) {
    b.onclick = async function () {
      var on = b.getAttribute('aria-pressed') !== 'true';
      if (!b.dataset.adm) return toast('这个账号没有邮箱，没法设置');
      if (!confirm((on ? '把这位老师设为管理员？' : '取消这位老师的管理员？') + '\n' + b.dataset.adm)) return;
      try { var r = await HX.rpc('hx_set_admin', { p_email: b.dataset.adm, p_on: on }); toast(typeof r === 'string' && r ? r : '已更新'); loadTeachers(); } catch (e) { toast(e.message); }
    };
  });
}
async function loadCodes() { try { ST.codes = await HX.rpc('hx_my_codes') || []; } catch (e) { ST.codes = []; toast('邀请码读取失败：' + e.message); } renderAdmin(); }
async function loadTeachers() { try { ST.teachers = await HX.rpc('hx_teachers') || []; } catch (e) { ST.teachers = { err: e.message }; } renderAdmin(); }
function stuTable(list) {
  if (!list) return '<p class="empty">加载中…</p>';
  return '<table><tr><th>序号</th><th>学号</th><th>姓名</th><th></th></tr>' + list.map(function (s) { return '<tr><td>' + (s.seq < 1000 ? s.seq : '') + '</td><td>' + esc(s.student_no) + '</td><td>' + esc(s.name) + '</td><td>' + (s.bound ? '<span class="pill acc">已开通</span>' : '') + (s.self_reg ? ' <span class="pill">自己注册</span>' : '') + '</td></tr>'; }).join('') + '</table>';
}
async function loadClasses() { try { ST.classes = await HX.rpc('hx_my_classes'); } catch (e) { ST.classes = []; toast('班级名单读取失败：' + e.message); } renderTeach(); }
var xlsxP = null;
function loadXLSX() { return xlsxP || (xlsxP = new Promise(function (ok, no) { var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = function () { xlsxP = null; no(new Error('表格组件加载失败')); }; document.head.appendChild(s); })); }
// 考勤表：第 2 行“学期：… 班级：…”，下面每行 序号 | 学号 | 姓名；也认其他表：一行里第一个 6～20 位数字当学号，右边一格当姓名
function parseRoster(wb, file) {
  var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }), head = [].concat.apply([], rows.slice(0, 4)).join(' ');
  var cls = (head.match(/班级[：:]\s*(\S+)/) || [])[1] || String(file).replace(/[（(].*$|\.\w+$/g, ''), term = (head.match(/学期[：:]\s*(\S+)/) || [])[1] || '';
  var list = [], seen = {};
  rows.forEach(function (r) {
    var i = r.findIndex(function (v) { return /^\d{6,20}$/.test(String(v).trim()); }), no = i >= 0 && String(r[i]).trim(), name = i >= 0 && String(r[i + 1] || '').trim();
    if (no && name && !seen[no]) { seen[no] = 1; var q = +String(r[i - 1] || '').trim(); list.push({ no: no, name: name, seq: q > 0 && q < 1000 ? q : list.length + 1 }); }
  });
  return { cls: cls, term: term, list: list };
}

$('brand').onclick = $('back').onclick = function () { show(null); };
addEventListener('hashchange', function () { var id = location.hash.slice(1); if (id !== (ST.tab || '')) show(id); });
function reloadTools() { for (var k in frames) { if (k !== ST.tab) { frames[k].remove(); delete frames[k]; } else frames[k].src = frames[k].src; } } // 工具页把登录记在内存里，换人后重新打开
async function refresh() {
  ST.me = null; ST.user = null; ST.uname = null; ST.classes = null; ST.studs = {}; ST.newCode = null; ST.edit = null; ST.codes = undefined; ST.teachers = undefined; ST.aCode = null;
  if (HX.in()) {
    try { var res = await Promise.all([HX.rpc('hx_me'), HX.user()]); ST.me = res[0]; ST.user = res[1]; }
    catch (e) { if (e.status === 401) await HX.out(); }
  }
  show(ST.tab || location.hash.slice(1));
}
// 给嵌在框里的工具用：要登录时弹登录窗口、问身份、回首页
window.HXPortal = {
  login: function () { openLogin(); },
  me: function () { return ST.me; },
  home: function () { show(null); },
  toast: toast
};

$('lf').onsubmit = async function (e) {
  e.preventDefault(); $('lmsg').textContent = '';
  try { await HX.signIn($('lid').value, $('lpw').value); $('login').close(); $('lpw').value = ''; was = true; reloadTools(); refresh(); }
  catch (err) { $('lmsg').textContent = err.message; }
};
$('lgh').onclick = function () { HX.github(); };
$('lx').onclick = function () { $('login').close(); };
// 嵌在下面的工具登录、退出时（同一网站共用 localStorage），这里跟着变
var was = HX.in();
addEventListener('storage', function (e) { if (e.key !== 'paike-session') return; var n = HX.in(); if (n !== was) { was = n; reloadTools(); refresh(); } });
var gerr = HX.grab(); was = HX.in();
refresh();
if (gerr) openLogin(gerr);
</script>
