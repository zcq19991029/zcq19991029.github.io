<!-- 华夏工具总入口 © 2026 zcq：首页是工具卡片（没登录只有“登录 / 注册”；按身份：学生只看到学生工具），教师首页下面是共用的“班级名单”；点开一个工具全屏用，左上角回首页。
     工具都在 zcq19991029.github.io 下，用 iframe 嵌进来。登录、切换账号、个人信息、外观只在这一页：子工具不再有自己的账号和主题界面，
     要登录时调 window.HXPortal.login()；被单独打开时 hx-theme.js 会跳回这里（见 hx-theme.js 的 data-tool）。
     账号：Supabase 华夏工具项目，localStorage paike-session 和各工具共用；身份由数据库 hx_me() 决定。
     脚本里不用反引号模板字符串（本机测试时整页当字符串注入到线上同源页面里）。 -->

<!-- 首页卡片上的像素小生物：pixelfx 的 12 个 critters（MIT），打包成一个 91 KB 的独立脚本。
     加载失败不影响首页——hx-critters.js 开头就有 window.PixelFX 存在性检查，没有就整段跳过。 -->
<script src="fx/pixelfx-critters.js?v=2bf8565" defer></script>

     不进首屏关键路径；不点「像素头像库」就一个动画都不跑。 -->
<script src="fx/pixelfx-avatars.js?v=2bf8565" defer></script>
<script src="fx/hx-avatar.js?v=2bf8565" defer></script>
<!-- 背景动效（2026-11-03）：12 种天气氛围特效铺在背景层，外观面板里选；加载失败或没选就完全不加载渲染器 -->

<style>
  * { box-sizing: border-box; }

  @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } } /* 小于 16px 苹果手机点输入框会自动放大且不回去 */

  /* 顶栏：苹果官网的毛玻璃导航 */
  header { flex: none; position: relative; z-index: 10; height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 max(12px, env(safe-area-inset-left)); background: var(--bar); backdrop-filter: var(--hx-blur); -webkit-backdrop-filter: var(--hx-blur); border-bottom: 1px solid var(--edge); }
  .brand { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 10px 0 4px; border: 0; border-radius: 12px; background: none; font-weight: 600; font-size: 17px; white-space: nowrap; }

  .back { display: none; align-items: center; gap: 2px; height: 36px; padding: 0 12px 0 4px; border: 0; border-radius: 99px; background: none; color: var(--acc); font-size: 17px; white-space: nowrap; }

  .back:hover { background: var(--hov); }

  body.tool .back, body.tool .cur { display: flex; } body.tool .brand { display: none; }
  .sp { flex: 1; }
  .ibtn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--ink); opacity: .8; transition: background .2s var(--hx-ease), opacity .2s; }
  .ibtn:hover, .ibtn[aria-expanded="true"] { background: var(--fill); opacity: 1; }
  .acct { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; border: 0; border-radius: 99px; background: none; white-space: nowrap; }
  .acct:hover, .acct[aria-expanded="true"] { background: var(--fill); }
  .acct b { max-width: 9em; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 500; padding-right: 8px; }
  /* 2026-11-06 用户：「这个为什么是蓝色底 我希望是透明底」。
     实测 pixelfx 头像 PNG 本身是 96.5% 透明底（四角 alpha 全是 0），蓝底是**这个圆形容器**垫出来的：
     原来无论有没有图都铺 var(--acc)，透明 PNG 一放上去，圆盘的绿/蓝就从图形四周透出来。
     所以：默认（没图、用名字首字）照旧铺主题色；挂了头像图（.has-img）就改成完全透明，
     只留一圈极淡的内描边把圆形轮廓交代清楚。 */
  .av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: var(--on-acc); background: var(--acc) center / cover; }
  .av.has-img { background-color: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent); }
  .av.lg { width: 72px; height: 72px; font-size: 30px; }
  .avl { cursor: pointer; border-radius: 50%; } .avl:hover { filter: brightness(.9); }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--fill); color: var(--dim); }
  .pill.acc { background: var(--accbg); color: var(--acc); }
  .pill.dev { color: #fff; background: linear-gradient(120deg, #f59e0b, #ec4899); box-shadow: 0 4px 14px -6px #ec4899; }
  .pill.admin { color: #fff; background: linear-gradient(120deg, #2563eb, #06b6d4); box-shadow: 0 4px 14px -6px #2563eb; }
  .acct .pill { margin: 0 4px 0 -2px; } .hero p .pill { vertical-align: middle; margin-left: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; } .grid2 .panel { margin: 0 0 14px; }
  .panel h3 { margin: 0 0 12px; font-size: 19px; font-weight: 600; } .dim { color: var(--dim); } .ra { text-align: right; white-space: nowrap; } .mono { font-family: ui-monospace, Consolas, monospace; letter-spacing: .06em; }
  .lbtn { height: 32px; padding: 0 16px; border: 0; border-radius: 99px; background: var(--acc); color: var(--on-acc); font-size: 14px; font-weight: 500; }
  main { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  body.zen header { display: none; }
  body.hxfull header { display: none; } body.hxfull main { position: fixed; inset: 0; height: 100vh; height: 100dvh; z-index: 50; }
  /* 苹果手机的 iframe 会按里面内容撑宽，width:1px + min-width:100% 把它钉在屏幕宽。
     2026-11-02：不在前台的 iframe 一律 display:none。原来只写 visibility:hidden + opacity:0，
     元素不画了但里面的 JS、定时器、requestAnimationFrame 照样跑（接线仿真有画布渲染循环），
     开着三四个工具就是三四个循环在后台抢 GPU，最后点哪个都崩。display:none 才会真正让它停。 */
  main iframe { position: absolute; inset: 0; width: 1px; min-width: 100%; max-width: 100%; height: 100%; border: 0; background: var(--bg); display: none; }
  main iframe.on { display: block; animation: fin .22s var(--hx-ease) both; }
  @keyframes fin { from { opacity: 0; } to { opacity: 1; } }
  html.hx-bg main iframe { background: transparent; }
  /* ── 加载动效（2026-11-03 用户要求「刷新加载动画缺一个 包括其他界面」）──
     统一做成「像素方块波浪」：7 个小方块错峰起伏，像一条跑动的像素带。
     为什么用纯 CSS 而不是 canvas：这是全站显示频率最高、生命周期最短的动画，
     CSS 动画走合成线程，不占主线程、不用 rAF，和首页小生物那套「全局只有一个循环」的规矩不冲突。
     方块尺寸用 clamp(9px, .85vw + 3px, 26px)：手机 9px，1920 一体机 19px，4K 100% 缩放封顶 26px，
     不会在小屏上糊成一片、也不会在大屏上细得像根线。
     （2026-11-04 用户报「像素动效和文字匹配总体看起来太小 网页太大」：原来 2.4vw 涨得太猛、
     13px 又封得极早（542px 宽就顶格），大屏上永远 13px。改成缓慢线性长 + 上限 26px。） */
  .hx-px { display: inline-flex; align-items: flex-end; gap: clamp(3px, .55vw + 1px, 6px); height: calc(clamp(9px, .85vw + 3px, 26px) * 2.2); }
  .hx-px i { width: clamp(9px, .85vw + 3px, 26px); height: clamp(9px, .85vw + 3px, 26px); border-radius: 2px;
    background: linear-gradient(180deg, var(--acc), var(--acc2));
    /* 一点落影：浅色背景（#f5f5f7 默认主题）下方块本来会糊成一片淡绿，
       加一层同色系的淡影之后才有「浮在桌面上跳」的实体感。 */
    box-shadow: 0 5px 12px -6px var(--acc);
    animation: hxPx 1.15s var(--hx-ease) infinite; animation-delay: calc(var(--i) * 90ms); }
  .hx-px i:nth-child(2n) { background: linear-gradient(180deg, var(--acc2), var(--acc3)); }
  @keyframes hxPx {
    /* 起始透明度不能太低：原来写 .35，在浅灰背景上几乎看不见方块（截图上只剩一抹淡绿）。
       提到 .55 起跳、1 到顶，起伏才看得出来，同时又不刺眼。
       位移用 -110%（相对方块自身高度）而不是写死的 px —— 这样同一套动画在首屏（大方块）
       和「正在加载」药丸（小方块）里都能用，不用各写一份。 */
    0%, 100% { transform: translateY(0); opacity: .55; }
    35% { transform: translateY(-110%); opacity: 1; }
    60% { transform: translateY(0); opacity: .7; }
  }

  /* 首屏加载层：刷新页面时先出这个，脚本跑完再淡出。
     它必须在样式生效的第一帧就可见（样式是内联的，所以不会白屏闪一下）。 */
  #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
    background: var(--bg); color: var(--ink);
    /* 离场：内容先走（0~120ms），背景紧跟（60~280ms），两段**重叠**着撤。
       踩过的坑：第一版让内容先淡完、背景再等 280ms 才撤，中间有约 200ms 是「只有一块底色、
       什么内容都没有」的纯空白（实测截图 2.7KB，几乎是一张纯色图）——学生看到的是
       「动画 → 白一下 → 首页」，比不做动画还难看。重叠之后画面是连续过渡，没有空档。 */
    transition: opacity .22s var(--hx-ease) .06s, visibility .3s;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #boot > * { transition: opacity .12s var(--hx-ease); }
  #boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot.done > * { opacity: 0; }
  #boot img { width: clamp(56px, 13vw, 96px); aspect-ratio: 1; border-radius: 22%; object-fit: cover;
    box-shadow: 0 12px 32px -14px var(--shade, rgba(0,0,0,.35)); animation: bootIn .7s var(--hx-spring) both; }
  #boot b { font: 600 clamp(17px, 1.15vw + 5px, 36px)/1 var(--hx-font-d, var(--hx-font)); letter-spacing: .18em; text-indent: .18em; color: var(--ink);
    animation: bootIn .7s .08s var(--hx-spring) both; }
  #boot .hx-px { animation: bootIn .7s .16s var(--hx-spring) both; }
  @keyframes bootIn { from { opacity: 0; transform: translateY(10px) scale(.94); } }
  /* 一体机 / 省电：不做动画，直接给静态帧（这台机器本来就在省电模式，动画越少越好） */
  html.hx-lite #boot .hx-px i { animation: none; opacity: .8; }
  @media (prefers-reduced-motion: reduce) {
    #boot img, #boot b, #boot .hx-px { animation: none; }
    .hx-px i { animation: none; opacity: .8; transform: none; }
  }

  /* 这里原来是外层「正在加载 · XX」药丸（.loadtip）的样式。2026-11-05 用户拍板删掉它：
     9 个工具全部 splash:1、各自带整屏像素启动屏，外层药丸只会压在像素动效上变成双层加载。
     元素、样式、逻辑一起退役，详见 tip()。 */
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 首页 */
  #home { position: absolute; inset: 0; overflow-y: auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom, 0px)); scroll-behavior: smooth; }
  body.tool #home { visibility: hidden; content-visibility: hidden; } /* 打开工具后首页整棵子树不参与渲染，只留盒子占位（滚动位置不丢） */
  .wrap { width: min(1024px, 100%); margin: 0 auto; }
  .hero { text-align: center; padding: clamp(40px, 9vw, 96px) 0 clamp(28px, 5vw, 52px); }
  .hero img { width: clamp(64px, 12vw, 88px); aspect-ratio: 1; border-radius: 22%; object-fit: cover; box-shadow: 0 12px 32px -14px var(--shade); }
  .hero h1 { margin: 18px 0 0; font: 700 clamp(40px, 8vw, 64px)/1.06 var(--hx-font-d); letter-spacing: -.02em; }
  .hero p { margin: 10px 0 0; font-size: clamp(19px, 3vw, 24px); color: var(--dim); font-weight: 500; min-height: 1.4em; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: 16px; }
  /* 首页工具卡。
     ── 2026-11-02 大改：不再是「玻璃文件夹」──
     原来是：后片（.tile 本体，左上伸出一个舌片）+ 开口（top 44% 露出「照片位」）+ 前片（::after 玻璃）+
     拇指缺口（mask）+ 折角。照的是 概念片/玻璃文件夹/ 那版对照稿，本来为了给每张卡上部留一块照片位。
     问题是：**首页根本没有照片**。开口露出来的只是背景图，于是在每张卡中间横切出一道很怪的分界线，
     右侧还挂一道弧形的亮边——用户 2026-11-02 的原话是「上面目前是很诡异的莫名其妙的突出」。
     舌片先撤了，但那道横线是「开口」这条结构线，撤掉舌片它反而更明显（上面少了东西，下面一道杠）。
     现在整张卡就是一块完整的玻璃：去掉开口（前片从顶铺到底）、去掉缺口、去掉折角，
     卡片上端那个位置交给像素小生物（.fxc）。要重建「文件夹 / 照片位」那套观感，
     得先在 .tile 里真的放一张图，否则那条线永远是杂质。 */
  /* ── 2026-11-04 玻璃拟态升级（Premium Cosmic Glassmorphism）──
     目标：卡面像一块**厚玻璃**，而不是「白色圆角块 + 一圈浅灰描边」。四层叠出来，全部静态绘制：
       ① 卡底：.tile 自己的 background（var(--card)，有背景图时是深色玻璃）；
       ② 玻璃体：.tile::after —— 斜向高光 + 顶上一道锐利亮唇 + 底部柔和内阴影收边（厚度感）；
       ③ 表面质感：.tile::before —— 4px 微点阵噪点（消除渐变的塑料感）+ 一道斜向扫光；
       ④ 内容：.tile > *（z-index 1，压在噪点上面，字不会被点点糊住）。
     为什么噪点用点阵而不是 SVG feTurbulence：14 张卡各跑一次湍流滤镜，希沃一体机直接卡死；
     4px 点阵只是一张重复位图，绘制和缓存成本接近 0。模糊一层都不加（见下方 2026-11-02 那条注释）。 */
  .tile { --fld-bg: rgba(0, 0, 0, .014); --fld-edge: rgba(0, 0, 0, .045); --fld-lip: rgba(255, 255, 255, .92);
    --fld-drop: 0 -6px 12px -12px rgba(0, 0, 0, .16); --fld-sheen: rgba(255, 255, 255, .55);
    /* 噪点 / 扫光的强度都放在变量里：深色模式和省电模式只改这两个值，不用重写整套规则。
       ── 2026-11-04 二次修复（UI 回归）──
       这层 4px 点阵噪点就是失败版「整卡浑浊」的主要来源之一（任务书 F3）：网格在深色卡上
       连成一片灰膜，把本该清透的玻璃糊成毛玻璃纸。**点阵整层删除**（它是本轮失败改造新加的，
       不是原版素材）；扫光保留但压到极淡，只给玻璃留一点「有厚度」的方向感。 */
    --fld-scan: rgba(255, 255, 255, .10);
    --fld-scan2: rgba(255, 255, 255, .03); --fld-deep: rgba(0, 0, 0, .17);
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; min-height: 172px; padding: 26px 24px 22px; border: 0; border-radius: 32px; background: var(--card); text-align: left; box-shadow: 0 0 0 1px var(--edge) inset;
    transition: transform .25s var(--hx-ease), box-shadow .25s var(--hx-ease); animation: rise .7s var(--hx-spring) both; }
  /* 舌片已于 2026-11-02 撤掉：用户指出卡片上端那个凸起「很诡异、莫名其妙」。
     现在这个位置由 .fxc（像素小生物）补上。那条空规则在 2026-11-04 被重新启用——
     不再是舌片，而是玻璃表面的「噪点 + 扫光」层（见下面 .tile::before）。 */
  /* 表面质感层：只剩一道极淡的斜向扫光（点阵噪点已删，见上面 .tile 的注释）。
     z-index 给 1（和内容层同级但排在它们前面），所以它在玻璃体之上、文字图标之下。
     扫光的图幅给到 150%，是为了 hover 时能用 background-position 移动它（模拟视角变化），
     图幅等于 100% 时 background-position 的百分比是无效的。 */
  .tile::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; border-radius: inherit;
    background: linear-gradient(148deg, var(--fld-scan) 0%, var(--fld-scan2) 22%, transparent 50%) 50% 50% / 150% 150% no-repeat;
    transition: background-position .25s var(--hx-ease), opacity .25s var(--hx-ease); }
  /* 玻璃面：从顶铺到底（原来是 top:44%，只盖下半张，上半露「照片位」——首页没照片，那条边就成了横贯卡片的怪线）。
     还留着 1px 的亮唇（border-radius 14px）和品牌色内晕（来自 Orbit 的静态光），
     但去掉了顶边那个拇指缺口 mask：缺口的意义是「让后片从开口里透一道」，
     没有开口之后它只会在卡片中上部啃出一个不规则的洞。
     box-shadow 里那道品牌色内晕来自 Orbit（见下方 Orbit 段）——压在玻璃里的静态光，不额外吃性能。
     ── 2026-11-04 加厚 ──
     原来只有「亮唇 + 一点漫射」，玻璃是一张薄片。现在用两组内阴影做**厚度**：
       顶部：0.8px 实白唇（锐利高光边）+ 2px 漫射；
       底部：-30px 的柔和内阴影收边（暗部往里兜，玻璃才有体积）；
       左侧：一道 0.5px 的极淡白边，模拟折射时侧面被环境光擦亮。
     全部是 inset box-shadow，一次绘制、不随动画重绘。 */
  .tile::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    border-radius: inherit; background: var(--fld-bg);
    box-shadow: inset 0 .8px 0 var(--fld-lip),
      inset .5px 0 0 rgba(255, 255, 255, .22),
      inset 0 2px 6px -3px var(--fld-sheen),
      /* 底边主题色内反射压到 55%（原 90% 会在深色卡底边烧出一圈明显的色晕，喧宾夺主） */
      inset 0 -22px 36px -30px color-mix(in srgb, var(--c2) 55%, transparent),
      inset 0 -30px 42px -34px var(--fld-deep),
      0 0 0 .6px var(--fld-edge);
    transition: box-shadow .25s var(--hx-ease); }
  .tile > * { z-index: 1; } /* flex 项设 z-index 就成层，玻璃体不会盖住图标和文字 */
  /* 悬停：整卡上浮 4px（不再用 scale——缩放会把玻璃边缘的 1px 亮唇拉成 2px，看着发糊），
     同时把扫光往左下挪一点点，模拟「视角变了，反光跟着走」。缓动换成 .25s 的 ease，克制、不弹。 */
  .tile:hover { transform: translateY(-4px); box-shadow: 0 0 0 1px var(--edge) inset, 0 22px 50px -26px var(--shade); }
  .tile:hover::before { background-position: 0 0, 41% 63%; }
  .tile:active { transform: translateY(-1px); transition-duration: .12s; }
  /* 「当前打开」那条横贯全宽的提示条不做上浮（一整行飘起来很奇怪） */
  .tile.act:hover { transform: none; }
  /* ── Orbit 设计语言：图标是一颗带着自己轨道的星 ──
     取自 概念片/index.html（Orbit 32 秒片），用户 2026-11-02 定的方向是「融进首页工具卡」，
     不是把那支片子上线。那边是 canvas 粒子场 + 体积雾，一帧几百个粒子，
     塞进首页 14 张卡就是 14 个渲染循环，希沃上必崩（见 2026-11-02 的崩溃修复）。
     所以只取「看得见的形」：一圈倾斜的轨道环 + 环上一颗光点 + 卡片底部内侧的品牌色光晕（已并进上面 .tile::after），
     全部用 transform / box-shadow 做，而且**默认停着不动，只有鼠标移上去那一张才转**——静止时零开销。 */
  .tile .ic { position: relative; z-index: 1; width: 58px; height: 58px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: 0 8px 20px -10px var(--c2), 0 0 26px -8px color-mix(in srgb, var(--c2) 52%, transparent); }
  .tile .ic svg { position: relative; z-index: 2; width: 30px; height: 30px; stroke-width: 1.9; }
  .tile .ic::before, .tile .ic::after { content: ""; position: absolute; left: 50%; top: 50%; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; pointer-events: none; }
  .tile .ic::before { /* 轨道环：静态，只画一次 */
    border: 1px solid color-mix(in srgb, var(--c2) 58%, transparent); transform: rotateX(66deg);
    opacity: .45; transition: opacity .45s var(--hx-spring); }
  .tile .ic::after { /* 轨道上的光点：一条旋转的臂，亮点在臂尖 */
    background: radial-gradient(closest-side, #fff 0 40%, color-mix(in srgb, var(--c2) 88%, #fff) 40% 60%, transparent 64%) top center / 7px 7px no-repeat;
    transform: rotateX(66deg); animation: hx-orbit 3.6s linear infinite; animation-play-state: paused; opacity: 0; transition: opacity .45s var(--hx-spring); }
  .tile:hover .ic::before, .tile:focus-visible .ic::before { opacity: 1; }
  .tile:hover .ic::after, .tile:focus-visible .ic::after { opacity: 1; animation-play-state: running; }
  .tile.act .ic::before, .tile.act .ic::after { display: none; } /* “当前打开”那条横条不做轨道 */
  @keyframes hx-orbit { from { transform: rotateX(66deg) rotateZ(0deg); } to { transform: rotateX(66deg) rotateZ(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tile .ic::after { animation: none; } }

     轨道环和光晕都是静态的，留着，只停旋转动画。 */
  html.hx-lite .tile .ic::after { animation: none !important; }
  /* ── 八大行星：中心图标当太阳 ──
     ── 2026-11-04 二次重做（UI 回归，任务书 §4）──
     上一版的问题（对应任务书 F2/F5/F7）：轨道盘 240px 铺满整卡、8 条环几乎同亮，
     远看像「唱片刻纹」；右上像素小生物保护区被轨道压住。
     这一版：
     ① 八条轨道**共心**（圆心 = 图标中心 --cx/--cy）、**同一投影**（一个 rotateX 盘面），
        半径 52 → 108 等距铺开；盘面收到 216px，太阳系只占卡片左侧图标后方，

        **不存在任何写死的 left/top**（F1 的「行星与轨道脱节」从结构上不可能再发生）。

        前半环（::after 裁下半）**三层，前后遮挡关系正确（任务书 §4.2）。
     ⑥ 行星默认**缓慢公转**（任务书 §5「默认：行星缓慢公转」）：周期 26s → 52s，
        transform 合成器动画、无 JS 循环；触屏 / 希沃（hx-lite）整段不显示，
        prefers-reduced-motion 下行星停转、轨道保持静态。 */

  .tile { --cx: 53px; --cy: 55px;
    /* 轨道线的三段亮度（前亮 / 过渡 / 后暗）。浅色卡是白底，白线画上去等于没画，
       所以默认走**灰蓝**；有背景图 / 深色模式下面各自改成亮线，见对应分支。 */
    --orb-a: rgba(104, 120, 140, .60); --orb-b: rgba(112, 128, 148, .26); --orb-c: rgba(120, 136, 156, .09); }
  /* .sys 铺满整张卡，只负责按卡片圆角裁剪（**不旋转**，否则 overflow 的裁剪框会跟着压扁）。
     mask 是右上保护区的渐隐：45° 方向从卡片中带向右上角淡出，.fxc 盒子（top:12 right:14
     84×96）落在渐隐区里，轨道/行星都压不住像素动效。 */
  .tile .sys { position: absolute; inset: 0; z-index: 0; pointer-events: none; display: none;
    overflow: hidden; border-radius: inherit; perspective: 700px; perspective-origin: var(--cx) var(--cy);
    -webkit-mask-image: linear-gradient(45deg, #000 40%, transparent 72%);
    mask-image: linear-gradient(45deg, #000 40%, transparent 72%); }
  /* .sysin 才是那块倾斜的轨道盘：216×216 以图标为圆心，58° 俯角把正圆投成椭圆。
     盘面超出卡片的部分由 .sys 的 overflow 裁掉，正好是「轨道延伸出卡片」的透视感。

     **轨道线必须画在 ::after 上，不能画在 .sysin 自己身上** —— mask 会连同**后代元素**一起裁，
     .sysin 只当容器，轨道是它的一张独立伪元素。 */
  .tile .sysin { position: absolute; left: var(--cx); top: var(--cy); width: 220px; height: 220px; margin: -110px 0 0 -110px;
    transform: rotateX(58deg); transform-origin: 50% 50%; }
  /* 轨道光：conic 从 150deg（左下、靠近观察者）起亮，转到右后几乎熄灭再转回来。
     8 条环带靠 mask 的 8 层 radial-gradient 挖出来；半径 50→110、间距内密外疏，
     alpha 逐条 .45 → .07 —— 外侧两条几乎隐入卡面（局部渐隐，任务书 §4.3-3），
     免得 8 条等亮细环又读成「唱片刻纹」。环宽 0.8px。
     hover 时整体略提亮（opacity .85 → 1），克制的反馈，不加新光源。 */
  .tile .sysin::after { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .85;
    transition: opacity .35s var(--hx-ease);
    background: conic-gradient(from 150deg at 50% 50%,
      var(--orb-a) 0deg, var(--orb-b) 62deg, var(--orb-c) 128deg,
      var(--orb-c) 232deg, var(--orb-b) 298deg, var(--orb-a) 360deg);
    -webkit-mask-image:
      radial-gradient(closest-side, transparent 0 49.4px, #00000073 50px 50.8px, transparent 51.2px),
      radial-gradient(closest-side, transparent 0 57.4px, #00000061 58px 58.8px, transparent 59.2px),
      radial-gradient(closest-side, transparent 0 66.4px, #0000004f 67px 67.8px, transparent 68.2px),
      radial-gradient(closest-side, transparent 0 75.4px, #00000040 76px 76.8px, transparent 77.2px),
      radial-gradient(closest-side, transparent 0 84.4px, #00000033 85px 85.8px, transparent 86.2px),
      radial-gradient(closest-side, transparent 0 93.4px, #00000026 94px 94.8px, transparent 95.2px),
      radial-gradient(closest-side, transparent 0 101.4px, #0000001c 102px 102.8px, transparent 103.2px),
      radial-gradient(closest-side, transparent 0 109.4px, #00000012 110px 110.8px, transparent 111.2px);
    mask-image:
      radial-gradient(closest-side, transparent 0 49.4px, #00000073 50px 50.8px, transparent 51.2px),
      radial-gradient(closest-side, transparent 0 57.4px, #00000061 58px 58.8px, transparent 59.2px),
      radial-gradient(closest-side, transparent 0 66.4px, #0000004f 67px 67.8px, transparent 68.2px),
      radial-gradient(closest-side, transparent 0 75.4px, #00000040 76px 76.8px, transparent 77.2px),
      radial-gradient(closest-side, transparent 0 84.4px, #00000033 85px 85.8px, transparent 86.2px),
      radial-gradient(closest-side, transparent 0 93.4px, #00000026 94px 94.8px, transparent 95.2px),
      radial-gradient(closest-side, transparent 0 101.4px, #0000001c 102px 102.8px, transparent 103.2px),
      radial-gradient(closest-side, transparent 0 109.4px, #00000012 110px 110.8px, transparent 111.2px); }
  .tile:hover .sysin::after, .tile:focus-visible .sysin::after { opacity: 1; }
  .tile .sysin::before { /* 太阳光冕：从图标边缘透出来的一圈暖光（比上一版收敛：图标才是主角） */
    content: ""; position: absolute; left: 50%; top: 50%; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 205, 120, .28), rgba(255, 176, 74, .11) 60%, transparent 78%); }
  .tile .sysin i { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 1;
    transform: rotate(var(--a)); animation: hx-orb var(--d) linear infinite; }
  /* 行星球体（2026-11-05 三修：用户反馈「2D 贴图感、很淡很小」）。层序见 JS ball()：
       · 最上层是偏左上 29% 24% 的镜面高光（白点渐隐）；
       · 中间是行星自己的材质（--pt：木星的条带、地球的海陆团块都在这一层）；
       · 然后是受光面体色（亮 → 中 → 暗的同轴渐变）；
       · 最上面再压一层「边缘暗角」：背光侧（右下）透明度一路加深，做出明暗交界线，
         球才立得起来 —— 平面圆和球的差别就在这层 terminator。
     box-shadow 三层（尺寸全部跟 --s 走，行星放大缩小影线跟着缩）：
       · inset 右下暗边：把渐变暗角再压实一点，边缘不是一条硬线而是圆滑收进去；
       · 向下的柔和投影：球「浮」在卡面上，而不是画在卡面上；
       · 同色大气光（2026-11-05 四修：用户要 1:1 下扫一眼就认出是行星，.40 → .60）：
         暗色卡上帮行星从背景里脱出来，这一圈是「远看可见」的关键，比球本身还显眼。 */
  .tile .sysin i::before { content: ""; position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); border-radius: 50%;
    background: var(--pt);
    box-shadow:
      inset calc(var(--s) * -0.09) calc(var(--s) * -0.11) calc(var(--s) * 0.28) rgba(5, 4, 12, .56),
      0 calc(var(--s) * 0.18) calc(var(--s) * 0.42) rgba(3, 5, 12, .46),
      0 0 calc(var(--s) * .95) color-mix(in srgb, var(--p) 60%, transparent);
    transform: translateX(var(--r)) rotateX(-58deg); }
  /* 土星环：拆成三层做**真实前后遮挡**（任务书 §4.2，2026-11-04 二次修复）——
       后半环 <s>（z:0）→ 球体 ::before（z:1）→ 前半环 ::after（z:2，clip-path 只留视觉下半）。
     环径 2.9 倍球径，中间挖空到 39%；rotateX(-58deg) 抵掉父级俯角，rotate(-14deg) 斜环，

  .tile .sysin i.sat s { position: absolute; width: calc(var(--s) * 2.9); height: calc(var(--s) * 2.9);
    margin: calc(var(--s) * -1.45); border-radius: 50%; z-index: 0;
    background: radial-gradient(closest-side, transparent 0 39%,
      rgba(246, 232, 198, .95) 42% 60%, rgba(206, 184, 140, .55) 62% 71%, rgba(140, 118, 84, .20) 73% 78%, transparent 80%);
    transform: translateX(var(--r)) rotateX(-58deg) rotate(-14deg) scaleY(.5); }
  .tile .sysin i.sat::after { content: ""; position: absolute; width: calc(var(--s) * 2.9); height: calc(var(--s) * 2.9);
    margin: calc(var(--s) * -1.45); border-radius: 50%; z-index: 2;
    background: radial-gradient(closest-side, transparent 0 39%,
      rgba(246, 232, 198, .95) 42% 60%, rgba(206, 184, 140, .55) 62% 71%, rgba(140, 118, 84, .20) 73% 78%, transparent 80%);

  @media (hover: hover) and (pointer: fine) {

    html:not(.hx-lite) .tile .ic::before, html:not(.hx-lite) .tile .ic::after { display: none; }
  }

     2026-11-04 二次修复：整体压暗一档（.60→.52），后侧几乎熄灭，只留近处半圈柔光。 */
  html.hx-bg .tile, html[data-hx-mode="dark"] .tile { --orb-a: rgba(208, 224, 244, .52); --orb-b: rgba(190, 208, 232, .22); --orb-c: rgba(176, 194, 220, .07); }
  /* prefers-reduced-motion：行星停转（冻结在当前相位），轨道保持静态氛围——不再是整层消失 */
  @media (prefers-reduced-motion: reduce) { .tile .sysin i { animation: none; } .tile:hover .sysin::after { opacity: .85; } }
  /* ── 卡片上端的像素小生物（pixelfx critters，MIT）──
     取代原来那个「左上角莫名其妙凸出来的舌片」。用户 2026-11-02 的要求：
     卡片上端放一只随机匹配的动效生物，鼠标移上去才动。
     14 张卡不各跑循环：见 fx/hx-critters.js，全局一个 rAF，只有 hover 那张才画。
     为什么放右上：左上被图标占着，右上原本是空的；也正好补上原来舌片那个位置的空缺。
     ── 2026-11-03 重做摆放：固定盒子 + 居中 ──
     原来的做法（JS 里按 96×68 算缩放比，再把容器设成缩放后的实际大小、贴着右上）
     有两个毛病，用户截图里都看得见：
       ① 位置不一致：12 只生物原始比例差很远（蛇 136×56、飞骷髅 96×132、水母 96×120），
          统一塞进 96×68 之后，细长的（水母只剩 54px 宽）被挤到右边缘，像缩在角落；
          宽扁的（96px）又往左伸，压到左上图标上 —— 实测 8 张卡里有 4 张和图标重叠。
       ② 尺寸参差：同样是「装满盒子」，视觉大小完全不一样。
     现在：容器固定成一个盒子（--fxc-w × --fxc-h）**居中**摆放，
     缩放交给 CSS —— canvas 只写 max-width/max-height:100%，浏览器自己等比 contain 进去。
     所有生物都在同一块地方居中，谁都不偏；缩放规则只有一条，不再各算各的。
     盒子为什么是竖向：卡片 183px 宽时左上图标占 24~82、右边距 14，横向只剩 84 左右；
     而纵向从 12px 到标题上方有 90 多，富余得多 —— 竖向盒子能装下更高的生物，还不会碰图标。 */
  /* --fxc-w/h 是摆放用的盒子；--fxc-g 是「目标视觉尺寸」，见 fx/hx-critters.js 里的解释：
     12 只生物原始比例差得远，光靠「填满盒子」会让细长的显得很小、高瘦的显得很大。
     按 sqrt(宽×高) 归一化到同一个 --fxc-g，看上去才一样大。 */
  .tile .fxc { --fxc-w: 84px; --fxc-h: 96px; --fxc-g: 70px;
    position: absolute; top: 12px; right: 14px; z-index: 1; pointer-events: none;
    width: var(--fxc-w); height: var(--fxc-h);
    display: flex; align-items: center; justify-content: center;
    line-height: 0; opacity: .9; transition: opacity .35s var(--hx-ease), transform .45s var(--hx-spring); }
  /* 小生物底下那层暗色圆晕已经改成画进 canvas 里（见 fx/hx-critters.js 的 halo()）：
     原来这里是 CSS 伪元素 radial 渐变，白卡分支下在浅色背景上像一块脏斑。
     画进 canvas 的好处是逐像素、随 canvas 一起缩放，边缘没有伪元素那层硬边。
     这里不再写死 width/height：canvas 的 width/height 属性就是生物的原始像素尺寸，
     只用 max-width/max-height 把它等比装进上面的固定盒子（JS 不再逐个算缩放比）。
     image-rendering: pixelated 保证放大时是硬边像素块，不会糊成一团。 */
  /* 尺寸由 JS 按「视觉质量一致」算好写在行内（px）；这里的 max-* 是兜底，
     object-fit: contain 保证万一被盒子夹住也是等比缩，不会拉扁。 */
  .tile .fxc canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain;
    image-rendering: pixelated; image-rendering: crisp-edges; }
  .tile:hover .fxc, .tile:focus-visible .fxc { opacity: 1; transform: translateY(-2px) scale(1.06); }
  /* 不用 mix-blend-mode: screen。试过：背景图是亮蓝色，screen 会把小生物的暗部整个吃掉，

  html.hx-bg .tile .fxc { opacity: .95; }
  @media (prefers-reduced-motion: reduce) { .tile:hover .fxc, .tile:focus-visible .fxc { transform: none; } }
  .tile b { font-size: 21px; font-weight: 600; letter-spacing: -.01em; margin-top: auto; }
  /* 有背景图：走玻璃文件夹分支——后片换成「深色清透玻璃」（Deep / Clear Cosmic Glass，任务书 §3.1）：
     深黑蓝底 rgba(9,16,29,·) 打底 + 左上一道很弱的主题色反射 + 底边一圈更弱的垫光。
     ── 2026-11-04 二次修复（UI 回归）──
     失败版的问题：① 白色 gradient 薄膜（--fld-bg .18/.06）把深色玻璃罩成灰片；
     ② 主题色渐变 20% 太浓，橙色卡整面发棕（失败截图 03 的「棕灰蒙层」）；
     ③ 噪点点阵连成灰膜。现在：底色换 9,16,29、透明度 .50（在任务书 .40–.68 区间内，
     背景极光能透出来），主题色反射降到 12%，白膜只剩顶部 .06 的一道「玻璃顶光」。 */
  html.hx-bg .tile { --fld-bg: linear-gradient(180deg, rgba(255, 255, 255, .07) 0%, rgba(255, 255, 255, .02) 38%, rgba(9, 16, 29, 0) 58%, rgba(8, 10, 16, .20) 100%);
    --fld-edge: rgba(255, 255, 255, .17); --fld-lip: var(--glass-top); --fld-sheen: rgba(255, 255, 255, .34);
    /* 有背景图时噪点可以稍微明显一点（照片会盖掉一部分质感），扫光跟着降到 .12 */
    --fld-scan: rgba(255, 255, 255, .12); --fld-scan2: rgba(255, 255, 255, .02);
    --fld-deep: rgba(0, 0, 0, .34);
    --fld-tab: linear-gradient(180deg, color-mix(in srgb, var(--c1) 40%, rgb(22 26 32 / calc(var(--hx-a, 1) * .5))), color-mix(in srgb, var(--c1) 26%, rgb(22 26 32 / calc(var(--hx-a, 1) * .5))));
    background-color: rgb(9 16 29 / calc(var(--hx-a, 1) * .50));
    background-image:
      linear-gradient(152deg, color-mix(in srgb, var(--c1) 12%, transparent), transparent 52%),
      radial-gradient(130% 62% at 20% 110%, color-mix(in srgb, var(--c2) 14%, transparent), transparent 62%);
    box-shadow: var(--glass-drop), 0 0 0 .6px var(--fld-edge) inset; }
  /* 2026-11-02：卡片不再各自 backdrop-filter。背景图已经在 body::before 统一糊过，
     这里只叠半透明层 + 亮边就够（视觉一样是磨砂玻璃）。原来十几张卡各 blur 26px，
     希沃一体机的 GPU 撑不住，点工具时直接崩渲染进程，浏览器弹「重新加载站点」。 */
  /* 舌片已撤（见上面 .tile::before）：这里原来在有背景图时把它显示出来，现在不显示了 */
  /* 背景图分支下文字转白（后片是深色底，原来的深灰字会读不了） */
  html.hx-bg .tile b { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .55); }
  html.hx-bg .tile .sum { color: rgba(255, 255, 255, .78); text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
  /* ── 浅色 + 背景图：「高级白玻璃」重做（2026-11-05）──
     旧版（2026-11-04）是「白色渐变薄膜 + 深墨字 + 白色光晕」，Mac 浅色下被用户评为
     「玻璃质感不高级 仅仅只是白色雾蒙蒙」「标题文字带白色光晕几乎看不清」。三个病根：
       ① 白色 gradient 膜（.62/.34/.16）整面罩在深色壁纸上，又没有深色描边和落影 = 一块没有边界的白雾；
       ② 字上再叠三层白光晕：白字拖白雾、深字被光晕泡糊，怎么都看不清；
       ③ 玻璃「放不住」——没有影子就没有实体感。
     新配方（Premium Light Glass）：白玻璃 rgba(255,255,255,.70×浓度) + 深色细描边（--glass-edge）
     + 有方向的柔影（--glass-drop）+ 顶唇高光；配字用玻璃专用 token --g-ink / --g-dim
     （hx-theme.css，随 data-hx-mode 一起换），**不加任何光晕**——雾感来自「无边界的白」，不来自透。
     底色仍乘 --hx-a（卡片通透度）：100% = 最透（默认），0% = 实色白卡（可读性兜底端）。 */
  html:not([data-hx-mode="dark"]).hx-bg .tile {
    --fld-bg: linear-gradient(180deg, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, .04) 42%, rgba(20, 26, 38, .05) 100%);
    --fld-edge: var(--glass-edge); --fld-lip: rgba(255, 255, 255, .95); --fld-sheen: rgba(255, 255, 255, .40);
    --fld-scan: rgba(255, 255, 255, .26); --fld-scan2: rgba(255, 255, 255, .05);
    --fld-deep: rgba(18, 22, 30, .14);
    /* 卡面变白了，轨道线不能再用给深色卡准备的冷白（353 行那套在白卡上等于隐形），
       退回浅色卡默认的灰蓝三段亮度（见 272 行）。 */
    --orb-a: rgba(104, 120, 140, .72); --orb-b: rgba(112, 128, 148, .30); --orb-c: rgba(120, 136, 156, .10);
    background-color: rgb(255 255 255 / calc(var(--hx-a, 1) * .70));
    background-image: linear-gradient(150deg, color-mix(in srgb, var(--c1) 8%, transparent), transparent 68%);
    box-shadow: var(--glass-drop), 0 0 0 .6px var(--fld-edge) inset; }
  html:not([data-hx-mode="dark"]).hx-bg .tile b { color: var(--g-ink); text-shadow: none; }
  html:not([data-hx-mode="dark"]).hx-bg .tile .sum { color: var(--g-dim); text-shadow: none; }
  /* 玻璃膜（::before 噪点/扫光、::after 白膜/亮唇）也随 --hx-a 淡出：
     不这么做的话底色透明了、这层白膜还挂在上面，0% 时仍是一块白花花的方片。 */
  html:not([data-hx-mode="dark"]).hx-bg .tile::before,
  html:not([data-hx-mode="dark"]).hx-bg .tile::after { opacity: var(--hx-a, 1); }
  /* 2026-11-04：悬停从 scale(1.02) 统一改成上浮 4px（和上面 .tile:hover 一致，只是落影换成背景图那套） */
  html.hx-bg .tile:hover { transform: translateY(-4px); box-shadow: var(--glass-drop), 0 0 0 1px var(--edge) inset; }
  /* 深色 + 背景图：后片压更暗，保证白字完全可读。
     ── 2026-11-04 修坑：底色原来写死 rgba(10,10,12,.42)，不跟 --hx-a 走 ——
     外观面板的「卡片透明度」在这条分支上完全失效（实测 op 100→0，卡片 computed
     background-color 一格没变，像素均差 0.86）。浅色分支一直吃 --hx-a（.5 × α），
     深色这条漏了。op=100 时 α=1，视觉和改之前完全一样。
     ── 2026-11-04 二次修复（UI 回归，任务书 §3.1）──
     这是首页暗色 + 极光背景下**实际生效**的配方：换成深黑蓝清透玻璃
     rgba(9,16,29,·.52)（乘 --hx-a），主题色左上反射从 20% 降到 12%（失败版整卡发棕的来源），
     白膜从 .10/.03 压到 .05/.01，另加底边一圈更弱的主题色垫光。 */
  html[data-hx-mode="dark"].hx-bg .tile { --fld-bg: linear-gradient(180deg, rgba(255, 255, 255, .05) 0%, rgba(255, 255, 255, .01) 40%, rgba(9, 16, 29, 0) 60%, rgba(8, 10, 16, .22) 100%); --fld-edge: rgba(255, 255, 255, .14);
    background-color: rgb(9 16 29 / calc(var(--hx-a, 1) * .52));
    background-image:
      linear-gradient(152deg, color-mix(in srgb, var(--c1) 12%, transparent), transparent 52%),
      radial-gradient(130% 62% at 20% 110%, color-mix(in srgb, var(--c2) 12%, transparent), transparent 62%); }
  /* ── 无背景图 + 深色模式（2026-11-04 玻璃拟态升级时合并成一条）──
     浅色那套白玻璃搬到深色下会「发灰」。2026-11-04 二次修复：点阵噪点整层已删（F3），
     这里只留极淡扫光 + 提亮的边缘亮唇。 */
  html[data-hx-mode="dark"]:not(.hx-bg) .tile { --fld-bg: rgba(255, 255, 255, .028); --fld-edge: rgba(255, 255, 255, .07); --fld-lip: rgba(255, 255, 255, .28);
    --fld-scan: rgba(255, 255, 255, .10); --fld-scan2: rgba(255, 255, 255, .02);
    --fld-deep: rgba(0, 0, 0, .55); }
  /* 深色 + 背景图：扫光保持极低 */
  html[data-hx-mode="dark"].hx-bg .tile { --fld-scan: rgba(255, 255, 255, .12); --fld-scan2: rgba(255, 255, 255, .02); }
  /* ── 省电模式（html.hx-lite）的玻璃降级 ──
     任务红线要求「去掉噪点和悬停位移，只保留静态玻璃」。这里做三件事：
       ① 噪点整层关掉（点阵在 4px 网格上重复铺满整卡，是这四层里唯一的逐像素填充）；
       ② 悬停不再位移，只留下落影加深——鼠标移上去仍然有反馈，但页面不重排；
       ③ 上面那条 :hover 的扫描位移动画本来靠 transition 走，噪点都关了就把 transition 一起停掉。
     静态玻璃（亮唇、内阴影、品牌色内晕）全部保留，视觉上仍然是一块厚玻璃。 */
  html.hx-lite .tile::before { background: none; }
  html.hx-lite .tile { transition: box-shadow .2s var(--hx-ease); }
  html.hx-lite .tile:hover, html.hx-lite .tile:active { transform: none; }
  /* 系统「减少动态效果」：同 hx-lite，扫光位移停（噪点层已删，见 .tile 注释），只保留静态玻璃 */
  @media (prefers-reduced-motion: reduce) {
    .tile::before { background: none; }
    .tile, .tile:hover, .tile:active { transform: none; transition: box-shadow .2s var(--hx-ease); }
  }
  /* 当前打开的工具（横条提示）：恢复它自己的底色和描边，不做文件夹造型 */
  html.hx-bg .tile.act { background-color: var(--glass-wash); background-image: linear-gradient(var(--accbg), var(--accbg)); box-shadow: 0 0 0 1.5px var(--acc) inset; }
  html.hx-bg .tile.act b { color: var(--acc); }
  .tile .go { position: absolute; right: 22px; bottom: 24px; color: var(--acc); width: 22px; height: 22px; transition: transform .3s var(--hx-ease); }
  .tile:hover .go { transform: translateX(3px); }
  .tile .sum { margin-top: -12px; padding-right: 26px; font-size: 14px; color: var(--dim); }
  /* ── 首页文字在背景上的可读性（2026-11-04 用户：「你好xxx还有学习和教学文字根本看不清 发白色朦胧光晕」）──
     原来这里是「拿背景色 --bg 画一圈外发光」，等于给文字垫一块和底同色的光斑。
     但全站默认背景已经换成极光视频（#hx-bgvid，z-index:-2），--bg 早就不代表「文字身后那块颜色」了：
     浅色主题下 --bg 是 #f5f5f7 的浅灰，压在一张深绿雪山夜景上，光斑反而把深灰字糊成一片。
     现在改成用户要的白色朦胧光晕：
       · 文字转白（深色极光上白字才立得住；这是唯一能保证看清的颜色）；
       · 一条很紧的暗影压在最里层，给字缘一道暗边——亮背景图 / 用户自己上传的浅色图上，
         白色光晕会和底混成一片，这道暗边就是「不过曝」的保险；
       · 外面几层白色半透明从 2px 到 80px 由紧到松叠加，紧的那层收字缘、松的那层做朦胧扩散，
         远看是一团柔光托着文字，像雾气，不是发光字那种硬描边。
     分三档写（h1 / p / 分组小标题），不是一条通吃：15px 的小标题套 80px 的光会糊成一团棉花。 */
  html.hx-bg .hero h1 { color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .5),
      0 0 2px rgba(255, 255, 255, .9), 0 0 12px rgba(255, 255, 255, .72), 0 0 26px rgba(255, 255, 255, .5),
      0 0 48px rgba(255, 255, 255, .3), 0 0 80px rgba(255, 255, 255, .18); }
  html.hx-bg .hero p { color: rgba(255, 255, 255, .94);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .45),
      0 0 2px rgba(255, 255, 255, .85), 0 0 10px rgba(255, 255, 255, .6), 0 0 22px rgba(255, 255, 255, .4),
      0 0 40px rgba(255, 255, 255, .22); }
  html.hx-bg .sec h2 { color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .5),
      0 0 6px rgba(255, 255, 255, .8), 0 0 16px rgba(255, 255, 255, .5), 0 0 30px rgba(255, 255, 255, .28); }
  /* 「你好」后面那枚身份小药丸自带底色，别继承外发光，不然小字会糊在白雾里 */
  html.hx-bg .hero p .pill { text-shadow: none; }
  /* ── 浅色 + 背景图：hero / 分组标题的配字适配（2026-11-05 浅色重做）──
     用户原话「标题文字带白色光晕几乎看不清」——浅色下不再给文字套白光晕。
     但深墨字直接压深色极光只有 1.7:1，也不行。做法：hero 整块升级成一块真正的玻璃板
     （和工具卡同一套配方：白玻璃 .70×浓度 + 深色细描边 + 柔影），标题、副标题、校徽都坐在板上——
     可读性靠「字坐在玻璃上」，不靠给字加晕；深浅两种模式的 hero 于是共用同一套卡片语言。
     分组小标题（学习/教学/维护）改成 frosted 药丸，压在画面任何位置都读得清。 */
  html:not([data-hx-mode="dark"]).hx-bg .hero {
    position: relative; width: 100%; margin: clamp(30px, 6vw, 68px) auto 0;
    padding: clamp(26px, 4.5vw, 46px) clamp(22px, 4vw, 40px);
    background: rgb(255 255 255 / calc(var(--hx-a, 1) * .70));
    border-radius: 32px;
    box-shadow: var(--glass-drop), 0 0 0 .6px var(--glass-edge) inset; }
  html:not([data-hx-mode="dark"]).hx-bg .hero h1,
  html:not([data-hx-mode="dark"]).hx-bg .hero p,
  html:not([data-hx-mode="dark"]).hx-bg .sec h2 { color: var(--g-ink); text-shadow: none; }
  html:not([data-hx-mode="dark"]).hx-bg .sec h2 {
    background: rgba(255, 255, 255, .62); padding: 5px 14px; border-radius: 99px;
    box-shadow: 0 0 0 .6px rgba(18, 22, 30, .14) inset, 0 10px 24px -16px rgba(15, 22, 35, .5); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  /* 管理卡片的标题 */
  /* 分组：组间距明显大于卡片间距，小标题淡一档 */
  .sec { margin: 40px 0 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #tiles > .sec:first-child { margin-top: 0; }
  .sec h2 { margin: 0 0 0 4px; font: 600 15px/1.3 var(--hx-font); color: var(--dim); letter-spacing: .04em; }
  .tile.act { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; margin-bottom: 40px; background: var(--accbg); box-shadow: 0 0 0 1.5px var(--acc) inset; border-radius: 22px; }
  html .tile.act::after, html .tile.act::before { display: none; } /* 横条状的“当前提示”不做文件夹造型（写在 html.hx-bg .tile 之后，优先级压得住） */
  .tile.act b { margin: 0; color: var(--acc); } .tile.act .go { position: static; margin-left: auto; display: block; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 20px; border: 0; border-radius: 99px; background: var(--acc); color: var(--on-acc); font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: filter .2s, transform .15s; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.97); } .btn:disabled { opacity: .45; cursor: default; }
  .btn.sub { background: var(--fill); color: var(--ink); } .btn.link { background: none; color: var(--acc); padding: 0 6px; height: 32px; }
  .btn.bad-solid { background: var(--bad); color: #fff; }
  .btn.sm { height: 32px; padding: 0 14px; font-size: 14px; } .btn.bad { color: var(--bad); }
  .panel { padding: 22px 24px; border-radius: 24px; background: var(--card); box-shadow: 0 0 0 1px var(--edge) inset; margin-bottom: 14px; animation: rise .6s var(--hx-spring) both; }
  /* 有背景图时：面板改用「有层次的玻璃」（模糊＋增色＋叠白＋方向性亮边＋折射），没有背景图仍是干净的白卡 */
  html.hx-bg .panel { position: relative; background: var(--glass-wash); box-shadow: var(--glass-drop); }
  html.hx-bg .panel::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(150deg, var(--glass-top) 0%, var(--glass-bot) 58%, var(--glass-bot) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  html.hx-bg .panel::after { content: ""; position: absolute; left: 5%; top: 0; width: 44%; height: 40%; pointer-events: none; border-radius: inherit;
    background: radial-gradient(120% 100% at 18% 0%, rgba(255, 255, 255, .16), transparent 62%); }
  html[data-hx-mode="dark"].hx-bg .panel { background: rgba(10, 10, 12, .58); }
  /* 浅色玻璃面板：加一圈深色细描边（2026-11-05 浅色重做，和 .tile 同一套「有边界的玻璃」，去白雾感） */
  html:not([data-hx-mode="dark"]).hx-bg .panel { box-shadow: var(--glass-drop), 0 0 0 .6px var(--glass-edge) inset; }
  .cls { display: grid; gap: 12px; }
  /* 班级卡片：左上亮、右下灭的 1px 边 + 极淡落影（照参考片做的，不再用整片光晕） */
  .cl { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 12px 16px; align-items: center; padding: 18px 20px; border-radius: 24px; background: linear-gradient(175deg, var(--card-hi), var(--card-lo)); box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 22px 54px -38px var(--shade); animation: rise .7s var(--hx-spring) both; animation-delay: calc(var(--i, 0) * 55ms); transition: transform .35s var(--hx-spring), box-shadow .35s var(--hx-ease); }
  .cl::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: linear-gradient(148deg, var(--edge-hi), var(--edge-lo) 36%, transparent 60%, var(--edge-hi)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .cl:hover { transform: translateY(-2px); }
  /* 已收起（四个工具都没勾）的班：整张卡压淡，一眼看出「这学期不用了」，但仍可点回来 */

    exam:   function ()    { return HX.api('/rest/v1/hx_exams?select=created_at&order=created_at.desc&limit=1'); } // 只有教师有行；学生在下面直接标 N/A

  var NA_WHY = { wiring: '排位成绩走写侧 RPC，无个人同步行', base: '纯本地工具', mcu: '上机数据在本地与考试端', feedback: '公共反馈流，非个人同步' };

      return PROBES[t.id](uid).then(function (rows) {
        var r = (rows && rows[0]) || null;
        return { id: t.id, st: r ? 'ok' : 'empty', at: r && (r.updated_at || r.created_at) };
      }).catch(function () { return { id: t.id, st: 'off' }; });
    });
    return Promise.all([loadVersion(), Promise.all(jobs)]).then(function (res) {
      st.results = res[1]; st.checkedAt = Date.now();
    }).catch(function () { }).then(function () {
      st.checking = false; pill.classList.remove('busy');
      renderPill(); if (st.open) renderPop();
      return true;
    });
  }

  function summary() { // 全站一句话状态：ok=有同步行且全通，warn=通了但有暂无记录，bad=有探测失败/全离线
    if (!st.results) return st.checking ? 'checking' : 'idle';
    var off = st.results.filter(function (r) { return r.st === 'off'; }).length;
    var empty = st.results.filter(function (r) { return r.st === 'empty'; }).length;
    var probed = st.results.length - st.results.filter(function (r) { return r.st === 'na'; }).length;
    if (off >= probed && probed > 0) return 'off';
    return off ? 'bad' : (empty ? 'warn' : 'ok');
  }
  function dotCls(k) { return k === 'ok' ? 'ok' : k === 'warn' || k === 'empty' ? 'warn' : k === 'off' || k === 'bad' ? 'bad' : ''; }

  function renderPill() {
    if (!HX.in()) { pill.hidden = true; closePop(); return; }
    pill.hidden = false;
    var s = summary(), ver = st.version ? 'v' + esc(st.version.commit) : '', txt;
    if (st.checking && !st.checkedAt) txt = '正在核对云端…';
    else if (s === 'off' && !st.checking) txt = (ver ? ver + ' · ' : '') + '离线未核对';
    else if (st.checkedAt) txt = (ver ? ver + ' · ' : '') + '云端核对于 ' + fmt(st.checkedAt, true);
    else txt = (ver ? ver + ' · ' : '') + '未核对';
    pill.innerHTML = '<span class="sync-dot ' + dotCls(s) + '"></span><span class="sync-txt">' + txt + '</span>' +
      '<button type="button" class="sync-rf" id="syncRf" aria-label="重新核对全部工具" title="重新核对全部工具的云端数据">↻</button>';
    pill.title = '全站云端同步：版本 ' + (st.version ? st.version.commit : '读取中') + '；' + (st.checkedAt ? '最近核对 ' + fmt(st.checkedAt, true) : '尚未核对') + '；点击查看各工具明细';
    var rf = $('syncRf');
    rf.onclick = function (e) { e.stopPropagation(); probe(true); };
  }

  function renderPop() {
    var s = summary(), ver = st.version ? esc(st.version.commit) : '读取中';
    var rows = (st.results || TOOLS.map(function (t) { return { id: t.id, st: st.checking ? 'wait' : 'na' }; })).map(function (r) {
      var t = null; for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].id === r.id) t = TOOLS[i];
      if (!t) return '';
      var state, time = '';
      if (r.st === 'ok') { state = '正常同步'; time = fmtISO(r.at); }
      else if (r.st === 'empty') { state = '已连接 · 暂无云端记录'; time = st.checkedAt ? fmt(st.checkedAt, false) : ''; }
      else if (r.st === 'off') { state = '离线未核'; time = st.checkedAt ? fmt(st.checkedAt, false) : ''; }
      else if (r.st === 'na') { state = 'N/A · ' + (r.why || NA_WHY[r.id] || '无个人云端同步数据'); }
      else state = '等待核对…';
      return '<div class="sync-item"><span class="sync-dot ' + dotCls(r.st) + '"></span><b>' + esc(t.name) + '</b>' +
        '<span class="sync-state">' + esc(state) + (time ? '<br>' + esc(time) : '') + '</span></div>';
    }).join('');
    pop.innerHTML = '<h3>华夏工具 ' + (ver !== '读取中' ? 'v' + ver : '') + ' · 全站云端同步</h3>' +
      '<p class="sync-sub">' + (st.checkedAt ? '核对于 ' + fmt(st.checkedAt, true) + (st.checking ? ' · 正在重新核对…' : ' · 每 5 分钟自动核对') : '正在核对云端数据…') + '</p>' +
      rows +
      '<p class="sync-note">状态只读自各工具现有的云端表（Supabase，按账号 RLS 隔离）；N/A = 该工具没有可只读查询的个人同步数据，不影响使用。</p>';
  }

  function openPop() { if (pill.hidden) return; st.open = true; renderPop(); pop.classList.add('show'); pill.setAttribute('aria-expanded', 'true'); if (!st.results && !st.checking) probe(false); }
  function closePop() { if (!st.open) return; st.open = false; pop.classList.remove('show'); pill.setAttribute('aria-expanded', 'false'); }

  function toggle(e) { if (e) e.stopPropagation(); st.open ? closePop() : openPop(); }
  pill.onclick = toggle;
  pill.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  pop.onclick = function (e) { e.stopPropagation(); };
  document.addEventListener('click', closePop);
  // 账号变化（登录/退出/切换）会走 render() 重画 #who：在这里顺带触发/收起胶囊
  var whoEl = $('who'), lastIn = null;
  if (whoEl && window.MutationObserver) new MutationObserver(function () {
    var n = HX.in();
    if (n === lastIn) return;
    lastIn = n;
    if (!n) { st.results = null; st.checkedAt = 0; }
    renderPill();
    if (n) probe(false);
  }).observe(whoEl, { childList: true });
  // 页面回前台或每分钟到点：过期才补一次核对（并行 + 缓存，成本极低）
  setInterval(function () { if (document.visibilityState !== 'hidden' && HX.in() && !pop.classList.contains('show')) probe(false); }, 60000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && HX.in()) probe(false); });
  renderPill();
})();
</script>
</body>
</html>
