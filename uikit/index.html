<!doctype html>
<html lang="zh-CN" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI 设计 · 华夏工具</title>
<!-- 全站外观（2026-11-17 起）：这一页原来自己一套白底 + 自己的深浅开关，用户看后原话
     「这个没用背景　因为你没做卡片模块　分块没做　背景和主题没安排好啊」—— 所以接回全站那套。
     注意**不带 data-tool**：
       · 带 data-tool 的话，hx-theme.js 开头会把顶层打开的页面 location.replace 回总入口，
         开发者工具就没法单独开着用了；
       · gate() 第一行是 if (tool) 才拦，不带 data-tool ⇒ 也不挂登录墙（本页是纯静态存档，没有云端数据）。
     拿到的：壁纸层（.hx-layer + body::before）、深浅、主题色 --acc、统一滚动条、校徽水印。
     hx-theme.js 会往 <html> 写 data-hx-mode，style.css 的深色分支认的就是它。 -->
<script src="../hx-theme.js"></script>
<!-- 先把深浅定下来再渲染，避免白屏闪一下。读的键跟 hx-theme 同一把（hx-theme = {ver,acc,mode,bg,clr,bgo,wm}），
     老存档里的 uikit:mode 只做一次性兜底 —— 以前是本站独立开关，现在归全站管。 -->
<script>
  try {
    var raw = localStorage.getItem('hx-theme'), o = null;
    try { o = raw ? JSON.parse(raw) : null; } catch (e2) { }
    var m = (o && (o.mode === 'light' || o.mode === 'dark')) ? o.mode
          : (localStorage.getItem('uikit:mode') || 'dark');
    document.documentElement.setAttribute('data-mode', m);
  } catch (e) { }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <i aria-hidden="true"></i>
    <b>UI 设计</b>
    <span class="ver">v0 · —</span>
  </div>

  <label class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
    <input type="search" placeholder="搜组件、用途、关键词…" aria-label="搜索组件">
  </label>

  <!-- 2026-11-19 第七轮 T7①：删掉页面内部的深浅切换按钮（月亮图标）。
       深浅归全站管，嵌在总入口里时顶栏已有主题按钮，这里再放一颗就是重复；
       直接打开本页时深浅也跟着 hx-theme 走（下方内联脚本已按 data-hx-mode 兜底）。
       原「使用说明与来源」按钮也删了：首页 hero 和左栏已各有一个入口，顶部再来是第三处重复（T7③）。 -->
</header>

<div class="shell">
  <nav class="nav" aria-label="组件目录"></nav>
  <main class="main" id="main"></main>
</div>

<div class="toast" role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
