<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>预览 · 卡片通透度（毛玻璃卡片）</title>
<style>
  /* ── 这段就是配方本体：卡片底色 = 白 × --card-a，--card-a 由 --hx-a 推出来 ──
     --hx-a  1 = 最透（.62）  2 = 最实（1.0）
     再配 8~10px 毛玻璃，否则纯透明时数字压在照片上读不清（2026-11-17 实机试过）。 */
  :root { --hx-a: 1; }
  .card-a { --card-a: calc(var(--hx-a, 1) * .62); }
  .card {
    background-color: rgba(255, 255, 255, var(--card-a));
    backdrop-filter: blur(9px) saturate(1.06);
    -webkit-backdrop-filter: blur(9px) saturate(1.06);
    border: 1px solid rgba(255, 255, 255, .55);
    border-radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 22px; color: #20242a;
    font: 14px/1.65 "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    /* 演示用的「壁纸」：纯 CSS 渐变，不引外部图片，复制走就能跑 */
    background:
      radial-gradient(60% 55% at 22% 18%, #7c5cff 0, transparent 62%),
      radial-gradient(55% 50% at 82% 26%, #0ea5e9 0, transparent 60%),
      radial-gradient(70% 60% at 68% 92%, #f472b6 0, transparent 62%),
      linear-gradient(150deg, #1b1b2f, #2b1d3a 46%, #12233a);
    background-attachment: fixed;
  }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 14px; max-width: 620px; }
  .card { padding: 16px 18px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0; font-size: 13px; color: #3c434d; }
  .card .big { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 8px 0 0; }
  .card .big small { font-size: 12px; font-weight: 700; color: #5b6470; margin-left: 6px; }
  .panel { padding: 14px; font-size: 12.5px; }
  .panel label { display: block; font-weight: 700; margin-bottom: 6px; }
  input[type=range] { width: 100%; }
  .val { font-family: ui-monospace, monospace; font-size: 12px; color: #3c434d; }
  .tip { grid-column: 1 / -1; margin: 2px 0 0; font-size: 12px; color: #ffffffcc; text-shadow: 0 1px 2px #0006; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h3>十进制 ↔ 十六进制对照表</h3>
      <p>卡片底色跟着全站「外观 → 卡片通透度」走，壁纸从卡片后面透上来。</p>
      <p class="big">172<small>= 0xAC</small></p>
    </div>

    <div class="card panel">
      <label for="a">--hx-a</label>
      <input id="a" type="range" min="1" max="2" step="0.05" value="1">
      <div class="val" id="v">1.00 → 卡片 62%</div>
    </div>

    <p class="tip">拖滑杆：1 = 最透（卡片 62% 白 + 9px 毛玻璃），2 = 最实（不透）。</p>
  </div>

<script>
  var a = document.getElementById('a'), v = document.getElementById('v');
  function sync() {
    var n = parseFloat(a.value);
    document.documentElement.style.setProperty('--hx-a', n);
    v.textContent = n.toFixed(2) + ' → 卡片 ' + Math.round(n * 62) + '%';
  }
  a.addEventListener('input', sync); sync();
</script>
</body>
</html>
