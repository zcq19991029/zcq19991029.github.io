<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>考试 · 华夏工具</title>
<!--
  2026-11-17：旧地址兜底。
  线上考试的目录一直是 /exam/（publish.cjs 里 'exam/index.html'），但「考试」的拼音 kaoshi 太顺手，
  浏览器收藏夹、以前发出的链接、自己手敲都会落到 /kaoshi/ → GitHub Pages 直接 404，
  看起来就像「考试工具挂了」。这页只做一件事：把 /kaoshi/ 转到 /exam/。
  改目录名不可行（已发出去的 /exam/ 链接会反过来挂），所以补这一页当别名。

  跳转地址为什么这样算，而不是直接写 ../exam/：
    · 线上访问的是 /kaoshi/（GitHub Pages 会自动找 /kaoshi/index.html），地址栏停在 /kaoshi/；
    · 本地预览 _tmp/serve.cjs 把 /kaoshi/ 别名映射到别的文件，地址栏同样停 /kaoshi/；
    · 但静态托管也可能直接以 /kaoshi/index.html 访问。
  写 ../exam/ 的话，前两种从 /kaoshi/ 往上退一层就是根目录，能对；
  唯独不能假设「一定停在 /kaoshi/ 且一定没有文件名」。
  所以按 location.pathname 把末尾那段 kaoshi（以及可能的 index.html）剥掉再拼 exam/，
  三种访问方式都对，将来整站搬到子路径（比如 /tools/kaoshi/）也不用改这页。
-->
<script>
  (function () {
    var p = location.pathname.replace(/[^/]*$/, '');        // 去掉末尾的 index.html（如果有）
    p = p.replace(/kaoshi\/$/, '');                        // 去掉 kaoshi/ 这一层 → 回到站点根
    // 查询串和 hash 必须一起带过去：工程上最常用的是 ?solo（免登录墙的调试开关），
    // 丢掉它会让本地验收看到「跳回首页」，误以为这页坏了。
    location.replace(p + 'exam/' + location.search + location.hash);
  })();
</script>
  <!-- 禁用了 JS 时的兜底。相对路径就行：从 /kaoshi/ 往上一层是站点根，../exam/ = /exam/。 -->
<meta http-equiv="refresh" content="0;url=../exam/">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;gap:10px;
       font:15px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif;
       color:#3d4450;background:#f5f6f8}
  a{color:#1a56ff;font-weight:600}
</style>
</head>
<body>
  <p>正在打开考试工具… 如果没跳转，点<a href="../exam/">这里</a>。</p>
</body>
</html>
