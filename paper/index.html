/* ---------- 一、试卷内容 ---------- */
function drawContent(el) {
  const P = RP.P;
  let n = 0;
  el.innerHTML = P.map((s, si) => {
    const cnt = s.t === 'fill' ? s.items.reduce((a, q) => a + blanksOf(q), 0) : s.items.length;
    const unit = s.t === 'fill' ? '每空' : '每小题';
    const total = cnt * (+s.pts || 0);
    return `<section class="rp-sec">
      <h2 class="rp-sech">${RP_CN[si] || si + 1}、${esc(rpTName(s.t))}（本大题共 ${cnt} ${s.t === 'fill' ? '空' : '小题'}，${unit} ${s.pts} 分，满分 ${total} 分）</h2>
      ${s.items.map(q => { n += 1; return qCard(q, n, s); }).join('')}
    </section>`;
  }).join('');
  bindQCards(el);
}

function qCard(q, no, s) {
  const kp = kpOf(q), exp = expOf(q), d = diffOf(q);
  const rate = RP.stats && RP.stats.rate ? RP.stats.rate[no - 1] : null;
  const isObj = q.t === 'single' || q.t === 'multiple' || q.t === 'judgment';
  const stem = q.t === 'fill' ? (typeof blankHTML === 'function' ? blankHTML(q.q) : esc(q.q)) : stemHTML(q.q, '', true);
  const subs = (q.subs || []).map((x, i) => `<p class="rp-sub">（${i + 1}）${esc(x)}</p>`).join('');
  const opts = isObj ? optHTML(q.o) : '';
  const ans = (typeof hxAnsText === 'function' ? hxAnsText(q.a) : String(q.a == null ? '' : q.a));
  const ansTxt = /^(T|F|正确|错误)$/i.test(String(Array.isArray(q.a) ? q.a[0] : q.a || '').trim())
    ? ({ T: '正确', F: '错误', '正确': '正确', '错误': '错误' })[String(Array.isArray(q.a) ? q.a[0] : q.a).trim().toUpperCase()] || ans
    : ans;
  const chips = [kp ? `<span class="rp-chip">${esc(kp)}</span>` : '<span class="rp-chip off">未标知识点</span>'];
  return `<article class="rp-q" id="rpQ${no}" data-no="${no}">
    <div class="rp-qh"><b>${no}.</b><span class="rp-pt">${qPtsOf(q, s)} 分</span><span class="rp-tag">${esc(rpTName(q.t))}</span></div>
    <div class="rp-stem">${stem}${typeof hxFig === 'function' ? hxFig(q.fig, true, q) : ''}${subs}</div>
    ${opts}
    <div class="rp-ans"${RP.showAns ? '' : ' hidden'}><b>答案</b>${esc(ansTxt || '（没有录入答案）')}</div>
    <div class="rp-exp"${RP.openExp.has(no) ? '' : ' hidden'}><b>解析</b>${exp ? esc(exp) : '<span class="note">题池里没有这道题的解析。</span>'}</div>
    <div class="rp-qf">
      <div class="rp-tags">${chips.join('')}<span class="rp-chip ${d.guess ? 'off' : ''}" title="${d.guess ? '题池还没标难度，按题型粗判' : '来自题池'}">${RP_DIFF[d.n]}${d.guess ? '（预估）' : ''}</span>${rate == null ? '' : `<span class="rp-chip rate">得分率 ${Math.round(rate * 100)}%</span>`}</div>
      <div class="rp-acts"><button data-ans="${no}">${RP.showAns ? '藏答案' : '答案'}</button><button data-exp="${no}">解析</button><button data-bk="${no}">加入组卷篮</button></div>
    </div>
  </article>`;
}

function bindQCards(el) {
  const flat = []; RP.P.forEach(s => s.items.forEach(q => flat.push({ q, s })));
  el.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => {
    const card = b.closest('.rp-q'); const box = card.querySelector('.rp-ans');
    box.hidden = !box.hidden; b.textContent = box.hidden ? '答案' : '藏答案';
  });
  el.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => {
    const n = +b.dataset.exp, card = b.closest('.rp-q'), box = card.querySelector('.rp-exp');
    box.hidden = !box.hidden;
    if (box.hidden) RP.openExp.delete(n); else RP.openExp.add(n);
  });
  el.querySelectorAll('[data-bk]').forEach(b => b.onclick = () => {
    const n = +b.dataset.bk, x = flat[n - 1]; if (!x) return;
    const r = basketAdd({ t: x.q.t, q: x.q.q, o: x.q.o, a: x.q.a, subs: x.q.subs, pts: x.s.pts, fig: x.q.fig, knowledge: kpOf(x.q), srcId: x.q.id }, RP.item.sub, x.s.pts);
    toast(r.msg); basketToggleBtn(); if (BASKET_OPEN) basketRender();
  });
}

/* ---------- 二、试卷分析 ---------- */
function drawAnalysis(el) {
  const P = RP.P;
  const flat = []; P.forEach(s => s.items.forEach(q => flat.push({ q, pts: qPtsOf(q, s) })));
  const full = flat.reduce((a, x) => a + x.pts, 0);
  /* 题型 */
  const types = P.map(s => ({ t: s.t, n: secCount(s), pts: s.items.reduce((a, q) => a + qPtsOf(q, s), 0) }));
  /* 难度 */
  const dif = [0, 0, 0, 0, 0], difNo = [[], [], [], [], []];
  flat.forEach((x, i) => { const d = diffOf(x.q); dif[d.n] += 1; difNo[d.n].push(i + 1); });
  const difGuess = flat.some(x => diffOf(x.q).guess);
  /* 知识点 */
  const kpMap = new Map();
  flat.forEach((x, i) => {
    const k = kpOf(x.q) || '（未标知识点）';
    if (!kpMap.has(k)) kpMap.set(k, { k, n: 0, pts: 0, nos: [] });
    const o = kpMap.get(k); o.n += 1; o.pts += x.pts; o.nos.push(i + 1);
  });
  const kps = [...kpMap.values()].sort((a, b) => b.pts - a.pts);
  const st = RP.stats || {};
  const rows = (arr, head) => `<table class="rp-tb"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${arr.join('')}</tbody></table>`;
  el.innerHTML = `<section class="rp-blk">
      <h2>题型分布</h2>
      ${rows(types.map(x => `<tr><td>${esc(rpTName(x.t))}</td><td>${x.n}</td><td>${x.pts}</td><td><span class="rp-bar"><i style="width:${rpPct(x.pts, full)}%"></i></span>${rpPct(x.pts, full)}%</td></tr>`), ['题型', '题数', '分值', '分值占比'])}
    </section>
    <section class="rp-blk">
      <h2>难度分布${difGuess ? '<span class="note">（题池还没标难度，按题型粗判，标了「预估」）</span>' : ''}</h2>
      ${rows([1, 2, 3, 4].map(d => `<tr><td>${RP_DIFF[d]}</td><td>${dif[d]}</td><td class="rp-nos">${difNo[d].join('、') || '—'}</td><td><span class="rp-bar d${d}"><i style="width:${rpPct(dif[d], flat.length)}%"></i></span>${rpPct(dif[d], flat.length)}%</td></tr>`), ['难度', '题量', '题号', '题量占比'])}
    </section>
    ${st.n ? `<section class="rp-blk">
      <h2>成绩概况 <span class="note">${st.n} 人已批改</span></h2>
      <div class="rp-kpi"><div><b>${st.avg.toFixed(1)}</b><span>平均分</span></div><div><b>${st.max}</b><span>最高</span></div><div><b>${st.min}</b><span>最低</span></div><div><b>${rpPct(st.avg, full)}%</b><span>难度系数</span></div></div>
      <p class="note">难度系数 = 平均分 ÷ 满分。数值越低越难，和菁优网的口径一致。</p>
    </section>
    <section class="rp-blk">
      <h2>逐题得分率</h2>
      ${rows(flat.map((x, i) => { const r = st.rate ? st.rate[i] : null; return `<tr><td>${i + 1}</td><td>${esc(kpOf(x.q) || '—')}</td><td>${x.pts}</td><td>${r == null ? '—' : `<span class="rp-bar s"><i style="width:${Math.round(r * 100)}%"></i></span>${Math.round(r * 100)}%`}</td></tr>`; }), ['题号', '知识点', '分值', '平均得分率'])}
    </section>` : `<section class="rp-blk"><h2>成绩概况</h2><p class="note">${st.err ? '成绩读不出来：' + esc(st.err) : '这套卷还没有交卷成绩（或还没批改），所以只出结构分析。阅卷在「考试 → 交卷与批改」里做。'}</p></section>`}
    <section class="rp-blk">
      <h2>知识点分布</h2>
      ${rows(kps.map(x => `<tr><td>${esc(x.k)}</td><td>${x.n}</td><td class="rp-nos">${x.nos.join('、')}</td><td>${x.pts}</td><td>${rpPct(x.pts, full)}%</td></tr>`), ['知识点', '题量', '题号', '分值', '分值占比'])}
    </section>
    <div class="row"><button id="rpCsv">导出分析 CSV</button></div>`;
  const csv = document.getElementById('rpCsv'); if (csv) csv.onclick = () => exportAnalysis(types, dif, difNo, kps, full, st);
}

function exportAnalysis(types, dif, difNo, kps, full, st) {
  const L = [];
  L.push('试卷,' + csvCell(RP.item.name));
  L.push('科目,' + csvCell(subName(RP.item.sub)) + ',满分,' + full);
  L.push('');
  L.push('题型,题数,分值,分值占比');
  types.forEach(x => L.push([rpTName(x.t), x.n, x.pts, rpPct(x.pts, full) + '%'].join(',')));
  L.push('');
  const nQ = dif.reduce((a, b) => a + b, 0);
  L.push('难度,题量,题号,题量占比');
  [1, 2, 3, 4].forEach(d => L.push([RP_DIFF[d], dif[d], '"' + difNo[d].join('、') + '"', rpPct(dif[d], nQ) + '%'].join(',')));
  L.push('');
  L.push('知识点,题量,题号,分值,分值占比');
  kps.forEach(x => L.push([csvCell(x.k), x.n, '"' + x.nos.join('、') + '"', x.pts, rpPct(x.pts, full) + '%'].join(',')));
  if (st && st.n) {
    L.push('');
    L.push('平均分,' + st.avg.toFixed(1) + ',最高,' + st.max + ',最低,' + st.min + ',人数,' + st.n);
  }
  downloadText((RP.item.name || '试卷') + '-分析.csv', L.join('\r\n'));
}
const csvCell = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';

/* ---------- 三、知识点讲解 ---------- */
function drawKp(el) {
  const P = RP.P;
  const flat = []; P.forEach(s => s.items.forEach(q => flat.push({ q, pts: qPtsOf(q, s) })));
  const map = new Map();
  flat.forEach((x, i) => {
    const k = kpOf(x.q); if (!k) return;
    if (!map.has(k)) map.set(k, { k, nos: [], qs: [] });
    const o = map.get(k); o.nos.push(i + 1); o.qs.push(x.q);
  });
  const list = [...map.values()].sort((a, b) => b.nos.length - a.nos.length);
  if (!list.length) {
    el.innerHTML = `<div class="rp-blk"><h2>知识点讲解</h2><p class="note">这套卷的题在题池里都没有知识点标记。去「资料库」给题补上知识点，这里就能按考点聚合并生成讲解。</p></div>`;
    return;
  }
  el.innerHTML = `<div class="rp-blk"><h2>知识点讲解</h2>
    <p class="note">按题池里的知识点聚合。讲解由 AI 生成、存在本机（换设备要重新生成），可能不准，考前自己过一遍。</p>
    ${list.map(x => {
    const ck = kpCacheKey(x.k);
    const c = store.get(ck, null);
    return `<div class="rp-kp" data-kp="${esc(x.k)}">
        <div class="rp-kp-h"><b>${esc(x.k)}</b><span class="note">第 ${x.nos.join('、')} 题</span><button data-gen="${esc(x.k)}">${c ? '重新生成' : 'AI 讲解'}</button></div>
        <div class="rp-kp-b">${c ? `<div class="rp-kp-txt">${esc(c.text).replace(/\n/g, '<br>')}</div><p class="note">${c.at ? new Date(c.at).toLocaleString() : ''} · AI 生成</p>` : '<p class="note">还没有讲解。点右上「AI 讲解」按这个知识点和卷内题目生成一段。</p>'}</div>
      </div>`;
  }).join('')}</div>`;
  el.querySelectorAll('[data-gen]').forEach(b => b.onclick = () => genKp(b, b.dataset.gen, list.find(x => x.k === b.dataset.gen)));
}
const kpCacheKey = k => 'paper.kp.' + CUR_SUB + '.' + k;

async function genKp(btn, k, group) {
  const H = await loadAI();
  if (!H || typeof H.chat !== 'function') return toast('AI 组件没加载出来（hx-ai.js）');
  btn.disabled = true; const old = btn.textContent; btn.textContent = '生成中…';
  const stems = (group ? group.qs : []).slice(0, 3).map((q, i) => `${i + 1}. ${String(q.q || '').slice(0, 120)}`).join('\n');
  try {
    const txt = await H.chat({
      tool: 'paper',
      prompt: '你是中职专业课老师，给学生讲一个考点。知识点：' + k + '\n' + (stems ? '这套卷里相关的题：\n' + stems + '\n' : '')
        + '请用 180~260 字讲清：① 这个概念是什么；② 学生最容易错在哪；③ 一句话记忆法。'
        + '只输出正文，不要标题、不要 Markdown 符号、不要分点编号。'
    });
    const text = String(txt || '').trim();
    if (!text) throw new Error('AI 没返回内容');
    store.set(kpCacheKey(k), { text, at: Date.now() });
    RP.tab = 'kp'; renderReport();
    toast('讲解已生成并保存');
  } catch (e) {
    toast('生成失败：' + (e.message || e));
    btn.disabled = false; btn.textContent = old;
  }
}

/* ---------- 右栏：整卷入篮 / 打印 ---------- */
function addWholePaper() {
  let n = 0, dup = 0;
  RP.P.forEach(s => s.items.forEach(q => {
    const r = basketAdd({ t: q.t, q: q.q, o: q.o, a: q.a, subs: q.subs, pts: qPtsOf(q, s), fig: q.fig, knowledge: kpOf(q), srcId: q.id }, RP.item.sub, qPtsOf(q, s));
    r.ok ? n++ : dup++;
  }));
  basketToggleBtn();
  toast(n ? `已把 ${n} 道题放进组卷篮${dup ? '（' + dup + ' 道本来就在里面）' : ''}` : '这些题都已经在篮子里了');
}

  const doc = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>${esc(it.name)}</title><style>

    .ep-fig.sm svg{height:36px!important}

  try {
    const rows = await rpc('hx_exam_qtype_list', { p_subject_id: subId });
    (rows || []).forEach(r => { if (r && r.k) QTYPES[r.k] = r; });
  } catch (e) { }
  return QTYPES;
}

/* ---------- 外壳 ---------- */
const ME = { me: null };
const PAGES = [['center', '试卷中心', '翻卷 · 看报告 · 分析'], ['compose', '组卷中心', '从题池挑题组一套']];
let CUR_V = 'center';
/* 当前科目 key：全工具只有这一个入口（左栏科目区），列表 / 题池 / 试卷库都按它过滤。
   2026-11-21 首版漏了这行声明，bootOnce 里一读就 ReferenceError，整页空白 —— 补上。 */
let CUR_SUB = 'mcu';
const isTeacher = () => !!(ME.me && (ME.me.teacher || ME.me.admin || ME.me.dev));
const main = () => document.getElementById('pcMain');

function shell() {
  document.getElementById('app').innerHTML = `<div class="pc-shell">
    <nav class="pc-nav" id="pcNav">
      <div class="pc-brand"><b>试卷中心</b><span>组卷 · 试卷报告</span></div>
      <div class="pc-tabs">${PAGES.map(([k, n, s]) => `<button class="pc-tab" data-v="${k}" title="${esc(n)}：${esc(s)}"><b>${esc(n)}</b><span>${esc(s)}</span></button>`).join('')}</div>
      <div class="pc-subh">科目</div>
      <div class="pc-subs" id="pcSubs"></div>
      <a class="pc-jump" href="../exam/#exam" target="_top" title="去考试工具：发布考试、批改、导出成绩">考试工具 ↗</a>
    </nav>
    <div class="pc-main" id="pcMain"></div>
    <aside class="pc-basket" id="pcBasket" aria-label="组卷篮"></aside>
    <div class="pc-top">
      <button class="pc-basketbtn" id="pcBasketBtn" onclick="basketOpen()"></button>
    </div>
  </div>`;
  drawSubs();
  document.getElementById('pcNav').addEventListener('click', e => {
    const t = e.target.closest('[data-v],[data-sub]');
    if (!t) return;
    if (t.dataset.sub != null) return subPick(t.dataset.sub);
    go(t.dataset.v);
  });
  basketToggleBtn();
  go(CUR_V);
}
function drawSubs() {
  const box = document.getElementById('pcSubs'); if (!box) return;
  box.innerHTML = SUBJ.map(s => `<button class="pc-sub${s.key === CUR_SUB ? ' on' : ''}" data-sub="${esc(s.key)}" title="${esc(s.name)}">${esc(s.name)}</button>`).join('');
}
function subPick(k) {
  if (k === CUR_SUB) return;
  CUR_SUB = k; drawSubs(); toast('已切换到「' + subName(k) + '」');
  go(CUR_V);
}
if (typeof basketToggleBtn === 'function') { /* 篮子按钮在 shell() 里画，绑定时 basket.js 已就绪 */ }

/* 路由：只认两个视图；详情是 center 视图里的子状态（HXReport 自己管） */
function go(v) {
  if (!PAGES.some(x => x[0] === v)) v = 'center';
  CUR_V = v;
  document.querySelectorAll('.pc-tab').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  try { history.replaceState(null, '', '#' + v); } catch (e) { }
  if (v === 'compose') return HXCompose.mount();
  return listMount();
}

/* ================= 试卷中心：列表 ================= */
let LIST = null, LIST_AT = 0;      // 缓存 30 秒，切科目 / 从详情返回不必每次重拉
let F_SRC = 'all', F_KW = '', F_SORT = 'new';

function examQs(x) {
  if (typeof ePaperDecode !== 'function') return [];
  return ePaperDecode(x.paper) || [];
}
function libQsOf(it) {
  const p = it.payload || {};
  if (Array.isArray(p.items)) return p.items.length;
  const secs = Array.isArray(p.sections) ? p.sections : [];
  return secs.reduce((a, s) => a + Math.max(0, +s.n || 0), 0);
}
function normItems() {
  const out = [];
  (LIST.exams || []).forEach(x => {
    const qs = examQs(x);
    out.push({
      kind: 'exam', key: 'e' + x.id, id: x.id, name: x.title, sub: x.subject, at: Date.parse(x.created_at) || 0,
      qs: qs.length, full: qs.reduce((a, q) => a + (+q.pts || 0), 0), subs: +x.subs || 0,
      code: x.code, open: !!x.open, legacy: !qs.length, raw: x
    });
  });
  (LIST.libs || []).forEach(it => {
    out.push({
      kind: 'lib', key: 'l' + it.id, id: it.id, name: it.name, sub: it.sub, at: +it.at || 0,
      qs: libQsOf(it), full: (it.payload && Array.isArray(it.payload.sections) ? it.payload.sections.reduce((a, s) => a + (+s.n || 0) * (+s.pts || 0), 0) : 0),
      subs: 0, code: '', open: false, legacy: false, raw: it
    });
  });
  return out;
}
function filtered() {
  let a = normItems().filter(x => (x.sub || 'mcu') === CUR_SUB);
  if (F_SRC !== 'all') a = a.filter(x => x.kind === F_SRC);
  const kw = F_KW.trim().toLowerCase();
  if (kw) a = a.filter(x => String(x.name || '').toLowerCase().includes(kw));
  if (F_SORT === 'new') a.sort((x, y) => y.at - x.at);
  else if (F_SORT === 'qs') a.sort((x, y) => y.qs - x.qs);
  else if (F_SORT === 'full') a.sort((x, y) => y.full - x.full);
  return a;
}
const fDate = t => { const d = new Date(t); return isNaN(d) || !t ? '—' : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };

async function listLoad(force) {
  if (!force && LIST && Date.now() - LIST_AT < 30000) return LIST;
  /* 只换列表区，**不动整块 main**：2026-11-21 首版这里写的是 main().innerHTML = 载入占位，
     结果把工具栏和 #pcList 一起抹掉，回来之后 paintList 找不到容器、静默返回，页面一直停在「正在读取试卷…」。 */
  const box = document.getElementById('pcList');
  if (box) { box.innerHTML = fxLoad('正在读取试卷…'); if (window.HXLoadFx) HXLoadFx.auto(box); }
  const out = { exams: [], libs: [], err: '' };
  const [r1, r2] = await Promise.allSettled([
    rpc('hx_exam_mine'),
    (window.HXLib ? HXLib.load('paper', CUR_SUB) : Promise.resolve([]))
  ]);
  if (r1.status === 'fulfilled') out.exams = Array.isArray(r1.value) ? r1.value : [];
  else out.err = '电子卷读不出来：' + (r1.reason && r1.reason.message || '');
  if (r2.status === 'fulfilled') out.libs = Array.isArray(r2.value) ? r2.value : [];
  else out.err = (out.err ? out.err + '；' : '') + '试卷库读不出来：' + (r2.reason && r2.reason.message || '');
  LIST = out; LIST_AT = Date.now();
  return out;
}

async function listMount() {
  const box = main(); if (!box) return;
  box.innerHTML = `<header class="pc-h"><h1>试卷中心</h1><p class="note">${esc(subName(CUR_SUB))} · 电子卷与试卷库里的卷，点开就是一份带答案和统计的报告</p></header>
    <div class="pc-bar">
      <label>来源<select id="pfSrc"><option value="all">全部</option><option value="exam">电子考试</option><option value="lib">试卷库</option></select></label>
      <label>排序<select id="pfSort"><option value="new">最新在前</option><option value="qs">题数最多</option><option value="full">总分最高</option></select></label>
      <label class="pc-kw">搜索<input id="pfKw" placeholder="试卷标题里的一段字" value="${esc(F_KW)}"></label>
      <button id="pfNew">刷新</button>
    </div>
    <div id="pcList" class="pc-grid">${fxLoad('正在读取试卷…')}</div>`;
  if (window.HXLoadFx) HXLoadFx.auto(document.getElementById('pcList'));
  const src = document.getElementById('pfSrc'); if (src) src.value = F_SRC;
  const srt = document.getElementById('pfSort'); if (srt) srt.value = F_SORT;
  src.onchange = () => { F_SRC = src.value; paintList(); };
  srt.onchange = () => { F_SORT = srt.value; paintList(); };
  let tmr = null;
  document.getElementById('pfKw').oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => { F_KW = e.target.value; paintList(); }, 140); };
  document.getElementById('pfNew').onclick = async () => { LIST = null; await listLoad(true); paintList(); toast('已刷新'); };
  await listLoad();
  paintList();
}

function paintList() {
  const box = document.getElementById('pcList'); if (!box || !box.isConnected) return;
  if (!LIST) return;
  const a = filtered();
  const warn = LIST.err ? `<p class="note pc-warn">${esc(LIST.err)}</p>` : '';
  const subNote = SUBJ_ERR && CUR_SUB === 'mcu' ? `<p class="note pc-warn">${esc(SUBJ_ERR)}</p>` : '';
  if (!a.length) {
    box.innerHTML = `<div class="pc-empty card"><b>这个科目下还没有卷子</b>${warn}${subNote}
      <p class="note">电子卷在「考试」里发布；纸质卷在「组卷中心」挑题后存进试卷库，两边都会出现在这里。</p>
      <div class="row"><button class="pri" id="pcGoCompose">去组卷中心</button></div></div>`;
    const b = document.getElementById('pcGoCompose'); if (b) b.onclick = () => go('compose');
    window.__pcReady = true;
    return;
  }
  box.innerHTML = warn + subNote + a.map(x => `<article class="pc-card" data-open="${esc(x.key)}" tabindex="0" role="button">
      <div class="pc-card-h"><span class="pc-src ${x.kind}">${x.kind === 'exam' ? '电子卷' : '试卷库'}</span>${x.legacy ? '<span class="pc-legacy">旧格式</span>' : ''}${x.kind === 'exam' ? `<span class="pc-code">${esc(x.code)}</span>` : ''}</div>
      <h3 title="${esc(x.name)}">${esc(x.name)}</h3>
      <div class="pc-meta"><span>${x.qs} 题</span><span>满分 ${x.full}</span><span>${x.kind === 'exam' ? x.subs + ' 人交卷' : fDate(x.at)}</span></div>
      <div class="pc-card-f"><span class="note">${esc(subName(x.sub))}</span><span class="pc-arrow">打开报告 →</span></div>
    </article>`).join('');
  window.__pcReady = true;
  box.querySelectorAll('[data-open]').forEach(el => {
    const open = () => { const it = a.find(y => y.key === el.dataset.open); if (it) HXReport.open(it); };
    el.onclick = open;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  });
}

/* ================= 启动 ================= */
let booting = false, booted = false;
async function boot() {
  if (booting || booted) return; booting = true;
  try { await bootOnce(); booted = true; }
  finally { booting = false; if (window.HXLoadFx) HXLoadFx.finishBoot(); }
}
async function bootOnce() {
  load();
  if (!sess || !sess.access_token) return gate('登录后看试卷', '试卷中心只对教师开放：翻卷、看报告、组卷都在登录之后', '登录', login);
  try { ME.me = await rpc('hx_me'); } catch (e) {
    if (e.status === 401) return gate('登录过期了', '请在首页重新登录', '登录', login);
    return gate('出错了', e.message);
  }
  if (!isTeacher()) return gate('这个工具只给教师用', '学生端不需要试卷中心 —— 去「考试」输考试码就行', '去考试', () => location.href = '../exam/#exam');
  await loadSubjects();
  document.getElementById('app').innerHTML = '';
  shell();
}
function gate(t, sub, btn, fn) {
  document.getElementById('app').innerHTML = `<div class="pc-gate card"><h1>${esc(t)}</h1><p class="note">${esc(sub)}</p>${btn ? `<button class="pri big" id="gGo">${esc(btn)}</button>` : ''}</div>`;
  if (btn) document.getElementById('gGo').onclick = fn;
  if (window.HXLoadFx) HXLoadFx.finishBoot();
}

/* AI：和首页「AI 设置」同一条路（hx-ai.js 是全局脚本，本工具不内联它，按需拉） */
let AI_P = null, AI_FAIL = false;
function loadAI() {
  if (window.HXAI) return Promise.resolve(window.HXAI);
  if (AI_P) return AI_P;
  AI_P = new Promise(r => {
    const s = document.createElement('script');
    s.src = '../hx-ai.js';
    s.onload = () => r(window.HXAI || null);
    s.onerror = () => { AI_FAIL = true; r(null); };
    document.head.appendChild(s);
  });
  return AI_P;
}

window.HXPapers = { go, list: listLoad, sub: () => CUR_SUB, subName, refresh: () => { LIST = null; return listLoad(true); } };

/* 兜底：脚本抛错时绝不留一屏空白（这个项目踩过「删了 DOM、JS 还引用」导致整页停在载入动画的事故）。
   只在 #app 还空着的时候接管；页面已经画出来就不打扰，错误交给 toast。 */
function pcFatal(e) {
  const a = document.getElementById('app'); if (!a || a.innerHTML.trim()) return;
  a.innerHTML = `<div class="pc-gate card"><h1>页面没跑起来</h1><p class="note">${esc(String(e && e.message || e || '未知错误'))}</p>
    <p class="note">先刷新一次；还不行，把这句话发给维护的老师。</p><button class="pri big" id="pcReload">刷新</button></div>`;
  const b = document.getElementById('pcReload'); if (b) b.onclick = () => location.reload();
  if (window.HXLoadFx) HXLoadFx.finishBoot();
}
window.addEventListener('error', ev => pcFatal(ev.error || ev.message));
window.addEventListener('unhandledrejection', ev => pcFatal(ev.reason));

boot();
</script>
