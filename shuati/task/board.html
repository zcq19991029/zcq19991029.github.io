<!doctype html>
<!-- 华夏工具 · 刷题 · 课堂任务大屏（2026-11-22）
     用法：教师在任务列表点「打开大屏」，新窗口地址是 board.html?t=<任务id>；
           不带参数也能开，自动挑一个进行中的任务。
     设计：深色底 + 超大字号，后排也看得清；整屏不滚动，人多自动换列/缩字号。
     只读：不在这一页做任何写操作，多个大屏同开不会互相抢状态。
     不引 hx-theme.js：这一页是 window.open 开在顶层窗口投屏的，带上 data-tool 会被
     主题脚本 replace 回总入口 —— 正在投的榜单一秒变首页（接线仿真踩过这个坑）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060a14">
<title>课堂任务大屏 · 刷题</title>
<link rel="stylesheet" href="task.css">
</head>
<body class="qt-board">
<div id="bdRoot" class="bd-wrap"><div class="bd-empty">读取任务…</div></div>
<script type="module" src="task-board.js"></script>
</body>
</html>
