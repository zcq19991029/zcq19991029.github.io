<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>刷题 · 华夏工具</title>
<!-- 华夏工具 · 刷题 © 2026 zcq：选科目刷单选、多选、判断；内置课程题库，可新建科目、导入资料或让 AI 根据资料出题；登录后进度和题库跟账号走，老师可把题库发布给学生。 -->
<link rel="icon" href="../logo.jpg">
<link rel="stylesheet" href="../hx-theme.css">
<script src="../hx-theme.js" data-tool="quiz"></script>
<!-- 统一弹窗组件：hxAlert / hxConfirm / hxPrompt（必须在业务脚本之前加载） -->
<script src="../ui-dialog.js"></script>
<!-- 题库分享码的二维码（离线生成，不发请求；和总入口共用一份，见 fx/NOTICE-qr.md） -->
<script src="../fx/hx-qr.js"></script>
<link rel="stylesheet" href="style.css">
<!-- 统一像素加载动效（2026-11-04）：打开科目时「正在加载题库…」不再只是药丸方块，
     首选随机挑一个 pixelfx 特效画 canvas（会话内固定，规则见 loadfx.js 头注释），
     播不了回落到原来的像素方块药丸。两个脚本都必须在 app.js（module）之前同步加载完，
     module 本身是 deferred 的，顺序天然保证；特效包拷自 小组加分/fx/pixelfx-loader.js（MIT）。 -->
<script src="vendor/pixelfx-loader.js"></script>
<script src="loadfx.js"></script>
</head>
<body>
<!-- 首屏加载层（2026-11-06 修时序）：页面解析到这里就由 loadfx.js 的 boot() 接管并在**同一次绘制**里
     画出第一帧像素动效，所以用户看到的第一眼就是「canvas 动效 + 药丸」的结合体。
     以前这里什么都没有，要等 app.js 的 boot() 走到 openSubject() 才在题卡里画动效——
     那段时间屏幕上只有左上角一行「加载中」，内容出来后动效才蹦出来，用户实测就是这个时序反了。
     数据就绪后 app.js 调 HXLoadFx.finishBoot()，整层淡出移除。 -->
<div class="hx-boot" id="hxBoot" aria-hidden="true">
  <div class="hx-boot-card">
    <canvas id="hxBootCv" width="96" height="96"></canvas>
    <p class="hx-boot-title">刷题</p>
    <div class="hx-loadpill sm" role="status" aria-live="polite">
      <span class="hx-px" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i></span>
      <b>正在载入…</b>
    </div>
  </div>
</div>
<script>window.HXLoadFx && HXLoadFx.boot('quiz', 'hxBoot');</script>
<header class="top">
  <a class="brand" id="brand" href="../" target="_top"><img src="../logo.jpg" alt=""><span>刷题</span></a>
  <button class="subj" id="subjBtn" type="button"><b id="subjName">加载中</b><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>
  <nav class="tabs" id="tabs"></nav>
  <div class="sp"></div>
  <button class="tbtn" id="askBtn" type="button">问 AI</button>
  <button class="tbtn" id="focusBtn" type="button">专注</button>
</header>

<main>
  <section class="view" id="v-practice">
    <div class="hero glow" id="hero"></div>
    <div class="seg" id="types"></div>
    <div class="row"><div class="chips" id="scopes"></div><button class="ibtn" id="modeBtn" type="button"></button></div>
    <article class="card glow" id="card" aria-live="polite"></article>
  </section>
  <section class="view" id="v-overview" hidden></section>
  <section class="view" id="v-rank" hidden></section>
  <section class="view" id="v-bank" hidden></section>
  <section class="view" id="v-settings" hidden></section>
</main>

<div class="bar" id="bar"></div>
<nav class="dock" id="dock"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet glow" id="sheet" aria-modal="true" role="dialog"><div class="grip"></div><div id="sheetBody" class="body"></div></section>
<button class="unfocus" id="unfocus" type="button">退出专注</button>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
