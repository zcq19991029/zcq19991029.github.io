<style>

<body>
<div class="app" id="app"></div>
<script>
'use strict';
/* ================= 华夏工具 · 回收站 =================
   统一回收站（第三轮 B 组任务 5）。三类「删了就没了」的东西：
     ① 课堂任务（含学生完成记录 + 分数）—— 后端已软删除，读 wire_task_bin、还原 wire_task_restore；
     ② 试卷库（老师精心组的卷）—— 前端删除时留档，还原重新 hx_exam_lib_save；
     ③ 教材（老师上传的文档）—— 前端删除时留档元数据，还原 hx_exam_mat_save（文件本体提示重新上传）。
   题池删题**不进回收站**（用户确认：题随时能重新生成，删了就是永久）。
   本地留档 key：hx-recycle-v1，结构 [{kind, id, name, at, payload}]。 */
var HXB='https://eiqgyrjrwdaunhxjmdyr.supabase.co', HXK='sb_publishable_FcVnLx3TNrj6HnbgarYnRw_DW4-yFzd', SKEY='paike-session', RKEY_BASE='hx-recycle-v1';
var ME=null, CUR_KIND='all';
function currentUid(){ return (ME && ME.id) || (sess && sess.user && sess.user.id) || ''; }
function rkey(){ var u=currentUid(); return u ? (RKEY_BASE + '::' + u) : ''; }
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var now=function(){return Math.floor(Date.now()/1000);};
var when=function(t){var d=new Date(+t||t);return isNaN(d)?'':(d.getMonth()+1)+'月'+d.getDate()+'日 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');};

/* ---- 会话 + rpc（和资料库/考试同一套：共用 paike-session，快过期先续期） ---- */
var sess=null;
function load(){try{sess=JSON.parse(localStorage.getItem(SKEY));}catch(e){sess=null;}return sess;}
function keep(v){sess=v;try{v?localStorage.setItem(SKEY,JSON.stringify(v)):localStorage.removeItem(SKEY);}catch(e){}}
var refreshing=null;
async function fresh(){
  load(); if(!sess||!sess.expires_at||now()<sess.expires_at-60) return;
  if(!sess.refresh_token) return;
  if(refreshing) return refreshing;
  var usedRt=sess.refresh_token, prevUser=sess.user||null;
  refreshing=(async function(){
    try{
      var j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:usedRt},auth:false});
      keep({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||now()+(j.expires_in||3600),user:j.user||prevUser||null});
    }catch(e){
      var cur=load();
      if(cur&&cur.access_token&&cur.expires_at&&now()<cur.expires_at-60) return;
      if(!e.status) throw e;
      if(cur&&cur.refresh_token===usedRt) keep(null);
      throw e;
    }finally{refreshing=null;}
  })();
  return refreshing;
}
async function api(p,o){
  o=o||{};
  if(o.auth!==false) await fresh();
  var h={apikey:HXK,'Content-Type':'application/json'};
  if(o.auth!==false&&sess) h.Authorization='Bearer '+sess.access_token;
  var r; try{r=await fetch(HXB+p,{method:o.method||'GET',headers:h,body:o.body===undefined?undefined:JSON.stringify(o.body)});}
  catch(e){throw new Error('连不上服务器，请检查网络');}
  var t=await r.text(),j=null;try{j=t?JSON.parse(t):null;}catch(e){j=t;}
  if(!r.ok){var e=new Error(String(j&&(j.message||j.msg||j.error_description)||'HTTP '+r.status));e.status=r.status;throw e;}
  return j;
}
var rpc=function(f,b){return api('/rest/v1/rpc/'+f,{method:'POST',body:b||{}});};

/* ---- 本地回收站留档（2026-11-19 起**跟账号走**：本机只是副本，云端 hx_pref.data['hx-recycle-v1'] 才是真相） ----
   用户原话：「永远不存在本机换电脑就看不到的东西」。
   所以这里改成：开机先从云端拉一份铺下来；任何写入（留档/还原后移除）都推回云端。
   window.HXC 是 /hx-cloud.js 提供的（没加载到就退化成纯本机，页面照样能用）。 */
function recycleRead(){
  var k = rkey();
  if(!k) return [];
  try{
    var raw = localStorage.getItem(k);
    if(raw != null) return JSON.parse(raw) || [];
    /* 仅在首次迁移且尚未标记时读取旧全局键，并立即删除旧键，严禁切换账号后串号 */
    var legacy = localStorage.getItem(RKEY_BASE);
    if(legacy != null){
      var arr = JSON.parse(legacy) || [];
      localStorage.setItem(k, JSON.stringify(arr));
      localStorage.removeItem(RKEY_BASE);
      return arr;
    }
    return [];
  }catch(e){return [];}
}
function recycleWrite(L){
  var k = rkey();
  if(!k) return;
  try{localStorage.setItem(k,JSON.stringify(L));}catch(e){}
  recyclePush(L);
}
function recyclePush(L){
  try{ if(window.HXC&&HXC.prefPut) HXC.prefPut(RKEY_BASE,JSON.stringify(L)).catch(function(){}); }catch(e){}
}
async function recyclePull(){
  if(!window.HXC||!HXC.prefGet) return;
  var k = rkey();
  if(!k) return;
  var all=null;
  try{ all=await HXC.prefGet(); }catch(e){ return; }
  var raw=all&&all[RKEY_BASE];
  var local=recycleRead();
  if(raw){
    var arr=null;
    try{ arr=JSON.parse(raw); }catch(e){ arr=null; }
    if(Array.isArray(arr)){
      /* 云端为准。合并一下：两边都有就按 id+kind 去重，云端在前（更新的顺序更准）。 */
      var seen={}, merged=[];
      arr.concat(local).forEach(function(x){
        var key=x&&x.kind+'|'+x.id;
        if(!key||seen[key]) return; seen[key]=1; merged.push(x);
      });
      try{localStorage.setItem(k,JSON.stringify(merged.slice(0,200)));}catch(e){}
      return;
    }
  }
  /* 云端还没有而本机有：把本机这份当初始值推上去（老用户迁移） */
  if(local.length) recyclePush(local);
}
function recycleAdd(rec){
  var L=recycleRead();
  L.unshift(rec);
  recycleWrite(L.slice(0,200));
}
function recycleDrop(rec){ // 还原成功后移除这条留档
  var L=recycleRead().filter(function(x){return !(x.kind===rec.kind&&String(x.id)===String(rec.id));});
  recycleWrite(L);
}

/* ---- toast ---- */
var toastT=0;
function toast(m){var t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},4200);}

var IC = {
  task: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  lib: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
  mat: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l2 2h6.5A1.5 1.5 0 0 1 20 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/></svg>'
};
var ICC = { task:'#ff7a00', lib:'#7d7aff', mat:'#a3e635' };

/* ---- 三类数据源 ---- */
async function taskBin(){ // 课堂任务：读后端软删除（云端真相）
  try { return await rpc('wire_task_bin'); }
  catch(e){ return { __err: e.message }; }
}
function libBin(){ // 试卷库：前端留档（现在跟账号走，见 recyclePull）
  return recycleRead().filter(function(x){return x.kind==='lib';});
}
/* 教材（2026-11-19 改）：优先读云端 hx_exam_mat_bin —— 教材现在是**软删除**，
   行还在、切段还在、Storage 原文件也还在，还原就是清掉 deleted_at，不用重新上传。
   老库还没跑 2026-11-19 迁移时这个函数不存在 → 退回本机留档（老记录，还原会走 hx_exam_mat_save）。 */
async function matBin(){
  var localMats = recycleRead().filter(function(x){return x.kind==='mat';});
  try{
    var r=await rpc('hx_exam_mat_bin');
    if(Array.isArray(r)){
      var seen={};
      var cloud=r.map(function(x){ x.__cloud=1; seen[String(x.id)]=1; return x; });
      var extra=localMats.filter(function(x){ return !seen[String(x.id)]; });
      return cloud.concat(extra);
    }
  }catch(e){ /* 函数还没建：走下面的老路 */ }
  return localMats;
}

/* ---- 还原 ---- */
async function restoreTask(rec,btn){
  btn.disabled=true; btn.textContent='还原中…';
  try{
    await rpc('wire_task_restore',{p_task:rec.id});
    toast('已还原课堂任务「'+rec.title+'」');
    render();
  }catch(e){ toast('还原失败：'+e.message); btn.disabled=false; btn.textContent='还原'; }
}
async function restoreLib(rec,btn){
  btn.disabled=true; btn.textContent='还原中…';
  try{
    var r=await rpc('hx_exam_lib_save',{p_sub:rec.payload.sub,p_kind:rec.payload.kind,p_name:rec.name,p_payload:rec.payload.payload});
    if(!r||!r.id) throw new Error('云端没返回编号');
    recycleDrop(rec);
    toast('已还原试卷「'+rec.name+'」到试卷库');
    render();
  }catch(e){ toast('还原失败：'+e.message); btn.disabled=false; btn.textContent='还原'; }
}
async function restoreMat(rec,btn){
  btn.disabled=true; btn.textContent='还原中…';
  try{
    if(rec.__cloud){
      /* 软删除的记录：直接清 deleted_at，文件本体和切段都原样回来 */
      await rpc('hx_exam_mat_restore',{p_id:+rec.id});
      toast('已还原教材「'+rec.name+'」到资料库'+(rec.subject?'（'+rec.subject+'）':'')+'，原文件和切段都还在，不用重新上传');
    }else{
      /* 2026-11-19 之前删的老记录：只在本机留了元数据，只能把条目找回来 */
      var r=await rpc('hx_exam_mat_save',{p_subject_id:rec.payload.subject_id,p_name:rec.name,p_mime:rec.payload.mime,p_bytes:rec.payload.bytes,p_path:rec.payload.path,p_chars:rec.payload.chars});
      if(!r||!r.id) throw new Error('云端没返回编号');
      recycleDrop(rec);
      toast('已还原教材「'+rec.name+'」（这是旧记录，文件本体要重新上传）');
    }
    render();
  }catch(e){ toast('还原失败：'+e.message); btn.disabled=false; btn.textContent='还原'; }
}

/* ---- 彻底删除（不可逆） ----
   用户原话：「回收站里“彻底删除”的后端函数已经备好（hx_exam_mat_purge），前端还没接按钮」。
   三种东西的实际含义不一样，别混着处理：
     · 教材（云端记录）：hx_exam_mat_purge 删行 + **返回 Storage 路径**，路径要前端拿去做第二次请求
       真删文件 —— 函数体在数据库里删不了 storage.objects，只能把 path 交回来。
       老记录（__cloud 不存在）库里早就没这行了，本地留档删掉就等于彻底没。
     · 试卷库：没有云端表，留档只在这份 hx-recycle-v1 里，删掉本地记录（并推云端）就没了。
     · 课堂任务：后端没有 purge 函数（连 hx_wire_task_run 的成绩和小组加分的入账记录都还挂着），
       这一轮不做 —— 宁可先不给按钮，也不要做出一个会留下孤儿分数的「彻底删除」。 */
var MAT_BUCKET = 'exam-material';
function ask(msg){ // 统一走全站确认框；ui-dialog.js 没加载到就退原生 confirm
  if (typeof window.hxConfirm === 'function') return window.hxConfirm(msg);
  return Promise.resolve(window.confirm(msg));
}
async function rmFile(path){
  if (!path || !sess || !sess.access_token) return;
  try{
    await fetch(HXB + '/storage/v1/object/' + MAT_BUCKET + '/' + String(path).replace(/^\/+/, ''), {
      method:'DELETE', headers:{ apikey:HXK, Authorization:'Bearer ' + sess.access_token }
    });
  }catch(e){ /* 文件删不掉也算删成功：行已经没了，用户看到的就是没了；留个孤儿文件不影响使用 */ }
}
async function purgeMat(rec, btn){
  var ok = await ask('彻底删除教材「' + rec.name + '」？\n\n'
    + '原件和切段会一起删掉，回收站里也不会再出现，删了就找不回来。\n'
    + '已经用它出好的题不受影响（那些题在题池里，不跟着这份资料走）。');
  if (!ok) return;
  btn.disabled = true; btn.textContent = '删除中…';
  try{
    if (rec.__cloud){
      var p = await rpc('hx_exam_mat_purge', { p_id:+rec.id });
      await rmFile(typeof p === 'string' ? p : (p && p.path));
    }
    recycleDrop(rec);
    toast('已彻底删除「' + rec.name + '」');
    render();
  }catch(e){ toast('彻底删除失败：' + e.message); btn.disabled = false; btn.textContent = '彻底删除'; }
}
async function purgeLib(rec, btn){
  var ok = await ask('彻底删除试卷「' + rec.name + '」？\n\n' + '删了就找不回来，回收站里也不会再出现。');
  if (!ok) return;
  btn.disabled = true; btn.textContent = '删除中…';
  recycleDrop(rec);
  toast('已彻底删除「' + rec.name + '」');
  render();
}

/* ---- 渲染 ---- */
async function render(){
  var task = await taskBin();
  var lib = libBin(), mat = await matBin();
  var app=$('app');
  var h='<header><div class="mark">'+IC.task+'</div><div><h1>回收站</h1><p>删掉的课堂任务、试卷、教材都能在这里还原。题池删题是永久的（题可随时重新生成），不进这里。</p></div></header>';
  var tabs=[['all','全部'],['task','课堂任务'],['lib','试卷库'],['mat','教材资料']];
  h += '<div class="tabs">' + tabs.map(function(t){
    return '<button type="button" class="tab'+(CUR_KIND===t[0]?' on':'')+'" data-kind="'+t[0]+'">'+t[1]+'</button>';
  }).join('') + '</div>';

  /* ① 课堂任务 */
  var taskList = Array.isArray(task)?task:[];
  if(CUR_KIND==='all'||CUR_KIND==='task'){
  h += '<section class="sec"><div class="sec-h"><h2>课堂任务</h2><span class="n">'+taskList.length+' 个</span></div><div class="card">';
  if(task.__err){ h += '<div class="empty">读不到课堂任务回收站：<b>'+esc(task.__err)+'</b></div>'; }
  else if(!taskList.length){ h += '<div class="empty">没有删除的课堂任务</div>'; }
  else taskList.forEach(function(t){
    h += '<div class="item"><span class="ic" style="background:'+ICC.task+'">'+IC.task+'</span>'
      +'<div class="body"><b>'+esc(t.title||('电路 '+(t.circuit||'')))+'</b><span>'+esc(t.class_name||'')+' · 完成 '+t.done+'/'+t.total+' 人 · 删除于 '+when(t.deleted_at)+'</span></div>'
      +'<span class="acts"><button class="restore" data-restore-task="'+t.id+'">还原</button></span></div>';
  });
  h += '</div>';
  /* 课堂任务后端只有「软删除 / 还原」，没有 purge（任务删了，hx_wire_task_run 的完成记录和
     小组加分的入账都还挂在它上面）。与其给个会留孤儿分数的按钮，不如说清楚。 */
  if(taskList.length) h += '<div class="note-warn">课堂任务没有「彻底删除」：它的完成记录和小组加分入账还挂在上面，'
    +'一键删干净会留下对不上的分数。要彻底清，先去小组加分把对应入账撤回，再删任务；否则就先留在这儿，随时能还原。</div>';
  h += '</section>';
  }

  /* ② 试卷库 */
  if(CUR_KIND==='all'||CUR_KIND==='lib'){
  h += '<section class="sec"><div class="sec-h"><h2>试卷库</h2><span class="n">'+lib.length+' 份</span></div><div class="card">';
  if(!lib.length){ h += '<div class="empty">没有删除的试卷</div>'; }
  else lib.forEach(function(x){
    h += '<div class="item"><span class="ic" style="background:'+ICC.lib+'">'+IC.lib+'</span>'
      +'<div class="body"><b>'+esc(x.name)+'</b><span>删除于 '+when(x.at)+'</span></div>'
      +'<span class="acts"><button class="restore" data-restore-lib="'+esc(x.id)+'">还原</button>'
      +'<button class="purge" data-purge-lib="'+esc(x.id)+'">彻底删除</button></span></div>';
  });
  h += '</div></section>';
  }

  /* ③ 教材 */
  if(CUR_KIND==='all'||CUR_KIND==='mat'){
  h += '<section class="sec"><div class="sec-h"><h2>教材资料</h2><span class="n">'+mat.length+' 份</span></div><div class="card">';
  if(!mat.length){ h += '<div class="empty">没有删除的教材</div>'; }
  else mat.forEach(function(x){
    h += '<div class="item"><span class="ic" style="background:'+ICC.mat+'">'+IC.mat+'</span>'
      +'<div class="body"><b>'+esc(x.name)+'</b><span>'
      +(x.subject?'<b>'+esc(x.subject)+'</b> · ':'')
      +(x.__cloud?(+(x.chars||0)).toLocaleString()+' 字 · ':'')
      +'删除于 '+when(x.at)+(x.__cloud?'':' · 旧记录，还原后需要重新上传文件')+'</span></div>'
      +'<span class="acts"><button class="restore" data-restore-mat="'+esc(x.id)+'">还原</button>'
      +'<button class="purge" data-purge-mat="'+esc(x.id)+'">彻底删除</button></span></div>';
  });
  h += '</div></section>';
  }

  h += '<div class="note-warn">教材删除是<b>软删除</b>：原文件和切段都留在云端，点「还原」就回到资料库原来的科目下，<b>不用重新上传</b>。'
    +'只有 2026-11-19 之前删的旧记录例外（那时是直接删文件，只剩一条记录）。已经出好的题不受影响，仍在题池里。'
    +'<br>「彻底删除」是<b>不可逆</b>的：教材会连云端原件一起删，试卷库删掉这条留档，两者都不会再出现在这里。</div>';

  app.innerHTML=h;

  /* 绑定还原 */
  app.querySelectorAll('[data-restore-task]').forEach(function(b){ b.onclick=function(){
    var id=+b.dataset.restoreTask, rec=taskList.find(function(t){return t.id===id;});
    if(rec) restoreTask(rec,b);
  };});
  app.querySelectorAll('[data-restore-lib]').forEach(function(b){ b.onclick=function(){
    var id=b.dataset.restoreLib, rec=lib.find(function(x){return String(x.id)===String(id);});
    if(rec) restoreLib(rec,b);
  };});
  app.querySelectorAll('[data-restore-mat]').forEach(function(b){ b.onclick=function(){
    var id=b.dataset.restoreMat, rec=mat.find(function(x){return String(x.id)===String(id);});
    if(rec) restoreMat(rec,b);
  };});
  app.querySelectorAll('[data-purge-lib]').forEach(function(b){ b.onclick=function(){
    var id=b.dataset.purgeLib, rec=lib.find(function(x){return String(x.id)===String(id);});
    if(rec) purgeLib(rec,b);
  };});
  app.querySelectorAll('[data-kind]').forEach(function(b){ b.onclick=function(){
    CUR_KIND=b.dataset.kind||'all'; render();
  };});
  app.querySelectorAll('[data-purge-mat]').forEach(function(b){ b.onclick=function(){
    var id=b.dataset.purgeMat, rec=mat.find(function(x){return String(x.id)===String(id);});
    if(rec) purgeMat(rec,b);
  };});
}

/* ---- 开机 ---- */
function gate(){
  if(window.HXTheme && HXTheme.login && window.top !== window) HXTheme.login();
  $('app').innerHTML='<div class="gate"><div class="card"><h1>回收站</h1><p>请先用教师账号登录。</p><button type="button" class="gbtn" onclick="if(window.HXTheme&&HXTheme.login){HXTheme.login()}else{top.location.href=\'../\'}">去首页登录</button></div></div>';
}
async function boot(){
  if(window.HXTheme&&HXTheme.gated) return;
  ME=null;
  load();
  if(!sess||!sess.access_token) return gate();
  try{ ME=await rpc('hx_me'); }
  catch(e){ return gate(); }
  if(!ME||!(ME.teacher||ME.admin||ME.dev)) return gate();
  await recyclePull();     // 清单先从账号拉一份（换电脑也能看到）
  await render();
}
window.HXBack = function () {
  if (CUR_KIND !== 'all') { CUR_KIND = 'all'; render(); return true; }
  return false;
};
addEventListener('storage',function(e){ if(e.key===SKEY){ ME=null; load(); boot(); } });
boot();
</script>
</body>
