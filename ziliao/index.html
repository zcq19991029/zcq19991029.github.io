<!DOCTYPE html>
<html lang="zh-CN" data-hx-peanut>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>资料库 · 华夏工具</title>
<link rel="icon" href="../logo.jpg">
<!-- 主题资源一律用**站点根绝对路径**（2026-11-17 修）：
     原来写的是 ../hx-theme.css —— 那个相对路径只在「发布后的 /ziliao/index.html」这一层成立，
     本地预览（file:// 或从别的深度起服务）、或把页面放进子目录时相对基准就变了，直接 404，
     表现是「样式假性不显示」（底色/卡片/玻璃整套失效），很难看出是路径问题。
     总入口 / 反馈 / 进制转换 用的都是 /hx-theme.js 这种根绝对路径，这里照抄。 -->
<link rel="stylesheet" href="/hx-theme.css">
<script src="/hx-theme.js" data-tool="ziliao"></script>
<script src="../ui-dialog.js"></script>
<script src="../hx-ai.js"></script>
<style>/* 资料库工具样式。颜色全部来自 ../hx-theme.css（--bg/--ink/--dim/--card/--edge/--acc…，深浅色由 hx-theme.js 切）；
   这里只放布局和控件。排版规矩（华夏工具 2026-11-08）：主容器 width:min(1600px,100%)，不写 min-width 硬下限，
   表格 table-layout:fixed + word-break，390 竖屏不许横向溢出。 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root {
  /* 2026-11-18：--card 来自 hx-theme.css，那一份是 rgb(255 255 255 / var(--hx-a)) —— clr=100 时 = 1.0，
     卡片是纯实色；而首页工具卡实测是「.70 × --hx-a」（0 → 1.00 / 100 → 0.70 / 250 → 0）。
     这里按首页口径覆盖，卡片三档才能和首页对上。 */
  --card: rgb(255 255 255 / min(1, calc(.52 * var(--hx-a, 1))));
}
:root[data-hx-mode="dark"] { --card: rgb(28 28 30 / min(1, calc(.52 * var(--hx-a, 1)))); }
:root {
  /* 2026-11-18：--hx-blur 只在 hx-theme.css 里定义，而本工具只引 hx-theme.js ——
     不补这一行，所有 backdrop-filter: var(--hx-blur) 都会解析失败、玻璃直接没有模糊。
     值照抄 hx-theme.css，和首页同一档。 */
  --hx-blur: saturate(180%) blur(20px);
  /* 2026-11-18 透明度统一：输入框 / 弹窗 / 代码块原来吃 --card-solid（纯实色），不通透度滑杆。
     --card-lift：clr=0 → 1（原实色），clr=100 → .90，clr=250 → 0。 */
  --card-lift: rgb(255 255 255 / min(1, calc(.90 * var(--hx-a, 1))));
}
:root[data-hx-mode="dark"] { --card-lift: rgb(18 26 42 / min(1, calc(.90 * var(--hx-a, 1)))); }
body { margin: 0; background: var(--bg, #f5f5f7); color: var(--ink, #1d1d1f); font: 15px/1.6 var(--hx-font, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif); overflow-x: hidden; }
#app { width: min(1600px, 100%); margin: 0 auto; padding: 16px; }
h1, h2 { letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 0 0 12px; }
.mono { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; }
.note { color: var(--dim, #6e6e73); font-size: 13px; }
.ok { color: var(--ok, #248a3d); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: var(--card, #fff); border: 1px solid var(--edge, rgba(0, 0, 0, .08)); border-radius: 18px; padding: 18px; margin-bottom: 14px; min-width: 0; box-shadow: var(--glass-drop, 0 10px 30px -18px rgba(0, 0, 0, .25)); }
.errs { background: var(--badbg, rgba(215, 0, 21, .08)); color: var(--bad, #d70015); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 13.5px; word-break: break-word; }
.errs[hidden] { display: none; }
button, .btn { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line2, rgba(0, 0, 0, .12)); background: var(--fill, rgba(0, 0, 0, .04)); color: var(--ink, #1d1d1f); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; max-width: 100%; }
button:hover, .btn:hover { border-color: var(--acc, #2f845a); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.pri, .btn.pri { background: var(--acc, #2f845a); border-color: var(--acc, #2f845a); color: var(--on-acc, #fff); font-weight: 600; }
button.danger { color: var(--bad, #d70015); }
button.sm { padding: 5px 10px; font-size: 13px; }
.big { padding: 12px 22px; font-size: 16px; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--ink, #1d1d1f); background: var(--card-lift, #fff); border: 1px solid var(--line2, rgba(0, 0, 0, .12)); border-radius: 10px; padding: 7px 10px; max-width: 100%; min-width: 0; }
input[type=checkbox] { width: 16px; height: 16px; padding: 0; accent-color: var(--acc, #2f845a); flex: 0 0 auto; }
textarea { width: 100%; resize: vertical; }
table { width: 100%; table-layout: fixed; border-collapse: collapse; word-break: break-word; }
pre { white-space: pre-wrap; word-break: break-word; margin: 0; }

/* 外壳：左侧导航（页面 + 科目）+ 右侧主区；900 以下上下排 */
.zl-shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; width: min(1600px, 100%); margin: 0 auto; }
.zl-nav { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto; padding: 14px 10px; background: var(--card, #fff); border: 1px solid var(--edge, rgba(0, 0, 0, .08)); border-radius: 18px; min-width: 0; }
.zl-subtabs{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1px solid var(--edge,rgba(0,0,0,.08));border-radius:14px;background:color-mix(in srgb,var(--card,#fff) 75%,transparent);backdrop-filter:blur(16px)}
.zl-subtab{position:relative;border:0;background:transparent;color:var(--dim,#6e6e73);padding:8px 11px;border-radius:10px;cursor:pointer;font:600 12px/1.2 inherit;white-space:nowrap}.zl-subtab.on{background:var(--accbg,rgba(47,107,255,.12));color:var(--ink,#0b1220)}.zl-subtab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:var(--acc,#2f6bff);border-radius:4px}
.zl-subtabs .zl-subadd{width:auto;margin:0;padding:7px 10px}
.zl-nav-h { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--dim, #6e6e73); padding: 4px 8px 6px; }
.zl-pages { display: grid; gap: 4px; margin-bottom: 14px; }
.zl-page { justify-content: flex-start; border: 0; background: transparent; }
.zl-page.on { background: var(--accbg, rgba(47, 132, 90, .14)); color: var(--acc, #2f845a); font-weight: 600; }
.zl-subs { display: grid; gap: 4px; }
.zl-subrow { display: flex; gap: 2px; align-items: stretch; border-radius: 12px; min-width: 0; }
.zl-subrow.on { background: var(--accbg, rgba(47, 132, 90, .14)); }
.zl-sub { flex: 1 1 auto; min-width: 0; display: grid; justify-content: stretch; justify-items: start; gap: 0; text-align: left; border: 0; background: transparent; padding: 7px 10px; }
.zl-sub b { font-weight: 600; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zl-sub span { font-size: 11.5px; color: var(--dim, #6e6e73); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zl-subrow.on .zl-sub b { color: var(--acc, #2f845a); }
.zl-subx { flex: 0 0 auto; border: 0; background: transparent; padding: 4px 7px; font-size: 12px; color: var(--dim, #6e6e73); }
.zl-subadd { width: 100%; margin-top: 6px; border-style: dashed; background: transparent; color: var(--dim, #6e6e73); }
.zl-subnote { font-size: 12px; color: var(--bad, #d70015); margin: 8px 4px 0; word-break: break-word; }
.zl-main { min-width: 0; }
.zl-h h1 { margin: 4px 0 14px; font-size: 28px; word-break: break-word; }
.zl-ch { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.zl-ch h2 { margin: 0; }
.zl-gate, .zl-empty { max-width: 460px; margin: 60px auto; display: grid; gap: 14px; text-align: center; justify-items: center; }
.zl-gate h1 { margin: 0; font-size: 24px; }
@media (max-width: 900px) {
  .zl-shell { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .zl-nav { position: static; max-height: none; }
  .zl-subtabs{flex-wrap:nowrap;overflow:auto}
  .zl-pages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .zl-subs { grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); }
  .zl-h h1 { font-size: 22px; }
}
@media (max-width: 480px) { #app { padding: 10px; } .card { padding: 14px; border-radius: 16px; } }

/* 弹层 */
.zl-modal { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .4); overflow: auto; }
.zl-mcard { width: min(620px, 100%); margin: 0; max-height: calc(100vh - 32px); overflow: auto; background: var(--card-lift, #fff); }
.zl-f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.zl-f input, .zl-f select { width: 100%; }
.pb-info p { margin: 6px 0; word-break: break-word; }
.pb-skip { margin: 4px 0 8px; padding-left: 18px; font-size: 13px; color: var(--dim, #6e6e73); }

/* 资料 */
.mat-drop { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px; border: 1px dashed var(--line2, rgba(0, 0, 0, .16)); border-radius: 14px; background: var(--fill, rgba(0, 0, 0, .03)); }
.mat-drop.on { border-color: var(--acc, #2f845a); background: var(--accbg, rgba(47, 132, 90, .1)); }
/* 扫描版 PDF 的页码范围（2026-11-20）。单独一行、不上虚线框 —— 它不是拖放区的一部分，
   免得老师以为「页码也要拖进来」。窄屏自动换行，输入框最窄 150px。 */
.mat-range { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin: 10px 0 0; font-size: 13px; color: var(--dim, #6e6e73); }
.mat-range label { flex: 0 0 auto; }
.mat-range input { flex: 0 1 200px; min-width: 150px; }
.mat-range .note { flex: 1 1 240px; }
/* 上传进度（2026-11-15）：深色底 + 蓝青流光扫过 + 百分比 / 已传字节。
   参考了用户给的 WebGL 流光进度条（metalforge slosh）的观感，但这里只用 CSS 渐变 + 遮罩位移，
   不引 WebGL、不引任何库；深浅色主题都吃 var(--ink/--dim)，轨道固定偏深，当仪表盘看。 */
.mat-prog { margin: 12px 0 0; word-break: break-word; }
.mat-prog[hidden] { display: none; }
.mat-pg-h { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 13px; color: var(--dim, #6e6e73); }
.mat-pg-t { flex: 1 1 240px; min-width: 0; line-height: 1.5; }
.mat-pg-w { flex: 0 0 auto; font-variant-numeric: tabular-nums; opacity: .85; }
.mat-pg-v { flex: 0 0 auto; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink, #1d1d1f); }
.mat-pg-track { position: relative; height: 7px; margin-top: 7px; border-radius: 99px; overflow: hidden; background: #08131f; box-shadow: inset 0 0 0 1px rgba(90, 200, 255, .18), inset 0 2px 6px rgba(0, 0, 0, .7); }
.mat-pg-fill { position: relative; display: block; width: 0; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #0b6f96 0%, #24c8f0 45%, #6fe9ff 72%, #a9dcff 100%); box-shadow: 0 0 10px rgba(60, 220, 255, .6), 0 0 22px rgba(40, 170, 255, .28); transition: width .28s cubic-bezier(.22, .61, .36, 1); }
/* 流光：一条白色高光在填充区里来回扫（slosh 的流动感），只在「正在传」时有 */
.mat-pg-fill::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent 0 30%, rgba(255, 255, 255, .55) 50%, transparent 70% 100%); background-size: 260% 100%; background-repeat: no-repeat; animation: mat-pg-slosh 1.6s linear infinite; }
/* 前端那点泛光 / 蓄势的高亮头，失败和完成时收掉 */
.mat-pg-fill::after { content: ""; position: absolute; top: -3px; bottom: -3px; right: -2px; width: 12px; border-radius: 99px; background: radial-gradient(closest-side, rgba(200, 250, 255, .95), rgba(90, 220, 255, 0)); }
@keyframes mat-pg-slosh { from { background-position: 160% 0; } to { background-position: -60% 0; } }
.mat-prog.ok .mat-pg-fill { background: linear-gradient(90deg, #12704a, #35d98a); box-shadow: 0 0 10px rgba(60, 220, 150, .55); }
.mat-prog.bad .mat-pg-fill { background: linear-gradient(90deg, #7a1524, #ff5f6d); box-shadow: 0 0 10px rgba(255, 95, 109, .5); }
.mat-prog.ok .mat-pg-fill::before, .mat-prog.bad .mat-pg-fill::before { animation: none; opacity: 0; }
.mat-prog.ok .mat-pg-fill::after, .mat-prog.bad .mat-pg-fill::after { opacity: 0; }
.mat-prog.ok .mat-pg-v { color: var(--ok, #248a3d); }
.mat-prog.bad .mat-pg-v { color: var(--bad, #d70015); }
@media (prefers-reduced-motion: reduce) { .mat-pg-fill { transition: none; } .mat-pg-fill::before { animation: none; } }
.mat-list { display: grid; gap: 8px; }
.mat-i { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 12px; background: var(--fill, rgba(0, 0, 0, .03)); }
.mat-pick { display: inline-flex; align-items: center; }
.mat-pick input { width: 16px; height: 16px; margin: 0; accent-color: var(--acc, #2f845a); cursor: pointer; }
/* 2026-11-19：删掉「原文件」第二颗勾，第一列回到一颗勾。 */
.mat-pk { display: grid; gap: 3px; justify-items: center; }
.mat-err { color: var(--bad, #d70015); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mat-m { display: grid; gap: 2px; min-width: 0; }
.mat-m b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mat-a { display: flex; flex-wrap: wrap; gap: 6px; }
.mat-v { margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--edge, rgba(0, 0, 0, .08)); }
.mat-segs { display: grid; gap: 8px; max-height: 480px; overflow: auto; overscroll-behavior: contain; }
.mat-seg pre { font-size: 13px; line-height: 1.7; padding: 8px 10px; border-radius: 8px; background: var(--fill, rgba(0, 0, 0, .03)); }
@media (max-width: 640px) { .mat-i { grid-template-columns: auto minmax(0, 1fr); } .mat-a { grid-column: 2; } }

/* 出题 */
.mg-step { display: grid; gap: 8px; margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--edge, rgba(0, 0, 0, .08)); }
.mg-step > b { font-size: 13px; }
.mg-types { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.mg-types label, .mg-row label, .mg-wide { display: grid; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0; }
.mg-types input, .mg-row input, .mg-row select { width: 100%; }
.mg-row { grid-template-columns: minmax(0, 1fr); }
/* 2026-11-19：出题行的字段从 3 个变成 4 个（多了「出题量」），原来的三列模板会把「范围」挤到第二行只占 1/3，
   看起来像掉队了。改成四列，「范围」吃掉剩下的宽度。 */
@media (min-width: 720px) { .mg-row { grid-template-columns: minmax(0, 110px) minmax(0, 140px) minmax(0, 170px) minmax(0, 1fr); } }
.mg-wide { margin-top: 12px; }
.mg-res { margin-top: 14px; }
.mg-rh { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.mg-list { display: grid; gap: 6px; max-height: 460px; overflow: auto; overscroll-behavior: contain; }
.mg-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border-radius: 10px; background: var(--fill, rgba(0, 0, 0, .03)); font-size: 13.5px; cursor: pointer; }
.mg-q { display: grid; gap: 2px; min-width: 0; word-break: break-word; }
.mg-q b { color: var(--acc, #2f845a); font-size: 12px; }
.mg-rej { margin-top: 10px; font-size: 13px; }
.mg-rej ul { margin: 6px 0 0; padding-left: 18px; }

/* 题池（顶栏布局见文件后半段「题池顶栏」那一块） */
.qb-list { display: grid; gap: 8px; }
.qb-i { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 12px; background: var(--fill, rgba(0, 0, 0, .03)); }
.qb-i > input { margin-top: 4px; }
.qb-body { min-width: 0; display: grid; gap: 4px; word-break: break-word; }
.qb-t { display: inline-block; margin-right: 8px; padding: 0 7px; border-radius: 6px; background: var(--accbg, rgba(47, 132, 90, .14)); color: var(--acc, #2f845a); font-size: 12px; font-weight: 600; }
.qb-t.qb-ch { background: rgba(178, 80, 0, .12); color: var(--warn, #b25000); }
/* 小节角标（2026-11-19）：比章节更细一级，用偏青的底色跟章节区分开 */
.qb-t.qb-sec { background: rgba(0, 122, 140, .12); color: #00697a; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 图题（2026-11-20）：题池能存 fig（符号 id），列表里给角标 + 小图预览，
   改题弹层里给大图 + 换图下拉。图本身是 SVG（刷题/symbols.js 画的），颜色跟 currentColor。 */
.qb-t.qb-figb { background: rgba(47, 132, 90, .12); color: var(--acc, #2f845a); }
.qb-figprev { margin: 6px 0 0; padding: 6px 8px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(127, 127, 127, .08); max-width: 100%; }
.qb-figprev svg { height: 52px; width: auto; max-width: 100%; }
.qb-figpick { margin: -4px 0 12px; padding: 10px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(127, 127, 127, .08); }
.qb-figpick svg { height: 120px; width: auto; max-width: 100%; }
.qb-o { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--dim, #6e6e73); }
.qb-code { font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: var(--card-lift, #fff); max-height: 220px; overflow: auto; }
.qb-a { font-size: 12.5px; color: var(--dim, #6e6e73); }
.qb-act { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 560px) { .qb-i { grid-template-columns: auto minmax(0, 1fr); } .qb-act { grid-column: 2; } }

/* AI 查重结果
   2026-11-20 第三轮（用户原话「我咋知道删除的上面还是下面呢」「默认选中第一个，我想换我再换」）：
     · 三类改成三段 tab，一屏只放一栏（原来三条长列表叠在一起，一屏看不清）；
     · 每一对是一张卡，两道题上下排开各是一个可点区域，默认选中上面那道（红框 + 红点 +「将删除」）；
     · 每栏一根操作条：整栏「删上面 / 删下面 / 都留着」+ 右边「删除选中的 N 道」。
   颜色全走 --fill / --card-solid / --card-lift / --ink / --dim / --bad / --badbg / --acc。 */
.qb-dl { display: grid; gap: 8px; max-height: 50vh; overflow: auto; overscroll-behavior: contain; margin-bottom: 12px; }
.qb-dpane .qb-dl { max-height: 56vh; margin-bottom: 8px; }
.qb-dq { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 三段 tab：照总入口「教务管理」那套 .seg 的观感 ──────────────────────── */
.qb-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; margin: 0 0 10px;
  border-radius: 11px; background: var(--fill, rgba(0, 0, 0, .04)); }
.qb-seg button { height: 32px; padding: 0 8px; border: 0; border-radius: 9px; background: none;
  font-size: 14px; font-weight: 500; color: var(--dim, #6e6e73); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; transition: background .25s, color .25s; }
.qb-seg button b { font-weight: 700; font-variant-numeric: tabular-nums; opacity: .8; }
.qb-seg button[aria-pressed="true"] { background: var(--card-solid, #fff); color: var(--ink, #1d1d1f); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.qb-seg button[aria-pressed="true"] b { opacity: 1; }
@media (max-width: 480px) { .qb-seg button { font-size: 12.5px; padding: 0 4px; } }

/* ── 每栏的操作条 ─────────────────────────────────────────────────────── */
.qb-dbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
  padding: 8px 10px; margin-bottom: 8px; border-radius: 10px; background: var(--fill, rgba(0, 0, 0, .03)); }
.qb-dquick { display: flex; flex-wrap: wrap; gap: 6px; }
.qb-dquick button.on { border-color: var(--acc, #2f845a); background: var(--accbg, rgba(47, 132, 90, .14));
  color: inherit; font-weight: 800; box-shadow: inset 0 0 0 1px var(--acc, #2f845a); }
/* 说明文字单独占一行（620px 宽的弹层里挤在按钮旁边会被压成两行小字） */
.qb-dhint { flex: 1 1 100%; order: 3; margin: 0; min-width: 0; font-size: 12.5px; }
.qb-dbar [data-dgo] { margin-left: auto; }
.qb-dbar [data-dgo] b { font-variant-numeric: tabular-nums; }

/* ── 每一对：一张卡，上面一道 / 下面一道，各是一个可点区域 ─────────────────
   状态全部由卡片上的 data-del 驱动（"a" 删上面 / "b" 删下面 / "" 这对不动）：
   被选中的那道 → 红框 + 红点 + 红字「将删除」，另一道灰点 + 「保留」。 */
.qb-dpair { display: grid; gap: 6px; padding: 8px 10px 10px; border-radius: 12px;
  background: var(--fill, rgba(0, 0, 0, .03)); border: 1px solid transparent; }
.qb-dpair[data-del=""] { background: transparent; border-color: var(--edge, rgba(0, 0, 0, .08)); }
.qb-dph { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12.5px; }
.qb-dpk { font-weight: 700; font-variant-numeric: tabular-nums; }
.qb-dpw { flex: 1 1 120px; min-width: 0; color: var(--dim, #6e6e73); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qb-dpst { flex: 0 0 auto; font-weight: 700; color: var(--dim, #6e6e73); }
.qb-dpair[data-del="a"] .qb-dpst, .qb-dpair[data-del="b"] .qb-dpst { color: var(--bad, #d70015); }
.qb-dside { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 2px 8px;
  align-items: center; width: 100%; padding: 7px 10px; text-align: left; font-size: 13px;
  border-radius: 10px; border: 1px solid var(--line2, rgba(0, 0, 0, .12)); background: var(--card-lift, #fff); }
.qb-dside:hover { border-color: var(--acc, #2f845a); }
.qb-dsd { width: 9px; height: 9px; border-radius: 50%; background: var(--dim, #6e6e73); opacity: .45; }
.qb-dsm { font-size: 12px; font-weight: 700; color: var(--dim, #6e6e73); }
.qb-dst { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qb-dst .qb-t { margin-right: 6px; }
.qb-dtag { font-size: 12px; color: var(--dim, #6e6e73); white-space: nowrap; }
.qb-dpair[data-del="a"] .qb-dside[data-side="a"],
.qb-dpair[data-del="b"] .qb-dside[data-side="b"] { border-color: var(--bad, #d70015);
  background: var(--badbg, rgba(215, 0, 21, .08)); box-shadow: inset 0 0 0 1px var(--bad, #d70015); }
.qb-dpair[data-del="a"] .qb-dside[data-side="a"] .qb-dsd,
.qb-dpair[data-del="b"] .qb-dside[data-side="b"] .qb-dsd { background: var(--bad, #d70015); opacity: 1; }
.qb-dpair[data-del="a"] .qb-dside[data-side="a"] .qb-dsm,
.qb-dpair[data-del="b"] .qb-dside[data-side="b"] .qb-dsm,
.qb-dpair[data-del="a"] .qb-dside[data-side="a"] .qb-dtag,
.qb-dpair[data-del="b"] .qb-dside[data-side="b"] .qb-dtag { color: var(--bad, #d70015); }
@media (max-width: 560px) {
  .qb-dside { grid-template-columns: auto auto minmax(0, 1fr); }
  .qb-dtag { grid-column: 3; }
}

/* ── 撤销删除条（题池顶上）────────────────────────────────────────────── */
.qb-undo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px;
  border-radius: 10px; font-size: 13px; border: 1px solid var(--acc, #2f845a);
  background: var(--accbg, rgba(47, 132, 90, .14)); }
.qb-undo[hidden] { display: none; }
.qb-undo b { font-variant-numeric: tabular-nums; }

/* 发布弹层（2026-11-15）：题库 id 的说明文字 + 语义查重拦下来的题。
   颜色全部沿用 --dim / --badbg，不另起一套配色；说明贴住输入框（负 margin 抵掉 .zl-f 的下边距），
   因为它是那行输入框的注脚，不是独立段落。 */
.pb-hint { margin: -6px 0 12px; line-height: 1.6; }
.pb-sem { margin: 10px 0 4px; font-size: 13.5px; }
.pb-sem b { color: var(--bad, #d70015); }
.pb-flag { margin: 4px 0 10px; padding: 0; list-style: none; display: grid; gap: 6px; }
.pb-flag li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 8px 10px; border-radius: 10px; background: var(--badbg, rgba(215, 0, 21, .08)); font-size: 13px; }
.pb-flag .pb-force { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--bad, #d70015); grid-row: span 2; align-self: start; white-space: nowrap; }
.pb-flag .qb-dq { white-space: normal; }
@media (max-width: 480px) { .pb-flag li { grid-template-columns: minmax(0, 1fr); } .pb-flag .pb-force { grid-row: auto; } }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 9500; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink, #1d1d1f); color: var(--bg, #fff); font-size: 14px; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 像素「正在载入」药丸 + 首屏闪屏：和 考试/src/app.css 同一套（产物单文件，自带一份保证方块跳得起来） */
.hx-px{display:inline-flex;align-items:flex-end;gap:.28em;height:2.2em}
.hx-px i{width:1em;height:1em;border-radius:.16em;display:block;background:var(--acc,#2f845a);animation:hxPx 1.15s cubic-bezier(.32,.72,0,1) infinite;animation-delay:calc(var(--i) * 90ms)}
@keyframes hxPx{0%,100%{transform:translateY(0);opacity:.55}35%{transform:translateY(-110%);opacity:1}60%{transform:translateY(0);opacity:.7}}
/* 2026-11-14 用户「去掉外围封闭椭圆方框」：药丸无框横排，文字色 --hx-ink 跟深浅主题走 */
.hx-loadpill{display:inline-flex;flex-direction:row;align-items:center;gap:.7em;color:var(--hx-ink,#1d1d1f);font-size:clamp(15px,.85vw + 6px,30px)}
.hx-loadpill .hx-px{font-size:.54em}
.hx-loadpill b{font-weight:600;font-size:.87em;line-height:1;white-space:nowrap}
.hx-loadpill.sm{flex-direction:row;gap:.6em;font-size:clamp(12px,.7vw + 4px,18px)}
.hx-loadpill.sm b{font-size:1em;color:var(--dim,#6e6e73)}
.hx-loadwrap{display:grid;place-items:center;padding:clamp(28px,4vw,56px) 12px}
.hx-loadwrap.sm{padding:0;min-height:40px}
html.hx-lite .hx-px i{animation:none;opacity:.85}
@media (prefers-reduced-motion:reduce){.hx-px i{animation:none;opacity:.85;transform:none}}
#hxBoot{position:fixed;inset:0;z-index:2147482000;display:grid;place-items:center;background:var(--card-solid,#f6f6f4);transition:opacity .26s ease,visibility 0s linear .26s}
#hxBoot.out{opacity:0;visibility:hidden;pointer-events:none}
#hxBoot .hx-boot-card{display:grid;place-items:center;gap:clamp(14px,2vh,30px);padding:24px}
#hxBootCv{image-rendering:pixelated;display:block;max-width:100%}
#hxBoot .hx-loadpill{font-size:clamp(16px,1.1vw + 9px,30px)}
.hx-boot-title{margin:0;font-size:clamp(20px,1.4vw + 12px,34px);font-weight:700}
html.hx-lite #hxBootCv{display:none}

/* ═══════════════════════════════════════════════════════════════════════════
   2026-11-19 第三轮：题型药丸 / 题型管理 / 题池顶栏重排
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 出题卡片的「题型」药丸（单选）────────────────────────────────────────── */
.mg-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.mg-pill { display: inline-flex; align-items: center; gap: 2px; padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--edge, rgba(0, 0, 0, .14)); background: transparent; color: inherit;
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; line-height: 1.35; }
.mg-pill small { font-size: 11px; font-weight: 500; opacity: .6; }
.mg-pill:hover { border-color: var(--acc, #2f845a); }
/* 选中态**不能**用「实心 --acc + 白字」：深色主题下 --acc 是浅色，实心就变成一整块白，
   白字压在白底上等于看不见（实测截图就是一条白胶囊）。
   改成「描边 + 淡底」，深浅主题都成立。 */
.mg-pill.on { border-color: var(--acc, #2f845a); background: var(--accbg, rgba(47, 132, 90, .14));
  color: inherit; font-weight: 800; box-shadow: inset 0 0 0 1px var(--acc, #2f845a); }
.mg-pill.on small { opacity: .75; }

/* ── 题型管理弹层 ─────────────────────────────────────────────────────────── */
.qt-list { display: grid; gap: 6px; max-height: 46vh; overflow: auto; }
.qt-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 48px auto;
  gap: 8px; align-items: center; padding: 7px 9px; border-radius: 10px;
  background: var(--fill, rgba(0, 0, 0, .035)); }
.qt-k { font-size: 12px; opacity: .62; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qt-row input { width: 100%; min-width: 0; }
.qt-tag { font-size: 11px; opacity: .6; text-align: center; }
.qt-add { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: 8px; align-items: end; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--edge, rgba(0, 0, 0, .1)); }
.qt-add > b { grid-column: 1 / -1; font-size: 13px; }
.qt-add label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; min-width: 0; }
.qt-add input { width: 100%; min-width: 0; }
@media (max-width: 620px) {
  .qt-row { grid-template-columns: minmax(0, 1fr) 48px auto; }
  .qt-row .qt-k { display: none; }
  .qt-add { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

/* ── 出题回执列表（只读，不再是可勾选的）────────────────────────────────── */
.mg-item.ro { cursor: default; }
.mg-item.ro:hover { background: var(--fill, rgba(0, 0, 0, .03)); }

/* ── 题池顶栏（2026-11-20 第二轮重排）─────────────────────────────────────
   用户原话：「这里显示不全」—— 1440 宽下筛选控件和五颗按钮挤在同一条 flex 里，
   「发布到刷题」被挤到第二行还压扁；窄屏右侧直接被卡片裁掉。
   现在 .qb-bar 是**单列网格**（minmax(0,1fr)：怎么都不会撑破卡片），里面分行：
     ① .qb-stat   统计芯片
     ② .qb-f      筛选（题型/章节/小节/知识点/找题）—— 能换行，控件不缩成 0 宽
     ③ .qb-acts   操作按钮 —— 单独换行 + margin-left:auto 靠右，不再和筛选抢宽度
     ④ .qb-selbar 勾选 / 批量操作（题池空时整条隐藏）
   <720px：筛选改两列网格，每个控件占一格（输入框拉满）；按钮均分整行。 */
.qb-bar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 12px; }
.qb-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.qb-h h1 { margin: 4px 0 14px; }
.qb-stat { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
.qb-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
/* 2026-11-20：select 被 hx-theme 的「药丸下拉」接走后，宽度**由 select 自己决定**——
   触发器内部固定吃掉约 64px（药槽 30 + 列间距 6×2 + 折角 10 + 内边距 4/6 + 边框 2），
   而 select 的固有宽度只是「最长选项 + 原生内边距」，数据少时只算出 70px，文字列 = 0，
   于是整条只剩一块铝箔药板 + 折角（用户说的「蓝白色的胶囊，没有文字」）。
   所以这里必须给 select 一个**内容无关的宽度**（不是 min-width，测试禁止 px 硬下限），
   让每个筛选药丸都留够 ~86px 放文字；宁可换行，也不能把别人的字挤没。 */
.qb-f > label { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; min-width: max-content; }
.qb-f select { width: 150px; max-width: 150px; }
.qb-f input[type=search] { width: 170px; min-width: 0; }
.qb-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.qb-acts > button { flex: 0 0 auto; white-space: nowrap; }
@media (max-width: 720px) {
  .qb-f { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qb-f > label { display: grid; gap: 4px; min-width: 0; }   /* 网格里由列宽决定，别再撑 min-width:max-content */
  .qb-f > label:last-child { grid-column: 1 / -1; }   /* 「找题」占满整行 */
  .qb-f select, .qb-f input[type=search] { width: 100%; max-width: none; }
  .qb-acts { margin-left: 0; }
  .qb-acts > button { flex: 1 1 auto; }
}
.qb-selbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 10px; background: var(--fill, rgba(0, 0, 0, .04));
  font-size: 13px; }
.qb-selbar .grow { flex: 1 1 auto; }
.qb-selbar[hidden] { display: none; }
/* 题池统计里的题型芯片：点一下就筛到这类（2026-11-19）*/
.qb-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--edge, rgba(0, 0, 0, .13)); background: transparent; color: inherit;
  font: inherit; font-size: 12px; cursor: pointer; line-height: 1.6; }
.qb-chip b { font-weight: 700; }
.qb-chip:hover { border-color: var(--acc, #2f845a); }
.qb-chip.on { border-color: var(--acc, #2f845a); background: var(--accbg, rgba(47, 132, 90, .14));
  color: inherit; font-weight: 800; box-shadow: inset 0 0 0 1px var(--acc, #2f845a); }

/* 题干太依赖教材（2026-11-21）：一行一道，勾选即选中；理由橙色、改写建议绿色 */
.qb-src-row { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; margin-bottom: 6px;
  border: 1px solid var(--edge, rgba(0, 0, 0, .13)); border-radius: 10px; cursor: pointer; }
.qb-src-row:hover { border-color: var(--acc, #2f845a); }
.qb-src-row.on { border-color: var(--acc, #2f845a); background: var(--accbg, rgba(47, 132, 90, .1)); }
.qb-src-row input { margin: 4px 0 0; flex: none; }
.qb-src-t { flex: 1 1 auto; min-width: 0; line-height: 1.55; font-size: 13px; }
.qb-src-t .qb-t { margin-right: 6px; }
.qb-src-w { display: block; margin-top: 3px; font-style: normal; font-size: 12px; color: var(--warn, #b25000); }
.qb-src-fix { display: block; margin-top: 3px; font-size: 12px; color: var(--ok, #0a7d33); }

<script>/* 华夏工具 · 统一「像素加载动效」胶水（2026-11-04，2026-11-06 时序/尺寸返修）。
 *
 * 全站加载提示的统一规则（刷题 / 考试 / 小组加分三处共用同一份实现，各自目录放一份拷贝——
 * 各工具是独立页面、发布路径互不相邻（/shuati/ /exam/ /jiafenxitong/），没有能同时被三个
 * 页面引用的公共目录，所以用「同一份源码拷三份」而不是抽包；改这里时同步另外两份：
 *   · 刷题/loadfx.js（本文件）
 *   · 考试/src/loadfx.js（build.js 打进单文件产物）
 *   · 小组加分/fx/hx-jf-load.js（那边逻辑更重，只对齐「每次随机 + 避开上一次 + 最短停留 + 预跑 + 回落」规则）
 *
 * 规则（用户 2026-11-04 定，2026-11-06 返修，2026-11-05 随机与时长返修）：
 *   1. **第一帧就是动效**：页面的首屏等待必须由「canvas 像素动效 + 药丸」组成，不允许先出现
 *      一条光秃秃的文字药丸、等内容渲染完再补一层像素闪屏盖上去（用户原话：「你东西加载好了
 *      才跳出来像素动效加载画面」「岂不是全屏状态」）。所以首屏用 boot()：标记先写进 HTML，
 *      boot() 在解析到它时立刻画第一帧，内容就绪后整层淡出。
 *   2. 首选：从特效包（pixelfx，MIT，见仓库根 NOTICE-pixelfx.md）里**随机**挑一个 loop 特效，
 *      画在 canvas 上；「正在加载…」文字以药丸（方块 + 文字）形式跟在动效下方 —— 文字是状态说明，
 *      要的是「结合」，不是二选一。
 *   3. **每次打开都重新随机**（2026-11-05 返修）：原先「同一会话内固定」（sessionStorage 存选中 id）
 *      被用户否掉了——同一个会话反复进同一个工具永远抽到同一个特效，用户原话「点击接线仿真永远是
 *      一个像素动效的加载画面」「我说了这种需要随机加载动效」。现在每次 boot/mount 都重新抽，
 *      只把**上一次这个工具用过的 id** 记在 sessionStorage（键 hx-loadfx-last-<tool>）作为排除项，
 *      继续开两次一定不一样；关掉标签页后「上一次」也清空，不影响正常随机。
 *   4. **动效要真的动得看得见**（2026-11-05 返修）：最短停留从 520ms 提到 900ms（面板 420→640ms）。
 *      首帧策略按 meta 区分：loop 特效在内存里**预跑 0.35 秒**再上屏（它们有的前 0.3～0.5 秒才长主体）；
 *      one-shot 特效（meta.loop === false）**不预跑**——它们的第 0 帧本来就是峰值，预跑等于把动画提前放完，
 *      播到 meta.duration 就重新起一个，保证闪屏期间一直有动作、不会停在空画布上。
 *      预跑只在内存里算，最后一次性 putImageData。
 *   5. 播不了就回落：prefers-reduced-motion、hx-lite（省电一体机）、特效包没加载出来、
 *      canvas 建不出来时回落到原来的像素方块药丸——绝不允许什么都不显示。
 *   6. 尺寸按视口自适应（2026-11-06 用户「加载动效普遍太小 紧急修复」；2026-11-07 再放大：
 *      用户「再放大点」，短边 62% → 70%）：像素主体按短边最大 70% 定尺寸、整数倍放大 3～8 倍，
 *      1080p 上是一块醒目的主体，不再是指甲盖。
 *
 * 性能红线（同 小组加分/fx/hx-jf-load.js）：全局唯一 requestAnimationFrame 循环、
 * 帧率封顶（触屏 18fps / 桌面 30fps）、done() 后 cancel；canvas 被 innerHTML 换掉
 * （面板重新渲染）时循环自己发现脱离文档并停下，不会在后台空转。
 */
(function () {
  var reduced = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  function lite() { return document.documentElement.classList.contains('hx-lite'); }
  function still() { return lite() || (reduced && reduced.matches); }

  // 布局样式只注入一次：.hx-fxwrap 是「canvas + 药丸」的容器（页面内嵌版铺在 host 里，
  // full 版铺满整页给首屏闪屏用）。药丸本体样式沿用 hx-theme.js 注入的 #hx-pill-style。
  var css = ''
    + '.hx-fxwrap{display:grid;place-items:center;gap:clamp(12px,1.6vh,26px);padding:clamp(24px,4vw,56px) 12px;box-sizing:border-box}'
    + '.hx-fxwrap.full{position:fixed;inset:0;z-index:2147482000;background:var(--card-solid,#f6f6f4)}'
    + '.hx-fxcv{image-rendering:pixelated;display:block;max-width:100%}'
    // 药丸在动效下面当状态说明。字号一处 clamp、内部方块/文字全 em（全站规矩），
    // 2026-11-06 整体抬一档：1080p 上 24px 左右，不再是「动效很大、字很小」的失衡感。
    + '.hx-fxwrap .hx-loadpill{font-size:clamp(15px,1vw + 8px,28px)}'
    + '.hx-fxwrap.panel{padding:clamp(14px,2vh,28px) 12px}'
    + '.hx-fxwrap.panel .hx-loadpill{font-size:clamp(13px,.8vw + 7px,22px)}'
    + '.hx-fxwrap.out .hx-fxcv,.hx-fxwrap.out .hx-loadpill{opacity:0;transition:opacity .25s ease}'
    // 首屏闪屏（考试 / 刷题共用）：#hxBoot 是写在 HTML 里的那一层，boot() 接管 canvas。
    // 底色和页面同色，淡出时只淡整层，不会露出半成品页面再闪一下。
    + '.hx-boot{position:fixed;inset:0;z-index:2147482000;display:grid;place-items:center;'
    + 'background:var(--card-solid,#f6f6f4);transition:opacity .26s ease,visibility 0s linear .26s}'
    + '.hx-boot.out{opacity:0;visibility:hidden;pointer-events:none}'
    + '.hx-boot-card{display:grid;place-items:center;gap:clamp(14px,2vh,30px);padding:24px;text-align:center}'
    + '.hx-boot-card .hx-loadpill{font-size:clamp(16px,1.1vw + 9px,30px);box-shadow:none}'
    + '.hx-boot-title{font:600 clamp(19px,1.5vw + 8px,36px)/1.25 var(--hx-font,-apple-system,"PingFang SC","Microsoft YaHei UI",sans-serif);'
    + 'color:var(--ink,#0b1220);letter-spacing:.02em;margin:0}'
    + 'html.hx-lite .hx-boot-card canvas{display:none}'
    + '@media (prefers-reduced-motion:reduce){.hx-boot-card canvas{display:none}}';
  (function () {
    var st = document.createElement('style');
    st.id = 'hx-loadfx-style';
    st.textContent = css;
    (document.head || document.documentElement).appendChild(st);
  })();

  // 按视口算整数放大倍数（像素画非整数缩放会糊）。
  // 首屏：短边 70% 定上限（2026-11-07 用户「再放大点」，62% → 70%），3～8 倍；
  // 面板内嵌：上限收紧，2～4 倍，放进卡片不撑爆。
  function fit(cv, m, compact) {
    var vw = window.innerWidth || 960, vh = window.innerHeight || 640;
    var maxW = compact ? Math.min(vw * 0.72, 340) : vw * 0.72;
    var maxH = compact ? Math.min(vh * 0.3, 260) : vh * 0.70;
    var k = Math.floor(Math.min(maxW / m.size[0], maxH / m.size[1]));
    // 上限 12：56px 的小特效在 1080p 也能放大到 ~620px，和 128px 大特效（5 倍 640px）
    // 视觉体量接近——不然随机抽到小特效那几把，「动效明显小一圈」。
    k = Math.max(compact ? 2 : 3, Math.min(compact ? 4 : 12, k || 0));
    cv.style.width = (m.size[0] * k) + 'px';
    cv.style.height = (m.size[1] * k) + 'px';
  }

  // 抽签（2026-11-05 返修）：**每次调用都重新随机**，只排除「上一次这个工具用过的 id」，
  // 保证连开两次一定不一样。「上一次」存 sessionStorage，仅作排除项，不再用来固定本次选择；
  // 同一会话里反复打开不再永远同一个特效（旧版 hx-loadfx-<tool> 固定键废弃，读到也忽略）。
  function pickId(tool) {
    var P = window.PixelFX;
    if (!P || !P.ids || !P.ids.length) return '';
    var K = 'hx-loadfx-last-' + tool, pool = P.ids, prev = '', i, cand = [];
    try { prev = sessionStorage.getItem(K) || ''; } catch (e) { }
    if (prev) {
      for (i = 0; i < pool.length; i++) if (pool[i] !== prev) cand.push(pool[i]);
      if (cand.length) pool = cand;               // 只有 1 个特效时只能重复，不硬造空池
    }
    var id = pool[Math.floor(Math.random() * pool.length)] || '';
    try { if (id) sessionStorage.setItem(K, id); } catch (e) { }
    return id;
  }

  // 在指定 canvas 上起一个特效引擎；起不来返回 null（调用方决定回落）
  function start(cv, tool, compact) {
    var P = window.PixelFX;
    if (!cv || !cv.getContext || !P || !P.effects || !P.ids || !P.ids.length) return null;
    var id = pickId(tool);
    var mod = P.effects[id];
    if (!mod || !mod.meta) return null;
    var m = mod.meta, W = m.size[0], H = m.size[1], O = m.origin || [W / 2, H / 2];
    cv.width = W; cv.height = H;
    cv.setAttribute('data-fx', id);
    if (!cv.className) cv.className = 'hx-fxcv';
    var ctx = cv.getContext('2d');
    if (!ctx) return null;
    fit(cv, m, compact);
    addEventListener('resize', function () { fit(cv, m, compact); });
    var img = ctx.createImageData(W, H), fr = P.createFrame(W, H);
    // one-shot 特效（meta.loop === false）播完 meta.duration 就重开一个：
    // 接线仿真的 hit-spark 只有 0.5 秒，闪屏保底 0.9 秒，不重播的话后 0.4 秒是一张空画布。
    var oneShot = m.loop === false, life = +m.duration || 0, age = 0;
    function spawn() {
      age = 0;
      return P.createFx(mod, { x: O[0], y: O[1], seed: Math.floor(Math.random() * 997) });
    }
    var fx = spawn();
    var touch = window.matchMedia ? matchMedia('(hover: none), (pointer: coarse)').matches : false;
    var GAP = (touch || lite()) ? 1000 / 18 : 1000 / 30;
    var raf = 0, last = 0, stopped = false;
    function paint(dt) {
      if (dt) {
        fx.update(dt);
        if (oneShot && life) { age += dt; if (age >= life) fx = spawn(); }  // one-shot 到期重播
      }
      P.clearFrame(fr); fx.draw(fr, 'back'); fx.draw(fr, 'front');
      P.composite(fr, img.data, null);
      ctx.clearRect(0, 0, W, H); ctx.putImageData(img, 0, 0);
    }
    function step(now) {
      raf = 0; if (stopped) return;
      // 面板重新渲染（innerHTML 换掉）后 canvas 已脱离文档：停循环，别在后台白烧 GPU
      if (!cv.isConnected) { stopped = true; return; }
      if (last && now - last < GAP - 1) { raf = requestAnimationFrame(step); return; } // 帧率封顶
      var dt = last ? Math.min((now - last) / 1000, 0.12) : 0;
      last = now; paint(dt);
      raf = requestAnimationFrame(step);
    }
    // 首帧（2026-11-05 返修）：
    //   · loop 特效：不少前 0.3～0.5 秒才长出主体，先在内存里按 1/60 步长预跑 0.35 秒
    //     （只 update，不 putImageData），再把这一帧一次性上屏，第一眼就有主体且继续在动；
    //   · one-shot 特效：第 0 帧就是峰值（实测 hit-spark t=0 实心 22.5%），预跑反而把动画放完，
    //     所以直接从 0 帧开播。预跑不建 rAF、不额外上屏，性能红线不变。
    if (!oneShot) for (var t = 0; t < 0.35; t += 1 / 60) fx.update(1 / 60);
    paint(0);
    last = performance.now();   // 下一帧直接吃真实 dt，不再补一帧 dt=0 的重复画面
    raf = requestAnimationFrame(step);
    return {
      stop: function () { stopped = true; if (raf) { cancelAnimationFrame(raf); raf = 0; } },
      fx: id
    };
  }

  // 造一条「方块 + 文字」药丸（回落时也用这一条，保证屏幕上永远只有一套加载语言）
  function pillEl(text) {
    var pill = document.createElement('div');
    pill.className = 'hx-loadpill sm';
    pill.setAttribute('role', 'status');
    var px = '<span class="hx-px" aria-hidden="true">', i;
    for (i = 0; i < 7; i++) px += '<i style="--i:' + i + '"></i>';
    pill.innerHTML = px + '</span><b></b>';
    pill.querySelector('b').textContent = text || '正在载入…';
    return pill;
  }

  // 页面内嵌版：往 host 里画「canvas + 药丸(方块+文字)」，返回 { el, done() }；播不了返回 null
  // opts.compact：面板/表格里的小号（2～4 倍、留白收紧）
  function mount(host, tool, text, full, opts) {
    var compact = !!(opts && opts.compact);
    if (!host || still()) return null;                 // 关动画 / 省电：回落，由调用方画药丸
    var cv = document.createElement('canvas');
    cv.className = 'hx-fxcv';
    var eng = start(cv, tool, compact);
    if (!eng) return null;                             // 包没出来 / canvas 建不出来：回落
    var pill = pillEl(text);
    var wrap = document.createElement('div');
    wrap.className = 'hx-fxwrap' + (full ? ' full' : '') + (compact ? ' panel' : '');
    wrap.setAttribute('aria-hidden', 'true');
    wrap.appendChild(cv); wrap.appendChild(pill);
    host.appendChild(wrap);
    // 最少停留（2026-11-05：420 → 640ms）：本地题库 30ms 就回来，秒闪一下反而像故障；
    // 面板小号也给足时间，短于 0.6 秒根本看不出像素在动。
    var at = performance.now(), MIN_SHOW = 640, out = false;
    return {
      el: wrap,
      fx: eng.fx,
      done: function () {                              // 淡出并整体移除；动效要活到移除那一刻
        if (out) return; out = true;
        setTimeout(function () {
          wrap.classList.add('out');
          // 2026-11-05 五修：**stop 必须放在移除之后**。原来先 eng.stop() 再淡出，
          // 数据一就绪（手机上 0.3~0.7s）画面就冻住，淡出的那 240ms 是一张静止图 ——
          // 用户看到的正是「一个像素动效的加载画面且不会动」。
          setTimeout(function () {
            if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
            eng.stop();
          }, 240);
        }, Math.max(0, MIN_SHOW - (performance.now() - at)));
      }
    };
  }

  // 首屏闪屏版（刷题 / 考试共用）：页面里先写好
  //   <div class="hx-boot" id="hxBoot"><div class="hx-boot-card"><canvas></canvas><div class="hx-loadpill sm">…</div></div></div>
  // 解析到它时（body 开头）就调 boot()：**第一帧就是 canvas 动效 + 药丸**，不会再出现裸文字阶段。
  // canvas 播不起来就把 canvas 藏掉，只留药丸（fallback 不空屏）。
  // finishBoot() 由工具在数据就绪后调：先保底 MIN_SHOW 再整层淡出移除。
  var bootH = null;
  // 2026-11-05：520 → 900ms。接线仿真在手机上约 0.7 秒就绪就淡出，动效刚进主体就被拿走；
  // 加载本来就在等，多留这三四百毫秒用户感知不到卡，却能从「一帧」变成「看得见在动」。
  var MIN_SHOW = 900;
  function boot(tool, overlayId) {
    var ov = document.getElementById(overlayId || 'hxBoot');
    if (!ov || ov.dataset.armed) return null;
    ov.dataset.armed = '1';
    var cv = ov.querySelector('canvas');
    var eng = still() ? null : start(cv, tool, false);
    if (!eng && cv) cv.style.display = 'none';
    bootH = { ov: ov, eng: eng, at: performance.now() };
    // 兜底：任何异常路径（网络卡死 / boot 抛错没走到 finishBoot）都不许把页面盖死，
    // 最多 8 秒强制收场，和 小组加分/fx/hx-jf-load.js 的 MAX_WAIT 同一思路。
    setTimeout(function () {
      if (bootH && bootH.ov === ov) finishBoot();
    }, 8000);
    return bootH;
  }
  function finishBoot() {
    if (!bootH) return;
    var b = bootH; bootH = null;
    // 2026-11-05 五修：**别在这里 stop 引擎**。工具准备好就会调本函数（手机 0.3~0.7s），
    // 而遮罩还得亮到 MIN_SHOW（900ms）。原来这里立刻 eng.stop()，于是引擎只画了第一帧，
    // 剩下的大半秒用户盯着一张冻图 —— 这就是「永远是一个像素动效的画面且不会动」的真因
    // （实测成品页 1.4 秒内 putImageData 只被调用 1 次）。停 rAF 只允许发生在移除之后。
    setTimeout(function () {
      b.ov.classList.add('out');                       // .hx-boot.out 淡出整层
      setTimeout(function () {
        if (b.ov.parentNode) b.ov.parentNode.removeChild(b.ov);
        if (b.eng) b.eng.stop();                       // 移除之后再停：淡出全程仍在动
      }, 300);
    }, Math.max(0, MIN_SHOW - (performance.now() - b.at)));
  }
  function booting() { return !!bootH; }

  // 面板加载占位：把 <div data-fxload="正在加载排行…"> 就地升级成 canvas+药丸；
  // 播不了（省电 / 包没出来）就填回回落药丸。面板重新渲染时占位节点被换掉，canvas 随之回收。
  function auto(root) {
    root = root || document;
    var list = root.querySelectorAll('[data-fxload]'), i;
    for (i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.dataset.fxdone) continue;
      el.dataset.fxdone = '1';
      var text = el.getAttribute('data-fxload') || '正在载入…';
      el.classList.add('hx-loadwrap', 'sm');
      var h = mount(el, el.getAttribute('data-fxtool') || 'panel', text, false, { compact: true });
      if (!h) el.appendChild(pillEl(text));
    }
  }

  window.HXLoadFx = {
    pick: function (tool) {                            // 供调试 / 自查：现抽一个（并记为「上一次」）
      return pickId(tool);
    },
    mount: mount,
    boot: boot,
    finishBoot: finishBoot,
    booting: booting,
    auto: auto
  };
})();
</script>
</head>
<body>
<div id="hxBoot" class="hx-boot" aria-hidden="true"><div class="hx-boot-card"><canvas id="hxBootCv" width="96" height="96"></canvas><p class="hx-boot-title">资料库</p><div class="hx-loadpill sm" role="status" aria-live="polite"><span class="hx-px" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i></span><b>正在载入…</b></div></div></div>
<script>HXLoadFx.boot('ziliao', 'hxBoot');</script>
<main id="app"></main>
<script>/* ================= 资料库工具 · 资料解析 + AI 出题引擎 =================
   来源：考试/src/imports.js（它又是 刷题/imports.js 的经典脚本版）原样拷来，2026-11-08 资料库独立成工具（Z2）。
   只改了三处：
     ① HXAI 调用的 tool 名从 'exam' 换成 'ziliao'（hx-ai.js 的 toolList 里还没有 ziliao 时，
        forTool 会落到「文本默认」那套，不影响使用）；
     ② chat 多透传一个 thinkLevel（quick/balanced/deep，不传 = 跟随那套配置自己的思考程度）；
     ③ 注释里的路径：产物在 /ziliao/index.html，解析组件在同目录 vendor/ 下（build.js 复制过去）。
   对外仍只挂 window.HXImp，函数名和签名不变。 */
'use strict';

const HXIMP_AI_MISS = '还没有配置 AI 模型，请到首页「AI 设置」里加一套';
const HXIMP_VISION_MISS = '要读图片／扫描件，得先在首页「AI 设置」里配一套支持图片的模型（如 Qwen-VL 这类看图模型）';
const HXIMP_LIB_MISS = '资料解析组件没加载到（可能是网络），TXT／MD 仍然可以直接用';

/* 解析组件按页面相对路径取：/ziliao/index.html → /ziliao/vendor/pdf.js */
const HXIMP_V = p => new URL('vendor/' + p, location.href).href;

let hximpAiLoading = null;
// 用到 AI 才加载 hx-ai.js；失败不报错，允许下次再试（线上可能还没部署这个文件）
function hximpAI() {
  if (window.HXAI) return Promise.resolve(window.HXAI);
  if (!hximpAiLoading) {
    hximpAiLoading = new Promise(resolve => {
      let s;
      try { s = document.createElement('script'); s.src = new URL('../hx-ai.js', location.href).href; }
      catch (e) { hximpAiLoading = null; return resolve(null); }
      s.onload = () => resolve(window.HXAI || null);
      s.onerror = () => { hximpAiLoading = null; resolve(null); };
      document.head.appendChild(s);
    });
  }
  return hximpAiLoading;
}
async function hximpChat(messages, opts) {
  const H = await hximpAI();
  if (!H || typeof H.chat !== 'function') throw new Error(HXIMP_AI_MISS);
  const o = { messages, tool: 'ziliao', json: !!(opts && opts.json) };
  if (opts && opts.thinkLevel) o.thinkLevel = opts.thinkLevel;
  return H.chat(o);
}
async function hximpVision(opts) {
  const H = await hximpAI();
  if (!H || typeof H.vision !== 'function') throw new Error(HXIMP_VISION_MISS);
  return H.vision(Object.assign({ tool: 'ziliao' }, opts));
}

const HXIMP_IMG = /\.(jpe?g|png|webp|gif|bmp)$/i;
const isImageFile = name => HXIMP_IMG.test(String(name || '').toLowerCase());

/* ── 有没有文字层：按「每页平均字数」判，不按全文总量（2026-11-19）────────────
   用户报：「逐页 AI 识图（第 35/35 页）」把整本 35 页的 PDF 都送去识图。
   旧口径是「全文（去空白前）不足 50 字才算扫描件」，两个坑：
     ① 扫描件里常夹着页码、水印、页眉，35 页凑出几十个字就超过 50，误判成「有文字层」；
     ② 反过来，10 页里只有封面有文字，总量也可能不到 50，把整本有文字层的书送去做识图（花额度）。
   每页平均才是真实口径：正常排版的 PDF 一页至少上百字，扫描件一页 0～几个字。 */
const HXIMP_MIN_PAGE_CHARS = 20;
function wantVision(pageTexts) {
  const arr = Array.isArray(pageTexts) ? pageTexts : [];
  if (!arr.length) return true;
  const counts = arr.map(s => String(s == null ? '' : s).replace(/\s+/g, '').length);
  return counts.reduce((a, b) => a + b, 0) / counts.length < HXIMP_MIN_PAGE_CHARS;
}
// 有文字层的页数（只用来报进度 / 排查，不参与判断）
const hximpTextPages = pageTexts => (pageTexts || []).filter(s => String(s == null ? '' : s).replace(/\s+/g, '').length >= HXIMP_MIN_PAGE_CHARS).length;

/* 当前这套配置用哪个模型（给报错文案用：老师要照着名字去改设置）。
   hx-ai 的 pick 会按「工具指定 → 能力默认 → 文本默认」挑一套；挑不到就返回空串。 */
function hxImpModel(cap) {
  const p = hxImpProfile(cap);
  return p ? String(p.name || p.model || '') : '';
}
/* 同一套配置的原始 model id（发给平台的那个字符串）。为什么要单独要一份：
   用户可能把配置命名成「硅基流动-看图」，名字里看不出模型是什么，
   而「读不读得了图」只有 model id 说得清（Qwen/Qwen-Image 就是文生图）。 */
function hxImpProfile(cap) {
  const H = (typeof window !== 'undefined') ? window.HXAI : null;
  if (!H || typeof H.pick !== 'function') return null;
  try { return H.pick({ cap: cap || 'text', tool: 'ziliao' }) || null; }
  catch (e) { return null; }
}

/* ── 这个模型根本不能读图（2026-11-20）────────────────────────────────────
   用户报的原文：「有 1 份没转成：《第 314/314 页转成图片》失败 —— …没处理成功，
   模型返回：Model does not exist. Please check it carefully.」
   他的「图片识别」位配的是 Qwen/Qwen-Image —— 硅基流动的文生图模型，只挂在
   /images/generations，走 /chat/completions 就是这个英文报错。
   以前只判断「有没有配模型」（hxImpModel 返回空才算没配），配错了类型拦不住，
   结果 314 页全渲染完（几十秒 + 上百 MB）才在第 1 页识图时炸，进度条还停在
   「第 314/314 页」，看着像「渲染失败」，老师完全不知道该改哪儿。
   所以挪到开跑前按 model id 拦一次：名字里带 image / flux / embed / tts 这些的，
   一个都读不了图。宁可早一秒说清楚，也别白跑 314 页。 */
const HXIMP_NO_VISION_RE = /dall-?e|gpt-image|flux|stable-diffusion|seedream|wanx|cogview|kolors|qwen[-\/]?image|(^|[-_/])sd3|embed|rerank|bge-|tts|whisper|(^|[-_/])asr|speech|cogvideo|seedance|(^|[-_/])sora|(^|[-_/])veo|kling/i;

/* ── 报错中文化（2026-11-19）──────────────────────────────────────────────
   用户截图原话：「有 1 份没传成：电气接线第一章.pdf：「逐页 AI 识图（第 35/35 页）」失败 ——
   The model is not a VLM (Vision Language Model). Please use text-only prompts.」
   老师看不懂，也不知道下一步该点哪儿。上游（各家模型 / 网关）的报错一律经过这里改写：
   「哪份资料 · 什么原因 · 去哪儿改 · 改完做什么」。 */
const HXIMP_VLM_RE = /not a vlm|isn'?t a vision|not a vision|vision language|text-only|does not support (image|vision|multimodal)|unsupported.*(image|vision)|image.*not supported|多模态|不支持图片|不是视觉/i;
/* 模型根本不存在（2026-11-20）。用户截图原话：
   「《单片机应用技术…》没处理成功，模型返回：Model does not exist. Please check it carefully.」
   —— 他 314 页扫描教材跑到「第 314/314 页」才炸，看到的就是这句英文 + 「把这句反馈给管理员」。
   硅基流动 / OneAPI 这类网关对「这个接口不认这个模型」统一回 20012「Model does not exist」，
   最常见的两个原因：① 模型名打错（多了空格 / 用了别家的 id）；② 把文生图模型
   （Qwen/Qwen-Image 这种只挂在 /images/generations 的）填进了「图片识别」——
   /chat/completions 不认它，报的就是这句。这两种都不是老师能自己读懂的，必须翻译成人话。 */
const HXIMP_MODEL_MISS_RE = /model does not exist|model not found|no such model|invalid model|unknown model|model_not_found|模型不存在|找不到模型|模型.*(不存在|没有找到)/i;
function hxImpHumanErr(e, name, model, cap) {
  const raw = String((e && e.message) || e || '').trim();
  const nm = name ? '《' + name + '》' : '这份资料';
  const md = model ? '「' + model + '」' : '现在这套';
  const goAI = '去首页「AI 设置」';
  const tail = raw ? '（原始报错：' + raw.slice(0, 120) + '）' : '';
  /* 要读图的时候，报错必须指名「图片识别」这一格 —— 老师改「文本问答」是没用的。 */
  const slot = cap === 'vision' ? '图片识别' : '资料库';
  if (HXIMP_MODEL_MISS_RE.test(raw)) {
    return nm + '：' + goAI + '「' + slot + '」配的模型'
      + (model ? '「' + model + '」' : '') + '在这个平台上不存在。'
      + '要么模型名写错了（多一个空格、少了版本号都会这样），要么它是文生图 / 向量 / 语音这类模型 —— '
      + '这些模型不能看图识字。' + goAI + '把「' + slot + '」换成一个能看图的模型'
      + '（如 Qwen2.5-VL / Qwen3-VL / GPT-4o / doubao-vision），再重新上传这份资料。' + tail;
  }
  if (HXIMP_VLM_RE.test(raw)) {
    return nm + '是扫描件（没有文字层），要靠 AI 看图识字，但'
      + (model ? '你在「AI 设置 → 资料库」配的模型「' + model + '」' : '现在给「资料库」配的模型')
      + '不支持图片。' + goAI + '给「' + slot + '」换一个看图模型（如 Qwen-VL / GPT-4o），再重新上传这份资料。';
  }
  if (/40[13]|unauthor|invalid.*(key|token)|api[\s_-]?key|forbidden|no permission/i.test(raw)) {
    return md + '的 API Key 不对或没有权限。' + goAI + '检查这套配置的 Key 有没有填错、是不是过期了。' + tail;
  }
  if (/429|rate.?limit|too many requests|quota|exceeded/i.test(raw)) {
    return '调 AI 太频繁或用超了额度。等一两分钟再试，或' + goAI + '换一个模型。' + tail;
  }
  if (/402|insufficient|balance|余额|欠费/i.test(raw)) {
    return md + '的账户余额不足。给这个平台充值，或' + goAI + '换一个平台。' + tail;
  }
  if (/context|too long|maximum.*token|max.*length|length.*limit/i.test(raw)) {
    return nm + '太长，一次喂不完。把它拆成几份再传，或出题时在「范围」里限定章节。' + tail;
  }
  if (/timeout|timed out|abort|network|failed to fetch|econn|enotfound|连不上|网络/i.test(raw)) {
    return '连不上 AI 服务。检查网络，或' + goAI + '看看接口地址填对没有。' + tail;
  }
  if (/\b5\d\d\b|server error|bad gateway|service unavailable/i.test(raw)) {
    return 'AI 服务端出错了，不是你这边的问题。过几分钟再试，或' + goAI + '换一个模型。' + tail;
  }
  /* 已经是中文的（我们自己的提示 / hx-ai 的「没配模型」提示）原样放行，别套两层。 */
  if (/[\u4e00-\u9fa5]/.test(raw)) return nm + '：' + raw;
  return nm + '没处理成功' + (raw ? '，模型返回：' + raw.slice(0, 160) : '，模型没有返回原因')
    + '。换一个模型再试；要是还不行，把这句话发给管理员。';
}

// 图片转 dataURL：最长边压到 1600px、JPEG 0.8。手机拍一页教材 4MB，原样发几张模型会直接拒。
function fileToDataUrl(file, max = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // 透明 PNG 铺白底，否则转 JPEG 会变黑块
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      } catch (e) { reject(new Error('图片处理失败：' + e.message)); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('这张图片读不出来（可能不是常见的 jpg/png）')); };
    img.src = url;
  });
}

/* 读一份资料 → { text } 或 { image }（图片不在这一步转文字，交给视觉模型） */
async function readMaterial(file) {
  const name = String(file && file.name || '').toLowerCase();
  if (isImageFile(name)) return { image: await fileToDataUrl(file), text: '' };
  if (/\.(txt|md|text)$/i.test(name)) return { text: await file.text() };
  if (name.endsWith('.docx')) {
    let m;
    try { m = await import(HXIMP_V('mammoth.browser.min.js')); }
    catch (e) { throw new Error(HXIMP_LIB_MISS); }
    const lib = globalThis.mammoth || (m && m.default) || m;
    if (!lib || !lib.extractRawText) throw new Error(HXIMP_LIB_MISS);
    const r = await lib.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { text: r.value || '' };
  }
  if (name.endsWith('.pdf')) {
    let pdfjs;
    try { pdfjs = await import(HXIMP_V('pdf.js')); }
    catch (e) { throw new Error(HXIMP_LIB_MISS); }
    pdfjs = pdfjs.default && pdfjs.default.getDocument ? pdfjs.default : pdfjs;
    pdfjs.GlobalWorkerOptions.workerSrc = HXIMP_V('pdf.worker.js');
    const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const c = await page.getTextContent();
      pages.push(c.items.map(it => String(it.str || '')).join(' '));
    }
    const text = pages.join('\n');
    /* 扫描件没有文字层：把「这需要逐页识图」这件事交回调用方（带上原文件，
       让 ui-mat.js 走 ocrScannedPdf 逐页 AI 识图）。
       2026-11-19：判断口径改成「每页平均字数 < 20」—— 见上面 wantVision 的注释。 */
    if (wantVision(pages)) return { text: '', scannedPdf: file, pageCount: pages.length, textPages: hximpTextPages(pages) };
    return { text };
  }
  throw new Error('支持 PDF、DOCX、TXT、MD，以及 jpg／png 图片；旧版 .doc 请另存为 .docx');
}

// 图片/扫描件 → 文字。走视觉模型（HXAI.vision），没配看图模型时把话说清楚。
async function ocrImages(images) {
  if (!images || !images.length) throw new Error('没有读到图片。');
  const txt = await hximpVision({
    prompt: '把这张资料图片里的文字逐字抄下来：保留段落和小标题，公式用文字描述。看不清的地方写（看不清），不要总结、不要编。',
    images
  });
  return String(txt || '');
}

/* ── 扫描 PDF 逐页识图（Z7 / B12，2026-11-12）────────────────────────────
   扫描件没有文字层，`readMaterial` 读到空文本后不再直接抛「请用 AI 识图」，
   而是把每页渲染成一张图，交给视觉模型逐页抄字 —— 一次传一页，逐页报进度，
   断在哪一页一眼能看出来。约 350 页会花用户 AI 额度，这是用户拍板同意的。

   2026-11-20 三处改动（都为用户那次「314 页教材」的事故）：
     ① **渲染一页就识一页**，不再「先全渲染完再逐页识图」。原来那版把 314 张
        1600px 的 JPEG dataURL 全攒在内存里（上百 MB），而且第一页识图就失败时，
        前面 313 页的渲染全白跑 —— 用户看到的进度还停在「第 314/314 页」，
        像是渲染挂了，实际是识图模型配错。
     ② 开跑前按 model id 拦「读不了图的模型」（文生图 / 向量 / 语音），别等 49 秒后才炸。
     ③ 支持页码范围：老师只要前五章（书页 1–179 ≈ PDF p11–p189），
        没必要让 314 页全花一遍 AI 额度。range = {from, to}，都是 PDF 页码（1 起）。 */

const HXIMP_RANGE_MISS = '页码范围写得不对（要像 11-189 这样，PDF 页码从 1 开始）';

// 把用户的 {from,to} 收成合法区间；不传 / 写反 / 超界都兜住，绝不因为一个输入框让整份失败
function hximpRange(numPages, range) {
  const n = Math.max(1, Math.floor(+numPages) || 1);
  let a = Math.floor(+(range && (range.from != null ? range.from : range[0])) || 0);
  let b = Math.floor(+(range && (range.to != null ? range.to : range[1])) || 0);
  if (!a && !b) return { from: 1, to: n, total: n };
  if (a < 1) a = 1;
  if (b < 1) b = n;
  /* 起页超出总页数要拦：多半是照「书上的印刷页码」填的（这本差 10 页），
     闷声转成「最后一页」只会给老师一份空白资料，不如当场说清。 */
  if (a > n) throw new Error(HXIMP_RANGE_MISS + '：这份 PDF 只有 ' + n + ' 页，你写的是第 ' + a + ' 页起。');
  if (b > n) b = n;                            // 尾页写超了就是到最后一页，不必打扰老师
  if (a > b) { const t = a; a = b; b = t; }   // 写反了（189-11）就按小的在前，不报错
  return { from: a, to: b, total: b - a + 1 };
}

// 打开 PDF（渲染和取页数都要用同一份 document，别每页重开一次）
async function hximpOpenPdf(file) {
  let pdfjs;
  try { pdfjs = await import(HXIMP_V('pdf.js')); }
  catch (e) { throw new Error(HXIMP_LIB_MISS); }
  pdfjs = pdfjs.default && pdfjs.default.getDocument ? pdfjs.default : pdfjs;
  pdfjs.GlobalWorkerOptions.workerSrc = HXIMP_V('pdf.worker.js');
  return pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
}

// 把第 i 页（1 起）渲染成 JPEG dataURL（最长边 1600px，和 fileToDataUrl 同一口径，省 token）
async function hximpRenderPage(pdf, i) {
  const page = await pdf.getPage(i);
  const vp = page.getViewport({ scale: 1 });
  const scale = Math.min(1.8, 1600 / Math.max(vp.width, vp.height));
  const vp2 = page.getViewport({ scale });
  const cv = document.createElement('canvas');
  cv.width = Math.round(vp2.width); cv.height = Math.round(vp2.height);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); // 透明底铺白，转 JPEG 不会发黑
  await page.render({ canvasContext: ctx, viewport: vp2 }).promise;
  return cv.toDataURL('image/jpeg', 0.82);
}

// 把 PDF 每一页渲染成 JPEG dataURL。onPage(k, 共几页, PDF 第几页)
async function renderPdfPages(file, onPage, range) {
  const pdf = await hximpOpenPdf(file);
  const { from, to, total } = hximpRange(pdf.numPages, range);
  const pages = [];
  for (let i = from; i <= to; i++) {
    pages.push(await hximpRenderPage(pdf, i));
    if (onPage) onPage(i - from + 1, total, i);
  }
  return { pages, pageCount: total, from };
}

/* 逐页识图：一次传一页，onProgress(k, total, text, stage, pageNo) 报进度；整本拼成一段文字返回。
   stage：'render'（正在把这页转成图片，text 为 null）/ 'ocr'（已渲染完，正要送模型识别）/
   'done'（这页识完了，text 是识出来的字）。分开报是为了让进度条上的那句话永远是「正在干什么」，
   而不是像原来那样两者共用一句「第 k/n 页」，最后停在哪句都说不清。 */
async function ocrScannedPdf(file, onProgress, range) {
  /* 先看「图片识别」这一格配的是什么，再开始渲染（2026-11-19 / 2026-11-20）：
     35 页渲染要几十秒，314 页要一分多钟 —— 渲染完才发现模型配错纯属白等。
     两道判断都要：
       · 空的 → 没配看图模型；
       · 配了但 model id 一看就是文生图 / 向量 / 语音（Qwen/Qwen-Image、bge-m3、whisper…）→
         这种模型走 /chat/completions 只会回一句 Model does not exist，必须现在就翻译成人话。 */
  const prof = hxImpProfile('vision');
  if (!prof) {
    throw new Error('这份资料没有文字层（扫描件 / 图片），要靠 AI 看图识字，但「AI 设置」里还没有给「资料库」配看图模型。'
      + '去首页「AI 设置」把一套支持图片的模型（如 Qwen-VL / GPT-4o）设为「图片识别」默认，再重新上传。');
  }
  const mid = String(prof.model || ''), pname = String(prof.name || '');
  if (HXIMP_NO_VISION_RE.test(mid) || HXIMP_NO_VISION_RE.test(pname)) {
    throw new Error('「AI 设置 → 图片识别」现在配的是「' + (pname || mid) + '」（模型 ' + (mid || '未填') + '），'
      + '它不是看图识字的模型 —— 文生图 / 向量（embedding、rerank）/ 语音这类模型读不了图片，'
      + '发过去平台只会回一句 Model does not exist。'
      + '去首页「AI 设置 → 图片识别」换成一个带 VL 的视觉模型（如 Qwen2.5-VL / Qwen3-VL / GPT-4o / doubao-vision），再重新上传。');
  }
  const pdf = await hximpOpenPdf(file);
  const { from, to, total } = hximpRange(pdf.numPages, range);
  const out = [];
  for (let k = 1; k <= total; k++) {
    const pageNo = from + k - 1;
    if (onProgress) onProgress(k, total, null, 'render', pageNo);
    const img = await hximpRenderPage(pdf, pageNo);
    if (onProgress) onProgress(k, total, null, 'ocr', pageNo);
    /* 这里不包一层「第几页失败」—— 进度回调已经把「第 k/total 页」交给 ui-mat 写进 step，
       报错文案由 humanErr 统一改写（它认得 Model does not exist 这句英文）。
       两边都加页码只会变成「第 1 页：第 1/314 页识图失败：…」这种绕口的句子。 */
    const txt = String(await hximpVision({
      prompt: '把这张教材页里的文字逐字抄下来：保留段落、小标题和序号，公式、电路图用文字描述，表格逐行抄。看不清的写（看不清），不要总结、不要编、不要加自己的解释。',
      images: [img]
    }) || '').trim();
    out.push(txt);
    if (onProgress) onProgress(k, total, txt, 'done', pageNo);
  }
  return out.join('\n\n');
}


function parseJson(text) {
  const cleaned = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(cleaned); } catch (e) {
    const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
    if (a >= 0 && b > a) return JSON.parse(cleaned.slice(a, b + 1));
    throw new Error('AI 返回的内容不是有效 JSON，请重试或换一个模型。');
  }
}

function answerTokens(raw) {
  const out = [];
  for (const v of (Array.isArray(raw) ? raw : [raw])) {
    const s = String(v == null ? '' : v).trim();
    if (!s) continue;
    if (/^[A-Fa-f]{2,}$/.test(s)) out.push(...s.toUpperCase().split(''));
    else out.push(...s.split(/[,，、/;；\s]+/).filter(Boolean));
  }
  return out;
}
const judgeKey = t => /^(正确|对|是|√|T|TRUE|Y|YES)$/i.test(t) ? 'T' : /^(错误|错|否|×|X|F|FALSE|N|NO)$/i.test(t) ? 'F' : '';
const hximpUid = () => (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ── 大题的小问拆分（2026-11-21）────────────────────────────────────────────
   老师原话：「我想要的大题是分两个问的……每个小问题格式要求」。
   提示词已经要求分条了，但模型还是经常把 2 个小问的答案连成**一个字符串**
   （「（1）在 Keil C51 中新建工程…… （2）在 Proteus 中搭建最小系统……」）。
   那个字符串写进 hx_exam_qbank.a 之后，卷面和参考答案都是一坨，看不出是两个问。
   所以在入库前按**句首编号**（（1）/ (1) / ① / 1） / 1.）拆成数组，一个小问一条。

   两条硬规矩：
   · 至少认到 **2 个**编号才拆 —— 只有一个「（1）」开头的，是整段答案的序号，不是小问；
   · 数字后紧跟数字的不算（「3.3V 供电」的「3.」不是编号），否则会把参数拆成好几条。
   拆不干净就原样返回一条，绝不靠标点乱切。 */
const SUBMARK_PAREN = /[（(]\s*(?:\d{1,2}|[一二三四五六七八九十])\s*[)）]|[①②③④⑤⑥⑦⑧⑨⑩]/g;
/* 裸编号（1. / 1、/ 1））一定要有分隔符在前面：「3.3V 供电」的「3.」不是编号。
   带括号的（1）和 ① 没这个歧义，不用前缀。 */
const SUBMARK_BARE = /(?:^|[\s。；;：:、，,）)])(\d{1,2}[、.．](?!\d))/g;
function subMarks(t) {
  const out = [];
  let m;
  SUBMARK_PAREN.lastIndex = 0;
  while ((m = SUBMARK_PAREN.exec(t))) out.push([m.index, m[0].length]);
  SUBMARK_BARE.lastIndex = 0;
  while ((m = SUBMARK_BARE.exec(t))) out.push([m.index + (m[0].length - m[1].length), m[1].length]);
  return out.sort((a, b) => a[0] - b[0]);
}
function splitSubs(s) {
  const t = String(s == null ? '' : s).trim();
  if (!t) return [];
  const marks = subMarks(t);
  /* 只认到 1 个编号（多半是整段答案的序号，或者模型已经分好条、每条自带（1））：
     把句首那个编号去掉就行 —— 渲染时会按小问序号重新加，留着会变成「（1）（1）…」。 */
  if (marks.length < 2) {
    const body = marks.length === 1 && marks[0][0] === 0 ? t.slice(marks[0][1]).trim() : t;
    return [body || t];
  }
  const out = [];
  /* 编号前面若还有引导语，并进第一条；但「参考答案：」这种小标签直接丢掉 —— 
     拼进去会变成「（1）参考答案： 在 Keil…」，比不拆还难看。 */
  let head = t.slice(0, marks[0][0]).trim();
  if (/^[^。；;：:]{0,12}[：:]$/.test(head)) head = '';
  for (let i = 0; i < marks.length; i++) {
    const from = marks[i][0] + marks[i][1];
    const seg = t.slice(from, i + 1 < marks.length ? marks[i + 1][0] : t.length).trim();
    if (seg) out.push(i === 0 && head ? head + ' ' + seg : seg);
  }
  return out.length >= 2 ? out : [t];
}

/* 校验/规整一道题。和 刷题 那份逐条一致（含“被拒的题要带第几条 + 题干前几个字 + 原因”），
   只多了 term 和 term 的长度上限。返回 {questions, rejected}。 */
function normalizeQuestions(raw, subject, extra) {
  /* 2026-11-19：支持老师自己加的题型（如「实操」）。
     extra 是这类题型的 key 数组，一律按「文字答案题」处理（题干 + 参考答案，没有选项），
     和简答题同一条校验路，只是不做长度上限 —— 自定义题型可能要求写一段步骤或一段代码。 */
  const CUSTOM = Array.isArray(extra) ? extra : [];
  const input = Array.isArray(raw) ? raw : raw && raw.questions;
  if (!Array.isArray(input)) throw new Error('题库需要是数组，或包含 questions 数组的 JSON 对象。');
  const questions = [], rejected = [];
  input.forEach((item, index) => {
    const stem0 = String((item && (item.stem || item.question || item.title)) || '').trim();
    let stem = stem0;
    const rawType = String((item && item.type) || '').trim();
    /* 自定义题型先认：像 shicao 这种 key 在 TYPE_ALIAS 里没有，不先拦的话会掉进下面「按选项猜题型」，
       猜成填空（因为没选项、没下划线就再被拒一次），老师看到的是「题型不支持」。 */
    let type = CUSTOM.indexOf(rawType.toLowerCase()) >= 0 ? rawType.toLowerCase()
      : (TYPE_ALIAS[rawType.toLowerCase()] || TYPE_ALIAS[rawType] || '');
    const reject = reason => { rejected.push({ index: index + 1, stem: stem0.slice(0, 20), reason }); };
    if (!stem0) return reject('题干是空的');
    if (!type) {
      const opt = item && item.options;
      const list = Array.isArray(opt) ? opt : (opt && typeof opt === 'object' ? Object.keys(opt) : []);
      if (list.length && (String(list[0]).toUpperCase() === 'T' || /正确/.test(String((opt[0] && opt[0].text) != null ? opt[0].text : opt[0])))) type = 'judgment';
      else if (list.length >= 2) type = answerTokens(item.answer).length > 1 ? 'multiple' : 'single';
      else type = 'fill';
    }
    if (!SUPPORTED.includes(type) && CUSTOM.indexOf(type) < 0) return reject('题型「' + (rawType || '未知') + '」暂时不支持');

    const rawOptions = (item && (item.options || item.选项)) || [];
    /* 符号图（2026-11-20）：fig 只是原样透传，这里不判断 id 认不认识 ——
       认不认识是 figlib（HXFig.hasFig）的事，写库前由 ui-mat 的 MAT_toDb 统一筛一遍。
       没给 fig 的题/选项不补空值，题库那边就当作无图。 */
    let options = Array.isArray(rawOptions)
      ? rawOptions.map((op, i) => typeof op === 'string'
        ? { key: String.fromCharCode(65 + i), text: op.replace(/^[A-Fa-f][.、:：)）]\s*/, '') }
        : {
          key: String((op && op.key) || String.fromCharCode(65 + i)).toUpperCase(),
          text: String(op && op.text != null ? op.text : (op && op.value) || ''),
          ...((op && op.fig) ? { fig: String(op.fig).trim() } : {})
        })
      : Object.entries(rawOptions).map(([k, v]) => ({ key: k.toUpperCase(), text: String(v) }));
    const texty = type === 'fill' || type === 'short' || type === 'term' || type === 'prog' || CUSTOM.indexOf(type) >= 0;
    if (texty) options = [];
    if (type === 'judgment' && !options.length) options = [{ key: 'T', text: '正确' }, { key: 'F', text: '错误' }];

    let answer;
    if (texty) {
      const raw2 = item.answer != null ? item.answer : item.答案;
      const vals = (Array.isArray(raw2) ? raw2 : [raw2]).map(v => String(v == null ? '' : v).trim()).filter(Boolean);
      /* 填空：按顿号/分号拆成一空一条（原有行为不动）。
         自建大题（实操之类）：**一条小问一条**，模型连成一段的按（1）（2）拆开（splitSubs）。
         简答 / 名词解释 / 程序分析：仍合成一段 —— 它们在卷面上本来就是「一段答案 + 留白」，
         拆成数组反而会让下游的 answer[0] 只显示第一句。 */
      answer = type === 'fill'
        ? vals.flatMap(v => v.split(/[、，,；;]+/).map(s => s.trim()).filter(Boolean))
        : CUSTOM.indexOf(type) >= 0
          ? vals.flatMap(splitSubs)
          : [vals.join(' ')].filter(Boolean);
    } else {
      answer = answerTokens(item.answer != null ? item.answer : item.答案).map(tk => {
        const t = tk.replace(/[.。、:：)）]$/, '');
        if (type === 'judgment') return judgeKey(t) || t.toUpperCase();
        if (/^[A-Fa-f]$/.test(t)) return t.toUpperCase();
        const hit = options.find(o => String(o.text).trim() === t);
        return hit ? hit.key : t.toUpperCase();
      });
    }
    answer = [...new Set(answer)];

    if (type === 'fill') {
      if (!/_{2,}/.test(stem)) stem = stem.replace(/[（(]\s*[)）]/, '____').replace(/\s*[（(]\s*[)）]\s*/g, ' ____ ');
      if (!/_{2,}/.test(stem)) return reject('填空题的题干里没有 ____ 表示空格位置，学生没地方填');
    }
    const keys = new Set(options.map(o => o.key));
    if (!answer.length) return reject(type === 'prog' ? '程序分析题没有参考答案' : texty ? '参考答案是空的' : '没有答案');
    if (texty) {
      if (type === 'short' && answer[0].length > 1200) return reject('简答题的参考答案太长（超过 1200 字），像是把原文整段搬过来了');
      if (type === 'term' && answer[0].length > 600) return reject('名词解释的答案太长（超过 600 字），应该是几句话的解释');
      if (type === 'prog' && answer[0].length > 2000) return reject('程序分析题的参考答案太长（超过 2000 字），像是把原文整段搬过来了');
    } else {
      if (options.length < 2) return reject('选项少于 2 个');
      if (answer.some(a => !keys.has(a))) return reject('答案 ' + answer.filter(a => !keys.has(a)).join('、') + ' 不在选项里');
      if (type !== 'multiple' && answer.length !== 1) return reject(TYPE_LABEL[type] + '只能有 1 个答案，这份给了 ' + answer.length + ' 个');
    }
    const arr = v => (Array.isArray(v) ? v : v ? [v] : []).map(x => String(x == null ? '' : x).trim()).filter(Boolean);
    const code = String((item && (item.code || item.代码 || item.程序)) || '').trim();
    const sub = arr(item && (item.sub || item.小问 || item.问题));
    const knowledge = String((item && (item.knowledge || item.知识点)) || '').trim();
    /* 题干级的符号图 id（AI 按提示词的「符号表」写），空字符串当没写。
       2026-11-20：符号库里没有的 id 直接当没给（认不出的图不如没有），
       下面「提了图就必须有图」那条会把它按「没图」处理。 */
    const figRaw = String((item && item.fig) || '').trim();
    const fig = figRaw && figKnown(figRaw) ? figRaw : '';
    /* 章节号 ch：AI 输出的数字（或「第N章」这种），认不出是 0/null。只留整数，别的当没有。 */
    const chRaw = item && (item.ch != null ? item.ch : item.章节);
    let ch = null;
    if (chRaw != null && chRaw !== '') {
      const m = String(chRaw).match(/\d+/);
      if (m) { const n = +m[0]; if (n > 0) ch = n; }
    }
    /* 小节（2026-11-20）：有目录时以块上的 sec 为准（aiGenerate 注入 __sec），
       这里只是把模型万一写了的 sec / secTitle 收下来，给「没有目录的老资料」兜个底。 */
    const secRaw = String((item && (item.sec != null ? item.sec : item.小节)) || '').trim();
    const sec = /^[0-9]+(\.[0-9]+)*$/.test(secRaw) ? secRaw : null;
    const secTitleRaw = String((item && (item.secTitle != null ? item.secTitle : item.节名)) || '').trim();
    /* 「要么有图，要么别提图」（2026-11-20）：题干/选项里写了「如图」「下图」「图 1.23」
       却没有可用的 fig —— 这道题直接不收。留着半截的题学生根本没法作答
       （老师截图里的判断题：「在图 1.23 电路中……（  ）」既没图也不该出判断题）。 */
    const figRef = figRefOf(stem, options);
    if (figRef && !fig) {
      return reject('引用了「' + figRef + '」却没给图：要么补上 fig，要么把这句话改成文字描述');
    }
    questions.push({
      id: subject + '-ai-' + hximpUid(),
      number: (item && item.number) || questions.length + 1,
      stem, type, options, answer,
      explanation: String((item && (item.explanation || item.解析)) || '').trim(),
      ...(fig ? { fig } : {}),
      ...(ch != null ? { ch } : {}),
      ...(sec ? { sec } : {}),
      ...(secTitleRaw ? { secTitle: secTitleRaw.slice(0, 60) } : {}),
      ...(code ? { code } : {}),
      ...(sub.length ? { sub } : {}),
      ...(knowledge ? { knowledge } : {}),
      source: (item && (item.source || item.出处)) || 'AI'
    });
  });
  return { questions, rejected };
}

/* 切块：上传资料时存进 hx_exam_chunk（DB 里每块 body 最多 8000 字），
   所以 size 取 3600、overlap 320 —— 留足余量，也不会把一句话切两半切得太狠。 */
function chunks(text, size = 4200, overlap = 450) {
  const clean = String(text || '').replace(/\r/g, '');
  const out = [];
  for (let start = 0; start < clean.length; start += Math.max(1, size - overlap)) {
    out.push(clean.slice(start, start + size));
    if (start + size >= clean.length) break;
  }
  return out;
}

/* ── 目录（章 / 节 / 知识点）：导入时做一次，出题时继承（2026-11-20）────────────
   老师原话：「我们在导入材料的时候就把章节小节和其知识点做好，后续就算有题型未识别，
   我们不就可以识别该知识点更属于哪个章节从而归纳了吗，我们要在导入材料的时候做好这些数据处理。」
   现状：章节号 ch 全靠出题时让 AI「自己认」—— 电气 451 道题里 132 道认成空，按章组卷抽不到。
   根子是结构信息在导入阶段就丢了。这里补四步：
     A. buildToc：一次 AI 调用抽目录树，只喂「开头 + 全文里像标题的行」，不喂整本（省额度）；
     B. tocFromText：AI 失败 / 返回空 / 超时就按「项目一 / 第1章 / 1.1 ×××」这类标题行
        用正则拼一份最小目录 —— 绝不因为 AI 失败挡住导入；
     C. chunkMeta：切块后按目录给每块打 ch / sec / secTitle（一块跨节取命中最多的那节，
        一块完全没命中就沿用上一块，第一块没命中留空，不瞎猜）；
     D. genPrompt：有 ch 时把「这一段的章节是……」写死进提示词，ch 由块继承，不再让模型猜。 */

const HXIMP_TOC_HEAD = 2600;      // 目录/前言基本都在开头这 2600 字里
const HXIMP_TOC_LINES = 240;      // 再补最多 240 条「像标题」的行
const HXIMP_TOC_CHARS = 14000;    // 喂给模型的总字数上限
const HXIMP_TOC_TIMEOUT = 60000;  // 目录识别最多等这么久，超时直接走正则兜底

/* 中文数字 → 整数（「项目一」「第十二章」）。认不出返回 0。 */
const HXIMP_CN = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
function tocNum(s) {
  const t = String(s == null ? '' : s).trim();
  if (/^\d{1,3}$/.test(t)) return +t;
  if (!t || !/^[一二三四五六七八九十]{1,3}$/.test(t)) return 0;
  if (t === '十') return 10;
  const m = t.match(/^([一二三四五六七八九])?十([一二三四五六七八九])?$/);
  if (m) return (m[1] ? HXIMP_CN[m[1]] : 1) * 10 + (m[2] ? HXIMP_CN[m[2]] : 0);
  return HXIMP_CN[t] || 0;
}

/* 2026-11-20：资料正文是 Markdown（`# 项目3 单片机并行 I/O 端口的应用`），
   而老正则以 `^\s*` 开头、`#` 把它挡住了 —— 5 份资料的章命中全是 0，就是这个原因。
   所以标题正则统一加一段「Markdown 前缀」：允许 `### ` 和 `> `（引用块里的标题）。
   **故意不吃 `-` 和 `*`**：正文里 `- 项目3 建议 18 学时…` 这种列表项长得也像章标题，
   放进来会把列表当成章（这个坑比漏掉标题更难查）。 */
const HXIMP_MD = '^[ \\t]*(?:>[ \\t]*)?(?:#{1,6}[ \\t]*)?';
/* 一行像不像大章标题：「第3章 ××」「项目一 常用低压电器」「## 项目3 ××」「单元 2 ××」「模块4」。 */
const HXIMP_H_CH = new RegExp(HXIMP_MD + '(?:第\\s*([0-9]{1,2}|[一二三四五六七八九十]{1,3})\\s*(?:章|项目|单元|篇|讲|部分)|(项目|单元|课题|模块)\\s*([0-9]{1,2}|[一二三四五六七八九十]{1,3}))\\s*[、.:：．]?\\s*(.*)$');
/* 一行像不像小节标题：「1.1 按钮开关」「3.2.1 安装工艺」「## 3.1 按钮开关」。 */
const HXIMP_H_SEC = new RegExp(HXIMP_MD + '(\\d{1,2})[.．](\\d{1,2})(?:[.．](\\d{1,2}))?\\s*[、.:：．]?\\s*(.{0,40})$');

/* 洗标题：合并空白、去掉句首标点，**也去掉 Markdown 的 `#` / `>` 前缀** ——
   不然「## 项目3」会原样存进 toc.title，界面上就是一堆井号。 */
const tocClean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').replace(/^[、.:：．\-—\s#>]+/, '').trim();

/* 从标题里抠真实章节号：「项目3 …」「第3章 …」「项目 三 …」「3.1 …」「任务3-1 …」。
   为什么不能用「出现顺序」：单册资料（只有「项目3」一本）会被编成第 1 章，
   老师按第 3 章筛就一道也筛不到 —— 这是 2026-11-20 实测的坑。
   认不出返回 0（调用方自己决定要不要按顺序兜底）。 */
function tocChOf(s) {
  const t = String(s == null ? '' : s).replace(/^[#>\s]+/, '').trim();
  let m;
  if ((m = t.match(/第\s*([0-9]{1,2}|[一二三四五六七八九十]{1,3})\s*(?:章|项目|单元|篇|讲|部分)/))) return tocNum(m[1]);
  if ((m = t.match(/^(?:项目|单元|课题|模块)\s*([0-9]{1,2}|[一二三四五六七八九十]{1,3})/))) return tocNum(m[1]);
  if ((m = t.match(/^(\d{1,2})\s*[.．]\s*\d{1,2}/))) return +m[1];
  if ((m = t.match(/^任务\s*(\d{1,2})\s*[-–]/))) return +m[1];
  return 0;
}

/* 正则兜底：只靠标题行拼最小目录。ch 取标题里的真实编号（认不出才按出现顺序补）。 */
function tocFromText(text) {
  const out = [];
  let cur = null;
  for (const line of String(text || '').replace(/\r/g, '').split('\n')) {
    /* 2026-11-20：正则跑在**原始行**上，不跑 tocClean 之后的结果 ——
       tocClean 会把行首的 `- ` 一起吃掉，「- 项目3 建议 18 学时」就变成「项目3 …」被当成章。
       原始行上 `-` / `*` 不在 HXIMP_MD 里，匹配不到，正是要的效果。 */
    const raw = String(line).replace(/\s+/g, ' ').trim();
    if (!raw || raw.length > 64) continue;
    const s = tocClean(raw);
    if (!s) continue;
    let m = raw.match(HXIMP_H_CH);
    if (m) {
      /* 章标题用整行（「项目一 常用低压电器」「第1章 概述」都保留原文编号，题池里好核对），
         只把后面带的小节号部分留给下面 HXIMP_H_SEC 认。 */
      const title = s.slice(0, 60);
      if (!title) continue;
      /* 2026-11-20：号取标题里的真实编号（「项目3」→ 3），不再按出现顺序重编 ——
         单册资料只有一本「项目3」，重编会把它变成第 1 章，老师按第 3 章筛就一道都筛不到。 */
      const n = tocChOf(title) || (out.length + 1);
      /* 同一个号已经出现过（原文里标题重复一行、或兜底正好撞号）→ 并进去，别生成两个「第3章」 */
      const hit = out.find(c => c.ch === n);
      if (hit) { cur = hit; continue; }
      cur = { ch: n, title: title || ('第 ' + n + ' 章'), secs: [] };
      out.push(cur);
      continue;
    }
    m = raw.match(HXIMP_H_SEC);
    if (m) {
      const no = m[1] + '.' + m[2] + (m[3] ? '.' + m[3] : '');
      const title = tocClean(m[4]).slice(0, 60);
      /* 「1.5 倍」「1.2 米」这种是正文里的数字，不是小节标题：没有文字标题的一律不当标题 */
      if (!title || /^\d/.test(title)) continue;
      if (!cur) {
        /* 只有小节没大章标题的资料：章号也取小节号的前半段（「3.1」→ 第 3 章），同样不重编 */
        const base = tocChOf(no) || (out.length + 1);
        cur = { ch: base, title: '第 ' + base + ' 章', secs: [] };
        out.push(cur);
      }
      if (!cur.secs.some(x => x.no === no)) cur.secs.push({ no, title, kn: [] });
    }
  }
  return out;
}

/* 给模型看的材料：开头 2600 字 + 全文里像标题的行（书正文太占额度，标题行才带结构）。 */
function tocDigest(text) {
  const t = String(text || '').replace(/\r/g, '');
  const head = t.slice(0, HXIMP_TOC_HEAD);
  const picked = [];
  for (const line of t.split('\n')) {
    if (picked.length >= HXIMP_TOC_LINES) break;
    const s = tocClean(line);
    if (!s || s.length > 60) continue;
    if (HXIMP_H_CH.test(s) || HXIMP_H_SEC.test(s)) picked.push(s);
  }
  return (head + '\n……（以下是全文里像标题的行）……\n' + picked.join('\n')).slice(0, HXIMP_TOC_CHARS);
}

function tocPrompt(digest) {
  return '下面是一本教材的开头部分，以及全文里「像标题」的行。请整理出它的目录结构，只输出 JSON：\n'
    + '{"toc":[{"ch":1,"title":"项目一 常用低压电器","secs":[{"no":"1.1","title":"按钮开关","kn":["按钮的结构","常开常闭触点"]}]}]}\n'
    + '要求：\n'
    + '1. ch 写大章**真实编号**（「项目三」写 3、「第 5 章」写 5；原文本来没编号才按出现顺序写）；title 写大章原标题，**逐字照抄**；\n'
    + '   ⚠️ title 绝对不许概括、不许截短、不许把小节名提到大章标题上 —— 原文是「项目 3 单片机并行 I/O 端口的应用」\n'
    + '   就照原样写（连空格和标点一起），不要写成「并行IO端口与C51语言」；原文是「项目 2 学习单片机硬件系统」\n'
    + '   就不要漏掉「学习」。老师要靠这个标题认章节（第 3 章 = 流水灯那一章），改写了就对不上教材。\n'
    + '2. sec.no 用 1.1 / 1.2 这种编号（三级就 1.1.1），title 写小节原标题，同样**逐字照抄**；\n'
    + '3. 每节给 1～3 个知识点短标签（kn，每个不超过 12 个字，必须来自原文，不要编）；\n'
    + '4. 原文没有明确的章节结构（只是一篇讲义、一页说明、一张表）就返回 {"toc":[]}，不要硬凑、不要编章节；\n'
    + '5. 只输出 JSON 对象，不要解释文字。\n'
    + '材料：\n' + String(digest || '');
}

/* 规整模型给的目录：ch 取标题里的真实编号（「项目3」→ 3），认不出才按出现顺序补 ——
   不信模型自己编的号，但更不能把它重编成连续的（那正是「项目3 变第1章」的元凶）。
   sec.no 不合法就给「ch.序号」，kn 去重、最多 3 个、每个最多 16 字。 */
function parseToc(raw) {
  const arr = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.toc) ? raw.toc : null);
  if (!arr) return [];
  const out = [];
  arr.forEach(c => {
    const title = tocClean(c && (c.title || c.name || c.ch_title)).slice(0, 60);
    /* 2026-11-20：原来这里是 `out.length + 1`，末尾还有一句 `out.forEach(c => c.ch = i+1)` 强制连续化。
       两句一起把「项目3」压成第 1 章 —— 单册资料（老师一次只勾一本）必然踩到。
       删掉之后允许跳号：缺号只是那个章桶不存在，不会崩。
       复核过：考试/src/paper.js 按 Object.keys(curCH()) 求和、ui-paper.js 只遍历题池里出现过的章。 */
    const ch = tocChOf(title) || (out.length + 1);
    const secsIn = Array.isArray(c && c.secs) ? c.secs : (Array.isArray(c && c.sections) ? c.sections : []);
    const secs = [];
    secsIn.forEach((s, k) => {
      const st = tocClean(s && (s.title || s.name || s.sec_title)).slice(0, 60);
      const noRaw = String((s && (s.no || s.sec || s.id)) || '').trim();
      const no = /^\d{1,2}(\.\d{1,2}){0,2}$/.test(noRaw) ? noRaw : (ch + '.' + (k + 1));
      const kn = (Array.isArray(s && s.kn) ? s.kn : (Array.isArray(s && s.knowledge) ? s.knowledge : []))
        .map(x => tocClean(x).slice(0, 16)).filter(Boolean);
      if (!st && !kn.length) return;
      if (secs.some(x => x.no === no)) return;
      secs.push({ no, title: st, kn: [...new Set(kn)].slice(0, 3) });
    });
    if (!title && !secs.length) return;
    /* 同一个章号出现两次（模型把一章拆成两段）→ 并进已有那章，别出两个「第3章」 */
    const hit = out.find(x => x.ch === ch);
    if (hit) {
      if (!hit.title && title) hit.title = title;
      for (const s of secs) if (!hit.secs.some(x => x.no === s.no)) hit.secs.push(s);
      return;
    }
    out.push({ ch, title: title || ('第 ' + ch + ' 章'), secs });
  });
  return out;
}

/* 抽目录：先 AI（一次、只喂 digest），抽不出来或超时就走正则兜底。
   **永远不抛**——目录只是锦上添花，不能因为它挡住导入。 */
async function buildToc(text, opts) {
  const o = opts || {};
  const src = String(text || '');
  if (!src.trim()) return [];
  let timer = null;
  try {
    const ask = hximpChat([
      { role: 'system', content: '你是教材结构整理助手。只返回合法 JSON。' },
      { role: 'user', content: tocPrompt(tocDigest(src)) }
    ], { json: true, thinkLevel: o.thinkLevel || 'quick' });
    const resp = await Promise.race([ask, new Promise((_, rej) => {
      timer = setTimeout(() => rej(new Error('目录识别超时')), Math.max(4000, +o.timeout || HXIMP_TOC_TIMEOUT));
    })]);
    const toc = parseToc(parseJson(String(resp == null ? '' : resp)));
    if (toc.length) return toc;
  } catch (e) {
    /* AI 挂了 / 返回垃圾 / 超时 —— 都落到下面的正则兜底，不往上报错 */
  } finally { if (timer) clearTimeout(timer); }
  return tocFromText(src);
}

/* 切块 → 每块的章节归属。规则：
     ① 对每块 body 数「节标题文本」出现的次数（标题太短就数「no + 标题」），
        命中哪节最多就归哪节（一块跨节很正常）；
     ② 一块一次都没命中：沿用上一块的章节（文档是顺序的）；
     ③ 第一块就没命中：留空（null），不瞎猜。 */
function chunkMeta(pieces, toc) {
  const list = [];
  (Array.isArray(toc) ? toc : []).forEach(c => {
    (c.secs || []).forEach(s => {
      const st = tocClean(s && s.title);
      list.push({
        ch: +c.ch || 0, chTitle: tocClean(c.title),
        sec: String((s && s.no) || ''), secTitle: st, kn: (s && s.kn) || [],
        needle: st.length >= 3 ? st : ((s && s.no ? s.no + ' ' : '') + st).trim()
      });
    });
  });
  const EMPTY = () => ({ ch: null, chTitle: '', sec: null, secTitle: '', kn: [] });
  if (!list.length) return (Array.isArray(pieces) ? pieces : []).map(EMPTY);
  const countOf = (hay, needle) => {
    if (!needle || needle.length < 2) return 0;
    let n = 0, at = 0;
    while ((at = hay.indexOf(needle, at)) >= 0) { n++; at += needle.length; }
    return n;
  };
  let prev = null;
  const pick = k => ({ ch: k.ch, chTitle: k.chTitle, sec: k.sec, secTitle: k.secTitle, kn: k.kn });
  return (Array.isArray(pieces) ? pieces : []).map(body => {
    const b = String(body == null ? '' : body);
    let best = null, bestN = 0;
    for (const k of list) {
      const n = countOf(b, k.needle);
      if (n > bestN) { bestN = n; best = k; }    // 打平取先出现的（书的顺序）
    }
    if (best) { prev = best; return pick(best); }
    return prev ? pick(prev) : EMPTY();
  });
}

function practSub(n) {
