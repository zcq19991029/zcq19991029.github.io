/* 实操题的特殊口径（2026-11-21，老师原话）：
     「实操题没有标准答案，仅供参考，尤其第二小问实体开发板则是根据现场仿真实际情况打分。
      这是单片机这门课的特殊情况；第一小问也是看实际情况，但是可以给个参考示例代码」
   → 三件事：
     ① 答案一律叫「参考要点」，不写「正确答案」「必须」这种口吻 —— 学生怎么写、用仿真还是实物都行；
     ② 第 1 小问配一段**能直接编译的 C51 参考示例代码**，放 code 字段（只出现在参考答案里，
        不上面向学生的卷面），并注明「这只是一种写法」；
     ③ 第 2 小问写**可能的预期现象 + 以现场为准**，不许写死一个结果 ——
        实物板子的接线、器件差异都会让现象不同，真分数是老师现场看着给的。 */
function practiceRule(name, n) {
  const k = practSub(n);
  const head = '「' + name + '」按实操考核出：题干 = 一段任务描述（要做什么、给定什么条件 / 器材 / 端口分配，'
    + '不带教材编号，学生只看题干就能动手）。'
    + '**这类题没有标准答案**：学生怎么写程序、用仿真还是实物都行，只要现象符合题目要求就算对。'
    + '所以 answer 里只写「参考要点」，不要用「正确答案」「必须」这种口吻。';
  const codeRule = '另外给一个 code 字段，放一段**能直接编译的 C51 参考示例代码**'
    + '（`#include <reg51.h>` 开头、完整 main、带关键注释、20 行以内）—— 这只是「一种写法」，允许学生用别的实现。';
  if (k === 1) {
    return head + '**这一批只要 1 个小问**：题干末尾用「要求：……」一句话交代'
      + '要交什么（程序编译通过 / 运行现象），**不要**写成（1）（2）；'
      + 'answer 只给 1 条参考要点（要点 + 可能的预期现象，不写死结果），不要分条；' + codeRule
      + '不要写成「第一步接线、第二步写程序」的流水账，接线和端口分配写进题干的任务描述里。';
  }
  const heads = [];
  for (let i = 1; i <= k; i++) {
    heads.push(PRACTICE_SUB_FIXED[i - 1]
      || '由题目决定具体动作（如测量某点电压、写出某段数据、说明为什么是这个结果），同样要写清产出物；');
  }
  return head
    + '题干末尾必须用「要求：」分行列 **' + k + ' 个小问**，编号（1）（2）…，每个小问单独一行：\n'
    + heads.map((h, i) => '  （' + (i + 1) + '）' + h).join('\n') + '\n'
    + '每个小问都必须「动词开头 + 写清产出物」，不许只丢一个名词（写成「（3）调试」不合格，'
    + '要写成「（3）下载到开发板，记录数码管从 00 加到 09 的现象」）。\n'
    + 'answer **必须恰好 ' + k + ' 条**，与小问一一对应、顺序一致，每条以（1）（2）… 开头：\n'
    + '  （1）第 1 条写参考要点：工程怎么建、关键端口 / 寄存器怎么设、编译要过；'
    + '并注明「示例代码见 code 字段，学生用别的写法同样算对」；\n'
    + '  （2）第 2 条写**可能的预期现象**（举例，比如「P1.1 所接 LED 点亮、其余 7 只熄灭」），'
    + '并明确写「实际以现场仿真 / 下载运行观察到的现象为准」——'
    + '实物开发板的接线、器件差异会让结果不同，**不要写成一个唯一结果**；\n'
    + (k > 2 ? '  （3）第 3 条起按题干的小问逐条写参考要点，同样不下绝对结论；\n' : '')
    + '几条小问就几条答案，不多不少、不合并、不调序。' + codeRule
    + '不要写成「第一步接线、第二步写程序、第三步下载」的流水账，接线和端口分配写进题干的任务描述里。';
}

/* 识图题规则（电气接线专用，老师原话：识图题要配电路图，下面 10 个小问，每个小问问一个具体问题）。

/* 设计题规则（电气接线专用）：让学生画电路图，不是给图让学生认。

const customRule = (name, n, subjectKey) => {

function customSample(k, name, n, subjectKey) {

  /* 参考示例代码（只进参考答案，不上面向学生的卷面）：一种写法而已，不是唯一解 */
  const codeSample = '"code":"#include <reg51.h>\\nvoid main()\\n{\\n    P1 = 0xFD;      /* 1111 1101B：只有 P1.1 输出低电平 */\\n    while (1);      /* 保持这个状态 */\\n}"';

      : i === 2 ? '（2）预期现象：P1.1 所接 LED 点亮、其余 7 只熄灭（若电路是高电平点亮，现象相反）。实际以现场仿真或下载运行观察到的现象为准，与题目要求一致即得分；'
        : '（' + i + '）按题干要求记录该项数据 / 现象，以现场实测为准。');
  }
  return '{"type":"' + key + '","stem":"' + stemBase + '\\n要求：\\n' + req.join('\\n') + '",'
    + '"answer":[' + ans.map(x => '"' + x + '"').join(',') + '],'
    + codeSample + ','
    + '"ch":1,"knowledge":"P1 口位操作与 LED 控制","explanation":"P1.1 输出低电平点亮 LED；0xFD = 11111101B，仅 P1.1 为 0。"}';
}

/* 符号表（2026-11-20）：电气接线这类课的题要带「符号图」——题干或选项里写 fig，
   图由 figlib.js（window.HXFig）现画，和 刷题 用的是同一套符号 id。
   这里把「能用的 id = 中文名」整张表喂给模型，省得它自己编 id（编的会在入池前被丢掉）。
   HXFig 不存在（单独调试 imports.js）就返回空串，整段不进提示词，别让出题因为少个脚本就挂。 */
function figRule() {
  const F = (typeof window !== 'undefined') ? window.HXFig : null;
  if (!F || !Array.isArray(F.list) || !F.list.length || typeof F.figName !== 'function') return '';
  const ckt = [], sym = [];
  try {
    F.list.forEach(k => {
      const nm = String(F.figName(k) || '');
      /* 完整电路图 vs 单个元器件符号：电路图 id 以 ckt 开头，或 figName 里带「电路/原理图/接线图」字样。
         这样出题规则里就能让模型分得清「识图题配整张图」和「选择题引用单个符号」，不用和另一个
         造电路图的子代理约定死具体 id。 */
      const isCkt = /^ckt/i.test(String(k)) || /电路|原理图|接线图/.test(nm);
      (isCkt ? ckt : sym).push(k + '=' + nm);
    });
  } catch (e) { return ''; }
  if (!ckt.length && !sym.length) return '';
  return '电气图形符号（只有电气 / 电路类课程才用图；单片机、教资这类理论题一般不用）：\n'
    + '   可用符号只有这些（id=中文名）：\n'
    + (sym.length ? '     · 单个元器件符号：' + sym.join('、') + '\n' : '')
    + (ckt.length ? '     · 完整电路原理图（识图题 / 设计题配整张电路图用，别拿它当单个符号）：' + ckt.join('、') + '\n' : '')
    + '   · 题目涉及单个电气图形符号时（如「图中的符号表示（ ）」「下图是哪种低压电器」），除正常字段外再加一个 "fig":"<符号 id>"，只能用上面列出的 id，不要自己编；\n'
    + '   · 识图题要配**完整电路原理图**时，fig 只能填「完整电路原理图」那一类 id，不能拿单个元器件符号顶一张电路图；\n'
    + '   · 题干要写成「图中的符号……」「识读下图」，让学生知道该看图；\n'
    + '   · 选择题的选项也可以是图：选项对象里加 "fig":"<id>"、text 留空字符串；\n'
    + '   · 用不上图就别写 fig 字段，不要给每道题都硬塞一张图；**给了 fig 才允许题干写「图中」**，'
    + '给不出 fig 就按「不出图题」处理，别写「图 1.23 所示」这种却没有图。\n'
    + '   带图的单选长这样：{"type":"single","stem":"图中的符号表示（ ）","fig":"qf3","options":[{"key":"A","text":"熔断器"},{"key":"B","text":"三极低压断路器"}],"answer":["B"],"ch":1,"knowledge":"低压断路器符号","explanation":"原文依据"}\n';
}

/* ── 「提了图就得有图」+「不许露内部 id」（2026-11-20，老师原话）─────────────
   「判断题怎么可能出带图的呢 而且你说了图几 也没给图啊 这个出题规则加入一般约束
     除非用户有要求 但是如果你题干有图x.x 一定要有相应的图 然后不能直接暴露试卷id」
   截图里的题：「在图 1.23 电路中，发光二极管的阴极接 P1.0 引脚……（  ）」——
   判断题，引用了图号，既没有图，也不该出这种要看图的判断题。所以：
     ① 默认不出要看图的题（除非老师在「针对性要求」里明确要）；
     ② 真引用了图，就必须同一道题里给 fig，给不出就把那句话改成文字描述；
     ③ 题干 / 选项 / 答案里不许出现内部标识（试卷号、题库 id、题目 id、题型 key）。 */
const FIG_REF_RE = /图\s*\d{1,3}\s*[-.．－]\s*\d{1,3}|如图|下图|见图|上图/;

const FIG_RULE = '默认**不出需要看图的题**：除非老师的「针对性要求」明确要图题，题干里不要出现「如图」「下图」「图 1.23」「图2-11」这类引用；判断题、名词解释、简答题默认不配图。'
  + '确实要引用图时（老师要求了，或这道题非图不可），**必须在同一道题里输出 fig 字段**（只能用符号表里列出的 id；没有符号表就别出图题）；'
  + '给不出 fig 就把那句话改成文字描述（例如「在共阳极 LED 接 P1.0 的电路中，……」），**绝不允许题干留着「图1.23」却没有图**。';

const ID_RULE = '题干、选项里**不许出现任何内部标识**：试卷号、题库 id、题目 id（如 Q123、QM25-2t30）、题型 key（如 shicao）；题干开头也不要留「(1)」这种纯编号。'
  + '（程序分析题的 answer 按小问写（1）（2）（3）不受此限。）';

/* fig 值认不认：有符号库就问 HXFig.hasFig，没有符号库（单独调试 imports.js）就不判，
   交给 ui-mat 的 MAT_toDb 兜（那边本来就会丢认不出的 id）。 */
function figKnown(id) {
  const s = String(id == null ? '' : id).trim();
  if (!s) return false;
  const F = (typeof window !== 'undefined') ? window.HXFig : null;
  if (!F || typeof F.hasFig !== 'function') return true;
  try { return !!F.hasFig(s); } catch (e) { return true; }
}

/* 一道题里出现的「图引用」原文（题干 + 选项文字）。没有引用返回空串。 */
function figRefOf(stem, options) {
  const txt = String(stem || '') + ' ' + (Array.isArray(options) ? options.map(o => String((o && o.text) || '')).join(' ') : '');
  const m = txt.match(FIG_REF_RE);
  return m ? m[0].replace(/\s+/g, '') : '';
}

/* 题干必须独立成题（2026-11-20，老师原话）：
   「不存在写任务1.1这样的题干 那是我们出题参考 而我们需要的是独立题干 正式一点」
   AI 把教材原文里的「任务 1.1」「任务 1.1 变式」直接抄进了题干 —— 学生只看题干根本不知道
   在说什么，离开教材就是一道废题。所有题型都吃这一条，所以单独拎出来。 */
const STEM_FREE = '题干必须独立成题：不许出现「任务1.1」「例1-1」「习题3-2」「如图1.3」「第3章」'
  + '这类教材里的编号或坐标，也不许写「本任务」「如上例」。把背景交代清楚，学生只看题干就能作答；'
  + '需要引用原文时把内容复述进题干，而不是给编号。';

function genPrompt(o) {
  const names = o.typeNames || {};
  const list = Object.entries(o.counts || {}).filter(([, n]) => n > 0);
  const parts = list.map(([t, n]) => (TYPE_LABEL[t] || names[t] || t) + ' ' + n + ' 道').join('、');
  const rules = list.map(([t]) => TYPE_RULE[t] || customRule(names[t] || t, o.subCount, o.subjectKey)).join('\n   ');
  const samples = list.map(([t]) => '  ' + (TYPE_SAMPLE[t] || customSample(t, names[t] || t, o.subCount, o.subjectKey))).join(',\n');
  /* 有符号库才插「符号图」这一条；编号统一在下面按数组下标生成，插一条不会错号。 */
  const figBody = figRule();
  /* 2026-11-20：这一段属于哪一章由**导入时的目录**定（chunkMeta 打好的标），不再让模型猜。
     hasCh = 这块切块在导入时归到了某章；没有（老资料、没目录）就退回老口径让模型自己认。 */
  const hasCh = !!(o.ch && +o.ch > 0);
  const chTitle = tocClean(o.chTitle);
  const secTitle = tocClean(o.secTitle);
  const whereLine = hasCh
    ? '这一段的章节是：第 ' + (+o.ch) + ' 章' + (chTitle ? '「' + chTitle + '」' : '')
      + (o.sec ? '，第 ' + o.sec + ' 节' + (secTitle ? '「' + secTitle + '」' : '') : '') + '。\n'
      + ((Array.isArray(o.kn) && o.kn.length)
        ? '这一节的知识点候选（knowledge 优先从里面挑一个照抄，都不合适再自己按原文概括）：'
          + o.kn.filter(Boolean).join(' / ') + '\n'
        : '')
    : '';
  const chRule = hasCh
    ? '每道题都要输出章节字段，**直接照抄上面给的那一段的章节，不要自己判断、不要改**：ch 填 ' + (+o.ch)
      + (o.sec
        ? '，sec 填 "' + o.sec + '"' + (secTitle ? '，secTitle 填 "' + secTitle + '"' : '')
        : '') + '。'
    : '每道题都要输出一个 ch 字段：这道题出自原文第几章/第几个项目（只填数字，如第 3 章写 3、项目 4 写 4）；原文里认不出属于哪一章就写 0。';
  /* 硬要求按数组排，编号由下标 + 1 生成 —— 以后加一条不用手改 6 / 7。 */
  const hard = [
    '每道题都必须能在原文找到依据；原文没写的不出，不编型号、参数、页码。',
    rules,
    STEM_FREE,
    '答案唯一、没有歧义；explanation 写一句依据（引用原文要点）。',
    FIG_RULE,
    ID_RULE,
    '每道题都要输出一个 knowledge 字段：一句话知识点（不超过 20 个字），能当筛选标签用，必须是原文里讲到的考点（例如「定时器工作方式 2 的选择」「并行 I/O 端口方向寄存器」）。',
    chRule
  ];
  if (figBody) hard.push(figBody);
  /* 2026-11-20：**删掉「章节」和「范围」两个独立输入**（老师原话「这两个范围混乱，我直接融合到
     针对性提示词得了，全部靠口述，自由度对话决定」）。以前有一段「范围：X / 严格按这个范围出题」
     和一段「这批题统一标章节号 N」，和老师的「针对性要求」各说各的，互相打脸 ——
     现在范围/章节一律由老师在「针对性要求」里用自己的话讲，原样拼进提示词（就是下面的 extra），
     不再由程序另起一段规定范围。ch 字段（2026-11-20 起）优先继承导入时做好的目录 ——
     下面 whereLine 只在 chunkMeta 给出 ch 时才出现；没有目录的老资料仍按老口径让模型自己认。
     批量出题（一次要 30 道以上）时，模型输出会被长度上限截断、少给几道 —— 下面 batch / avoid
     两段就是为分批服务的：告诉它是第几批、以及哪些题干已经出过，别重复。 */
  const batchLine = (o.batch && o.batch.m > 1)
    ? '分批说明：这一轮要出的题比较多，分 ' + o.batch.m + ' 批要；**这是第 ' + o.batch.k + ' 批**，'
      + '这一批只出上面写的那 ' + (list.reduce((a, [, n]) => a + n, 0)) + ' 道，不要多出、也不要少出。\n'
    : '';
  const avoid = Array.isArray(o.avoid) ? o.avoid.filter(Boolean) : [];
  const avoidLine = avoid.length
    ? '以下题干前几批已经出过，**这一批不要重复**（换考点、换问法）：\n'
      + avoid.map(x => '  · ' + x).join('\n') + '\n'
    : '';
  return '你是「' + o.subjectName + '」课程的出题老师。请根据下面的资料出题。\n'
    + '难度：' + (o.level || '中等') + '\n'
    + '这一轮要出：' + parts + '\n'
    + (o.extra ? '老师的针对性要求（原样遵循，包括范围/章节/题型偏好，**它优先于其它一切说明**）：\n' + o.extra + '\n' : '')
    + batchLine
    + avoidLine
    + whereLine
    + '硬要求：\n'
    + hard.map((t, i) => (i + 1) + '. ' + t).join('\n') + '\n'
    + (hard.length + 1) + '. 只输出 JSON 对象，不要任何解释文字：\n'
    + '{"questions":[\n  ' + samples + '\n]}' + (o.note ? '\n' + o.note : '')
    + '\n资料原文：\n' + o.piece;
}

/* 出题：教材、讲义这类没有现成题目的资料，按老师的范围/题型/数量/难度/额外要求让 AI 出题。
   数量按段分摊（老师说的是“整份资料一共几道”），一段没分到题就不白花 token。 */
async function aiGenerate(text, subject, subjectName, opts, onProgress) {
  opts = opts || {};
  if (!String(text || '').trim()) throw new Error('请先勾选资料，或在「针对性要求」里写下要出题的内容。');
  /* 2026-11-19：原来这里只遍历 SUPPORTED（六个内置题型），老师自建的题型会被静默丢掉，
     表现是「出题成功但一道都没进题池」。现在把 opts.customKeys 一起纳入。 */
  const customKeys = Array.isArray(opts.customKeys) ? opts.customKeys : [];
  const allowed = [...SUPPORTED, ...customKeys];
  const wanted = {};
  for (const t of allowed) {
    /* 2026-11-20：上限原来写死 50（老师填 60、实际只出 50，就是因为这里和 UI 各有一道
       Math.min(50)）。现在放到 200，真正的限制交给下面的分批：单次要太多模型会截断。 */
    const n = Math.max(0, Math.min(200, Math.round(+((opts.types || {})[t]) || 0)));
    if (n) wanted[t] = n;
  }
  if (!Object.keys(wanted).length) throw new Error('请至少填一种题型的数量（大于 0）。');
  const pieces = chunks(text, 6000, 300);
  /* 2026-11-20：目录由调用方（ui-mat 从 hx_exam_material.toc 拿）传进来；没传就整段不动，
     行为和以前完全一样（老资料没有 toc，模型照旧自己认 ch）。
     pieces 仍保持「纯字符串数组」—— 元信息放在并行的 metas 里，现有 chunks() 调用点不用改。 */
  const toc = Array.isArray(opts.toc) ? opts.toc : [];
  const metas = toc.length ? chunkMeta(pieces, toc) : [];
  /* 先把总题量摊到各段（老师说的是「整份资料一共几道」），再在段内按 SEED_BATCH 拆批：
     一次请求要 40 道以上，模型的输出很容易被长度上限截断 —— 少了还只是少几道，
     截断成半截 JSON 就直接报错（AI 查重那边踩过一次，position 15366）。 */
  const SEED_BATCH = 24;
  const plan = pieces.map(() => ({}));
  for (const [t, n] of Object.entries(wanted)) {
    const base = Math.floor(n / pieces.length), rem = n % pieces.length;
    pieces.forEach((_, i) => { const c = base + (i < rem ? 1 : 0); if (c) plan[i][t] = c; });
  }
  const collected = [], rejected = [];
  const seen = new Set();
  /* normalizeQuestions 出来的是 stem（MAT_toDb 也是读 stem），别写成 q.q —— 
     写错的话所有题的去重键都变成「类型|空」，第二批开始会被当成重复全丢掉。 */
  const keyOf = q => String(q.t || '') + '|' + String(q.stem || q.q || '').replace(/\s+/g, '').toLowerCase();
  let anyPiece = false;
  for (let i = 0; i < pieces.length; i++) {
    const counts = plan[i];
    /* 这一块在导入时被归到哪一章（metas 为空 = 没有目录的老资料，m 就是 null） */
    const m = metas[i] || null;
    for (const [t, n] of Object.entries(counts)) {
      const rounds = Math.max(1, Math.ceil(n / SEED_BATCH));
      let left = n;
      /* rounds+2：模型偶尔少给一两道，多给一次机会补齐；再补不齐就按实际数量入池（不骗老师） */
      for (let r = 0; r < rounds + 2 && left > 0; r++) {
        anyPiece = true;
        const take = Math.min(SEED_BATCH, left);
        const tail = rounds > 1 ? '（第 ' + Math.min(r + 1, rounds) + ' / ' + rounds + ' 批，还差 ' + left + ' 道）' : '';
        if (onProgress) onProgress('正在根据第 ' + (i + 1) + ' / ' + pieces.length + ' 段出题' + tail + '，已出 ' + collected.length + ' 题…', collected);
        try {
          /* note：资料太长被切成多块时，明确告诉模型「这是第几块」——
             勾「原文件」整份原文出题时尤其需要，不然它会把每一块都当成完整的一本书。 */
          const prompt = genPrompt({
            subjectName, subjectKey: subject, piece: pieces[i], level: opts.level, counts: { [t]: take },
            extra: opts.extra, typeNames: opts.typeNames,
            /* 小问数（2026-11-20）：只对自建题型（实操这类）有意义，其它题型用不到就传 undefined */
            subCount: opts.subCount,
            /* 2026-11-20：块级的章节（导入时打好的标），有就让模型照抄，别再自己猜 */
            ch: m && m.ch, chTitle: m && m.chTitle,
            sec: m && m.sec, secTitle: m && m.secTitle, kn: m && m.kn,
            batch: rounds > 1 ? { k: r + 1, m: rounds } : null,
            /* 第 2 批起带上「已经出过的题干」，否则模型会把同一批题换个说法再出一次 */
            avoid: r > 0 ? collected.slice(-30).map(q => String(q.stem || q.q || '').slice(0, 42)) : null,
            note: pieces.length > 1 ? '（这是资料原文的第 ' + (i + 1) + ' / ' + pieces.length + ' 块，按原文顺序切开的；只就这一块出题，不要凭空补别的内容。）' : ''
          });
          /* 调试口（2026-11-19）：把这一块真正的提示词挂到 window.__lastPrompt，
             自测和排查「到底喂了什么给模型」时在控制台直接看，不 toast 打扰老师。 */
          try { if (typeof window !== 'undefined') window.__lastPrompt = prompt; } catch (e) { }
          const response = await hximpChat([{ role: 'system', content: '你是严谨的职业院校出题老师。只返回合法 JSON。' }, { role: 'user', content: prompt }], { json: true, thinkLevel: opts.thinkLevel });
          const result = normalizeQuestions(parseJson(response), subject, customKeys);
          /* 2026-11-20：把块的章节塞进每道题（__ 前缀 = 内部字段，不进题池 JSON）。
             MAT_toDb 优先用它，模型自己写的 ch 只在没有块信息时兜底 —— 这样「AI 猜错章」
             不会再污染题池的 ch，按章组卷也就抽得到了。 */
          if (m && m.ch) {
            for (const q of result.questions) { q.__ch = m.ch; q.__sec = m.sec || null; q.__secTitle = m.secTitle || null; }
          }
          let fresh = 0;
          for (const q of result.questions) {
            const k = keyOf(q);
            if (seen.has(k)) { rejected.push({ ...q, why: '与前面出过的题重复，已跳过' }); continue; }
            seen.add(k); collected.push(q); fresh++; left--;
          }
          rejected.push(...result.rejected);
          /* 这一批一道新的都没给（模型只是在重复）→ 不再空转，剩下的按实际数量收场 */
          if (!fresh) break;
        } catch (error) {
          error.partialQuestions = collected;
          error.partialRejected = rejected;
          if (onProgress) onProgress('中断了：' + error.message, collected);
          throw error;
        }
      }
    }
  }
  if (!anyPiece) throw new Error('资料太短，没凑够一段。多贴一些文字再试。');
  return { questions: collected, rejected };
}

/* 识题：把资料里现成的题原样抠出来（不编题）。资料库里暂时没入口，留给“导入现成试卷”那一轮。 */
async function aiImport(text, subject, onProgress) {
  if (!String(text || '').trim()) throw new Error('请先选择文件或粘贴资料。');
  const pieces = chunks(text);
  const collected = [], rejected = [];
  for (let i = 0; i < pieces.length; i++) {
    if (onProgress) onProgress('正在识别第 ' + (i + 1) + ' / ' + pieces.length + ' 段，已提取 ' + collected.length + ' 题…', collected);
    const response = await hximpChat([
      { role: 'system', content: '你是严谨的试题结构化助手。只返回合法 JSON。' },
      { role: 'user', content: '从下面的资料里把已有的题原样抠出来，不要自己编题。只输出 JSON：{"questions":[...]}\n资料：\n' + pieces[i] }
    ]);
    const r = normalizeQuestions(parseJson(response), subject);
    collected.push(...r.questions); rejected.push(...r.rejected);
  }
  return { questions: collected, rejected };
}

  buildToc, tocFromText, parseToc, chunkMeta, tocDigest, tocNum,

  // 2026-11-20 补：profile（整套配置，含原始 model id）、pageRange（页码范围收口）、noVisionRe（读不了图的模型名）
  wantVision, textPages: hximpTextPages, modelName: hxImpModel, humanErr: hxImpHumanErr,

;
/* 由 资料库工具/tools/gen-figlib.cjs 生成，不要手改。

   对外：window.HXFig = { hasFig, figName, figSvg, list } */
window.HXFig = (function () {
// 华夏工具 · 刷题：电气图形符号（按 GB/T 4728 画法，代码绘制）。题目里用 fig: '名字' 引用（题干 q.fig、选项 o.fig），只认这里有的名字，不接收外部 SVG。
/* ── 2026-11-20 重画：触点几何对齐教材 2.1–2.6 的原理图（接线仿真 src/parts.js 的 symbol()）──
   用户原话：「按教材 2.1~2.6 的标准画」。
   老版把开距压成 26…54、刀片只斜出 8px，缺口又短又陡，看着像「画歪的一小段横线」；
   第一版照抄 parts.js 的绝对坐标（0…80）反而更糊：刀片跨 56px 只偏 17px、夹角 17°，

const rotary = (x, y) => P(`M${x + 4} ${y - 6} H${x} V${y + 6} H${x - 4}`); // 旋转操作（Ƒ 形），组合开关用
/* 延时标记（2026-11-20 第三次修正，照教材 + 仿真 2.5 实拍）：
   教材画的是「一个半圆 + 一段短横线」，不是老版那「两条平行线 + 弧」——
   后者在 64px 的选项图里会糊成一个小三角，学生根本分不出通电 / 断电。

   半圆竖直直径大约在刀片左侧 9px 处，短横线从半圆向右拉到刀片跟前（差 2px 不接触）。
   上一版把短横线画成 7px 悬空的一段，半圆又不靠近刀片，看着就是个飘着的括号。
   通电延时：半圆开口朝触点（弧背朝外）；断电延时：开口朝外 —— 只有这一点不同，

/* ---------------- Storage ---------------- */
/* 上传超时口径（2026-11-15）：
   · MAT_PUT_STALL = 120 秒「没有任何一次进度事件」→ 判定卡死，abort 并报错（用户要求的 120 秒）；
   · MAT_PUT_HARD  = 15 分钟总时长兜底 → 防止「每秒都挤一点、永远传不完」把界面挂死。
   用 XHR 不用 fetch：fetch 在浏览器里拿不到上传字节进度，也永远不超时；
   XHR 的 upload.onprogress 是唯一能报「已传 / 总量」的原生通道。 */
const MAT_PUT_STALL = 120000, MAT_PUT_HARD = 900000;
function MAT_path(ext) {
  const uid = sess && sess.user && sess.user.id;
  if (!uid) throw new Error('登录过期了，请在首页重新登录');
  return uid + '/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7) + (ext || '');
}
/* 传原文件到 Storage 私有桶。onProgress(已传字节, 总字节) 可选。
   2026-11-15 用户报上传卡死后的重写：
     ① 原来这里是裸 fetch()，没有超时、没有中断、没有进度 —— 20.4MB 传不动时界面就只剩
        一句「上传原文件…」永远不动，用户分不清「正在传」和「已经死了」。这是真正的卡点。
     ② 现在三重保险：真实字节进度 + 120 秒无进展看门狗 + 15 分钟总时长兜底；
        任何非 2xx 都把 Storage 返回的原文（如 413 超限 / 401 过期）点名抛出来。 */
function MAT_put(path, blob, mime, onProgress) {
  load();
  if (!sess || !sess.access_token) return Promise.reject(new Error('登录过期了，请在首页重新登录'));
  const total = (blob && blob.size) || 0;
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    let done = false, stallT = 0, hardT = 0, loaded = 0;
    const finish = err => {
      if (done) return;
      done = true; clearTimeout(stallT); clearTimeout(hardT);
      if (err) reject(err); else resolve();
    };
    const stop = err => { finish(err); try { xhr.abort(); } catch (e) { } };   // 先落定再 abort，避免 onabort 覆盖真实原因
    const arm = () => {           // 每收到一次进度事件就重新上弦；静默满 120 秒 = 卡死
      clearTimeout(stallT);
      stallT = setTimeout(() => stop(new Error('传输卡住：' + (MAT_PUT_STALL / 1000) + ' 秒没有任何进展（已传 ' + MAT_kb(loaded) + ' / ' + MAT_kb(total) + '），已自动中止。请检查网络后重传')), MAT_PUT_STALL);
    };
    hardT = setTimeout(() => stop(new Error('上传超时：' + (MAT_PUT_HARD / 60000) + ' 分钟还没传完（已传 ' + MAT_kb(loaded) + ' / ' + MAT_kb(total) + '）。文件太大或网络太慢，换网 / 压缩后再传')), MAT_PUT_HARD);
    try {
      xhr.open('POST', HXB + '/storage/v1/object/' + MAT_BUCKET + '/' + path, true);
      xhr.setRequestHeader('apikey', HXK);
      xhr.setRequestHeader('Authorization', 'Bearer ' + sess.access_token);
      xhr.setRequestHeader('Content-Type', mime || 'application/octet-stream');
      xhr.setRequestHeader('x-upsert', 'true');
      xhr.upload.onprogress = e => {
        loaded = e.loaded || 0;
        arm();
        if (onProgress) { try { onProgress(loaded, e.lengthComputable ? e.total : total); } catch (err) { } }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) return finish();
        const raw = String(xhr.responseText || '');
        let msg = raw;
        try { const j = JSON.parse(raw); msg = j.message || j.error || raw; } catch (e) { }
        // 常见拒绝原因直接翻译成人话，省得老师看到一串 JSON 不知道找谁
        const hint = xhr.status === 413 ? '（文件超过 Storage 桶的大小上限，需要在 Supabase 后台调 bucket 限制）'
          : (xhr.status === 401 || xhr.status === 403) ? '（登录过期或这个账号没有写入权限）'
            : '';
        finish(new Error('Storage HTTP ' + xhr.status + (msg ? '：' + String(msg).slice(0, 160) : '') + hint));
      };
      xhr.onerror = () => finish(new Error('连不上服务器（网络断了或被浏览器拦了），请检查网络后重传'));
      xhr.ontimeout = () => finish(new Error('上传超时，已中止'));
      xhr.onabort = () => finish(new Error('上传被中止（网络或浏览器中断）'));
      arm();
      xhr.send(blob);
    } catch (e) { finish(new Error('上传起不来：' + (e && e.message ? e.message : e))); }
  });
}
// 删文件「尽力而为」：表里那条已经删了，文件删不掉最多占点空间
// 2026-11-15：顺手给它也加个 15 秒上限 —— 同一个坑（裸 fetch 永不回包）会让「删除」在
// 「已删表、删文件」这一步卡住，列表永远不刷新。
async function MAT_rm(path) {
  if (!path || !sess || !sess.access_token) return;
  const ac = typeof AbortController === 'function' ? new AbortController() : null;
  const tid = ac ? setTimeout(() => ac.abort(), 15000) : 0;
  try {
    await fetch(HXB + '/storage/v1/object/' + MAT_BUCKET + '/' + String(path).replace(/^\/+/, ''), {
      method: 'DELETE', headers: { apikey: HXK, Authorization: 'Bearer ' + sess.access_token }, signal: ac ? ac.signal : undefined
    });
  } catch (e) { /* 忽略 */ }
  finally { clearTimeout(tid); }
}

const MAT_kb = n => { n = +n || 0; return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B'; };

/* 资料清单（hx_exam_mat_list）是「老师偶尔传一份」的静态数据 → 缓存 5 分钟。
   fresh=true 绕过并作废：老师手动点刷新、传完、删完之后都走这条，改完立刻能看到。
   读失败不写缓存（宁可下次再拉，也别把空列表钉 5 分钟）。 */
async function matReload(fresh) {
  const sid = MAT_sid(); if (sid == null) return;
  if (fresh) cacheDrop('mat:' + sid);
  const hit = fresh ? null : cacheGet('mat:' + sid);
  if (hit) { MAT_LIST = hit; matDrawList(); return; }
  /* 2026-11-15：刷新/删完/传完之后旧列表会被替换，先放占位 —— 否则请求慢时这一块
     完全静止，用户不知道是「在读」还是「点漏了」。
     首次进页面时列表里本来就有加载动效（matHome 里那个），别重复挂第二份。 */
  const lb = $('matList');
  if (lb && !lb.querySelector('[data-fxload]')) { lb.innerHTML = fxLoad('正在读资料…'); if (window.HXLoadFx) HXLoadFx.auto(lb); }
  const r = await MAT_call('hx_exam_mat_list', { p_subject_id: sid });
  if (MAT_sid() !== sid) return;   // 读的过程中切了科目
  if (!r.ok) {
    /* 2026-11-15：这里原来结尾调了一个不存在的 matDrawMats()，读失败会再抛一次
       ReferenceError（错误红条虽然已经写进去了，但控制台多一条没人看得懂的异常）。
       失败就该停在「把原因留在列表位置」，别再重画一遍把红条覆盖成「还没有资料」。 */
    const box = $('matList'); if (box) box.innerHTML = `<div class="errs">${esc(r.err)}</div>`;
    MAT_LIST = []; return;
  }
  MAT_LIST = Array.isArray(r.data) ? r.data : [];
  if (MAT_LIST.length) cacheSet('mat:' + sid, MAT_LIST);
  matDrawList();
}

  try {
    const r = await MAT_call('hx_exam_mat_del', { p_id: id });
    if (!r.ok) { MAT_banner('删除失败：' + r.err); HXBusy.end(tok, r.err); return; }
    /* 只删「云端真的说要删的文件」：新的软删除函数返回空串（意思是行和文件都别动），
       老实现返回 path（硬删除）。这里先取值再判空 —— 不判空就会把回收站里的原件删掉，
       还原回来只剩一条空记录，正是用户报的那个 bug。 */
    const path = typeof r.data === 'string' ? r.data : (r.data && r.data.path);
    if (path) await MAT_rm(path);
    toast('已进回收站');
    const v = $('matView'); if (v) v.innerHTML = '';
    matReload(true); loadSubjects(true);   // 删完同样要绕过缓存
  } finally { HXBusy.end(tok); }
}

/* ---------------- 上传进度（2026-11-15） ----------------
   用户报 20.4MB PDF 停在「上传原文件…」之后再无反馈，分不清是「在传」还是「死了」。
   这里做两件事：
     ① 进度条本身：深色底 + 蓝青流光扫过（纯 CSS 渐变 + 遮罩动画，不引 WebGL、不引库），
        右侧百分比，文案里带「已传 X / 总 Y」；失败 .bad 偏红、完成 .ok 偏绿。
     ② 百分比口径老实交代：只有「上传原文件」这一步能从 XHR 的 upload.onprogress 拿到真实字节；
        读文件 / AI 识图 / 登记 / 写切段浏览器不给任何回调，只能按阶段给区间值。
        所以这是「阶段式进度」，不是假造的精确进度 —— 文案里始终写着当前阶段名，
        并且每秒刷新「已等 N 秒」，让人一眼看出它没死。 */
let MAT_PG_TICK = 0;
function MAT_pg(pct, text, state) {
  const box = $('matProg'); if (!box) return;
  box.hidden = false;
  const cls = 'mat-prog' + (state ? ' ' + state : '');
  if (box.className !== cls) box.className = cls;
  const p = Math.max(0, Math.min(100, Math.round(+pct || 0)));
  const fill = $('matPgFill'), t = $('matPgT'), v = $('matPgV'), bar = $('matPgBar');
  if (fill) fill.style.width = p + '%';
  if (t) t.textContent = text || '';
  if (v) v.textContent = p + '%';
  if (bar) bar.setAttribute('aria-valuenow', p);
}
function MAT_pgRun() {
  MAT_pg(0, '准备上传…');
  const t0 = Date.now();
  clearInterval(MAT_PG_TICK);
  MAT_PG_TICK = setInterval(() => {          // 活着的心跳：只要还在跑，秒数就一直在涨
    const w = $('matPgW'); if (!w) return;
    const s = Math.floor((Date.now() - t0) / 1000);
    w.textContent = s >= 1 ? '已等 ' + s + ' 秒' : '';
  }, 1000);
}
function MAT_pgEnd(ok, text) {
  clearInterval(MAT_PG_TICK); MAT_PG_TICK = 0;
  const w = $('matPgW'); if (w) w.textContent = '';
  MAT_pg(100, text, ok ? 'ok' : 'bad');
}

/* 登记资料。2026-11-20：多带一个 p_toc（导入时做好的目录树）。
   SQL（supabase/2026-11-20-资料目录与分块章节.sql）没跑过时，云端会说
   「p_toc 不存在 / function not found」——这时自动去掉 p_toc 用老签名重试，
   上传不会因为「忘了跑 SQL」整份失败（目录丢了可以重传，资料不能丢）。 */
async function MAT_matSave(body) {
  try {
    return await rpc('hx_exam_mat_save', body, 60000);
  } catch (e) {
    const msg = String((e && e.message) || e || '');
    if (body.p_toc != null && /p_toc|function|not find|does not exist|schema cache|重载|参数/i.test(msg)) {
      const b2 = { ...body }; delete b2.p_toc;
      return await rpc('hx_exam_mat_save', b2, 60000);
    }
    throw e;
  }
}

/* 读一份资料的目录（出题时继承用）。SQL 没跑、或这份资料是改造前传的（toc 为空），
   一律返回 null —— 调用方按「没有目录」处理，行为和以前一样。 */
async function MAT_toc(id) {
  const r = await MAT_call('hx_exam_mat_toc', { p_id: id });
  return (r.ok && Array.isArray(r.data) && r.data.length) ? r.data : null;
}
/* 补出来的目录写回云端（只为「下次不再花一次额度」；失败就算了，不影响出题）。 */
async function MAT_tocSave(id, toc) {
  try { await rpc('hx_exam_mat_toc_set', { p_id: id, p_toc: toc }); } catch (e) { }
}

/* 读上传区那个「只转一部分」输入框 → {from, to} 或 null（=整本）。
   为什么要这么宽松：老师会写 11-189、11～189、11 — 189、「11 到 189」。
   解析不出来就当整本 —— 为一个输入框把整份资料拦下来重填，比多转几页更让人恼火。
   单个数字（如 11）按「从第 11 页到末尾」处理（to=0，由 imports 的 hximpRange 收成末页）。 */
function MAT_PAGE_RANGE() {
  const el = $('matRange'); if (!el) return null;
  const s = String(el.value || '').replace(/\s+/g, '');
  if (!s) return null;
  const m = s.match(/^(\d{1,5})(?:[-~—–－至到](\d{1,5}))?$/);
  if (!m) return null;
  const from = +m[1] || 1;
  const to = m[2] ? +m[2] : 0;
  return { from, to };
}

/* 上传：解析 → 传文件 → 登记 → 写切段。每一步失败都点名是哪一步。
   2026-11-15：「选择文件」按钮在上传全程也挂上 HXBusy（转圈 + 已等 N 秒），
   和下面的 MAT_pg 阶段进度条是两回事 —— 进度条说「做到哪一步」，按钮说「还在忙」。
   选文件的 input 是隐藏的，真正被点的就是这颗按钮，不接住它用户会觉得点了没反应。 */
async function matUpload(files) {
  if (MAT_BUSY) return toast('正在传上一批，等它传完');
  const sid = MAT_sid(); if (sid == null) return;
  const tok = HXBusy.begin($('matPick'), '正在上传…');
  MAT_BUSY = true;
  MAT_pgRun();
  const bad = [], warn = [];
  let okN = 0, segN = 0, tocN = 0;
  /* 页码范围在读文件前就读定：上传中途老师可能切走页面，输入框一没了就会退回「整本」，
     那等于把 314 页全转一遍 —— 一次读定，整批文件都用同一个范围。 */
  const range = MAT_PAGE_RANGE();
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    let step = '读文件';
    /* 总进度 =（已处理完的文件数 + 本文件内部进度）/ 文件数。内部进度的区间：
       读文件 2% → AI 识图 10% → 上传原文件 35%~70%（真实字节）→ 登记 74% → 写切段 84% → 100%。 */
    const pg = (inner, text) => MAT_pg(((i + Math.max(0, Math.min(1, inner))) / files.length) * 100, `（${i + 1}/${files.length}）${f.name}：` + text);
    const say = (s, inner) => { step = s; pg(inner == null ? 0 : inner, s + '…'); };
    try {
      say('读文件', 0.02);
      const got = await HXImp.readMaterial(f);
      let text = String(got.text || '');
      if (got.image) { say('AI 识图', 0.10); text = await HXImp.ocrImages([got.image]); }
      if (got.scannedPdf) {
        /* 扫描 PDF：逐页 AI 识图（Z7/B12，花用户 AI 额度）。每页报一次进度，断在哪页一眼可见。
           2026-11-20：ocrScannedPdf 改成「渲染一页 → 识一页」，回调多一个 stage：
             'render' 正在把这页转成图片 / 'ocr' 已渲染完、正要送模型 / 'done' 这页识完了。
           为什么非得分清：用户 314 页教材那次，报的是「第 314/314 页转成图片」失败 ——
           其实渲染全跑完了，炸的是第 1 页识图（模型配成了文生图）。两句共用一句文案，
           就会把「渲染进度」误读成「失败页号」，老师只会以为书太大转不动。 */
        say('准备逐页 AI 识图', 0.06);
        text = await HXImp.ocrScannedPdf(got.scannedPdf, (k, total, t, stage) => {
          const frac = total ? Math.min(1, k / total) : 0;
          if (stage === 'render') {
            step = '把第 ' + k + '/' + total + ' 页转成图片';
            pg(0.06 + 0.04 * frac, `正在把第 ${k}/${total} 页转成图片（共 ${total} 页，这份是扫描件）`);
          } else if (stage === 'ocr') {
            step = '逐页 AI 识图（第 ' + k + '/' + total + ' 页）';
            pg(0.10 + 0.25 * frac, `正在识图第 ${k}/${total} 页（共 ${total} 页）`);
          } else {
            step = '逐页 AI 识图（第 ' + k + '/' + total + ' 页）';
            pg(0.10 + 0.25 * frac, `逐页 AI 识图 ${k}/${total} 页` + (t ? `（本页识出 ${t.length} 字）` : '（这页没识出字）'));
          }
        }, range);
      }
      text = text.replace(/\r/g, '').trim();
      if (!text) throw new Error('没读到任何文字（可能是空白页或加密文件）');

      /* 目录（2026-11-20，老师原话：「导入材料的时候就把章节小节和其知识点做好」）：
         在切块**之前**抽一次目录 —— 只喂开头 + 标题行，一次调用；AI 失败/超时/返回空
         都会自动回退到正则抽标题，绝不因此挡住导入（buildToc 自己不抛错）。 */
      say('识别目录（章 / 节 / 知识点）', 0.30);
      let toc = [];
      try { toc = await HXImp.buildToc(text); } catch (e) { toc = []; }

      say('上传原文件', 0.35);
      const ext = (f.name.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
      const path = MAT_path(ext);
      // 真实字节进度（XHR upload.onprogress）；0.35~0.70 是上传那一段
      await MAT_put(path, f, f.type, (loaded, total) => {
        const frac = total ? loaded / total : 0;
        pg(0.35 + 0.35 * frac, '上传原文件 ' + MAT_kb(loaded) + ' / ' + MAT_kb(total || f.size));
      });

      say('登记', 0.74);
      const saved = await MAT_matSave({
        p_subject_id: sid, p_name: f.name, p_mime: f.type || '', p_bytes: f.size,
        p_path: path, p_chars: text.length,
        /* 目录随资料一起存（hx_exam_material.toc）。SQL 没跑过时 p_toc 会被拒，
           MAT_matSave 自动退到老签名重试 —— 不会让上传挂在这儿。 */
        ...(toc.length ? { p_toc: toc } : {})
      });
      const mid = saved && saved.id;
      if (!mid) throw new Error('云端没返回资料编号');

      const list = HXImp.chunks(text, 3600, 320);
      const keep = list.slice(0, 400);   // hx_exam_chunk_put 一次最多 400 段
      /* 切块打标：按目录把每块归到某一节（一块跨节取命中最多的、没命中沿用上一块）。 */
      const metas = toc.length ? HXImp.chunkMeta(keep, toc) : [];
      say(`写入 ${keep.length} 段`, 0.84);
      // 切段最多的那份要写 400 段（几百 KB JSON），比普通 rpc 慢，给它 5 分钟
      await rpc('hx_exam_chunk_put', {
        p_material_id: mid,
        p_chunks: keep.map((body, idx) => {
          const m = metas[idx] || {};
          return {
            idx, title: '', body,
            ch: m.ch || null, sec: m.sec || null, sec_title: m.secTitle || null
          };
        })
      }, 300000);
      if (list.length > keep.length) warn.push(f.name + '：太长，只存了前 ' + keep.length + ' 段');
      okN++; segN += keep.length;
      if (toc.length) tocN++;
      pg(1, '完成（' + keep.length + ' 段）');
    } catch (e) {
      /* 2026-11-19：上游报错一律过一遍 HXImp.humanErr —— 老师看到的必须是中文 + 「怎么办」，
         不能再把 "The model is not a VLM…" 这种原文甩出去。模型名按这一步用到的是哪种能力取。
         2026-11-20：多传一个 cap —— 报错要指名「图片识别」这一格，老师照着改的才对
         （用户那次 Model does not exist 就是「图片识别」位填了文生图模型）。 */
      const cap = /识图|图片|转成图片/.test(step) ? 'vision' : 'text';
      bad.push('「' + step + '」失败 —— ' + HXImp.humanErr(e, f.name, HXImp.modelName(cap), cap));
    }
  }
  MAT_BUSY = false;
  const tail = (okN ? `传好 ${okN} 份，切成 ${segN} 段`
    + (tocN ? `（${tocN} 份已做好章 / 节目录）` : '') + '。' : '') + (warn.length ? ' ' + warn.join('；') + '。' : '')
    + (bad.length ? ' 有 ' + bad.length + ' 份没传成：' + bad.join('；') : '');
  MAT_pgEnd(!bad.length, tail);
  HXBusy.end(tok, bad.length ? bad.join('；') : null);   // 有失败就把原因挂到按钮 title，悬停能看到
  if (!bad.length) toast('上传完成');
  await matReload(true);   // 刚传完：绕过缓存，新资料立刻出现在列表里
  loadSubjects(true);      // 科目卡片上的「N 份资料」也跟着变
}

/* ---------------- 「原文件」已删（2026-11-19） ----------------
   用户原话：「原文件没意义啊，删除这个模块。md 本来就是生成完再来手动上传的，
   PDF 本身才是原文件」—— 所以不再有「整份原文出题」的独立勾选，一律按切段出题。 */

/* 把勾中的资料读成文字（老行为：按切段拼）。
   返回 { parts, tag }。 */
async function matCollect(picks, rawSet, state) {
  const parts = [], names = [], empty = [];
  for (let k = 0; k < picks.length; k++) {
    const id = +picks[k];
    const m = MAT_LIST.find(x => +x.id === id) || { id, name: '资料 ' + id };
    if (state) state.textContent = `正在读资料（${k + 1}/${picks.length}）…`;
    const r = await MAT_call('hx_exam_chunk_get', { p_material_id: id });
    if (!r.ok) throw new Error('读《' + (m.name || m.id) + '》的切段失败：' + r.err);
    /* 一律按 idx 排序：接口现在按 idx 返回，但排序是零成本的保险 ——
       顺序错了等于把书的章节打乱喂给模型，出的题会串。 */
    const arr = (Array.isArray(r.data) ? r.data : []).slice().sort((a, b) => (+a.idx || 0) - (+b.idx || 0));
    if (!arr.length) {
      empty.push('《' + (m.name || '资料 ' + id) + '》没有可读文字，先重新解析或改用其它资料');
      continue;
    }
    parts.push('【' + (m.name || ('资料 ' + id)) + '】\n' + arr.map(c => (c.title ? c.title + '\n' : '') + (c.body || '')).join('\n\n'));
    names.push(m.name || ('资料 ' + id));
  }
  if (empty.length) throw new Error(empty.join('；'));
  return { parts, tag: names.join('、') };
}

/* ---------------- AI 出题 ----------------
   2026-11-19 第三轮大改。用户原话：
     「出题就改为单个题型单独出题和选择出题量 加入该题型的题池即可 而不是按整套试卷选数据出题
      反正出试卷那边需要自己选题量和题目 这边只负责根据要求出题到题池即可」
   所以这里不再是「六个题型各填一个数字、一次全出、再人工勾一遍」，而是：
     ① 选**一个**题型 + 填出题量；
     ② 出完**直接入池**（不再停在预览里等老师勾），入池前按「题型 + 题干去空白」硬去重；
     ③ 出完把这一批列出来（只读），想删就去题池里按题型筛出来删。
   为什么不再让老师勾一遍：题库已经有「按题型全选 → 批量删除」了，多一道勾选只是多一次点击；
   而「出了几道、有没有重复被跳过」这些信息仍然完整报出来，不会变黑箱。 */
async function matGenRun() {
  if (MAT_BUSY) return toast('正在忙，等这一步结束');
  const qt = MAT_QT.find(x => x.k === MAT_QK) || MAT_QT[0];
  if (!qt) return toast('还没有题型，点右上角「管理题型」加一个');
  /* 2026-11-20：这里原来卡死在 50（老师填 60 只出 50，就是它 + imports.js 里那道 50 一起造成的）。
     现在放到 200，超过 24 道由引擎自动分批要，不会因为一次要太多被模型截断。 */
  const n = Math.max(1, Math.min(200, Math.round(+$('mgN').value || 5)));
  const engineT = MAT_ENGINE[qt.k] || qt.k;     // 自建题型原样传给引擎
  const picks = [...document.querySelectorAll('[data-mpick]:checked')].map(x => +x.dataset.mpick);
  /* 取值一律带判空：这块表单将来改结构时，宁可少一句要求，也别让整页 TypeError 变空白。 */
  const exEl = $('mgExtra');
  const extra = exEl ? exEl.value.trim() : '', level = $('mgLevel').value, think = $('mgThink').value;
  /* 小问数（2026-11-20）：只对自建题型生效；内置六种不看这个框（它本来就不显示）。
     取值一律带兜底 —— 界面将来改结构时宁可退回默认 2，也别让整页 TypeError。 */
  const subEl = $('mgSub');
  const subCount = qt.builtin ? undefined : Math.max(1, Math.min(5, Math.round(+(subEl ? subEl.value : 2) || 2)));
  const state = $('mgState');
  const sub = curSub();
  /* 2026-11-15：出题是整页最长的动作（按段喂模型，可能几分钟），而且前面还要逐份读切段。
     三道反馈一起上：
     ① #mgGo 转圈 + 每 400ms 刷「已等 N 秒」，20 秒后变暖色 —— 证明它没死；
     ② #mgState 跟着走：读切段时写「正在读第 2/3 份资料」，出题时用 HXImp 的 onProgress
        写「正在根据第 3 / 9 段出题，已出 12 题…」这种真实进度；
     ③ 失败时按钮 title 挂上原因，顶部的红条照旧写全。
     注意：读切段也是 await，所以 begin 要放在这一整段之前，不能等读完才转圈。 */
  const tok = HXBusy.begin($('mgGo'), '正在出题…');
  MAT_BUSY = true;
  try {
    /* 2026-11-20（本轮核心修复）：勾了**多份**资料时改成「逐份出题」。
       以前勾多份会把所有切段拼成一大坨、mid 置 null、目录整段跳过 —— 结果每道题的 ch
       全靠模型猜：老师一次勾 5 份出 20 道实操题，流水灯（本该第 3 章）被写成第 4 章，
       按第 3 章筛一道都筛不出来。逐份出之后每份各自读目录、各自带 ch、各自入池，
       material_id 也不会再丢（原来多份时 mid=null）。 */
    const jobs = picks.length
      ? picks.map(id => ({ mid: +id }))
      : [{ mid: null, text: extra, tag: '老师手写的要求' }];
    if (!picks.length && !extra) {
      state.textContent = '';
      toast('没勾资料时，请在「额外要求」里写下要出题的内容');
      HXBusy.end(tok); MAT_BUSY = false; return;
    }
    /* 题量平摊：老师说的「一共 n 道」不能因为勾了 5 份就变成 5n。
       除不尽的前 rem 份各多 1 道。 */
    const base = Math.floor(n / jobs.length), rem = n % jobs.length;
    const allItems = [], allRejected = [], fails = [];
    let added = 0, dup = 0, doneN = 0, commitBad = false;
    for (let j = 0; j < jobs.length; j++) {
      const want = base + (j < rem ? 1 : 0);
      if (!want) continue;                       // 份数比题量还多：剩下的这份不出（免得 0 道还去读一遍）
      const job = jobs[j];
      const where = jobs.length > 1 ? `第 ${j + 1}/${jobs.length} 份：` : '';
      let text = '', tag = '', toc = null;
      const mid = job.mid;
      try {
        if (picks.length) {
          state.textContent = where + '正在读资料…';
          /* 只读这一份：原来传的是 picks 整组，拼成一大段后结构和来源都糊在一起。
             state 传 null —— matCollect 里的进度写的是「第 1/1 份」，会把上面那句
             「第 2/5 份」盖掉，逐份出题时它这句反而更容易让人以为只勾了一份。 */
          const got = await matCollect([mid], null, null);
          if (!got.parts.length) throw new Error('这份资料没有可用的切段，重新传一次试试');
          text = got.parts[0];
          tag = got.tag;
          /* 目录继承（2026-11-20）：把导入时做好的目录读出来交给引擎，每块切块就带着
             ch / sec 去出题 —— ch 不再由模型每题自己猜。老资料没有 toc 就现场补一次并写回云端。 */
          toc = await MAT_toc(mid);
          if (!toc) {
            state.textContent = where + '正在识别这份资料的章节目录…';
            try { toc = await HXImp.buildToc(text); } catch (e) { toc = null; }
            if (toc && toc.length) await MAT_tocSave(mid, toc);
          }
          /* 调试口：最近一次喂给模型的资料原文挂在 window.__lastMatText 上（多份时是最后一份）。 */
          try { window.__lastMatText = text; } catch (e) { }
        } else {
          text = job.text; tag = job.tag;
        }
        state.textContent = where + '正在准备出题…' + (want > 24 ? `（${want} 道会分批要，可能要几分钟）` : '');
        const res = await HXImp.aiGenerate(text, sub.key, sub.name, {
          types: { [engineT]: want },
          level, extra: picks.length ? extra : '', thinkLevel: think || undefined,
          /* 目录（章 / 节 / 知识点）：有就让每块切块继承章节，没有就完全按老行为让模型自己认。 */
          toc: toc || undefined,
          // 自建题型：告诉引擎「这些 key 也认」，并把中文名带过去给它写提示词
          customKeys: qt.builtin ? [] : [engineT],
          typeNames: { [engineT]: qt.name },
          subCount,
        }, msg => { state.textContent = where + msg; });
        /* 章节分级信任（2026-11-20）：目录 / 题干 / 模型推测 三级，上下文（资料名 + 目录）一起给，
           这样模型猜的章号只有在「这份资料真的覆盖那一章」时才被采信。 */
        const ctx = { matName: tag || '', toc };
        const items = res.questions.map(q => MAT_toDb(q, (tag || 'AI') + ' · AI 出题', ctx));
        allItems.push(...items);
        allRejected.push(...res.rejected);
        state.textContent = where + `出了 ${res.questions.length} 道` + (res.rejected.length ? `，${res.rejected.length} 道没收下` : '') + '，正在入池…';
        const r = await matGenCommit(items, mid, sub.id, state);
        added += r.added || 0; dup += r.dup || 0;
        if (r && r.ok === false) commitBad = true;
        doneN++;
      } catch (e) {
        /* **一份失败不拖累后面**：这份已经出的题照样入池（不然白花额度），错误攒起来最后一起说。 */
        const partial = (e && e.partialQuestions) || [];
        if (partial.length) {
          const ctx = { matName: tag || '', toc };
          const items = partial.map(q => MAT_toDb(q, (tag || 'AI') + ' · AI 出题（中途断了）', ctx));
          allItems.push(...items);
          allRejected.push(...(e.partialRejected || []));
          try {
            const r = await matGenCommit(items, mid, sub.id, state);
            added += r.added || 0; dup += r.dup || 0;
            if (r && r.ok === false) commitBad = true;
            doneN++;
          } catch (e2) { /* 入池也失败：题还在 MAT_GEN 里，界面会给「重新写入题池」 */ }
        }
        fails.push((jobs.length > 1 ? `第 ${j + 1} 份` : '') + ((e && e.message) || e));
      }
    }
    /* 一道都没出：明确报错，别让界面停在「出了 0 道」上面装成功 */
    if (!allItems.length) throw new Error(fails.length ? '一道题都没出（' + fails.join('；') + '）' : '一道题都没出');
    MAT_GEN = {
      items: allItems, rejected: allRejected,
      added: { ok: !commitBad, added, dup },
      tag: `${qt.name} · ${allItems.length} 道` + (jobs.length > 1 ? ` · ${doneN}/${jobs.length} 份资料` : ''),
      /* 多份批次没有单一 mid：重写入题池那类操作要按份分开做（见 matGenDraw） */
      mid: jobs.length === 1 ? jobs[0].mid : null,
      multi: jobs.length > 1,
      sid: sub.id, qt: qt.name
    };
    if (!fails.length) state.textContent = `出了 ${allItems.length} 道，入池 ${added} 道` + (dup ? `，重复跳过 ${dup} 道` : '');
    matGenDraw();
    if (fails.length) {
      MAT_banner('有 ' + fails.length + ' 份没出成：' + fails.join('；') + '（其余已入池 ' + added + ' 道）');
      HXBusy.end(tok, fails.join('；'));
    }
  } catch (e) {
    state.textContent = '';
    MAT_banner('出题失败：' + (e && e.message ? e.message : e));
    HXBusy.end(tok, (e && e.message) || String(e));
  } finally { MAT_BUSY = false; HXBusy.end(tok); }
}

/* 把一批题写进题池：先拉已有题硬去重（题型 + 题干去空白），再整批写入。
   返回 {ok, added, dup}，让调用方能把「入池几道、跳过几道重复」写进状态行。 */
async function matGenCommit(items, mid, sid, state) {
  const norm = s => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
  if (!items.length) return { ok: true, added: 0, dup: 0 };
  if (state) state.textContent = '正在比对题池…';
  const old = await MAT_call('hx_exam_qbank_list', { p_subject_id: sid });
  const stems = new Set(((old.ok && Array.isArray(old.data) ? old.data : [])).map(x => x.t + '|' + norm(x.q)));
  const fresh = [], dup = [];
  items.forEach(it => { (stems.has(it.t + '|' + norm(it.q)) ? dup : fresh).push(it); });
  if (!fresh.length) {
    MAT_FIG_BAD = 0;
    if (state) state.textContent = `这 ${items.length} 道题池里都已经有了，没重复加`;
    toast('这批题池里都有了，没重复加');
    return { ok: true, added: 0, dup: dup.length };
  }
  if (state) state.textContent = '正在写入题池…';
  const r = await MAT_call('hx_exam_qbank_add', { p_subject_id: sid, p_items: fresh, p_material_id: mid });
  if (!r.ok) { MAT_FIG_BAD = 0; MAT_banner('进题池失败：' + r.err); if (state) state.textContent = '入池失败：' + r.err; return { ok: false, added: 0, dup: dup.length, err: r.err }; }
  const added = (r.data && r.data.added) || 0;
  /* 2026-11-20：云端 add 现在会回 skipped（题型 key 不合规被挡下）。
     老师那次「实操题 0 道」就是被函数里写死的六种题型白名单挡掉的，函数还老实返回 added:0，
     界面只能说「0 道」—— 现在至少能说清是哪一种情况。 */
  const skipped = (r.data && r.data.skipped) || 0;
  if (!added && !dup.length) {
    MAT_FIG_BAD = 0;
    const why = skipped
      ? `写进题池 0 道：这 ${skipped} 道题的题型 key 不被接受（自建题型的 key 只能用 a-z / 0-9 / 下划线，且不能以数字开头）`
      : `写进题池 0 道：云端一条都没收下（题型或题面不合规）`;
    MAT_banner(why);
    if (state) state.textContent = why;
    return { ok: false, added: 0, dup: 0, err: why };
  }
  const dmsg = dup.length ? `，${dup.length} 道与题池重复已跳过` : '';
  const smsg = skipped ? `，${skipped} 道题型不被接受已跳过` : '';
  /* 这一批有多少处 fig 认不出（题干 + 选项合在一起数），说过一次就清零，下一批重新算。 */
  const badFig = MAT_FIG_BAD; MAT_FIG_BAD = 0;
  const fmsg = badFig ? `，${badFig} 处图符号认不出已忽略` : '';
  toast('已加入题池 ' + added + ' 道' + dmsg + smsg + fmsg);
  if (state) state.textContent = `已进入「${matQtName(MAT_QK)}」题池 ${added} 道` + dmsg + smsg + fmsg;
  loadSubjects(true);   // 题数变了：科目卡的计数要重算
  return { ok: true, added, dup: dup.length };
}

const MAT_ANS = q => {
  if (q.type === 'judgment') return q.answer[0] === 'T' ? '正确' : '错误';
  if (q.type === 'fill') return q.answer.join(' / ');
  if (q.type === 'short' || q.type === 'term' || q.type === 'prog') return q.answer[0] || '';
  /* 自建大题：小问分开列，别拼成一段（2026-11-21） */
  if (Array.isArray(q.answer) && q.answer.length > 1) return q.answer.map((x, k) => `（${k + 1}）${x}`).join('\n');
  return Array.isArray(q.answer) ? q.answer.join(' ') : String(q.answer || '');
};
/* 出完的直接入池了，这里只做「这批出了什么」的回执列表（只读，不再有勾选框和「加入题池」按钮）。 */
function matGenDraw() {
  const out = $('mgOut'); if (!out) return;
  if (!MAT_GEN) { out.innerHTML = ''; return; }
  const it = MAT_GEN.items, rej = MAT_GEN.rejected || [], ok = MAT_GEN.added;
  /* 章节来源统计（2026-11-20）：老师要一眼看出「哪些章得自己核对」——
     推测 = 模型自己写的章，只在这份资料的章区间内才采信，但仍然要核；未标 = 干脆没章，
     按章组卷抽不到，老师想按章用就得手动补。 */
  const chN = { toc: 0, text: 0, ai: 0, none: 0 };
  it.forEach(q => { const k = q.chSrc; chN[k === 'toc' || k === 'text' || k === 'ai' ? k : 'none']++; });
  const chNote = (chN.toc || chN.text || chN.ai || chN.none)
    ? `章节：目录 ${chN.toc} · 题干 ${chN.text} · 推测 ${chN.ai} · 未标 ${chN.none}`
    : '';
  out.innerHTML = `<div class="mg-res">
    <div class="mg-rh"><b>${esc(MAT_GEN.tag || '本次出题')}</b>
      <span class="note">${ok && ok.ok ? `已进题池 ${ok.added} 道${ok.dup ? ` · 重复跳过 ${ok.dup} 道` : ''}` : '还没写进题池'}</span></div>
    ${chNote ? `<div class="note" style="margin:-2px 0 8px">${esc(chNote)}</div>` : ''}
    <div class="mg-list">${it.map((q, i) => `<div class="mg-item ro">
      <span class="mg-q"><b>${esc(matQtName(q.t))}</b>${esc(q.q)}
      <span class="note">答案：${esc(String(MAT_ANS_ROW(q)).slice(0, 140))}</span>
      ${q.chSrc === 'ai' ? `<span class="note">（第 ${q.ch} 章 · AI 推测，请核对）</span>` : ''}
      ${q.chSrc === 'none' && !q.ch ? '<span class="note">（未标章节）</span>' : ''}</span></div>`).join('')}</div>
    ${rej.length ? `<details class="mg-rej"><summary>${rej.length} 道没收下</summary><ul>${rej.map(r => `<li>第 ${r.index} 条「${esc(r.stem)}」：${esc(r.reason)}</li>`).join('')}</ul></details>` : ''}
    <div class="row" style="margin-top:10px"><button class="sm" id="mgGoQb">去题池看这批题</button>
      ${ok && ok.ok === false
        ? (MAT_GEN.multi
          /* 多份批次没有单一 material_id（每题属于不同资料），一起重写会把 material_id 存丢，
             所以这里只禁用并说明，不给一个「看着能点、点了更糟」的按钮。 */
          ? '<button class="sm" id="mgRetry" disabled title="这批是分成多份分别入池的，请到题池里按题型筛出来处理">多份批次请分开重试</button>'
          : '<button class="pri sm" id="mgRetry">重新写入题池</button>')
        : ''}
      <span class="note">不满意的到题池里按题型筛出来批量删掉就行</span></div>
  </div>`;
  const b = out.querySelector('#mgGoQb');
  if (b) b.onclick = () => { if (typeof qbHome === 'function') qbHome(); };
  /* 入池失败时别让老师白瞎这一批 AI 额度（2026-11-20：自建题型被后端挡住，20 道题生成出来了却进不去）。
     题目还在内存里，给一颗「重新写入题池」直接重试，不必重新出题。
     多份批次那颗按钮是 disabled 的（见上），这里也 guard 一下，别给一个点了会丢 material_id 的入口。 */
  const rt = out.querySelector('#mgRetry');
  if (rt && !MAT_GEN.multi) rt.onclick = async () => {
    if (!MAT_GEN) return;
    const tok = HXBusy.begin(rt, '正在重试…');
    try {
      const r = await matGenCommit(MAT_GEN.items, MAT_GEN.mid, MAT_GEN.sid, null);
      MAT_GEN.added = r;
      matGenDraw();
      if (r.ok && r.added) toast('这次写进去了 ' + r.added + ' 道');
    } finally { HXBusy.end(tok); }
  };
}
// 题池行（DB 形态）的答案显示：和 matGenDraw 用的引擎形态不是一套字段
const MAT_ANS_ROW = q => {
  const a = q.a;
  if (q.t === 'judge') return a === true || a === 'true' || a === 'T' ? '正确' : '错误';
  if (Array.isArray(a)) {
    if (q.t === 'fill') return a.join(' / ');
    /* 大题存成数组 = 几个小问几条：列出来（2026-11-21），拼成「/」看不出是两问 */
    if (a.length > 1) return a.map((x, k) => `（${k + 1}）${x}`).join(' ');
    return String(a[0] == null ? '' : a[0]);
  }
  return String(a == null ? '' : a);
};

// 引擎里的题 → 题池那一行（字段名照 考试/supabase/2026-11-08-科目-资料库-题库.sql）
/* 符号图（2026-11-20）：AI 给的 fig 是 figlib 那套符号 id，写库前先问 HXFig.hasFig。
   认不出的直接丢（DB 的 fig 列只收 ^[A-Za-z0-9_-]{1,24}$，硬塞进去整批写入会失败），
   只把次数攒在 MAT_FIG_BAD 里，等这批入池完在状态行/提示里说一句，不逐题刷屏。
   没有 HXFig（脚本没打包进去）时一律当无图处理，不影响其余字段。 */
let MAT_FIG_BAD = 0;
function matFig(id) {
  const s = String(id == null ? '' : id).trim();
  if (!s) return null;
  /* 2026-11-21：上传试卷解析出来的题带的是 `img:<url>`（老师卷子里的原图）。
     这里原来只认符号库 id，会把这类图整条丢掉 —— 再存一次题，配图就没了。 */
  if (/^img:https?:\/\//i.test(s)) return s;
  const F = (typeof window !== 'undefined') ? window.HXFig : null;
  if (!F || typeof F.hasFig !== 'function') return null;
  if (F.hasFig(s)) return s;
  MAT_FIG_BAD++;
  return null;
}

/* ── 章节号：分级信任（2026-11-20）─────────────────────────────────────────
   病根：原来只有 `blockCh || 模型的 ch` 一句 —— 模型写 4 就是第 4 章，没有任何校验。
   20 道实操题（流水灯本该是第 3 章）被判成第 1/4/5 章，老师按第 3 章筛一道都筛不到。
   现在按可信度从高到低：
     ① 目录（导入时做好的 toc → 块上的 __ch）→ 直接用，标 chSrc:'toc'
     ② 题干里写明的「第3章 / 项目3 / 任务3-1 / 图3.2 / 3.1 节」→ 用（这是原文里的证据），标 'text'
     ③ 模型自己回的 ch → **只有落在「这份资料实际覆盖的章节区间」内**才采信，标 'ai'
     ④ 全落空 → null，标 'none'
   为什么不一刀切全写 null：新题会全都没章节，按章组卷直接抽不到，比现在更糟。 */

const MAT_CN_D = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
function matCnNum(t) {
  const s = String(t || '');
  if (/^\d{1,2}$/.test(s)) return +s;
  if (s === '十') return 10;
  const m = s.match(/^([一二三四五六七八九])?十([一二三四五六七八九])?$/);
  if (m) return (m[1] ? MAT_CN_D[m[1]] : 1) * 10 + (m[2] ? MAT_CN_D[m[2]] : 0);
  return MAT_CN_D[s] || 0;
}
/* 从一段文字里抠章号。只认**带编号**的写法，认不出返回 0（不乱猜）。 */
function matChNum(text) {
  const t = String(text == null ? '' : text);
  const NUM = '(\\d{1,2}|[一二三四五六七八九十]{1,3})';
  let m;
  if ((m = t.match(new RegExp('第\\s*' + NUM + '\\s*(?:章|项目|单元|篇|讲|部分)')))) return matCnNum(m[1]);
  if ((m = t.match(new RegExp('(?:项目|单元|课题|模块)\\s*' + NUM)))) return matCnNum(m[1]);
  if ((m = t.match(/任务\s*(\d{1,2})\s*[-–]/))) return +m[1];
  if ((m = t.match(/图\s*(\d{1,2})\s*[.．–-]/))) return +m[1];
  if ((m = t.match(/(\d{1,2})\s*[.．]\s*\d{1,2}(?:\s*[.．]\s*\d{1,2})?\s*节/))) return +m[1];
  return 0;
}
/* 这份资料实际覆盖的章节区间：优先用目录（min/max）；没有目录就从资料名里的「项目3」推。 */
function chRangeOf(matName, toc) {
  const list = (Array.isArray(toc) ? toc : []).map(c => (+c && +c.ch) || 0).filter(n => n > 0);
  if (list.length) return { min: Math.min(...list), max: Math.max(...list) };
  const n = matChNum(matName);
  return n ? { min: n, max: n } : null;
}
/* 题干（+ 选项文字）里能看出的章节号；看不出返回 0。 */
function chFromTextOf(q) {
  const opts = Array.isArray(q && q.options) ? q.options.map(o => String((o && o.text) || '')).join(' ') : '';
  return matChNum(String((q && q.stem) || '') + ' ' + opts);
}
/* 四级判定：返回 { ch, src }，src 只给界面看（DB 里没这列，add 会忽略多余 key）。 */
function chDecide(q, ctx) {
  const c = ctx || {};
  const blockCh = (q && q.__ch != null && +q.__ch > 0) ? +q.__ch : null;
  if (blockCh) return { ch: blockCh, src: 'toc' };
  const fromText = chFromTextOf(q);
  if (fromText) return { ch: fromText, src: 'text' };
  const ai = (q && q.ch != null && +q.ch > 0) ? +q.ch : null;
  if (ai) {
    const range = chRangeOf(c.matName, c.toc);
    /* 没有区间可判（既没目录、资料名也没编号）就只能信模型 —— 这也是改造前的行为，不算退步 */
    if (!range || (ai >= range.min && ai <= range.max)) return { ch: ai, src: 'ai' };
    return { ch: null, src: 'none' };   // 模型说的章不在这份资料的范围里：宁可不标，也别标错
  }
  return { ch: null, src: 'none' };
}

function MAT_toDb(q, src, ctx) {
  /* 2026-11-19：自建题型（如 shicao）在 MAT_DB_T 里没有映射，原来会掉进 'choice' ——
     表现是「明明出的实操题，进题池却变成选择题，还没有选项」。现在原样保留 key。 */
  const t = MAT_DB_T[q.type] || q.type || 'choice';
  let a;
  if (t === 'choice') a = q.answer.join('');
  else if (t === 'judge') a = q.answer[0] === 'T';
  else if (t === 'fill') a = q.answer.slice();
  /* 自建大题（实操之类，2026-11-21）：≥2 条 = 一道大题里的几个小问，**整组存进 a**，
     让卷面/参考答案按（1）（2）分开显示。以前只留 answer[0]，2 个小问只剩第一个，
     老师在参考答案里看到的就是「一坨」或者「少了一问」。1 条仍旧存字符串，老数据不受影响。 */
  else if (t !== 'short' && t !== 'term' && t !== 'prog' && Array.isArray(q.answer) && q.answer.length > 1) a = q.answer.slice();
  else a = Array.isArray(q.answer) ? (q.answer[0] || '') : String(q.answer == null ? '' : q.answer);
  const fig = matFig(q.fig);
  /* 章节（2026-11-20）：四级判定（见 chDecide）—— 目录 > 题干原文 > 模型推测（限区间）。
     有块级 ch 就整组用块级的（ch / sec / secTitle 必须自洽，不能 ch 用一个源、sec 用另一个）。 */
  const dec = chDecide(q, ctx);
  const ch = dec.ch, chSrc = dec.src;
  const fromBlock = chSrc === 'toc';
  const okSec = v => (v != null && /^[0-9]+(\.[0-9]+)*$/.test(String(v).trim())) ? String(v).trim() : null;
  const sec = fromBlock ? okSec(q.__sec) : okSec(q.sec);
  const secTitle = fromBlock
    ? (q.__secTitle ? String(q.__secTitle).slice(0, 120) : null)
    : (q.secTitle ? String(q.secTitle).slice(0, 120) : null);
  return {
    t, ch,
    /* chSrc 只给界面看（「目录 / 题干 / 推测 / 未标」），**不入库** ——
       hx_exam_qbank_add 是逐列 it->>'xxx' 取值（supabase/2026-11-20-题池题型不再写死.sql:38-46），
       多余的 key 会被忽略，不会让整批写入失败。 */
    chSrc,
    sec, secTitle,
    q: q.stem,
    /* 选项的 fig 单独筛：认不出就只删这个字段，选项文字照样留着。 */
    o: t === 'choice' || t === 'judge' ? (q.options || []).map(o => {
      const of = matFig(o.fig);
      return of ? { key: o.key, text: o.text, fig: of } : { key: o.key, text: o.text };
    }) : null,
    a, code: q.code || null, sub: q.sub && q.sub.length ? q.sub : null,
    ...(fig ? { fig } : {}),
    explanation: q.explanation || '', knowledge: q.knowledge || null, src

}

  /* sec: true = 这套题库的每道题都带教材小节（sec / secTitle）。导入时用它判断
     「拉回来的文件是不是旧版」（旧版没有 sec，见 matBuiltinImport 里的拦截）。 */
  { id: 'wiring', name: '电气接线原理', file: '../shuati/data/wiring.json', tag: '教材配套 · 期末理论 · 已标小节', n: 319, sec: true },
  { id: 'mcu', name: '单片机应用技术', file: '../shuati/data/mcu.json', tag: '教材配套 · 期末理论 · 已标小节', n: 536, sec: true },
  { id: 'psychology', name: '教育心理学', file: '../shuati/data/questions.json', tag: '教资', n: 435 },

/* 从刷题 source（如「项目1 熟悉单片机操作环境」「电气控制技术实训 第3版 项目2思考题」）
   里抠出章节号：优先「项目N」「第N章」「第N单元」「第N讲」，抠不到就是 null。 */
function builtinChapter(src) {
  const s = String(src || '');
  const m = s.match(/(?:项目|第\s*)?(\d+)\s*(?:章|单元|讲|项目|课)/) || s.match(/项目\s*(\d+)/) || s.match(/第\s*(\d+)\s*[章单元讲课]/);
  if (m) { const n = +m[1]; if (n > 0) return n; }
  return null;
}

/* 刷题一道题 → 题池一行（字段名照 hx_exam_qbank）。source → ch（章节号）+ src（完整出处）。 */
function builtinToDb(q) {
  const type = q.type;
  let t, a;
  if (type === 'single' || type === 'multiple') {
    t = 'choice';
    a = (Array.isArray(q.answer) ? q.answer : [q.answer]).join('').toUpperCase().replace(/[^A-Z]/g, '');
  } else if (type === 'judgment') {
    t = 'judge';
    a = (q.answer && q.answer[0]) === 'T' ? true : false;
  } else if (type === 'fill') {
    t = 'fill';
    a = (Array.isArray(q.answer) ? q.answer : [q.answer]).map(x => String(x == null ? '' : x).trim()).filter(Boolean);
  } else {
    t = type; // term / short / prog
    a = Array.isArray(q.answer) ? (q.answer[0] || '') : String(q.answer == null ? '' : q.answer);
  }
  const src = String(q.source || '').trim() || '刷题内置题库';
  /* 小节（2026-11-19）：刷题题库里电气/单片机两套已经按教材标到小节（1.1 / 3.2.1），
     直接带进题池；大章号优先从 sec 推（比从 source 文本正则稳），推不出来再走老办法。 */
  const sec = (q.sec && /^[0-9]+(\.[0-9]+)*$/.test(String(q.sec).trim())) ? String(q.sec).trim() : null;
  return {
    t, ch: sec ? +sec.split('.')[0] : builtinChapter(src), sec,
    secTitle: sec && q.secTitle ? String(q.secTitle).slice(0, 120) : null, q: q.stem,
    o: t === 'choice' || t === 'judge' ? (q.options || []).map(o => ({ key: o.key, text: o.text })) : null,
    a, code: q.code || null, sub: q.sub && q.sub.length ? q.sub : null,
    explanation: q.explanation || '', knowledge: (q.knowledge || null), src
  };
}

/* 把一套内置题库导入当前科目题池：拉 JSON → 转格式 → 拉已有题去重 → 分批写入。
   分批原因（2026-11-19）：hx_exam_qbank_add 里是 `limit 500`，一次最多写 500 条；
   mcu 639 题、education 741 题都会超，不分批会「静默少写」（函数只写前 500 条，返回的 added 也是 500）。
   每批 400 条留余量，逐批累加 added，全成功才报总数。 */
async function matBuiltinImport(id, btn) {
  const b = MAT_BUILTIN_BANKS.find(x => x.id === id);
  const sid = MAT_sid(); if (sid == null || !b) return;
  if (MAT_BUSY) return toast('正在忙，等这一步结束');
  if (!await hxConfirm(`把「${b.name}」整套导入当前科目的题池？\n\n会按题型 + 题干去重，题池里已有的题不会重复加。`)) return;
  const tok = HXBusy.begin(btn, '正在读题库…');
  MAT_BUSY = true;
  try {
    /* 2026-11-19 修：这里原来是固定版本号 `?v=20261119` + cache:'no-cache'。版本号不变，
       浏览器 / GitHub Pages 的边缘缓存就可能一直给改版前的旧 JSON —— 表现为「导入成功，
       但题池里小节全是空的、题数还是旧的那套」（用户实测：1009 = 旧 mcu 639 + 旧 wiring 370，
       而新版应该是 536 + 319）。改成时间戳 + no-store：每次导入都拿最新文件，代价只是一次
       几百 KB 的下载，比「悄悄导进一批旧题」划算得多。 */
    const r = await fetch(b.file + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('读内置题库失败 HTTP ' + r.status);
    const arr = await r.json();
    const list = Array.isArray(arr) ? arr : (arr && Array.isArray(arr.questions) ? arr.questions : []);
    if (!list.length) throw new Error('这套题库是空的');
    const items = list.map(builtinToDb).filter(x => x && x.q);
    /* 这套题库号称「已标小节」，结果拉回来的题一条 sec 都没有 —— 基本就是吃到了旧文件。
       直接拦下来，比让老师对着一片空的小节下拉发懵好。 */
    if (b.sec && items.length && !items.some(it => it.sec)) {
      throw new Error('拿到的是旧版题库（' + list.length + ' 题，无小节），不是最新的 ' + b.n + ' 题版本。请强刷页面（Ctrl+F5）后再点导入');
    }
    const old = await MAT_call('hx_exam_qbank_list', { p_subject_id: sid });
    const norm = s => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
    const stems = new Set(((old.ok && Array.isArray(old.data) ? old.data : [])).map(x => x.t + '|' + norm(x.q)));
    const fresh = items.filter(it => !stems.has(it.t + '|' + norm(it.q)));
    const dup = items.length - fresh.length;
    if (!fresh.length) { toast('这套题库的题池里都已经有了，没重复加'); HXBusy.end(tok); return; }
    let added = 0;
    const BATCH = 400;
    for (let i = 0; i < fresh.length; i += BATCH) {
      const chunk = fresh.slice(i, i + BATCH);
      const w = await MAT_call('hx_exam_qbank_add', { p_subject_id: sid, p_items: chunk, p_material_id: null });
      if (!w.ok) {
        /* 中途某批失败：前面已写进去的照实报，别让老师以为整批都没进 */
        if (added) { toast(`已导入 ${added} 道，后面一批失败：${w.err}`); loadSubjects(true); }
        MAT_banner('导入中途失败：' + w.err + (added ? `（已写入 ${added} 道）` : ''));
        HXBusy.end(tok, w.err);
        return;
      }
      added += (w.data && w.data.added) || 0;
    }
    const secN = fresh.filter(it => it.sec).length;
    toast(`已导入「${b.name}」${added} 道` + (dup ? `，${dup} 道重复跳过` : '') + (b.sec ? `，其中 ${secN} 道带教材小节` : ''));
    loadSubjects(true);
  } catch (e) {
    MAT_banner('导入失败：' + (e && e.message ? e.message : e));
    HXBusy.end(tok, (e && e.message) || String(e));
  } finally { MAT_BUSY = false; HXBusy.end(tok); }
}

  $('qbKn').onchange = () => { QB_K = $('qbKn').value; qbLoad(); };
  let kwT = 0;
  $('qbKw').oninput = () => { clearTimeout(kwT); kwT = setTimeout(() => { QB_KW = ($('qbKw').value || '').trim().toLowerCase(); qbDraw(); }, 140); };
  $('qbSelAll').onclick = qbSelAll;
  $('qbSelInv').onclick = () => {
    const list = qbShown();
    list.forEach(q => { const k = String(q.id); QB_SEL.has(k) ? QB_SEL.delete(k) : QB_SEL.add(k); });
    qbDraw();
  };
  $('qbSelNone').onclick = () => { QB_SEL.clear(); qbDraw(); };
  $('qbBatchDel').onclick = qbBatchDel;
  $('qbBatchType').onclick = qbBatchType;
  /* 2026-11-20 晚：撤销条的两颗按钮。快照是模块级的，切回题池页还在 ——
     进来先按当前科目判一次该不该显示（别的科目的快照要丢掉，见 qbUndoPaint）。 */
  $('qbUndoGo').onclick = qbUndoDo;
  $('qbUndoX').onclick = () => { qbUndoDrop(); toast('不再恢复了'); };
  qbUndoPaint();
  // 2026-11-15：这几颗都是「点了要等云端」的按钮，全部把按钮本身传进去，让 HXBusy 转圈+计时
  // （原来点刷新/清空整块界面一动不动，用户以为没点上；AI 查重要几十秒更像是卡死）
  $('qbRefresh').onclick = () => qbLoad($('qbRefresh'));
  $('qbCleanNo').onclick = () => qbCleanNo($('qbCleanNo'));
  $('qbSrc').onclick = () => qbSrcScan();
  $('qbGuessCh').onclick = () => qbGuessChRun($('qbGuessCh'));
  qbGuessChPaint();
  $('qbDedup').onclick = () => qbDedup($('qbDedup'));
  $('qbTag').onclick = () => qbTagKb($('qbTag'));
  /* 2026-11-20：题池里改过的题要能一次刷到刷题那边（老师原话「全站调用该题都需要更新 包括了刷题」）。
     单题改完已经会自动同步，这颗是「以前改过一堆、现在想统一刷一遍」用的。 */
  $('qbSyncQuiz').onclick = () => qbSyncAll($('qbSyncQuiz'));
  $('qbClear').onclick = () => qbClear($('qbClear'));
  $('qbPub').onclick = pubOpen;   // 只开弹层、不发请求，真正的等待在弹层里的「检查」上
  /* 题型表先读一次再画列表：否则自建题型（实操）在筛选下拉里会缺一项，
     而列表里明明有这类题。读失败也有内置六个兜底，不影响往下走。 */
  if (typeof matQtLoad === 'function') matQtLoad().then(() => {
    /* 题型名回来了要**连列表一起重画**：第一次画的时候 QB_CN 里还没有老师自建的题型，
       列表上的题型角标会露出原始 key（如 shicao）。 */
    qbCnBuild(); qbRebuildFilters(); qbDrawStat(); qbDraw();
  }).catch(() => { });
  qbLoad();
}
/* 题型下拉重建（题型表变了、或题池变了都要重来）。
   2026-11-20：原来还顺手重建「按题型全选」那个下拉（qbSelType），那个控件已删。 */
function qbRebuildFilters() {
  const sel = $('qbType');
  if (sel) {
    const cur = sel.value;
    sel.innerHTML = '<option value="">全部</option>' + QB_ORDER.map(t => `<option value="${t}">${esc(QB_CN[t] || t)}</option>`).join('');
    sel.value = QB_ORDER.indexOf(cur) >= 0 ? cur : '';
    QB_T = sel.value;
  }
}
const qbShown = () => QB_ALL.filter(q => (!QB_T || q.t === QB_T) &&
  (!QB_CH || (q.ch != null && String(q.ch) === String(QB_CH))) &&
  (!QB_SEC || String(q.sec || '') === QB_SEC) &&
  (!QB_KW || (String(q.q || '') + ' ' + String(q.knowledge || '')).toLowerCase().indexOf(QB_KW) >= 0));

/* 全选当前筛选：一个按钮两态 —— 当前筛选的题已经全勾上了，再点就是取消这批。 */
function qbSelAll() {
  const list = qbShown();
  if (!list.length) return toast('当前筛选下没有题');
  const allOn = list.every(q => QB_SEL.has(String(q.id)));
  list.forEach(q => allOn ? QB_SEL.delete(String(q.id)) : QB_SEL.add(String(q.id)));
  qbDraw();
  toast(allOn ? `已取消这 ${list.length} 道的勾选` : `已选中这 ${list.length} 道`);
}
/* 批量删除：一次 rpc 删完（hx_exam_qbank_del_many），不再逐条转网络。
   2026-11-20：单题行内的「删」也去掉了 —— 老师原话「左边选右上角改删不就行了」，
   删题统一走「勾选 → 删除选中」，只留「改」（单题修改没法批量）。 */
async function qbBatchDel() {
  const ids = [...QB_SEL].map(Number).filter(n => n > 0);
  if (!ids.length) return toast('一道都没选');
  if (!await hxConfirm(`删掉选中的 ${ids.length} 道题？\n\n删完题池顶上会出现「撤销删除」，点一下能整批找回来；资料和已经发布到刷题的题不受影响。`)) return;
  const b = $('qbBatchDel');
  const tok = HXBusy.begin(b, '正在删…');
  try {
    const r = await MAT_call('hx_exam_qbank_del_many', { p_subject_id: MAT_sid(), p_ids: ids });
    if (!r.ok) { MAT_banner('批量删除失败：' + r.err); HXBusy.end(tok, r.err); return; }
    const n = +(r.data || 0);
    const set = new Set(ids.map(String));
    qbUndoSnap([...set]);   // 删成功了才存快照（这几道还在 QB_ALL 里，趁现在抄一份）
    QB_ALL = QB_ALL.filter(x => !set.has(String(x.id)));
    QB_SEL.clear();
    qbDrawStat(); qbDraw(); qbRebuildFilters();
    toast('已删除 ' + n + ' 道');
    loadSubjects(true);   // 题数变了：科目卡的计数要重算
  } finally { HXBusy.end(tok); }
}
/* 批量改题型：把选中的题整批挪到另一个题型（题干/答案/知识点都不动，题 id 也不变） */
function qbBatchType() {
  const ids = [...QB_SEL].map(Number).filter(n => n > 0);
  if (!ids.length) return toast('一道都没选');
  zlModal(`<h2>把选中的 ${ids.length} 道题改成</h2>
    <label class="zl-f">目标题型<select id="qbBt">${QB_ORDER.map(t => `<option value="${t}">${esc(QB_CN[t] || t)}</option>`).join('')}</select></label>
    <p class="note">只改题型这一栏，题干、选项、答案、知识点、来源全部原样保留；题池里的编号也不变。</p>
    <div class="errs" id="qbBtErr" hidden></div>
    <div class="row"><button class="pri" id="qbBtGo">确定改</button><button id="qbBtCancel">取消</button></div>`);
  $('qbBtCancel').onclick = zlModalClose;
  $('qbBtGo').onclick = async () => {
    const t = $('qbBt').value;
    const tok = HXBusy.begin($('qbBtGo'), '正在改…');
    const err = m => { const e = $('qbBtErr'); e.textContent = m; e.hidden = false; };
    try {
      const r = await MAT_call('hx_exam_qbank_settype', { p_subject_id: MAT_sid(), p_ids: ids, p_t: t });
      if (!r.ok) { err(r.err); HXBusy.end(tok, r.err); return; }
      zlModalClose();
      toast('已把 ' + (+(r.data || 0)) + ' 道改成「' + (QB_CN[t] || t) + '」');
      QB_SEL.clear();
      qbLoad();
    } finally { HXBusy.end(tok); }
  };
}

/* 读题池。btn（可选）= 触发这次读取的按钮，传入后按钮在等待期间转圈 + 显示已等秒数。
   2026-11-15：同时把列表换成「正在读题池…」占位 —— 刷新时旧列表原样留着，
   请求慢的时候界面完全静止，用户分不清是在读还是点漏了。
   首次进页面时列表里已经有加载动效（qbHome 那个），别重复挂第二份。 */
async function qbLoad(btn) {
  const sid = MAT_sid(); if (sid == null) return;
  const tok = HXBusy.begin(btn, '正在刷新…');
  const lb = $('qbList');
  if (lb && !lb.querySelector('[data-fxload]')) { lb.innerHTML = fxLoad('正在读题池…'); if (window.HXLoadFx) HXLoadFx.auto(lb); }
  try {
    const body = { p_subject_id: sid };
    if (QB_K) body.p_knowledge = QB_K;
    const r = await MAT_call('hx_exam_qbank_list', body);
    if (MAT_sid() !== sid) return;
    const box = $('qbList'); if (!box) return;
    if (!r.ok) { box.innerHTML = `<div class="errs">${esc(r.err)}</div>`; QB_ALL = []; qbDrawStat(); HXBusy.end(tok, r.err); return; }
    QB_ALL = Array.isArray(r.data) ? r.data : [];
    if (!QB_K) qbKnBuild(QB_ALL);   // 只在未按知识点筛选时重建下拉，避免筛选后把选项刷没
    qbChBuild(QB_ALL);              // 章节下拉：章节是 AI 出的、随时会变，每次都重建
  qbSecBuild(QB_ALL);             // 小节下拉（2026-11-19）：内置题库按教材标到 3.2.1 这一级
    const ids = new Set(QB_ALL.map(q => String(q.id)));
    QB_SEL = new Set([...QB_SEL].filter(id => ids.has(id)));
    qbRebuildFilters();             // 按题型全选那个下拉要知道每类有多少道
    /* 撤销快照跟着科目走：切到别的科目就把上一科目的快照丢掉（别把电气题写进单片机） */
    if (DEDUP_UNDO.length && String(DEDUP_UNDO_SID) !== String(sid)) qbUndoDrop();
    qbUndoPaint();
    qbDrawStat(); qbDraw();
  } finally { HXBusy.end(tok); }
}
/* 从题池里收集去重后的知识点，填进 qbKn 下拉（空的不显示），保留当前选中项 */
function qbKnBuild(list) {
  QB_KN = [...new Set(list.map(q => String(q.knowledge || '').trim()).filter(Boolean))].sort();
  const sel = $('qbKn'); if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + QB_KN.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
  sel.value = QB_KN.includes(cur) ? cur : '';
  QB_K = sel.value;
}
/* 章节下拉（2026-11-19）：用 ch 字段（第几章/第几个项目），从题池收集去重后的章节号。
   没认到章节（ch 是 null）的题不进下拉 —— 但列表里还能看到，老师可以按「无章节」另行处理。
   章节号按数字升序排（1、2、3…项目5），比按字符串排更符合直觉。 */
function qbChBuild(list) {
  const chs = [...new Set(list.map(q => (q.ch != null && +q.ch > 0) ? +q.ch : null).filter(x => x != null))].sort((a, b) => a - b);
  const sel = $('qbCh'); if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + chs.map(c => `<option value="${c}">第 ${c} 章</option>`).join('');
  sel.value = (cur && chs.some(c => String(c) === cur)) ? cur : '';
  QB_CH = sel.value;
}
/* 小节下拉（2026-11-19）：sec 形如 1.1 / 3.2.1，按数字逐段升序排（1.1 → 1.2 → 2.1 → 3.2.1）。
   选了章节之后只列该章下的小节，免得 60 多个选项一起铺开。 */
function qbSecBuild(list) {
  const sel = $('qbSec'); if (!sel) return;
  const cur = sel.value;
  const pool = (QB_CH && !list.some(q => String(q.ch) === String(QB_CH))) ? list : list.filter(q => !QB_CH || String(q.ch) === String(QB_CH));
  const seen = new Map();
  for (const q of pool) {
    const sec = String(q.sec || '').trim();
    if (!sec) continue;
    if (!seen.has(sec)) seen.set(sec, q.secTitle || '');
  }
  const keys = [...seen.keys()].sort((a, b) => {
    const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const d = (pa[i] || 0) - (pb[i] || 0);
      if (d) return d;
    }
    return 0;
  });
  sel.innerHTML = '<option value="">全部</option>' + keys.map(k => `<option value="${esc(k)}">${esc(k)}${seen.get(k) ? ' ' + esc(seen.get(k)) : ''}</option>`).join('');
  sel.value = (cur && keys.includes(cur)) ? cur : '';
  QB_SEC = sel.value;
}

function qbDrawStat() {
  const box = $('qbStat'); if (!box) return;
  if (!QB_ALL.length) {
    box.innerHTML = '<span class="note">题池是空的</span>';
    const sb = $('qbSelBar'); if (sb) sb.hidden = true;
    return;
  }
  const n = t => QB_ALL.filter(x => x.t === t).length;
  /* 2026-11-19：每个题型都做成「点了就筛到这类」的芯片 —— 看统计的地方顺手就能筛，
     不用再去下拉里找一遍。计数用全量（不是筛选后），一眼看得出哪类题最多。 */
  box.innerHTML = `<span>共 <b>${QB_ALL.length}</b></span>` + QB_ORDER.filter(t => n(t)).map(t =>
    `<button type="button" class="qb-chip${QB_T === t ? ' on' : ''}" data-qbfilter="${t}" title="只看${esc(QB_CN[t] || t)}">${esc(QB_CN[t] || t)} <b>${n(t)}</b></button>`).join('')
    + (QB_T || QB_KW ? `<button type="button" class="qb-chip" data-qbfilter="">看全部</button>` : '');
  box.querySelectorAll('[data-qbfilter]').forEach(b => b.onclick = () => {
    QB_T = b.dataset.qbfilter;
    if ($('qbType')) $('qbType').value = QB_T;
    qbDraw();
  });
  const sb = $('qbSelBar'); if (sb) sb.hidden = false;
}
/* 2026-11-21：自建题型（老师自己加的，如单片机「实操题」，key 一般是 shicao）= 不在内置那六个里。
   为什么不写死字面量：内置题型本来就有一份 QB_FALLBACK，再抄一遍就成了两处真相，
   以后加内置题型必然会漏改一处。这里只做「键在不在 QB_FALLBACK 里」一件事。
   为什么要区分：老师原话「实操题没有标准答案，仅供参考，尤其第二小问实体开发板则是根据现场仿真
   实际情况打分」——自建题型的 a 存的是**参考要点**、code 存的是**参考示例代码**，
   界面上不能跟着内置题型一起说「答案」，不然老师会当成必须给标准答案。 */
const QB_BUILTIN = Object.keys(QB_FALLBACK);
function QB_IS_CUSTOM(t) { return QB_BUILTIN.indexOf(t) < 0; }
function QB_ans(q) {
  const a = q.a;
  if (q.t === 'judge') return a === true || a === 'true' || a === 'T' ? '正确' : a === false || a === 'false' || a === 'F' ? '错误' : String(a == null ? '' : a);
  if (Array.isArray(a)) {
    /* 大题存成数组 = 几个小问几条（2026-11-21）：列出来，别拼成「甲 / 乙」看不出是两问 */
    if (q.t !== 'fill' && a.length > 1) return a.map((x, k) => `（${k + 1}）${x}`).join('  ');
    return a.join(' / ');
  }
  if (a && typeof a === 'object') return JSON.stringify(a);
  return String(a == null ? '' : a);
}
function qbDraw() {
  const box = $('qbList'); if (!box) return;
  const list = qbShown();
  const sn = $('qbSelN'); if (sn) sn.textContent = QB_SEL.size;
  const sn2 = $('qbSelN2'); if (sn2) sn2.textContent = QB_SEL.size;
  const shn = $('qbShownN'); if (shn) shn.textContent = list.length;
  const sa = $('qbSelAll');
  if (sa) {
    const allOn = !!list.length && list.every(q => QB_SEL.has(String(q.id)));
    sa.textContent = allOn ? `取消这 ${list.length} 道的勾选` : `全选当前筛选（${list.length}）`;
    sa.disabled = !list.length;
  }
  const bar = $('qbSelBar'); if (bar) bar.hidden = !QB_ALL.length;
  if (!QB_ALL.length) { box.innerHTML = '<p class="note">还没有题，去「资料与出题」出一批。</p>'; return; }
  if (!list.length) {
    const why = [];
    if (QB_T) why.push('题型「' + (QB_CN[QB_T] || QB_T) + '」');
    if (QB_CH) why.push('第 ' + QB_CH + ' 章');
    if (QB_SEC) why.push('小节 ' + QB_SEC);
    if (QB_KW) why.push('关键词「' + QB_KW + '」');
    box.innerHTML = '<p class="note">当前筛选下没有题' + (why.length ? '（' + esc(why.join('、')) + '）' : '')
      + '。 <button class="sm" id="qbClearFilter">清空筛选</button></p>';
    const c = $('qbClearFilter');
    if (c) c.onclick = () => { QB_T = ''; QB_CH = ''; QB_SEC = ''; QB_KW = ''; if ($('qbType')) $('qbType').value = ''; if ($('qbCh')) $('qbCh').value = ''; if ($('qbSec')) $('qbSec').value = ''; if ($('qbKw')) $('qbKw').value = ''; qbDraw(); };
    return;
  }
  box.innerHTML = list.map(q => `<div class="qb-i" data-qid="${q.id}">
      <input type="checkbox" data-qsel="${q.id}" ${QB_SEL.has(String(q.id)) ? 'checked' : ''} aria-label="选中这道题">
      <div class="qb-body">
        <div class="qb-q"><span class="qb-t">${esc(QB_CN[q.t] || q.t)}</span>${q.ch != null && +q.ch > 0 ? `<span class="qb-t qb-ch">第 ${q.ch} 章</span>` : ''}${q.sec ? `<span class="qb-t qb-sec" title="教材小节">${esc(q.sec)}${q.secTitle ? ' ' + esc(q.secTitle) : ''}</span>` : ''}${QB_HASFIG(q) ? `<span class="qb-t qb-figb" title="带图：${esc(QB_URL(q) ? '上传试卷里的原图' : (HXFig.figName(q.fig) || q.fig))}">图 · ${esc(QB_URL(q) ? '图片' : (HXFig.figName(q.fig) || q.fig))}</span>` : ''}${esc(q.q)}</div>
        ${QB_HASFIG(q) ? `<div class="qb-figprev">${QB_URL(q) ? `<img src="${esc(QB_URL(q))}" alt="配图" style="max-height:130px;max-width:100%;object-fit:contain">` : HXFig.figSvg(q.fig)}</div>` : ''}
        ${Array.isArray(q.o) && q.o.length && q.t === 'choice' ? `<div class="qb-o">${q.o.map(o => `<span>${esc(o.key)}. ${esc(o.text)}</span>`).join('')}</div>` : ''}
        ${q.code ? `<pre class="qb-code">${esc(q.code)}</pre>` : ''}
        <div class="qb-a">${q.knowledge ? `<span class="qb-t">知识点</span>${esc(q.knowledge)} · ` : ''}${QB_IS_CUSTOM(q.t) ? '参考要点' : '答案'}：${esc(String(QB_ans(q)).slice(0, 300))}${q.src ? ' ｜ ' + esc(q.src) : ''}</div>
      </div>
      <div class="qb-act"><button class="sm" data-qed="${q.id}" title="单题修改（改题干/选项/答案/图）">改</button></div>
    </div>`).join('');
  box.querySelectorAll('[data-qsel]').forEach(b => b.onchange = () => { b.checked ? QB_SEL.add(b.dataset.qsel) : QB_SEL.delete(b.dataset.qsel); qbDraw(); });
  box.querySelectorAll('[data-qed]').forEach(b => b.onclick = () => qbEdit(b.dataset.qed));
}

/* 2026-11-20：删单题的 qbDel() 已删 —— 行内「删」按钮去掉了（只留「改」），
   删题统一走勾选 + 顶部「删除选中」(qbBatchDel)，一次 rpc 删完，不留死代码。 */
/* 清空题池：一次 rpc 删几十上百行，比删单题慢得多，按钮必须转圈给人看 */
async function qbClear(btn) {
  const s = curSub(); if (!s) return;
  if (!QB_ALL.length) return toast('题池是空的');
  if (!await hxConfirm(`清空「${s.name}」题池里全部 ${QB_ALL.length} 道题？\n\n删了找不回来；资料和已经发布到刷题的题不受影响。`)) return;
  const tok = HXBusy.begin(btn, '正在清空…');
  try {
    const r = await MAT_call('hx_exam_qbank_clear', { p_subject_id: s.id });
    if (!r.ok) { MAT_banner('清空失败：' + r.err); HXBusy.end(tok, r.err); return; }
    QB_ALL = []; QB_SEL.clear(); qbDrawStat(); qbDraw();
    toast('已清空 ' + ((r.data && +r.data) || 0) + ' 道');
    loadSubjects(true);   // 题数变了：科目卡的计数要重算，别拿缓存
  } finally { HXBusy.end(tok); }

/* ---------------- 清理题干里的教材编号（2026-11-20） ----------------
   老师原话：「不存在写任务1.1这样的题干 那是我们出题参考 而我们需要的是独立题干 正式一点」。

   只删编号片段，后面的正文一个字不动；清洗后题干变空的跳过（宁可留着脏题，也不留空壳）。
   库里的 hx_exam_qbank_* 没有批量改题干的接口（hx_exam_qbank_update 是单条就地改、还没在线上验证），

  /第\s*\d+\s*题[：:、.．\s]*/g

async function qbSrcAI(chunk) {

    + '- 题干指向教材里的图 / 表 / 例题 / 上一题（「如图 3-2 所示」「见表 2-1」「上述例题」）；\n'
    + '- 靠书本上下文才成立的表述（「在工作方式 1 下」「该电路」「这种接法」前面没交代过）；\n'
    + '- 缺条件、缺数据、缺图，必须翻书才能作答。\n'
    + '注意：**正常的专业术语不算问题**（定时器、寄存器、工作方式、复位电路这些是考点，不是缺条件）；\n'

const QB_CH_CN = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };

/* 从一段文字里投票猜章节：项目N / 第N章 权重 3，图N-x 权重 2，N.x 权重 1。
   同一句里出现两个（「项目二…第一章」）取票多的 —— 实测这类来源出的题内容都是项目二那章，

  for (const m of t.matchAll(/第\s*([一二三四五六七八九十])\s*章/g)) add(QB_CH_CN[m[1]], 3);
  for (const m of t.matchAll(/图\s*(\d+)\s*[-–]\s*\d+/g)) add(+m[1], 2);
