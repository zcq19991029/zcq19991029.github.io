  return best ? +best[0] : 0;
}
/* 先看来源，来源判不出再看题干 */
function qbGuessCh(q) {
  return qbChFromText(q.src) || qbChFromText(q.q) || 0;
}
/* 按钮文字 = 当前状态：有快照就显示「撤销补章节」。工具栏重画后要重新调一次。 */
function qbGuessChPaint() {
  const b = $('qbGuessCh');
  if (b) { b.textContent = QB_CH_UNDO.length ? '撤销补章节' : '按来源补章节'; b.setAttribute('data-p', String(QB_CH_UNDO.length)); }
}

async function qbGuessChRun(btn) {
  /* 已经有快照 = 这一次点击是「撤销」 */
  if (QB_CH_UNDO.length) {
    const list = QB_CH_UNDO.slice();
    if (!await hxConfirm(`撤销刚才的补章节？\n\n这 ${list.length} 道题会恢复成「未标章节」，别的题不受影响。`)) return;
    const tok = HXBusy.begin(btn, '正在撤销…');
    let n = 0, bad = '';
    try {
      for (const x of list) {
        const r = await MAT_call('hx_exam_qbank_update', { p_id: x.id, p_patch: { ch: x.ch == null ? null : x.ch } });
        if (!r.ok) { bad = '第 ' + x.id + ' 道没还原：' + (r.err || '未知错误'); break; }
        n++;
      }
      if (!bad) { QB_CH_UNDO = []; toast('已撤销，' + n + ' 道题恢复成未标章节'); }
      else MAT_banner('撤销补章节：还原了 ' + n + ' 道，后面停下了（' + bad + '）。');
    } finally { HXBusy.end(tok); }
    setTimeout(qbGuessChPaint, 420);   // 同上：等 HXBusy 把手里的按钮还原完
    qbLoad().catch(() => { });
    return;
  }

  const todo = QB_ALL.filter(q => !(+q.ch)).map(q => ({ q, ch: qbGuessCh(q) })).filter(x => x.ch > 0);
  const miss = QB_ALL.filter(q => !(+q.ch)).length - todo.length;
  if (!todo.length) return toast(miss ? '剩下 ' + miss + ' 道从来源和题干里都看不出章节' : '每道题都已经有章节号了');
  const dist = {};
  todo.forEach(x => { dist[x.ch] = (dist[x.ch] || 0) + 1; });
  const lines = Object.keys(dist).sort((a, b) => a - b).map(c => '第 ' + c + ' 章：' + dist[c] + ' 道').join('\n');
  const msg = `给 ${todo.length} 道没有章节号的题，按「来源资料名 / 题干里的项目号」倒推补上章节：\n\n${lines}`
    + (miss ? `\n\n另有 ${miss} 道从来源和题干里都看不出章节，保持原样（还是未标章节）。` : '')
    + '\n\n**只补空着的，已有章节的一道都不动。** 补完按钮会变成「撤销补章节」，点一下能全部还原。';
  if (!await hxConfirm(msg)) return;

  const tok = HXBusy.begin(btn, '正在补章节…');
  let done = 0, bad = '';
  QB_CH_UNDO = [];
  try {
    for (const { q, ch } of todo) {
      const r = await MAT_call('hx_exam_qbank_update', { p_id: +q.id, p_patch: { ch: ch } });
      if (!r.ok) { bad = '第 ' + q.id + ' 道（' + String(q.q || '').slice(0, 12) + '…）没改成：' + (r.err || '未知错误'); break; }
      QB_CH_UNDO.push({ id: +q.id, ch: q.ch == null ? null : q.ch });
      q.ch = ch;
      done++;
    }
    if (bad) MAT_banner('补章节：补好 ' + done + ' 道，后面停下了（' + bad + '）。已经补的保留。');
    else toast('给 ' + done + ' 道题补上了章节');
  } finally { HXBusy.end(tok); }
  /* ⚠ HXBusy.end() 会把按钮**还原成点之前的原文案**（它 begin 时存了一份），
     所以按钮文字必须在 end 之后改，改在 try 里面会被它盖回去（实测踩到：data-p 明明写进去了，
     文案却还是「按来源补章节」）。刷新列表同理，放最后、不等它。 */
  /* HXBusy.end 的还原是 **setTimeout(minMs=320ms) 之后**才执行的，所以这里要等它还原完再改文案，
     否则刚写上的「撤销补章节」会在 320ms 后被它用旧 innerHTML 盖回去（实测 data-p 写进去了、文字却回退）。 */
  setTimeout(qbGuessChPaint, 420);
  qbLoad().catch(() => { });
}

/* ---------------- AI 查重 ----------------
   两层：① 题干（题型 + 去空白 + 同一张图）完全相同的，直接判重；② 剩下的交给 AI 语义比对，
   让它标出「考点重复」的题对（措辞不同但考同一知识点）。结果弹层里老师自己定删哪一道，
   不自动删 —— 怕 AI 误判把好题删了。

   2026-11-20 一次误删改的（用户实测：点了一下，222 道「疑似重复」全没了）：
   老版本把两类重复放在**同一个列表**、**默认全勾**、底下一颗「删除勾中的 N 道」，
   点下去等于把 AI 判的疑似重复也一起删了 —— 而那些题考同一考点但措辞不同，
   考试组卷可能还要用。于是改成三类分开、疑似默认不勾。

   2026-11-20 第三轮（用户原话：「我咋知道删除的上面还是下面呢？你没给我选啊」
   「默认重复删除的话默认选中第一个，我想换我再换」「撤销删除也需要」）：
     ① 顶部换成三段 tab（照首页「教务管理」的 .seg）：完全相同 / 同题型疑似 / 跨题型疑似，
        只显示当前那一栏 —— 三类纵向堆三条长列表，一屏根本看不清；
     ② 每一对两道题上下排开、**各自可点**，默认选中上面那道（先出现的那道）：红框 + 红点 +「将删除」，
        另一道灰点 +「保留」；点了就是换一道，再点已选中的那道 = 这对不动；
     ③ 每栏一根操作条：「删上面 / 删下面 / 都留着」整栏一键设（大量修改不用逐对点），
        右边「删除选中的 N 道」，N 是本栏里选中要删的题**去重后**的数量；
     ④ 删完存一份整行快照，题池顶上给「撤销删除」，一次 hx_exam_qbank_add 整批写回；
     ⑤ 删完弹层不关，剩下的 tab 接着删，一次 AI 额度用到底。 */
/* 2026-11-15：AI 查重是一次性把整个题池喂给模型，题多时要几十秒。原来点完按钮、
   界面什么都不变（结果要等弹层才出来），用户以为没点上。现在三件事一起做：
   ① 「AI 查重」按钮转圈 + 已等 N 秒；② 顶部条写清楚正在干什么；③ 失败不再被
   「没查出重复题」的 toast 盖掉（AI 挂了和「真的没重复」必须分得开）。 */
async function qbDedup(btn) {
  const s = curSub(); if (!s) return;
  if (QB_ALL.length < 2) return toast('题池里不足 2 道题，没有查重的必要');
  const tok = HXBusy.begin(btn, '正在查重…');
  const banner = $('qbBanner');
  const say = t => { if (banner) { banner.textContent = t || ''; banner.hidden = !t; } };
  say('正在查重：先挑出题干完全相同的，再让 AI 比一遍考点，题多时可能要几十秒…');
  try {
    const norm = x => String(x == null ? '' : x).replace(/\s+/g, '').toLowerCase();
    const pairs = [];                       // 判重结果：{ a, b, why, kind }
    /* ① 硬去重：同题型 + 题干去空白相等 + **同一张图**
       2026-11-20：图题的题干常常一模一样（「图中的图形符号表示（ ）。」有 20 道，
       区别全在 fig 上）。判重键不带 fig 的话，这 20 道会被判成「完全相同」并默认勾选，
       一点删除就只剩 1 道 —— 和当初误删疑似重复是同一类事故。 */
    const seen = {};
    QB_ALL.forEach(q => {
      const k = q.t + '|' + norm(q.q) + '|' + String(q.fig || '');
      if (seen[k]) pairs.push({ a: seen[k], b: q, why: '题干完全相同' + (q.fig ? '（同一张图）' : ''), kind: 'exact' });
      else seen[k] = q;
    });
    // ② AI 语义比对：把题按 DEDUP_BATCH 道一批分着送，逐批报进度
    let aiPairs = [], aiErr = null, aiWarn = '';
    try {
      const r = await qbDedupAI((k, n, cnt) => say(`正在比考点：第 ${k}/${n} 批（本批 ${cnt} 道）…`));
      aiPairs = r.pairs;
      /* 单批失败不中断（截断 / 超时只影响那一批），但欠的账要说清楚 */
      if (r.bad) aiWarn = `${r.rounds} 批里 ${r.bad} 批没跑成` + (r.lastErr ? `（${r.lastErr}）` : '') + '，结果只覆盖了跑成的那几批。';
    } catch (e) {
      // 整份都没跑成才算失败；AI 查不到不致命，硬去重照样给，但原因必须留下
      aiErr = (e && e.message) || String(e);
    }
    say('');
    if (aiErr) {
      HXBusy.end(tok, aiErr);
      if (!pairs.length) { MAT_banner('AI 语义比对没跑成：' + aiErr + '。题干完全相同的重复也没查到。'); return; }
      MAT_banner('AI 语义比对没跑成：' + aiErr + '。下面只显示了题干完全相同的重复。');
    }
    const all = qbDedupTidy(pairs.concat(aiPairs));
    if (!all.length) {
      /* 有批次没跑成时说「没查出重复」是误导：那几批根本没比 */
      if (aiWarn) MAT_banner('AI 语义比对：' + aiWarn);
      else toast('没查出重复题（AI 语义比对也没发现疑似重复）');
      return;
    }
    qbDedupDraw(all, aiWarn);
  } finally { HXBusy.end(tok); }
}
/* 同一对题可能被 AI 报两遍（a↔b 换个顺序也算同一对），按 id 归一后去重；
   同一个 b 既被判「完全相同」又被 AI 判「疑似」时，只留前者（判断更硬）。
   另外：跨题型的两道题若题干一字不差，那其实就是「完全相同」，别降级成跨题型疑似。 */
function qbDedupTidy(list) {
  const rank = { exact: 0, same: 1, cross: 2 };
  const norm = x => String(x == null ? '' : x).replace(/\s+/g, '').toLowerCase();
  const m = new Map();
  list.forEach(p => {
    if (!p || !p.a || !p.b || String(p.a.id) === String(p.b.id)) return;
    /* 题干一样的，只要**图也一样**才算「完全相同」（图不同就是两道题） */
    const same = norm(p.a.q) === norm(p.b.q) && String(p.a.fig || '') === String(p.b.fig || '');
    const kind = same ? 'exact' : p.kind;
    const x = String(p.a.id), y = String(p.b.id);
    const k = x < y ? x + '|' + y : y + '|' + x;
    const old = m.get(k);
    if (!old || rank[kind] < rank[old.kind]) m.set(k, { ...p, kind });
  });
  /* 一对的「上面 / 下面」= 这道题在题池列表里的先后（列表新的在上，所以 a 就是先出现的那道）。
     AI 报回来的 a/b 顺序不保证，这里按 QB_ALL 的下标统一，免得「删上面」忽上忽下。 */
  const idx = new Map(QB_ALL.map((q, i) => [String(q.id), i]));
  return [...m.values()].map(p => {
    const ia = idx.has(String(p.a.id)) ? idx.get(String(p.a.id)) : 1e9;
    const ib = idx.has(String(p.b.id)) ? idx.get(String(p.b.id)) : 1e9;
    return ia <= ib ? p : { ...p, a: p.b, b: p.a };
  });
}
/* AI 语义比对：把题池里的题编号喂给 AI，让它返回「重复的题对」的编号数组。
   2026-11-20 改成**分批**：一次塞 536 道（单片机题池）时，模型的输出被 token 上限截断，
   回来的 JSON 缺了尾巴 —— 用户看到的就是那条
   「Expected ',' or '}' after array element in JSON at position 15366」红条。
   现在每批 DEDUP_BATCH 道、逐批请求；单批失败只记一笔、不中断其它批，
   最后交给弹层写「N 批里 M 批没跑成」。整份一批都没成才是真的失败。
   跨题型的重复也要它报（以前没明说，模型经常只比同题型），报回来由前端分两组。 */
const DEDUP_BATCH = 60;
async function qbDedupAI(onP) {
  const rounds = Math.ceil(QB_ALL.length / DEDUP_BATCH);
  const out = [];
  let bad = 0, lastErr = '';
  for (let b = 0; b < rounds; b++) {
    const chunk = QB_ALL.slice(b * DEDUP_BATCH, (b + 1) * DEDUP_BATCH);
    if (onP) onP(b + 1, rounds, chunk.length);
    try {
      (await qbDedupAIBatch(chunk, b + 1)).forEach(p => out.push(p));
    } catch (e) { bad++; lastErr = (e && e.message) || String(e); }
  }
  if (rounds && bad === rounds) throw new Error(lastErr || 'AI 语义比对整批都没跑成');
  return { pairs: out, rounds, bad, lastErr };
}
/* 一批（≤ DEDUP_BATCH 道）→ 重复题对。编号 a/b 是**这一批内**的下标，对回 chunk 里的题。 */
async function qbDedupAIBatch(chunk, batchNo) {
  const list = chunk.map((q, i) => ({ i, t: q.t, fig: q.fig, stem: String(q.q || '').slice(0, 300) }));
  const prompt = '下面是同一个题库里的 ' + list.length + ' 道题（编号从 0 开始）。请找出「考同一个知识点、可以算重复」的题对——'
    + '哪怕措辞不一样，只要考的是同一个考点就算重复；只是同属一章但考点不同的不算。\n'
    + '注意：**不同题型之间**考同一个考点的（例如一道选择、一道判断问的是同一件事）也要报出来，'
    + '我会把它们单独分组，不会和同题型的混在一起。\n'
    + '**带图的题要特别小心**：题干写着「图中的符号表示（ ）」这类，图不同就是完全不同的题'
    + '（［图：xxx］标注不一样），不要当成重复。\n'
    + '只输出 JSON，格式：{"pairs":[{"a":编号,"b":编号,"why":"一句话说明为什么重复"}]}，没有重复就 {"pairs":[]}。\n'
    + '题目：\n' + list.map(x => '[' + x.i + ']（' + QB_CN[x.t] + '）' + x.stem + (x.fig ? '［图：' + (HXFig.figName(x.fig) || x.fig) + '］' : '')).join('\n');
  const res = await hximpChat([{ role: 'system', content: '你是严谨的题库审题员，只返回合法 JSON。' }, { role: 'user', content: prompt }], { json: true });
  const obj = qbParseJsonLoose(typeof res === 'string' ? res : JSON.stringify(res), batchNo);
  const arr = (obj && obj.pairs) || [];
  if (!Array.isArray(arr)) return [];
  const out = [];
  arr.forEach(p => {
    const a = chunk[+p.a], b = chunk[+p.b];
    if (a && b && a.id !== b.id) out.push({ a, b, why: String(p.why || '疑似重复'), kind: a.t === b.t ? 'same' : 'cross' });
  });
  return out;
}
/* 解析 AI 返回的 JSON，**对截断容错**。
   模型输出被 token 上限切掉时，JSON.parse 会抛「Expected ',' or '}' after array element…」这种
   位置报错，原样糊到老师脸上毫无意义。这里先让 HXImp.parseJson 试一次，不行再修：
     ① 截到最后一个完整的 '}'，补上 ]}（{"pairs":[{"a":0,"b":1…} → {"pairs":[{…}]}）；
     ② 还不行就把里面每个完整的 {...} 摘出来，重新拼成 {pairs:[…]}；
     ③ 两样都不行才抛 —— 报错写清是第几批、大概率是输出被截断。 */
function qbParseJsonLoose(text, batchNo) {
  try { return HXImp.parseJson(text); } catch (e) { }
  const raw = String(text == null ? '' : text).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = raw.indexOf('{');
  if (a >= 0) {
    for (let i = raw.length - 1; i > a; i--) {
      if (raw[i] !== '}') continue;
      const head = raw.slice(a, i + 1);
      for (const tail of [']}', ']}']) {
        try { const o = JSON.parse(head + tail); if (o && typeof o === 'object') return o; } catch (e2) { }
      }
    }
    const objs = [];
    const re = /\{[^{}]*\}/g; let m;
    while ((m = re.exec(raw))) {
      try { const o = JSON.parse(m[0]); if (o && o.a != null && o.b != null) objs.push(o); } catch (e3) { }
    }
    if (objs.length) return { pairs: objs };
  }
  throw new Error('模型返回的不是合法 JSON（第 ' + (batchNo || 1) + ' 批，可能是输出被截断）');
}
/* ---------------- AI 打知识点（2026-11-20） ----------------
   内置题库导进来的题没有知识点（题库本身没这个字段），所以题池的「知识点」栏一直是空的。
   这里让 AI 逐题给一个 4~10 字的标签（「中断优先级」「数码管动态显示」），写到
   hx_exam_qbank.knowledge —— 之后题池能按知识点筛，组卷也能按考点挑。
   为什么分批：855 道一次塞进去又贵又容易漏题/超时；每批 40 道、一批一落库，
   中途断了前面不白跑。只跑「知识点为空」的题，重复点不会重复花钱。 */
const KB_BATCH = 40;
async function qbTagKb(btn) {
  const s = curSub(); if (!s) return;
  const todo = QB_ALL.filter(q => !String(q.knowledge || '').trim());
  if (!todo.length) return toast('本科目题池里的题都已经有知识点了');
  const rounds = Math.ceil(todo.length / KB_BATCH);
  if (!await hxConfirm(`给本科目还差知识点的 ${todo.length} 道题打标签？\n\n每批 ${KB_BATCH} 道，共 ${rounds} 次 AI 请求，用「AI 设置 → 资料库」那套模型，会消耗额度。\n已经有知识点的题不会重打。`)) return;
  const tok = HXBusy.begin(btn, '正在打知识点…');
  const banner = $('qbBanner');
  const say = t => { if (banner) { banner.textContent = t || ''; banner.hidden = !t; } };
  let done = 0, bad = 0, lastErr = '';
  try {
    for (let i = 0; i < todo.length; i += KB_BATCH) {
      const chunk = todo.slice(i, i + KB_BATCH);
      const n = Math.floor(i / KB_BATCH) + 1;
      say(`正在打知识点：第 ${n} / ${rounds} 批（已写好 ${done} 道，本批 ${chunk.length} 道）…`);
      try {
        const items = await qbTagKbAI(chunk);
        if (!items.length) { bad += chunk.length; continue; }
        const w = await MAT_call('hx_exam_qbank_knowledge', { p_subject_id: s.id, p_items: items });
        if (!w.ok) throw new Error(w.err);
        const got = (w.data && w.data.updated) || 0;
        done += got; bad += chunk.length - got;
        /* 本地同步，省一次重拉（qbDraw 用的是 QB_ALL） */
        items.forEach(it => { const q = QB_ALL.find(x => String(x.id) === String(it.id)); if (q) q.knowledge = it.knowledge; });
      } catch (e) { bad += chunk.length; lastErr = (e && e.message) || String(e); }
    }
    say('');
    if (bad) MAT_banner(`知识点：写好 ${done} 道，没成功 ${bad} 道` + (lastErr ? `（最后一次错误：${lastErr}）` : '') + '。可以直接再点一次，只会补没打上的。');
    else toast(`知识点打好了：${done} 道`);
    qbKnBuild(QB_ALL);
    qbDraw();
  } finally { HXBusy.end(tok); }
}
/* 一批题 → [{id, knowledge}]。用「编号」对回题（题干会被截断，不能靠文本匹配）；
   模型漏掉的这次就算了，下次点按钮会补。 */
async function qbTagKbAI(chunk) {
  const lines = chunk.map((q, i) => `[${i}]（${QB_CN[q.t] || q.t}）` + String(q.q || '').replace(/\s+/g, ' ').slice(0, 220));
  const prompt = '下面是一份题库里的 ' + chunk.length + ' 道题（编号从 0 开始）。请给每道题标一个「知识点」标签：\n'
    + '- 4~10 个汉字，写具体考点（如「中断优先级」「数码管动态显示」「熔断器选用」「正反转互锁」）；\n'
    + '- 不要写「第一章」「选择题」这类章节名或题型；\n'
    + '- 同一套教材里考同一概念的题尽量用同一个标签（方便老师按知识点筛题）。\n'
    + '只输出 JSON：{"tags":[{"i":编号,"k":"知识点"}]}。每道题都要有一条，不要漏，不要解释。\n'
    + '题目：\n' + lines.join('\n');
  const res = await hximpChat([
    { role: 'system', content: '你是严谨的教研员，只返回合法 JSON。' },
    { role: 'user', content: prompt }
  ], { json: true });
  const obj = HXImp.parseJson(typeof res === 'string' ? res : JSON.stringify(res));
  const arr = (obj && obj.tags) || [];
  if (!Array.isArray(arr)) return [];
  const out = [];
  arr.forEach(t => {
    const q = chunk[+t.i];
    const k = String((t && (t.k || t.knowledge)) || '').trim().replace(/[。，,；;、]+$/, '');
    if (q && k) out.push({ id: q.id, knowledge: k.slice(0, 40) });
  });
  return out;
}
/* 三段 tab（名词照用户说法：完全相同 / 同题型疑似 / 跨题型疑似）。name 只出现在 tab 上，
   行里不再逐行印组名 —— tab 已经说明这是哪一类了。 */
const DEDUP_TAB = [
  { k: 'exact', name: '完全相同' },
  { k: 'same', name: '同题型疑似' },
  { k: 'cross', name: '跨题型疑似' }
];
const DEDUP_HINT = {
  exact: '同题型 + 题干（和同一张图）一字不差。默认删上面那道，留着没意义。',
  same: 'AI 判考同一个考点、措辞不同 —— 组卷可能还要用，看清楚再删。',
  cross: '不同题型考同一个考点，删掉那个题型的题量会变少。'
};
/* 弹层状态：by = 三类题对；del = 每一对删哪道（'a' 上面 / 'b' 下面 / '' 这对不动）；tab = 当前栏。
   del 是唯一真相：点哪道、整栏快捷按钮都只改它，再由 qbDedupSync 把状态刷回 DOM。 */
let DEDUP_UI = null;
const DEDUP_KEY = p => String(p.a.id) + '>' + String(p.b.id);
const qbDedupSumText = () => {
  const c = { exact: 0, same: 0, cross: 0 };
  if (DEDUP_UI) DEDUP_TAB.forEach(t => { c[t.k] = DEDUP_UI.by[t.k].length; });
  return `共 ${c.exact + c.same + c.cross} 对：完全相同 ${c.exact} / 同题型疑似 ${c.same} / 跨题型疑似 ${c.cross}。
    每一对默认删<b>上面</b>那道（先出现的），点下面那道就改成删它，再点一次已选中的 = 这对不动。`;
};
function qbDedupDraw(pairs, warn) {
  const by = { exact: [], same: [], cross: [] };
  pairs.forEach(p => (by[p.kind] || by.same).push(p));
  const del = new Map();
  /* 默认每一对都删**上面**那道（先出现的那道）—— 用户原话「默认重复删除的话默认选中第一个，
     我想换我再换；因为大量修改我不可能一个一个点选中」。 */
  DEDUP_TAB.forEach(t => by[t.k].forEach(p => del.set(DEDUP_KEY(p), 'a')));
  const first = (DEDUP_TAB.find(t => by[t.k].length) || DEDUP_TAB[0]).k;
  DEDUP_UI = { by, del, tab: first, warn };
  zlModal(`<h2>AI 查重 · ${esc(curSub().name)}</h2>
    ${warn ? `<p class="note" id="qbDedupWarn" style="margin:0 0 10px">注意：${esc(warn)}</p>` : ''}
    <p class="note" id="qbDedupSum" style="margin:0 0 10px">${qbDedupSumText()}</p>
    <div class="qb-seg" id="qbDedupSeg" role="tablist"></div>
    <div id="qbDedupBody"></div>
    <div class="errs" id="qbDedupErr" hidden></div>
    <div class="row"><button id="qbDedupCancel">关闭</button></div>`);
  $('qbDedupCancel').onclick = () => { DEDUP_UI = null; zlModalClose(); qbLoad(); loadSubjects(true); };
  qbDedupSeg();
  qbDedupPaint();
}
/* 顶部三段 tab：只画还有题对的那几栏（一栏删空了就把这个 tab 一起摘掉）。 */
function qbDedupSeg() {
  const U = DEDUP_UI, seg = $('qbDedupSeg'); if (!U || !seg) return;
  seg.innerHTML = DEDUP_TAB.filter(t => U.by[t.k].length).map(t =>
    `<button type="button" data-tab="${t.k}" role="tab" aria-pressed="${t.k === U.tab ? 'true' : 'false'}">${t.name} <b>${U.by[t.k].length}</b></button>`).join('');
  seg.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    if (!DEDUP_UI || DEDUP_UI.tab === b.dataset.tab) return;
    DEDUP_UI.tab = b.dataset.tab;
    seg.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    qbDedupPaint();
  });
}
/* 一对 = 一张卡：头一行「第 k 对 · AI 的理由」+ 右侧当前选择；下面两道各是一个可点区域。 */
function qbDedupSide(q, side) {
  const stem = String(q.q == null ? '' : q.q).replace(/\s+/g, ' ').slice(0, 90);
  return `<button type="button" class="qb-dside" data-side="${side}" data-qid="${esc(q.id)}" aria-pressed="false">
      <span class="qb-dsd" aria-hidden="true"></span>
      <span class="qb-dsm">${side === 'a' ? '上' : '下'}</span>
      <span class="qb-dst"><b class="qb-t">${esc(QB_CN[q.t] || q.t)}</b>${q.fig ? `<b class="qb-t qb-figb">图 · ${esc(HXFig.figName(q.fig) || q.fig)}</b>` : ''}${esc(stem)}</span>
      <span class="qb-dtag">保留</span>
    </button>`;
}
const qbDedupPairHtml = (p, k) => `<div class="qb-dpair" data-k="${esc(DEDUP_KEY(p))}" data-a="${esc(p.a.id)}" data-b="${esc(p.b.id)}" data-del="a">
    <div class="qb-dph"><span class="qb-dpk">第 ${k} 对</span><span class="qb-dpw">${esc(p.why || '疑似重复')}</span><span class="qb-dpst">删上面</span></div>
    ${qbDedupSide(p.a, 'a')}
    ${qbDedupSide(p.b, 'b')}
  </div>`;
/* 画当前那一栏：操作条（整栏快捷 + 删除按钮）+ 这一栏的题对。其余栏不渲染。 */
function qbDedupPaint() {
  const U = DEDUP_UI, box = $('qbDedupBody'); if (!U || !box) return;
  const list = U.by[U.tab] || [];
  box.innerHTML = `<div class="qb-dpane" data-pane="${U.tab}">
    <div class="qb-dbar">
      <div class="qb-dquick">
        <button type="button" class="sm" data-dall="a" title="这一栏的每一对都删上面那道">删上面</button>
        <button type="button" class="sm" data-dall="b" title="这一栏的每一对都删下面那道">删下面</button>
        <button type="button" class="sm" data-dall="" title="这一栏一对都不动">都留着</button>
      </div>
      <span class="note qb-dhint">${esc(DEDUP_HINT[U.tab] || '')}</span>
      <button type="button" class="pri sm" data-dgo>删除选中的 <b>0</b> 道</button>
    </div>
    <div class="qb-dl">${list.map((p, i) => qbDedupPairHtml(p, i + 1)).join('')}</div>
  </div>`;
  box.querySelectorAll('.qb-dside').forEach(b => b.onclick = () => {
    const card = b.closest('.qb-dpair'); if (!card || !DEDUP_UI) return;
    const k = card.dataset.k, side = b.dataset.side;
    /* 点某一道 = 改成删它；再点已经选中的那道 = 这对不动 */
    DEDUP_UI.del.set(k, DEDUP_UI.del.get(k) === side ? '' : side);
    qbDedupSync();
  });
  box.querySelectorAll('[data-dall]').forEach(b => b.onclick = () => {
    if (!DEDUP_UI) return;
    const v = b.dataset.dall;
    box.querySelectorAll('.qb-dpair').forEach(c => DEDUP_UI.del.set(c.dataset.k, v));
    qbDedupSync();
  });
  const go = box.querySelector('[data-dgo]'); if (go) go.onclick = qbDedupDel;
  qbDedupSync();
  const sum = $('qbDedupSum'); if (sum) sum.innerHTML = qbDedupSumText();
}
/* 把 DEDUP_UI.del 刷回 DOM：每张卡的 data-del、两边「将删除 / 保留」、整栏快捷按钮高亮、
   删除按钮上的 N（本栏选中要删的题**去重后**的数量）。 */
function qbDedupSync() {
  const U = DEDUP_UI, box = $('qbDedupBody'); if (!U || !box) return;
  const cards = [...box.querySelectorAll('.qb-dpair')];
  const ids = new Set();
  cards.forEach(card => {
    const k = card.dataset.k;
    if (!U.del.has(k)) U.del.set(k, 'a');
    const d = U.del.get(k);
    card.dataset.del = d;
    const st = card.querySelector('.qb-dpst');
    if (st) st.textContent = d === 'a' ? '删上面' : d === 'b' ? '删下面' : '这对不动';
    card.querySelectorAll('.qb-dside').forEach(s => {
      const on = !!d && s.dataset.side === d;
      s.setAttribute('aria-pressed', on ? 'true' : 'false');
      const tag = s.querySelector('.qb-dtag');
      if (tag) tag.textContent = on ? '将删除' : '保留';
    });
    if (d) ids.add(String(d === 'a' ? card.dataset.a : card.dataset.b));
  });
  /* 整栏都是同一个选择时，那颗快捷按钮亮起来（混着选就都不亮） */
  box.querySelectorAll('[data-dall]').forEach(b => {
    const v = b.dataset.dall;
    b.classList.toggle('on', !!cards.length && cards.every(c => U.del.get(c.dataset.k) === v));
  });
  const go = box.querySelector('[data-dgo]');
  if (go) {
    go.disabled = !ids.size;
    const n = go.querySelector('b'); if (n) n.textContent = ids.size;
  }
}
/* 删当前这一栏里选中的（去重后的 id）。删完：
     · 存一份整行快照（题池顶上的「撤销删除」用）；
     · 把「引用了被删题」的题对一起撤掉（含**其它 tab** 里 data-a / data-b 指向它的）；
     · 某一栏空了就把这个 tab 一起摘掉，并自动切到还有内容的那一栏；
     · 弹层不关，剩下的 tab 还能接着删 —— 不用为了删另一类再花一次 AI 额度。 */
async function qbDedupDel() {
  const U = DEDUP_UI, box = $('qbDedupBody'); if (!U || !box) return;
  const tn = (DEDUP_TAB.find(t => t.k === U.tab) || {}).name || '这一栏';
  const cards = [...box.querySelectorAll('.qb-dpair')];
  const ids = [...new Set(cards.filter(c => U.del.get(c.dataset.k))
    .map(c => +(U.del.get(c.dataset.k) === 'a' ? c.dataset.a : c.dataset.b)))];
  if (!ids.length) return toast('这一栏一道都没选');
  if (!await hxConfirm(`删除「${tn}」里选中的 ${ids.length} 道题？\n\n删完题池顶上会出现「撤销删除」，点一下能整批找回来。其它两栏一道都不动。`)) return;
  const fail = m => { const e = $('qbDedupErr'); if (e) { e.textContent = m; e.hidden = false; } };
  const tok = HXBusy.begin(box.querySelector('[data-dgo]'), '正在删…');
  const gone = new Set();
  try {
    for (const id of ids) {
      const r = await MAT_call('hx_exam_qbank_del', { p_id: id });
      if (r.ok) gone.add(String(id));
      else if (r.err) fail('删第 ' + id + ' 道失败：' + r.err);
    }
  } finally { HXBusy.end(tok); }
  if (!gone.size) return;
  qbUndoSnap([...gone]);          // 这几道还在 QB_ALL 里，趁现在抄整行快照
  /* 本地先同步，省一次重拉 */
  QB_ALL = QB_ALL.filter(q => !gone.has(String(q.id)));
  gone.forEach(id => QB_SEL.delete(String(id)));
  /* 撤掉引用了被删题的题对（三个 tab 全扫，不只是当前这一栏），再删掉已经不存在的选择状态 */
  DEDUP_TAB.forEach(t => { U.by[t.k] = U.by[t.k].filter(p => !gone.has(String(p.a.id)) && !gone.has(String(p.b.id))); });
  const live = new Set();
  DEDUP_TAB.forEach(t => U.by[t.k].forEach(p => live.add(DEDUP_KEY(p))));
  [...U.del.keys()].forEach(k => { if (!live.has(k)) U.del.delete(k); });
  qbDrawStat(); qbDraw();
  toast('删了 ' + gone.size + ' 道（' + tn + '），顶部可以撤销');
  const left = DEDUP_TAB.filter(t => U.by[t.k].length);
  if (!left.length) {
    DEDUP_UI = null; zlModalClose(); qbLoad(); loadSubjects(true); return;
  }
  if (!U.by[U.tab].length) U.tab = left[0].k;   // 这一栏删空了：自动切到还有内容的
  qbDedupSeg();
  qbDedupPaint();
}

/* ---------------- 撤销删除（2026-11-20） ----------------
   用户原话「撤销删除也需要」—— 删题只是从题池移走，整行内容都还在前端（QB_ALL）里。
   删成功之后把这几十个字段抄一份存着，题池顶上给一条「刚删掉 N 道题，还能找回来」，
   点撤销用**一次** hx_exam_qbank_add 整批写回（题池编号会变，内容 / 图 / 小节 / 知识点不变）。
   快照跟着科目走：只有当前科目 == DEDUP_UNDO_SID 时才显示撤销条，
   切到别的科目就把快照丢掉 —— 别把电气题写进单片机。 */
const DEDUP_UNDO_MAX = 500;   // hx_exam_qbank_add 一次最多收 500 条
let DEDUP_UNDO = [], DEDUP_UNDO_SID = null;
function qbUndoSnap(ids) {
  const sid = MAT_sid(); if (sid == null) return;
  if (DEDUP_UNDO_SID == null || String(DEDUP_UNDO_SID) !== String(sid)) DEDUP_UNDO = [];
  DEDUP_UNDO_SID = sid;
  ids.forEach(id => {
    const q = QB_ALL.find(x => String(x.id) === String(id)); if (!q) return;
    /* 字段照 hx_exam_qbank_add 认的那一套抄，多抄一个就少丢一点 */
    DEDUP_UNDO.push({
      t: q.t, ch: q.ch == null ? null : q.ch, sec: q.sec || null, secTitle: q.secTitle || null,
      fig: q.fig || null, q: q.q, o: q.o || null, a: q.a, code: q.code || null, sub: q.sub || null,
      explanation: q.explanation || null, knowledge: q.knowledge || null, src: q.src || ''
    });
  });
  if (DEDUP_UNDO.length > DEDUP_UNDO_MAX) DEDUP_UNDO = DEDUP_UNDO.slice(-DEDUP_UNDO_MAX);
  qbUndoPaint();
}
function qbUndoPaint() {
  const bar = $('qbUndoBar'); if (!bar) return;
  const sid = MAT_sid();
  const same = DEDUP_UNDO.length && sid != null && DEDUP_UNDO_SID != null && String(DEDUP_UNDO_SID) === String(sid);
  if (!same) { bar.hidden = true; return; }
  const n = $('qbUndoN'); if (n) n.textContent = DEDUP_UNDO.length;
  bar.hidden = false;
}
function qbUndoDrop() { DEDUP_UNDO = []; DEDUP_UNDO_SID = null; qbUndoPaint(); }
async function qbUndoDo() {
  const n = DEDUP_UNDO.length; if (!n) return;
  const sid = MAT_sid();
  if (sid == null || DEDUP_UNDO_SID == null || String(DEDUP_UNDO_SID) !== String(sid)) { qbUndoDrop(); return toast('科目换了，那批题找不回来了'); }
  if (!await hxConfirm(`把刚删掉的 ${n} 道题写回题池？\n\n题池里的编号会变；题干 / 选项 / 答案 / 图 / 小节 / 知识点都按删之前原样写回。`)) return;
  const tok = HXBusy.begin($('qbUndoGo'), '正在恢复…');
  try {
    const r = await MAT_call('hx_exam_qbank_add', { p_subject_id: sid, p_items: DEDUP_UNDO.slice(0, DEDUP_UNDO_MAX), p_material_id: null });
    if (!r.ok) { MAT_banner('恢复失败：' + r.err); HXBusy.end(tok, r.err); return; }
    const got = (r.data && r.data.added) || 0;
    qbUndoDrop();
    toast('已找回 ' + got + ' 道');
    qbLoad();
    loadSubjects(true);   // 题数变了：科目卡的计数要重算
  } finally { HXBusy.end(tok); }
}

/* ---------------- 改一道题 ---------------- */
function qbEdit(id) {
  const q = QB_ALL.find(x => String(x.id) === String(id)); if (!q) return;
  const opts = Array.isArray(q.o) ? q.o.map(o => o.key + '. ' + o.text).join('\n') : '';
  /* 大题（含自建题型）的答案可能是「一问一行的数组」（2026-11-21）：
     编辑框里也一行一条，保存时按行拆回数组 —— 以前 String(数组) 会显示成「甲,乙」，
     一保存就把几个小问压成一段，老师自己改一次等于把分好的小问又改坏了。 */
  const ans = q.t === 'fill' ? (Array.isArray(q.a) ? q.a : [q.a]).join('\n')
    : q.t === 'judge' ? ''
      : Array.isArray(q.a) ? q.a.join('\n') : String(q.a == null ? '' : q.a);
  const jv = q.a === true || q.a === 'true' || q.a === 'T';
  /* 选项本身是符号图的（o.fig）：文本框里没法画图，所以标明是哪几个，保存时按字母把原图接回去 */
  const optFigs = {};

  const figKeys = Object.keys(optFigs);
  /* 2026-11-20 加「图」：题池能存图题的符号 id（'fu' / 'qf3'）。编辑时能看见现在是什么图、
     能换成别的符号、能去掉图。以前改一道带图的题会把图洗干净（it 里根本没有 fig）。 */
  /* 位图和符号 id 分开看：curImgUrl = 上传试卷里的原图（o.img，或旧数据 fig 的 img: 前缀），
     curFig = 符号库的 key。两者互斥，保存时按老师在下拉里选的那一项落。 */
  const curImgUrl = QB_URL(q);
  const curFig = (!curImgUrl && q.fig && QB_HASFIG(q)) ? q.fig : '';
  const curIsImg = !!curImgUrl;
  zlModal(`<h2>改题 · ${esc(QB_CN[q.t] || q.t)}${(curFig || curImgUrl) ? ' · 带图' : ''}</h2>
    <label class="zl-f">题干<textarea id="qeQ" rows="3">${esc(q.q)}</textarea></label>
    <!-- 2026-11-20：这一栏原来叫「符号图」、第一项是「不加图」，老师以为是「让我选一张图配上」，
         用户原话「叫我改就加图？原来是啥图就是啥图啊，我哪知道用啥图」。改成：
         · 标题写明「不动就保持原图」，第一项明说这是「去掉图」（本题不要图）；
         · 选中的默认值就是原图（curFig），什么都不动 → 保存后还是原来那张图。 -->
    <label class="zl-f">图（不动就保持原图）<select id="qeFig">
        <option value="">去掉图（本题不要图）</option>
        ${curIsImg ? `<option value="__img" selected>当前图片（上传试卷里的原图，不换）</option>` : ''}
        ${HXFig.list.map(k => `<option value="${esc(k)}"${k === curFig ? ' selected' : ''}>${esc(HXFig.figName(k) || k)}（${esc(k)}）</option>`).join('')}
      </select></label>
    <p class="note" style="margin:-6px 0 10px">这里只是换图 / 去图，不改就保持原样；AI 出的题如果没带图，这里也可以给它挂一张。</p>
    <div class="qb-figpick" id="qeFigPrev"${(curFig || curImgUrl) ? '' : ' hidden'}>${curImgUrl ? `<img src="${esc(curImgUrl)}" alt="配图" style="max-height:200px;max-width:100%;object-fit:contain">` : (curFig ? HXFig.figSvg(curFig, true) : '')}</div>
    ${q.t === 'choice' ? `<label class="zl-f">选项（一行一个，A. 开头）<textarea id="qeO" rows="4">${esc(opts)}</textarea></label>
      ${figKeys.length ? `<p class="note" style="margin:-6px 0 10px">选项 ${esc(figKeys.join(' / '))} 本身是图形符号（${esc(figKeys.map(k => HXFig.figName(optFigs[k]) || optFigs[k]).join('、'))}），保存时按字母把原图接回去。</p>` : ''}` : ''}
    <!-- 2026-11-21：原来这一栏只给 prog 显示，自建题型（如单片机「实操题」）的 code
         （= 参考示例代码）在界面上既看不见也改不了，老师没法补 / 换示例代码。
         现在自建题型也显示这一栏，标题改口说清「可空、只出现在参考答案里」——
         老师原话「实操题没有标准答案，仅供参考……第一小问也是看实际情况，但是可以给个参考示例代码」。 -->
    ${q.t === 'prog' || QB_IS_CUSTOM(q.t) ? `<label class="zl-f">${q.t === 'prog' ? '程序' : '参考示例代码（可空，只出现在参考答案里，不印在卷面）'}<textarea id="qeCode" rows="5" class="mono">${esc(q.code || '')}</textarea></label>` : ''}
    ${q.t === 'judge' ? `<label class="zl-f">答案<select id="qeJ"><option value="T" ${jv ? 'selected' : ''}>正确</option><option value="F" ${jv ? '' : 'selected'}>错误</option></select></label>`
      : `<label class="zl-f">${QB_IS_CUSTOM(q.t) ? '参考要点（一问一行；本题没有标准答案，只作参考）' : '答案' + (q.t === 'choice' ? '（字母，如 A 或 AC）' : q.t === 'fill' ? '（每空一行）' : '（一问一行：一个大题两个小问就写两行）')}<textarea id="qeA" rows="${q.t === 'choice' ? 1 : q.t === 'fill' ? 3 : 4}">${esc(ans)}</textarea></label>`}
    <label class="zl-f">解析<textarea id="qeE" rows="2">${esc(q.explanation || '')}</textarea></label>
    <div class="errs" id="qeErr" hidden></div>
    <div class="row"><button class="pri" id="qeSave">保存</button><button id="qeCancel">取消</button></div>`);
  $('qeCancel').onclick = zlModalClose;
  const fsel = $('qeFig'), fprev = $('qeFigPrev');
  if (fsel && fprev) fsel.onchange = () => {
    if (fsel.value === '__img') { fprev.hidden = false; fprev.innerHTML = `<img src="${esc(curImgUrl)}" alt="配图" style="max-height:200px;max-width:100%;object-fit:contain">`; return; }
    const v = fsel.value && HXFig.hasFig(fsel.value) ? fsel.value : '';
    fprev.hidden = !v; fprev.innerHTML = v ? HXFig.figSvg(v, true) : '';
  };
  $('qeSave').onclick = async () => {
    const fail = m => { $('qeErr').textContent = m; $('qeErr').hidden = false; };
    /* 位图（上传试卷的原图）现在存在 o.img，不在 fig 里 —— 选「当前图片（不换）」时必须把它原样带回去，
       否则老师只改一个错别字，配图也会被洗掉。 */
    const keepImg = fsel && fsel.value === '__img' && curImgUrl ? curImgUrl : '';
    const figV = keepImg ? null : (fsel && fsel.value && HXFig.hasFig(fsel.value) ? fsel.value : null);
    /* sec / secTitle 也要带上：改题 = 新增一条 + 删旧的一条，这里漏了的话
       改完小节角标就消失了（2026-11-20 一并修的）。 */
    const it = { t: q.t, ch: q.ch, sec: q.sec || null, secTitle: q.secTitle || null, fig: figV, q: $('qeQ').value.trim(), o: null, a: null, code: q.code || null, sub: q.sub || null, explanation: $('qeE').value.trim(), knowledge: q.knowledge || null, src: q.src || '' };
    if (!it.q) return fail('题干不能空');
    if (q.t === 'choice') {
      it.o = $('qeO').value.split('\n').map(s => s.trim()).filter(Boolean).map((s, i) => {
        const m = s.match(/^([A-Za-z])[.、:：)）]\s*(.*)$/);
        return m ? { key: m[1].toUpperCase(), text: m[2] } : { key: String.fromCharCode(65 + i), text: s };
      });
      /* 图形选项：把原图接回去（按字母），否则保存后 A/B 变空选项 */
      it.o.forEach(o => { if (optFigs[o.key]) o.fig = optFigs[o.key]; });
      it.a = $('qeA').value.toUpperCase().replace(/[^A-Z]/g, '');
      if (it.o.length < 2) return fail('选项至少 2 个');
      if (!it.a || [...it.a].some(k => !it.o.some(o => o.key === k))) return fail('答案要是选项里的字母');
    } else if (q.t === 'judge') {
      it.o = q.o || [{ key: 'T', text: '正确' }, { key: 'F', text: '错误' }];
      it.a = $('qeJ').value === 'T';
    } else if (q.t === 'fill') {
      it.a = $('qeA').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!it.a.length) return fail('答案不能空');
      if (!/_{2,}/.test(it.q)) return fail('填空题题干里要有 ____');
    } else {
      /* 一行一条 = 一个小问一条；只有一行就照旧存字符串（老数据、单问大题都不受影响） */
      const lines = $('qeA').value.split('\n').map(s => s.trim()).filter(Boolean);
      it.a = lines.length > 1 ? lines : (lines[0] || '');
      if (!it.a) return fail('答案不能空');
      /* 2026-11-21：以前只有 prog 才读 code，自建题型的参考示例代码改了也不存。
         改成「框在就读」——qeCode 只有 prog / 自建题型才有，其余题型这里 $() 拿到 null，跳过。
         it 里本来就带着 code: q.code || null，没这一栏时不会被写成 undefined。 */
      const codeEl = $('qeCode');
      if (codeEl) it.code = codeEl.value.replace(/\s+$/, '') || null;
    }
    /* 位图回填：选择题要包成 {opts, img}（hxChoices 认这个形状），其余题型就是 {img}。
       放在整个 if/else 之后，才不会又被各分支的 it.o = … 覆盖掉。 */
    if (keepImg) it.o = (q.t === 'choice' && Array.isArray(it.o)) ? { opts: it.o, img: keepImg } : { img: keepImg };
    /* 2026-11-15：「改」是两次网络（先加新的一条、再删旧的一条），比删单题还慢。
       原来只把按钮灰掉，界面上没有任何「在忙」的迹象；现在按钮转圈 + 计时。 */
    /* 2026-11-20：改成**就地更新**（hx_exam_qbank_update，id 不变）。
       以前是「加一条新的 + 删旧的」，题池编号会变 —— 而刷题里那份副本的 id 是
       `<题库id>-zl-<题池编号>`，编号一变就再也对不上，题池改了题、刷题那边永远停在旧版。
       编号稳定之后，改题只要调一次 quiz_sync_questions 就能把副本刷成最新的。 */
    const tok = HXBusy.begin($('qeSave'), '正在保存…');
    try {
      const upd = await MAT_call('hx_exam_qbank_update', { p_id: +q.id, p_patch: it });
      if (!upd.ok) { const m = upd.err || '云端没收下'; fail('保存失败：' + m); HXBusy.end(tok, m); return; }
      zlModalClose();
      /* 本地先改，省一次整表重拉 */
      Object.assign(q, it);
      QB_SEL.delete(String(q.id));
      const sy = await qbSyncQuiz([q]).catch(() => null);
      toast('已保存' + (sy && sy.updated ? `，刷题那份同步了 ${sy.updated} 道` : ''));
      qbLoad();
    } finally { HXBusy.end(tok); }
  };
}

/* ---------------- 题池改了题 → 刷题那份副本跟着更新（2026-11-20） ----------------
   老师原话：「题池题干等有修改 全站调用该题都需要更新 包括了刷题」。
   刷题 quiz_public.questions 里存的是**发布那一刻抄的一份** jsonb，题池后面改了题干 /
   选项 / 答案，刷题那边一个字都不会变；排行榜判对用的 quiz_rank_keys 也是抄的。
   服务端 quiz_sync_questions 按题 id 整条替换（number 题号保留）+ upsert 标准答案，一个事务。
   只更新**已经发布过**的题：id 对不上的服务端直接跳过，不会凭空往题库里塞新题。 */
async function qbSyncQuiz(rows) {
  const s = curSub();
  if (!s || !s.quiz_bank) return { skipped: 'no_bank' };
  const items = [];
  rows.forEach(r => {
    const z = ZL_toQuiz(r, s.quiz_bank);
    if (z && z.q && z.q.id) items.push(z.q);
  });
  if (!items.length) return { skipped: 'none' };
  const r = await MAT_call('quiz_sync_questions', { p_bank: s.quiz_bank, p_items: items });
  if (!r.ok) throw new Error(r.err || '同步失败');
  return r.data || {};
}
/* 工具栏那颗「同步到刷题」：把本科目题池按现状整体刷一遍（分批 300 道） */
async function qbSyncAll(btn) {
  const s = curSub(); if (!s) return;
  if (!s.quiz_bank) return toast('本科目还没绑定刷题题库 id，先「发布到刷题」一次');
  if (!QB_ALL.length) return toast('题池是空的');
  if (!await hxConfirm(`把本科目题池的 ${QB_ALL.length} 道题按现状同步到刷题「${s.quiz_bank}」？\n\n只更新**已经发布过**的题（题干 / 选项 / 答案 / 解析 / 小节），不会往题库里新增题；排行榜用的标准答案也跟着换。`)) return;
  const tok = HXBusy.begin(btn, '正在同步…');
  try {
    let up = 0, sent = 0;
    for (let i = 0; i < QB_ALL.length; i += 300) {
      const r = await qbSyncQuiz(QB_ALL.slice(i, i + 300));
      up += r.updated || 0; sent += r.sent || 0;
      if (i + 300 < QB_ALL.length) await new Promise(res => setTimeout(res, 60));
    }
    if (!up) MAT_banner('刷题题库里没有一道题对得上题池 —— 多半还没发布过，先用「发布到刷题」发一次。');
    else toast(`同步完成：更新 ${up} 道（送出 ${sent}）`);
  } catch (e) { MAT_banner('同步失败：' + ((e && e.message) || e)); }
  finally { HXBusy.end(tok); }
}

/* ---------------- 题池 → 刷题格式 ---------------- */
const ZL_norm = s => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
/* 一行题池 → 一道刷题题目（字段照 刷题/data/*.json：id/number/type/stem/options/answer/explanation/source，
   程序题另带 code/sub）。转不了的返回 { skip: 原因 }。
   题 id = <题库 id>-zl-<题池编号>：同一道题再发一次 id 一样，自然被去重。 */
function ZL_toQuiz(r, bank) {
  const stem = String((r && r.q) || '').trim();
  if (!stem) return { skip: '题干是空的' };
  /* 2026-11-19：刷题端题型收敛到单选 / 判断 / 填空三种（多选、名词解释、简答、程序分析
     暂时没需求，题库里那 432 道也删了）。这边必须跟着收，否则发过去刷题页认不出题型、
     学生「发布成功却刷不到」。小节 sec 照样带过去，刷题卡片上有角标。 */
  const sec = (r.sec && /^[0-9]+(\.[0-9]+)*$/.test(String(r.sec).trim())) ? String(r.sec).trim() : null;
  /* 2026-11-20：图题。fig 是符号 id（'fu' / 'qf3'），图本身在 刷题/symbols.js 里画。
     以前这条不带 fig，题池里带图的题发到刷题就变成「看图说话」的瞎题。 */
  const fig = (r.fig && HXFig.hasFig(r.fig)) ? String(r.fig) : null;
  const q = { id: bank + '-zl-' + r.id, number: 0, type: '', stem, options: [], answer: [], explanation: String(r.explanation || ''), source: String(r.src || '资料库'), sec, secTitle: sec && r.secTitle ? String(r.secTitle) : null };
  if (fig) q.fig = fig;
  const a = r.a;
  switch (r.t) {
    case 'choice': {
      /* 选项也可能是一张符号图（刷题里 o.fig）：题干是「图中的符号表示（ ）」这种题，
         选项 A/B 本身就是图。带图的选项 text 留空、fig 带上，刷题那边才画得出来。 */
      q.options = (Array.isArray(r.o) ? r.o : []).map((o, i) => {
        const op = { key: String((o && o.key) || String.fromCharCode(65 + i)).toUpperCase(), text: String(o && o.text != null ? o.text : '') };
        if (o && o.fig && HXFig.hasFig(o.fig)) op.fig = String(o.fig);
        return op;
      });
      if (q.options.length < 2) return { skip: '选择题选项少于 2 个' };
      const keys = new Set(q.options.map(o => o.key));
      const raw = Array.isArray(a) ? a.join('') : String(a == null ? '' : a);
      q.answer = [...new Set(raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean))];
      if (!q.answer.length) return { skip: '选择题没有答案' };
      if (q.answer.some(k => !keys.has(k))) return { skip: '答案不在选项里' };
      if (q.answer.length > 1) return { skip: '多选题暂时不发布（刷题只做单选、判断、填空）' };
      q.type = 'single';
      break;
    }
    case 'judge': {
      const v = a === true || a === 'true' || a === 'T' ? 'T' : a === false || a === 'false' || a === 'F' ? 'F' : '';
      if (!v) return { skip: '判断题答案不是对/错' };
      q.type = 'judgment'; q.options = [{ key: 'T', text: '正确' }, { key: 'F', text: '错误' }]; q.answer = [v];
      break;
    }
    case 'fill': {
      q.type = 'fill';
      q.answer = (Array.isArray(a) ? a : String(a == null ? '' : a).split(/[、，,；;|\n]+/)).map(x => String(x == null ? '' : x).trim()).filter(Boolean);
      if (!q.answer.length) return { skip: '填空题没有答案' };
      if (!/_{2,}/.test(stem)) return { skip: '填空题题干里没有 ____' };
      break;
    }
    case 'term': case 'short': case 'prog':
      return { skip: '名词解释 / 简答 / 程序分析暂时不发布（刷题只做单选、判断、填空）' };
    default: return { skip: '题型「' + (r && r.t) + '」刷题里没有' };
  }
  return { q };
}
/* 追加合并：已有的题一道不动；同 id 或同题型同题干（去空白）的算重复，不加。 */
function ZL_merge(existing, rows, bank) {
  const old = Array.isArray(existing) ? existing : [];
  const ids = new Set(old.map(q => String(q && q.id)));
  /* 去重键必须带 fig：图题的题干经常一模一样（「图中的图形符号表示（ ）。」×N），
     靠题干判重会把 20 道不同的图题当成 1 道，只发出去 1 道。 */
  const dk = q => (q && q.type) + '|' + ZL_norm(q && q.stem) + '|' + String((q && q.fig) || '');
  const stems = new Set(old.map(dk));
  let num = old.reduce((m, q) => Math.max(m, +(q && q.number) || 0), 0);
  const added = [], skipped = [];
  let dup = 0;
  for (const r of rows) {
    const c = ZL_toQuiz(r, bank);
    if (c.skip) { skipped.push({ id: r.id, stem: String(r.q || '').slice(0, 20), reason: c.skip }); continue; }
    const k = dk(c.q);
    if (ids.has(c.q.id) || stems.has(k)) { dup++; continue; }
    c.q.number = ++num;
    ids.add(c.q.id); stems.add(k); added.push(c.q);
  }
  return { questions: old.concat(added), added, dup, skipped };
}
window.ZL = { toQuiz: ZL_toQuiz, merge: ZL_merge, OLD: ZL_OLD };

/* ---------------- 发布到刷题 ---------------- */
let PUB = null;   // 预览结果：{ bank, rows, got, row, merged, flagged, semErr, classes, teachers, name, owner }
let PUB_FORCE = new Set();   // 语义查重命中、但老师勾了「仍然追加」的题（按题目 id）
function pubOpen() {

  const rows = QB_ALL.filter(q => QB_SEL.has(String(q.id))).sort((a, b) => (+a.at || 0) - (+b.at || 0) || (+a.id) - (+b.id));
  if (!rows.length) return toast('先勾要发布的题');
  PUB = null; PUB_FORCE = new Set();
  /* 2026-11-15：用户问「这个题库 id 是啥」—— 光一个 placeholder 讲不清，所以在输入框下面
     补 4 行说明（.pb-hint 用现有 note 的字色，不另起一套样式）。说的就是三件事：
     它是什么、什么时候改不了、四个老题库为什么不能换。 */
  zlModal(`<h2>发布到刷题</h2>
    <label class="zl-f">目标题库 id<input id="pbBank" class="mono" maxlength="64" autocomplete="off" value="${esc(s.quiz_bank)}" ${s.quiz_bank ? 'readonly aria-readonly="true"' : 'placeholder="新题库的英文 id，如 dianzi-jichu"'}></label>
    <p class="note pb-hint">这是刷题工具里那份题库的英文标识，不是给学生看的名字。发布 = 往这份题库里追加题，不是新建一份。
    ${s.quiz_bank ? '科目已经绑了题库 id，这里改不了（绑上就是以后都往这份发）；要换回首页「管理 → 科目」改。' : '自己起一个英文 id，只能用 A-Z a-z 0-9 _ -，最多 64 位，例：dianzi-jichu。'}
    wiring / mcu / psychology / education 这四个老题库不能拿别的 id 顶：排位成绩按题库名对账，只能往里追加。</p>
    ${s.quiz_bank ? '' : '<div class="row"><button id="pbCheck">检查</button></div>'}
    <div id="pbInfo" class="pb-info">${s.quiz_bank ? fxLoad('正在读刷题题库…') : ''}</div>
    <div class="errs" id="pbErr" hidden></div>
    <div class="row"><button class="pri" id="pbGo" disabled>确认追加</button><button id="pbCancel">取消</button></div>`);
  if (window.HXLoadFx) HXLoadFx.auto($('pbInfo'));
  $('pbCancel').onclick = zlModalClose;
  $('pbGo').onclick = pubGo;
  if (s.quiz_bank) pubCheck(rows);
  else $('pbCheck').onclick = () => pubCheck(rows);
}

/* ---------------- 发布前的语义查重门槛（2026-11-15） ----------------
   用户原话：「我怕那边有重复题冗余，二次查重门槛截杀」。
   ZL_merge 只能挡「题型 + 题干去空白」完全相同的题；措辞不同、考点相同的题会一路追加进去，
   刷题题库越攒越臃肿。所以合并完之后再让 AI 比一遍「本轮新增 vs 目标题库已有」：
     · 只比新增 vs 已有，不做两两全比；新增按 30 道一批，批与批之间回调进度；
     · 已有题只取前 PUB_SEM_MAX_OLD 道、每道截 200 字 —— 题库再大也不至于把 prompt 撑爆
       （撑爆的表现就是请求超时，等于这道门槛白设）；
     · 命中只是「建议不追加」：界面上逐题给「仍然追加」的勾，AI 挂了也照常允许发布。 */
const PUB_SEM_MAX_OLD = 400, PUB_SEM_BATCH = 30;
const PUB_SEM_T = { single: '单选', multiple: '多选', judgment: '判断', fill: '填空', short: '简答', term: '名词解释', prog: '程序分析' };
async function pubSemAI(added, existing, onP) {
  const olds = (existing || []).slice(0, PUB_SEM_MAX_OLD)
    .map((q, i) => ({ i, t: PUB_SEM_T[q && q.type] || (q && q.type) || '', stem: String((q && q.stem) || '').slice(0, 200) }))
    .filter(x => x.stem);
  if (!olds.length) return [];
  const oldByI = new Map(olds.map(x => [x.i, x]));
  const oldBlock = olds.map(x => '[E' + x.i + ']（' + x.t + '）' + x.stem).join('\n');
  const batchN = Math.ceil(added.length / PUB_SEM_BATCH);
  const hit = new Map();                       // 按新增题 id 收，同一道题只报一次（保留第一条原因）
  for (let b = 0; b < batchN; b++) {
    if (onP) onP(b + 1, batchN);
    const chunk = added.slice(b * PUB_SEM_BATCH, (b + 1) * PUB_SEM_BATCH);
    const newBlock = chunk.map((q, i) => '[N' + (b * PUB_SEM_BATCH + i) + ']（' + (PUB_SEM_T[q.type] || q.type || '') + '）' + String(q.stem || '').slice(0, 200)).join('\n');
    const prompt = 'A 组是本轮要新加进这份题库的题，B 组是这份题库里已有的题。请找出「A 组某道题和 B 组某道题考的是同一个考点、可以算重复」的组合——'
      + '哪怕措辞不一样，只要考同一个知识点就算重复；只是同属一章但考点不同的不算。\n'
      + '只输出 JSON，格式：{"pairs":[{"a":A组编号,"b":B组编号,"why":"一句话说明为什么重复"}]}，没有重复就 {"pairs":[]}。\n'
      + 'A 组（新增）：\n' + newBlock + '\nB 组（已有）：\n' + oldBlock;
    const res = await hximpChat([{ role: 'system', content: '你是严谨的题库审题员，只返回合法 JSON。' }, { role: 'user', content: prompt }], { json: true });
    const obj = HXImp.parseJson(typeof res === 'string' ? res : JSON.stringify(res));
    const arr = (obj && obj.pairs) || [];
    if (!Array.isArray(arr)) continue;
    arr.forEach(p => {
      const q = added[+p.a], e = oldByI.get(+p.b);
      if (!q || !e) return;                    // 编号越界（模型瞎报）直接丢，宁漏不错杀
      const k = String(q.id);
      if (hit.has(k)) return;
      hit.set(k, { q, why: String(p.why || '疑似重复') + '（已有：' + String(e.stem).slice(0, 40) + '…）' });
    });
  }
  return [...hit.values()];
}
/* 「最后到底发哪些」：已有题原样不动，新增题去掉被门槛挡下且没勾「仍然追加」的那些，
   编号从已有题的最大 number 往下排（挡掉几道之后不留空洞）。 */
function pubFinal() {
  const P = PUB;
  if (!P) return { old: [], add: [], questions: [] };
  const old = P.got && Array.isArray(P.got.questions) ? P.got.questions : [];
  const flaggedIds = new Set(P.flagged.map(f => String(f.q.id)));
  const kept = P.merged.added.filter(q => !flaggedIds.has(String(q.id)) || PUB_FORCE.has(String(q.id)));
  let num = old.reduce((m, q) => Math.max(m, +(q && q.number) || 0), 0);
  const add = kept.map(q => { q.number = ++num; return q; });
  return { old, add, questions: old.concat(add) };
}
/* 把 PUB 画进弹层。勾「仍然追加」时整体重画（勾选状态存在 PUB_FORCE 里，不会丢）。 */
function pubPaint() {
  const P = PUB; if (!P) return;
  const info = $('pbInfo'), err = $('pbErr'), go = $('pbGo'); if (!info) return;
  const fin = pubFinal();
  const nOld = P.got ? P.got.questions.length : 0;
  const blocked = P.merged.added.length - fin.add.length;
  info.innerHTML = `<p>${P.got ? `刷题题库「${esc(P.name)}」现有 <b id="pbOld">${nOld}</b> 题，下发范围沿用：${esc(P.row.targets || '原样')}`
    : `新题库「${esc(P.name)}」，发布后只有你自己能刷，去刷题里再下发给班级`}</p>
    <p>本次选了 ${P.rows.length} 道：新增 <b id="pbAdd">${fin.add.length}</b> · 重复跳过 <b id="pbDup">${P.merged.dup}</b> · 转不了 <b id="pbSkip">${P.merged.skipped.length}</b>${blocked ? ` · 语义重复挡下 <b>${blocked}</b>` : ''}</p>
    ${P.merged.skipped.length ? `<ul class="pb-skip">${P.merged.skipped.map(x => `<li>「${esc(x.stem)}」：${esc(x.reason)}</li>`).join('')}</ul>` : ''}
    ${P.semErr ? `<p class="note">语义查重没跑成（${esc(P.semErr)}），这次只做了「完全相同」的去重，新增的题都照发；想稳一点可以关掉弹层重来一次。</p>` : ''}
    ${P.flagged.length ? `<p class="pb-sem">语义查重：这 <b>${P.flagged.length}</b> 道看着和题库里已有的题重复，默认不发。确认要发就勾「仍然追加」。</p>
      <ul class="pb-flag">${P.flagged.map(f => `<li><label class="pb-force"><input type="checkbox" data-pbforce="${f.q.id}" ${PUB_FORCE.has(String(f.q.id)) ? 'checked' : ''}>仍然追加</label>
        <span class="qb-dq">${esc(PUB_SEM_T[f.q.type] || f.q.type || '')} · ${esc(String(f.q.stem || '').slice(0, 60))}</span>
        <span class="note">${esc(f.why)}</span></li>`).join('')}</ul>` : ''}
    <p>发布后共 <b id="pbTotal">${fin.questions.length}</b> 题</p>`;
  info.querySelectorAll('[data-pbforce]').forEach(b => b.onchange = () => {
    b.checked ? PUB_FORCE.add(String(b.dataset.pbforce)) : PUB_FORCE.delete(String(b.dataset.pbforce));
    pubPaint();
  });
  go.disabled = !fin.add.length;
  if (!fin.add.length) { err.textContent = '没有可以新增的题'; err.hidden = false; }
  else err.hidden = true;
}
async function pubCheck(rows) {
  const s = curSub(), info = $('pbInfo'), err = $('pbErr'), go = $('pbGo');
  const fail = m => { info.innerHTML = ''; err.textContent = m; err.hidden = false; go.disabled = true; PUB = null; };
  err.hidden = true; go.disabled = true; PUB = null; PUB_FORCE = new Set();
  /* 2026-11-15：检查要连着打四五次网络（题库列表 → 现有题 → 语义查重按批走），
     原来只有一行「正在读刷题题库…」，之后就没动静了。现在按钮转圈 + 计时，
     #pbInfo 里逐段把当前在干什么写出来（尤其是语义查重到第几批）。 */
  const tok = HXBusy.begin($('pbCheck'), '正在检查…');
  try {
    const bank = $('pbBank').value.trim();
    if (!ZL_BANK_RE.test(bank)) { fail('题库 id 只能是英文、数字、下划线、连字符（最长 64 位）'); HXBusy.end(tok, 'id 不合法'); return; }
    info.innerHTML = '<p class="note">正在读刷题题库列表…</p>';
    let list;
    try { list = await rpc('quiz_public_list'); } catch (e) { fail('读不到刷题题库列表：' + e.message); HXBusy.end(tok, e.message); return; }
    const row = (Array.isArray(list) ? list : []).find(x => x.id === bank) || null;
    const old = ZL_OLD.has(bank);
    if (row && !row.mine && !old) { fail('题库 id「' + bank + '」是别的老师的题库，不能往里发。换一个新的 id。'); HXBusy.end(tok, '不是自己的题库'); return; }
    info.innerHTML = '<p class="note">正在读「' + esc(bank) + '」里现有的题…</p>';
    let got = null;
    try { got = await rpc('quiz_public_get', { p_id: bank }); } catch (e) { fail('读不到刷题题库「' + bank + '」：' + e.message); HXBusy.end(tok, e.message); return; }
    if (got && !Array.isArray(got.questions)) got = null;
    if (!got && old) { fail('「' + bank + '」是刷题内置题库，云端还没有它（还是随代码发布的本地文件）。先在刷题设置页把内置题库搬到账号里，再来追加；直接发会生成一份只有新题的同名题库，把内置的题盖掉。'); HXBusy.end(tok, '云端还没有内置题库'); return; }
    if (!got && row) { fail('列表里有「' + bank + '」但取不到题目，先别发，刷新再试。'); HXBusy.end(tok, '取不到题目'); return; }
    if (got && !row) { fail('读不到「' + bank + '」原来的下发范围，先别发（不然会改掉它发给谁）。'); HXBusy.end(tok, '读不到下发范围'); return; }
    const merged = ZL_merge(got ? got.questions : [], rows, bank);
    /* 硬去重之后再过一道语义门槛：只有「本轮确实有新增」且「目标题库本来就有题」时才值得比，
       新题库 / 全是重复的情况直接跳过，省一次 AI 调用。 */
    let flagged = [], semErr = '';
    if (merged.added.length && got && got.questions.length) {
      info.innerHTML = '<p class="note">正在语义查重…</p>';
      try {
        flagged = await pubSemAI(merged.added, got.questions, (k, n) => {
          info.innerHTML = `<p class="note">正在语义查重（第 ${k}/${n} 批）…</p>`;
        });
      } catch (e) {
        // 语义查重只是「建议」，挂了不能挡住发布：记下原因，界面照常给确认按钮
        semErr = (e && e.message) || String(e);
      }
    }
    PUB = {
      bank, rows, got, row, merged, flagged, semErr,
      name: got ? (got.name || bank) : s.name,
      owner: got ? (got.owner_name || '') : myName(),
      classes: got ? (row.class_ids === undefined ? null : row.class_ids) : [],
      teachers: got ? (row.teacher_ids === undefined ? null : row.teacher_ids) : null
    };
    pubPaint();
  } finally { HXBusy.end(tok); }
}
async function pubGo() {
  if (!PUB || !PUB.merged.added.length) return;
  const s = curSub(), go = $('pbGo'), err = $('pbErr');
  const P = PUB;
  const fin = pubFinal();
  if (!fin.add.length) { err.textContent = '没有可以新增的题'; err.hidden = false; return; }
  /* 2026-11-15：发布要整份题库回传（几百道题的 JSON），慢网下能等好几秒，
     原来只是把按钮灰掉，用户看不出在提交。现在按钮转圈 + 计时，失败原因同时挂在按钮上。 */
  const tok = HXBusy.begin(go, '正在发布…');
  let r;
  try {
    r = await rpc('quiz_publish', { p_id: P.bank, p_name: P.name, p_questions: fin.questions, p_owner_name: P.owner, p_classes: P.classes, p_teachers: P.teachers });
  } catch (e) {
    err.textContent = '发布失败：' + e.message; err.hidden = false;
    HXBusy.end(tok, e.message);
    return;
  }
  HXBusy.end(tok);
  const total = r && r.total != null ? +r.total : fin.questions.length;
  const nOld = P.got ? P.got.questions.length : 0;
  let note = '';
  if (s && !s.quiz_bank) {
    /* 新 id 发布成功后再记到科目上（先记后发，发失败了科目会白白挂一个不存在的题库） */
    try { await rpc('hx_exam_subject_save', { p_key: s.key, p_name: s.name, p_kind: s.kind, p_quiz_bank: P.bank }); await loadSubjects(true); }
    catch (e) { note = '（题已发布，但没能把题库 id 记到科目上：' + e.message + '）'; }
  }
  $('pbInfo').innerHTML = `<p class="ok" id="pbDone">已发布：「${esc(P.name)}」现在 ${total} 题（原 ${nOld} + 新增 ${fin.add.length}）${esc(note)}</p>`;
  PUB = null;
  $('pbGo').hidden = true; $('pbCancel').textContent = '关闭';
  if (total !== nOld + fin.add.length) MAT_banner('发布后题数对不上：云端 ' + total + '，预期 ' + (nOld + fin.add.length));
  cacheDrop('subjects');   // 科目卡上的题数跟着变了，下次读科目别再拿缓存
  /* 顺手把刷题那边同一份题库的缓存也作废：老师发完通常立刻去刷题看题到没到，
     不作废就要等最多 5 分钟（两边 key 各管各的，这里只做「尽力而为」，删不到也没关系）。 */
  try {
    var u = (sess && sess.user && sess.user.id) || 'guest';
    localStorage.removeItem('hx-quiz-cache-v1:' + u + ':publist');
    localStorage.removeItem('hx-quiz-cache-v1:' + u + ':pub:' + P.bank);
  } catch (e) { }
  toast('已发布到刷题');
}

;
boot().then(() => { if (window.HXLoadFx) HXLoadFx.finishBoot(); });
