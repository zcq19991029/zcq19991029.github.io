<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>资料库 · 华夏工具</title>
<link rel="icon" href="../logo.jpg">
<link rel="stylesheet" href="../hx-theme.css">
<script src="../hx-theme.js" data-tool="ziliao"></script>
<script src="../hx-ai.js"></script>
<style>/* 资料库工具样式。颜色全部来自 ../hx-theme.css（--bg/--ink/--dim/--card/--edge/--acc…，深浅色由 hx-theme.js 切）；
   这里只放布局和控件。排版规矩（华夏工具 2026-11-08）：主容器 width:min(1600px,100%)，不写 min-width 硬下限，
   表格 table-layout:fixed + word-break，390 竖屏不许横向溢出。 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg, #f5f5f7); color: var(--ink, #1d1d1f); font: 15px/1.6 var(--hx-font, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif); overflow-x: hidden; }
#app { width: min(1600px, 100%); margin: 0 auto; padding: 16px; }
h1, h2 { letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 0 0 12px; }
.mono { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; }
.note { color: var(--dim, #6e6e73); font-size: 13px; }
.ok { color: var(--ok, #248a3d); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: var(--card, #fff); border: 1px solid var(--edge, rgba(0, 0, 0, .08)); border-radius: 18px; padding: 18px; margin-bottom: 14px; min-width: 0; box-shadow: var(--glass-drop, 0 10px 30px -18px rgba(0, 0, 0, .25)); }
.errs { background: var(--badbg, rgba(215, 0, 21, .08)); color: var(--bad, #d70015); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 13.5px; word-break: break-word; }
.errs[hidden] { display: none; }
button, .btn { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line2, rgba(0, 0, 0, .12)); background: var(--fill, rgba(0, 0, 0, .04)); color: var(--ink, #1d1d1f); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; max-width: 100%; }
button:hover, .btn:hover { border-color: var(--acc, #2f845a); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.pri, .btn.pri { background: var(--acc, #2f845a); border-color: var(--acc, #2f845a); color: var(--on-acc, #fff); font-weight: 600; }
button.danger { color: var(--bad, #d70015); }
button.sm { padding: 5px 10px; font-size: 13px; }
.big { padding: 12px 22px; font-size: 16px; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--ink, #1d1d1f); background: var(--card-solid, #fff); border: 1px solid var(--line2, rgba(0, 0, 0, .12)); border-radius: 10px; padding: 7px 10px; max-width: 100%; min-width: 0; }
input[type=checkbox] { width: 16px; height: 16px; padding: 0; accent-color: var(--acc, #2f845a); flex: 0 0 auto; }
textarea { width: 100%; resize: vertical; }
table { width: 100%; table-layout: fixed; border-collapse: collapse; word-break: break-word; }
pre { white-space: pre-wrap; word-break: break-word; margin: 0; }

/* 外壳：左侧导航（页面 + 科目）+ 右侧主区；900 以下上下排 */
.zl-shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; width: min(1600px, 100%); margin: 0 auto; }
.zl-nav { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto; padding: 14px 10px; background: var(--card, #fff); border: 1px solid var(--edge, rgba(0, 0, 0, .08)); border-radius: 18px; min-width: 0; }
.zl-nav-h { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--dim, #6e6e73); padding: 4px 8px 6px; }
.zl-pages { display: grid; gap: 4px; margin-bottom: 14px; }
.zl-page { justify-content: flex-start; border: 0; background: transparent; }
.zl-page.on { background: var(--accbg, rgba(47, 132, 90, .14)); color: var(--acc, #2f845a); font-weight: 600; }
.zl-subs { display: grid; gap: 4px; }
.zl-subrow { display: flex; gap: 2px; align-items: stretch; border-radius: 12px; min-width: 0; }
.zl-subrow.on { background: var(--accbg, rgba(47, 132, 90, .14)); }
.zl-sub { flex: 1 1 auto; min-width: 0; display: grid; justify-content: stretch; justify-items: start; gap: 0; text-align: left; border: 0; background: transparent; padding: 7px 10px; }
.zl-sub b { font-weight: 600; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zl-sub span { font-size: 11.5px; color: var(--dim, #6e6e73); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zl-subrow.on .zl-sub b { color: var(--acc, #2f845a); }
.zl-subx { flex: 0 0 auto; border: 0; background: transparent; padding: 4px 7px; font-size: 12px; color: var(--dim, #6e6e73); }
.zl-subadd { width: 100%; margin-top: 6px; border-style: dashed; background: transparent; color: var(--dim, #6e6e73); }
.zl-subnote { font-size: 12px; color: var(--bad, #d70015); margin: 8px 4px 0; word-break: break-word; }
.zl-main { min-width: 0; }
.zl-h h1 { margin: 4px 0 14px; font-size: 28px; word-break: break-word; }
.zl-ch { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.zl-ch h2 { margin: 0; }
.zl-gate, .zl-empty { max-width: 460px; margin: 60px auto; display: grid; gap: 14px; text-align: center; justify-items: center; }
.zl-gate h1 { margin: 0; font-size: 24px; }
@media (max-width: 900px) {
  .zl-shell { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .zl-nav { position: static; max-height: none; }
  .zl-pages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .zl-subs { grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); }
  .zl-h h1 { font-size: 22px; }
}
@media (max-width: 480px) { #app { padding: 10px; } .card { padding: 14px; border-radius: 16px; } }

/* 弹层 */
.zl-modal { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .4); overflow: auto; }
.zl-mcard { width: min(620px, 100%); margin: 0; max-height: calc(100vh - 32px); overflow: auto; background: var(--card-solid, #fff); }
.zl-f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.zl-f input, .zl-f select { width: 100%; }
.pb-info p { margin: 6px 0; word-break: break-word; }
.pb-skip { margin: 4px 0 8px; padding-left: 18px; font-size: 13px; color: var(--dim, #6e6e73); }

/* 资料 */
.mat-drop { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px; border: 1px dashed var(--line2, rgba(0, 0, 0, .16)); border-radius: 14px; background: var(--fill, rgba(0, 0, 0, .03)); }
.mat-drop.on { border-color: var(--acc, #2f845a); background: var(--accbg, rgba(47, 132, 90, .1)); }
.mat-prog { margin: 10px 0 0; word-break: break-word; }
.mat-list { display: grid; gap: 8px; }
.mat-i { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 12px; background: var(--fill, rgba(0, 0, 0, .03)); }
.mat-m { display: grid; gap: 2px; min-width: 0; }
.mat-m b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mat-a { display: flex; flex-wrap: wrap; gap: 6px; }
.mat-v { margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--edge, rgba(0, 0, 0, .08)); }
.mat-segs { display: grid; gap: 8px; max-height: 480px; overflow: auto; overscroll-behavior: contain; }
.mat-seg pre { font-size: 13px; line-height: 1.7; padding: 8px 10px; border-radius: 8px; background: var(--fill, rgba(0, 0, 0, .03)); }
@media (max-width: 640px) { .mat-i { grid-template-columns: minmax(0, 1fr); } }

/* 出题 */
.mg-step { display: grid; gap: 8px; margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--edge, rgba(0, 0, 0, .08)); }
.mg-step > b { font-size: 13px; }
.mg-mats { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.mg-mats label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; max-width: 100%; min-width: 0; }
.mg-mats label span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mg-types { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.mg-types label, .mg-row label, .mg-wide { display: grid; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0; }
.mg-types input, .mg-row input, .mg-row select { width: 100%; }
.mg-row { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 720px) { .mg-row { grid-template-columns: minmax(0, 160px) minmax(0, 180px) minmax(0, 1fr); } }
.mg-wide { margin-top: 12px; }
.mg-res { margin-top: 14px; }
.mg-rh { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.mg-list { display: grid; gap: 6px; max-height: 460px; overflow: auto; overscroll-behavior: contain; }
.mg-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border-radius: 10px; background: var(--fill, rgba(0, 0, 0, .03)); font-size: 13.5px; cursor: pointer; }
.mg-q { display: grid; gap: 2px; min-width: 0; word-break: break-word; }
.mg-q b { color: var(--acc, #2f845a); font-size: 12px; }
.mg-rej { margin-top: 10px; font-size: 13px; }
.mg-rej ul { margin: 6px 0 0; padding-left: 18px; }

/* 题池 */
.qb-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.qb-stat { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
.qb-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qb-f label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.qb-list { display: grid; gap: 8px; }
.qb-i { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 12px; background: var(--fill, rgba(0, 0, 0, .03)); }
.qb-i > input { margin-top: 4px; }
.qb-body { min-width: 0; display: grid; gap: 4px; word-break: break-word; }
.qb-t { display: inline-block; margin-right: 8px; padding: 0 7px; border-radius: 6px; background: var(--accbg, rgba(47, 132, 90, .14)); color: var(--acc, #2f845a); font-size: 12px; font-weight: 600; }
.qb-o { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--dim, #6e6e73); }
.qb-code { font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: var(--card-solid, #fff); max-height: 220px; overflow: auto; }
.qb-a { font-size: 12.5px; color: var(--dim, #6e6e73); }
.qb-act { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 560px) { .qb-i { grid-template-columns: auto minmax(0, 1fr); } .qb-act { grid-column: 2; } }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 9500; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink, #1d1d1f); color: var(--bg, #fff); font-size: 14px; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 像素「正在载入」药丸 + 首屏闪屏：和 考试/src/app.css 同一套（产物单文件，自带一份保证方块跳得起来） */
.hx-px{display:inline-flex;align-items:flex-end;gap:.28em;height:2.2em}
.hx-px i{width:1em;height:1em;border-radius:.16em;display:block;background:linear-gradient(180deg,var(--acc,#2f845a),var(--acc2,#5aa77c));animation:hxPx 1.15s cubic-bezier(.32,.72,0,1) infinite;animation-delay:calc(var(--i) * 90ms)}
@keyframes hxPx{0%,100%{transform:translateY(0);opacity:.55}35%{transform:translateY(-110%);opacity:1}60%{transform:translateY(0);opacity:.7}}
.hx-loadpill{display:inline-flex;flex-direction:column;align-items:center;gap:.85em;padding:.9em 1.2em;border-radius:99px;background:var(--card-solid,#fff);color:var(--ink,#1d1d1f);border:1px solid var(--edge,rgba(0,0,0,.08));font-size:clamp(15px,.85vw + 6px,30px)}
.hx-loadpill .hx-px{font-size:.54em}
.hx-loadpill b{font-weight:600;font-size:.87em;line-height:1;white-space:nowrap}
.hx-loadpill.sm{flex-direction:row;gap:.6em;padding:.55em .9em;font-size:clamp(12px,.7vw + 4px,18px)}
.hx-loadpill.sm b{font-size:1em;color:var(--dim,#6e6e73)}
.hx-loadwrap{display:grid;place-items:center;padding:clamp(28px,4vw,56px) 12px}
.hx-loadwrap.sm{padding:0;min-height:40px}
html.hx-lite .hx-px i{animation:none;opacity:.85}
@media (prefers-reduced-motion:reduce){.hx-px i{animation:none;opacity:.85;transform:none}}
#hxBoot{position:fixed;inset:0;z-index:2147482000;display:grid;place-items:center;background:var(--card-solid,#f6f6f4);transition:opacity .26s ease,visibility 0s linear .26s}
#hxBoot.out{opacity:0;visibility:hidden;pointer-events:none}
#hxBoot .hx-boot-card{display:grid;place-items:center;gap:clamp(14px,2vh,30px);padding:24px}
#hxBootCv{image-rendering:pixelated;display:block;max-width:100%}
#hxBoot .hx-loadpill{font-size:clamp(16px,1.1vw + 9px,30px)}
.hx-boot-title{margin:0;font-size:clamp(20px,1.4vw + 12px,34px);font-weight:700}
html.hx-lite #hxBootCv{display:none}
</style>

      var dt = last ? Math.min((now - last) / 1000, 0.12) : 0;
      last = now; paint(dt);
      raf = requestAnimationFrame(step);
    }
    // 首帧（2026-11-05 返修）：
    //   · loop 特效：不少前 0.3～0.5 秒才长出主体，先在内存里按 1/60 步长预跑 0.35 秒
    //     （只 update，不 putImageData），再把这一帧一次性上屏，第一眼就有主体且继续在动；
    //   · one-shot 特效：第 0 帧就是峰值（实测 hit-spark t=0 实心 22.5%），预跑反而把动画放完，
    //     所以直接从 0 帧开播。预跑不建 rAF、不额外上屏，性能红线不变。
    if (!oneShot) for (var t = 0; t < 0.35; t += 1 / 60) fx.update(1 / 60);
    paint(0);
    last = performance.now();   // 下一帧直接吃真实 dt，不再补一帧 dt=0 的重复画面
    raf = requestAnimationFrame(step);
    return {
      stop: function () { stopped = true; if (raf) { cancelAnimationFrame(raf); raf = 0; } },
      fx: id
    };
  }

  // 造一条「方块 + 文字」药丸（回落时也用这一条，保证屏幕上永远只有一套加载语言）
  function pillEl(text) {
    var pill = document.createElement('div');
    pill.className = 'hx-loadpill sm';
    pill.setAttribute('role', 'status');
    var px = '<span class="hx-px" aria-hidden="true">', i;
    for (i = 0; i < 7; i++) px += '<i style="--i:' + i + '"></i>';
    pill.innerHTML = px + '</span><b></b>';
    pill.querySelector('b').textContent = text || '正在载入…';
    return pill;
  }

  // 页面内嵌版：往 host 里画「canvas + 药丸(方块+文字)」，返回 { el, done() }；播不了返回 null
  // opts.compact：面板/表格里的小号（2～4 倍、留白收紧）
  function mount(host, tool, text, full, opts) {
    var compact = !!(opts && opts.compact);
    if (!host || still()) return null;                 // 关动画 / 省电：回落，由调用方画药丸
    var cv = document.createElement('canvas');
    cv.className = 'hx-fxcv';
    var eng = start(cv, tool, compact);
    if (!eng) return null;                             // 包没出来 / canvas 建不出来：回落
    var pill = pillEl(text);
    var wrap = document.createElement('div');
    wrap.className = 'hx-fxwrap' + (full ? ' full' : '') + (compact ? ' panel' : '');
    wrap.setAttribute('aria-hidden', 'true');
    wrap.appendChild(cv); wrap.appendChild(pill);
    host.appendChild(wrap);
    // 最少停留（2026-11-05：420 → 640ms）：本地题库 30ms 就回来，秒闪一下反而像故障；
    // 面板小号也给足时间，短于 0.6 秒根本看不出像素在动。
    var at = performance.now(), MIN_SHOW = 640, out = false;
    return {
      el: wrap,
      fx: eng.fx,
      done: function () {                              // 淡出并整体移除；动效要活到移除那一刻
        if (out) return; out = true;
        setTimeout(function () {
          wrap.classList.add('out');
          // 2026-11-05 五修：**stop 必须放在移除之后**。原来先 eng.stop() 再淡出，
          // 数据一就绪（手机上 0.3~0.7s）画面就冻住，淡出的那 240ms 是一张静止图 ——
          // 用户看到的正是「一个像素动效的加载画面且不会动」。
          setTimeout(function () {
            if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
            eng.stop();
          }, 240);
        }, Math.max(0, MIN_SHOW - (performance.now() - at)));
      }
    };
  }

  // 首屏闪屏版（刷题 / 考试共用）：页面里先写好
  //   <div class="hx-boot" id="hxBoot"><div class="hx-boot-card"><canvas></canvas><div class="hx-loadpill sm">…</div></div></div>
  // 解析到它时（body 开头）就调 boot()：**第一帧就是 canvas 动效 + 药丸**，不会再出现裸文字阶段。
  // canvas 播不起来就把 canvas 藏掉，只留药丸（fallback 不空屏）。
  // finishBoot() 由工具在数据就绪后调：先保底 MIN_SHOW 再整层淡出移除。
  var bootH = null;
  // 2026-11-05：520 → 900ms。接线仿真在手机上约 0.7 秒就绪就淡出，动效刚进主体就被拿走；
  // 加载本来就在等，多留这三四百毫秒用户感知不到卡，却能从「一帧」变成「看得见在动」。
  var MIN_SHOW = 900;
  function boot(tool, overlayId) {
    var ov = document.getElementById(overlayId || 'hxBoot');
    if (!ov || ov.dataset.armed) return null;
    ov.dataset.armed = '1';
    var cv = ov.querySelector('canvas');
    var eng = still() ? null : start(cv, tool, false);
    if (!eng && cv) cv.style.display = 'none';
    bootH = { ov: ov, eng: eng, at: performance.now() };
    // 兜底：任何异常路径（网络卡死 / boot 抛错没走到 finishBoot）都不许把页面盖死，
    // 最多 8 秒强制收场，和 小组加分/fx/hx-jf-load.js 的 MAX_WAIT 同一思路。
    setTimeout(function () {
      if (bootH && bootH.ov === ov) finishBoot();
    }, 8000);
    return bootH;
  }
  function finishBoot() {
    if (!bootH) return;
    var b = bootH; bootH = null;
    // 2026-11-05 五修：**别在这里 stop 引擎**。工具准备好就会调本函数（手机 0.3~0.7s），
    // 而遮罩还得亮到 MIN_SHOW（900ms）。原来这里立刻 eng.stop()，于是引擎只画了第一帧，
    // 剩下的大半秒用户盯着一张冻图 —— 这就是「永远是一个像素动效的画面且不会动」的真因
    // （实测成品页 1.4 秒内 putImageData 只被调用 1 次）。停 rAF 只允许发生在移除之后。
    setTimeout(function () {
      b.ov.classList.add('out');                       // .hx-boot.out 淡出整层
      setTimeout(function () {
        if (b.ov.parentNode) b.ov.parentNode.removeChild(b.ov);
        if (b.eng) b.eng.stop();                       // 移除之后再停：淡出全程仍在动
      }, 300);
    }, Math.max(0, MIN_SHOW - (performance.now() - b.at)));
  }
  function booting() { return !!bootH; }

  // 面板加载占位：把 <div data-fxload="正在加载排行…"> 就地升级成 canvas+药丸；
  // 播不了（省电 / 包没出来）就填回回落药丸。面板重新渲染时占位节点被换掉，canvas 随之回收。
  function auto(root) {
    root = root || document;
    var list = root.querySelectorAll('[data-fxload]'), i;
    for (i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.dataset.fxdone) continue;
      el.dataset.fxdone = '1';
      var text = el.getAttribute('data-fxload') || '正在载入…';
      el.classList.add('hx-loadwrap', 'sm');
      var h = mount(el, el.getAttribute('data-fxtool') || 'panel', text, false, { compact: true });
      if (!h) el.appendChild(pillEl(text));
    }
  }

  window.HXLoadFx = {
    pick: function (tool) {                            // 供调试 / 自查：现抽一个（并记为「上一次」）
      return pickId(tool);
    },
    mount: mount,
    boot: boot,
    finishBoot: finishBoot,
    booting: booting,
    auto: auto
  };
})();
</script>
</head>
<body>
<div id="hxBoot" class="hx-boot" aria-hidden="true"><div class="hx-boot-card"><canvas id="hxBootCv" width="96" height="96"></canvas><p class="hx-boot-title">资料库</p><div class="hx-loadpill sm" role="status" aria-live="polite"><span class="hx-px" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i></span><b>正在载入…</b></div></div></div>
<script>HXLoadFx.boot('ziliao', 'hxBoot');</script>
<main id="app"></main>
<script>/* ================= 资料库工具 · 资料解析 + AI 出题引擎 =================
   来源：考试/src/imports.js（它又是 刷题/imports.js 的经典脚本版）原样拷来，2026-11-08 资料库独立成工具（Z2）。
   只改了三处：
     ① HXAI 调用的 tool 名从 'exam' 换成 'ziliao'（hx-ai.js 的 toolList 里还没有 ziliao 时，
        forTool 会落到「文本默认」那套，不影响使用）；
     ② chat 多透传一个 thinkLevel（quick/balanced/deep，不传 = 跟随那套配置自己的思考程度）；
     ③ 注释里的路径：产物在 /ziliao/index.html，解析组件在同目录 vendor/ 下（build.js 复制过去）。
   对外仍只挂 window.HXImp，函数名和签名不变。 */
'use strict';

const HXIMP_AI_MISS = '还没有配置 AI 模型，请到首页「AI 设置」里加一套';
const HXIMP_VISION_MISS = '要读图片／扫描件，得先在首页「AI 设置」里配一套支持图片的模型（如 Qwen-VL 这类看图模型）';
const HXIMP_LIB_MISS = '资料解析组件没加载到（可能是网络），TXT／MD 仍然可以直接用';

/* 解析组件按页面相对路径取：/ziliao/index.html → /ziliao/vendor/pdf.js */
const HXIMP_V = p => new URL('vendor/' + p, location.href).href;

let hximpAiLoading = null;
// 用到 AI 才加载 hx-ai.js；失败不报错，允许下次再试（线上可能还没部署这个文件）
function hximpAI() {
  if (window.HXAI) return Promise.resolve(window.HXAI);
  if (!hximpAiLoading) {
    hximpAiLoading = new Promise(resolve => {
      let s;
      try { s = document.createElement('script'); s.src = new URL('../hx-ai.js', location.href).href; }
      catch (e) { hximpAiLoading = null; return resolve(null); }
      s.onload = () => resolve(window.HXAI || null);
      s.onerror = () => { hximpAiLoading = null; resolve(null); };
      document.head.appendChild(s);
    });
  }
  return hximpAiLoading;
}
async function hximpChat(messages, opts) {
  const H = await hximpAI();
  if (!H || typeof H.chat !== 'function') throw new Error(HXIMP_AI_MISS);
  const o = { messages, tool: 'ziliao', json: !!(opts && opts.json) };
  if (opts && opts.thinkLevel) o.thinkLevel = opts.thinkLevel;
  return H.chat(o);
}
async function hximpVision(opts) {
  const H = await hximpAI();
  if (!H || typeof H.vision !== 'function') throw new Error(HXIMP_VISION_MISS);
  return H.vision(Object.assign({ tool: 'ziliao' }, opts));
}

const HXIMP_IMG = /\.(jpe?g|png|webp|gif|bmp)$/i;
const isImageFile = name => HXIMP_IMG.test(String(name || '').toLowerCase());

// 图片转 dataURL：最长边压到 1600px、JPEG 0.8。手机拍一页教材 4MB，原样发几张模型会直接拒。
function fileToDataUrl(file, max = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // 透明 PNG 铺白底，否则转 JPEG 会变黑块
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      } catch (e) { reject(new Error('图片处理失败：' + e.message)); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('这张图片读不出来（可能不是常见的 jpg/png）')); };
    img.src = url;
  });
}

/* 读一份资料 → { text } 或 { image }（图片不在这一步转文字，交给视觉模型） */
async function readMaterial(file) {
  const name = String(file && file.name || '').toLowerCase();
  if (isImageFile(name)) return { image: await fileToDataUrl(file), text: '' };
  if (/\.(txt|md|text)$/i.test(name)) return { text: await file.text() };
  if (name.endsWith('.docx')) {
    let m;
    try { m = await import(HXIMP_V('mammoth.browser.min.js')); }
    catch (e) { throw new Error(HXIMP_LIB_MISS); }
    const lib = globalThis.mammoth || (m && m.default) || m;
    if (!lib || !lib.extractRawText) throw new Error(HXIMP_LIB_MISS);
    const r = await lib.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { text: r.value || '' };
  }
  if (name.endsWith('.pdf')) {
    let pdfjs;
    try { pdfjs = await import(HXIMP_V('pdf.js')); }
    catch (e) { throw new Error(HXIMP_LIB_MISS); }
    pdfjs = pdfjs.default && pdfjs.default.getDocument ? pdfjs.default : pdfjs;
    pdfjs.GlobalWorkerOptions.workerSrc = HXIMP_V('pdf.worker.js');
    const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const c = await page.getTextContent();
      pages.push(c.items.map(it => it.str).join(' '));
    }
    const text = pages.join('\n');
    if (text.trim().length < 50) throw new Error('这份 PDF 没有可提取的文字（扫描件）。把每页截图存成 JPG/PNG 再传，让 AI 看着读。');
    return { text };
  }
  throw new Error('支持 PDF、DOCX、TXT、MD，以及 jpg／png 图片；旧版 .doc 请另存为 .docx');
}

// 图片/扫描件 → 文字。走视觉模型（HXAI.vision），没配看图模型时把话说清楚。
async function ocrImages(images) {
  if (!images || !images.length) throw new Error('没有读到图片。');
  const txt = await hximpVision({
    prompt: '把这张资料图片里的文字逐字抄下来：保留段落和小标题，公式用文字描述。看不清的地方写（看不清），不要总结、不要编。',
    images
  });
  return String(txt || '');
}

function parseJson(text) {
  const cleaned = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(cleaned); } catch (e) {
    const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
    if (a >= 0 && b > a) return JSON.parse(cleaned.slice(a, b + 1));
    throw new Error('AI 返回的内容不是有效 JSON，请重试或换一个模型。');
  }
}

const TYPE_ALIAS = {
  single: 'single', 单选: 'single', 单选题: 'single', 单项选择题: 'single', 单项选择: 'single',
  multiple: 'multiple', 多选: 'multiple', 多选题: 'multiple', 多项选择: 'multiple', 多项选择题: 'multiple',
  judgment: 'judgment', judge: 'judgment', 判断: 'judgment', 判断题: 'judgment',
  fill: 'fill', blank: 'fill', 填空: 'fill', 填空题: 'fill',
  short: 'short', 简答: 'short', 简答题: 'short', 问答: 'short', 问答题: 'short', 论述: 'short', 论述题: 'short',
  term: 'term', 名词解释: 'term', 名词: 'term', 术语解释: 'term', 概念解释: 'term',
  prog: 'prog', 程序: 'prog', 程序题: 'prog', 程序分析: 'prog', 程序分析题: 'prog',
  程序设计: 'prog', 程序设计题: 'prog', 编程: 'prog', 编程题: 'prog', 代码分析: 'prog', 读程序: 'prog'
};
const SUPPORTED = ['single', 'multiple', 'judgment', 'fill', 'short', 'term', 'prog'];
const TYPE_LABEL = { single: '单选题', multiple: '多选题', judgment: '判断题', fill: '填空题', short: '简答题', term: '名词解释', prog: '程序分析题' };

function answerTokens(raw) {
  const out = [];
  for (const v of (Array.isArray(raw) ? raw : [raw])) {
    const s = String(v == null ? '' : v).trim();
    if (!s) continue;
    if (/^[A-Fa-f]{2,}$/.test(s)) out.push(...s.toUpperCase().split(''));
    else out.push(...s.split(/[,，、/;；\s]+/).filter(Boolean));
  }
  return out;
}
const judgeKey = t => /^(正确|对|是|√|T|TRUE|Y|YES)$/i.test(t) ? 'T' : /^(错误|错|否|×|X|F|FALSE|N|NO)$/i.test(t) ? 'F' : '';
const hximpUid = () => (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));

/* 校验/规整一道题。和 刷题 那份逐条一致（含“被拒的题要带第几条 + 题干前几个字 + 原因”），
   只多了 term 和 term 的长度上限。返回 {questions, rejected}。 */
function normalizeQuestions(raw, subject) {
  const input = Array.isArray(raw) ? raw : raw && raw.questions;
  if (!Array.isArray(input)) throw new Error('题库需要是数组，或包含 questions 数组的 JSON 对象。');
  const questions = [], rejected = [];
  input.forEach((item, index) => {
    const stem0 = String((item && (item.stem || item.question || item.title)) || '').trim();
    let stem = stem0;
    const rawType = String((item && item.type) || '').trim();
    let type = TYPE_ALIAS[rawType.toLowerCase()] || TYPE_ALIAS[rawType] || '';
    const reject = reason => { rejected.push({ index: index + 1, stem: stem0.slice(0, 20), reason }); };
    if (!stem0) return reject('题干是空的');
    if (!type) {
      const opt = item && item.options;
      const list = Array.isArray(opt) ? opt : (opt && typeof opt === 'object' ? Object.keys(opt) : []);
      if (list.length && (String(list[0]).toUpperCase() === 'T' || /正确/.test(String((opt[0] && opt[0].text) != null ? opt[0].text : opt[0])))) type = 'judgment';
      else if (list.length >= 2) type = answerTokens(item.answer).length > 1 ? 'multiple' : 'single';
      else type = 'fill';
    }
    if (!SUPPORTED.includes(type)) return reject('题型「' + (rawType || '未知') + '」暂时不支持');

    const rawOptions = (item && (item.options || item.选项)) || [];
    let options = Array.isArray(rawOptions)
      ? rawOptions.map((op, i) => typeof op === 'string'
        ? { key: String.fromCharCode(65 + i), text: op.replace(/^[A-Fa-f][.、:：)）]\s*/, '') }
        : { key: String((op && op.key) || String.fromCharCode(65 + i)).toUpperCase(), text: String(op && op.text != null ? op.text : (op && op.value) || '') })
      : Object.entries(rawOptions).map(([k, v]) => ({ key: k.toUpperCase(), text: String(v) }));
    const texty = type === 'fill' || type === 'short' || type === 'term' || type === 'prog';
    if (texty) options = [];
    if (type === 'judgment' && !options.length) options = [{ key: 'T', text: '正确' }, { key: 'F', text: '错误' }];

    let answer;
    if (texty) {
      const raw2 = item.answer != null ? item.answer : item.答案;
      const vals = (Array.isArray(raw2) ? raw2 : [raw2]).map(v => String(v == null ? '' : v).trim()).filter(Boolean);
      answer = type === 'fill'
        ? vals.flatMap(v => v.split(/[、，,；;]+/).map(s => s.trim()).filter(Boolean))
        : [vals.join(' ')].filter(Boolean);
    } else {
      answer = answerTokens(item.answer != null ? item.answer : item.答案).map(tk => {
        const t = tk.replace(/[.。、:：)）]$/, '');
        if (type === 'judgment') return judgeKey(t) || t.toUpperCase();
        if (/^[A-Fa-f]$/.test(t)) return t.toUpperCase();
        const hit = options.find(o => String(o.text).trim() === t);
        return hit ? hit.key : t.toUpperCase();
      });
    }
    answer = [...new Set(answer)];

    if (type === 'fill') {
      if (!/_{2,}/.test(stem)) stem = stem.replace(/[（(]\s*[)）]/, '____').replace(/\s*[（(]\s*[)）]\s*/g, ' ____ ');
      if (!/_{2,}/.test(stem)) return reject('填空题的题干里没有 ____ 表示空格位置，学生没地方填');
    }
    const keys = new Set(options.map(o => o.key));
    if (!answer.length) return reject(type === 'prog' ? '程序分析题没有参考答案' : texty ? '参考答案是空的' : '没有答案');
    if (texty) {
      if (type === 'short' && answer[0].length > 1200) return reject('简答题的参考答案太长（超过 1200 字），像是把原文整段搬过来了');
      if (type === 'term' && answer[0].length > 600) return reject('名词解释的答案太长（超过 600 字），应该是几句话的解释');
      if (type === 'prog' && answer[0].length > 2000) return reject('程序分析题的参考答案太长（超过 2000 字），像是把原文整段搬过来了');
    } else {
      if (options.length < 2) return reject('选项少于 2 个');
      if (answer.some(a => !keys.has(a))) return reject('答案 ' + answer.filter(a => !keys.has(a)).join('、') + ' 不在选项里');
      if (type !== 'multiple' && answer.length !== 1) return reject(TYPE_LABEL[type] + '只能有 1 个答案，这份给了 ' + answer.length + ' 个');
    }
    const arr = v => (Array.isArray(v) ? v : v ? [v] : []).map(x => String(x == null ? '' : x).trim()).filter(Boolean);
    const code = String((item && (item.code || item.代码 || item.程序)) || '').trim();
    const sub = arr(item && (item.sub || item.小问 || item.问题));
    questions.push({
      id: subject + '-ai-' + hximpUid(),
      number: (item && item.number) || questions.length + 1,
      stem, type, options, answer,
      explanation: String((item && (item.explanation || item.解析)) || '').trim(),
      ...(code ? { code } : {}),
      ...(sub.length ? { sub } : {}),
      source: (item && (item.source || item.出处)) || 'AI'
    });
  });
  return { questions, rejected };
}

/* 切块：上传资料时存进 hx_exam_chunk（DB 里每块 body 最多 8000 字），
   所以 size 取 3600、overlap 320 —— 留足余量，也不会把一句话切两半切得太狠。 */
function chunks(text, size = 4200, overlap = 450) {
  const clean = String(text || '').replace(/\r/g, '');
  const out = [];
  for (let start = 0; start < clean.length; start += Math.max(1, size - overlap)) {
    out.push(clean.slice(start, start + size));
    if (start + size >= clean.length) break;
  }
  return out;
}

function genPrompt(o) {
  const list = Object.entries(o.counts || {}).filter(([, n]) => n > 0);
  const parts = list.map(([t, n]) => TYPE_LABEL[t] + ' ' + n + ' 道').join('、');
  const rules = list.map(([t]) => TYPE_RULE[t]).join('\n   ');
  const samples = list.map(([t]) => '  ' + TYPE_SAMPLE[t]).join(',\n');
  return '你是「' + o.subjectName + '」课程的出题老师。请根据下面的资料出题。\n'
    + '范围：' + (o.scope || '整份资料') + '（只出这个范围里写到的内容）\n'
    + '难度：' + (o.level || '中等') + '\n'
    + '这一轮要出：' + parts + '\n'
    + (o.extra ? '额外要求：' + o.extra + '\n' : '')
    + '硬要求：\n'
    + '1. 每道题都必须能在原文找到依据；原文没写的不出，不编型号、参数、页码。\n'
    + '2. ' + rules + '\n'
    + '3. 答案唯一、没有歧义；explanation 写一句依据（引用原文要点）。\n'
    + '4. 只输出 JSON 对象，不要任何解释文字：\n'

/* 出题：教材、讲义这类没有现成题目的资料，按老师的范围/题型/数量/难度/额外要求让 AI 出题。
   数量按段分摊（老师说的是“整份资料一共几道”），一段没分到题就不白花 token。 */
async function aiGenerate(text, subject, subjectName, opts, onProgress) {
  opts = opts || {};
  if (!String(text || '').trim()) throw new Error('请先勾选资料，或在「额外要求」里写下要出题的内容。');
  const wanted = {};
  for (const t of SUPPORTED) {
    const n = Math.max(0, Math.min(50, Math.round(+((opts.types || {})[t]) || 0)));
    if (n) wanted[t] = n;
  }
  if (!Object.keys(wanted).length) throw new Error('请至少填一种题型的数量（大于 0）。');
  const pieces = chunks(text, 6000, 300);
  const plan = pieces.map(() => ({}));
  for (const [t, n] of Object.entries(wanted)) {
    const base = Math.floor(n / pieces.length), rem = n % pieces.length;
    pieces.forEach((_, i) => { const c = base + (i < rem ? 1 : 0); if (c) plan[i][t] = c; });
  }
  const collected = [], rejected = [];
  let done = 0;
  for (let i = 0; i < pieces.length; i++) {
    const counts = plan[i];
    if (!Object.keys(counts).length) continue;
    done++;
    if (onProgress) onProgress('正在根据第 ' + (i + 1) + ' / ' + pieces.length + ' 段出题，已出 ' + collected.length + ' 题…', collected);
    try {
      const prompt = genPrompt({ subjectName, piece: pieces[i], scope: opts.scope, level: opts.level, counts, extra: opts.extra });
      const response = await hximpChat([{ role: 'system', content: '你是严谨的职业院校出题老师。只返回合法 JSON。' }, { role: 'user', content: prompt }], { json: true, thinkLevel: opts.thinkLevel });
      const result = normalizeQuestions(parseJson(response), subject);
      collected.push(...result.questions);
      rejected.push(...result.rejected);
    } catch (error) {
      error.partialQuestions = collected;
      error.partialRejected = rejected;
      if (onProgress) onProgress('中断了：' + error.message, collected);
      throw error;
    }
  }
  if (!done) throw new Error('资料太短，没凑够一段。多贴一些文字再试。');
  return { questions: collected, rejected };
}

/* 识题：把资料里现成的题原样抠出来（不编题）。资料库里暂时没入口，留给“导入现成试卷”那一轮。 */
async function aiImport(text, subject, onProgress) {
  if (!String(text || '').trim()) throw new Error('请先选择文件或粘贴资料。');
  const pieces = chunks(text);
  const collected = [], rejected = [];
  for (let i = 0; i < pieces.length; i++) {
    if (onProgress) onProgress('正在识别第 ' + (i + 1) + ' / ' + pieces.length + ' 段，已提取 ' + collected.length + ' 题…', collected);
    const response = await hximpChat([
      { role: 'system', content: '你是严谨的试题结构化助手。只返回合法 JSON。' },
      { role: 'user', content: '从下面的资料里把已有的题原样抠出来，不要自己编题。只输出 JSON：{"questions":[...]}\n资料：\n' + pieces[i] }
    ]);
    const r = normalizeQuestions(parseJson(response), subject);
    collected.push(...r.questions); rejected.push(...r.rejected);
  }
  return { questions: collected, rejected };
}

let booting = false, bootDone = false, lastUid = null;
async function boot() {
  if (booting) return; booting = true;
  try { await bootOnce(); bootDone = true; } finally { booting = false; }
}
async function bootOnce() {

/* ================= 资料库 · 资料与出题 =================
   从 考试/src/ui-mat.js 抽出来（2026-11-08 Z2），流程不变：
     ① 上传：HXImp.readMaterial 抠文字（图片走 HXAI.vision）→ 原文件进 Storage 私有桶 exam-material
        （路径必须是 <auth.uid()>/…，策略按第一级目录判归属）→ hx_exam_mat_save 登记 → 切段进 hx_exam_chunk。
     ② 列表：名字 / 字数 / 段数 / 大小 / 时间，每行「看原文」「用这份出题」「删除」。
        删除 = hx_exam_mat_del 拿 path → 删 Storage 对象（表和文件分两处存，必须先问云端拿 path）。
     ③ AI 出题：勾资料 → 题型数量 → 难度 / 范围 / 思考程度 / 额外要求 → HXImp.aiGenerate（按段喂模型）
        → 预览（可勾掉，被拒的题带原因）→ hx_exam_qbank_add 进题池。 */
'use strict';

const MAT_BUCKET = 'exam-material';
// 题池（hx_exam_qbank.t）的取值和引擎题型名不是一套：single/multiple 都算 choice，judgment 叫 judge
const MAT_DB_T = { single: 'choice', multiple: 'choice', judgment: 'judge', fill: 'fill', short: 'short', term: 'term', prog: 'prog' };
const MAT_TYPES = [['single', '单选'], ['fill', '填空'], ['judgment', '判断'], ['term', '名词解释'], ['short', '简答'], ['prog', '程序分析']];
const MAT_DEF = { single: 10, fill: 5, judgment: 5, term: 0, short: 2, prog: 0 };
let MAT_LIST = [], MAT_GEN = null, MAT_BUSY = false;

const MAT_sid = () => { const s = curSub(); return s ? s.id : null; };
const MAT_sname = () => { const s = curSub(); return s ? s.name : ''; };
async function MAT_call(fn, body) {
  try { return { ok: true, data: await rpc(fn, body || {}) }; }
  catch (e) { return { ok: false, err: (e && e.message) || '调用失败' }; }
}
function MAT_banner(msg) {
  const b = $('matBanner') || $('qbBanner');
  if (!b) return toast(msg);
  b.textContent = msg; b.hidden = false;
}

/* ---------------- Storage ---------------- */
function MAT_path(ext) {
  const uid = sess && sess.user && sess.user.id;
  if (!uid) throw new Error('登录过期了，请在首页重新登录');
  return uid + '/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7) + (ext || '');
}
async function MAT_put(path, blob, mime) {
  load();
  if (!sess || !sess.access_token) throw new Error('登录过期了，请在首页重新登录');
  const r = await fetch(HXB + '/storage/v1/object/' + MAT_BUCKET + '/' + path, {
    method: 'POST',
    headers: { apikey: HXK, Authorization: 'Bearer ' + sess.access_token, 'Content-Type': mime || 'application/octet-stream', 'x-upsert': 'true' },
    body: blob
  }).catch(() => { throw new Error('连不上服务器，请检查网络'); });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error('Storage HTTP ' + r.status + (t ? '：' + String(t).slice(0, 120) : ''));
  }
}
// 删文件「尽力而为」：表里那条已经删了，文件删不掉最多占点空间
async function MAT_rm(path) {
  if (!path || !sess || !sess.access_token) return;
  try {
    await fetch(HXB + '/storage/v1/object/' + MAT_BUCKET + '/' + String(path).replace(/^\/+/, ''), {
      method: 'DELETE', headers: { apikey: HXK, Authorization: 'Bearer ' + sess.access_token }
    });
  } catch (e) { /* 忽略 */ }
}

function matBind() {
  const file = $('matFile'), drop = $('matDrop');
  $('matPick').onclick = () => file.click();
  file.onchange = () => { const fs = [...file.files]; file.value = ''; if (fs.length) matUpload(fs); };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('on'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('on'); }));
  drop.addEventListener('drop', e => { const fs = [...((e.dataTransfer || {}).files || [])]; if (fs.length) matUpload(fs); });
  $('mgGo').onclick = matGenRun;
  $('matRefresh').onclick = matReload;
}

const MAT_kb = n => { n = +n || 0; return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B'; };

async function matReload() {
  const sid = MAT_sid(); if (sid == null) return;
  const r = await MAT_call('hx_exam_mat_list', { p_subject_id: sid });
  if (MAT_sid() !== sid) return;   // 读的过程中切了科目
  if (!r.ok) {
    const box = $('matList'); if (box) box.innerHTML = `<div class="errs">${esc(r.err)}</div>`;
    MAT_LIST = []; matDrawMats(); return;
  }
  MAT_LIST = Array.isArray(r.data) ? r.data : [];
  matDrawList(); matDrawMats();
}
function matDrawList() {
  const box = $('matList'); if (!box) return;
  const cnt = $('matCnt'); if (cnt) cnt.textContent = MAT_LIST.length ? MAT_LIST.length + ' 份' : '';

      <div class="mat-m"><b title="${esc(m.name)}">${esc(m.name)}</b>
        <span class="note">${(+m.chars || 0).toLocaleString()} 字 · ${MAT_kb(m.bytes)}${m.status === 'failed' ? ' · 解析失败' : ''} · ${when(m.at)}</span></div>
      <div class="mat-a"><button class="sm" data-mview="${m.id}">看原文</button><button class="sm" data-mgen="${m.id}">用这份出题</button><button class="sm danger" data-mdel="${m.id}">删除</button></div>

}
function matDrawMats() {

/* 看原文：按段列出切好的文字（就是 AI 出题时读到的那些段） */
async function matView(id) {
  const box = $('matView'); if (!box) return;

    <div class="mat-segs">${arr.length ? arr.map(c => `<div class="mat-seg"><span class="note">第 ${(+c.idx || 0) + 1} 段</span><pre>${esc((c.title ? c.title + '\n' : '') + c.body)}</pre></div>`).join('') : '<p class="note">这份资料没有切段（可能没读到文字）。</p>'}</div></div>`;

async function matDel(id) {
  const m = MAT_LIST.find(x => +x.id === id) || {};
  if (!confirm('删除资料「' + (m.name || '') + '」？\n\n它的切段会一起删掉；已经出好的题留在题池里。')) return;
  const r = await MAT_call('hx_exam_mat_del', { p_id: id });
  if (!r.ok) return MAT_banner('删除失败：' + r.err);
  await MAT_rm(typeof r.data === 'string' ? r.data : (r.data && r.data.path));
  toast('已删除');
  const v = $('matView'); if (v) v.innerHTML = '';
  matReload(); loadSubjects();
}

/* 上传：解析 → 传文件 → 登记 → 写切段。每一步失败都点名是哪一步。 */
async function matUpload(files) {
  if (MAT_BUSY) return toast('正在传上一批，等它传完');
  const sid = MAT_sid(); if (sid == null) return;
  MAT_BUSY = true;
  const prog = $('matProg'); prog.hidden = false;
  const bad = [], warn = [];
  let okN = 0, segN = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    let step = '读文件';
    const say = s => { step = s; prog.textContent = `（${i + 1}/${files.length}）${f.name}：${s}…`; };
    try {
      say('读文件');
      const got = await HXImp.readMaterial(f);
      let text = String(got.text || '');
      if (got.image) { say('AI 识图'); text = await HXImp.ocrImages([got.image]); }
      text = text.replace(/\r/g, '').trim();
      if (!text) throw new Error('没读到任何文字（可能是空白页或加密文件）');

      say('上传原文件');
      const ext = (f.name.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
      const path = MAT_path(ext);
      await MAT_put(path, f, f.type);

      say('登记');
      const saved = await rpc('hx_exam_mat_save', { p_subject_id: sid, p_name: f.name, p_mime: f.type || '', p_bytes: f.size, p_path: path, p_chars: text.length });
      const mid = saved && saved.id;
      if (!mid) throw new Error('云端没返回资料编号');

      const list = HXImp.chunks(text, 3600, 320);
      const keep = list.slice(0, 400);   // hx_exam_chunk_put 一次最多 400 段
      say(`写入 ${keep.length} 段`);
      await rpc('hx_exam_chunk_put', { p_material_id: mid, p_chunks: keep.map((body, idx) => ({ idx, title: '', body })) });
      if (list.length > keep.length) warn.push(f.name + '：太长，只存了前 ' + keep.length + ' 段');
      okN++; segN += keep.length;
    } catch (e) {
      bad.push(f.name + '：「' + step + '」失败 —— ' + (e && e.message ? e.message : e));
    }
  }
  MAT_BUSY = false;
  prog.textContent = (okN ? `传好 ${okN} 份，切成 ${segN} 段。` : '') + (warn.length ? ' ' + warn.join('；') + '。' : '')
    + (bad.length ? ' 有 ' + bad.length + ' 份没传成：' + bad.join('；') : '');
  if (!bad.length) toast('上传完成');
  await matReload();
  loadSubjects();
}

/* ---------------- AI 出题 ---------------- */
async function matGenRun() {
  if (MAT_BUSY) return toast('正在忙，等这一步结束');
  const types = {};
  for (const [t] of MAT_TYPES) types[t] = Math.max(0, Math.min(50, Math.round(+$('mg_' + t).value || 0)));
  if (!Object.values(types).some(n => n > 0)) return toast('先填一种题型的数量');
  const picks = [...document.querySelectorAll('[data-mpick]:checked')].map(x => +x.dataset.mpick);
  const extra = $('mgExtra').value.trim(), scope = $('mgScope').value.trim(), level = $('mgLevel').value, think = $('mgThink').value;
  const state = $('mgState');
  let text = '', tag = '', mid = null;
  if (picks.length) {
    const parts = [];
    for (const id of picks) {
      const r = await MAT_call('hx_exam_chunk_get', { p_material_id: id });
      if (!r.ok) return MAT_banner('读资料切段失败：' + r.err);
      const arr = Array.isArray(r.data) ? r.data : [];
      if (!arr.length) continue;
      const nm = (MAT_LIST.find(m => +m.id === id) || {}).name || ('资料 ' + id);
      parts.push('【' + nm + '】\n' + arr.map(c => (c.title ? c.title + '\n' : '') + c.body).join('\n\n'));
      tag += (tag ? '、' : '') + nm;
    }
    if (!parts.length) return toast('勾的资料里没有可用的段，重新传一次试试');
    text = parts.join('\n\n');
    mid = picks.length === 1 ? picks[0] : null;
  } else {
    if (!extra) return toast('没勾资料时，请在「额外要求」里写下要出题的内容');
    text = extra; tag = '老师手写的要求';
  }
  const sub = curSub();
  MAT_BUSY = true; $('mgGo').disabled = true; state.textContent = '正在准备…';
  try {
    const res = await HXImp.aiGenerate(text, sub.key, sub.name, { types, scope, level, extra: picks.length ? extra : '', thinkLevel: think || undefined }, msg => { state.textContent = msg; });
    MAT_GEN = { items: res.questions, rejected: res.rejected, tag: tag + ' · AI 出题', mid, sid: sub.id };
    state.textContent = `出完 ${res.questions.length} 道` + (res.rejected.length ? `，${res.rejected.length} 道没收下` : '');
    matGenDraw();
  } catch (e) {
    state.textContent = '';
    const partial = e && e.partialQuestions ? e.partialQuestions : [];
    if (partial.length) { MAT_GEN = { items: partial, rejected: e.partialRejected || [], tag: tag + ' · AI 出题（中途断了）', mid, sid: sub.id }; matGenDraw(); }
    MAT_banner('出题失败：' + (e && e.message ? e.message : e) + (partial.length ? '（已经出的 ' + partial.length + ' 道留在下面）' : ''));
  } finally { MAT_BUSY = false; const b = $('mgGo'); if (b) b.disabled = false; }
}

const MAT_ANS = q => {
  if (q.type === 'judgment') return q.answer[0] === 'T' ? '正确' : '错误';
  if (q.type === 'fill') return q.answer.join(' / ');
  if (q.type === 'short' || q.type === 'term' || q.type === 'prog') return q.answer[0] || '';
  return q.answer.join('');
};
function matGenDraw() {
  const out = $('mgOut'); if (!out) return;
  if (!MAT_GEN) { out.innerHTML = ''; return; }
  const it = MAT_GEN.items, rej = MAT_GEN.rejected || [];
  out.innerHTML = `<div class="mg-res">
    <div class="mg-rh"><b>出了 ${it.length} 道</b><span class="note">${esc(MAT_GEN.tag)}</span></div>
    <div class="mg-list">${it.map((q, i) => `<label class="mg-item"><input type="checkbox" data-gpick="${i}" checked>
      <span class="mg-q"><b>${esc(HXImp.TYPE_LABEL[q.type] || q.type)}</b>${esc(q.stem)}
      <span class="note">答案：${esc(String(MAT_ANS(q)).slice(0, 120))}</span></span></label>`).join('')}</div>
    ${rej.length ? `<details class="mg-rej"><summary>${rej.length} 道没收下</summary><ul>${rej.map(r => `<li>第 ${r.index} 条「${esc(r.stem)}」：${esc(r.reason)}</li>`).join('')}</ul></details>` : ''}
    <div class="row" style="margin-top:10px"><button class="pri" id="mgAdd">加入题池</button><button id="mgDrop">不要了</button><span class="note" id="mgAddState"></span></div>
  </div>`;
  out.querySelector('#mgDrop').onclick = () => { MAT_GEN = null; matGenDraw(); $('mgState').textContent = ''; };
  out.querySelector('#mgAdd').onclick = matGenAdd;
}

// 引擎里的题 → 题池那一行（字段名照 考试/supabase/2026-11-08-科目-资料库-题库.sql）
function MAT_toDb(q, src) {
  const t = MAT_DB_T[q.type] || 'choice';
  let a;
  if (t === 'choice') a = q.answer.join('');
  else if (t === 'judge') a = q.answer[0] === 'T';
  else if (t === 'fill') a = q.answer.slice();
  else a = q.answer[0] || '';
  return {
    t, ch: null, q: q.stem,
    o: t === 'choice' || t === 'judge' ? q.options.map(o => ({ key: o.key, text: o.text })) : null,
    a, code: q.code || null, sub: q.sub && q.sub.length ? q.sub : null,
    explanation: q.explanation || '', src
  };
}
async function matGenAdd() {
  if (!MAT_GEN) return;
  const box = $('mgOut');
  const picks = [...box.querySelectorAll('[data-gpick]:checked')].map(x => +x.dataset.gpick);
  if (!picks.length) return toast('一道都没勾');
  const btn = box.querySelector('#mgAdd'), st = box.querySelector('#mgAddState');
  btn.disabled = true; st.textContent = '正在写入…';
  const items = picks.map(i => MAT_toDb(MAT_GEN.items[i], MAT_GEN.tag));

/* ================= 资料库 · 题池 + 发布到刷题 =================
   题池 = hx_exam_qbank（一题一行，只自己看；考试组卷也从这里抽）。从 考试/src/ui-bank.js 抽出来再加两件事：

     ② 别的老师的 id（quiz_public_list 里 mine=false，且不是四个老 id）不许接。
     ③ 下发范围：已存在的题库**原样沿用** class_ids / teacher_ids（quiz_publish 每次都会整份覆盖这两列，

/* ---------------- 题池 → 刷题格式 ---------------- */
const ZL_norm = s => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
/* 一行题池 → 一道刷题题目（字段照 刷题/data/*.json：id/number/type/stem/options/answer/explanation/source，
   程序题另带 code/sub）。转不了的返回 { skip: 原因 }。
   题 id = <题库 id>-zl-<题池编号>：同一道题再发一次 id 一样，自然被去重。 */
function ZL_toQuiz(r, bank) {
  const stem = String((r && r.q) || '').trim();
  if (!stem) return { skip: '题干是空的' };
  const q = { id: bank + '-zl-' + r.id, number: 0, type: '', stem, options: [], answer: [], explanation: String(r.explanation || ''), source: String(r.src || '资料库') };
  const a = r.a;
  switch (r.t) {
    case 'choice': {
      q.options = (Array.isArray(r.o) ? r.o : []).map((o, i) => ({ key: String((o && o.key) || String.fromCharCode(65 + i)).toUpperCase(), text: String(o && o.text != null ? o.text : '') }));
      if (q.options.length < 2) return { skip: '选择题选项少于 2 个' };
      const keys = new Set(q.options.map(o => o.key));
      const raw = Array.isArray(a) ? a.join('') : String(a == null ? '' : a);
      q.answer = [...new Set(raw.toUpperCase().replace(/[^A-Z]/g, '').split('').filter(Boolean))];
      if (!q.answer.length) return { skip: '选择题没有答案' };
      if (q.answer.some(k => !keys.has(k))) return { skip: '答案不在选项里' };
      q.type = q.answer.length > 1 ? 'multiple' : 'single';
      break;
    }
    case 'judge': {
      const v = a === true || a === 'true' || a === 'T' ? 'T' : a === false || a === 'false' || a === 'F' ? 'F' : '';
      if (!v) return { skip: '判断题答案不是对/错' };
      q.type = 'judgment'; q.options = [{ key: 'T', text: '正确' }, { key: 'F', text: '错误' }]; q.answer = [v];
      break;
    }
    case 'fill': {
      q.type = 'fill';
      q.answer = (Array.isArray(a) ? a : String(a == null ? '' : a).split(/[、，,；;|\n]+/)).map(x => String(x == null ? '' : x).trim()).filter(Boolean);
      if (!q.answer.length) return { skip: '填空题没有答案' };
      if (!/_{2,}/.test(stem)) return { skip: '填空题题干里没有 ____' };
      break;
    }
    case 'term': case 'short': case 'prog': {
      q.type = r.t;
      const s = Array.isArray(a) ? a.join(' ') : String(a == null ? '' : a).trim();
      if (!s) return { skip: '没有参考答案' };
      q.answer = [s];
      if (r.t === 'prog') {
        if (r.code) q.code = String(r.code);
        const sub = Array.isArray(r.sub) ? r.sub.map(x => String(x == null ? '' : x).trim()).filter(Boolean) : [];
        if (sub.length) q.sub = sub;
      }
      break;
    }
    default: return { skip: '题型「' + (r && r.t) + '」刷题里没有' };
  }
  return { q };
}
/* 追加合并：已有的题一道不动；同 id 或同题型同题干（去空白）的算重复，不加。 */
function ZL_merge(existing, rows, bank) {
  const old = Array.isArray(existing) ? existing : [];
  const ids = new Set(old.map(q => String(q && q.id)));
  const stems = new Set(old.map(q => (q && q.type) + '|' + ZL_norm(q && q.stem)));
  let num = old.reduce((m, q) => Math.max(m, +(q && q.number) || 0), 0);
  const added = [], skipped = [];
  let dup = 0;
  for (const r of rows) {
    const c = ZL_toQuiz(r, bank);
    if (c.skip) { skipped.push({ id: r.id, stem: String(r.q || '').slice(0, 20), reason: c.skip }); continue; }
    const k = c.q.type + '|' + ZL_norm(c.q.stem);
    if (ids.has(c.q.id) || stems.has(k)) { dup++; continue; }
    c.q.number = ++num;
    ids.add(c.q.id); stems.add(k); added.push(c.q);
  }
  return { questions: old.concat(added), added, dup, skipped };
}
window.ZL = { toQuiz: ZL_toQuiz, merge: ZL_merge, OLD: ZL_OLD };

/* ---------------- 发布到刷题 ---------------- */
let PUB = null;   // 预览结果：{ bank, rows, got, row, merged, classes, teachers, name, owner }
function pubOpen() {
  const s = curSub(); if (!s) return;
  // 按进题池的先后排（列表是新的在上），追加到刷题里的顺序和出题顺序一致
  const rows = QB_ALL.filter(q => QB_SEL.has(String(q.id))).sort((a, b) => (+a.at || 0) - (+b.at || 0) || (+a.id) - (+b.id));
  if (!rows.length) return toast('先勾要发布的题');
  PUB = null;
  zlModal(`<h2>发布到刷题</h2>
    <label class="zl-f">目标题库 id<input id="pbBank" class="mono" maxlength="64" autocomplete="off" value="${esc(s.quiz_bank)}" ${s.quiz_bank ? 'readonly aria-readonly="true"' : 'placeholder="新题库的英文 id，如 dianzi-jichu"'}></label>
    ${s.quiz_bank ? '' : '<div class="row"><button id="pbCheck">检查</button></div>'}
    <div id="pbInfo" class="pb-info">${s.quiz_bank ? fxLoad('正在读刷题题库…') : ''}</div>
    <div class="errs" id="pbErr" hidden></div>
    <div class="row"><button class="pri" id="pbGo" disabled>确认追加</button><button id="pbCancel">取消</button></div>`);
  if (window.HXLoadFx) HXLoadFx.auto($('pbInfo'));
  $('pbCancel').onclick = zlModalClose;
  $('pbGo').onclick = pubGo;
  if (s.quiz_bank) pubCheck(rows);
  else $('pbCheck').onclick = () => pubCheck(rows);
}
async function pubCheck(rows) {
  const s = curSub(), info = $('pbInfo'), err = $('pbErr'), go = $('pbGo');
  const fail = m => { info.innerHTML = ''; err.textContent = m; err.hidden = false; go.disabled = true; PUB = null; };
  err.hidden = true; go.disabled = true;
  const bank = $('pbBank').value.trim();
  if (!ZL_BANK_RE.test(bank)) return fail('题库 id 只能是英文、数字、下划线、连字符（最长 64 位）');
  let list;
  try { list = await rpc('quiz_public_list'); } catch (e) { return fail('读不到刷题题库列表：' + e.message); }
  const row = (Array.isArray(list) ? list : []).find(x => x.id === bank) || null;
  const old = ZL_OLD.has(bank);
  if (row && !row.mine && !old) return fail('题库 id「' + bank + '」是别的老师的题库，不能往里发。换一个新的 id。');
  let got = null;
  try { got = await rpc('quiz_public_get', { p_id: bank }); } catch (e) { return fail('读不到刷题题库「' + bank + '」：' + e.message); }
  if (got && !Array.isArray(got.questions)) got = null;
  if (!got && old) return fail('「' + bank + '」是刷题内置题库，云端还没有它（还是随代码发布的本地文件）。先在刷题设置页把内置题库搬到账号里，再来追加；直接发会生成一份只有新题的同名题库，把内置的题盖掉。');
  if (!got && row) return fail('列表里有「' + bank + '」但取不到题目，先别发，刷新再试。');
  if (got && !row) return fail('读不到「' + bank + '」原来的下发范围，先别发（不然会改掉它发给谁）。');
  const merged = ZL_merge(got ? got.questions : [], rows, bank);
  PUB = {
    bank, rows, got, row, merged,
    name: got ? (got.name || bank) : s.name,
    owner: got ? (got.owner_name || '') : myName(),
    classes: got ? (row.class_ids === undefined ? null : row.class_ids) : [],
    teachers: got ? (row.teacher_ids === undefined ? null : row.teacher_ids) : null
  };
  const nOld = got ? got.questions.length : 0;
  info.innerHTML = `<p>${got ? `刷题题库「${esc(PUB.name)}」现有 <b id="pbOld">${nOld}</b> 题，下发范围沿用：${esc(row.targets || '原样')}`
    : `新题库「${esc(PUB.name)}」，发布后只有你自己能刷，去刷题里再下发给班级`}</p>
    <p>本次选了 ${rows.length} 道：新增 <b id="pbAdd">${merged.added.length}</b> · 重复跳过 <b id="pbDup">${merged.dup}</b> · 转不了 <b id="pbSkip">${merged.skipped.length}</b></p>
    ${merged.skipped.length ? `<ul class="pb-skip">${merged.skipped.map(x => `<li>「${esc(x.stem)}」：${esc(x.reason)}</li>`).join('')}</ul>` : ''}
    <p>发布后共 <b id="pbTotal">${merged.questions.length}</b> 题</p>`;
  go.disabled = !merged.added.length;
  if (!merged.added.length) { err.textContent = '没有可以新增的题'; err.hidden = false; }
}
async function pubGo() {
  if (!PUB || !PUB.merged.added.length) return;
  const s = curSub(), go = $('pbGo'), err = $('pbErr');
  go.disabled = true;
  const P = PUB;
  let r;
  try {
    r = await rpc('quiz_publish', { p_id: P.bank, p_name: P.name, p_questions: P.merged.questions, p_owner_name: P.owner, p_classes: P.classes, p_teachers: P.teachers });
  } catch (e) { err.textContent = '发布失败：' + e.message; err.hidden = false; go.disabled = false; return; }
  const total = r && r.total != null ? +r.total : P.merged.questions.length;
  const nOld = P.got ? P.got.questions.length : 0;
  let note = '';
  if (s && !s.quiz_bank) {
    /* 新 id 发布成功后再记到科目上（先记后发，发失败了科目会白白挂一个不存在的题库） */
    try { await rpc('hx_exam_subject_save', { p_key: s.key, p_name: s.name, p_kind: s.kind, p_quiz_bank: P.bank }); await loadSubjects(); }
    catch (e) { note = '（题已发布，但没能把题库 id 记到科目上：' + e.message + '）'; }
  }
  $('pbInfo').innerHTML = `<p class="ok" id="pbDone">已发布：「${esc(P.name)}」现在 ${total} 题（原 ${nOld} + 新增 ${P.merged.added.length}）${esc(note)}</p>`;
  PUB = null;
  $('pbGo').hidden = true; $('pbCancel').textContent = '关闭';
  if (total !== nOld + P.merged.added.length) MAT_banner('发布后题数对不上：云端 ' + total + '，预期 ' + (nOld + P.merged.added.length));
  toast('已发布到刷题');
}

;
boot().then(() => { if (window.HXLoadFx) HXLoadFx.finishBoot(); });
</script>
