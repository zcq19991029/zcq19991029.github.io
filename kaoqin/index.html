<script src="../ui-dialog.js"></script>
<script src="../hx-scan.js" defer></script><!-- 全站扫一扫（K5，站点根），没加载到时签到页给微信/相机扫码的退路 -->
<style>/* 考勤工具样式。颜色全部来自 ../hx-theme.css（--bg/--ink/--dim/--card/--edge/--acc…，深浅色由 hx-theme.js 切）；
   这里只放布局和控件。排版规矩（华夏工具 2026-11-08）：主容器 width:min(1600px,100%)，不写 min-width 硬下限，
   表格 table-layout:fixed + word-break，overflow-x:auto 只包表格外层，390 竖屏不许横向溢出。 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg, #f5f5f7); color: var(--ink, #1d1d1f); font: 15px/1.6 var(--hx-font, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif); overflow-x: hidden; }
#app { width: min(1600px, 100%); margin: 0 auto; padding: 16px; }
h1, h2 { letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 0 0 12px; }
.mono { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; }
.note { color: var(--dim, #6e6e73); font-size: 13px; }
.note.bad, .bad { color: var(--bad, #d70015); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card { background: var(--card, #fff); border: 1px solid var(--edge, rgba(0, 0, 0, .08)); border-radius: 18px; padding: 18px; margin-bottom: 14px; min-width: 0; box-shadow: var(--glass-drop, 0 10px 30px -18px rgba(0, 0, 0, .25)); }
/* ── 毛玻璃卡（2026-11-12 用户反馈：「这个 ui 卡片不透明全黑不好看 毛玻璃半透明类似主页卡片」）──
   配方直接照抄首页工具卡（总入口/index.html 里 .tile 那几条 html.hx-bg 分支），三件事：
     ① 底色乘界面透明度 --hx-a：深色 rgb(9 16 29 / .52×α)、浅色 rgb(255 255 255 / .70×α)；
     ② 一圈 1px 亮边 + 顶上 0.8px 亮唇（内阴影），玻璃才有厚度；
     ③ 方向性柔影 --glass-drop，卡片才「放得住」在壁纸上。
   ★ 2026-11-12 用户纠正：「没给每张卡加实时模糊这个不对　在标准模式允许啊　有的性能好　而且我们也要换服务器了」
     → 原先那条「绝不逐卡 backdrop-filter」的结论**作废**。现在：标准模式逐卡真糊（blur 18px），
       极简模式（html.hx-lite）一条都不留。性能差的老机器用户在总入口把模式切极简即可。
   闸门用 html.hx-bg（= 有壁纸），不用 .hx-layer：考勤是嵌在总入口 iframe 里的，嵌入时 hx-theme.js
   故意不挂 .hx-layer（背景由 body::before 自己铺一遍）。背景是「无」时不挂 —— 纯色底上没有东西可糊，
   卡片退回实色反而更清楚。
   弹窗 .att-mcard 要保证字读得清，用 :not() 排除掉，仍走 --card-solid 实底。 */
html.hx-bg .card:not(.att-mcard) {
  background-color: rgb(9 16 29 / calc(var(--hx-a, 1) * .52));
  border-color: rgba(255, 255, 255, .14);
  box-shadow: var(--glass-drop), inset 0 .8px 0 rgba(255, 255, 255, .14);
  /* 2026-11-12 用户原话：「没给每张卡加实时模糊这个不对　在标准模式允许啊　有的性能好　而且我们也要换服务器了」
     → **标准模式给真的 backdrop-filter**，极简模式（html.hx-lite）一律关掉（见下面那条）。 */
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  backdrop-filter: saturate(180%) blur(18px);
}
html:not([data-hx-mode="dark"]).hx-bg .card:not(.att-mcard) {
  background-color: rgb(255 255 255 / calc(var(--hx-a, 1) * .70));
  border-color: var(--glass-edge, rgba(18, 22, 30, .16));
  box-shadow: var(--glass-drop), inset 0 .8px 0 rgba(255, 255, 255, .95);
}
/* 玻璃上的次级文字换 --g-dim（hx-theme.css 里专为玻璃配的那一档）：
   --dim 是给不透明底准备的，压在深色玻璃上对比度不够，小字（课程号、已考勤 0 次）会发虚。 */
html.hx-bg .card:not(.att-mcard) .note,
html.hx-bg .card:not(.att-mcard) .att-cls i { color: var(--g-dim, #6e6e73); }
/* 极简模式：玻璃可以有，实时模糊一层都不留（老一体机逐卡重算会卡死） */
html.hx-lite.hx-bg .card:not(.att-mcard) { -webkit-backdrop-filter: none; backdrop-filter: none; }
.errs { background: var(--badbg, rgba(215, 0, 21, .08)); color: var(--bad, #d70015); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 13.5px; word-break: break-word; }
.errs[hidden] { display: none; }
button, .btn { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line2, rgba(0, 0, 0, .12)); background: var(--fill, rgba(0, 0, 0, .04)); color: var(--ink, #1d1d1f); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; max-width: 100%; }
button:hover, .btn:hover { border-color: var(--acc, #2f845a); }
button:disabled { opacity: .5; cursor: not-allowed; }
button[hidden] { display: none; }
button.pri, .btn.pri { background: var(--acc, #2f845a); border-color: var(--acc, #2f845a); color: var(--on-acc, #fff); font-weight: 600; }
button.danger { color: var(--bad, #d70015); }
button.sm { padding: 4px 10px; font-size: 13px; }
button[data-nr] { opacity: .55; }
.big { padding: 12px 22px; font-size: 16px; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--ink, #1d1d1f); background: var(--card-solid, #fff); border: 1px solid var(--line2, rgba(0, 0, 0, .12)); border-radius: 10px; padding: 7px 10px; max-width: 100%; min-width: 0; }
input[type=checkbox] { width: 16px; height: 16px; padding: 0; accent-color: var(--acc, #2f845a); flex: 0 0 auto; }
input[type=range] { flex: 1 1 200px; padding: 0; accent-color: var(--acc, #2f845a); }
table { width: 100%; table-layout: fixed; border-collapse: collapse; word-break: break-word; }

.att-wrap { width: min(1600px, 100%); margin: 0 auto; }
.att-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.att-top h1 { margin: 0; font-size: 26px; flex: 1 1 auto; min-width: 0; word-break: break-word; }
.att-gate, .att-empty { max-width: 460px; margin: 60px auto; display: grid; gap: 14px; text-align: center; justify-items: center; }
.att-gate h1 { margin: 0; font-size: 24px; }
.att-empty h2 { margin: 0; }

/* 课程卡片 */
.att-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.att-course { display: grid; gap: 6px; justify-items: start; text-align: left; margin: 0; padding: 16px 18px; border-radius: 18px; transition: transform .25s var(--hx-ease), box-shadow .25s var(--hx-ease), border-color .25s var(--hx-ease); }
/* 悬停上浮 2px（照首页工具卡的 .tile:hover，但不做 scale —— 缩放会把 1px 亮边拉成 2px 显得糊） */
.att-course:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--acc, #2f845a) 45%, var(--edge, rgba(0, 0, 0, .08))); }
.att-course:active { transform: translateY(0); }
.att-ch { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.att-ch b { font-size: 17px; }
.att-live { font-style: normal; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--accbg, rgba(47, 132, 90, .14)); color: var(--acc, #2f845a); }
.att-cls { display: flex; flex-wrap: wrap; gap: 6px; }
.att-cls i { font-style: normal; font-size: 12.5px; padding: 1px 8px; border-radius: 8px; background: var(--fill, rgba(0, 0, 0, .05)); }

/* 课程页 */
.att-chead { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.att-cmeta { display: grid; gap: 6px; min-width: 0; }
.att-sess { display: grid; gap: 6px; }
.att-se { display: grid; grid-template-columns: 80px 130px 70px 90px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px 12px; border-radius: 12px; background: var(--fill, rgba(0, 0, 0, .03)); font-size: 14px; }
.att-se.on { background: var(--accbg, rgba(47, 132, 90, .12)); }
.att-se-a { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.att-se-a em { font-style: normal; }
@media (max-width: 640px) { .att-se { grid-template-columns: repeat(2, minmax(0, 1fr)); } .att-se-a { grid-column: 1 / -1; justify-content: flex-start; } }

/* 手改表 */
.att-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--dim, #6e6e73); margin-bottom: 8px; }
.att-legend b { display: inline-block; min-width: 1.4em; margin-right: 3px; color: var(--ink, #1d1d1f); text-align: center; }
.att-tw { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; max-width: 100%; }
.att-tab th, .att-tab td { border: 1px solid var(--edge, rgba(0, 0, 0, .12)); padding: 4px 6px; text-align: center; font-size: 13.5px; }
.att-tab th { font-weight: 600; background: var(--fill, rgba(0, 0, 0, .04)); line-height: 1.25; }
.att-tab th small { display: block; font-weight: 400; color: var(--dim, #6e6e73); font-size: 11px; }
.att-tab .att-nm { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-c { position: relative; cursor: pointer; height: 32px; font-size: 16px; }
.att-c:hover { background: var(--accbg, rgba(47, 132, 90, .12)); }
.att-c.st-late, .att-c.st-early { color: #c26a00; }
.att-c.st-absent { color: var(--bad, #d70015); }
.att-c.st-personal, .att-c.st-sick { color: #2f6fd0; }
.att-lg { position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--acc, #2f845a); }
.att-stbtn { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.att-stbtn button { display: grid; gap: 2px; padding: 10px 6px; }
.att-stbtn button b { font-size: 18px; line-height: 1.1; }
.att-stbtn button.on { border-color: var(--acc, #2f845a); background: var(--accbg, rgba(47, 132, 90, .14)); font-weight: 600; }
.att-log { font-size: 13px; margin-bottom: 12px; }
.att-log ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.att-log li { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 10px; border-radius: 8px; background: var(--fill, rgba(0, 0, 0, .04)); }

/* 弹层 */
.att-modal { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .4); overflow: auto; }
.att-mcard { width: min(620px, 100%); margin: 0; max-height: calc(100vh - 32px); overflow: auto; background: var(--card-solid, #fff); }
.att-mcard.att-pvcard { width: min(1400px, 100%); }
.att-pvh { justify-content: space-between; margin-bottom: 8px; }
.att-pvh h2 { margin: 0; }
.att-pv { overflow: auto; max-width: 100%; }
.att-f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
/* 「文本框拉满一行」——必须排除勾选框 / 单选钮。
   2026-11-08 用户截图报「新建课程里班级是黑的、看不见字」：
   `.att-f input { width:100% }` 连班级多选里的 checkbox 一起拉满，
   16px 的方框被撑成 88px，把右边 `<span>班名</span>` 挤成 0 宽，
   于是只剩一个空灰块。排除掉 checkbox/radio 就恢复正常。 */
.att-f input:not([type=checkbox]):not([type=radio]), .att-f select { width: 100%; }
.att-picks { display: flex; flex-wrap: wrap; gap: 8px; font-weight: 400; }
.att-pick { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--fill, rgba(0, 0, 0, .04)); font-size: 14px; max-width: 100%; }
.att-pick span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-pick em { font-style: normal; font-size: 11.5px; padding: 0 6px; border-radius: 6px; background: var(--accbg, rgba(47, 132, 90, .14)); color: var(--acc, #2f845a); }
.att-pick em[hidden] { display: none; }
.att-hint { margin: -4px 0 12px; font-size: 13px; color: var(--acc, #2f845a); word-break: break-word; }
.att-hint[hidden] { display: none; }
.att-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.att-seg button.on { border-color: var(--acc, #2f845a); background: var(--accbg, rgba(47, 132, 90, .14)); color: var(--acc, #2f845a); font-weight: 600; }
.att-gbox { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; }
.att-gbox[hidden], .att-geo[hidden] { display: none; }
.att-gside { flex: 1 1 180px; min-width: 0; display: grid; gap: 8px; }
.att-sw { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; margin-bottom: 10px; cursor: pointer; }
.att-geo { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--fill, rgba(0, 0, 0, .03)); }
.att-geo p { margin: 6px 0 0; word-break: break-word; }
.att-g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* 手势板 */
.att-gpad { width: min(240px, 100%); aspect-ratio: 1; flex: 0 0 auto; }
.gp { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 16px; background: var(--fill, rgba(0, 0, 0, .04)); cursor: crosshair; }
.gp.ro { cursor: default; }
.gp-d { fill: var(--dim, #8e8e93); transition: r .1s; }
.gp-d.on { fill: var(--acc, #2f845a); r: 8; }
.gp-l, .gp-t { fill: none; stroke: var(--acc, #2f845a); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }

/* 大屏 */
.att-big { width: 100%; display: grid; gap: 14px; }
.att-big:fullscreen { background: var(--bg, #f5f5f7); padding: 20px; overflow: auto; }
.bg-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.bg-ttl { display: grid; min-width: 0; }
.bg-ttl b { font-size: clamp(20px, 2vw + 8px, 40px); word-break: break-word; }
.bg-ttl span { color: var(--dim, #6e6e73); font-size: clamp(13px, .8vw + 6px, 20px); }
.bg-left { font-variant-numeric: tabular-nums; font-weight: 700; font-size: clamp(18px, 2vw + 6px, 44px); }
.bg-main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
@media (max-width: 900px) { .bg-main { grid-template-columns: minmax(0, 1fr); } }
.bg-code { margin: 0; display: grid; place-items: center; align-content: center; gap: 16px; min-height: min(60vh, 640px); text-align: center; }
.bg-code { container-type: inline-size; }
.bg-num { font-size: min(10vw, 30vh); font-size: min(19cqi, 30vh); max-width: 100%; font-weight: 800; letter-spacing: .06em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bg-bar { width: min(560px, 90%); height: 8px; border-radius: 99px; background: var(--fill, rgba(0, 0, 0, .08)); overflow: hidden; }
.bg-bar i { display: block; height: 100%; width: 100%; background: var(--acc, #2f845a); }
.bg-tip { font-size: clamp(13px, .8vw + 8px, 22px); margin: 0; }
.bg-qr { width: min(56vh, 92%); height: auto; aspect-ratio: 1; image-rendering: pixelated; border-radius: 12px; background: #fff; }
.bg-qr[hidden], .bg-qrx[hidden] { display: none; }
.bg-gtip { font-size: clamp(28px, 4vw + 8px, 88px); font-weight: 800; margin: 0; word-break: break-word; }
.bg-gpad { width: min(260px, 70%); }
.bg-gpad[hidden] { display: none; }
.bg-end { display: grid; gap: 10px; justify-items: center; }
.bg-end b { font-size: clamp(28px, 3vw + 10px, 72px); }
.bg-side { margin: 0; display: grid; align-content: start; gap: 12px; min-height: 0; }
.bg-count { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.bg-count b { font-size: clamp(40px, 5vw + 10px, 120px); line-height: 1; color: var(--acc, #2f845a); }
.bg-count span { font-size: clamp(16px, 1.4vw + 8px, 40px); color: var(--dim, #6e6e73); }
.bg-count i { font-style: normal; }
.bg-roll { display: grid; grid-template-columns: repeat(auto-fill, minmax(9em, 1fr)); gap: .55em; align-content: start; font-size: var(--bg-fs, 13px); }
/* 身份卡：和排位榜同一套视觉语言（背景铺满 + 遮罩 + 首字母头像 + 姓名 + 状态角标）。
   --hxface / --hxav 由 小组加分/faces.js 产出；--av-h 是无头像时的首字彩色圈（学号哈希，稳定不闪）。
   状态两重编码：边框 + 角标同一色 --st-c（绿=已到 / 橙=迟到·早退 / 灰=未到·请假 / 红=旷课），全走 hx-theme.css 变量。 */
.bg-card { position: relative; display: flex; align-items: center; gap: .5em; min-width: 0; padding: .42em .6em; border: 2px solid var(--st-c, var(--edge, rgba(0, 0, 0, .1))); border-radius: .8em; background: var(--fill, rgba(0, 0, 0, .04)); color: var(--ink, #1d1d1f); line-height: 1.25; overflow: hidden; --st-c: var(--dim, #6e6e73); transition: border-color .15s, background-color .15s; }
.bg-card.st-present { --st-c: var(--ok, #248a3d); }
.bg-card.st-late, .bg-card.st-early { --st-c: var(--warn, #b25000); }
.bg-card.st-absent { --st-c: var(--bad, #d70015); }
.bg-card.st-personal, .bg-card.st-sick { --st-c: var(--dim, #6e6e73); }
.bg-card.has-face::before { content: ''; position: absolute; inset: 0; z-index: 0; background: var(--hxface); border-radius: inherit; }
.bg-card.has-face::after { content: ''; position: absolute; inset: 0; z-index: 0; background: linear-gradient(90deg, rgba(6, 14, 26, .82) 0%, rgba(6, 14, 26, .5) 55%, rgba(6, 14, 26, .22) 100%); border-radius: inherit; }
.bg-card.has-face > * { position: relative; z-index: 1; }
.bg-card.has-face .bg-nm { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
.bg-av { flex: none; width: 1.9em; height: 1.9em; border-radius: 50%; display: grid; place-items: center; background: hsl(var(--av-h, 210) 55% 52%); color: #fff; font-weight: 700; font-size: .82em; }
.bg-av.has-img { color: transparent; background: var(--hxav) !important; background-size: cover !important; background-position: 50% 50% !important; background-repeat: no-repeat !important; }
.bg-nm { flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bg-tag { flex: none; font-style: normal; font-weight: 700; font-size: .68em; line-height: 1.5; padding: 0 .5em; border-radius: 999px; background: var(--st-c); color: #fff; white-space: nowrap; }
html.hx-lite .bg-card.has-face::before, html.hx-lite .bg-card.has-face::after { content: none; }
html.hx-lite .bg-card { transition: none; }

/* 学生签到 */
.att-stu { width: min(720px, 100%); }
.su-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 12px; }
.su-h b { font-size: 18px; }
.su-left { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.su-act { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.su-code { flex: 1 1 160px; font-size: 26px; letter-spacing: .25em; text-align: center; padding: 10px; }
.su-act > button { padding: 12px 22px; font-size: 16px; }
.su-pad { width: min(280px, 100%); }
.su-r { margin-top: 12px; }
.su-r:empty { display: none; }
.su-r .errs { margin: 0; }
.su-ok { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 12px 14px; border-radius: 12px; background: var(--accbg, rgba(47, 132, 90, .14)); }
.su-ok b { font-size: 20px; color: var(--acc, #2f845a); }
.su-ok em { font-style: normal; font-weight: 600; }
.su-ok em.st-late { color: #c26a00; }
@media (max-width: 480px) { #app { padding: 10px; } .card { padding: 14px; border-radius: 16px; } .att-top h1 { font-size: 22px; } }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 9500; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink, #1d1d1f); color: var(--bg, #fff); font-size: 14px; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 像素「正在载入」药丸 + 首屏闪屏：和 资料库工具/src/app.css 同一套（产物单文件，自带一份保证方块跳得起来） */
.hx-px{display:inline-flex;align-items:flex-end;gap:.28em;height:2.2em}
.hx-px i{width:1em;height:1em;border-radius:.16em;display:block;background:linear-gradient(180deg,var(--acc,#2f845a),var(--acc2,#5aa77c));animation:hxPx 1.15s cubic-bezier(.32,.72,0,1) infinite;animation-delay:calc(var(--i) * 90ms)}
@keyframes hxPx{0%,100%{transform:translateY(0);opacity:.55}35%{transform:translateY(-110%);opacity:1}60%{transform:translateY(0);opacity:.7}}
.hx-loadpill{display:inline-flex;flex-direction:column;align-items:center;gap:.85em;padding:.9em 1.2em;border-radius:99px;background:var(--card-solid,#fff);color:var(--ink,#1d1d1f);border:1px solid var(--edge,rgba(0,0,0,.08));font-size:clamp(15px,.85vw + 6px,30px)}
.hx-loadpill .hx-px{font-size:.54em}
.hx-loadpill b{font-weight:600;font-size:.87em;line-height:1;white-space:nowrap}
.hx-loadpill.sm{flex-direction:row;gap:.6em;padding:.55em .9em;font-size:clamp(12px,.7vw + 4px,18px)}
.hx-loadpill.sm b{font-size:1em;color:var(--dim,#6e6e73)}
.hx-loadwrap{display:grid;place-items:center;padding:clamp(28px,4vw,56px) 12px}
.hx-loadwrap.sm{padding:0;min-height:40px}
html.hx-lite .hx-px i{animation:none;opacity:.85}
@media (prefers-reduced-motion:reduce){.hx-px i{animation:none;opacity:.85;transform:none}}
#hxBoot{position:fixed;inset:0;z-index:2147482000;display:grid;place-items:center;background:var(--card-solid,#f6f6f4);transition:opacity .26s ease,visibility 0s linear .26s}
#hxBoot.out{opacity:0;visibility:hidden;pointer-events:none}
#hxBoot .hx-boot-card{display:grid;place-items:center;gap:clamp(14px,2vh,30px);padding:24px}
#hxBootCv{image-rendering:pixelated;display:block;max-width:100%}
#hxBoot .hx-loadpill{font-size:clamp(16px,1.1vw + 9px,30px)}
.hx-boot-title{margin:0;font-size:clamp(20px,1.4vw + 12px,34px);font-weight:700}
html.hx-lite #hxBootCv{display:none}

<script>/* 华夏工具 · 统一「像素加载动效」胶水（2026-11-04，2026-11-06 时序/尺寸返修）。
 *
 * 全站加载提示的统一规则（刷题 / 考试 / 小组加分三处共用同一份实现，各自目录放一份拷贝——
 * 各工具是独立页面、发布路径互不相邻（/shuati/ /exam/ /jiafenxitong/），没有能同时被三个
 * 页面引用的公共目录，所以用「同一份源码拷三份」而不是抽包；改这里时同步另外两份：
 *   · 刷题/loadfx.js（本文件）
 *   · 考试/src/loadfx.js（build.js 打进单文件产物）
 *   · 小组加分/fx/hx-jf-load.js（那边逻辑更重，只对齐「每次随机 + 避开上一次 + 最短停留 + 预跑 + 回落」规则）
 *
 * 规则（用户 2026-11-04 定，2026-11-06 返修，2026-11-05 随机与时长返修）：

 *      一条光秃秃的文字药丸、等内容渲染完再补一层像素闪屏盖上去（用户原话：「你东西加载好了

\n\n  // Check if the specified version can contain the data\n  } else if (version < bestVersion) {\n    throw new Error('\\n' +\n      'The chosen QR Code version cannot contain this amount of data.\\n' +\n      'Minimum version required to store current data is: ' + bestVersion + '.\\n'\n    )\n  }\n\n  const dataBits = createData(version, errorCorrectionLevel, segments)\n\n  // Allocate matrix buffer\n  const moduleCount = Utils.getSymbolSize(version)\n  const modules = new BitMatrix(moduleCount)\n\n  // Add function modules\n  setupFinderPattern(modules, version)\n  setupTimingPattern(modules)\n  setupAlignmentPattern(modules, version)\n\n  // Add temporary dummy bits for format info just to set them as reserved.\n  // This is needed to prevent these bits from being masked by {@link MaskPattern.applyMask}\n  // since the masking operation must be performed only on the encoding region.\n  // These blocks will be replaced with correct values later in code.\n  setupFormatInfo(modules, errorCorrectionLevel, 0)\n\n  if (version >= 7) {\n    setupVersionInfo(modules, version)\n  }\n\n  // Add data codewords\n  setupData(modules, dataBits)\n\n  if (isNaN(maskPattern)) {\n    // Find best mask pattern\n    maskPattern = MaskPattern.getBestMask(modules,\n      setupFormatInfo.bind(null, modules, errorCorrectionLevel))\n  }\n\n  // Apply mask pattern\n  MaskPattern.applyMask(maskPattern, modules)\n\n  // Replace format info bits with correct values\n  setupFormatInfo(modules, errorCorrectionLevel, maskPattern)\n\n  return {\n    modules: modules,\n    version: version,\n    errorCorrectionLevel: errorCorrectionLevel,\n    maskPattern: maskPattern,\n    segments: segments\n  }\n}\n\n\nexports.create = function create (data, options) {\n  if (typeof data === 'undefined' || data === '') {\n    throw new Error('No input text')\n  }\n\n  let errorCorrectionLevel = ECLevel.M\n  let version\n  let mask\n\n  if (typeof options !== 'undefined') {\n    // Use higher error correction level as default\n    errorCorrectionLevel = ECLevel.from(options.errorCorrectionLevel, ECLevel.M)\n    version = Version.from(options.version)\n    mask = MaskPattern.from(options.maskPattern)\n\n    if (options.toSJISFunc) {\n      Utils.setToSJISFunction(options.toSJISFunc)\n    }\n  }\n\n  return createSymbol(data, version, errorCorrectionLevel, mask)\n}\n");

<script>/* 小组加分/faces.js —— 学生头像 + 身份卡背景（2026-11-13）
   ------------------------------------------------------------------
   教师端分组看板（app.js）和学生端选座页（team.js）都要画「某个学生长什么样」，
   以前各写一套，结果规则跑偏：头像压在姓氏字下面、背景只铺在头像圈上而不是整张卡片。
   现在两边的规则只在这里定义一次。

   数据来源：RPC public.hx_class_faces(p_class)
     一次返回本班每个人的 {student_no, name, bg, pos, avatar}
     · bg     = hx_rank_bg.bg（'p:预设键' 或 data:image/...;base64）
     · avatar = auth.users.user_metadata->>'avatar_url'（Storage 桶 hx-avatars 的公开 URL）
     老师只能读自己的班，学生只能读自己所在的班（函数里判）。

   用法（两边一样）：
     HXFaces.load(clsId, rpc).then(...)      // rpc 用各自页面里的那个包装函数
     var f = HXFaces.of(clsId, studentNo);   // {} 或 {card:'…', av:'…', hasAv:true}
     '<div class="gb-chip' + (f.card ? ' has-face' : '') + '" style="' + f.card + '">'
     '<span class="gb-av' + (f.hasAv ? ' has-img' : '') + '" style="' + f.av + '">' + 首字 + '</span>'

   注意：返回的字符串是**已经可以直接塞进 style="…" 属性**的形式（内部双引号换成单引号），
   调用方不要再包引号、也不要再做转义。
   ------------------------------------------------------------------ */
(function (w) {
  'use strict';

  var cache = {};    // clsId -> { '学号': {bg, pos, avatar} }
  var pending = {};  // clsId -> Promise（同一班并发只发一次请求）

  function clampPos(v) {
    var n = Number(v);
    if (!isFinite(n)) return 50;
    return Math.max(0, Math.min(100, Math.round(n)));
  }

  /* 背景值 → 可直接赋给 background 的值；认不出就返回 ''（调用方保持默认底色） */
  function bgValue(bg, pos) {
    var t = String(bg || '');
    if (!t) return '';
    if (/^p:[a-z0-9_-]{1,24}$/i.test(t)) {
      var css = (w.rankBgCss && w.rankBgCss(t)) || '';
      if (!css) return '';
      /* 预设是按 3.2:1 身份卡设计的，铺小卡片时把「100% 100% 拉伸」改成 cover，别压扁 */
      return css.replace(/0 0\s*\/\s*100% 100%/g, '50% 50% / cover');
    }
    if (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(t))
      return "url('" + t + "') 50% " + clampPos(pos) + "% / cover no-repeat";
    return '';
  }

  /* 头像 URL → url(...) 值。只认 http(s) 和 data:image，其它一律当没有 */
  function avValue(url) {
    var t = String(url || '').trim();
    if (!t) return '';
    if (!/^https?:\/\//i.test(t) && !/^data:image\//i.test(t)) return '';
    return "url('" + t.replace(/['"\\]/g, '') + "') 50% 50% / cover no-repeat";
  }

  function safeAttr(s) { return String(s || '').replace(/"/g, "'"); }

  var HXFaces = {
    /** 拉本班头像/背景。rpc 传各自页面的包装函数（签名 (name, params) => Promise）。 */
    load: function (clsId, rpc) {
      var id = String(clsId || '');
      if (!id || typeof rpc !== 'function') return Promise.resolve({});
      if (cache[id]) return Promise.resolve(cache[id]);
      if (pending[id]) return pending[id];
      pending[id] = rpc('hx_class_faces', { p_class: Number(id) }).then(function (rows) {
        var map = {};
        (rows || []).forEach(function (r) {
          var k = String(r.student_no || '');
          if (!k) return;
          map[k] = { bg: r.bg || '', pos: r.pos, avatar: r.avatar || '' };
        });
        cache[id] = map;
        pending[id] = null;
        return map;
      }).catch(function (e) {
        pending[id] = null;
        throw e;
      });
      return pending[id];
    },

    /** 已经拉回来的原始表（没拉过返回 null） */
    raw: function (clsId) { return cache[String(clsId || '')] || null; },

    /** 丢掉某班的缓存（教师改完学生设置、或换了账号时用） */
    clear: function (clsId) {
      if (clsId == null) { cache = {}; pending = {}; return; }
      delete cache[String(clsId)]; delete pending[String(clsId)];
    },

    /** 取某个学号的样式：{card, av, hasAv}。card/av 是可直接塞进 style= 的声明串。 */
    of: function (clsId, studentNo) {
      var m = cache[String(clsId || '')];
      var rec = m && m[String(studentNo || '')];
      var card = '', av = '';
      if (rec) {
        var b = bgValue(rec.bg, rec.pos);
        if (b) card = '--hxface:' + safeAttr(b) + ';';
        var a = avValue(rec.avatar);
        if (a) av = '--hxav:' + safeAttr(a) + ';';
      }
      return { card: card, av: av, hasAv: !!av };
    },

    /** 头像圈里显示的首字：姓名首字，没有姓名就用 ? */
    initial: function (name) { return String(name || '?').slice(0, 1); }
  };

  w.HXFaces = HXFaces;
})(window);
</script>
<script>/* 考勤表：网页预览 + 导出 xlsx / PDF（K7 + K8）
 * 经典脚本，挂 window.ATTSheet；node 下也能 require（module.exports 同一对象，测试用）。
 *
 * 版式照学校原件：每页 54 行 × 21 列（序号/学号/姓名 + 17 个日期列 + 平时总评）
 *   第 1 行 标题「学生课堂考勤表」（A1:U1 合并）
 *   第 2 行 学期/课程/教师/班级（A2:U2 合并）
 *   第 3、4 行 表头：序号/学号/姓名/平时总评 上下合并；日期列上格月、下格日
 *   第 5～53 行 学生（每页 49 行，不足留空行）
 *   第 54 行 备注（A54:U54 合并）
 *
 * 分页规则：课次按 (seq, day, id) 排序后每 17 次一组，学生按服务端顺序每 49 人一组；
 *   页序 = 课次组在外、学生组在内：(课1-17,人1-49) (课1-17,人50-98) … (课18-34,人1-49) …
 *   每页标题、学期课程行、表头、备注完整重复；序号按全名单连续编号（第 2 组学生从 50 起）。
 *
 * xlsx：不用 SheetJS 社区版写（它写不了边框和打印设置），这里直接生成 OOXML + 无压缩 zip。
 *   每页一张工作表「第N页」，A4 横向、缩放到 1 页宽 1 页高、打印区域 A1:U54。
 * PDF：隐藏 iframe 渲染同一份预览 HTML + @page { size: A4 landscape; margin: 0 }，调 print() 让老师另存 PDF。
 *   理由：中文字体由系统提供、显示必然正确，不用打包十几 MB 的中文字体给 jsPDF；输出是矢量文字。
 */
(function (root) {
  'use strict';

  var DATE_COLS = 17, ROWS = 49, NCOL = 3 + DATE_COLS + 1; // 21 列 A..U
  var SYM = { present: '', late: 'X', early: 'ф', personal: '⊙', sick: '¤', absent: '○' };
  var REMARK = '备注：事假 ⊙ 病假 ¤ 旷课 ○ 迟到 X 早退 ф';
  var TITLE = '学生课堂考勤表';
  var COL_W = [5, 15, 15].concat(rep(6, DATE_COLS)).concat([12]); // Excel 字符宽（原件 1280/3840/1536/3072 ÷ 256）
  var SP = '　';

  function rep(v, n) { var a = []; for (var i = 0; i < n; i++) a.push(v); return a; }
  function chunk(a, n) { var r = []; for (var i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r.length ? r : [[]]; }
  function str(v) { return v == null ? '' : String(v); }

  function symbol(status) { return status && Object.prototype.hasOwnProperty.call(SYM, status) ? SYM[status] : ''; }

  function infoLine(sh, opts) {
    var c = (sh && sh.course) || {};
    var names = [];
    (c.classes || []).forEach(function (k) { if (k && k.name && names.indexOf(k.name) < 0) names.push(k.name); });
    if (!names.length) (sh.students || []).forEach(function (s) { if (s.class && names.indexOf(s.class) < 0) names.push(s.class); });
    var term = str(c.term) || ((c.classes || [])[0] || {}).term || '';
    return '学期：' + str(term) + SP + '课程：' + str(c.subject || c.name) + SP +
      '教师：' + str((opts && opts.teacher) || '') + SP + '班级：' + names.join('、');
  }

  function parseDay(d) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(str(d));
    return m ? { m: +m[2], d: +m[3] } : { m: '', d: '' };
  }

  // 纯函数：sheetJson → 分页数据
  function pages(sh, opts) {
    sh = sh || {};
    var marks = sh.marks || {};
    var sessions = (sh.sessions || []).slice().sort(function (a, b) {
      return (a.seq - b.seq) || (str(a.day) < str(b.day) ? -1 : str(a.day) > str(b.day) ? 1 : 0) || (a.id - b.id);
    });
    var students = (sh.students || []).map(function (s, i) { return { s: s, idx: i + 1 }; });
    var info = infoLine(sh, opts);
    var sGroups = chunk(sessions, DATE_COLS), pGroups = chunk(students, ROWS);
    var out = [], n = 0;
    sGroups.forEach(function (sg, si) {
      pGroups.forEach(function (pg, pi) {
        n++;
        var dates = [];
        for (var i = 0; i < DATE_COLS; i++) {
          var x = sg[i];
          if (x) { var md = parseDay(x.day); dates.push({ session: x.id, seq: x.seq, day: x.day, month: md.m, date: md.d }); }
          else dates.push(null);
        }
        var rows = [];
        for (var r = 0; r < ROWS; r++) {
          var it = pg[r];
          if (!it) { rows.push(null); continue; }
          var st = it.s, cells = dates.map(function (d) {
            if (!d) return '';
            var m = marks[String(d.session)];
            return symbol(m ? m[String(st.id)] : null);
          });
          rows.push({ id: st.id, seq: it.idx, no: str(st.no), name: str(st.name) + (st.left ? '（退）' : ''), left: !!st.left, cells: cells });
        }
        out.push({ index: n, title: TITLE, info: info, dateGroup: si, studentGroup: pi,
          firstSession: sg.length ? si * DATE_COLS + 1 : null, dates: dates, rows: rows, remark: REMARK });
      });
    });
    return out;
  }

  /* ---------------- HTML（预览 + 打印共用） ---------------- */
  function esc(s) { return str(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var CSS = [
    '.att-page{width:297mm;height:210mm;box-sizing:border-box;padding:7mm 10mm;background:#fff;color:#000;overflow:hidden;',
    'font-family:"SimSun","宋体","Songti SC","Noto Serif CJK SC",serif;}',
    '.att-page table{width:100%;table-layout:fixed;border-collapse:collapse;}',
    '.att-page td{border:0.2mm solid #000;padding:0 0.6mm;text-align:center;vertical-align:middle;white-space:nowrap;overflow:hidden;',
    'font-size:7pt;line-height:2.8mm;height:3mm;}',
    '.att-page tr.t td{border:0;height:10mm;line-height:10mm;font-size:16pt;font-weight:bold;letter-spacing:2mm;}',
    '.att-page tr.i td{border:0;height:6mm;line-height:6mm;font-size:9pt;text-align:left;}',
    '.att-page tr.h td{height:5mm;line-height:4.6mm;font-size:8pt;}',
    '.att-page tr.r td{border:0;height:6mm;line-height:6mm;font-size:8pt;text-align:left;}',
    '.att-page td.nm{text-align:left;}'
  ].join('');

  function pageHtml(p) {
    var w = COL_W.reduce(function (a, b) { return a + b; }, 0);
    var h = '<div class="att-page" data-page="' + p.index + '"><table><colgroup>';
    COL_W.forEach(function (c) { h += '<col style="width:' + (c / w * 100).toFixed(4) + '%">'; });
    h += '</colgroup><tbody>';
    h += '<tr class="t"><td colspan="' + NCOL + '">' + esc(p.title) + '</td></tr>';
    h += '<tr class="i"><td colspan="' + NCOL + '">' + esc(p.info) + '</td></tr>';
    h += '<tr class="h"><td rowspan="2">序号</td><td rowspan="2">学号</td><td rowspan="2">姓名</td>';
    p.dates.forEach(function (d) { h += '<td>' + (d ? d.month : '') + '</td>'; });
    h += '<td rowspan="2">平时总评</td></tr><tr class="h">';
    p.dates.forEach(function (d) { h += '<td>' + (d ? d.date : '') + '</td>'; });
    h += '</tr>';
    p.rows.forEach(function (r) {
      h += '<tr class="s">';
      if (!r) { for (var i = 0; i < NCOL; i++) h += '<td></td>'; }
      else {
        h += '<td>' + r.seq + '</td><td>' + esc(r.no) + '</td><td class="nm">' + esc(r.name) + '</td>';
        r.cells.forEach(function (c) { h += '<td>' + esc(c) + '</td>'; });
        h += '<td></td>';
      }
      h += '</tr>';
    });
    h += '<tr class="r"><td colspan="' + NCOL + '">' + esc(p.remark) + '</td></tr>';
    return h + '</tbody></table></div>';
  }

  // 打印 / 另存 PDF 用的完整文档
  function printHtml(sh, opts) {
    var ps = pages(sh, opts);
    return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(fileBase(sh)) + '</title><style>' +
      '@page { size: A4 landscape; margin: 0; }' +
      'html,body{margin:0;padding:0;background:#fff;}' +
      '*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}' + CSS +
      '.att-page{break-after:page;page-break-after:always;}.att-page:last-child{break-after:auto;page-break-after:auto;}' +
      '</style></head><body>' + ps.map(pageHtml).join('') + '</body></html>';
  }

  // 网页预览：每页一个 A4 横向容器，按容器宽度等比缩小（不放大），保证窄屏不横向溢出
  function renderPreview(container, sh, opts) {
    var doc = container.ownerDocument;
    if (!doc.getElementById('att-sheet-css')) {
      var st = doc.createElement('style'); st.id = 'att-sheet-css';
      st.textContent = CSS + '.att-preview{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;min-width:0;}' +
        '.att-fit{position:relative;flex:none;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.25);}' +
        '.att-fit>.att-page{position:absolute;left:0;top:0;transform-origin:0 0;}';
      doc.head.appendChild(st);
    }
    var ps = pages(sh, opts);
    container.innerHTML = '<div class="att-preview">' + ps.map(function (p) { return '<div class="att-fit">' + pageHtml(p) + '</div>'; }).join('') + '</div>';
    var wrap = container.firstChild;
    function fit() {
      var fits = wrap.querySelectorAll('.att-fit');
      if (!fits.length) return;
      var pg = fits[0].firstChild, pw = pg.offsetWidth, ph = pg.offsetHeight;
      var avail = wrap.clientWidth || pw, s = Math.min(1, avail / pw);
      for (var i = 0; i < fits.length; i++) {
        fits[i].style.width = (pw * s) + 'px'; fits[i].style.height = (ph * s) + 'px';
        fits[i].firstChild.style.transform = s < 1 ? 'scale(' + s + ')' : '';
      }
    }
    fit();
    var win = doc.defaultView;
    if (container.__attRO) container.__attRO.disconnect();
    if (win && win.ResizeObserver) { container.__attRO = new win.ResizeObserver(fit); container.__attRO.observe(container); }
    return ps;
  }

  /* ---------------- xlsx（手写 OOXML + 无压缩 zip） ---------------- */
  function colName(i) { var s = ''; i++; while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; }
  function xesc(s) { return str(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var LAST = colName(NCOL - 1); // U

  // 样式：0 默认；1 标题；2 学期行；3 带框居中；4 带框居中加粗（表头）；5 备注；6 带框左对齐（姓名）
  var STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

function every(fn, ms) { const id = setInterval(fn, ms); TIMERS.add(id); return id; }

function stopTimers() { TIMERS.forEach(id => { clearInterval(id); clearTimeout(id); }); TIMERS.clear(); }

let booting = false, bootDone = false, lastUid = null, LINK = null;
async function boot() {
  if (booting) return; booting = true;
  try { await bootOnce(); bootDone = true; } finally { booting = false; }
}
async function bootOnce() {
  stopTimers();
  if (!LINK) LINK = takeLink();
  if (window.HXTheme && HXTheme.gated) return;     // hx-theme.js 已经把页面送回总入口登录
  load();
  lastUid = sess && sess.user ? sess.user.id : null;
  ME.uid = lastUid;
  if (!sess || !sess.access_token) return gate('请先登录');
  try { ME.me = await rpc('hx_me'); }
  catch (e) { return gate(e.status === 401 ? '请先登录' : '出错了', e.status === 401 ? '登录过期了' : e.message); }
  if (ME.me && (ME.me.teacher || ME.me.admin || ME.me.dev)) return teacherHome();
  if (ME.me && ME.me.student) { const l = LINK; LINK = null; return studentHome(l); }
  gate('这个账号还没加入班级', '用班级课堂码开通后再来签到');
}
addEventListener('storage', e => {
  if (e.key !== SKEY) return;
  const s = load(); const uid = s && s.user ? s.user.id : null;
  if (bootDone && uid === lastUid) return;
  lastUid = uid; boot();
});

/* 3×3 手势板（教师出题 / 学生签到共用）。点位编号按行 1~9：
     1 2 3
     4 5 6
     7 8 9
   输出 '1-5-9-6' 这种串（服务端 hx_att__gesture 只留 1~9、4~9 个点、不能重复）。
   鼠标、触摸、手写笔都走 Pointer Events；touch-action:none 防止画的时候页面跟着滚。 */
const GP_R = 0.3;   // 命中半径（相对格距）：1→6 这种「马步」连线离 2 号点 0.447 格，不会误吸
function gPad(host, opt) {
  opt = opt || {};
  const pts = [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2]];
  const P = i => [20 + pts[i][0] * 40, 20 + pts[i][1] * 40];   // viewBox 0..120
  host.innerHTML = `<svg class="gp" viewBox="0 0 120 120" role="img" aria-label="3×3 手势板">
    <polyline class="gp-l" points="" /><line class="gp-t" x1="0" y1="0" x2="0" y2="0" />
    ${pts.map((p, i) => `<circle class="gp-d" data-i="${i + 1}" cx="${20 + p[0] * 40}" cy="${20 + p[1] * 40}" r="6" />`).join('')}
  </svg>`;
  const svg = host.firstElementChild, line = svg.querySelector('.gp-l'), tail = svg.querySelector('.gp-t');
  let seq = [], drawing = false;
  const paint = () => {
    line.setAttribute('points', seq.map(n => P(n - 1).join(',')).join(' '));
    svg.querySelectorAll('.gp-d').forEach(c => c.classList.toggle('on', seq.includes(+c.dataset.i)));
  };
  const toLocal = e => {
    const r = svg.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * 120, (e.clientY - r.top) / r.height * 120];
  };
  const hit = ([x, y]) => {
    for (let i = 0; i < 9; i++) { const [cx, cy] = P(i); if (Math.hypot(x - cx, y - cy) <= GP_R * 40) return i + 1; }
    return 0;
  };
  const hideTail = () => { tail.setAttribute('x2', tail.getAttribute('x1')); tail.setAttribute('y2', tail.getAttribute('y1')); };
  const move = e => {
    if (!drawing) return;
    const q = toLocal(e), n = hit(q);
    if (n && !seq.includes(n)) { seq.push(n); paint(); }
    if (seq.length) { const [x1, y1] = P(seq[seq.length - 1] - 1); tail.setAttribute('x1', x1); tail.setAttribute('y1', y1); tail.setAttribute('x2', q[0]); tail.setAttribute('y2', q[1]); }
  };
  const end = () => {
    if (!drawing) return;
    drawing = false; hideTail();
    if (opt.onDone) opt.onDone(seq.join('-'), seq.slice());
  };
  if (!opt.readonly) {
    svg.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { svg.setPointerCapture(e.pointerId); } catch (x) { }
      drawing = true; seq = []; paint(); move(e);
    });
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
  } else svg.classList.add('ro');
  return {
    get: () => seq.join('-'),
    len: () => seq.length,
    show: s => { seq = String(s || '').split(/\D+/).filter(Boolean).map(Number); paint(); },
    clear: () => { seq = []; paint(); hideTail(); }
  };
}
/* 随机图案（只给老师看）：5~6 个点；一步若直线穿过一个没用过的点（如 1→3 穿过 2），
   学生照着画时会把中间点也吸进去 —— 这种步不选，保证随机出来的图案画得出来。 */
function gRandom() {
  const xy = n => [(n - 1) % 3, Math.floor((n - 1) / 3)];
  for (let tries = 0; tries < 200; tries++) {
    const want = 5 + Math.floor(Math.random() * 2), seq = [1 + Math.floor(Math.random() * 9)];
    while (seq.length < want) {
      const [x0, y0] = xy(seq[seq.length - 1]);
      const ok = [];
      for (let n = 1; n <= 9; n++) {
        if (seq.includes(n)) continue;
        const [x1, y1] = xy(n), dx = x1 - x0, dy = y1 - y0;
        if (Math.abs(dx) % 2 === 0 && Math.abs(dy) % 2 === 0) {
          const mid = (y0 + dy / 2) * 3 + (x0 + dx / 2) + 1;
          if (!seq.includes(mid)) continue;
        }
        ok.push(n);
      }
      if (!ok.length) break;
      seq.push(ok[Math.floor(Math.random() * ok.length)]);
    }
    if (seq.length === want) return seq.join('-');
  }
  return '1-2-3-6-9';
}

/* 教师端：K2 课程 / 课次，K3 发布 · 大屏 · 停止，K6 手动改 + 改动日志。
   数据全走 rpc：hx_my_classes（自己的班）、hx_class_group_list（合班组）、hx_exam_subject_list（科目）、
   hx_att_course_* / hx_att_open / hx_att_close / hx_att_session_del / hx_att_code / hx_att_live / hx_att_sheet / hx_att_set。 */
const T = { cls: [], clsAll: [], groups: [], subj: [], courses: [], cur: null, sheet: null, view: 'list', err: '' };

async function teacherHome() {
  T.view = 'list'; stopTimers();
  app().innerHTML = `<div class="att-wrap"><div class="att-top"><h1>考勤</h1><button class="pri" id="cNew">+ 新建课程</button></div>
    <div id="cList">${fxLoad('正在载入课程…')}</div></div>`;
  fxAuto();
  $('cNew').onclick = () => courseEdit(null);
  await Promise.all([loadBase(), loadCourses()]);
  drawCourses();
}
async function loadBase() {
  const [c, g, s] = await Promise.all([
    rpc('hx_my_classes').catch(e => { T.err = '读不到班级：' + e.message; return []; }),
    rpc('hx_class_group_list').catch(() => []),
    rpc('hx_exam_subject_list').catch(() => [])
  ]);
  const raw = (Array.isArray(c) ? c : []).filter(x => x.mine !== false)
    .map(x => ({ id: +x.id, name: String(x.name || ''), term: x.term || '', total: +x.total || 0, tools: Array.isArray(x.tools) ? x.tools : [] }));
  /* 2026-11-09 用户原话：「班级默认考勤不需要勾选 这是必备的」。
     原来的写法是 raw.filter(k => k.tools.includes('kaoqin')) —— 但 hx_classes.tools 的**列默认值**
     只有 ['wiring','mcu','exam','jiafen']，压根没有 'kaoqin'（见 2026-11-01 那个迁移）。
     结果：老师明明在首页点亮了工具（接线/刷题/单片机/考试/小组加分），考勤这一页还是筛到 0 个班，
     弹出「你有 5 个班，但首页「班级」里都还没点亮「考勤」」—— 而他根本没有「考勤」这个圆点可点。
     现在：考勤是每个班的**必备功能**，不看 tools；只要这个班没被「收起」（收起 = tools 清空，
     首页那个「收起/恢复使用」按钮就是写 tools: []），就能在考勤里选。
     这样「收起上学期带完的班」的语义照样成立，新建/导入的班也不用去点亮什么。 */
  T.clsAll = raw;
  T.cls = raw.filter(k => k.tools.length > 0);
  T.groups = (Array.isArray(g) ? g : []).map(x => ({ id: +x.id, name: String(x.name || ''), ids: (x.classes || []).map(k => +k.id), names: (x.classes || []).map(k => String(k.name || '')) }));
  T.subj = (Array.isArray(s) ? s : []).map(x => ({ id: +x.id, name: String(x.name || x.key || '') }));
}
async function loadCourses() {
  try { const r = await rpc('hx_att_course_list'); T.courses = Array.isArray(r) ? r : []; T.err = T.err.startsWith('读不到课程') ? '' : T.err; }
  catch (e) { T.err = '读不到课程：' + e.message; }
}
function drawCourses() {
  const box = $('cList'); if (!box || T.view !== 'list') return;
  if (!T.courses.length) {
    box.innerHTML = `<div class="card att-empty"><h2>还没有考勤课程</h2>${T.err ? `<p class="errs">${esc(T.err)}</p>` : ''}<div class="row"><button class="pri" id="cFirst">+ 新建课程</button></div></div>`;
    $('cFirst').onclick = () => courseEdit(null);
    return;
  }
  box.innerHTML = (T.err ? `<p class="errs">${esc(T.err)}</p>` : '') + `<div class="att-courses">${T.courses.map(c => `
    <button class="att-course card" data-course="${c.id}">
      <span class="att-ch"><b>${esc(c.name)}</b>${c.active ? '<em class="att-live">进行中</em>' : ''}</span>
      <span class="note">${esc([c.subject, c.term].filter(Boolean).join(' · '))}</span>
      <span class="att-cls">${(c.classes || []).map(k => `<i>${esc(k.name)}</i>`).join('')}</span>
      <span class="note">已考勤 ${+c.sessions || 0} 次</span>
    </button>`).join('')}</div>`;
  box.querySelectorAll('[data-course]').forEach(b => b.onclick = () => courseOpen(+b.dataset.course));
}

/* ---------------- 建 / 改课程 ---------------- */
const groupOf = id => T.groups.find(g => g.ids.includes(id)) || null;
function courseEdit(id) {
  const c = id == null ? null : T.courses.find(x => x.id === id);
  const picked = new Set(c ? (c.class_ids || []).map(Number) : []);
  attModal(`<h2>${c ? '修改课程' : '新建考勤课程'}</h2>
    <label class="att-f">科目<select id="ceSub"><option value="">（不选科目）</option>${T.subj.map(s => `<option value="${s.id}"${c && +c.subject_id === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label class="att-f">课程名<input id="ceName" maxlength="40" autocomplete="off" value="${esc(c ? c.name : '')}"></label>
    <label class="att-f">学期<input id="ceTerm" maxlength="40" autocomplete="off" value="${esc(c ? c.term : termNow())}"></label>
    <div class="att-f">班级<div class="att-picks" id="ceCls">${T.cls.length ? T.cls.map(k => `<label class="att-pick"><input type="checkbox" value="${k.id}"${picked.has(k.id) ? ' checked' : ''}><span>${esc(k.name)}</span><em hidden>合班</em></label>`).join('') : `<p class="note">${T.clsAll.length ? `你有 ${T.clsAll.length} 个班，但都被「收起」了（首页「班级」里点过收起）。在首页对上课的班点「恢复使用」，这里就能选了。` : '还没有班级，先去首页「班级」建班。'}</p>`}</div></div>
    <p class="att-hint" id="ceHint" hidden></p>
    <div class="errs" id="ceErr" hidden></div>
    <div class="row"><button class="pri" id="ceSave">保存</button><button id="ceCancel">取消</button></div>`);
  const sub = $('ceSub'), nm = $('ceName');
  let autoName = !c;   // 新建时课程名跟着科目 + 班级自动拼；用户自己打过字就不再覆盖
  nm.oninput = () => { autoName = false; };
  // 「科目」是归类（全站共用的一份科目字典，考试/资料库也用），「课程名」是这张考勤表叫什么。
  // 两个字段长得像，是因为默认自动拼成「科目 · 班级」——2026-11-08 用户问「是不是冗余了」，
  // 改成带班名之后一眼就能看出区别：一个科目可以有好几张课程（不同学期、不同班），
  // 名字自动带上班级，不用自己再想。
  const autoFill = () => {
    if (!autoName) return;
    const s = T.subj.find(x => x.id === +sub.value);
    // 只算「用户自己勾的」：合班自动带出来的班由服务端现算（p_class_ids 也不传它们），
    // 名字里再堆一遍只会变长、还和实际提交的参数对不上。
    const ids = [...$('ceCls').querySelectorAll('input:checked')].filter(b => !b.dataset.auto).map(b => +b.value);
    const ns = T.cls.filter(k => ids.includes(k.id)).map(k => k.name);
    nm.value = [s ? s.name : '', ns.join('、')].filter(Boolean).join(' · ');
  };
  sub.onchange = () => {
    // 选科目就把它上次用的班级带出来 —— 「科目绑班级」的实用版：
    // 不用每次都重新勾一遍，绑定关系就是这张科目上一张考勤表勾过的班（存在课程里，不另开表）。
    const sid = +sub.value;
    if (!picked.size && sid) {
      const last = T.courses.filter(x => +x.subject_id === sid).sort((a, b) => (+b.id) - (+a.id))[0];
      if (last && (last.class_ids || []).length) {
        const want = new Set((last.class_ids || []).map(Number));
        $('ceCls').querySelectorAll('input').forEach(b => { if (want.has(+b.value)) { b.checked = true; picked.add(+b.value); } });
        hint();
      }
    }
    autoFill();
  };
  // ── 合班自动带出：勾了「24电气1班」，它所属合班里的其他班一起勾上并置灰 ──
  const hint = () => {
    const boxes = [...$('ceCls').querySelectorAll('input')];
    const mine = new Set(boxes.filter(b => b.checked && !b.dataset.auto).map(b => +b.value));
    const auto = new Map();
    mine.forEach(id => { const g = groupOf(id); if (g) g.ids.forEach(x => { if (!mine.has(x)) auto.set(x, g.name); }); });
    boxes.forEach(b => {
      const a = auto.has(+b.value);
      if (a) { b.checked = true; b.disabled = true; b.dataset.auto = '1'; }
      else if (b.dataset.auto) { b.checked = false; b.disabled = false; delete b.dataset.auto; }
      b.parentElement.querySelector('em').hidden = !a;
    });
    const h = $('ceHint');
    if (auto.size) {
      const by = {}; auto.forEach((g, x) => { (by[g] = by[g] || []).push((T.cls.find(k => k.id === x) || { name: '班' + x }).name); });
      h.textContent = Object.entries(by).map(([g, ns]) => '合班「' + g + '」自动带上：' + ns.join('、')).join('；');
      h.hidden = false;
    } else h.hidden = true;
    autoFill();
  };
  $('ceCls').addEventListener('change', hint);
  hint();
  $('ceCancel').onclick = attModalClose;
  $('ceSave').onclick = async () => {
    const fail = m => { $('ceErr').textContent = m; $('ceErr').hidden = false; };
    const name = nm.value.trim(), term = $('ceTerm').value.trim();
    const ids = [...$('ceCls').querySelectorAll('input:checked')].filter(b => !b.dataset.auto).map(b => +b.value);
    if (!name) return fail('请填课程名');
    if (!ids.length) return fail('至少勾 1 个班');
    $('ceSave').disabled = true;
    try {
      const r = await rpc('hx_att_course_save', { p_id: c ? c.id : null, p_name: name, p_subject: sub.value ? +sub.value : null, p_term: term, p_class_ids: ids });
      attModalClose();
      await loadCourses();
      toast(c ? '已保存' : '已建课程「' + name + '」');
      if (c) courseOpen(c.id); else if (T.view === 'list') drawCourses();
      return r;
    } catch (e) { $('ceSave').disabled = false; fail('保存失败：' + e.message); }
  };
}

/* ---------------- 课程页：课次列表 + 手改表 ---------------- */
async function courseOpen(id) {
  stopTimers();
  T.view = 'course'; T.cur = id; T.sheet = null;
  const c = T.courses.find(x => x.id === id) || { id, name: '', classes: [] };
  app().innerHTML = `<div class="att-wrap"><div class="att-top"><button id="coBack">‹ 课程</button><h1>${esc(c.name)}</h1></div><div id="coBody">${fxLoad('正在载入考勤表…')}</div></div>`;
  fxAuto();
  $('coBack').onclick = () => teacherHome();
  try { T.sheet = await rpc('hx_att_sheet', { p_course: id }); }
  catch (e) { $('coBody').innerHTML = `<p class="errs">读不到考勤表：${esc(e.message)}</p>`; return; }
  if (T.view !== 'course' || T.cur !== id) return;
  drawCourse();
}

const arrivedOf = sid => Object.values((T.sheet.marks || {})[sid] || {}).filter(v => v === 'present' || v === 'late').length;

/* ---------------- 定位 ---------------- */
function getPos(ms) {
  return new Promise((ok, no) => {
    if (!navigator.geolocation) return no(Object.assign(new Error('这个浏览器不支持定位'), { code: 0 }));
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; no(Object.assign(new Error('定位超时'), { code: 3 })); } }, (ms || 10000) + 500);
    navigator.geolocation.getCurrentPosition(p => { if (done) return; done = true; clearTimeout(t); ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }); },
      e => { if (done) return; done = true; clearTimeout(t); no(Object.assign(new Error(e.code === 1 ? '定位被拒绝' : e.code === 3 ? '定位超时' : '取不到位置'), { code: e.code })); },
      { enableHighAccuracy: true, timeout: ms || 10000, maximumAge: 0 });
  });
}

function drawQrTo(cv, text) {
  try {
    const ctx = cv.getContext('2d');
    if (!ctx || !window.HXQR) return false;
    const m = HXQR.create(text, { errorCorrectionLevel: 'M' }).modules, N = m.size, PX = 10, Q = 4, W = (N + Q * 2) * PX;
    cv.width = W; cv.height = W;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, W); ctx.fillStyle = '#000';
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (m.get(r, c)) ctx.fillRect((Q + c) * PX, (Q + r) * PX, PX, PX);
    return true;
  } catch (e) { return false; }
}

/* ---------------- K3 大屏 · 身份卡（.bg-p 换成人卡，对齐排位身份卡） ----------------
   人卡结构：背景层（--hxface 铺满）+ 遮罩 + 首字母头像（--hxav 照片 / --av-h 彩色首字）+ 姓名 + 状态角标。

   性能：第一次全量建卡，之后轮询只改「变了的人卡」的 class / 角标文案；background 只在建卡时写一次，绝不重写。 */
const BG_ST = { present: '已到', late: '迟到', none: '未到', early: '早退', personal: '事假', sick: '病假', absent: '旷课' };

function bigHue(s) { let h = 0; s = String(s == null ? '' : s); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function bigKey(x) { return String(x.student_id != null ? x.student_id : (x.no != null ? x.no : x.name)); }
function bigFace(cid, no, name) {
  if (!window.HXFaces || cid == null) return { card: '', av: '', hasAv: false };
  let key = (no != null && String(no) !== '') ? String(no) : (FACENAME[cid + '\u0000' + name] || '');
  if (!key) return { card: '', av: '', hasAv: false };   // 对不上就首字母降级，不瞎猜
  return window.HXFaces.of(cid, key);
}
function bigTitle(x) { return (x.class || '') + (x.at ? ' ' + hm(x.at) : ''); }
function bigCardHtml(x) {
  const st = x.status || 'none';
  const f = bigFace(x.class_id, x.no, x.name);
  const av = '--av-h:' + bigHue(x.no || x.name) + ';' + f.av;
  return '<div class="bg-card st-' + st + (f.card ? ' has-face' : '') + '" data-key="' + bigKey(x) + '" data-st="' + st + '"' + (f.card ? ' style="' + f.card + '"' : '')
    + ' title="' + esc(bigTitle(x)) + '">'
    + '<span class="bg-av' + (f.hasAv ? ' has-img' : '') + '" aria-hidden="true" style="' + av + '">' + esc(String(x.name || '?').slice(0, 1)) + '</span>'
    + '<span class="bg-nm">' + esc(x.name) + '</span>'

function bigStyle(rollEl, n) {
  if (!rollEl) return;
  // 人多字小、人少字大；卡内 em 全跟着这块字号走，一块缩到底

function bigRoll(rollEl, rows, prev) {
  const arr = Array.isArray(rows) ? rows : [];

  if (rebuild) {
    bigStyle(rollEl, arr.length);
    rollEl.innerHTML = arr.map(bigCardHtml).join('');
    map.clear();
    rollEl.querySelectorAll('.bg-card').forEach(n => map.set(n.dataset.key, n));
  }
  // 增量：只更新状态变了的卡（class + 角标文案），背景 style 一律不动
  arr.forEach(x => {
    const n = map.get(bigKey(x)); if (!n) return;
    const st = x.status || 'none';

      BG_ST_KEYS.forEach(k => n.classList.remove(k));
      n.classList.add('st-' + st);

};

;
/* 学生端（K4）：只看「签到」。hx_att_pending 列出进行中的考勤 → 按方式 输 6 位码 / 扫码 / 画手势；
   要定位的先取 navigator.geolocation；设备标识首次生成存 localStorage['hx-att-device']（同一台手机一次考勤只能签一个人）。
   带 #c=<会话>.<令牌> 打开（扫大屏二维码）直接签到。业务拒绝 hx_att_checkin 返回 {ok:false,msg,distance?}，原样显示。 */
const U = { list: [], res: {}, busy: new Set(), sig: '' };
function devId() {
  const K = 'hx-att-device';
  let v = '';
  try { v = localStorage.getItem(K) || ''; } catch (e) { }
  if (v.length < 8) {
    v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
    try { localStorage.setItem(K, v); } catch (e) { }
  }
  return v;
}
const okHtml = r => `<div class="su-ok"><b>已签到</b><span>${esc(hms(r.at))}</span><em class="st-${esc(r.status)}">${esc(ST_NAME[r.status] || '')}</em></div>`;
const badHtml = (msg, d) => `<div class="errs su-bad">${esc(msg)}${d != null && !String(msg).includes(String(d)) ? `（距离约 ${esc(d)} 米）` : ''}</div>`;
const GEO_MSG = e => '请允许定位后再签到' + (e && e.code === 3 ? '（这次是定位超时：到窗边或打开手机定位再试）' : e && e.code === 1 ? '（浏览器拒绝了定位，在地址栏或系统设置里允许）' : '');

async function studentHome(link) {
  stopTimers();
  app().innerHTML = `<div class="att-wrap att-stu"><div class="att-top"><h1>签到</h1><button id="suRe">刷新</button></div>
    <div id="suRes"></div><div id="suList">${fxLoad('正在查有没有考勤…')}</div></div>`;
  fxAuto();
  $('suRe').onclick = () => pendLoad(true);
  await pendLoad(true);
  every(tickStu, 1000);
  every(() => { if (!U.busy.size && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#suList'))) pendLoad(false); }, 10000);
  if (link) linkCheckin(link);
}
async function pendLoad(force) {
  let r;
  try { r = await rpc('hx_att_pending'); }
  catch (e) { if (force && $('suList')) $('suList').innerHTML = `<p class="errs">查不到考勤：${esc(e.message)}</p>`; return; }
  U.list = Array.isArray(r) ? r : [];
  const sig = JSON.stringify(U.list.map(x => [x.id, x.signed, x.status]));
  if (force || sig !== U.sig) { U.sig = sig; drawStu(); }
}
function leftTxt(t) {
  const l = Math.max(0, +new Date(t) - Date.now());
  return l ? '剩 ' + pad2(Math.floor(l / 60000)) + ':' + pad2(Math.floor(l / 1000) % 60) : '已结束';
}
function tickStu() { document.querySelectorAll('[data-left]').forEach(el => { el.textContent = leftTxt(el.dataset.left); }); }
function drawStu() {
  const box = $('suList'); if (!box) return;
  if (!U.list.length) { box.innerHTML = '<div class="card att-empty"><h2>现在没有进行中的考勤</h2></div>'; return; }
  box.innerHTML = U.list.map(x => `<div class="card su-i" data-sid="${x.id}">
      <div class="su-h"><b>${esc(x.course)}</b><span class="note">${MODE_NAME[x.mode] || ''}${x.geo ? ' · 需定位 ' + x.radius + ' m 内' : ''}</span><span class="su-left" data-left="${esc(x.ends_at)}">${leftTxt(x.ends_at)}</span></div>
      ${x.signed ? (U.res[x.id] || okHtml({ at: '', status: x.status }).replace('<span></span>', '')) : `
      <div class="su-act">${x.mode === 'code' ? `<input class="su-code mono" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="6 位码" aria-label="签到码"><button class="pri su-go">签到</button>`
        : x.mode === 'qr' ? `<button class="pri su-scan">扫一扫</button>`
        : `<div class="att-gpad su-pad"></div><p class="note">画老师黑板上的图案</p>`}</div>
      <div class="su-r">${U.res[x.id] || ''}</div>`}
    </div>`).join('');
  box.querySelectorAll('.su-i').forEach(el => {
    const it = U.list.find(x => x.id === +el.dataset.sid); if (!it || it.signed) return;
    if (it.mode === 'code') {
      const inp = el.querySelector('.su-code'), go = () => {
        const v = inp.value.replace(/\D/g, '');
        if (v.length !== 6) return showRes(it.id, badHtml('请输入大屏上的 6 位码'));
        checkin(it, v);
      };
      el.querySelector('.su-go').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    } else if (it.mode === 'qr') {
      el.querySelector('.su-scan').onclick = () => scan(it);
    } else {
      const p = gPad(el.querySelector('.su-pad'), { onDone: (s, a) => { if (a.length < 4) return showRes(it.id, badHtml('至少连 4 个点')); checkin(it, s).then(() => { const q = U.list.find(x => x.id === it.id); if (q && !q.signed) p.clear(); }); } });
    }
  });
}
function showRes(sid, html) {
  U.res[sid] = html;
  const el = document.querySelector(`.su-i[data-sid="${sid}"] .su-r`);
  if (el) el.innerHTML = html;
}
async function scan(it) {
  if (window.HXScan && typeof HXScan.open === 'function') {
    try {
      const txt = await HXScan.open();
      if (txt == null) return;
      const m = /#c=(\d+)\.([A-Za-z0-9]+)/.exec(String(txt));
      if (!m) return showRes(it.id, badHtml('扫到的不是签到二维码'));
      return checkin(it, m[2], +m[1]);
    } catch (e) { return showRes(it.id, badHtml('扫码没成功：' + (e && e.message || e))); }
  }
  showRes(it.id, `<div class="errs su-bad">用微信扫一扫或相机扫大屏二维码</div>`);
}
/* 签到：it = pending 里的一项（或从链接来、pending 里查不到时的 {id, geo:false}） */
async function checkin(it, token, sid) {
  sid = sid || it.id;
  if (U.busy.has(sid)) return;
  U.busy.add(sid);
  showRes(it.id, '<p class="note">正在签到…</p>');
  try {
    let pos = null;
    if (it.geo) {
      showRes(it.id, '<p class="note">正在取位置…</p>');
      try { pos = await getPos(10000); } catch (e) { return showRes(it.id, badHtml(GEO_MSG(e))); }
    }
    let r;
    try { r = await rpc('hx_att_checkin', { p_session: sid, p_token: token, p_lat: pos ? pos.lat : null, p_lng: pos ? pos.lng : null, p_device: devId() }); }
    catch (e) { return showRes(it.id, badHtml('签到失败：' + e.message)); }
    // 从链接进来、pending 里查不到这次考勤（不知道要不要定位）：服务端说要定位，就取了位置再试一次
    if (r && !r.ok && !it.geo && /定位/.test(r.msg || '') && it.fromLink) {
      it.geo = true; U.busy.delete(sid);
      return checkin(it, token, sid);
    }
    if (r && r.ok) {
      const q = U.list.find(x => x.id === sid);
      const html = okHtml(r);
      if (it.id !== sid) showRes(it.id, html);
      if (q) { q.signed = true; q.status = r.status; U.res[sid] = html; U.sig = ''; drawStu(); }
      return r;
    }
    showRes(it.id, badHtml((r && r.msg) || '签到没成功', r && r.distance));
    return r;
  } finally { U.busy.delete(sid); }
}
/* 扫大屏二维码打开的 #c=<会话>.<令牌>：结果显示在最上面 */
function linkCheckin(link) {
  const q = U.list.find(x => x.id === link.s);
  const it = { id: 'link', geo: q ? !!q.geo : false, fromLink: !q };
  const box = $('suRes');
  box.innerHTML = `<div class="card su-i su-link"><div class="su-h"><b>${esc(q ? q.course : '扫码签到')}</b></div><div class="su-r" id="suLinkR"></div></div>`;
  box.querySelector('.su-i').dataset.sid = 'link';
  checkin(it, link.t, link.s).then(r => { if (r && r.ok && q) drawStu(); });
}

;
boot().then(() => { if (window.HXLoadFx) HXLoadFx.finishBoot(); });
</script>
