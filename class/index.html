<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>上课快捷方式集合</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    background: #f2f5fa;
    color: #1c2430;
    min-height: 100vh;
    padding: 26px 32px 44px;
  }
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 1px solid #e2e8f2;
  }
  h1 { font-size: 34px; margin: 0; letter-spacing: 1px; }
  .clock { text-align: right; }
  .clock .time { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; color: #2b4a7d; line-height: 1; }
  .clock .date { font-size: 15px; color: #6b7889; margin-top: 9px; }

  /* ---- 主入口：华夏工具 ---- */
  .hero {
    margin-top: 30px;
    display: flex; align-items: center; gap: 36px; flex-wrap: wrap;
    background: linear-gradient(135deg, #1f4fd1, #2f6df6 55%, #4a8bff);
    color: #fff; border-radius: 24px; padding: 32px 36px;
    box-shadow: 0 10px 30px rgba(31,79,209,.25);
  }
  .hero a.go { flex: 1 1 360px; min-width: 0; color: inherit; text-decoration: none; display: block; }
  .hero .name { font-size: 40px; font-weight: 800; letter-spacing: 1px; }
  .hero .tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .hero .tools span { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); padding: 6px 14px; border-radius: 20px; font-size: 16px; }
  .hero .open { display: inline-block; margin-top: 22px; background: #fff; color: #1f4fd1; font-weight: 700; font-size: 18px; padding: 11px 26px; border-radius: 14px; }
  .hero .open:active { transform: scale(.97); }
  .hero .qr { flex: 0 0 auto; background: #fff; border-radius: 18px; padding: 12px; cursor: zoom-in; text-align: center; color: #1c2430; }
  .hero .qr svg { width: 190px; height: 190px; display: block; }
  .hero .qr div { font-size: 14px; color: #6b7889; margin-top: 4px; }

  /* ---- 其他入口 ---- */
  .grid {
    margin-top: 26px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 20px;
  }
  .card {
    display: flex; align-items: center; gap: 18px;
    background: #fff; border-radius: 18px; padding: 22px 22px; min-height: 120px;
    box-shadow: 0 2px 4px rgba(20,40,80,.05), 0 8px 24px rgba(20,40,80,.06);
    border: 1px solid #e4eaf3;
  }
  .card a.go { display: flex; align-items: center; gap: 18px; flex: 1; min-width: 0; color: inherit; text-decoration: none; }
  .card a.go:active { transform: scale(.985); }
  .icon {
    flex: 0 0 60px; height: 60px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #fff;
  }
  .name { font-size: 21px; font-weight: 700; line-height: 1.35; }
  .badge {
    display: inline-block; margin-top: 6px;
    font-size: 12px; line-height: 1.6;
    color: #a86300; background: #fff4e3; border: 1px solid #ffd9a0;
    padding: 1px 9px; border-radius: 20px; white-space: nowrap;
  }
  .card .qr { flex: 0 0 auto; width: 74px; height: 74px; padding: 4px; border: 1px solid #e4eaf3; border-radius: 10px; cursor: zoom-in; background: #fff; }
  .card .qr svg { width: 100%; height: 100%; display: block; }

  /* ---- 扫码大图 ---- */
  #big {
    position: fixed; inset: 0; background: rgba(12,20,36,.82);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    cursor: zoom-out; z-index: 10;
  }
  #big.on { display: flex; }
  #big .box { background: #fff; border-radius: 22px; padding: 22px; }
  #big svg { width: min(72vh, 86vw); height: min(72vh, 86vw); display: block; }
  #big .t { color: #fff; font-size: 30px; font-weight: 700; letter-spacing: 1px; }

  footer { margin-top: 40px; color: #97a2b1; font-size: 13px; line-height: 1.9; border-top: 1px solid #e2e8f2; padding-top: 18px; }

    '<div class="name">' + MAIN.name + '</div>' +
    '<div class="tools">' + MAIN.tools.map(function (t) { return '<span>' + t + '</span>'; }).join("") + '</div>' +
    '<div class="open">打开 ↗</div>' +
  '</a>' +
  '<div class="qr">' + QR[MAIN.url] + '<div>扫码用手机打开</div></div>';
hero.querySelector(".qr").onclick = function () { showBig(MAIN.name, MAIN.url); };
app.appendChild(hero);

const grid = document.createElement("div");
grid.className = "grid";
OTHERS.forEach(function (s) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<a class="go" href="' + s.url + '" target="_blank" rel="noopener noreferrer">' +
      '<div class="icon" style="background:' + s.color + '">' + s.icon + '</div>' +
      '<div><div class="name">' + s.name + '</div>' + (s.vpn ? '<span class="badge">需科学上网</span>' : '') + '</div>' +
    '</a>' +
    '<div class="qr">' + QR[s.url] + '</div>';
  card.querySelector(".qr").onclick = function () { showBig(s.name, s.url); };
  grid.appendChild(card);
});
if (OTHERS.length) app.appendChild(grid);

/* ---------------- 时钟 ---------------- */
function tick() {
  const n = new Date();
  const p = function (x) { return String(x).padStart(2, "0"); };
  document.getElementById("clock").textContent = p(n.getHours()) + ":" + p(n.getMinutes());
  const w = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][n.getDay()];
  document.getElementById("date").textContent =
    n.getFullYear() + "年" + (n.getMonth() + 1) + "月" + n.getDate() + "日 " + w;
}
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
