<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>反馈信箱 · 华夏工具</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --edge:#e3e8f0; --ink:#1b2333; --dim:#77839a; --faint:#a8b2c4;
  --acc:#7c5cff; --acc2:#e0457b; --ok:#17a34a; --warn:#d97706; --bad:#dc2626;
  --shadow:0 14px 34px -22px rgba(23,33,58,.55);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1420; --panel:#161d2b; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
    --shadow:0 16px 38px -24px rgba(0,0,0,.9); }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 60px}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge)}
header.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.back{flex:none;text-decoration:none;font-size:13.5px;font-weight:700;color:var(--dim);padding:7px 12px;border-radius:10px;
  border:1px solid var(--edge);background:var(--panel)}
.back:hover{color:var(--ink)}
h1{margin:0;font-size:19px;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
h1 i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:#fff;
  background:linear-gradient(140deg,var(--acc),var(--acc2));box-shadow:0 8px 18px -10px var(--acc)}
.count{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.count b{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--edge);color:var(--dim)}
.count b em{font-style:normal;color:var(--ink);margin-left:4px;font-size:13.5px}
.count b.hot{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc)}
.count b.hot em{color:var(--acc)}
main{padding-top:18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);
  color:var(--dim);cursor:pointer;transition:.15s}
.chip:hover{color:var(--ink)}
.chip.on{background:linear-gradient(140deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 10px 20px -12px var(--acc)}
select{font:inherit;font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:11px;border:1px solid var(--edge);
  background:var(--panel);color:var(--ink);cursor:pointer;margin-left:auto}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:15px 17px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.pending{border-left:3px solid var(--acc)}
.c-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.kind{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:8px;color:#fff;background:var(--dim)}
.kind.suggest{background:#7c5cff}.kind.bug{background:#e0457b}.kind.other{background:#0d9488}
.tool{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.who{font-size:12.5px;color:var(--dim);font-weight:600}
.time{font-size:12px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.body{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.65;margin:0 0 10px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-bottom:10px}
.meta span b{font-weight:700;color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.btn{font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:11px;border:1px solid var(--edge);
  background:var(--panel);color:var(--ink);cursor:pointer;transition:.15s}
button.btn:hover{border-color:var(--acc);color:var(--acc)}
button.btn.go{background:linear-gradient(140deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
button.btn.go:hover{filter:brightness(1.06);color:#fff}
button.btn.ghost{color:var(--dim)}
button.btn[disabled]{opacity:.5;cursor:default}
.reply{flex:1;min-width:200px}
.reply input{width:100%;font:inherit;font-size:13.5px;padding:8px 12px;border-radius:11px;border:1px solid var(--edge);
  background:var(--bg);color:var(--ink);outline:none}
.reply input:focus{border-color:var(--acc)}
.tagst{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--edge);color:var(--dim)}
.tagst.adopted{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.tagst.done{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.tagst.rejected{color:var(--dim);opacity:.8}
.note{font-size:12.5px;color:var(--dim);margin:8px 0 0;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--edge)}
.empty{text-align:center;color:var(--dim);padding:60px 0;font-size:14px}
.gate{max-width:520px;margin:60px auto;text-align:center;background:var(--panel);border:1px solid var(--edge);
  border-radius:20px;padding:34px 26px;box-shadow:var(--shadow)}
.gate b{display:block;font-size:18px;margin-bottom:8px}
.gate p{color:var(--dim);font-size:13.5px;margin:0 0 18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.22s;
  background:#141b28;color:#fff;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:12px;z-index:99;
  box-shadow:0 16px 34px -16px rgba(0,0,0,.8)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){
  h1{font-size:17px}.count{width:100%;margin-left:0}.time{margin-left:0;width:100%}
  .card{padding:13px 14px;border-radius:14px}
}
</style>
<!-- 统一像素加载动效（2026-11-07）：head 阻塞加载站点根 /fx/ 的共享特效件（与刷题/考试/小组加分同一套规则），
     body 开头的 #hxBoot 解析到就画出第一帧「canvas 像素动效 + 标题 + 药丸」，页面就绪后整层淡出。 -->
<script src="/fx/pixelfx-loader.js"></script>
<script src="/fx/hx-loadfx.js"></script>
<!-- 未登录闸门（2026-11-08）：hx-theme.js 的 gate() 会在没登录时把单独打开的页面送回总入口。
     这一页以前没引 hx-theme.js（纯本机 localStorage，不依赖账号），所以不登录也能直接用 —— 用户要求收回。 -->
<script src="/hx-theme.js" data-tool="feedback"></script>
</head>
<body>
<!-- 首屏闪屏（全站统一三件套）：动效 + 标题 + 药丸；脚本没加载出来时回落药丸，8 秒兜底撤层 -->
<style>#hxBoot{background:#f4f6fa}@media (prefers-color-scheme:dark){#hxBoot{background:#0f1420}}</style>
<div id="hxBoot" class="hx-boot" aria-hidden="true">
  <div class="hx-boot-card">
    <canvas id="hxBootCv" width="96" height="96"></canvas>
    <p class="hx-boot-title">反馈信箱</p>
    <div class="hx-loadpill sm" role="status" aria-live="polite"><span class="hx-px" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i></span><b>正在载入…</b></div>
  </div>
</div>
<script>(function(){
  var ov=document.getElementById('hxBoot');
  function gone(){if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);}
  if(window.HXLoadFx){HXLoadFx.boot('feedback','hxBoot');
    var fin=function(){if(window.HXLoadFx&&HXLoadFx.booting())HXLoadFx.finishBoot();else gone();};
    if(document.readyState==='complete')setTimeout(fin,60);else addEventListener('load',function(){setTimeout(fin,60);});
  }
  setTimeout(function(){if(!window.HXLoadFx||!HXLoadFx.booting||!HXLoadFx.booting())gone();},8000);
})();</script>
<header class="top"><div class="wrap">
  <a class="back" href="../" target="_top">← 华夏工具</a>
  <h1><i>✉</i>反馈信箱</h1>
  <div class="count" id="stat"></div>
</div></header>

<main class="wrap">
  <div id="gate" hidden></div>
  <div id="app" hidden>
    <div class="bar">
      <div class="chips" id="tabs"></div>
      <select id="toolSel"></select>
    </div>
    <div id="list"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
/* ---------- 华夏工具账号（和排课、接线仿真共用一份登录） ---------- */
var HX = (function () {
  var BASE = 'https://eiqgyrjrwdaunhxjmdyr.supabase.co', KEY = 'sb_publishable_FcVnLx3TNrj6HnbgarYnRw_DW4-yFzd', SKEY = 'paike-session';
  var s = null, now = function () { return Math.floor(Date.now() / 1000); };
  function load() { try { s = JSON.parse(localStorage.getItem(SKEY)); } catch (e) { s = null; } return s; }
  function keep(v) { s = v; try { v ? localStorage.setItem(SKEY, JSON.stringify(v)) : localStorage.removeItem(SKEY); } catch (e) { } }
  function zh(m) {
    m = String(m || '');
    var Z = [[/Invalid login credentials/i, '账号或密码不对'], [/JWT expired|invalid JWT/i, '登录过期了，请重新登录'],
      [/permission denied/i, '没有权限'], [/rate limit|too many/i, '操作太频繁，请过一会儿再试']];
    for (var i = 0; i < Z.length; i++) if (Z[i][0].test(m)) return Z[i][1];
    return m;
  }
  async function api(path, o) {
    o = o || {};
    if (o.auth !== false) await fresh();
    var h = { apikey: KEY, 'Content-Type': 'application/json' };
    if (o.auth !== false && s) h.Authorization = 'Bearer ' + s.access_token;
    var r;
    try { r = await fetch(BASE + path, { method: o.method || 'GET', headers: h, body: o.body === undefined ? undefined : JSON.stringify(o.body) }); }
    catch (e) { throw new Error('连不上服务器，请检查网络'); }
    var txt = await r.text(), j = null;
    try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
    if (!r.ok) throw Object.assign(new Error(zh(j && (j.msg || j.message || j.error_description || j.error) || ('HTTP ' + r.status))), { status: r.status });
    return j;
  }
  async function fresh() {
    load(); if (!s || now() < s.expires_at - 60) return;
    try { take(await api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: s.refresh_token }, auth: false })); }
    catch (e) { if (e.status) keep(null); throw e; }
  }
  function take(j) {
    keep({ access_token: j.access_token, refresh_token: j.refresh_token,
      expires_at: j.expires_at || now() + (j.expires_in || 3600), user: j.user || (s && s.user) || null });
  }
  return {
    online: function () { return /^https?:$/.test(location.protocol); },
    'in': function () { return !!(load() && s.access_token); },
    rpc: function (f, b, auth) { return api('/rest/v1/rpc/' + f, { method: 'POST', body: b || {}, auth: auth !== false }); },
    grab: function () {
      var h = new URLSearchParams(location.hash.slice(1)), err = h.get('error_description');
      if (!h.get('access_token') && !err) return null;
      history.replaceState(null, '', location.pathname);
      if (err) return { error: zh(err.replace(/\+/g, ' ')) };
      keep({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'),
        expires_at: +h.get('expires_at') || now() + (+h.get('expires_in') || 3600), user: null });
      return { ok: true };
    },
    github: function () { location.href = BASE + '/auth/v1/authorize?provider=github&redirect_to=' + encodeURIComponent(location.origin + location.pathname); }
  };
})();

var TOOLS = { 'wiring-lab': '接线仿真', 'shuati': '刷题', 'mcu': '单片机上机', 'exam': '考试', 'paike': '排课', 'jiafen': '小组加分', 'course': '课程进度', 'base': '进制转换', 'site': '华夏工具总入口' };
var KIND = { suggest: '建议', bug: '问题', other: '其它' };
var ST = { open: '待处理', adopted: '已采纳', done: '已处理', rejected: '不采纳' };

var $ = function (id) { return document.getElementById(id); };
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._h); toast._h = setTimeout(function () { t.classList.remove('show'); }, 2200); }

var VIEW = { status: '', tool: '', rows: [], me: null, about: {} };

function gate(html) { $('gate').hidden = false; $('app').hidden = true; $('gate').innerHTML = html; $('stat').innerHTML = ''; }

async function boot() {
  var g = HX.grab();               // GitHub 登录跳回来的凭证
  if (!HX.in()) {
    gate('<div class="gate"><b>先登录再进来</b><p>这个页面只有开发者能看。请从华夏工具总入口登录（跟排课、接线仿真同一个账号），再回到这里。</p>' +
      '<a class="back" href="../" target="_top">回总入口登录</a></div>');
    return;
  }
  var me;
  try { me = await HX.rpc('hx_me'); }
  catch (e) {
    if (!HX.in()) { gate('<div class="gate"><b>登录过期了</b><p>' + esc(e.message) + '</p><a class="back" href="../" target="_top">回总入口重新登录</a></div>'); return; }
    gate('<div class="gate"><b>读不到身份</b><p>' + esc(e.message) + '</p></div>'); return;
  }
  ST.me = me;
  if (!me || !me.dev) {
    gate('<div class="gate"><b>这里只有开发者能进</b><p>当前账号不是开发者。反馈内容在服务器上只对开发者开放。</p><a class="back" href="../" target="_top">回华夏工具</a></div>');
    return;
  }
  if (g && g.ok) toast('登录成功');
  $('gate').hidden = true; $('app').hidden = false;
  renderTabs(); renderToolSel();
  load();
}

function renderTabs() {
  var tabs = [['', '全部'], ['open', '待处理'], ['adopted', '已采纳'], ['done', '已处理'], ['rejected', '不采纳']];
  $('tabs').innerHTML = tabs.map(function (t) {
    return '<button class="chip' + (VIEW.status === t[0] ? ' on' : '') + '" data-s="' + t[0] + '">' + t[1] + '</button>';
  }).join('');
  Array.prototype.forEach.call($('tabs').children, function (b) {
    b.onclick = function () { VIEW.status = b.dataset.s; renderTabs(); load(); };
  });
}

function renderToolSel() {
  var has = {};
  VIEW.rows.forEach(function (r) { has[r.tool] = 1; });
  var list = Object.keys(has).sort();
  $('toolSel').innerHTML = '<option value="">全部工具</option>' + list.map(function (t) {
    return '<option value="' + esc(t) + '"' + (VIEW.tool === t ? ' selected' : '') + '>' + esc(TOOLS[t] || t) + '</option>';
  }).join('');
  $('toolSel').onchange = function () { VIEW.tool = this.value; load(); };
}

async function load() {
  $('list').innerHTML = '<div class="empty">读取中…</div>';
  try {
    var q = HX.rpc('hx_feedback_list', { p_tool: null, p_status: VIEW.status || null });
    var s = HX.rpc('hx_feedback_stats', {});
    var all = await q, st = await s;
    VIEW.rows = all || [];
    var hot = (st && st.open) ? ' hot' : '';
    $('stat').innerHTML = '<b class="' + hot.trim() + '">待处理<em>' + ((st && st.open) || 0) + '</em></b>' +
      '<b>已采纳<em>' + ((st && st.adopted) || 0) + '</em></b>' +
      '<b>累计<em>' + ((st && st.total) || 0) + '</em></b>';
    renderToolSel();
    renderList();
  } catch (e) {
    $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    if (!HX.in()) gate('<div class="gate"><b>登录过期了</b><p>' + esc(e.message) + '</p><a class="back" href="../" target="_top">回总入口重新登录</a></div>');
  }
}

function renderList() {
  var rows = VIEW.rows.filter(function (r) { return !VIEW.tool || r.tool === VIEW.tool; });
  if (!rows.length) { $('list').innerHTML = '<div class="empty">这里还没有反馈。'; return; }
  $('list').innerHTML = rows.map(function (r) {
    var pending = r.status === 'open';
    return '<div class="card' + (pending ? ' pending' : '') + '">' +
      '<div class="c-top">' +
        '<span class="kind ' + esc(r.kind) + '">' + esc(KIND[r.kind] || r.kind) + '</span>' +
        '<span class="tool">' + esc(TOOLS[r.tool] || r.tool) + '</span>' +
        '<span class="who">' + esc(r.author_name || (r.registered ? '已登录用户' : '未登录访客')) + '</span>' +
        (r.contact ? '<span class="who">· 联系：' + esc(r.contact) + '</span>' : '') +
        '<span class="time">' + esc(r.created_at || '') + '</span>' +
      '</div>' +
      '<p class="body">' + esc(r.content) + '</p>' +
      (r.page ? '<div class="meta"><span>来源页面：<b>' + esc(r.page) + '</b></span></div>' : '') +
      (r.reply ? '<p class="note">备注：' + esc(r.reply) + '</p>' : '') +
      '<div class="acts">' +
        '<span class="tagst ' + esc(r.status) + '">' + esc(ST[r.status] || r.status) + '</span>' +
        '<span class="reply"><input data-reply="' + r.id + '" placeholder="备注 / 回复（可留空）" value="' + esc(r.reply || '') + '"></span>' +
        '<button class="btn go" data-act="adopt" data-id="' + r.id + '" data-name="' + esc(r.author_name || '') + '" data-tool="' + esc(r.tool) + '">采纳并进鸣谢</button>' +
        '<button class="btn" data-act="done" data-id="' + r.id + '">已处理</button>' +
        '<button class="btn ghost" data-act="rejected" data-id="' + r.id + '">不采纳</button>' +
      '</div>' +
    '</div>';
  }).join('');

  Array.prototype.forEach.call($('list').querySelectorAll('button[data-act]'), function (b) {
    b.onclick = function () { setStatus(b, b.dataset.act, b.dataset.id, b.dataset.name, b.dataset.tool); };
  });
}

async function setStatus(btn, act, id, name, tool) {
  var replyEl = $('list').querySelector('input[data-reply="' + id + '"]');
  var reply = replyEl ? replyEl.value.trim() : '';
  var label = { adopted: '已标记采纳', done: '已标记处理', rejected: '已标记不采纳' }[act] || '已更新';
  btn.disabled = true;
  try {
    await HX.rpc('hx_feedback_set', { p_id: +id, p_status: act, p_reply: reply || null });
    if (act === 'adopted' && name) {
      try { await addToThanks(tool, name); label = '已采纳，' + name + ' 已加进『' + (TOOLS[tool] || tool) + '』的鸣谢'; }
      catch (e) { label = '已采纳，但加鸣谢失败：' + e.message; }
    }
    toast(label);
    load();
  } catch (e) {
    toast(e.message); btn.disabled = false;
  }
}

// 采纳一个人：把他加进那个工具「关于」里的贡献者名单（已经有的不重复加）
async function addToThanks(tool, name) {
  if (!tool || !name) return;
  var a = null;
  try { a = await HX.rpc('hx_about', { p_tool: tool }); } catch (e) { }
  var dev = (a && a.dev) || 'zcq（夜夜）';
  var thanks = (a && Array.isArray(a.thanks)) ? a.thanks.slice() : [];
  if (thanks.indexOf(name) < 0) thanks.push(name);
  await HX.rpc('hx_set_about', { p_tool: tool, p_dev: dev, p_thanks: thanks });
}

boot();
</script>
</body>
</html>
