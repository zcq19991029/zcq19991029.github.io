":["2 个 8 位","4 个 8 位","2 个 16 位","4 个 16 位"],"a":"B"},{"ch":1,"t":"choice","q":"8051 内部定时/计数器的数量与位数是（  ）。","o":["2 个 8 位","2 个 16 位","4 个 8 位","1 个 16 位"],"a":"B"},{"ch":1,"t":"choice","q":"8051 内部中断源的个数及优先级别是（  ）。","o":["5 个，分高级和低级两个优先级别","5 个，分高级、中级和低级三个优先级别","6 个，分高级和低级两个优先级别","8 个，不分优先级"],"a":"A"},{"ch":1,"t":"fill","q":"8051 内部有____个 8 位并行 I/O 口，分别称为____；内部有____个 16 位的定时/计数器。","a":["4","P0、P1、P2、P3","2"]},{"ch":1,"t":"fill","q":"8051 内部共有____个 RAM 单元，其中高____个单元被专用寄存器占用，低____个单元供用户使用。","a":["256","128","128"]},{"ch":1,"t":"choice","q":"8051 外接石英晶体的晶振频率通常选择（  ）。","o":["1 MHz、2 MHz 或 4 MHz","6 MHz、12 MHz 或 11.0592 MHz","8 MHz、16 MHz 或 24 MHz","12 MHz、24 MHz 或 48 MHz"],"a":"B"},{"ch":1,"t":"fill","q":"单片机应用系统是由____和____两部分组成的，二者相互依赖、缺一不可，其中____是应用系统的基础。","a":["硬件","控制程序","硬件"]},{"ch":1,"t":"short","q":"什么是单片机应用系统？它由哪两部分组成？二者关系如何？","a":"单片机应用系统是以单片机为核心，配以输入、输出、显示等外围接口电路和控制程序，能实现一种或多种功能的实用系统。它由硬件和控制程序（软件）两部分组成，二者相互依赖、缺一不可：硬件是应用系统的基础，控制程序在硬件的基础上对其资源进行合理调配和使用，控制其按一定顺序完成各种时序、运算或动作，从而实现应用系统所要求的任务。"},{"ch":1,"t":"term","q":"名词解释：单片机最小系统。","a":"单片机最小系统是指能够让单片机工作的最小硬件电路。除了单片机本身之外，最小系统还包括复位电路和时钟电路（另需电源与接地）：复位电路用于将单片机内部各电路的状态恢复到初始值；时钟电路为单片机工作提供基本时钟，因为单片机内部由大量时序电路构成，没有时钟脉冲的跳动各部分将无法工作。"},{"ch":1,"t":"fill","q":"除了单片机和电源外，单片机最小系统还包括____电路和____电路。","a":["复位","时钟"]},{"ch":1,"t":"fill","q":"51 单片机的 XTAL1 和 XTAL2 引脚是____引脚。","a":["时钟（外接石英晶体和微调电容）"]},{"ch":1,"t":"choice","q":"51 单片机的 EA 引脚连接 +5 V，表示（  ）。","o":["使用片外程序存储器","使用片内程序存储器","单片机进入复位状态","该引脚必须接地"],"a":"B"},{"ch":1,"t":"judge","q":"在图 1.23 电路中，发光二极管的阴极接 P1.0 引脚，当 P1.0 输出低电平时发光二极管点亮，输出高电平时熄灭。","a":true},{"ch":1,"t":"fill","q":"发光二极管具有____导电性，电流只能从____流向____；发光二极管一般通过____mA 左右的电流即可发光。","a":["单向","阳极","阴极","3～20"]},{"ch":1,"t":"choice","q":"发光二极管正向导通压降取 1.7 V、电源为 5 V、限流电阻为 1 kΩ 时，流过发光二极管的电流约为（  ）。","o":["1.7 mA","3.3 mA","5 mA","17 mA"],"a":"B"},{"ch":1,"t":"fill","q":"发光二极管发光时两端电压一般约为____V，称为导通压降；当限流电阻为 1 kΩ 时，流过发光二极管的电流 I=(5−1.7)/1000=____A=____mA。","a":["1.7","0.0033","3.3"]},{"ch":1,"t":"judge","q":"电解电容和发光二极管都有正负极之分，在电路中不能接反；电解电容外壳一般标有「+」「−」记号，若无标记则较长的引脚为正极。","a":true},{"ch":1,"t":"choice","q":"图 1.23 中复位电路由按键 S、R₂、C₃ 组成，其参数为（  ）。","o":["R₂=1 kΩ、C₃=22 μF","R₂=10 kΩ、C₃=22 μF","R₂=10 kΩ、C₃=30 pF","R₂=1 kΩ、C₃=30 pF"],"a":"B"},{"ch":1,"t":"fill","q":"51 单片机常见的封装形式有 DIP、PLCC、QFP、PGA 和____等；本书电路中的 51 单片机都采用与典型 8051 引脚兼容的____封装，可以在万能板上直接焊接。","a":["BGA","DIP40"]},{"ch":1,"t":"judge","q":"DIP 封装的单片机可以在万能板上焊接，而 PLCC、QFP、PGA、BGA 等其他封装形式的单片机必须按引脚尺寸制作印制电路板（PCB）。","a":true},{"ch":1,"t":"choice","q":"在 Keil C51 中执行「Project」→「New μVision Project」新建工程时，工程文件名的写法是（  ）。","o":["必须加扩展名 .uvproj","必须加扩展名 .c","不需要加扩展名","必须加扩展名 .hex"],"a":"C"},{"ch":1,"t":"fill","q":"在 Keil C51 中，C 语言源程序文件的扩展名是____，头文件的扩展名是____，汇编语言源程序文件的扩展名是____。","a":[".c",".h",".a"]},{"ch":1,"t":"choice","q":"要由 Keil C51 编译生成十六进制 HEX 文件，应在目标属性窗口的哪个选项卡中选中「Create HEX File」复选框？","o":["Device","Output","Listing","Debug"],"a":"B"},{"ch":1,"t":"choice","q":"在 Keil C51 主界面中执行「Project」→「Build target」编译工程，其快捷键是（  ）。","o":["F5","F7","F9","Ctrl+F7"],"a":"B"},{"ch":1,"t":"judge","q":"编译只是对当前工程进行编译，如果编译后又修改了源程序，一定要重新进行编译，才能产生新的二进制或十六进制文件。","a":true},{"ch":1,"t":"choice","q":"Keil C51 在建立工程时加载的 STARTUP.A51 文件，其主要作用是（  ）。","o":["存放用户编写的主程序","上电时初始化硬件堆栈、初始化 RAM、初始化模拟堆栈并跳转到主函数 main","定义单片机的引脚与端口地址","直接生成十六进制 HEX 文件"],"a":"B"},{"ch":1,"t":"judge","q":"不加载 STARTUP.A51 文件，编译出来的代码也一定能保证单片机正常工作。","a":false},{"ch":1,"t":"judge","q":"当工程编译出现很多错误时，应按照行号顺序从较小行号开始检查修改，发现并改正一个错误后要及时重新编译，因为后面的错误可能由前面的错误引起。","a":true},{"ch":1,"t":"choice","q":"编译提示信息「ex1_1.c(1): warning C314: bad #directive syntax」中，(1) 表示（  ）。","o":["错误代码","源程序的行号","警告的级别","错误的个数"],"a":"B"},{"ch":1,"t":"fill","q":"使用 Keil C51 的基本步骤为：新建工程→____→输入源程序→____→工程配置→____→HEX 文件。","a":["新建源文件","添加源文件","工程编译"]},{"ch":1,"t":"short","q":"简述使用 Keil C51 建立工程并编译生成 HEX 文件的基本步骤。","a":"① 启动 Keil C51（μVision）；② 单击 Project→New μVision Project，选择保存目录并输入工程名（不加扩展名）；③ 在 Select Device for Target 中选择 Atmel 的 AT89C51，点 OK；④ 在复制标准 8051 启动代码对话框中单击「是（Y）」，加载 STARTUP.A51；⑤ File→New 建立源文件，输入源程序后 File→Save as 存为 .c 文件；⑥ 在 Source Group 1 上右键选 Add Files to Group，把 .c 文件加入工程；⑦ 在 Target 1 上右键选 Options for Target，在 Output 选项卡中选中 Create HEX File；⑧ Project→Build target（F7）编译，输出窗口显示 0 Error(s)、0 Warning(s) 即成功，并生成 .hex 文件。"},{"ch":1,"t":"choice","q":"单片机应用系统开发流程中的第一步是（  ）。","o":["控制程序设计","设计电路图","程序下载","产品测试"],"a":"B"},{"ch":1,"t":"fill","q":"单片机应用系统的开发过程为：设计电路图→____→程序设计→____→程序下载→产品测试。","a":["制作电路板","硬软件联调（仿真联调）"]},{"ch":1,"t":"judge","q":"在单片机应用系统的开发流程中，前两项硬件设计与第 3 项控制程序设计可以并行开发、同时进行。","a":true},{"ch":1,"t":"judge","q":"ISP 下载实验板的优点是在线下载程序、无需专用编程器、学习资源丰富、价格低廉，缺点是一般不能提供在线仿真功能。","a":true},{"ch":1,"t":"prog","q":"参照教材 ex1_1.c 的结构，编写 C51 程序，使接在 P1.0 引脚上的发光二极管以一定间隔重复「点亮—熄灭」，并说明程序中 delay 函数的作用。","a":"#include <reg51.h>\nsbit P1_0 = P1^0;\nvoid delay(unsigned int i)\n{\n    unsigned int k;\n    for (k = 0; k < i; k++);\n}\nvoid main()\n{\n    while (1)\n    {\n        P1_0 = 0;        // 点亮 LED\n        delay(10000);\n        P1_0 = 1;        // 熄灭 LED\n        delay(10000);\n    }\n}\ndelay 函数为软件延时函数，形参 i 控制空循环的循环次数，i 越大延时越长；改变实参即可改变 LED 的闪烁速度。"},{"ch":1,"t":"prog","q":"利用单片机控制 8 个发光二极管（接在 P1 口），设计 8 个灯同时闪烁的控制程序（亮、灭交替，中间加延时）。","a":"#include <reg51.h>\nvoid delay(unsigned int i)\n{\n    unsigned int k;\n    for (k = 0; k < i; k++);\n}\nvoid main()\n{\n    while (1)\n    {\n        P1 = 0x00;      // 8 个 LED 全部点亮（低电平点亮）\n        delay(10000);\n        P1 = 0xFF;      // 8 个 LED 全部熄灭\n        delay(10000);\n    }\n}\n说明：P1 口整体赋值，0x00 使 P1.0～P1.7 全为低电平点亮，0xFF 使全部为高电平熄灭。"},{"ch":2,"t":"choice","q":"在单片机控制蜂鸣器发声电路中，要使蜂鸣器发出声音，P1.0 引脚应输出（  ）。","o":["高电平","低电平","高阻态","2 kHz~5 kHz 方波"],"a":"B"},{"ch":2,"t":"fill","q":"由于单片机 I/O 引脚输出电流较小，输出的 TTL 电平基本上驱动不了蜂鸣器，因此需要增加一个电流放大的电路，可以通过一个三极管____来放大输出电流驱动蜂鸣器。","a":["9012"]},{"ch":2,"t":"judge","q":"有源蜂鸣器内部带振荡器，只要一通电就会响；而无源蜂鸣器内部不带振荡源，用直流信号驱动时不会发出声音。","a":true},{"ch":2,"t":"choice","q":"无源蜂鸣器必须用一个方波信号驱动，该方波信号的频率一般为（  ）。","o":["50 Hz~100 Hz","2 kHz~5 kHz","20 kHz~50 kHz","2 MHz~5 MHz"],"a":"B"},{"ch":2,"t":"judge","q":"单片机输出的 TTL 电平可以直接驱动蜂鸣器发声，不需要外加电流放大电路。","a":false},{"ch":2,"t":"fill","q":"蜂鸣器的负极接到 GND 地上，蜂鸣器正极接到三极管 V₁ 的____，三极管的基极经过限流电阻 R₁ 后由单片机的 P1.0 引脚控制。","a":["集电极"]},{"ch":2,"t":"choice","q":"8051 作为早期典型的 51 单片机，采用标准（  ）引脚双列直插式封装。","o":["28","40","44","64"],"a":"B"},{"ch":2,"t":"fill","q":"____有效（低电平）时，可实现对外部 ROM 单元的读操作。","a":["PSEN"]},{"ch":2,"t":"choice","q":"ALE 引脚以晶振（  ）的固定频率输出正脉冲信号，因此它可作为外部时钟或外部定时脉冲使用。","o":["1/2","1/4","1/6","1/12"],"a":"C"},{"ch":2,"t":"fill","q":"当 EA 引脚为____电平时，对 ROM 的读操作限定在外部程序存储器；当 EA 为高电平时，读操作从内部程序存储器开始，并可延至外部程序存储器。","a":["低"]},{"ch":2,"t":"choice","q":"51 单片机内部有一个高增益反相放大器，其输入端引脚是（  ）。","o":["XTAL1","XTAL2","RST","EA"],"a":"A"},{"ch":2,"t":"fill","q":"时钟振荡电路中，电容 C₁ 和 C₂ 一般取____pF 左右，晶体振荡器的频率范围是 1.2 MHz~12 MHz。","a":["30"]},{"ch":2,"t":"choice","q":"如果系统中使用了单片机的串行口通信，则一般采用振荡频率为（  ）的晶振。","o":["6 MHz","12 MHz","11.0592 MHz","24 MHz"],"a":"C"},{"ch":2,"t":"fill","q":"51 单片机的时序定时单位从小到大依次是：节拍、状态、机器周期和____。","a":["指令周期"]},{"ch":2,"t":"choice","q":"51 单片机规定一个机器周期的宽度为（  ）个状态，即 12 个振荡脉冲周期。","o":["2","4","6","12"],"a":"C"},{"ch":2,"t":"fill","q":"当振荡脉冲频率为 12 MHz 时，一个机器周期为____μs；当振荡脉冲频率为 6 MHz 时，一个机器周期为 2 μs。","a":["1"]},{"ch":2,"t":"choice","q":"单片机复位的条件是：必须使 RST（第 9 引脚）加上持续（  ）个机器周期以上的高电平。","o":["1","2","4","12"],"a":"B"},{"ch":2,"t":"judge","q":"复位后 PC=0x0000，使单片机从程序存储器的第一个单元取指令执行。","a":true},{"ch":2,"t":"fill","q":"查单片机复位状态表可知，复位后堆栈指针 SP 的内容为____。","a":["07H"]},{"ch":2,"t":"fill","q":"单片机常见的复位电路有两种，即____和按键复位电路。","a":["上电复位电路"]},{"ch":2,"t":"choice","q":"8051 内部 RAM 共有 256 个单元，其中高 128 单元的地址范围是（  ）。","o":["0x00~0x7F","0x20~0x2F","0x80~0xFF","0x30~0x7F"],"a":"C"},{"ch":2,"t":"fill","q":"在内部 RAM 低 128 单元中，除了工作寄存器区（占 32 个单元）和位寻址区（占 16 个单元）外，还剩下____个单元（地址 0x30~0x7F）作为用户数据缓冲区。","a":["80"]},{"ch":2,"t":"choice","q":"8051 内部共有（  ）组工作寄存器，每组包括 8 个（以 R0~R7 为编号），共计 32 个寄存器。","o":["2","3","4","8"],"a":"C"},{"ch":2,"t":"judge","q":"位寻址区（0x20~0x2F）只能按位操作，不能再作为一般 RAM 单元进行字节操作。","a":false},{"ch":2,"t":"choice","q":"片内 RAM 位寻址区共有 16 个 RAM 单元、128 位，其相应的位地址范围是（  ）。","o":["0x00~0x1F","0x00~0x7F","0x20~0x2F","0x80~0xFF"],"a":"B"},{"ch":2,"t":"choice","q":"片内 RAM 高 128 单元中，可寻址的专用寄存器共有（  ）个。","o":["11","16","21","32"],"a":"C"},{"ch":2,"t":"judge","q":"在可寻址的 21 个专用寄存器中，有 11 个寄存器不仅能以字节寻址，也能以位寻址；全部专用寄存器可寻址的位共 83 位。","a":true},{"ch":2,"t":"choice","q":"程序计数器 PC（Program Counter）是一个（  ）位计数器，其内容为下一条将要执行指令的地址。","o":["8","12","16","32"],"a":"C"},{"ch":2,"t":"judge","q":"程序计数器 PC 有自己的物理地址，属于可寻址寄存器，用户可以对其直接进行读写。","a":false},{"ch":2,"t":"fill","q":"PSW 中 RS1 和 RS0（PSW.4、PSW.3）是____选择位，上电或复位后 RS1 RS0=00。","a":["工作寄存器组"]},{"ch":2,"t":"choice","q":"8051 单片机最多可扩充片外数据存储器（片外 RAM）（  ），称为 XDATA 区。","o":["4 KB","64 KB","256 B","1 MB"],"a":"B"},{"ch":2,"t":"choice","q":"程序存储器中 0x0003~0x002A 共 40 个单元被均匀分为 5 段，作为 5 个中断源的中断入口地址区，其中外部中断 0 的地址区是（  ）。","o":["0x0003~0x000A","0x000B~0x0012","0x0013~0x001A","0x0023~0x002A"],"a":"A"},{"ch":2,"t":"judge","q":"如 EA 保持低电平，则只能寻址外部程序存储器，片外存储器可以从 0x0000 开始编址。","a":true},{"ch":2,"t":"fill","q":"8031 片内无程序存储器，8051 片内有____KB 的 ROM，8751 片内有 4 KB 的 EPROM，89C51 片内有 4 KB 的 FEPROM。","a":["4"]},{"ch":2,"t":"choice","q":"在 C51 编译器支持的存储器类型中，code 表示（  ）。","o":["直接访问内部数据存储器，允许最快访问","可位寻址内部数据存储器，允许位与字节混合访问","外部数据存储器","程序存储器"],"a":"D"},{"ch":2,"t":"choice","q":"模拟汽车左右转向灯控制电路中，当拨动开关 S₀ 拨至位置 2 时，P3.0 引脚的状态为（  ）。","o":["高电平，P3.0=1","低电平，P3.0=0","高阻态","2 kHz~5 kHz 脉冲"],"a":"B"},{"ch":2,"t":"judge","q":"拨动开关和弹性按键一样，当手松开后都会依靠弹性自动回到断开状态。","a":false},{"ch":2,"t":"choice","q":"51 单片机典型芯片 8051 共有（  ）个 8 位并行 I/O 端口，分别用 P0、P1、P2、P3 表示。","o":["2","3","4","5"],"a":"C"},{"ch":2,"t":"choice","q":"并行 I/O 端口作为输入端口读引脚时，必须先向电路中的锁存器写入（  ）。","o":["0","1","0xFF","任意值"],"a":"B"},{"ch":2,"t":"fill","q":"对 I/O 端口进行「读—修改—写」操作语句（如 P0=P0&0xf0;）执行时，不直接读引脚而是读____，是为了避免可能出现的错误。","a":["锁存器"]},{"ch":2,"t":"judge","q":"P1、P2 和 P3 口作为输出端口使用时，无须外接上拉电阻。","a":true},{"ch":2,"t":"choice","q":"执行语句 P1=0x01; 后，P1 口中输出高电平的引脚是（  ）。","o":["P1.0","P1.1","P1.7","全部 8 个引脚"],"a":"A"},{"ch":2,"t":"judge","q":"P3 口某个引脚作为第二功能使用时，仍可同时把它当作通用 I/O 端口使用。","a":false},{"ch":2,"t":"choice","q":"在 Keil C51 调试中，可以跟踪到函数内部执行、每按一次执行一条语句的「单步跟踪运行」快捷键是（  ）。","o":["F5","F10","F11","F7"],"a":"C"},{"ch":2,"t":"judge","q":"在 Keil 的存储器窗口中输入地址「C: 0x0812」，其中字母 C 代表 Code，观察的是程序存储器中的内容。","a":true},{"ch":2,"t":"term","q":"名词解释：单片机最小系统。","a":"单片机最小系统是指能够让单片机工作的最小硬件电路。除了单片机芯片本身（以及电源和地线）之外，最小系统还包括时钟电路和复位电路。时钟电路为单片机工作提供基本时钟，因为单片机内部由大量的时序电路构成，没有时钟脉冲各个部分将无法工作；复位电路用于将单片机内部各电路的状态恢复到初始值。"},{"ch":2,"t":"term","q":"名词解释：机器周期。","a":"51 单片机采用定时控制方式，有固定的机器周期。规定一个机器周期的宽度为 6 个状态，即 12 个振荡脉冲周期，因此机器周期就是振荡脉冲的十二分频。当振荡脉冲频率为 12 MHz 时，一个机器周期为 1 μs；当振荡脉冲频率为 6 MHz 时，一个机器周期为 2 μs。"},{"ch":2,"t":"term","q":"名词解释：指令周期。","a":"指令周期是最大的时序定时单位，将执行一条指令所需要的时间称为指令周期。它一般由若干个机器周期组成，不同的指令所需要的机器周期数也不同。通常将包含一个机器周期的指令称为单周期指令，包含两个机器周期的指令称为双周期指令，依次类推。"},{"ch":2,"t":"short","q":"P3 口的第二功能是什么？","a":"P3.0 为 RXD，串行数据接收；P3.1 为 TXD，串行数据发送；P3.2 为 INT0，外部中断 0 申请；P3.3 为 INT1，外部中断 1 申请；P3.4 为 T0，定时/计数器 0 的外部输入；P3.5 为 T1，定时/计数器 1 的外部输入；P3.6 为 WR，外部 RAM 或外部 I/O 写选通；P3.7 为 RD，外部 RAM 或外部 I/O 读选通。"},{"ch":2,"t":"short","q":"51 单片机片内 RAM 的组成是如何划分的？各有什么功能？","a":"8051 内部 RAM 共 256 个单元，按功能分为低 128 单元（0x00~0x7F）和高 128 单元（0x80~0xFF）两部分。低 128 单元是真正的 RAM 存储器，又分为 3 个区域：①工作寄存器区 0x00~0x1F，共 4 组、每组 8 个（R0~R7），共 32 个寄存器，用来存放操作数及中间结果；②位寻址区 0x20~0x2F，共 16 个单元 128 位，既可字节操作也可位操作，位地址为 0x00~0x7F；③用户数据缓冲区 0x30~0x7F，共 80 个单元，供用户使用的一般 RAM 区，一般应用中常把堆栈开辟在此区。高 128 单元为专用寄存器 SFR 区，其中有 21 个可寻址的专用寄存器；另有不可寻址的程序计数器 PC，它不占据 RAM 单元。"},{"ch":2,"t":"short","q":"51 单片机常用的复位方法有几种？说明其工作原理。","a":"常用的复位电路有两种。①上电复位电路：利用电容充电来实现复位。在接电瞬间，RST 端的电位与 VCC 相同，随着充电电流的减少，RST 的电位逐渐下降；只要保证 RST 为高电平的时间大于两个机器周期，便能正常复位。②按键复位电路：除具有上电复位功能外，还可以按 RESET 键实现复位，此时电源 VCC 经两个电阻分压，在 RST 端产生一个复位高电平。复位的条件是必须使 RST（第 9 引脚）加上持续两个机器周期（即 24 个脉冲振荡周期）以上的高电平。"},{"ch":2,"t":"short","q":"简述程序状态字 PSW 各位的含义，单片机如何确定和改变当前的工作寄存器组？","a":"PSW 是一个 8 位寄存器，用于存放程序运行中的各种状态信息：CY（PSW.7）为进位标志位，存放算术运算的进位或借位标志；AC（PSW.6）为辅助进位标志位，存放低 4 位向高 4 位进位或借位标志；F0（PSW.5）为用户标志位，需用软件置位或复位；RS1 和 RS0（PSW.4、PSW.3）为工作寄存器组选择位；OV（PSW.2）为溢出标志位，存放带符号数加减运算的溢出位；F1（PSW.1）保留未使用；P（PSW.0）为奇偶标志位，存放累加器 ACC 中 1 的个数的奇偶性。当前工作寄存器组由 PSW 中 RS1 和 RS0 的状态组合决定，上电或复位后 RS1 RS0=00，即选中第 0 组；通过改变 RS1、RS0 的取值即可切换到其他寄存器组。"},{"ch":2,"t":"prog","q":"参照教材 ex2_1.c，编写 C51 程序使接在 P1.0 引脚上的蜂鸣器持续发出鸣叫声，并说明 P1.0 输出高低电平时蜂鸣器的工作状态。","a":"#include<reg51.h>            //包含头文件reg51.h，定义51单片机的专用寄存器\nsbit beep=P1^0;              //定义位名称\nvoid delay(unsigned int i)   //延时函数\n{\n    unsigned int k;\n    for (k=0;k<i;k++);\n}\nvoid main()                  //主函数\n{\n    while (1)\n    {\n        beep=0;              //蜂鸣器发声\n        delay(100);          //调用延时函数，实际参数为100\n        beep=1;              //蜂鸣器不发声\n        delay(100);          //调用延时函数，实际参数为100\n    }\n}\n说明：P1.0 输出低电平时三极管 V1（9012）导通，蜂鸣器的电流形成回路而发声；输出高电平时 V1 截止，没有电流流过线圈，蜂鸣器不发声。程序中通过两个 delay(100) 交替产生高低电平，形成驱动信号使蜂鸣器发声；改变延时参数即可改变音调。"},{"ch":2,"t":"prog","q":"参照教材 ex2_2.c，编写 C51 程序模拟汽车左右转向灯控制：P1.0 接左转灯、P1.1 接右转灯，P3.0、P3.1 接两个拨动开关接收驾驶员命令，要求按表 2.9、表 2.10 的对应关系使转向灯闪烁或熄灭。","a":"#include<reg51.h>            //包含头文件reg51.h，定义51单片机的专用寄存器\nsbit LED_L=P1^0;             //定义P1.0引脚位名称为LED_L\nsbit LED_R=P1^1;             //定义P1.1引脚位名称为LED_R\nsbit S_L=P3^0;               //定义P3.0引脚位名称为S_L\nsbit S_R=P3^1;               //定义P3.1引脚位名称为S_R\nvoid delay(unsigned int i)   //延时函数\n{\n    unsigned int k;\n    for (k=0;k<i;k++);\n}\nvoid main()                  //主函数\n{\n    bit left,right;          //定义位变量left、right表示左、右状态\n    while (1)                //无限循环\n    {\n        left=S_L;            //读取P3.0引脚的（左转向灯）命令状态并赋值给left\n        right=S_R;           //读取P3.1引脚的（右转向灯）命令状态并赋值给right\n        LED_L=left;          //将left的值送至P1.0引脚\n        LED_R=right;         //将right的值送至P1.1引脚\n        delay(20000);        //调用延时函数，实际参数为20000\n        LED_L=1;             //将P1.0引脚置1输出（熄灭LED）\n        LED_R=1;             //将P1.1引脚置1输出（熄灭LED）\n        delay(20000);        //调用延时函数，实际参数为20000\n    }\n}\n说明：P3.0、P3.1 为 1 时对应转向灯熄灭，为 0 时对应转向灯闪烁；两路同时为 0 时左右灯都闪烁，即汽车故障显示命令。"},{"ch":3,"t":"choice","q":"本项目介绍了用 C 语言进行单片机（  ）程序设计的方法，以及 C 语言的数据类型和运算符、结构化编程语句的应用。","o":["面向对象","结构化","可视化","面向过程"],"a":"B"},{"ch":3,"t":"fill","q":"项目3 的建议学时为____学时；教学导航中列出的知识难点为：①C 语言数据类型、基本语句及其应用；②____以及结构化程序设计方法。","a":["18","函数"]},{"ch":3,"t":"choice","q":"任务3-1 流水灯的设计要求是：首先点亮连接到（  ）引脚的发光二极管，延时一定时间后熄灭，再点亮下一个，如此依次顺序点亮，直至点亮最后一个，再从头开始循环不止。","o":["P1.0","P1.7","P0.0","P3.0"],"a":"B"},{"ch":3,"t":"fill","q":"ex3_1.c 中语句 P1=0x7F; 使 P1 端口输出二进制数____，点亮 P1.____ 引脚连接的发光二极管。","a":["01111111","7"]},{"ch":3,"t":"choice","q":"实现流水灯效果时，P1 端口顺序变化的 8 个状态是最高位旁边的「0」依次（  ）形成的。","o":["左移","右移","取反","清零"],"a":"B"},{"ch":3,"t":"judge","q":"Keil C51 提供的 _cror_() 是循环左移函数，_crol_() 是循环右移函数。","a":false},{"ch":3,"t":"fill","q":"对无符号数左移后，____位被移出的数丢掉，对____位补 0；对无符号数右移后，____位被移出的数丢掉，对____位补 0。","a":["高","低","低","高"]},{"ch":3,"t":"prog","q":"【补全代码】下面是教材 ex3_1.c 的流水灯程序，请补全【①】【②】【③】三处，使 P1 口所接 8 只发光二极管从 P1.7 开始逐位点亮并循环显示。\n\n```c\n#include<reg51.h>\n#include<【①】>\nvoid delay (unsigned int i)\n{\n    unsigned int k;\n    for (k=0;k<i;k++);\n}\nvoid main ( )\n{\n    P1=【②】;\n    while (1)\n    {\n        P1=【③】(P1,1);\n        delay(5000);\n    }\n}\n```","a":"① intrins.h　② 0x7F　③ _cror_\n完整程序：\n#include<reg51.h>\n#include<intrins.h>\nvoid delay (unsigned int i)\n{\n    unsigned int k;\n    for (k=0;k<i;k++);\n}\nvoid main ( )\n{\n    P1=0x7F;\n    while (1)\n    {\n        P1=_cror_(P1,1);\n        delay(5000);\n    }\n}\n说明：intrins.h 是 Keil C51 提供的内部标准函数库头文件，其中定义了 _cror_() 循环右移函数；P1=0x7F 使 P1 口输出 01111111B，点亮 P1.7 的 LED；每次循环把 P1 口状态循环右移一位，即 01111111→10111111→……→11111110。延时参数保留教材的 delay(5000)。"},{"ch":3,"t":"prog","q":"【找错】下面这段程序由教材 ex3_1.c 抄录，但漏掉了一行预处理命令，编译时会提示找不到 _cror_ 函数。请指出缺少哪一行、应补在什么位置，并说明理由。\n\n```c\n#include<reg51.h>\nvoid delay (unsigned int i)\n{\n    unsigned int k;\n    for (k=0;k<i;k++);\n}\nvoid main ( )\n{\n    P1=0x7F;\n    while (1)\n    {\n        P1=_cror_(P1,1);\n        delay(5000);\n    }\n}\n```","a":"缺少第 2 行 #include<intrins.h>，应紧接在 #include<reg51.h> 之后（即所有预处理命令都放在源程序的最前面）补上。\n理由：_cror_() 是 Keil C51 编译器提供的内部标准函数，定义在内部标准函数库头文件 intrins.h 中，调用标准函数前必须先用文件包含命令 #include 把包含该函数说明的头文件包含进来。reg51.h 只提供 51 单片机专用寄存器 SFR 和位名称的定义，不含 _cror_() 的说明，因此只包含 reg51.h 时编译器不认识 _cror_()。\n改正后的前两行：\n#include<reg51.h>\n#include<intrins.h>"},{"ch":3,"t":"choice","q":"ex3_2.c 中语句 P1=~aa; 里的「~」是（  ）。","o":["逻辑非运算符","按位取反运算符","取余运算符","按位与运算符"],"a":"B"},{"ch":3,"t":"fill","q":"ex3_2.c 中 aa=0x80 的二进制数为____；执行一次 aa>>=1 后，aa 的值为____B。","a":["10000000","01000000"]},{"ch":3,"t":"prog","q":"【写结果】ex3_2.c 中 aa 的初值为 0x80，for 循环共执行 8 次，每次先把 ~aa 送入 P1 口，再执行 aa>>=1。请按先后顺序写出 P1 口这 8 次输出的十六进制值。","a":"依次为 0x7F、0xBF、0xDF、0xEF、0xF7、0xFB、0xFD、0xFE。\n推导：aa 初值 0x80=10000000B，~aa=01111111B=0x7F；每轮 aa 右移一位且高位补 0，依次为 0x40、0x20、0x10、0x08、0x04、0x02、0x01，取反后即得上述 8 个值，恰好对应 P1.7～P1.0 逐位点亮一只 LED，与教材给出的 8 个状态一致。\n注意：循环 8 次后 aa 变为 0，但 while(1) 中每轮重新赋 aa=0x80，所以流水灯会不断重复。"},{"ch":3,"t":"choice","q":"Keil C51 编译器提供的头文件 reg51.h 保存在（  ）文件夹下。","o":["keil\\c51\\inc","keil\\c51\\bin","keil\\c51\\lib","keil\\c51\\asm"],"a":"A"},{"ch":3,"t":"fill","q":"reg51.h 文件中的语句 sfr P1=____; 定义了符号 P1 与 51 单片机内部 P1 口的地址对应；该头文件包含了 51 单片机专用寄存器（____）和部分位名称的定义。","a":["0x90","SFR"]},{"ch":3,"t":"judge","q":"C 语言的另一种注释符号是「/*  */」，注释内容从「/*」开始，到「*/」结束，中间的注释文字可以是多行文字。","a":true},{"ch":3,"t":"choice","q":"一个 C 语言源程序可以由一个或若干个函数组成，其中必须有且仅有（  ）。","o":["一个标准函数","一个主函数 main()","一个延时函数","一个自定义函数"],"a":"B"},{"ch":3,"t":"fill","q":"一个函数由____和____两部分组成，前者包括函数类型、函数名、函数属性、函数参数（形式参数）名、参数类型等。","a":["函数定义","函数体"]},{"ch":3,"t":"choice","q":"main 函数名前面的 void 说明函数的类型为（  ）。","o":["整型，有返回值","空类型，表示没有返回值","字符型，返回一个字节","指针型，返回地址"],"a":"B"},{"ch":3,"t":"choice","q":"C 语言程序中的预处理命令（如 #include <reg51.h>、#include <intrins.h>）必须放在源程序的（  ）。","o":["最前面","主函数之后","任意位置均可","最后一个函数之后"],"a":"A"},{"ch":3,"t":"judge","q":"C 语言中变量 i 和变量 I 表示同一个变量，书写时可以互相替换。","a":false},{"ch":3,"t":"choice","q":"图 3.5 电路中，按键 S₁ 没有按下时 P0.0 引脚的电平状态是（  ）。","o":["低电平","高电平","高阻态","电平不确定"],"a":"B"},{"ch":3,"t":"fill","q":"图 3.5 中 P0.0 引脚通过上拉电阻 R₁₀ 与____电源连接；当 S₁ 按下时，P0.0 引脚____，因此通过读取 P0.0 引脚的电平即可得知按键是否被按下。","a":["+5 V","接地"]},{"ch":3,"t":"judge","q":"51 单片机在复位时 I/O 端口引脚为高电平，因此可以省略上拉电阻，直接把按键 S₁ 接地即可。","a":true},{"ch":3,"t":"choice","q":"机械式按键在按下或释放时伴随的触点机械抖动，其持续时间一般为（  ）。","o":["0.5～1 ms","5～10 ms","50～100 ms","0.5～1 s"],"a":"B"},{"ch":3,"t":"term","q":"名词解释：独立式按键硬件接口方式。","a":"独立式按键硬件接口方式是指直接用单片机的 I/O 端口线控制按键，一个按键单独占用一根 I/O 端口线，按键的工作不会影响其他 I/O 端口线的状态（如图 3.5 中 P0.0 接 S₁）。这种连接方式的优点是电路配置灵活、软件结构简单；缺点是每个按键必须占用一根 I/O 端口线，因此在按键较多时 I/O 端口线浪费较大，不宜采用。"},{"ch":3,"t":"term","q":"名词解释：按键的机械抖动。","a":"机械式按键在按下或释放时，由于机械弹性作用的影响，触点不能立即稳定地接通或断开，而是伴随有一定时间的触点机械抖动（波形上表现为前沿抖动和后沿抖动），然后触点才稳定下来。抖动时间一般为 5~10 ms。在触点抖动期间检测按键的通与断状态，可能导致判断出错，因此需要采用硬件电路（如图 3.7 的去抖电路）或软件延时的方法进行去抖。"},{"ch":3,"t":"fill","q":"采用独立式按键接口时，每个按键必须占用____根 I/O 端口线；因此在按键较多时 I/O 端口线浪费较____，不宜采用。","a":["一","大"]},{"ch":3,"t":"choice","q":"ex3_3.c 中采用软件方法去抖，检测到按键按下后先调用 delay(1200) 延时约（  ），再重新检测该键是否仍然按下。","o":["1 ms","10 ms","100 ms","1 s"],"a":"B"},{"ch":3,"t":"fill","q":"图 3.8 软件去抖流程中，（a）为____流程，（b）为____流程，两者都是先判断、再延时 10 ms、然后再判断一次。","a":["检测按键","释放按键"]},{"ch":3,"t":"short","q":"什么是软件去抖？简述其编程思路。","a":"软件去抖是用程序延时的方法消除按键触点机械抖动影响的一种措施。编程思路是：在检测到有键按下时，先执行 10 ms 左右的延时程序，然后再重新检测该键是否仍然按下，以确认该键按下不是因抖动引起的；同理，在检测到该键释放时，也采用先延时再判断的方法消除抖动的影响。在 ex3_3.c 中，这一思路体现为两次 if(S1==0) 判断之间插入 delay(1200)，即：if(S1==0){ delay(1200); if(S1==0){……} }。"},{"ch":3,"t":"choice","q":"ex3_4.c 中，第二种显示模式（8 个灯交叉亮灭）对应的 P1 口输出数据是（  ）。","o":["0x00","0x55","0x0f","0xf0"],"a":"B"},{"ch":3,"t":"choice","q":"语句「if(++i==5) i=1;」中的 ++i 属于（  ）。","o":["前置运算，先执行加 1 操作，再使用 i 的值","后置运算，先使用 i 的值，再执行加 1 操作","逻辑运算，结果为真或假","关系运算，比较 i 与 5 的大小"],"a":"A"},{"ch":3,"t":"judge","q":"ex3_5.c 中若不检测按键是否释放（即去掉 while(!S1); 语句），对程序功能没有影响，四种显示模式仍能按顺序切换。","a":false},{"ch":3,"t":"fill","q":"ex3_5.c 中变量 i 的作用是记录按键 S₁ 被按下的____；语句 if(++i==5) i=1; 的作用是使 i 增 1，且增加到____后重新赋值 1。","a":["次数","5"]},{"ch":3,"t":"prog","q":"【补全代码】下面是教材 ex3_5.c 中用 switch 语句根据按键次数 i 选择显示模式的部分，请补全【①】～【④】四个 case 后的 P1 口输出值（依次为全亮、交叉亮灭、第三种模式、第四种模式）。\n\n```c\nswitch (i)\n{\n    case 1:P1=【①】;break;\n    case 2:P1=【②】;break;\n    case 3:P1=【③】;break;\n    case 4:P1=【④】;break;\n    default:break;\n}\n```","a":"① 0x00　② 0x55　③ 0x0f　④ 0xf0\n完整语句：\nswitch (i)\n{\n    case 1:P1=0x00;break;   //i=1显示第一种模式\n    case 2:P1=0x55;break;   //i=2显示第二种模式\n    case 3:P1=0x0f;break;   //i=3显示第三种模式\n    case 4:P1=0xf0;break;   //i=4显示第四种模式\n    default:break;\n}\n说明：每个 case 后必须加 break，否则执行完该 case 后会继续执行后面的 case 语句；default 在不满足任何 case 时执行，此例中可省略。"},{"ch":3,"t":"choice","q":"C 语言中的空语句是指（  ）。","o":["只有一个分号「;」的语句","一对空花括号「{}」","只有注释的语句","没有返回值的函数"],"a":"A"},{"ch":3,"t":"choice","q":"在复合语句中所定义的变量称为（  ），它的有效范围只在本复合语句中。","o":["全局变量","局部变量","静态变量","符号常量"],"a":"B"},{"ch":3,"t":"judge","q":"在 if 语句中，「表达式」必须用小括号括起来，且括号后面不能加分号。","a":true},{"ch":3,"t":"choice","q":"在 if 语句中，「表达式」通常为逻辑表达式或关系表达式，也可以是任何其他表达式或类型数据，只要表达式的值（  ）即为「真」。","o":["等于 1","非 0","等于 0","大于 0"],"a":"B"},{"ch":3,"t":"judge","q":"else 语句总是与在它上面跟它最近的 if 语句相配对，且 else 语句是 if 语句的一部分，不能单独使用。","a":true},{"ch":3,"t":"choice","q":"逻辑表达式「P3_0==0 && P3_1==0」中，符号「&&」的运算规则是（  ）。","o":["当且仅当左右两边的值都为「真」时，运算结果为「真」","只要有一边的值为「真」，运算结果即为「真」","左右两边都为「假」时，运算结果为「真」","对右边的值取反后再与左边相与"],"a":"A"},{"ch":3,"t":"choice","q":"关于 switch 语句中 case 后的常量表达式，下列说法正确的是（  ）。","o":["各常量表达式的值不能相同，否则会出现同一个条件有多种执行方案的矛盾","各常量表达式的值可以相同，程序会依次执行","必须是变量名","必须是浮点数"],"a":"A"},{"ch":3,"t":"judge","q":"switch 语句中「case 常量表达式」只相当于一个语句标号，执行完该标号后面的语句后会自动跳出整个 switch 语句。","a":false},{"ch":3,"t":"short","q":"简述 switch 语句的执行过程，并说明为什么要在每个 case 语句后面加 break 语句。","a":"执行过程：首先计算 switch 后「表达式」的值，并逐个与 case 后的「常量表达式」的值相比较；当「表达式」的值与某个「常量表达式」的值相等时，则执行该常量表达式后的「语句组」，再执行 break 语句，跳出 switch 语句的执行，继续执行下一条语句；如果表达式的值与所有 case 后的常量表达式均不相同，则执行 default 后的语句组。\n加 break 的原因：「case 常量表达式」只相当于一个语句标号，表达式的值和某个语句标号相等则转向该标号执行，但执行完该标号后面的语句后不会自动跳出整个 switch 语句，而是继续执行后面 case 的语句。因此必须在每一个 case 语句后面加 break 语句，使得执行完该 case 后能跳出整个 switch 语句。"},{"ch":3,"t":"judge","q":"switch 语句中 case 和 default 语句的先后顺序可以改变，不会影响程序的执行结果；若 default 后面是空语句，表示不做任何处理，可以省略。","a":true},{"ch":3,"t":"choice","q":"语句 while(1) 构成的循环是（  ）。","o":["循环体一次也不执行的循环","无限循环（死循环）","只执行一次的循环","语法错误的语句"],"a":"B"},{"ch":3,"t":"term","q":"名词解释：软件延时。","a":"软件延时是指在程序的延时函数中使用循环语句（如 delay() 函数中的 for 循环，其循环体为空语句），通过反复执行空循环来消耗 CPU 时间，从而产生延时效果的方法。软件延时的缺点是占用 CPU 时间，使得 CPU 在延时过程中不能做其他事情；解决的方法是使用单片机中的硬件定时器实现延时。"},{"ch":3,"t":"judge","q":"使用 while 语句时，如果循环条件一开始就为「假」，那么 while 后面的循环体一次都不会被执行。","a":true},{"ch":3,"t":"choice","q":"do-while 语句的一般形式为「do{语句组;}while(表达式);」，用它实现无限循环的正确写法是（  ）。","o":["do{ ; }while(1);","do{ ; }while(0);","do{ ; }while(1)","while(1){ do; }"],"a":"A"},{"ch":3,"t":"choice","q":"关于 while 语句与 do-while 语句的区别，下列说法正确的是（  ）。","o":["do-while 先执行、后判断，while 先判断、后执行","while 先执行、后判断，do-while 先判断、后执行","两者完全相同，可以无条件互换","do-while 的循环体至少要执行两次"],"a":"A"},{"ch":3,"t":"fill","q":"使用 if 语句、while 语句时，表达式括号后面都____加分号；但在 do-while 语句的表达式括号后面____加分号。","a":["不能","必须"]},{"ch":3,"t":"fill","q":"用 for 语句求 1~100 的累加和，循环语句为 for(i=1;i<=100;i++)，当 i=____ 时条件 i<=100 不成立，循环结束。","a":["101"]},{"ch":3,"t":"choice","q":"在 C51 程序设计中，for(;;){ 语句组; } 的作用相当于（  ）。","o":["while(1) 构成的无限循环","只执行一次的循环","循环体一次也不执行的循环","语法错误，无法编译"],"a":"A"},{"ch":3,"t":"judge","q":"for 语句中的三个表达式都是可选项，可以省略，但必须保留分号「;」。","a":true},{"ch":3,"t":"judge","q":"在循环嵌套中，一个 break 语句只能向外跳出一层。","a":true},{"ch":3,"t":"short","q":"break 语句与 continue 语句有什么区别？各举教材中的一个用法说明。","a":"break 语句是直接结束整个循环语句：不论循环条件是否满足，都可使程序立即终止整个循环而执行循环后面的语句；在 switch 语句中使用时则跳出 switch。它通常与 if 语句一起使用，例如 ex3_2.c 举一反三中的 for(i=1;;i++){ if(i>10) break; sum=sum+i; }，i>10 时立即跳出循环。\ncontinue 语句则是停止当前循环体的执行，跳过循环体中余下的语句，再次进入循环条件判断，准备继续开始下一次循环体的执行，它只结束本次循环而不是整个循环。例如教材求 1~20 之间所有不能被 5 整除的整数之和的程序段：for(i=1;i<=20;i++){ if(i%5==0) continue; sum=sum+i; }，i 能被 5 整除时跳过本次求和，继续下一次循环。\n另外：break 对 if-else 的条件语句不起作用；在循环嵌套中一个 break 只能向外跳出一层。"},{"ch":3,"t":"fill","q":"要求 1~20 之间所有不能被 5 整除的整数之和，程序段为：for(i=1;i<=20;i++){ if(i%5==0) ____; sum=sum+i; }，其中「%」为____运算符。","a":["continue","取余"]},{"ch":3,"t":"choice","q":"任务3-3 声光报警器电路中，用于控制蜂鸣器进行声音报警的引脚是（  ）。","o":["P1.0","P1.1","P1.2","P0.0"],"a":"A"},{"ch":3,"t":"fill","q":"图 3.17 声光报警器电路中，P1.____ 引脚控制蜂鸣器，P1.____ 引脚控制绿色发光二极管，P1.____ 引脚控制红色发光二极管，P0.0 引脚接按键 S₁。","a":["0","1","2"]},{"ch":3,"t":"choice","q":"热释电红外传感器模块（由 BISS0001 芯片构成）有 3 个引脚，当有人靠近时其 OUT 引脚输出（  ）。","o":["0 V","3 V","5 V","12 V"],"a":"B"},{"ch":3,"t":"choice","q":"用单片机 I/O 端口驱动直流电机时必须外加驱动电路，原因是（  ）。","o":["单片机 I/O 端口只能输出高电平","单片机 I/O 端口输出电流只有几 mA，而电机额定电流至少几百 mA，驱动能力不足","直流电机只能由交流电源驱动","外加驱动电路可以提高单片机的主频"],"a":"B"},{"ch":3,"t":"fill","q":"图 3.22 自动感应垃圾桶控制电路中，____V 电源提供给电机驱动功率模块驱动直流电机，经 7805 稳压后的 +5 V 电源提供给____。","a":["+12","单片机"]},{"ch":3,"t":"short","q":"按照图 3.22 的自动感应垃圾桶控制电路，说明该系统应具有的三项功能（含电机正转、反转与停止的控制条件）。","a":"（1）人体感应信号检测功能：检测 P0.1 引脚的电平状态，判断是否有人接近（红外模块 OUT 接 P0.1）。（2）电机正转功能：P1.5=1、P1.3=1、P1.4=0；若要电机停止，只需让 P1.3=0 即可。（3）电机反转功能：P1.5=1、P1.3=0、P1.4=1；若要电机停止，只需让 P1.4=0 即可。即通过 P1.3、P1.4 的高低电平组合控制 L298 输出端的极性，从而控制直流电机的转向。"},{"ch":3,"t":"choice","q":"在 C51 的数据类型中，unsigned char 型的数据长度和值域为（  ）。","o":["单字节，−128～127","双字节，−32 768～+32 767","单字节，0～255","双字节，0～65 535"],"a":"C"},{"ch":3,"t":"short","q":"C51 在 ANSI C 的基础上扩充了哪些数据类型？各有什么作用？","a":"C51 的扩充数据类型（表 3.2 中加底色的部分）主要有 bit、sbit、sfr、sfr16 以及指针型 *。①bit：位类型，定义一个位类型变量，值只能是 0 或 1，与高级语言的 boolean 类型 True/False 类似，但不能定义位指针和位数组。②sbit：可寻址位类型，利用它可以访问单片机内部 RAM 中的可寻址位或专用寄存器中的可寻址位，定义格式为 sbit 位名称=位地址;，如 sbit P1_1=P1^1; 或 sbit P1_1=0x91;。③sfr：专用寄存器类型，占 1 B、值域 0～255，用来访问单片机内部的所有 8 位专用寄存器，如 sfr P0=0x80;。④sfr16：16 位专用寄存器类型，占 2 B、值域 0～65 535，定义时 2 字节地址必须连续且低字节地址在前，如 sfr16 T2=0xcc;，不能用于定时器 0 和 1 的定义。⑤指针型 *：变量中存放的是指向另一个数据的地址，在 C51 中长度一般为 1～3 B。这些扩充类型为访问 51 单片机的专用寄存器和可寻址位提供了直接手段，是 51 单片机 C 语言编程的基础。"},{"ch":3,"t":"choice","q":"C51 中 int 型数据占用的长度是（  ）。","o":["1 B","2 B","4 B","8 B"],"a":"B"},{"ch":3,"t":"judge","q":"在 C51 编译器中，整型（int）和短整型（short）相同，单精度浮点型（float）和双精度浮点型（double）相同。","a":true},{"ch":3,"t":"choice","q":"bit 类型变量的值只能是（  ）。","o":["0 或 1","0～255","−128～+127","任意整数"],"a":"A"},{"ch":3,"t":"judge","q":"bit 是 C51 编译器的一种扩充数据类型，既可以用它定义位变量，也可以用它定义位指针和位数组。","a":false},{"ch":3,"t":"choice","q":"sfr 数据类型占用的字节数和值域是（  ）。","o":["1 B，0～255","2 B，0～65 535","1 b，0 或 1","1 B，−128～+127"],"a":"A"},{"ch":3,"t":"fill","q":"51 单片机内部定义了____个专用寄存器，它们不连续地分布在片内 RAM 的高 128 字节中，地址为____～____。","a":["21","0x80","0xFF"]},{"ch":3,"t":"choice","q":"51 单片机中具有位寻址功能的 11 个专用寄存器，其字节地址的共同特点是（  ）。","o":["字节地址都能被 8 整除，十六进制以 8 或 0 结尾","字节地址都是偶数","字节地址都小于 0x80","字节地址都位于低 128 字节"],"a":"A"},{"ch":3,"t":"fill","q":"把延时函数的形式参数由 unsigned int 改为 unsigned char 后，若调用时实参为 2 000，则程序运行时实际值为____（2 000−256×7），达不到预期的延时效果。","a":["208"]},{"ch":3,"t":"choice","q":"字符串常量 “A” 在存储器中实际占用的字节数是（  ）。","o":["1 B","2 B","3 B","4 B"],"a":"B"},{"ch":3,"t":"judge","q":"字符串常量 “A” 与字符常量 ‘A’ 完全相同，在存储器中占用的字节数也一样。","a":false},{"ch":3,"t":"choice","q":"语句 #define PI 3.1415 中的 PI 是（  ）。","o":["变量","符号常量","字符串常量","函数名"],"a":"B"},{"ch":3,"t":"judge","q":"变量的值在程序执行期间是不能发生变化的，常量的值则可以随程序运行随时改变。","a":false},{"ch":3,"t":"fill","q":"变量定义的一般格式为：[____] 数据类型 [____] 变量名表; 其中“数据类型”和“变量名表”是必要的，方括号中的内容是可选项。","a":["存储种类","存储器类型"]},{"ch":3,"t":"fill","q":"变量的存储种类有____、____、____、____四种，默认的存储种类是____。","a":["auto（自动变量）","extern（外部变量）","static（静态变量）","register（寄存器变量）","auto"]},{"ch":3,"t":"choice","q":"small 存储器模式的特点是（  ）。","o":["默认变量全部装入内部 RAM，访问速度快但空间有限","默认变量装入外部 RAM 的一页（256 B）","默认变量可存放在多达 64 KB 的外部 RAM 中","默认变量固化在程序存储器中"],"a":"A"},{"ch":3,"t":"choice","q":"compact 存储器模式默认的存储器类型是（  ）。","o":["data","pdata","xdata","code"],"a":"B"},{"ch":3,"t":"fill","q":"三种存储器模式 small、compact、large 的默认存储器类型依次为____、____、____。","a":["data","pdata","xdata"]},{"ch":3,"t":"judge","q":"在 small 存储器模式下，所有默认的变量参数均装入内部 RAM 中，其优点是访问速度快，缺点是空间有限，而且分配给堆栈的空间比较少，遇到函数嵌套调用和递归调用时必须小心。","a":true},{"ch":3,"t":"judge","q":"静态局部变量在函数内定义，退出该函数后它仍继续存在，但在该函数外不能使用它。","a":true},{"ch":3,"t":"choice","q":"register 存储种类的变量存放在（  ）。","o":["片内数据存储器 RAM","片外数据存储器 RAM","CPU 的寄存器","程序存储器 ROM"],"a":"C"},{"ch":3,"t":"choice","q":"表达式 20%9 的值是（  ）。","o":["2","2.22","1","0"],"a":"A"},{"ch":3,"t":"choice","q":"表达式 7/3 的值是（  ）。","o":["2.33","2","3","1"],"a":"B"},{"ch":3,"t":"choice","q":"执行语句 int i=100,j; j=i++; 后，j 的值是（  ）。","o":["100","101","102","99"],"a":"B"},{"ch":3,"t":"fill","q":"设 int i=100,j; 则执行 j=++i; 后 j=____、i=____；再执行 j=i++; 后 j=____、i=____。","a":["101","101","101","102"]},{"ch":3,"t":"choice","q":"要保留从 P3 端口读入的 P3.0 和 P3.1 两位数据、其余位清零，正确的操作是（  ）。","o":["control=P3&0x03;","control=P3|0x03;","control=P3^0x03;","control=~P3;"],"a":"A"},{"ch":3,"t":"choice","q":"要把 P1 端口的 P1.4～P1.7 清零、其余位保持不变，正确的操作是（  ）。","o":["P1&=0x0f;","P1|=0x0f;","P1^=0x0f;","P1=0x0f;"],"a":"A"},{"ch":3,"t":"choice","q":"设 a=0x98 为无符号数，则表达式 a>>2 的结果是（  ）。","o":["0x26","0xE6","0x4C","0x13"],"a":"A"},{"ch":3,"t":"fill","q":"设 a=00000011B（十进制数 3），执行 a<<4 后结果为____B，即十进制数____。","a":["00110000","48"]},{"ch":3,"t":"judge","q":"根据运算符优先级，关系表达式 “a>b+c+d;” 应理解为 “(a>b)+(c+d);”。","a":false},{"ch":3,"t":"choice","q":"关系表达式的运算结果只有（  ）。","o":["0 和 1","真和假两个字符","任意整数","0～255"],"a":"A"},{"ch":3,"t":"choice","q":"下列运算符优先级从高到低的排列，正确的是（  ）。","o":["! → 算术运算符 → 关系运算符 → && → || → 赋值运算符","算术运算符 → ! → 关系运算符 → && → || → 赋值运算符","! → 关系运算符 → 算术运算符 → || → && → 赋值运算符","赋值运算符 → 算术运算符 → 关系运算符 → && → || → !"],"a":"A"},{"ch":3,"t":"judge","q":"C51 的位运算符 & 与逻辑运算符 && 的作用相同，都是对两个操作数进行“与”运算。","a":false},{"ch":3,"t":"choice","q":"执行语句 x=(y=10,y+5); 后，x 的值是（  ）。","o":["10","5","15","20"],"a":"C"},{"ch":3,"t":"fill","q":"C51 提供了 6 种位运算符，分别是____、____、____、____、____、____。","a":["&（按位与）","|（按位或）","^（按位异或）","~（按位取反）",">>（右移）","<<（左移）"]},{"ch":3,"t":"choice","q":"某 PWM 信号的周期 T=4 μs，高电平持续的时间 T₁=1 μs，则该信号的占空比为（  ）。","o":["0.25","0.4","4","0.75"],"a":"A"},{"ch":3,"t":"fill","q":"PWM 信号的占空比是指____与____的比值；只要改变____和____的值，即改变波形的占空比，就达到 PWM 脉宽调制的目的。","a":["高电平持续的时间 T₁","信号周期 T","T₁","T₂"]},{"ch":3,"t":"judge","q":"PWM 技术是一种周期一定而高低电平可调的方波信号；当输出脉冲的频率一定时，占空比越大，其高电平持续的时间越长。","a":true},{"ch":3,"t":"choice","q":"ex3_8.c 中用于控制亮、灭延时的变量 i、j 取何初值时台灯处于最暗状态？","o":["i=0，j=500","i=500，j=0","i=0，j=0","i=500，j=500"],"a":"A"},{"ch":3,"t":"fill","q":"ex3_8.c 中用 #define 定义了符号常量：ON 定义为____表示灯亮，OFF 定义为____表示灯灭。","a":["0","1"]},{"ch":3,"t":"choice","q":"ex3_8.c 中确认亮度加强按键 L_up 按下、完成去抖动后，执行的调整语句是（  ）。","o":["j--;i++;","j++;i--;","i++;j++;","i--;j--;"],"a":"A"},{"ch":3,"t":"judge","q":"ex3_8.c 中当亮度调到边界时，用 if (j==0) {j=500;i=0;} 使灯调到最亮后再返回最暗，用 if (i==0) {i=500;j=0;} 实现调到最暗后再返回最亮。","a":true},{"ch":3,"t":"short","q":"简述任务3-4 可调光华台灯是如何实现亮度调节的。","a":"采用 PWM（脉宽调制）软件模拟法：单片机在 P1.0 引脚上不断输出高低电平，形成一个周期一定、高低电平可调的方波去驱动发光二极管。一个周期中高电平持续 T₁（灯亮）、低电平持续 T₂（灯灭），占空比 = T₁/T。程序中用 light=ON; delay(i); light=OFF; delay(j); 产生 PWM 波形，i 控制灯亮的时间、j 控制灯灭的时间。按下 L_up（接 P0.0）时执行 j--;i++; 使占空比增大、灯变亮，调到 j==0 时置 j=500、i=0 回到最暗；按下 L_down（接 P0.1）时执行 j++;i--; 使占空比减小、灯变暗，调到 i==0 时置 i=500、j=0 回到最亮。按键均经 delay(100) 去抖动并二次确认。由于该 51 单片机内部没有 PWM 模块，只能采用软件模拟法，方法简单实用但占用 CPU 大量时间。"},{"ch":3,"t":"choice","q":"在直流电机的 H 桥驱动电路中，要使电机运转，必须（  ）。","o":["导通对角线上的一对三极管","导通同一侧的两个三极管","只导通一个三极管","让四个三极管全部导通"],"a":"A"},{"ch":3,"t":"fill","q":"ex3_9.c 中 pwm(0,1,720,1680) 对应风速____挡（____风），pwm(0,1,1250,1250) 对应风速____挡，pwm(0,1,1680,720) 对应风速____挡。","a":["1","弱","2","3"]},{"ch":3,"t":"choice","q":"四相步进电机以单双八拍方式工作时，其通电顺序为（  ）。","o":["A—AB—B—BC—C—CD—D—DA—A","A—B—C—D—A","AB—BC—CD—DA—AB","A—B—BC—C—D—DA—AB—A"],"a":"A"},{"ch":3,"t":"judge","q":"四相步进电机要反转，只需按与正转相反的方向顺序通电。","a":true},{"ch":3,"t":"fill","q":"步进电机驱动电路采用 L298N 芯片，其 IN1～IN4 分别与单片机____相连，而单片机的 P0.0～P0.3 分别与四个按键相连，实现反转、正转、加速和减速功能。","a":["P1.0～P1.3"]},{"ch":3,"t":"choice","q":"ex3_10.c 的主函数中，全局变量 COUNT 的初值是（  ）。","o":["10","20","50","100"],"a":"B"},{"ch":3,"t":"judge","q":"ex3_10.c 中 COUNT 是每拍的延时参数，COUNT 越小输出脉冲频率越高、步进电机转得越快；按加速键 S₄ 时 COUNT 加 1，但需满足 COUNT<50。","a":true},{"ch":3,"t":"prog","q":"下面是教材 ex3_10.c 中控制步进电机正转的函数 forward()，采用单双八拍方式。请补全 ①～④ 处缺失的 P1 赋值语句（注释已给出该拍通电的相），并说明 do-while 的循环条件为什么写成 while (S1==1)。\n\nvoid forward ( )\n{\n    do\n    {\n        P1=0x08;   //A\n        delay (COUNT);\n        P1=0x09;   //AD\n        delay (COUNT);\n        P1=0x01;   //D\n        delay (COUNT);\n        ①______;   //DC\n        delay (COUNT);\n        P1=0x02;   //C\n        delay (COUNT);\n        ②______;   //CB\n        delay (COUNT);\n        P1=0x04;   //B\n        delay (COUNT);\n        ③______;   //BA\n        delay (COUNT);\n        if (S3==0) { if (COUNT>2) COUNT--; }\n        if (S4==0) { if (COUNT<50) COUNT++; }\n    }while (④______);\n}","a":"① P1=0x03;  ② P1=0x06;  ③ P1=0x0C;  ④ S1==1\n说明：单双八拍的通电顺序为 A—AB—B—BC—C—CD—D—DA—A，用 P1 的低 4 位（P1.0～P1.3）分别对应 A、B、C、D 四相，故 DC 拍为 0x03、CB 拍为 0x06、BA 拍为 0x0C；因 P1 高 4 位恒为 0，每个状态只点亮相邻两相（或单相）。do-while 的条件写成 while (S1==1)，表示只要反转按键 S₁ 没有被按下（P0.0 仍为高电平）就继续循环输出脉冲，电机持续正转；一旦 S₁ 按下（S1==0）则退出 forward()，转去执行 reverse() 反转。这样用按键电平直接作为循环条件，比在循环体内判断再 break 更简洁。"},{"ch":3,"t":"fill","q":"一个 C 源程序有且仅有一个____函数，C 程序总是从该函数开始执行，其他函数可以有多个。","a":["main（主函数）"]},{"ch":3,"t":"judge","q":"一个 C 源程序可以由一个或多个函数组成，其中可以包含多个主函数 main()。","a":false},{"ch":3,"t":"choice","q":"执行 int i=3; while(i=3); 时，该 while 循环执行空语句的次数是（  ）。","o":["无限次","0 次","1 次","2 次"],"a":"A"},{"ch":3,"t":"fill","q":"在 C51 程序中常常把____语句作为循环体，用于消耗 CPU 运行时间，产生延时效果；把____类型用于处理 ASCII 字符或处理小于等于 255 的整型数最为广泛。","a":["空（;）","unsigned char"]},{"ch":3,"t":"fill","q":"____语句一般用做单一条件或分支数目较少的场合；如果编写超过 3 个以上分支的程序，可用多分支选择的____语句。","a":["if","switch"]},{"ch":3,"t":"fill","q":"思考与练习题 3 的 3.2 第（8）题：执行 i=3; while (i!=0) ; 该循环执行了____次空语句。","a":["无限（死循环，无数次）"]},{"ch":3,"t":"short","q":"C51 的函数由哪两部分组成？函数有哪三种调用方式？调用一个函数需要具备什么条件？","a":"函数由两部分组成：①函数定义，即函数的第一行，包括函数类型、函数名、函数参数（形式参数）名、参数类型等；②函数体，即花括号 { } 内的部分，由定义局部变量数据类型的说明部分和实现函数功能的执行部分组成。若函数不需要返回执行结果，函数类型用无值型关键字 void 定义，return 语句可以省略。\n按函数调用在主调用函数中出现的位置，有三种调用方式：①函数语句，把被调用函数作为主调用函数的一个语句，如 delay(10000);，不要求返回值；②函数表达式，被调用函数以一个运算对象的形式出现在表达式中，如 c=2*max(a,b);；③函数参数，被调用函数作为另一个函数的实参，如 m=max(a,max(b,c));。\n调用条件：①被调用函数必须是已经存在的函数（标准库函数或用户已定义的函数），若函数定义在调用之后，必须在调用之前（一般在程序头部）对函数进行声明；②如果自定义函数不是在本源程序文件中定义的，要在程序开始处用 extern 修饰符进行函数原型说明。此外，调用标准函数必须用 #include 把相应头文件包含进来，并遵循“先定义或声明、后调用”的原则，实参与形参顺序对应、个数相等、类型一致。"},{"ch":3,"t":"short","q":"C51 变量的四种存储种类 auto、extern、static、register 有什么区别？","a":"①auto（自动变量）：C 语言中使用最广泛的一种，函数内凡未加存储种类说明的变量均为自动变量（默认）。它属于动态存储方式，只有在定义它的函数被调用时才分配存储单元，函数调用结束即释放，值不能保留；作用域仅限于定义它的函数或复合语句内，故不同函数内可使用同名变量而不混淆。②extern（外部变量）：在所有函数之前、函数外部定义的变量都是外部变量，可默认有 extern 说明符；若在函数体内引用已在别处或别的程序模块文件中定义过的外部变量，必须用 extern 说明。它用于多模块程序共享同一变量。③static（静态变量）：属于静态存储方式，静态局部变量在函数内定义，始终存在，但作用域仍限于该函数，退出函数后虽存在但不能使用；静态全局变量的作用域局限于一个源文件内，可避免在其他源文件中引起错误。④register（寄存器变量）：存放在 CPU 的寄存器中，使用时不需要访问内存，直接从寄存器读写，可提高效率。"},{"ch":3,"t":"term","q":"名词解释：数据类型。","a":"数据是计算机操作的对象，任何程序设计都要进行数据处理；具有一定格式的数字或数值称为数据，数据的不同格式称为数据类型。在 C 语言中，数据类型可分为基本数据类型、构造数据类型、指针类型和空类型四大类；其中基本类型又包括数值类型（整型 short/int/long、实型 float/double）、字符类型 char 和枚举类型 enum。在 C51 中，除 ANSI C 的标准类型外还扩充了 bit、sbit、sfr、sfr16 等类型，且 int 与 short 相同、float 与 double 相同。"},{"ch":3,"t":"term","q":"名词解释：占空比。","a":"PWM 技术是一种周期一定而高低电平可调的方波信号。在一个信号周期中，高电平持续的时间为 T₁，低电平持续的时间为 T₂，高电平持续的时间与信号周期的比值称为占空比，即 占空比 = T₁/T。例如信号周期 T=4 μs、高电平持续时间 T₁=1 μs 时，占空比为 1/4=0.25。占空比越大，高电平持续的时间越长；改变 T₁ 和 T₂ 即改变占空比，也就改变了输出到负载上的平均电压，从而实现调光、调速。"},{"ch":3,"t":"term","q":"名词解释：存储器模式（small、compact、large）。","a":"存储器模式是 C51 编译器控制指令，用来决定变量的默认存储器类型、参数传递区和无明确存储种类说明的处理方式，分为三种：small 模式把参数及局部变量放入可直接寻址的内部数据存储器中（最大 128 B，默认类型 data），访问速度快但空间有限、堆栈空间较少，适用于较小的程序；compact 模式把参数及局部变量放入外部数据存储器的前 256 B 中（最大 256 B，默认类型 pdata），变量空间比 small 大但速度较慢；large 模式把参数及局部变量直接放入外部数据存储器中（最大 64 KB，默认类型 xdata），空间大、可定义变量多但速度较慢，适用于较大程序或扩展了大容量外部 RAM 的系统。可用 Keil 环境设置，也可在源程序第一行用 #pragma compact 等预处理命令设置；本书程序均运行在 small 模式下。"},{"ch":3,"t":"prog","q":"教材 3.3.3 节指出“任务 3-1 中流水灯控制程序 ex3_2.c 就是采用移位运算来实现的”。请用移位运算编写一段 C51 程序，使接在 P1 口的 8 个发光二极管（低电平点亮）从左到右逐个点亮、循环显示，并写出当 i 取 0、1、2 时 P1 的值。","a":"#include <reg51.h>\nvoid delay(unsigned int i)\n{\n    unsigned int k;\n    for (k = 0; k < i; k++);\n}\nvoid main()\n{\n    unsigned char i;\n    while (1)\n    {\n        for (i = 0; i < 8; i++)\n        {\n            P1 = ~(0x01 << i);   // 0x01 左移 i 位后取反，对应位输出低电平点亮\n            delay(20000);\n        }\n    }\n}\n当 i=0 时 P1=~(0x01)=0xFE；i=1 时 P1=~(0x02)=0xFD；i=2 时 P1=~(0x04)=0xFB。即 0x01 左移 i 位使“1”逐位左移，取反后该位为 0，对应发光二极管点亮，其余为 1 熄灭；循环 8 次后回到 i=0，形成流水效果。也可写成 P1=0xfe; P1=P1<<1|0x01; 的移位形式。说明：左移时高位丢弃、低位补 0；若写成 P1=P1<<1 会逐位熄灭而不循环，故每轮需重新由 0x01 起移。"},{"ch":4,"t":"choice","q":"LED 数码管由（  ）个发光二极管（简称段）构成，通过不同的发光段组合可显示数字 0~9、字符 A~F 及符号「-」「.」等。","o":["6","7","8","10"],"a":"C"},{"ch":4,"t":"choice","q":"共阳极 LED 数码管的 8 个发光二极管阳极连接在一起作为公共控制端 com，该端应接（  ）。","o":["低电平","高电平","悬空","时钟信号"],"a":"B"},{"ch":4,"t":"choice","q":"共阳极 LED 数码管显示字符「0」时，需要把 a~f 六段点亮，应向段控制端送入的字型码是（  ）。","o":["0x3F","0xC0","0xF9","0x80"],"a":"B"},{"ch":4,"t":"choice","q":"共阴极 LED 数码管显示字符「1」时需点亮 b、c 两段，其字型码是（  ）。","o":["0xF9","0x06","0x30","0x4F"],"a":"B"},{"ch":4,"t":"choice","q":"共阴极 LED 数码管显示字符「5」的字型码是（  ）。","o":["0x92","0x6D","0x7D","0x82"],"a":"B"},{"ch":4,"t":"choice","q":"向共阳极 LED 数码管送入字型码 0xF9，数码管显示的字符是（  ）。","o":["1","7","3","9"],"a":"A"},{"ch":4,"t":"choice","q":"向共阴极 LED 数码管送入字型码 0x7F，数码管显示的字符是（  ）。","o":["6","8","0","9"],"a":"B"},{"ch":4,"t":"choice","q":"向共阳极 LED 数码管的段控制端送入 0xFF，数码管将（  ）。","o":["显示字符 8","全部熄灭","显示字符 0","所有段全部点亮"],"a":"B"},{"ch":4,"t":"choice","q":"采用静态显示方式显示 n 位字符时，需要占用的单片机 I/O 端口线为（  ）根。","o":["n","8","8n","n+8"],"a":"C"},{"ch":4,"t":"choice","q":"LED 数码管动态显示能使人感觉多个数码管同时点亮，利用的是人眼的（  ）。","o":["视觉暂留效应","暗视觉效应","余辉效应","闪烁效应"],"a":"A"},{"ch":4,"t":"choice","q":"任务4-2 中 6 个共阳极数码管的位选码由单片机的（  ）口输出。","o":["P0 口","P1 口","P2 口","P3 口"],"a":"C"},{"ch":4,"t":"choice","q":"在 6 位数码管动态显示程序中，若把延时函数的实际参数由 100 改为 10 000，则（  ）。","o":["显示更加稳定","6 个数码管轮流显示，不能同时稳定显示","数码管全部熄灭","显示亮度明显提高"],"a":"B"},{"ch":4,"t":"choice","q":"数码管动态显示程序中，若在字符交替时去掉关显示语句「P1=0xff;」，显示效果会出现（  ）。","o":["亮度提高","拖影","全部熄灭","无任何影响"],"a":"B"},{"ch":4,"t":"choice","q":"C 语言中数组元素的下标从（  ）开始计算。","o":["0","1","-1","由数组长度决定"],"a":"A"},{"ch":4,"t":"choice","q":"定义 int a[10]; 后，该数组的合法元素是（  ）。","o":["a[1]~a[10]","a[0]~a[9]","a[0]~a[10]","a[1]~a[9]"],"a":"B"},{"ch":4,"t":"choice","q":"定义 int num[3][4]; 该数组共包含（  ）个数组元素。","o":["7","12","34","3"],"a":"B"},{"ch":4,"t":"choice","q":"二维数组在内存中的存放方式是（  ）。","o":["按列排列","按行排列","随机存放","按元素值大小排列"],"a":"B"},{"ch":4,"t":"choice","q":"存放在字符数组中的字符串，总是以（  ）作为串的结束标志。","o":["换行符","字符 '\\0'","空格字符","回车符"],"a":"B"},{"ch":4,"t":"choice","q":"执行语句 char ch[]={'c','h','i','n','e','s','e','\\0'}; 后，字符数组 ch 的长度是（  ）。","o":["7","8","9","10"],"a":"B"},{"ch":4,"t":"choice","q":"74HC595 芯片内部具有 8 位串行移位寄存器，其数据传送方式是（  ）。","o":["串行移入、并行输出","并行移入、串行输出","全并行输入输出","全串行输入输出"],"a":"A"},{"ch":4,"t":"choice","q":"74HC595 的移位寄存器在时钟引脚 SCK（11 脚）（  ）时移一位。","o":["处于上升沿","处于下降沿","保持高电平","保持低电平"],"a":"A"},{"ch":4,"t":"choice","q":"一块 8×8 LED 点阵共有（  ）个引脚。","o":["8","16","64","32"],"a":"B"},{"ch":4,"t":"fill","q":"LED 数码管由 8 个____（简称段）构成，通过不同的发光段组合可显示数字 0~9 及部分字符。","a":["发光二极管"]},{"ch":4,"t":"fill","q":"共阳极数码管的公共控制端 com 应接____；共阴极数码管的公共控制端 com 应接____。","a":["高电平（+5 V）","低电平（地）"]},{"ch":4,"t":"fill","q":"共阳极数码管显示字符「8」时七段全部点亮，其字型码为 0x____。","a":["80"]},{"ch":4,"t":"fill","q":"共阴极数码管显示字符「3」的字型码为 0x____。","a":["4F"]},{"ch":4,"t":"fill","q":"静态显示 n 位数码管需占用 8×n 个 I/O 端口，因此数码管静态显示方式适合显示位数较____的场合。","a":["少"]},{"ch":4,"t":"fill","q":"数码管动态显示电路中，各位数码管的公共端称为____，所有数码管 8 个显示段并联后所接的 I/O 端口称为____。","a":["位选端","段选端"]},{"ch":4,"t":"fill","q":"C 语言中数组元素的下标从____开始；数组说明的方括号中给出的是____，即可取下标的最大值加 1。","a":["0","长度"]},{"ch":4,"t":"fill","q":"一维数组的定义格式为：类型说明符 数组名[____]; 其中方括号内的内容不可以是变量。","a":["常量表达式"]},{"ch":4,"t":"fill","q":"定义 int num[3][4]; 其中第一维的长度为____，该数组共包括____个数组元素。","a":["3","12"]},{"ch":4,"t":"fill","q":"用字符串方式对字符数组初始化时，数组元素数目一定要比字符多一个，多出的那个元素存放____，由 C 编译器自动加上。","a":["'\\0'"]},{"ch":4,"t":"fill","q":"任务4-1 的 8 路抢答器中，8 个独立式按键接在____口，一位共阳极数码管的段控制端接在____口。","a":["P0","P1"]},{"ch":4,"t":"fill","q":"任务4-2 的 6 位数码管动态显示电路中，段选码经八同相三态缓冲器____驱动，位选码经六反相驱动器____驱动。","a":["74LS245","74LS04"]},{"ch":4,"t":"fill","q":"74HC595 芯片内部具有一个 8 位____寄存器和一个 8 位____寄存器，输出端口为可控的三态输出端。","a":["串行移位","存储（锁存）"]},{"ch":4,"t":"fill","q":"16×16 LED 点阵显示电路中，16 位列线数据由____片 74HC595 移位寄存器级联提供。","a":["2"]},{"ch":4,"t":"judge","q":"共阳极数码管的公共端应接低电平，某段控制端为高电平时该段点亮。","a":false},{"ch":4,"t":"judge","q":"对于同一个字符，其共阳极字型码与共阴极字型码互为取反，例如字符「1」共阳为 0xF9、共阴为 0x06。","a":true},{"ch":4,"t":"judge","q":"数码管静态显示占用单片机的 I/O 端口线较多，适合显示位数较少的场合。","a":true},{"ch":4,"t":"judge","q":"数码管动态显示时，延时时间越长，各位数码管显示越稳定。","a":false},{"ch":4,"t":"judge","q":"定义数组时，方括号中的常量表达式可以是程序中的变量，用变量指定数组长度是合法的。","a":false},{"ch":4,"t":"judge","q":"C 语言中数组必须先定义后使用，且不能在程序中用一个语句整体引用整个数组（如 sum=sum+a; 是错误的）。","a":true},{"ch":4,"t":"judge","q":"定义 int num[3][4]; 该数组共 12 个元素，由于 int 类型数据占 2 字节，所以每个元素占 2 字节内存空间。","a":true},{"ch":4,"t":"judge","q":"执行 char ch[10]={'c','h','i','n','e','s','e','\\0'}; 后，ch[0]~ch[7] 被赋初值，ch[8] 和 ch[9] 系统自动赋予空格字符。","a":true},{"ch":4,"t":"judge","q":"8×8 LED 点阵中，点亮某行某列交叉处发光二极管的条件是对应行输出高电平、对应列输出低电平。","a":true},{"ch":4,"t":"judge","q":"74HC595 的移位寄存器在 SCK 下降沿移位，存储寄存器在 RCK 上升沿锁存数据。","a":false},{"ch":4,"t":"judge","q":"LED 点阵的总点数为行数与列数的积，引脚数为行数与列数的和，故 8×8 点阵有 16 个引脚。","a":true},{"ch":4,"t":"term","q":"名词解释：数码管的静态显示方式。","a":"静态显示是指使用数码管显示字符时，数码管的公共端恒定接地（共阴极）或接 +5 V 电源（共阳极），将每个数码管的 8 个段控制引脚分别与单片机的一个 8 位 I/O 端口相连接。只要 I/O 端口有显示字型码输出，数码管就显示给定字符并保持不变，直到 I/O 端口输出新的段码。其优点是较小的电流即可获得较高亮度、占用 CPU 时间少、编程简单；缺点是占用 I/O 端口线多，n 位显示需 8×n 根，硬件电路复杂、成本高，适合显示位数较少的场合。"},{"ch":4,"t":"term","q":"名词解释：数码管的动态显示（动态扫描显示）。","a":"动态显示是一种按位轮流点亮各位数码管、高速交替地进行显示，利用人的视觉暂留作用使人感觉看到多个数码管同时显示的控制方式。其电路将所有数码管的 8 个显示段分别并联后由一个并行 I/O 端口控制（段选端），各位数码管的公共端由另一个 I/O 端口控制（位选端）。工作时某一时段只让一位数码管的位选端有效并送出相应字型码，其他位因位选端无效而熄灭，下一时段按顺序选通另一位，如此循环，这一过程称为动态扫描显示。"},{"ch":4,"t":"term","q":"名词解释：数组。","a":"在程序设计中，为了处理方便，把具有相同类型的若干数据项按有序的形式组织起来，这些按序排列的同类数据元素的集合称为数组，组成数组的各个数据分项称为数组元素。数组中的元素有固定数目和相同类型，数组元素的数据类型就是该数组的数据类型；数组还分为一维、二维、三维和多维数组，常用的是二维和字符数组（一维、二维和字符数组）。数组必须先定义后使用，且只能逐个引用数组元素而不能整体引用。"},{"ch":4,"t":"short","q":"简述共阳极与共阴极 LED 数码管内部结构的区别，并说明如何用指针式万用表判断数码管是共阳极还是共阴极。","a":"结构区别：共阳极数码管 8 个发光二极管的阳极连接在一起作为公共控制端 com，接高电平，阴极作为段控制端，某段控制端为低电平时该段导通点亮；共阴极数码管 8 个发光二极管的阴极连接在一起作为公共控制端 com，接低电平，阳极作为段控制端，某段控制端为高电平时该段导通点亮。\n判断方法：将指针式万用表置于电阻测量挡。假设数码管为共阳极，把表内电源正极（黑表笔）接数码管的 com 端，再用表内电源负极（红表笔）逐个接触各段，若各段逐个点亮则为共阳极；若各段均不亮则说明是共阴极。也可将黑、红表笔交换连接后再测。若只有部分段点亮而另一部分不亮，说明数码管已损坏。"},{"ch":4,"t":"short","q":"比较 LED 数码管静态显示与动态显示的优缺点及适用场合。","a":"静态显示：每一位数码管占用一个 8 位 I/O 端口，n 位需 8n 根 I/O 线；优点是较小的电流即可获得较高亮度，占用 CPU 时间少，编程简单，便于监测和控制；缺点是占用 I/O 端口线多，硬件电路复杂、成本高，因此适合显示位数较少的场合。\n动态显示：所有数码管的段并联由一个端口控制（段选端），各位公共端由另一个端口控制（位选端），按位轮流点亮；优点是显示位数较多时可节省 I/O 端口资源、硬件电路简单；缺点是亮度低于静态显示，且 CPU 要不断运行扫描程序，占用 CPU 时间更多。动态扫描时不能有较长时间停止扫描的语句，否则显示不稳甚至无法显示，通常把扫描过程编成独立函数在需要延时处调用。"},{"ch":4,"t":"short","q":"数码管动态显示程序中，为什么在送位选码和字型码之前要先执行「P1=0xff;」关显示？若去掉该语句会怎样？","a":"关显示（对共阳极数码管送 0xFF，各段全灭）是为了在切换位选、更换字型码的瞬间不显示任何字符，避免上一位的段码残留在当前位上。若去掉关显示语句，在字符交替显示时会把上一个字符显示在下一个字符位置上很短的时间，形成拖影，导致显示效果不美观。此外，动态显示要求扫描间隔小于人眼视觉暂留时间，否则会出现闪烁、不能稳定显示。"},{"ch":4,"t":"short","q":"定义数组时应注意哪些问题？请至少写出四点。","a":"（1）数组的类型实际上是指数组元素的取值类型，同一数组所有元素的数据类型相同；（2）数组名的书写规则应符合标识符的书写规定；（3）数组名不能与其他变量名相同，否则编译出错；（4）方括号中常量表达式表示数组元素的个数（长度），如 a[5] 有 5 个元素，下标从 0 开始，为 a[0]~a[4]；（5）方括号中的常量表达式不可以是变量，但可以是符号常数或常量表达式；（6）允许在同一个类型说明中说明多个数组和多个变量，如 int a,b,c,d,k1[10],k2[20];。"},{"ch":4,"t":"prog","q":"用 6 个共阳极数码管动态显示生日「901225」：数码管段选端接 P1 口、位选端接 P2 口（位选低电平有效）。请用一维数组存放字型码，编写完整的动态显示程序。","a":"//程序：ex4_4.c\n//功能：6位数码管动态显示生日“901225”\n#include<reg51.h>                //包含头文件reg51.h，定义51单片机的专用寄存器\n#include<intrins.h>              //包含头文件intrins.h，使用了内部函数_crol_( )\nvoid delay (unsigned int i) ;    //延时函数声明\nvoid main ( )                    //主函数\n{\n    unsigned char led[]={0x90,0xc0,0xf9,0xa4,0xa4,0x92};\n                                 //设置数字901225共阳极字型码\n    unsigned char i,w;\n    while (1)\n    {\n        w=0xfe;                  //位选码初值为0xfe\n        for (i=0;i<6;i++)\n        {\n            P1=0xff;             //关显示，共阳极数码管0xff熄灭\n            P2=w;                //位选码送位选端口P2口\n            w=_crol_(w,1);       //位选码左移一位，选中下一位LED\n            P1=led[i];           //显示字型码送P1口\n            delay (100) ;        //延时\n        }\n    }\n}\nvoid delay (unsigned int i)      //延时函数参见任务1-2的ex1_1.c程序\n{\n    unsigned int k;\n    for (k=0;k<i;k++);\n}\n说明：位选码 0xfe 依次左移为 0xfd、0xfb、0xf7、0xef、0xdf，与表 4.3 中 P2 口数据一致；字型码数组依「9、0、1、2、2、5」顺序排列为 0x90、0xc0、0xf9、0xa4、0xa4、0x92；每次送码前先送 0xff 关显示以防拖影，延时 100 保证扫描频率高于视觉暂留要求。"},{"ch":4,"t":"choice","q":"74HC595 的数据输入时钟线 SCK 对应的引脚编号是（  ）。","o":["10 脚","11 脚","12 脚","13 脚"],"a":"B"},{"ch":4,"t":"choice","q":"74HC595 的输出使能端 Ḡ 为高电平时，并行输出端 QA~QH 的状态是（  ）。","o":["输出高电平","输出低电平","输出高阻","锁存原状态"],"a":"C"},{"ch":4,"t":"choice","q":"74HC595 最大的优点是（  ）。","o":["输出电流大，可直接驱动数码管","SCK 和 RCK 两个信号互相独立，输入串行移位与输出锁存互不干扰","内部带 8 个锁存器，可省去限流电阻","带清零端，可自动复位"],"a":"B"},{"ch":4,"t":"choice","q":"74HC595 的 RCK 端出现上升沿时，器件执行的操作是（  ）。","o":["移位寄存器清零","串行数据逐位移入移位寄存器","输出存储器锁存移位寄存器中的状态值","输出存储器状态保持"],"a":"C"},{"ch":4,"t":"choice","q":"LCD1602 液晶显示模块第 3 脚 VO 的功能是（  ）。","o":["地引脚（GND）","+5 V 电源引脚","液晶显示驱动电源（0~5 V），可接电位器调节对比度","背光控制正电源"],"a":"C"},{"ch":4,"t":"choice","q":"LCD1602 的 RS 引脚为低电平时，表示（  ）。","o":["选中数据寄存器，进行写数据","选中指令寄存器，读写命令/状态","进入读操作","模块片选有效"],"a":"B"},{"ch":4,"t":"choice","q":"LCD1602 读状态字时，忙标志 BF 位于状态字的（  ）。","o":["D0 位","D7 位","D6 位","任意一位"],"a":"B"},{"ch":4,"t":"choice","q":"字符型 LCD 的命令字 0x38 表示（  ）。","o":["8 位数据接口、1 行显示、5×7 点阵","8 位数据接口、2 行显示、5×7 点阵","4 位数据接口、2 行显示、5×10 点阵","8 位数据接口、2 行显示、5×10 点阵"],"a":"B"},{"ch":4,"t":"choice","q":"字符型 LCD 的命令字 0x0C 的功能是（  ）。","o":["打开显示、显示光标、光标位字符闪烁","打开显示、不显示光标、光标位字符不闪烁","关闭显示","清屏并归位"],"a":"B"},{"ch":4,"t":"choice","q":"字符型 LCD 的清屏命令字是（  ）。","o":["0x01","0x02","0x06","0x0C"],"a":"A"},{"ch":4,"t":"choice","q":"程序 ex4_10.c 的 lcd_int( ) 中，用于设置工作方式的命令字是（  ）。","o":["0x01","0x06","0x0e","0x3c"],"a":"D"},{"ch":4,"t":"choice","q":"要在 LCD1602 的第 2 行第 7 列显示字符，应先写入的定位命令字是（  ）。","o":["0x86","0xC6","0xC7","0x47"],"a":"B"},{"ch":4,"t":"choice","q":"程序 ex4_10.c 中语句 lcd_w_cmd(0x83) 的作用是（  ）。","o":["清屏","设置显示位置为第 1 行第 4 列","设置显示位置为第 2 行第 4 列","设置输入方式为增量右移"],"a":"B"},{"ch":4,"t":"choice","q":"LCD1602 设置 CGRAM 地址的命令字中，A7、A6 两位应为（  ）。","o":["00","01","10","11"],"a":"B"},{"ch":4,"t":"choice","q":"对 LCD1602 进行读数据操作时，RS 与 R/W̄ 的电平组合是（  ）。","o":["RS=0、R/W̄=0","RS=0、R/W̄=1","RS=1、R/W̄=0","RS=1、R/W̄=1"],"a":"D"},{"ch":4,"t":"choice","q":"写数据函数 lcd_w_dat( ) 与写命令函数 lcd_w_cmd( ) 的主要区别是（  ）。","o":["延时时间不同","RS 引脚的状态不同","E 端脉冲宽度不同","使用的数据口不同"],"a":"B"},{"ch":4,"t":"choice","q":"逐列扫描法识别矩阵键盘时，判断「是否有键按下」的第一步是（  ）。","o":["向所有行线输出低电平，读列线","向所有列线输出低电平，读入所有行信号","逐行送低电平，读列线","直接读 P1 口"],"a":"B"},{"ch":4,"t":"choice","q":"行列反转法中，得到某个按键扫描码的方法是（  ）。","o":["两次读值相减","两次读值相加或按位「或」运算","两次读值按位「与」运算","直接查字库得到"],"a":"B"},{"ch":4,"t":"choice","q":"某一应用系统需要扩展 10 个功能键，通常采用（  ）方式更好。","o":["独立式按键","矩阵式键盘","动态键盘","静态键盘"],"a":"B"},{"ch":4,"t":"choice","q":"程序 ex4_12.c 的密码锁中，密码输入正确时执行「P30=0;」，其含义是（  ）。","o":["关锁指示灯熄灭，继续保持锁定","开锁指示灯点亮，锁被打开","数码管显示字符 P","系统复位"],"a":"B"},{"ch":4,"t":"fill","q":"74HC595 的 8 个并行三态输出端 QA~QH 对应的引脚编号是 1、2、3、4、5、6、7 和____。","a":["15"]},{"ch":4,"t":"fill","q":"LCD1602 液晶显示模块共有____个引脚，其中数据线 DB0~DB7 占用第____脚至第____脚。","a":["16","7","14"]},{"ch":4,"t":"fill","q":"查询 LCD 忙状态的语句「i=lcd_r_start( ); i &=0x80;」中，0x80 的作用是____。","a":["屏蔽掉状态字的低 7 位，只保留最高位忙标志 BF，以便用 i 是否为 0 判断 LCD 是否忙"]},{"ch":4,"t":"fill","q":"程序 ex4_10.c 的 lcd_int( ) 依次写入 5 个命令字：0x3c、____、____、0x06、0x80，其中 0x80 用于设置初始显示位置。","a":["0x0e","0x01"]},{"ch":4,"t":"fill","q":"一般 LCD 模块所提供的 CGRAM 能够自编____个____点阵字符。","a":["8","5×8"]},{"ch":4,"t":"fill","q":"命令字 0x06（输入方式设置）中 I/D=____、S=____，表示光标以增量方式右移且显示字符不移动。","a":["1","0"]},{"ch":4,"t":"fill","q":"逐列扫描时，先向所有列线输出____电平，再读入所有行信号；若无键按下，读入的行电平全为____。","a":["低","高"]},{"ch":4,"t":"fill","q":"4×4 矩阵键盘由____根行线和____根列线组成，共有____个按键，行线通过上拉电阻接到 +5 V 电源上。","a":["4","4","16"]},{"ch":4,"t":"fill","q":"矩阵键盘中键值与行号、列号的关系为：键值=____；若某键位于第 3 行第 3 列（行号 2、列号 2），则其键值为____。","a":["行号×4+列号","10"]},{"ch":4,"t":"fill","q":"____显示方式编程较简单，但占用 I/O 口线多，一般适用于显示位数较少的场合。","a":["静态"]},{"ch":4,"t":"fill","q":"程序 ex4_12.c 的共阳极段码表中，数字 1 的段码是 0x____，数字 8 的段码是 0x____，字符 E 的段码是 0x____。","a":["f9","80","86"]},{"ch":4,"t":"fill","q":"思考与练习题 4.2（1）：图 4.26 中 P1 口接一位共阳极数码管循环显示 0~9，程序中「P1=______;」的空应填____。","a":["led[k]"]},{"ch":4,"t":"judge","q":"LCD1602 的 RS=0 表示选中数据寄存器，可以进行写数据操作。","a":false},{"ch":4,"t":"judge","q":"LCD1602 第 1 行与第 2 行的 DDRAM 地址是连续的。","a":false},{"ch":4,"t":"judge","q":"当读回的忙标志 BF=0 时，才可以进行写命令、写数据和读数据操作。","a":true},{"ch":4,"t":"judge","q":"74HC595 的 QA~QH 是 8 位并行三态输出端，可输出高电平、低电平和高阻三种状态。","a":true},{"ch":4,"t":"judge","q":"行列反转法是把两次读入的行值和列值进行相加或按位「或」运算，得到按键的扫描码。","a":true},{"ch":4,"t":"judge","q":"采用独立式按键接口时，每个按键必须占用一根 I/O 端口线，按键的工作不会影响其他 I/O 端口线的状态。","a":true},{"ch":4,"t":"judge","q":"系统中按键数量较多时，采用独立式按键接口比采用矩阵式键盘更节省 I/O 端口。","a":false},{"ch":4,"t":"judge","q":"逐列扫描时只要读入行线 2 为低电平，就可以断定一定是 S10 键被按下。","a":false},{"ch":4,"t":"judge","q":"P0 口低四位作输入口使用前，应先向 P0 口输出全 1（即 P0=0xff）。","a":true},{"ch":4,"t":"judge","q":"语句「char s[5]=\"abcdef\";」是正确的字符数组初始化。","a":false},{"ch":4,"t":"term","q":"名词解释：忙标志 BF。","a":"LCD1602 读状态操作时读回的状态字最高位 D7 即为忙标志 BF。BF=1 表示 LCD 正在进行内部操作（忙），此时不能进行写命令、写数据、读数据等其他三类操作；BF=0 表示 LCD 内部操作已经结束（不忙），可以进行其他三类操作。程序一般采用查询方式，读状态后与 0x80 相「与」屏蔽低 7 位，若结果非 0 则继续查询等待。"},{"ch":4,"t":"term","q":"名词解释：逐列扫描法。","a":"逐列扫描法是识别矩阵键盘按键的常用方法。首先向所有列线输出低电平，再读入所有行信号：若有键按下，被按下键所在的行线与低电平列线导通，该行电平被拉低，读入的行电平不全为高；若无键按下，行电平全为高。然后逐列送低电平（其余列为高），依次读入行电平，判断该列上 4 个按键的状态，从而确定闭合键的行号和列号，再按「键值=行号×4+列号」得到键值。程序 ex4_12.c 的 scan_key( ) 即采用此法。"},{"ch":4,"t":"term","q":"名词解释：行列反转法。","a":"行列反转法是通过给行、列端口输出两次相反的值，再将分别读入的行值和列值进行求和或按位「或」运算，得到每个键的扫描码，进而查表求得键值的矩阵键盘识别方法。具体做法：先向所有列线输出低电平、行线输出高电平，读入行值并记录；再向所有列线输出高电平、行线输出低电平（即行列反转），读入列值并记录；最后把两次读值相「或」得到 8 位扫描码，用查表法得出键值。程序 ex4_13.c 的 keyscan( ) 即采用此法。"},{"ch":4,"t":"short","q":"简述 LCD1602 初始化操作的主要任务和初始化流程，并写出各步骤使用的命令字。","a":"LCD 上电时必须按一定时序进行初始化，主要任务是设置 LCD 的工作方式、显示状态、清屏、输入方式和光标位置。流程（图 4.18）为：①工作方式设置，命令字 0x38（00111000B）或程序 ex4_10.c 中的 0x3c，设置 8 位数据接口、2 行显示、5×7 点阵；②显示状态设置，0x0C（00001100B）或 0x0e，打开显示、光标不显示（0x0e 为显示光标）、字符不闪烁；③清屏，0x01，同时把光标置第 1 行第 1 列；④输入方式设置，0x06（00000110B），光标增量方式右移、显示不移动；⑤设置初始显示位置，0x80，光标定位到第 1 行第 1 列。以上均由写命令函数 lcd_w_cmd( ) 完成，每条命令前先读状态查忙标志 BF。"},{"ch":4,"t":"short","q":"用扫描法识别矩阵键盘按键的编程一般应包括哪些内容？","a":"一般包括 5 项内容：（1）判别有无键按下；（2）键盘扫描取得闭合键的行、列号；（3）用计算法或查表法得到键值；（4）判断闭合键是否释放，如没释放则继续等待；（5）将闭合键的键值保存，同时转去执行该闭合键的功能。此外实际编程还需在判别有键后延时（如 delay(1200)）消除按键抖动后再复读确认。"},{"ch":4,"t":"short","q":"在 LCD1602 的指定位置显示一个字符需要哪两个步骤？分别属于哪种操作、RS 处于什么状态？","a":"需要两个步骤：①进行光标定位，写入光标位置命令字，属于写命令操作，此时 RS=0、R/W̄=0，E 端产生一个脉冲；位置命令字为 0x80+列偏移（第 2 行为 0xC0+列偏移），如第 2 行第 7 列写 0xC6。②写入要显示字符的 ASCII 码，属于写数据操作，此时 RS=1、R/W̄=0，E 端产生一个脉冲，如 lcd_w_dat(0x41) 或 lcd_w_dat('A')。两步操作前都必须先读状态字查询忙标志 BF，BF=0 时才可执行。"},{"ch":4,"t":"prog","q":"写出 LCD1602 的写命令字函数 lcd_w_cmd（要求含忙标志查询），并说明各控制端的时序安排。","a":"void lcd_w_cmd (unsigned char com)\n{\n    unsigned char i;\n    do {\n        i = lcd_r_start ( );      //查LCD忙操作\n        i &= 0x80;                //屏蔽低7位，只留BF\n        delay (2);\n    } while (i != 0);             //LCD忙则继续查询，否则退出\n    RW = 0;  delay1 ( );\n    RS = 0;  delay1 ( );          //RW=0、RS=0，写LCD命令字\n    E = 1;   delay1 ( );          //E端产生脉冲\n    P1 = com; delay1 ( );         //将命令字写入LCD数据口\n    E = 0;   delay1 ( );\n    RW = 1;\n    delay (255);\n}\n\n说明：写操作时使能信号 E 的下降沿有效，因此软件上先设置 RS、R/W̄ 状态，再送数据，然后产生 E 信号的脉冲，最后复位 RS 和 R/W̄；每条语句后加延时以满足 LCD 读写时序。"},{"ch":4,"t":"prog","q":"编写 4×4 矩阵键盘逐列扫描函数 scan_key( )，要求返回键值 0~15，无键按下时返回 -1（列线由 P2 口控制，行线由 P0 口低四位读入）。","a":"char scan_key ( )\n{\n    char i,temp,m,n;\n    bit find=0;                 //有键按下标志位\n    P2=0xf0;                    //向所有列线输出低电平\n    i=P0;                       //读入行值\n    i &= 0x0f;                  //屏蔽掉高四位\n    if (i != 0x0f)              //行值不全为1，有键按下\n    {   delay (1200);            //延时消抖\n        i=P0;  i &= 0x0f;       //再次读入行值并屏蔽高四位\n        if (i != 0x0f)          //第二次判断有键按下\n        {   for (i=0;i<4;i++)   //逐列送出低电平\n            {   P2=0xfe<<i;\n                temp=~P0;       //读行值并取反，全1变全0\n                temp=temp & 0x0f;   //屏蔽行值高4位\n                if (temp != 0x00)\n                {   m=i;        //保存列号至m\n                    find=1;     //置找到按键标志\n                    switch (temp)\n                    { case 0x01:n=0;break;   //第0行有键按下\n                      case 0x02:n=1;break;   //第1行有键按下\n                      case 0x04:n=2;break;   //第2行有键按下\n                      case 0x08:n=3;break;   //第3行有键按下\n                      default:break; }\n                    break; }    //有键按下，退出for循环\n            }\n        }\n    }\n    if (find==0) return -1;     //无键按下返回-1\n    else return (n*4+m);        //否则返回键值，键值=行号*4+列号\n}\n\n说明：P2=0xf0 时列线全为低、P0 低四位作输入口（调用前须先 P0=0xff）；P2=0xfe<<i 实现逐列拉低；temp=~P0 取反后为 1 的位即闭合键所在行，由此得到行号 n，与列号 m 组合成键值。"},{"ch":5,"t":"choice","q":"51 单片机的定时/计数器由（  ）四部分组成。","o":["T0、T1、工作方式寄存器 TMOD、控制寄存器 TCON","TH0、TL0、TH1、TL1","TMOD、TCON、IE、IP","T0、T1、SCON、PCON"],"a":"A"},{"ch":5,"t":"choice","q":"51 单片机定时/计数器在工作方式 1 下，计数器的位数和最大计数值分别是（  ）。","o":["13 位，8 192","16 位，65 536","8 位，256","16 位，8 192"],"a":"B"},{"ch":5,"t":"choice","q":"TMOD 中 M1 M0=1 0 时，所选的工作方式是（  ）。","o":["方式 0，13 位计数器","方式 1，16 位计数器","方式 2，初值自动重载 8 位计数器","方式 3，T0 分成两个 8 位计数器"],"a":"C"},{"ch":5,"t":"choice","q":"51 单片机的定时器 T1 用做定时方式、采用工作方式 1 时，工作方式控制字为（  ）。","o":["0x01","0x05","0x10","0x50"],"a":"C"},{"ch":5,"t":"choice","q":"51 单片机的定时器 T0 用做计数方式、采用工作方式 1 时，工作方式控制字为（  ）。","o":["0x01","0x05","0x50","0x60"],"a":"B"},{"ch":5,"t":"choice","q":"TMOD 中门控位 GATE=0 时，定时器的启动方式是（  ）。","o":["软件启动方式，将 TR0 或 TR1 置 1 即可启动","硬软件共同启动方式，TR 置 1 且 INT 为高电平才启动","硬件启动方式，由外部中断引脚自动启动","上电后自动启动，不需要任何控制位"],"a":"A"},{"ch":5,"t":"choice","q":"TMOD 中 C/T̄=1 时，定时/计数器的工作状态是（  ）。","o":["定时方式，对内部机器周期脉冲计数","停止工作","由外部中断引脚 INT0、INT1 的电平控制计数","计数方式，对 T0（P3.4）或 T1（P3.5）输入的外部脉冲下降沿计数"],"a":"D"},{"ch":5,"t":"choice","q":"启动 T0 开始计数，应使 TCON 的（  ）。","o":["TF0 位置 1","TR0 位置 1","TR0 位清 0","TR1 位清 0"],"a":"B"},{"ch":5,"t":"choice","q":"晶振频率为 12 MHz 时，定时/计数器在工作方式 1 下能实现的最长定时时间为（  ）。","o":["8.192 ms","65.536 ms","256 μs","131.072 ms"],"a":"B"},{"ch":5,"t":"choice","q":"12 MHz 晶振、定时器工作方式 1 下定时 50 ms，应设置的计数初值为（  ）。","o":["15 536","50 000","3 192","6"],"a":"A"},{"ch":5,"t":"choice","q":"12 MHz 晶振、定时器采用工作方式 0 定时 5 ms，计数初值应为（  ）。","o":["5 000","3 192","15 536","8 192"],"a":"B"},{"ch":5,"t":"choice","q":"12 MHz 晶振、定时器采用工作方式 2 定时 250 μs，计数初值应为（  ）。","o":["250","6","256","8 192"],"a":"B"},{"ch":5,"t":"choice","q":"关于工作方式寄存器 TMOD，下列说法正确的是（  ）。","o":["TMOD 可以位寻址，可用 TR1=1 形式操作","TMOD 不能位寻址，只能用字节操作设置工作方式","TMOD 的高 4 位控制 T0，低 4 位控制 T1","系统复位后 TMOD 各位均为 1"],"a":"B"},{"ch":5,"t":"choice","q":"51 单片机中断系统所具有的中断源个数是（  ）。","o":["3 个","4 个","5 个","8 个"],"a":"C"},{"ch":5,"t":"choice","q":"定时器 T1 溢出中断所对应的中断类型号是（  ）。","o":["0","1","2","3"],"a":"D"},{"ch":5,"t":"choice","q":"当 CPU 响应定时器 T1 的中断请求后，程序计数器 PC 的内容是（  ）。","o":["0x0003","0x000B","0x0013","0x001B"],"a":"D"},{"ch":5,"t":"choice","q":"执行语句 IE=0x88; 后，被开放的中断是（  ）。","o":["总中断允许和定时器 T1 中断","总中断允许和定时器 T0 中断","总中断允许和外部中断 0","总中断允许和串行口中断"],"a":"A"},{"ch":5,"t":"choice","q":"系统复位后，中断优先级寄存器 IP 的状态是（  ）。","o":["低 5 位全部清零，所有中断源均为低优先级","低 5 位全部置 1，所有中断源均为高优先级","只有外部中断 0 为高优先级","只有串行口为高优先级"],"a":"A"},{"ch":5,"t":"choice","q":"51 单片机 CPU 关中断的语句是（  ）。","o":["EA=1;","ES=1;","EA=0;","EX0=1;"],"a":"C"},{"ch":5,"t":"choice","q":"51 单片机在同一级别里除串行口外，级别最低的中断源是（  ）。","o":["外部中断 1","定时器 T0","定时器 T1","串行口"],"a":"C"},{"ch":5,"t":"choice","q":"TCON 中 IT0=1 时，外部中断 0 的触发方式为（  ）。","o":["电平触发方式，低电平有效","边沿（下降沿）触发方式","上升沿触发方式","不能触发，处于屏蔽状态"],"a":"B"},{"ch":5,"t":"choice","q":"若系统中只有一个中断源且中断请求不被阻断，最短的中断响应时间是（  ）。","o":["1 个机器周期","2 个机器周期","3 个机器周期","8 个机器周期"],"a":"C"},{"ch":5,"t":"choice","q":"C51 中断函数定义 void 函数名( ) interrupt n 中，n 表示（  ）。","o":["中断的优先级别","中断类型号","中断服务程序的行号","使用的工作寄存器组号"],"a":"B"},{"ch":5,"t":"choice","q":"交通灯控制程序中执行 P1=0xdb; 后，A、B 两个方向的交通灯状态是（  ）。","o":["A 方向绿灯亮、B 方向红灯亮","A 方向红灯亮、B 方向绿灯亮","两个方向都是红灯（紧急情况）","两个方向都是绿灯"],"a":"C"},{"ch":5,"t":"fill","q":"51 单片机内部有____个 16 位的可编程定时/计数器，称为____和____，它们均为____计数器。","a":["2","T0","T1","加法"]},{"ch":5,"t":"fill","q":"定时/计数器的初值计算公式为 X初值=____−T定时时间/T机器周期；若最大计数值为 M，则 n 位计数器的 M=____。","a":["M","2ⁿ"]},{"ch":5,"t":"fill","q":"工作方式 0 为____位定时/计数器，M=____，初值设置为 THi=X初值/____、TLi=X初值%32；工作方式 2 为____位，初值设置为 THi=TLi=X初值。","a":["13","8 192","32","8"]},{"ch":5,"t":"fill","q":"控制寄存器 TCON 的 8 位从 D7 到 D0 依次为____、____、____、____、IE1、IT1、IE0、IT0。","a":["TF1","TR1","TF0","TR0"]},{"ch":5,"t":"fill","q":"工作方式寄存器 TMOD 中，D7~D4 依次为 GATE、____、M1、M0，用于定义____；D3~D0 含义相同，用于定义____。","a":["C/T̄","T1","T0"]},{"ch":5,"t":"fill","q":"51 单片机的中断源有____、____、____、____、____共 5 个。","a":["外部中断 0（INT0）","外部中断 1（INT1）","T0 溢出中断（TF0）","T1 溢出中断（TF1）","串行口中断（RI 或 TI）"]},{"ch":5,"t":"fill","q":"外部中断 0 的中断类型号为____，入口地址为____；串行口的中断类型号为____，入口地址为____。","a":["0","0x0003","4","0x0023"]},{"ch":5,"t":"fill","q":"CPU 响应中断的条件是：①____；②中断总允许位____置 1；③申请中断的中断源____位置 1。","a":["有中断源发出中断请求","EA","允许"]},{"ch":5,"t":"fill","q":"51 单片机同级中断源的自然优先级从高到低依次为：____、____、____、____、____。","a":["外部中断 0","定时器 T0 中断","外部中断 1","定时器 T1 中断","串行口中断"]},{"ch":5,"t":"fill","q":"中断允许寄存器 IE 的 D7~D0 依次为____、×、×、ES、____、EX1、____、EX0，其地址为____。","a":["EA","ET1","ET0","0xA8"]},{"ch":5,"t":"fill","q":"对 T0、T1 溢出中断和边沿触发的外部中断，CPU 响应中断后由____自动清除中断标志位；对串行口中断，必须在中断服务程序中用____清除 TI 或 RI。","a":["硬件","软件"]},{"ch":5,"t":"fill","q":"只有____可以设置为工作方式 3，方式 3 时它被分解成两个独立的 8 位计数器____和____；另一个定时器 T1 此时只能用作____或不需要中断的场合。","a":["T0","TL0","TH0","串行口波特率发生器"]},{"ch":5,"t":"fill","q":"晶振频率为 6 MHz 时，T机器周期=____μs；工作方式 1 下的最短定时时间为____μs，最长定时时间为____ms。","a":["2","2","131.072"]},{"ch":5,"t":"fill","q":"任务 5-1 中设置 T1 为软件启动、定时功能、工作方式 1，则 TMOD=____；开放 T1 中断并开总允许的语句是 ET1=1; 和____；启动 T1 计数的语句是____。","a":["0x10","EA=1;","TR1=1;"]},{"ch":5,"t":"fill","q":"编写中断函数时应遵循的规则：不能进行____；无____；任何情况下不能____中断函数；可用 using 指令指定所使用的____，m 取值为 0、1、2、3。","a":["参数传递","返回值","直接调用","寄存器组"]},{"ch":5,"t":"judge","q":"51 单片机内部的 T0 和 T1 都是 16 位加法计数器，分别由两个 8 位专用寄存器组成。","a":true},{"ch":5,"t":"judge","q":"工作方式 2 是初值自动重载的 8 位计数器，适合用于较精确的定时场合。","a":true},{"ch":5,"t":"judge","q":"工作方式 0 与工作方式 1 在计数溢出后计数器会自动重装初值，因此不需要在程序中重新设置初值。","a":false},{"ch":5,"t":"judge","q":"TMOD 可以按位寻址，因此可以用 TMOD.0=1 的形式设置定时器的工作方式。","a":false},{"ch":5,"t":"judge","q":"T1 也可以设置为工作方式 3，此时 T1 分成两个独立的 8 位计数器正常工作。","a":false},{"ch":5,"t":"judge","q":"51 单片机的 5 个中断源都是可屏蔽中断，可用 IE 寄存器控制其开放或屏蔽。","a":true},{"ch":5,"t":"judge","q":"串行口中断响应后，其请求标志位 TI 或 RI 由硬件自动清除，不需要软件干预。","a":false},{"ch":5,"t":"judge","q":"同一优先级别的多个中断源同时申请中断时，按自然优先级顺序响应。","a":true},{"ch":5,"t":"judge","q":"中断函数可以带形式参数，也可以有返回值，用法与普通函数完全相同。","a":false},{"ch":5,"t":"judge","q":"中断函数不能由程序直接调用，因为直接调用时硬件上没有中断请求存在，执行结果不确定。","a":true},{"ch":5,"t":"judge","q":"GATE=1 时，除 TR0 或 TR1 需置 1 外，还需 INT0（P3.2）或 INT1（P3.3）为高电平才能启动相应定时器。","a":true},{"ch":5,"t":"judge","q":"在图 5.5 交通灯电路中，P1 口输出高电平时对应的交通灯点亮，输出低电平时熄灭。","a":false},{"ch":5,"t":"term","q":"名词解释：中断。","a":"中断指通过硬件来改变 CPU 的运行方向。计算机在执行程序的过程中，外部设备向 CPU 发出中断请求信号，要求 CPU 暂时中断当前程序的执行而转去执行相应的处理程序，待处理程序执行完毕后，再继续执行原来被中断的程序。这种程序在执行过程中由于外界的原因而被中间打断的情况称为中断。"},{"ch":5,"t":"term","q":"名词解释：中断源、断点。","a":"中断源：引起中断的原因，或能发出中断申请的来源，称为中断源。例如任务 5-1 中的中断源是定时器 T1，其计数溢出时向 CPU 申请中断。断点：主程序被断开的位置（或地址）称为断点。"},{"ch":5,"t":"term","q":"名词解释：计数器溢出（计数器翻转）。","a":"当 S₁ 闭合时，计数器从计数初值开始，对计数脉冲进行加 1 或减 1 计数，当加法计数器计到最大值、或减法计数器计到最小值时，计数器产生溢出，将相应的溢出标志位 TF 置 1。计数器溢出也称为计数器翻转。对 8 位计数器而言，计数值从 255 再加 1 时计数值变为 0，即产生一次溢出。"},{"ch":5,"t":"short","q":"51 单片机定时/计数器的定时功能和计数功能有什么不同？分别应用在什么场合？","a":"定时功能时，计数脉冲来自内部时钟信号（对内部机器周期脉冲计数），由于机器周期是固定值，计数值确定时定时时间也随之确定，用于产生确定的时间间隔，如定时采样、延时、秒表与交通灯定时。计数功能时，计数脉冲来自外部信号引脚（T0 用 P3.4、T1 用 P3.5），外部脉冲的下降沿触发计数，每输入一个脉冲加法计数器加 1，用于统计外部事件的个数，如产品计数、转速测量、脉冲个数统计。两者的区别由 TMOD 中的 C/T̄ 位选择：C/T̄=0 为定时，C/T̄=1 为计数。对计数功能，外部输入信号的高电平与低电平持续时间都必须在一个机器周期以上。"},{"ch":5,"t":"short","q":"CPU 响应中断的条件是什么？有哪几种情况会阻断中断响应？","a":"响应条件有 3 条：①有中断源发出中断请求；②中断总允许位 EA 置 1；③申请中断的中断源允许位置 1。阻断情况有 3 种：①CPU 正在响应同级或更高优先级的中断；②当前指令未执行完；③正在执行中断返回指令（RETI）或访问寄存器 IE 和 IP。若存在任何一种阻断情况，中断查询结果即被取消，CPU 不响应中断请求，而在下一机器周期继续查询；否则 CPU 在下一机器周期响应中断。"},{"ch":5,"t":"short","q":"51 单片机定时/计数器四种工作方式各有什么特点？如何进行选择和设定？","a":"方式 0：13 位定时/计数器，由 THi 高 8 位与 TLi 低 5 位组成，M=8 192，初值不可自动重载。方式 1：16 位定时/计数器，由 THi 高 8 位与 TLi 低 8 位组成，M=65 536，初值不可自动重载，定时范围最大。方式 2：初值自动重载的 8 位计数器，TLi 计数、THi 保存初值，溢出后 THi 的值自动装入 TLi，M=256，适合较精确的定时或串行口波特率发生器。方式 3：只有 T0 可设置，T0 被拆成两个独立 8 位计数器，TL0 占用 T0 的控制位、引脚和中断源，可定时也可计数；TH0 占用 TR1、TF1 和 T1 中断源，只能对机器周期计数。选择与设定：由 TMOD 中的 M1、M0 两位选择工作方式，由 C/T̄ 选择定时或计数，由 GATE 选择启动方式；TMOD 不能位寻址，只能整字节写入，高 4 位定义 T1、低 4 位定义 T0，例如 T1 定时方式 1 写 TMOD=0x10。"},{"ch":5,"t":"short","q":"外部中断有哪两种触发方式？如何选择和设定？","a":"外部中断有电平触发方式和边沿（下降沿）触发方式两种。选择与设定由 TCON 中的 IT0、IT1 位决定：IT0（TCON.0）控制外部中断 0、IT1（TCON.2）控制外部中断 1；当 ITx=0 时为电平触发方式（低电平有效），当 ITx=1 时为边沿（下降沿）触发方式。例如交通灯程序中用 IT0=1、IT1=1 把 S₁、S₂ 两个按键设为下降沿触发。两种方式的中断请求撤除方法不同：边沿触发的外部中断，CPU 响应后由硬件自动清除 IE0、IE1；电平触发的外部中断撤除方法较复杂，一般采用硬件和软件相结合的方式。另外，外部中断请求标志 IE0、IE1 由硬件在引脚信号有效时自动置位。"},{"ch":5,"t":"prog","q":"用定时器 T1 的工作方式 1 和中断方式编写程序，用两个静态连接的共阳极数码管（段码分别接 P1、P2 口）显示 00~99 的简易秒表，时间间隔为 1 s，晶振为 12 MHz，并说明 1 s 是如何实现的。","a":"//程序：ex5_1.c  00~99 秒简易秒表，定时器 T1 中断方式\n#include \"reg51.h\"\nunsigned char count=0;        //对 50 ms 定时时间进行计数\nunsigned char miao=0;         //秒计数器\nvoid timer_1( ) interrupt 3   //T1 的中断类型号为 3\n{\n    TH1 = ( 65536-50000 ) /256;   //重新设置 T1 计数初值高 8 位\n    TL1 = ( 65536-50000 ) %256;   //重新设置 T1 计数初值低 8 位\n    count++;                      //50 ms 计数器加 1\n    if ( count==20 )              //1 s 时间到\n    {\n        count=0;                  //50 ms 计数器清 0\n        miao++;                   //秒计数器加 1\n        if ( miao==100 ) miao=0;  //计到 100 则回 0\n    }\n}\nvoid disp ( unsigned char i )\n{\n    unsigned char led[]={0xc0,0xf9,0xa4,0xb0,0x99,0x92,0x82,0xf8,0x80,0x90};  //共阳极 0~9 段码\n    P1=led[i/10];       //显示高位\n    P2=led[i%10];       //显示低位\n}\nvoid main ( )\n{\n    TMOD=0x10;                       //设置 T1 为工作方式 1\n    TH1= ( 65536-50000 ) /256;       //初值高 8 位，定时 50 ms\n    TL1= ( 65536-50000 ) %256;       //初值低 8 位\n    ET1=1;                           //开放 T1 中断允许\n    EA=1;                            //开放总中断允许\n    TR1=1;                           //启动 T1 开始计数\n    while ( 1 ) { disp ( miao ) ; }  //显示秒计数器值\n}\n1 s 的实现：12 MHz 晶振时机器周期为 1 μs，方式 1 定时 50 ms 的初值 X=65 536−50 000=15 536（TH1=0x3C、TL1=0xB0）；每次溢出进入中断后重装初值并使 count 加 1，count 计到 20 即 20×50 ms=1 s，此时秒计数器 miao 加 1，实现 00~99 秒计数，计到 100 回 0。"},{"ch":5,"t":"prog","q":"用定时器 T0 的工作方式 1 编写程序，使接在 P1 口的 8 个发光二极管实现时间间隔为 1 s 的流水灯控制（每次只有一个灯点亮，低电平点亮），晶振 12 MHz。","a":"//流水灯：T0 方式1 定时 50 ms，查询方式累计 20 次实现 1 s\n#include \"reg51.h\"\nvoid delay1s ( )\n{\n    unsigned char i;\n    for ( i=0;i<20;i++ )          //20 × 50 ms = 1 s\n    {\n        TH0= ( 65536-50000 ) /256;   //T0 初值高 8 位\n        TL0= ( 65536-50000 ) %256;   //T0 初值低 8 位\n        TR0=1;                       //启动 T0\n        while ( !TF0 ) ;             //查询是否溢出（50 ms 到）\n        TF0=0;                       //查询方式下必须由软件清零\n    }\n}\nvoid main ( )\n{\n    unsigned char led=0xfe;       //1111 1110B，最低位灯亮\n    TMOD=0x01;                    //T0 为工作方式 1\n    while ( 1 )\n    {\n        P1=led;                   //输出当前状态\n        delay1s ( ) ;             //间隔 1 s\n        led= ( led<<1 ) | 0x01;   //左移一位，末位补 1（熄灭）\n        if ( led==0xff ) led=0xfe; //8 个灯轮完一遍后重新开始\n    }\n}\n要点：TMOD=0x01 表示 T0 软件启动、定时、方式 1；初值 X=65 536−50 000=15 536；用 while(!TF0) 查询溢出，查询方式下 TF0 必须由软件清零；P1 口输出低电平点亮对应 LED，0xFE→0xFD→0xFB…→0x7F 依次左移即形成流水效果。"}];
;
/* ================= 理论纸质试卷：从理论题库抽题，按学校试卷模板排成 A3 横向两栏，出 PDF（打印另存）和 Word =================
   排版参照《广州华夏职业学院试卷模板》：标题两行、专业/年级/考试方式/时间表、题号得分表、每大题前“得分”小方框、
   正面左侧装订线（学院、班级、姓名、学号、座位号，命题人、审核人，密封线），反面右侧只有密封线；正文宋体五号、行距固定 18 磅。 */
'use strict';
const PAPER_TYPES={
  choice:{name:'单项选择题',unit:'每题',per:'题'},
  fill:{name:'填空题',unit:'每空',per:'空'},
  judge:{name:'判断题',unit:'每题',per:'题'},
  term:{name:'名词解释',unit:'每题',per:'题'},
  short:{name:'简答题',unit:'每题',per:'题'},
  prog:{name:'程序分析题',unit:'每题',per:'题'}
};
const CN_NUM='一二三四五六七八九十';
const PAPER_DEFAULT={
  year:'2026-2027',term:'第一学期',course:'单片机技术及应用',ver:'A',major:'机电一体化技术',grade:'2025级',mode:'闭卷',minutes:90,
  key:'',space:'auto',weights:{1:20,2:20,3:25,4:25,5:10},
  sections:[{t:'choice',n:15,pts:2},{t:'fill',n:10,pts:1},{t:'judge',n:10,pts:1},{t:'term',n:3,pts:4},{t:'short',n:3,pts:6},{t:'prog',n:2,pts:10}]
};
const blanksOf=q=>q.t==='fill'?(q.q.match(/____/g)||[]).length:1;

/* ================= 选择题选项归一（2026-11-09） =================
   用户原话：「电气接线的理论考试选择题选项都报错了 没有正常的」。
   真因不是网络也不是权限，是三处代码对「选项长什么样」的约定不一致：
     · 内置单片机题库（考试/theory.cjs:15）        o: ['常开触点','常闭触点',…]        纯字符串数组
     · 资料库工具 AI 出题（资料库工具/src/ui-mat.js 的 MAT_toDb，写进 hx_exam_qbank.o）
                                                    o: [{key:'A',text:'常开触点'},…]
     · AI 直出 / 手改过的老数据（normalizeQuestions 之前兜过的）
                                                    [{k,v}] / [{label,value}] / [{id,content}] / {A:'文本'}
   理论试卷（本文件 optHTML、docxItems；ui-paper.js 的 fullHTML、搜索）只认第一种：
   Math.max(...o.map(x=>x.length)) 拿到 undefined 是 NaN，模板里又直接 String(对象)，
   卷面就成了「A.[object Object] B.[object Object] …」四行 —— 用户看到的「全报错」。
   电子考试（app.js eQuestionHTML）认 {key,text}，但题库题型叫 choice/judge
   （见 考试/supabase/2026-11-08-科目-资料库-题库.sql 的 check），它只认 single/multiple/judgment，
   于是选择题掉进「非选择题」分支，被画成一个空白大题框。
   ── 这一轮怎么修 ──
   不追着改数据库（越改越容易二次错位），只在渲染这一层归一：
   不管上游给的是字符串、对象数组还是 {A:文本} 的映射，统一产出 [{key:'A', text:'…'}]。
   · 缺 key 的按**原下标**补字母（不能按「过滤后」重排，否则答案里写的 A/B/C 会对不上）；
   · 文字取第一个非空字符串字段，数字自动转字符串；
   · 一条文字都取不到的空选项直接丢掉，不画空的「A.」。
   ⚠ 给上游的备注（本轮不改，改库有风险）：资料库工具最好只写 {key,text} 一种形状，
   并且单选也存 t='single' 而不是 'choice'；现在全靠这里兼容。 */
const OPT_KEY_FIELDS = ['key', 'k', 'letter', 'optKey'];
/* value 放最后：{label:'A', value:'文本'} 里 label 是 key、value 才是正文 */
const OPT_TEXT_FIELDS = ['text', 'v', 'content', 'title', 'desc', 'option', 'label', 'name', 'value'];
const OPT_KEY_RE = /^[A-Za-z]$/;   // 单个字母才算 key（A~D 选项、判断题的 T/F 都覆盖）
const optStr = v => {
  if (v == null) return '';
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return v.map(optStr).filter(Boolean).join(' ');
  return '';
};
const optClean = s => String(s || '')
  .replace(/\s+/g, ' ')
  .replace(/^[A-Za-z][.、:：)）]\s*/, '')   // 文字自带「A. 」前缀时去掉（key 由字段/下标决定）
  .trim();
const optLetter = i => i < 26 ? String.fromCharCode(65 + i) : 'A' + (i - 25);
function hxChoices(raw) {
  /* o 也可能是 JSON 字符串（有人把 jsonb 列当 text 手改过） */
  if (typeof raw === 'string') {
    const s = raw.trim();
    if (!s || (s[0] !== '[' && s[0] !== '{')) return [];
    try { raw = JSON.parse(s); } catch (e) { return []; }
  }
  let list;
  if (Array.isArray(raw)) list = raw.map((x, i) => [null, x, i]);
  else if (raw && typeof raw === 'object') list = Object.keys(raw).map((k, i) => [k, raw[k], i]);
  else return [];
  const out = [];
  list.forEach(([mapKey, item, i]) => {
    const letter = optLetter(i);
    let key = mapKey ? String(mapKey).trim() : '';
    let text = '';
    if (item && typeof item === 'object' && !Array.isArray(item)) {
      /* 1) 明确叫 key / k / letter 的字段 */
      if (!key) { const f = OPT_KEY_FIELDS.find(x => OPT_KEY_RE.test(optStr(item[x]))); key = f ? optStr(item[f]) : ''; }
      /* 2) label / id / option 既可能是 key 也可能是正文：短得像单个字母才当 key */
      if (!key) { const f = ['label', 'id', 'option'].find(x => OPT_KEY_RE.test(optStr(item[x]))); key = f ? optStr(item[f]) : ''; }
      /* 3) 正文：按优先级取第一个非空、且不等于 key 的字符串 */
      for (const f of OPT_TEXT_FIELDS) {
        const v = optClean(optStr(item[f]));
        if (!v || v === key) continue;
        text = v; break;
      }
      /* 4) 兜底：{A:'文本'} 这种只有一个键的对象，键名当 key、值当正文 */
      if (!text) {
        const ks = Object.keys(item);
        if (ks.length === 1) {
          const v = optClean(optStr(item[ks[0]]));
          if (v && v !== key) { if (!key && OPT_KEY_RE.test(ks[0])) key = ks[0]; text = v; }
        }
      }
    } else {
      text = optClean(optStr(item));
    }
    key = OPT_KEY_RE.test(key) ? key.toUpperCase() : '';
    if (!text) return;                       // 空选项不渲染，免得卷面出现一行孤零零的「C.」
    out.push({ key: key || letter, text });
  });
  return out;
}

/* 小问（sub）归一（2026-11-09，和选项同一个毛病）：
   hx_exam_qbank.sub 是 jsonb，没有类型约束。AI 导入时把「第一问；第二问」整段存成一个字符串
   完全合法，而下游直接 q.sub.map / q.sub.length / q.sub[k] —— 字符串会被逐字符拆成几十个小问，
   为 null 时则直接 TypeError 打断整页渲染（用户看到的就是「全都报错了」）。
   统一成字符串数组，渲染处只管用。 */
function hxSubs(v) {
  return (Array.isArray(v) ? v : (v == null || v === '' ? [] : [v]))
    .map(x => String(x == null ? '' : x).trim()).filter(Boolean);
}

/* ================= 题池（2026-11-08 第二轮：理论试卷接 AI 题库） =================
   非 mcu 科目的题来自云端 hx_exam_qbank（AI 题库页 / 资料库页出的题），
   app.js 的理论试卷入口拉完题后调 __examSetPool 挂进来；mcu 永远走内置 THEORY，行为零变化。
   POOL_CH 按题库里实际出现的章节建：ch 为 null 的题归 0（「未分章」）。 */
let POOL=null, POOL_CH=null, POOL_KN=null;
const curPool=()=>POOL||THEORY;
const curCH=()=>POOL_CH||THEORY_CH;
const curKN=()=>POOL_KN||null;
/* 章节显示名：mcu 保持「项目1」（和试卷库老存档一致），AI 题库用建池时给的名字（「第1章」「未分章」） */
const chLabel=c=>POOL?(curCH()[c]||('第'+c+'章')):('项目'+c);
/* 知识点维度（2026-11-13）：题库 hx_exam_qbank 多了 knowledge 可空列，非 mcu 科目抽题时可按知识点筛。
   建池时把每题 knowledge 去重成 POOL_KN 列表；mcu 走内置 THEORY，没有这个维度，POOL_KN 恒 null，行为零变化。 */
const knVal=q=>String(q&&q.knowledge==null?'':q.knowledge).trim();
window.__examSetPool=(items,ch)=>{
  POOL=items||null;POOL_CH=ch||null;
  if(items){
    items.forEach((q,i)=>{q._k='Q'+q.id;q._i=i;});
    const kn=new Set();
    items.forEach(q=>{const v=knVal(q);if(v)kn.add(v);});
    POOL_KN=kn.size?[...kn]:null;
  } else POOL_KN=null;
};
/* 稳定键：内置题 'T'+下标（懒赋）；AI 题 'Q'+表 id（挂池时赋）。
   以前是 THEORY.indexOf(q) —— 题库顺序一变、增删一道，设置里存的点名就全错位。 */
function qid(q){
  if(q._k!=null)return q._k;
  const i=THEORY.indexOf(q);
  q._k='T'+i;q._i=i;
  return q._k;
}
const qidx=q=>{qid(q);return q._i;};
/* 点名 → 题。数字下标只对内置单片机题库有效（老师以前的试卷库里存的正是下标，不许作废）；
   AI 题库里存的是 'Q'+id 字符串。切了池之后另一种形式直接当没点过 —— 宁可退回随机，
   也不能拿数字下标去指 AI 题库里第 N 道（那是指错题）。 */
function pickQ(v){
  if(v==null||v==='')return null;
  if(typeof v==='string'&&v[0]==='Q'){
    if(!POOL)return null;
    return curPool().find(q=>q._k===v)||null;
  }
  if(POOL)return null;
  const n=+v;
  return Number.isInteger(n)&&n>=0&&n<THEORY.length?THEORY[n]:null;
}

/* 抽题：整套卷一起平衡各项目的分值。先排分值大的题型（程序分析、简答……），
   每抽一道题，都选“目前分值离目标比例差得最多”的项目；used 是别的卷（A/B/C）已用过的题，尽量避开。
   picks：老师在题库里点名的题（键 = 题型:该节内第几题，值 = THEORY 下标），先落位再补名额。
   ── 每个大题用自己的种子（seed+题型）──
   原来六个大题串着用同一个 rng：老师在第 1 大题点名换一道，后面所有大题的随机序列全错位，
   整张卷子除了那一道全变样。按题型拆种子后，换哪一大题就只动那一大题。 */
function pickSections(cfg,seed,used,picks){
  const W=Object.keys(curCH()).reduce((a,c)=>a+(+cfg.weights[c]||0),0)||1;
  /* 知识点筛选题池：只在非 mcu（POOL 存在）且设置里勾了知识点时生效；mcu 的题没有 knowledge，永远不过这道筛。 */
  const knSel=POOL&&Array.isArray(cfg.kn)&&cfg.kn.length?new Set(cfg.kn.map(String)):null;
  const secs=cfg.sections.filter(s=>s.n>0&&PAPER_TYPES[s.t]).map(s=>({...s,items:[]}));
  const order=secs.slice().sort((a,b)=>b.pts*(b.t==='fill'?2:1)-a.pts*(a.t==='fill'?2:1));
  const hasPicks=!!picks&&typeof picks==='object';
  for(const sec of order){
    /* 项目比重平衡器（acc/tot）原来是**跨大题共用**的：acc 在大题循环外声明，
       而大题是按分值从高到低处理的（程序分析 → 简答 → 名词 → 填空/选择 → 判断）。
       结果老师在程序分析里换一道题，acc 就变了 → 后面填空/选择/判断的 gap 排序全变 → 那几大题跟着变题。
       用户原话：「我任意选一个其他都会变 无法控制某一个问题？还是说这是整体？一换整体就换了？」
       现在改成**每个大题各自平衡**：本大题内按各项目的权重比例分名额，改哪一个大题就只动那一个大题。
       代价：不再做「全卷跨大题的均衡」，换来的是一处改动只影响一处。 */
    const acc={};let tot=0;
    const rng=makeRng(seed+'|'+sec.t);
    const cnt=q=>sec.t==='fill'?blanksOf(q):1;
    /* 点名：不受项目比重、也不受“别的卷用过”限制——老师点了就是要它。
       下标越界 / 题型对不上 / 同一个下标点两次，都当没点过（不能因为一份存坏的设置把整页弄崩）。 */
    const pin=[];
    if(hasPicks){
      for(let i=0;i<sec.n;i++){
        const raw=picks[sec.t+':'+i];
        if(raw===undefined||raw===null||raw==='')continue;
        const q=pickQ(raw);           // 数字下标（mcu 老存档）/ 'Q'+id（AI 题库）都认，越界或题型不符当没点过
        if(!q||q.t!==sec.t)continue;
        const k=qid(q);
        if(pin.some(x=>x.k===k))continue;
        pin.push({i,k,q});
      }
    }
    const pinK=new Set(pin.map(x=>x.k));
    let have=0;
    pin.forEach(x=>{
      have+=cnt(x.q);used.add(x.k);           // 同一套卷里不能再出现第二遍
      const p=cnt(x.q)*sec.pts;acc[x.q.ch]=(acc[x.q.ch]||0)+p;tot+=p;
    });
    const pool=curPool().filter(q=>q.t===sec.t&&(+cfg.weights[q.ch]||0)>0&&!pinK.has(qid(q))&&(!knSel||knSel.has(knVal(q))));
    const need=sec.t==='fill'?Math.ceil(sec.n/2):sec.n;
    const fresh=pool.filter(q=>!used.has(qid(q)));
    const src=fresh.length>=need?fresh:pool;
    const byCh={};rng.shuffle(src).forEach(q=>{(byCh[q.ch]=byCh[q.ch]||[]).push(q);});
    for(let guard=0;have<sec.n&&guard<200;guard++){
      const cands=Object.keys(byCh).filter(c=>byCh[c].some(q=>have+cnt(q)<=sec.n));
      if(!cands.length)break;
      const gap=c=>(cfg.weights[c]/W)*(tot+sec.pts)-(acc[c]||0);
      cands.sort((a,b)=>gap(b)-gap(a)||rng.next()-0.5);
      const c=cands[0],k=byCh[c].findIndex(q=>have+cnt(q)<=sec.n),q=byCh[c].splice(k,1)[0];
      sec.items.push(q);have+=cnt(q);
      const p=cnt(q)*sec.pts;acc[c]=(acc[c]||0)+p;tot+=p;
    }
    const byPos=(a,b)=>(a.ch-b.ch)||(qidx(a)-qidx(b));
    if(!pin.length)sec.items.sort(byPos);   // 同一大题内按项目顺序排
    /* 有指定题时排序会把老师点的题挪走，所以先按位置摆进去（“第 4 题”点了就要在第 4 题），
       空出来的位置再把随机补的题按原顺序填进去。 */
    else{
      const rest=sec.items.slice().sort(byPos);
      const total=Math.max(rest.length,...pin.map(x=>x.i+1));
      const items=new Array(total).fill(null);
      pin.forEach(x=>{items[x.i]=x.q;});
      for(let i=0;i<total;i++)if(!items[i])items[i]=rest.shift()||null;
      rest.forEach(q=>items.push(q));
      sec.items=items.filter(Boolean);
    }
  }
  return secs;
}
function pickPaper(cfg){
  const vers=['A','B','C'],idx=Math.max(0,vers.indexOf(cfg.ver));
  const used=new Set();let paper=null;
  const picks=cfg.picks&&typeof cfg.picks==='object'?cfg.picks:null;
  for(let v=0;v<=idx;v++){
    /* 点名只作用于当前这一卷：B/C 卷继承 A 的点名就会和 A 出现同一道题 */
    paper=pickSections(cfg,'paper|'+cfg.key+'|'+vers[v],used,vers[v]===cfg.ver?picks:null);
    paper.forEach(s=>s.items.forEach(q=>used.add(qid(q))));
  }
  paper.forEach((s,i)=>{
    s.no=CN_NUM[i];
    s.count=s.t==='fill'?s.items.reduce((a,q)=>a+blanksOf(q),0):s.items.length;
    s.total=s.count*s.pts;
  });
  return paper;
}
const paperTotal=P=>P.reduce((a,s)=>a+s.total,0);
function paperStats(P){
  const ch={};P.forEach(s=>s.items.forEach(q=>{const w=s.t==='fill'?blanksOf(q)*s.pts:s.pts;ch[q.ch]=(ch[q.ch]||0)+w;}));
  return ch;
}

function blankHTML(s){return ptxt(s).replace(/____/g,'<u class="bl">　　　　　　　</u>');}
function optHTML(o){
  const opts=hxChoices(o);
  if(!opts.length)return '';
  const L=Math.max(...opts.map(x=>x.text.length));

}
/* 答题留白：宽松 / 标准 / 紧凑 */
const SPACE_K={auto:1,loose:1.3,normal:1,tight:0.7};
let __spaceK=1;
const nLines=n=>Math.max(2,Math.round(n*__spaceK));
const lines=n=>`<div class="space" style="height:${nLines(n)*18}pt"></div>`;
function itemHTML(s,q,i){
  const no=`${i+1}.`;
  switch(s.t){
    case 'choice':return `<div class="q">${no}${ptxt(q.q)}</div>${optHTML(q.o)}`;
    case 'fill':return `<div class="q">${no}${blankHTML(q.q)}</div>`;

    case 'prog':{const subs=hxSubs(q.sub);return `<div class="q">${no}${ptxt(q.q)}</div><pre class="code">${esc(q.code)}</pre>${subs.map((x,k)=>`<div class="q sub">（${k+1}）${ptxt(x)}</div>${lines(subs.length>1?3:7)}`).join('')}`;}
  }
  return '';
}

const PAPER_LAYOUT_JS=`
(function(){

  var plan=function(){

      for(var j=i;blks[j]&&blks[j].classList.contains('keep')&&blks[j+1];j++)need+=hs[j+1];   // 大题标题、程序和第 1 小问连在一起，不留孤立的标题

  };

  if(document.body.getAttribute('data-fit')==='1'&&cols.length>4){
