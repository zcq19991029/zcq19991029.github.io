   refresh 只换 innerHTML、不换外层元素，反复绑定会把监听叠起来（一次删除触发 N 次）。
   ── 为什么 handler 是 async ──
   删 / 改名要先跟云端确认（见 libDel / libRename）；失败就把原因说出来，别假装删掉了。 */
function libBind(root, kind, sub, opt) {
  if (!root) return;
  if (root._libAc) root._libAc.abort();
  const ac = root._libAc = new AbortController();
  opt = opt || {};
  root.addEventListener('click', async e => {
    const b = e.target.closest('[data-lib]');
    if (!b || !root.contains(b)) return;
    const row = b.closest('[data-lib-id]');
    const id = row && row.dataset.libId;
    const it = id && libById(id);
    if (!it) return;
    const act = b.dataset.lib;
    if (act === 'use') { opt.onUse && opt.onUse(id, it); return; }
    if (act === 'del') {
      const r = await libDel(id);
      toast(r.ok ? '已删除' : '没删掉：' + r.err);
      opt.refresh && opt.refresh();
      return;
    }
    if (act === 'ren') {
      const nm = typeof prompt === 'function' ? prompt('新的名字', it.name) : null;
      if (nm == null) return;
      const r = await libRename(id, nm);
      toast(r.ok ? '已改名为 ' + r.name : '没改成：' + r.err);
      opt.refresh && opt.refresh();
    }
  }, { signal: ac.signal });
}

window.HXLib = { items: libItems, load: libLoad, sync: libSync, add: libAdd, del: libDel, rename: libRename, listHTML: libListHTML, bind: libBind, defaultName: libDefaultName, when: libWhen, code: libCode, err: () => libErr };

;
/* ================= 考试 · 理论试卷（2026-11-06 从单片机迁来；2026-11-06 第二轮：点题换题） =================
   用户原话：「目前我的试卷无法编辑每一个题选什么从题库里 我希望能在这个上面直接点击选择 目前这个也太小
   组卷页面需要很大平铺那种 然后正反面不就是两页吗 点击题目那一区域就可以换题」。
   ── 这一轮的四个决定 ──
   1. 画布占满整幅（.ex-shell.wide），不再有 380px 的常驻右栏；设置收进右侧抽屉。
      旧的「缩成中间一小条」是 transform-origin 默认 50% 50% 造成的：缩完还居中，两边全空。
   2. 预览仍然用 iframe（srcdoc）：打印要的是 iframe 里那份**独立的** A3 文档，
      用 Shadow DOM 挂进主文档反而会把主文档的打印样式卷进来，风险更大。
      尺寸由父页算：iframe 保持 A3 原宽 1588px，只做 scale（origin 0 0），外面套一层
      按缩放后尺寸撑开的 .ppstage，所以不会出现内层滚动条。
   3. 点题：iframe 里每个题目块带 data-k，点了 postMessage 回来；父页开题库抽屉。
   4. 设置存 localStorage（键 exam.paper），手动选题 picks 跟着整份 C 一起存。 */
'use strict';

const PAPER_KEY = 'exam.paper';
/* 每个科目一套设置；没存过就用 PAPER_DEFAULT（单片机理论卷的学校模板参数）。
   ── sections / weights 必须深拷贝（2026-11-06 实测踩到）──
   Object.assign 是浅拷贝：没有存过设置时 C.sections 会**指向 PAPER_DEFAULT.sections 同一个数组**，
   renderTypes 的 change 处理又是直接改对象（s.n = ...），于是「改题型题数」当场把默认值改坏，
   再点「恢复默认」恢复出来的还是被改过的那份（实测：题数改 0 后怎么点都回不到 100 分）。 */
function paperLoad(sub) {
  const all = store.get(PAPER_KEY, {}) || {};
  const C = Object.assign({}, PAPER_DEFAULT, all[sub] || {});
  C.weights = Object.assign({}, PAPER_DEFAULT.weights, C.weights || {});
  const secs = Array.isArray(C.sections) && C.sections.length ? C.sections : PAPER_DEFAULT.sections;
  C.sections = secs.map(s => ({ t: s.t, n: s.n, pts: s.pts }));
  /* picks：老师点名要的题。旧存档里没有这一项、或者被手改坏了，都归零 —— 抽题那边也会
     自己挡掉越界/题型不符的下标，这里只保证类型是对的。 */
  C.picks = C.picks && typeof C.picks === 'object' && !Array.isArray(C.picks) ? Object.assign({}, C.picks) : {};
  if (!C.key) C.key = 'T' + Math.random().toString(36).slice(2, 6).toUpperCase();
  return C;
}
function paperSave(sub, C) {
  const all = store.get(PAPER_KEY, {}) || {};
  all[sub] = JSON.parse(JSON.stringify(C));
  store.set(PAPER_KEY, all);
}

/* 上一份 mountPaper 的监听：2026-11-06 加试卷库之后，「选用」要重新挂载这一页。
   window/document 上的监听（message / resize / hxpag）如果不解绑，每挂一次就多一份，
   预览每排一次版，高度回调会被算 N 次（实测叠到第三次就开始闪）。
   页面内 $() 拿到的 DOM 监听不用管：整页重画时元素本身就没了。 */
let PPAC = null;

const PPTXT = s => String(s == null ? '' : s);
const ppCut = (s, n) => { s = PPTXT(s).replace(/\s+/g, ' '); return s.length > n ? s.slice(0, n) + '…' : s; };

function mountPaper(sub) {
  if (PPAC) PPAC.abort();
  PPAC = new AbortController();
  const sig = { signal: PPAC.signal };
  const view = $('ppView');
  if (!view) return;
  const C = paperLoad(sub);
  /* AI 题库科目（2026-11-08 第二轮）：章节按题库里实际出现的章节来；新出现的章节没存过权重，
     补个 20（和默认比重一个量级），不然会被「权重 0 不出题」那条悄悄滤掉，老师还以为是没抽到。 */
  if (POOL && POOL_CH) for (const c of Object.keys(POOL_CH)) if (C.weights[c] == null) C.weights[c] = 20;
  /* 非 mcu 第一次进：课程名不能用单片机的默认值，用科目名 */
  if (POOL && !(store.get(PAPER_KEY, {}) || {})[sub]) C.course = SUBJECTS[sub] || C.course;
  let P = null, timer = 0, ZOOM = 'fit', bankKey = '', pendingScroll = null;

  const F = (id, k, num) => {
    const el = $(id);
    if (!el) return;
    el.value = C[k];
    el.addEventListener('change', () => { C[k] = num ? (+el.value || 0) : el.value.trim(); changed(); });
  };

  function renderTypes() {
    $('ppTypes').innerHTML = C.sections.map((s, i) => {
      const T = PAPER_TYPES[s.t];
      return `<tr><td>${CN_NUM[i]}、${T.name}</td>
        <td><input type="number" min="0" max="40" value="${s.n}" data-i="${i}" data-f="n" aria-label="${T.name}${T.per}数"> ${T.per}</td>
        <td><input type="number" min="0" max="30" step="0.5" value="${s.pts}" data-i="${i}" data-f="pts" aria-label="${T.name}${T.unit}分值"> 分</td></tr>`;
    }).join('');
    $('ppW').innerHTML = Object.keys(curCH()).map(c => `<label class="ppw"><span>${esc(chLabel(c))}</span><input type="number" min="0" max="100" value="${C.weights[c]}" data-ch="${c}" aria-label="${esc(curCH()[c])}权重"></label>`).join('');
  }

  const picksCount = () => Object.keys(C.picks || {}).length;

  function stats() {
    const total = paperTotal(P), st = paperStats(P), nq = P.reduce((a, s) => a + s.items.length, 0);
    /* 题不够要说清楚差多少（2026-11-08 第二轮）：AI 题库刚建时某个题型可能只有两三道，
       以前只报题型名，老师不知道差几道、还以为抽题坏了 */
    const short = P.map(s => {
      const want = (C.sections.find(x => x.t === s.t) || {}).n || 0;
      return s.count < want ? `${PAPER_TYPES[s.t].name} 题库只出 ${s.count}${PAPER_TYPES[s.t].per}、要 ${want}${PAPER_TYPES[s.t].per}` : null;
    }).filter(Boolean);
    $('ppTotal').innerHTML = `<b style="${total === 100 ? '' : 'color:var(--warn)'}">满分 ${total} 分</b>${total === 100 ? '' : '（一般应为 100 分，调整题数或分值）'}`;
    if ($('ppMeta')) $('ppMeta').innerHTML = `<b>共 ${nq} 题</b> · 满分 ${total} 分` + (picksCount() ? ` · <span class="pppicked">已手动选 ${picksCount()} 道</span>` : '');
    $('ppStat').innerHTML = Object.keys(curCH()).map(c => `<div class="ppbar"><span>${esc(chLabel(c))}</span><i style="--w:${total ? ((st[c] || 0) / total * 100).toFixed(1) : 0}%"></i><b>${st[c] || 0} 分</b></div>`).join('') +
      (short.length ? `<div class="warns" style="margin-top:8px">题库里题不够：${short.join('；')}，已按能抽到的出。</div>` : '');
  }

  /* ================= 画布：缩放 + 尺寸 ================= */
  const NAT_W = 1588;   // A3 横向 420mm ≈ 1588px @96dpi
  function fit() {
    const fr = $('ppFrame'), stage = $('ppStage');
    if (!fr || !stage || !view.clientWidth) return;
    /* 手机屏宽 380 时“适应宽度”只有 0.22 倍，字小到既读不了也点不准 —— 给个下限，
       宁可横向滚一滚，也别把整张 A3 压成一条。 */
    const floor = matchMedia('(pointer:coarse)').matches ? 0.42 : 0.2;
    const k = ZOOM === 'fit' ? Math.max(floor, Math.min(1, (view.clientWidth - 24) / NAT_W)) : (+ZOOM || 1);
    const h = +fr.dataset.h || 400;
    /* iframe 自己必须撑到整份文档那么高：不然浏览器给它 150px 的默认高度，
       装不下就在里面长出滚动条（用户报的「排版不合理」就是这么来的） */
    fr.style.height = h + 'px';
    fr.style.width = NAT_W + 'px';
    fr.style.transform = `scale(${k})`;
    stage.style.width = Math.round(NAT_W * k) + 'px';
    stage.style.height = Math.round(h * k) + 'px';
  }

  /* 预览页面在不显示时量不出尺寸，所以只在「理论试卷」这一页可见时排版 */
  let dirty = true;
  const visible = () => { const s = view.closest('[data-page]'); return !s || !s.hidden; };
  function preview() {
    P = pickPaper(C);
    stats();
    dirty = true;
    if (!visible()) return;
    dirty = false;
    const fr = $('ppFrame');
    if (!fr) return;
    pendingScroll = view.scrollTop;      // 换一道题不要把老师看的那一页顶回顶部
    fr.dataset.h = 400;
    fit();
    fr.srcdoc = paperDocHTML(P, C, { edit: true });
    if (bankKey) renderBank();
  }
  function changed() { paperSave(sub, C); clearTimeout(timer); timer = setTimeout(preview, 250); }
  PPAC.signal.addEventListener('abort', () => clearTimeout(timer));

  window.addEventListener('message', e => {
    const fr = $('ppFrame');
    if (!fr || e.source !== fr.contentWindow) return;
    const d = e.data || {};
    if (d.hxPaperPick) { openBank(String(d.hxPaperPick), +d.no || 1, String(d.t || '')); return; }
    if (!d.paperReady) return;
    fr.dataset.h = fr.contentDocument.documentElement.scrollHeight;
    fit();
    $('ppPages').textContent = `共 ${d.pages} 页（${d.pages / 2} 张 A3，双面）` +
      (d.pages > 4 ? ' · 超过 2 张，可改「紧凑」留白或减少题量' : '');
    if (pendingScroll != null) { view.scrollTop = pendingScroll; pendingScroll = null; }
  }, sig);

  let rzTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(rzTimer); rzTimer = setTimeout(fit, 120); }, sig);
  /* app.js 切页时会广播 hxpag，显示到这一页时补排版 */
  document.addEventListener('hxpag', e => {
    if (e.detail !== 'paper') return;
    setTimeout(() => { if (dirty) preview(); else fit(); }, 50);
  }, sig);
  /* 缩放按钮 */
  const zoomBox = $('ppZoom');
  if (zoomBox) zoomBox.addEventListener('click', ev => {
    const b = ev.target.closest('[data-z]');
    if (!b) return;
    ZOOM = b.dataset.z;
    zoomBox.querySelectorAll('[data-z]').forEach(x => x.classList.toggle('on', x === b));
    fit();

  /* ================= 抽屉（设置 / 题库） ================= */
  function drawer(id, on) {
    const d = $(id);
    if (!d) return;
    const open = on === undefined ? !d.classList.contains('on') : on;
    /* 两个抽屉互斥：手机上都是全屏，同时开着的话后开的那个会把先开的整个盖住，
       老师点「设置」却看不到任何变化（实测踩到）。 */
    if (open) drawer(id === 'ppDrawer' ? 'ppBank' : 'ppDrawer', false);
    d.classList.toggle('on', open);
    d.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (id === 'ppDrawer' && $('ppSet')) {
      $('ppSet').classList.toggle('on', open);

    }
  }
  if ($('ppSet')) $('ppSet').onclick = () => drawer('ppDrawer');
  if ($('ppLibBtn')) $('ppLibBtn').onclick = () => drawer('ppDrawer', true);
  document.querySelectorAll('[data-ppclose]').forEach(b => { b.onclick = () => drawer(b.dataset.ppclose, false); });
  document.addEventListener('keydown', ev => {

    drawer('ppDrawer', false); drawer('ppBank', false);
  }, sig);

  /* ================= 题库抽屉：点题换题 ================= */
  function openBank(key, no, t) {
    const sec = P && P.find(s => s.t === t);
    if (!sec) return;
    bankKey = key;

    drawer('ppBank', true);
    $('ppBankQ').value = '';
    document.querySelectorAll('#ppBankCh input').forEach(x => { x.checked = true; });

    const l = $('ppBankList'); if (l) l.scrollTop = 0;
  }

  function usedIds() {
    const s = new Set();
    if (P) P.forEach(sec => sec.items.forEach(q => s.add(qid(q))));
    return s;
  }
  function renderBank() {
    const wrap = $('ppBankList');
    if (!wrap || !bankKey) return;
    const t = bankKey.split(':')[0], idx = +bankKey.split(':')[1] || 0;
    const T = PAPER_TYPES[t];
    if (!T) return;
    const sec = P && P.find(x => x.t === t);
    const cur = sec ? sec.items[idx] : null;
    $('ppBankTitle').innerHTML = `<b>${T.name} · 第 ${idx + 1} 题</b>` +
      (cur ? `<span class="ppd-cur">当前：${POOL ? esc(chLabel(cur.ch)) : '项目' + cur.ch + ' ' + esc(curCH()[cur.ch])} · ${esc(ppCut(cur.q, 40))}${POOL && cur.src ? ` · 出自「${esc(cur.src)}」` : ''}</span>` : '');
    const pinVal = C.picks[bankKey];
    const chk = [...document.querySelectorAll('#ppBankCh input:checked')].map(x => +x.dataset.ch);
    const kw = ($('ppBankQ').value || '').trim().toLowerCase();
    const used = usedIds();
    const rows = [];
    /* 点名存什么：mcu 存数字下标（和老存档一致），AI 题库存 'Q'+id（2026-11-08 第二轮）。

    curPool().forEach((q, i) => {
      if (q.t !== t) return;
      if (chk.length && chk.indexOf(q.ch) < 0) return;

      const pv = POOL ? qid(q) : i;
      const on = pinVal != null && String(pinVal) === String(pv);
      const busy = used.has(qid(q)) && !(cur && qid(cur) === qid(q));
      rows.push(`<div class="bkq${on ? ' on' : ''}" data-i="${pv}" role="button" tabindex="0">
        <span class="bkq-ch">${POOL ? '章' + q.ch : 'P' + q.ch}</span><span class="bkq-q">${esc(ppCut(q.q, 60))}</span>
        ${POOL && q.src ? `<span class="bkq-src" title="${esc(q.src)}">${esc(ppCut(q.src, 20))}</span>` : ''}
        ${on ? '<span class="bkq-tag on">当前</span>' : busy ? '<span class="bkq-tag">本卷已用</span>' : ''}
        <button class="sm bkq-p" data-peek="${i}" aria-label="预览这道题">看</button></div>
        <div class="bkq-d" data-d="${i}" hidden>${fullHTML(q)}</div>`);

    $('ppBankHint').textContent = `${T.name}共 ${rows.length} 道可选`;
    $('ppBankRand').disabled = !(C.picks[bankKey] != null);
  }

  function fullHTML(q) {
    const t = q.t;
    let h = `<div class="bkq-fq">${esc(q.q)}</div>`;
    if (t === 'choice') h += `<ol class="bkq-op">${(q.o || []).map((x, k) => `<li>${'ABCD'[k]}. ${esc(x)}</li>`).join('')}</ol>`;
    if (t === 'prog' && q.code) h += `<pre class="code">${esc(q.code)}</pre>` + (q.sub || []).map((x, k) => `<div class="note">（${k + 1}）${esc(x)}</div>`).join('');
    const a = t === 'choice' ? q.a : t === 'judge' ? (q.a ? '正确' : '错误') : Array.isArray(q.a) ? q.a.join('；') : q.a;
    h += `<div class="bkq-a"><b>答案</b>${esc(a)}</div>`;
    return h;
  }

  function usePick(v) {
    if (!bankKey) return;
    C.picks[bankKey] = POOL ? v : +v;   // mcu 存数字下标，AI 题库存 'Q'+id
    paperSave(sub, C);
    preview();
    const q = pickQ(C.picks[bankKey]);
    if (q) toast(`已换成${POOL ? chLabel(q.ch) : '项目' + q.ch}：${ppCut(q.q, 18)}`);
  }

  const list = $('ppBankList'), bank = $('ppBank');
  if (bank) {
    bank.addEventListener('click', ev => {
      const peek = ev.target.closest('[data-peek]');
      if (peek) {
        const d = bank.querySelector(`[data-d="${peek.dataset.peek}"]`);
        if (d) { d.hidden = !d.hidden; peek.textContent = d.hidden ? '看' : '收'; }
        return;

    bank.addEventListener('keydown', ev => {
      const row = ev.target.closest && ev.target.closest('.bkq');

    });

  let kwTimer = 0;
  if ($('ppBankQ')) $('ppBankQ').addEventListener('input', () => { clearTimeout(kwTimer); kwTimer = setTimeout(renderBank, 130); });
  if ($('ppBankCh')) $('ppBankCh').addEventListener('change', renderBank);
  if ($('ppBankRand')) $('ppBankRand').onclick = () => {
    if (!bankKey || C.picks[bankKey] == null) return;
    delete C.picks[bankKey];
    paperSave(sub, C);
    preview();
    toast('已恢复随机抽题');
  };

  /* ================= 表单 ================= */
  F('ppYear', 'year'); F('ppTerm', 'term'); F('ppCourse', 'course'); F('ppVer', 'ver');
  F('ppMajor', 'major'); F('ppGrade', 'grade'); F('ppMode', 'mode'); F('ppMin', 'minutes', true);
  F('ppKey', 'key'); F('ppSpace', 'space');

  $('ppTypes').addEventListener('change', e => {
    const t = e.target, s = C.sections[+t.dataset.i];
    if (!s || !t.dataset.f) return;
    s[t.dataset.f] = Math.max(0, +t.value || 0);
    changed();
  });
  $('ppW').addEventListener('change', e => {
    const c = e.target.dataset.ch;
    if (!c) return;
    C.weights[c] = Math.max(0, +e.target.value || 0);
    changed();
  });
  /* 换种子：**手动选过的题保留** —— 老师挑的就是要它，换种子只是想换掉那些随机补的。

  $('ppNew').onclick = () => {
    C.key = 'T' + Math.random().toString(36).slice(2, 6).toUpperCase();
    if ($('ppKey')) $('ppKey').value = C.key;
    changed();
    const n = picksCount();
    toast(n ? `已换一套题；你手动选的 ${n} 道题保留着` : '已换一套题（种子变了）');
  };
  $('ppReset').onclick = () => {
    C.sections = PAPER_DEFAULT.sections.map(s => ({ ...s }));
    C.weights = { ...PAPER_DEFAULT.weights };
    renderTypes(); changed();
    toast(picksCount() ? `已恢复默认题量；${picksCount()} 道手动选的题还在` : '已恢复默认题量与比重');
  };

  const base = () => `${C.course}_期末试卷${C.ver}卷`;
  $('ppPdf').onclick = () => {
    const fr = $('ppFrame');
    if (!fr || !fr.contentDocument || !fr.contentDocument.body || !fr.contentDocument.body.getAttribute('data-pages')) { toast('预览还没排好，稍等一下再点'); return; }
    toast('在打印窗口里：目标选「另存为 PDF」，纸张 A3，横向，边距「无」');
    fr.contentWindow.focus();

   2. 没有名单、没有批改、没有导出的旧入口，那些都在别的页。
   3. 母题只认内置 M1～M6（导入书上代码那套要单片机离线文件，网页版做不了），
      用到自定义母题的组卷码在这里直接拦住并说明原因。
   4. 科目：现在只有单片机上机。组卷状态按科目分开存（SUBJECTS 的键），以后加科目不用改这里。
   5. 2026-11-06 加「题库选题」与「试卷库」：用户要「每一题都可以去选择题库去添加进去 精准组卷，
      而不是只有随机」，以及「这套卷子就可以命名为XXX保存到理论试卷库里面供我挑选和备用」。
      题库的本质还是 M1～M6 的生成器，只是把变式号 pin 钉死（见 bank.js 的 bankVariant）：
      钉死的题和口令、学号、这是第几题都无关，所以老师在题库里看到的那道就是学生拿到的那道。 */
'use strict';

const BUILD_KEY = 'exam.build';
/* 每道题的默认值：和「考试」页发布时的默认一致，老师来回切两页看到的是同一套 */
const BUILD_DEFAULT_QS = [
  { mid: null, type: 'fill', pts: 30, draw: null },
  { mid: null, type: 'modify', pts: 35, draw: null },
  { mid: null, type: 'fix', pts: 35, draw: null }
];
const randKey = () => 'K' + Math.random().toString(36).slice(2, 6).toUpperCase();

/* ---------- 题库（变式清单）的状态 ----------
   bankCache 是模块级的：buildVariant 不便宜（要生成代码、算评分点），
   72 项每次 draw() 重算会让点一下卡一下；同一个 (题型,母题,变式号) 出的题永远一样，缓存绝对安全。
   上限是 3 题型 × 72 = 216 道，几 MB 以内，比反复重算划算。 */
const bankCache = new Map();
let bankFor = null;        // 题库面板开着的是第几题（null = 关着）。只在内存里，不存盘：这是临时动作，不是设置
let bankPeek = new Set();  // 展开了「看」的变式（'M3|5'）

function bankGet(mid, type, pin) {
  const k = type + '|' + mid + '|' + pin;
  let v = bankCache.get(k);
  if (!v) { v = bankVariant(mid, type, pin); bankCache.set(k, v); }
  return v;
}
/* 列表里只放一句摘要：72 项如果每项都渲染整道题（题目 + 程序 + 评分点），手机上直接卡死。
   摘要取的是「要求」的第一句，正好是这题跟别题最不一样的地方。 */
function bankSum(v) {
  const s = (v.req || []).join('；').replace(/\s+/g, ' ').trim();
  return s.length > 60 ? s.slice(0, 60) + '…' : s;
}

/* 母题下拉：只列内置 M1～M6。
   单片机的 motherOptions 会附上「老师导入的书上代码」和「我自己导入的代码」两组，
   那两块在网页版考试里根本没有（导入要单片机离线文件），列出来就是一堆选了会失败的选项。
   ── 为什么自己写一份而不复用 motherOptions ──
   它依赖 ui-practice.js 的 PRACTICE_MOTHERS，考试工具不打包那个文件，直接调会 ReferenceError。 */
function builderMothers(sel, first) {
  const o = m => `<option value="${m.id}" ${sel === m.id ? 'selected' : ''}>${m.id} ${esc(m.name)}${m.task ? '（' + esc(m.task) + '）' : ''}</option>`;
  return (first || '') + MOTHERS.map(o).join('');
}

/* 组卷状态：{ [科目]: { key, qs:[{mid,type,pts,draw,pin}], requireHex } } */
function buildLoad(sub) {
  const all = store.get(BUILD_KEY, {}) || {};
  const b = all[sub];
  if (b && Array.isArray(b.qs) && b.qs.length) return { key: b.key || randKey(), qs: b.qs.map(q => ({ ...q })), requireHex: !!b.requireHex };
  return { key: randKey(), qs: BUILD_DEFAULT_QS.map(q => ({ ...q })), requireHex: false };
}
function buildSave(sub, B) {
  const all = store.get(BUILD_KEY, {}) || {};
  all[sub] = { key: B.key, qs: B.qs.map(q => ({ ...q })), requireHex: !!B.requireHex };
  store.set(BUILD_KEY, all);
}
const buildCode = B => makeExamCode(B.key, B.qs);

/* 用到导入书上代码的题改回随机：网页版没有自定义母题库，留着会让组卷码解不开。
   顺带把没有 pin 的题补成 pin:null，让下面所有判断都能直接写 q.pin != null */
function buildFixMids(B) {
  B.qs.forEach(q => {
    if (q.mid && !MOTHER_BY_ID[q.mid]) { q.mid = null; q.pin = null; }
    if (q.pin === undefined) q.pin = null;
    if (q.pin != null) q.draw = null;   // pin 和 draw 同时存在时 pin 说话（seed 以 pin 优先），留着 draw 只会让码更乱
  });
  return B;
}

  /* ---------- 试卷库 ----------

     所以这里是 async —— 调用处不用 await（draw() 里是最后一句，等它没意义），

  async function drawLib() {

    if (!el.isConnected) return;   // 等云端这段时间里切页了，别再往旧 DOM 上写

      onUse: (id, it) => {
        const p = it.payload || {};

      if (f === 'pts') q.pts = Math.max(1, Math.min(100, Math.round(+e.target.value || 1)));

    if (e.target.id === 'bdKey') {

        .then(it => {

        .catch(e => toast('没存上：' + (e && e.message ? e.message : e)))
        .then(() => { b.disabled = false; });

    }
    const row = b.closest('.qrow');
    if (row && b.dataset.f) {
      const i = +row.dataset.i;
      if (b.dataset.f === 'del' && B.qs.length > 1) {
        B.qs.splice(i, 1);
        /* 删掉的题在题库面板上面时，面板指向的行号要跟着往前挪，否则会开到隔壁那道题上 */
        if (bankFor === i) bankFor = null;
        else if (bankFor != null && bankFor > i) bankFor--;
        redraw();
      }
      if (b.dataset.f === 'redraw') { B.qs[i].draw = (B.qs[i].draw || 0) % 9999 + 1; redraw(); toast(`第 ${i + 1} 题已换成另一道`); }
      if (b.dataset.f === 'bank') { bankFor = bankFor === i ? null : i; draw(); if (bankFor != null) { const c = box.querySelector('.bk-card'); if (c) c.scrollIntoView({ block: 'nearest' }); } }
      return;
    }
    if (b.id === 'bdAddQ') { if (B.qs.length < 5) { B.qs.push({ mid: null, type: 'fill', pts: 20, draw: null, pin: null }); redraw(); } return; }
    if (b.id === 'bdNewKey') { B.key = randKey(); redraw(); toast('已换一套题（种子变了）'); return; }
    if (b.id === 'bdCopy') {
      const code = buildCode(B);
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('组卷码已复制')).catch(() => toast('复制失败，请手动选中复制'));
      return;
    }
    if (b.id === 'bdLoad') {
      const p = parseExamCode($('bdIn').value);
      if (!p) { toast('组卷码格式不对，例如 QM25-2t30-4g35.3-6c35'); return; }
      if (!p.qs.length) { toast('组卷码里至少要有 1 道题'); return; }
      /* 网页版没有导入的母题库：用到 M7 以上（自定义）的码读不进来说明原因，别让老师以为坏了 */
      if (p.qs.some(q => q.mid && !MOTHER_BY_ID[q.mid])) { toast('这个组卷码用到了导入书上代码的母题，网页版还不支持（要用单片机离线文件）'); return; }
      B.key = p.key; B.qs = p.qs.map(q => ({ ...q })); bankFor = null; bankPeek.clear(); redraw(); toast('已读入组卷码');
    }
  }, sig);

  draw();
}

const HXIMP_IMG = /\.(jpe?g|png|webp|gif|bmp)$/i;
const isImageFile = name => HXIMP_IMG.test(String(name || '').toLowerCase());

// 图片转 dataURL：最长边压到 1600px、JPEG 0.8。手机拍一页教材 4MB，原样发几张模型会直接拒。
function fileToDataUrl(file, max = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // 透明 PNG 铺白底，否则转 JPEG 会变黑块
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      } catch (e) { reject(new Error('图片处理失败：' + e.message)); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('这张图片读不出来（可能不是常见的 jpg/png）')); };
    img.src = url;
  });
}

/* 读一份资料 → { text } 或 { image }（图片不在这一步转文字，交给视觉模型） */
async function readMaterial(file) {
  const name = String(file && file.name || '').toLowerCase();
  if (isImageFile(name)) return { image: await fileToDataUrl(file), text: '' };
  if (/\.(txt|md|text)$/i.test(name)) return { text: await file.text() };
  if (name.endsWith('.docx')) {
    let m;
    try { m = await import(HXIMP_V('mammoth.browser.min.js')); }
    catch (e) { throw new Error(HXIMP_LIB_MISS); }
    const lib = globalThis.mammoth || (m && m.default) || m;
    if (!lib || !lib.extractRawText) throw new Error(HXIMP_LIB_MISS);
    const r = await lib.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { text: r.value || '' };
  }
  if (name.endsWith('.pdf')) {
    let pdfjs;
    try { pdfjs = await import(HXIMP_V('pdf.js')); }
    catch (e) { throw new Error(HXIMP_LIB_MISS); }
    pdfjs = pdfjs.default && pdfjs.default.getDocument ? pdfjs.default : pdfjs;
    pdfjs.GlobalWorkerOptions.workerSrc = HXIMP_V('pdf.worker.js');
    const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const c = await page.getTextContent();
      pages.push(c.items.map(it => it.str).join(' '));
    }
    const text = pages.join('\n');
    if (text.trim().length < 50) throw new Error('这份 PDF 没有可提取的文字（扫描件）。把每页截图存成 JPG/PNG 再传，让 AI 看着读。');
    return { text };
  }
  throw new Error('支持 PDF、DOCX、TXT、MD，以及 jpg／png 图片；旧版 .doc 请另存为 .docx');
}

// 图片/扫描件 → 文字。走视觉模型（HXAI.vision），没配看图模型时把话说清楚。

    images

}

function parseJson(text) {
  const cleaned = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(cleaned); } catch (e) {
    const a = cleaned.indexOf('{'), b = cleaned.lastIndexOf('}');
    if (a >= 0 && b > a) return JSON.parse(cleaned.slice(a, b + 1));
    throw new Error('AI 返回的内容不是有效 JSON，请重试或换一个模型。');
  }
}

const TYPE_ALIAS = {
  single: 'single', 单选: 'single', 单选题: 'single', 单项选择题: 'single', 单项选择: 'single',
  multiple: 'multiple', 多选: 'multiple', 多选题: 'multiple', 多项选择: 'multiple', 多项选择题: 'multiple',
  judgment: 'judgment', judge: 'judgment', 判断: 'judgment', 判断题: 'judgment',
  fill: 'fill', blank: 'fill', 填空: 'fill', 填空题: 'fill',
  short: 'short', 简答: 'short', 简答题: 'short', 问答: 'short', 问答题: 'short', 论述: 'short', 论述题: 'short',
  term: 'term', 名词解释: 'term', 名词: 'term', 术语解释: 'term', 概念解释: 'term',
  prog: 'prog', 程序: 'prog', 程序题: 'prog', 程序分析: 'prog', 程序分析题: 'prog',
  程序设计: 'prog', 程序设计题: 'prog', 编程: 'prog', 编程题: 'prog', 代码分析: 'prog', 读程序: 'prog'
};
const SUPPORTED = ['single', 'multiple', 'judgment', 'fill', 'short', 'term', 'prog'];
const TYPE_LABEL = { single: '单选题', multiple: '多选题', judgment: '判断题', fill: '填空题', short: '简答题', term: '名词解释', prog: '程序分析题' };

function answerTokens(raw) {
  const out = [];
  for (const v of (Array.isArray(raw) ? raw : [raw])) {
    const s = String(v == null ? '' : v).trim();
    if (!s) continue;
    if (/^[A-Fa-f]{2,}$/.test(s)) out.push(...s.toUpperCase().split(''));
    else out.push(...s.split(/[,，、/;；\s]+/).filter(Boolean));
  }
  return out;
}
const judgeKey = t => /^(正确|对|是|√|T|TRUE|Y|YES)$/i.test(t) ? 'T' : /^(错误|错|否|×|X|F|FALSE|N|NO)$/i.test(t) ? 'F' : '';
const hximpUid = () => (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));

/* 校验/规整一道题。和 刷题 那份逐条一致（含“被拒的题要带第几条 + 题干前几个字 + 原因”），
   只多了 term 和 term 的长度上限。返回 {questions, rejected}。 */
function normalizeQuestions(raw, subject) {
  const input = Array.isArray(raw) ? raw : raw && raw.questions;
  if (!Array.isArray(input)) throw new Error('题库需要是数组，或包含 questions 数组的 JSON 对象。');
  const questions = [], rejected = [];
  input.forEach((item, index) => {
    const stem0 = String((item && (item.stem || item.question || item.title)) || '').trim();
    let stem = stem0;
    const rawType = String((item && item.type) || '').trim();
    let type = TYPE_ALIAS[rawType.toLowerCase()] || TYPE_ALIAS[rawType] || '';
    const reject = reason => { rejected.push({ index: index + 1, stem: stem0.slice(0, 20), reason }); };
    if (!stem0) return reject('题干是空的');
    if (!type) {
      const opt = item && item.options;
      const list = Array.isArray(opt) ? opt : (opt && typeof opt === 'object' ? Object.keys(opt) : []);
      if (list.length && (String(list[0]).toUpperCase() === 'T' || /正确/.test(String((opt[0] && opt[0].text) != null ? opt[0].text : opt[0])))) type = 'judgment';
      else if (list.length >= 2) type = answerTokens(item.answer).length > 1 ? 'multiple' : 'single';
      else type = 'fill';
    }
    if (!SUPPORTED.includes(type)) return reject('题型「' + (rawType || '未知') + '」暂时不支持');

    const rawOptions = (item && (item.options || item.选项)) || [];
    let options = Array.isArray(rawOptions)
      ? rawOptions.map((op, i) => typeof op === 'string'
        ? { key: String.fromCharCode(65 + i), text: op.replace(/^[A-Fa-f][.、:：)）]\s*/, '') }
        : { key: String((op && op.key) || String.fromCharCode(65 + i)).toUpperCase(), text: String(op && op.text != null ? op.text : (op && op.value) || '') })
      : Object.entries(rawOptions).map(([k, v]) => ({ key: k.toUpperCase(), text: String(v) }));
    const texty = type === 'fill' || type === 'short' || type === 'term' || type === 'prog';
    if (texty) options = [];
    if (type === 'judgment' && !options.length) options = [{ key: 'T', text: '正确' }, { key: 'F', text: '错误' }];

    let answer;
    if (texty) {
      const raw2 = item.answer != null ? item.answer : item.答案;
      const vals = (Array.isArray(raw2) ? raw2 : [raw2]).map(v => String(v == null ? '' : v).trim()).filter(Boolean);
      answer = type === 'fill'
        ? vals.flatMap(v => v.split(/[、，,；;]+/).map(s => s.trim()).filter(Boolean))
        : [vals.join(' ')].filter(Boolean);
    } else {
      answer = answerTokens(item.answer != null ? item.answer : item.答案).map(tk => {
        const t = tk.replace(/[.。、:：)）]$/, '');
        if (type === 'judgment') return judgeKey(t) || t.toUpperCase();
        if (/^[A-Fa-f]$/.test(t)) return t.toUpperCase();
        const hit = options.find(o => String(o.text).trim() === t);
        return hit ? hit.key : t.toUpperCase();
      });
    }
    answer = [...new Set(answer)];

    if (type === 'fill') {
      if (!/_{2,}/.test(stem)) stem = stem.replace(/[（(]\s*[)）]/, '____').replace(/\s*[（(]\s*[)）]\s*/g, ' ____ ');
      if (!/_{2,}/.test(stem)) return reject('填空题的题干里没有 ____ 表示空格位置，学生没地方填');
    }
    const keys = new Set(options.map(o => o.key));
    if (!answer.length) return reject(type === 'prog' ? '程序分析题没有参考答案' : texty ? '参考答案是空的' : '没有答案');
    if (texty) {
      if (type === 'short' && answer[0].length > 1200) return reject('简答题的参考答案太长（超过 1200 字），像是把原文整段搬过来了');
      if (type === 'term' && answer[0].length > 600) return reject('名词解释的答案太长（超过 600 字），应该是几句话的解释');
      if (type === 'prog' && answer[0].length > 2000) return reject('程序分析题的参考答案太长（超过 2000 字），像是把原文整段搬过来了');
    } else {
      if (options.length < 2) return reject('选项少于 2 个');
      if (answer.some(a => !keys.has(a))) return reject('答案 ' + answer.filter(a => !keys.has(a)).join('、') + ' 不在选项里');
      if (type !== 'multiple' && answer.length !== 1) return reject(TYPE_LABEL[type] + '只能有 1 个答案，这份给了 ' + answer.length + ' 个');
    }
    const arr = v => (Array.isArray(v) ? v : v ? [v] : []).map(x => String(x == null ? '' : x).trim()).filter(Boolean);
    const code = String((item && (item.code || item.代码 || item.程序)) || '').trim();
    const sub = arr(item && (item.sub || item.小问 || item.问题));
    questions.push({
      id: subject + '-ai-' + hximpUid(),
      number: (item && item.number) || questions.length + 1,
      stem, type, options, answer,
      explanation: String((item && (item.explanation || item.解析)) || '').trim(),
      ...(code ? { code } : {}),
      ...(sub.length ? { sub } : {}),
      source: (item && (item.source || item.出处)) || 'AI'
    });
  });
  return { questions, rejected };
}

/* 切块：上传资料时存进 hx_exam_chunk（DB 里每块 body 最多 8000 字），
   所以 size 取 3600、overlap 320 —— 留足余量，也不会把一句话切两半切得太狠。 */
function chunks(text, size = 4200, overlap = 450) {
  const clean = String(text || '').replace(/\r/g, '');
  const out = [];
  for (let start = 0; start < clean.length; start += Math.max(1, size - overlap)) {
    out.push(clean.slice(start, start + size));
    if (start + size >= clean.length) break;
  }
  return out;
}

function genPrompt(o) {
  const list = Object.entries(o.counts || {}).filter(([, n]) => n > 0);
  const parts = list.map(([t, n]) => TYPE_LABEL[t] + ' ' + n + ' 道').join('、');
  const rules = list.map(([t]) => TYPE_RULE[t]).join('\n   ');
  const samples = list.map(([t]) => '  ' + TYPE_SAMPLE[t]).join(',\n');
  return '你是「' + o.subjectName + '」课程的出题老师。请根据下面的资料出题。\n'
    + '范围：' + (o.scope || '整份资料') + '（只出这个范围里写到的内容）\n'
    + '难度：' + (o.level || '中等') + '\n'
    + '这一轮要出：' + parts + '\n'
    + (o.extra ? '额外要求：' + o.extra + '\n' : '')
    + '硬要求：\n'
    + '1. 每道题都必须能在原文找到依据；原文没写的不出，不编型号、参数、页码。\n'
    + '2. ' + rules + '\n'
    + '3. 答案唯一、没有歧义；explanation 写一句依据（引用原文要点）。\n'
    + '4. 只输出 JSON 对象，不要任何解释文字：\n'
    + '{"questions":[\n  ' + samples + '\n]}' + (o.note ? '\n' + o.note : '')
    + '\n资料原文：\n' + o.piece;
}

/* 出题：教材、讲义这类没有现成题目的资料，按老师的范围/题型/数量/难度/额外要求让 AI 出题。
   数量按段分摊（老师说的是“整份资料一共几道”），一段没分到题就不白花 token。 */
async function aiGenerate(text, subject, subjectName, opts, onProgress) {
  opts = opts || {};
  if (!String(text || '').trim()) throw new Error('请先勾选资料，或在「额外要求」里写下要出题的内容。');
  const wanted = {};
  for (const t of SUPPORTED) {
    const n = Math.max(0, Math.min(50, Math.round(+((opts.types || {})[t]) || 0)));
    if (n) wanted[t] = n;
  }
  if (!Object.keys(wanted).length) throw new Error('请至少填一种题型的数量（大于 0）。');
  const pieces = chunks(text, 6000, 300);
  const plan = pieces.map(() => ({}));
  for (const [t, n] of Object.entries(wanted)) {
    const base = Math.floor(n / pieces.length), rem = n % pieces.length;
    pieces.forEach((_, i) => { const c = base + (i < rem ? 1 : 0); if (c) plan[i][t] = c; });
  }
  const collected = [], rejected = [];
  let done = 0;
  for (let i = 0; i < pieces.length; i++) {
    const counts = plan[i];
    if (!Object.keys(counts).length) continue;
    done++;
    if (onProgress) onProgress('正在根据第 ' + (i + 1) + ' / ' + pieces.length + ' 段出题，已出 ' + collected.length + ' 题…', collected);
    try {
      const prompt = genPrompt({ subjectName, piece: pieces[i], scope: opts.scope, level: opts.level, counts, extra: opts.extra });
      const response = await hximpChat([{ role: 'system', content: '你是严谨的职业院校出题老师。只返回合法 JSON。' }, { role: 'user', content: prompt }], { json: true });
      const result = normalizeQuestions(parseJson(response), subject);
      collected.push(...result.questions);
      rejected.push(...result.rejected);
    } catch (error) {
      error.partialQuestions = collected;
      error.partialRejected = rejected;
      if (onProgress) onProgress('中断了：' + error.message, collected);
      throw error;
    }
  }
  if (!done) throw new Error('资料太短，没凑够一段。多贴一些文字再试。');
  return { questions: collected, rejected };
}

/* 识题：把资料里现成的题原样抠出来（不编题）。资料库里暂时没入口，留给“导入现成试卷”那一轮。 */
async function aiImport(text, subject, onProgress) {
  if (!String(text || '').trim()) throw new Error('请先选择文件或粘贴资料。');
  const pieces = chunks(text);
  const collected = [], rejected = [];
  for (let i = 0; i < pieces.length; i++) {
    if (onProgress) onProgress('正在识别第 ' + (i + 1) + ' / ' + pieces.length + ' 段，已提取 ' + collected.length + ' 题…', collected);
    const response = await hximpChat([
      { role: 'system', content: '你是严谨的试题结构化助手。只返回合法 JSON。' },
      { role: 'user', content: '从下面的资料里把已有的题原样抠出来，不要自己编题。只输出 JSON：{"questions":[...]}\n资料：\n' + pieces[i] }
    ]);
    const r = normalizeQuestions(parseJson(response), subject);
    collected.push(...r.questions); rejected.push(...r.rejected);
  }
  return { questions: collected, rejected };
}

window.HXImp = {
  isImageFile, fileToDataUrl, readMaterial, ocrImages,
  normalizeQuestions, chunks, genPrompt, aiGenerate, aiImport,
  parseJson, TYPE_LABEL, SUPPORTED, HXIMP_AI_MISS, HXIMP_VISION_MISS, HXIMP_LIB_MISS

   用户原话（2026-11-08）：「可以支持导入电子书教材和其他资料让他ai出题，同样的每一个科目

   并给出要执行的 SQL 文件名。 */
'use strict';

const MAT_DB_TIP = '数据库还没建表：请管理员执行 考试/supabase/2026-11-08-科目-资料库-题库.sql';
const MAT_BUCKET = 'exam-material';
// DB 的 qbank.t 取值和引擎的题型名不是一套：single/multiple 都算 choice，judgment 叫 judge
const MAT_DB_T = { single: 'choice', multiple: 'choice', judgment: 'judge', fill: 'fill', short: 'short', term: 'term', prog: 'prog' };
// 出题面板的六种题型（对照 src/paper.js 的 PAPER_TYPES）
const MAT_TYPES = [['single', '单项选择题'], ['fill', '填空题'], ['judgment', '判断题'], ['term', '名词解释'], ['short', '简答题'], ['prog', '程序分析题']];

/* 当前科目的云端 id。null = 还没同步（DB 没建表 / 没登录）→ 这一页只能看不能写。 */
function MAT_sid() {
  const s = (typeof SUBJ !== 'undefined' ? SUBJ : []).find(x => x.key === CUR_SUB);
  return s && s.id != null ? +s.id : null;
}
function MAT_sname() {
  const s = (typeof SUBJ !== 'undefined' ? SUBJ : []).find(x => x.key === CUR_SUB);
  return (s && s.name) || SUBJECTS[CUR_SUB] || CUR_SUB;
}

/* 所有资料库/题库的 rpc 都走这里：统一 try/catch，界面拿到 {ok,data,err} 自己决定怎么写。 */
async function MAT_call(fn, body) {
  try { return { ok: true, data: await rpc(fn, body || {}) }; }
  catch (e) { return { ok: false, err: (e && e.message) || '调用失败' }; }
}
// 只把「多半是没建表」的报错补上 SQL 提示，业务报错（比如资料 40 份满了）保持原话
function MAT_tip(msg) {
  return /does not exist|Could not find|schema cache|not find the function|404/i.test(String(msg || '')) ? MAT_DB_TIP : '';
}
function MAT_banner(msg) {
  const b = $('matBanner') || $('qbBanner');
  if (!b) return toast(msg);
  const tip = MAT_tip(msg);
  b.innerHTML = esc(msg) + (tip ? '<br>' + esc(tip) : '');
  b.hidden = false;
}

/* ---------------- Storage ---------------- */
function MAT_path(ext) {
  const uid = sess && sess.user && sess.user.id;
  if (!uid) throw new Error('登录过期了，请在首页重新登录');
  return uid + '/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7) + (ext || '');
}
async function MAT_put(path, blob, mime) {
  load();
  if (!sess || !sess.access_token) throw new Error('登录过期了，请在首页重新登录');
  const r = await fetch(HXB + '/storage/v1/object/' + MAT_BUCKET + '/' + path, {
    method: 'POST',
    headers: {
      apikey: HXK, Authorization: 'Bearer ' + sess.access_token,
      'Content-Type': mime || 'application/octet-stream', 'x-upsert': 'true'
    },
    body: blob
  }).catch(() => { throw new Error('连不上服务器，请检查网络'); });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error('Storage HTTP ' + r.status + (t ? '：' + String(t).slice(0, 120) : ''));
  }
}
// 删文件是「尽力而为」：表里那条已经删了，文件删不掉最多占点空间，不能因此报错让老师以为没删掉
async function MAT_rm(path) {
  if (!path || !sess || !sess.access_token) return;
  try {
    await fetch(HXB + '/storage/v1/object/' + MAT_BUCKET + '/' + String(path).replace(/^\/+/, ''), {
      method: 'DELETE', headers: { apikey: HXK, Authorization: 'Bearer ' + sess.access_token }
    });
  } catch (e) { /* 忽略 */ }
}

function matBind() {
  const file = $('matFile'), drop = $('matDrop');
  $('matPick').onclick = () => file.click();
  file.onchange = () => { const fs = [...file.files]; file.value = ''; if (fs.length) matUpload(fs); };

  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('on'); }));
  drop.addEventListener('drop', e => { const fs = [...((e.dataTransfer || {}).files || [])]; if (fs.length) matUpload(fs); });
  $('mgGo').onclick = matGenRun;
  $('matRefresh').onclick = () => { if (MAT_sid() == null && typeof loadSubjects === 'function') loadSubjects(); else matReload(); };
}

function MAT_kb(n) {
  n = +n || 0;
  return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' KB' : n + ' B';
}

/* 上传：解析 → 传文件 → 登记 → 写切块。每一步失败都点名是哪一步。 */
async function matUpload(files) {
  if (MAT_BUSY) return toast('正在传上一批，等它传完');
  if (MAT_sid() == null) return MAT_banner('还没有云端科目，传不了资料');
  MAT_BUSY = true;
  const prog = $('matProg'); prog.hidden = false;
  const bad = [], warn = [];
  let okN = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    let step = '解析';
    const say = s => { step = s; prog.textContent = `（${i + 1}/${files.length}）${f.name}：${s}…`; };
    try {
      say('读文件');
      const got = await HXImp.readMaterial(f);
      let text = String(got.text || '');
      if (got.image) {
        say('AI 识图（这一步要等模型）');
        text = await HXImp.ocrImages([got.image]);
      }
      text = text.replace(/\r/g, '').trim();
      if (!text) throw new Error('没读到任何文字（可能是空白页或加密文件）');

      say('上传原文件');
      const ext = (f.name.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
      const path = MAT_path(ext);
      await MAT_put(path, f, f.type);

      say('登记到资料库');
      const saved = await rpc('hx_exam_mat_save', {
        p_subject_id: MAT_sid(), p_name: f.name, p_mime: f.type || '', p_bytes: f.size, p_path: path, p_chars: text.length
      });
      const mid = saved && saved.id;
      if (!mid) throw new Error('云端没返回资料编号');

      const list = HXImp.chunks(text, 3600, 320);
      const keep = list.slice(0, 400);   // hx_exam_chunk_put 一次最多 400 块
      say(`写入切块 ${keep.length} 段`);
      await rpc('hx_exam_chunk_put', { p_material_id: mid, p_chunks: keep.map((body, idx) => ({ idx, title: '', body })) });
      if (list.length > keep.length) warn.push(f.name + '：资料太长，只存了前 ' + keep.length + ' 段（约 ' + keep.length * 3280 + ' 字），出题只会在这些段里找依据');
      okN++;
    } catch (e) {
      bad.push(f.name + '：「' + step + '」这一步失败 —— ' + (e && e.message ? e.message : e));
    }
  }
  MAT_BUSY = false;
  prog.textContent = (okN ? `传好 ${okN} 份。` : '') + (warn.length ? ' ' + warn.join('；') + '。' : '')
    + (bad.length ? ' 有 ' + bad.length + ' 份没传成：' + bad.join('；') : '');
  if (!bad.length) toast('上传完成');
  await matReload();
  // 科目列表里的「资料 N 份」跟着变
  if (typeof loadSubjects === 'function') loadSubjects();
}

async function matGenRun() {
  if (MAT_BUSY) return toast('正在忙，等这一步结束');
  const types = {};
  for (const [t] of MAT_TYPES) types[t] = Math.max(0, Math.min(50, Math.round(+$('mg_' + t).value || 0)));
  if (!Object.values(types).some(n => n > 0)) return toast('先填一种题型的数量');

  const picks = [...document.querySelectorAll('[data-mpick]:checked')].map(x => +x.dataset.mpick);
  const extra = $('mgExtra').value.trim();
  const scope = $('mgScope').value.trim(), level = $('mgLevel').value;
  let text = '', tag = '', mid = null;
  const state = $('mgState');

  if (picks.length) {
    // 多份资料拼在一起：AI 看到的是「资料一…资料二…」，出题时按段分摊

/* 新科目代号：能取到纯英文名就用它（如 Electronics → electronics），否则 sub + 时间戳。
   云端只认 ^[a-z][a-z0-9_-]{0,23}$，这里必须先生成合法的，别等 rpc 报错。 */
function subKey(name) {
  const ascii = String(name).toLowerCase().replace(/[^a-z0-9]/g, '');
  if (ascii.length >= 3 && /^[a-z]/.test(ascii)) return ascii.slice(0, 20);
  return 'sub' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
}

  if (!name) return;

    const r = await rpc('hx_exam_subject_del', { p_id: s.id });

/* 开机 / 换账号时整站重进。── 必须防重入（2026-11-06 实测踩到）──
   理论试卷的预览 iframe 是 srcdoc，和父页面同源；iframe 里任何写 paike-session 的动作
   都会让父页面收到 storage 事件 → boot() → 重画 #appMain → 重建 iframe → 再触发……
   实测点了「理论试卷」后 boot 跑了 300+ 次、hxpag 发了 3.8 万次，页面卡死。
   线上正常不会有人往 iframe 里写会话（那是测试桩干的），但同源 srcdoc + storage 监听
   这个组合本身就不该无限重进：加个进行中标志，同一时刻只跑一份。 */
let booting = false, bootDone = false;
/* 上次见到的账号 id：storage 事件里用来判断「是不是真的换了人」 */
let lastUid = null;
async function boot() {
  if (booting) return;
  booting = true;
  try {
    const t = await bootOnce();
    bootDone = true;
    return t;
  } finally { booting = false; }
}
async function bootOnce() {
  load();
  lastUid = sess && sess.user ? sess.user.id : null;
  if (!sess || !sess.access_token) return gate('登录后考试', '老师在这里发布考试，学生输老师公布的码取题', '登录', login);
  try { ME.me = await rpc('hx_me'); } catch (e) { if (e.status === 401) return gate('登录过期了', '请在首页重新登录', '登录', login); return gate('出错了', e.message); }
  if (ME.me.teacher) { teacherShell(); return; }
  if (ME.me.student) return studentHome();
  gate('账号还没开通', '在首页右上角的账号里填邀请码', '去首页', () => { const p = window.HXTheme && HXTheme.portal(); p ? p.home() : (location.href = '../'); });
}
function gate(t, sub, btn, fn) {
  app().innerHTML = `<div class="ex-gate card"><h1>${esc(t)}</h1><p class="note">${esc(sub)}</p>${btn ? `<button class="pri big" id="gGo">${esc(btn)}</button>` : ''}</div>`;
  if (btn) $('gGo').onclick = fn;
}

      <div class="errs" id="sMsg" ${msg ? '' : 'hidden'}>${esc(msg || '')}</div><button class="pri big" id="sGo">取题</button></div>`;
  const go = async () => {

  $('sGo').onclick = go; $('sCode').onkeydown = e => { if (e.key === 'Enter') go(); };
}
// 考场：每题一张卡片（题目、编辑区、编译检查、看现象、下载）；右边交卷。preview：老师预览，不能交
function room(code, r, back) {
  const no = r.preview ? '预览' : r.no;
  let paper;
  try { paper = examPaper(no, r.paper); } catch (e) { return back ? back(e.message) : studentHome(e.message); }
  const draftKey = 'exam.draft.' + r.id + '.' + no, saved = r.answers || {}, draft = store.get(draftKey, {});
  const total = paper.reduce((a, v) => a + (v.pts || 0), 0), boards = [];
  app().innerHTML = `<header class="ex-h"><div class="eyebrow">${r.preview ? '老师预览 · 学号按“预览”出题' : esc(r.name) + ' · ' + esc(r.no)}</div><h1>${esc(r.title)}</h1>
      <p>${SUBJECTS[r.subject] || ''} · 共 ${paper.length} 题 · 满分 ${total} · 卷号 ${paper[0].paper}</p></header>
    <div class="with-rail"><div class="rail-main">${paper.map((v, i) => `<div class="card">${questionHTML(v, { qno: i + 1, extra: `<span class="tag na">${v.pts} 分</span>` })}
      <textarea class="editor" data-ed="${i}" spellcheck="false" aria-label="第${i + 1}题程序">${esc(draft[i + 1] || saved[i + 1] || paperFile(v, { stuId: no, qno: i + 1, paper: v.paper }))}</textarea>
      <div class="row" style="margin-top:8px"><button data-cc="${i}">编译检查</button><button data-ref="${i}">看要求的现象</button><button data-dl="${i}">下载 .c</button><button data-hex="${i}">生成 HEX</button></div>
      <div data-out="${i}"></div><div data-board="${i}"></div></div>`).join('')}</div>
    <aside class="rail"><div class="card"><h2>交卷</h2><div class="note" id="subState">${r.at ? '已交过：' + when(r.at) + '，收卷前可以重交，以最后一次为准' : '还没交'}</div>
      <div class="row" style="margin-top:10px">${r.preview ? '' : '<button class="pri" id="btnSub">交卷</button>'}<button id="btnBack">${r.preview ? '返回' : '换一个码'}</button></div>
      <p class="note">程序随手存在这台设备上；交卷才会存到老师那里。老师收卷后就交不了了。</p></div></aside></div>`;
  const val = i => app().querySelector(`[data-ed="${i}"]`).value;
  app().querySelectorAll('[data-ed]').forEach(t => t.oninput = () => { const d = store.get(draftKey, {}); d[+t.dataset.ed + 1] = t.value; store.set(draftKey, d); });
  app().querySelectorAll('[data-cc]').forEach(b => b.onclick = () => {
    const i = +b.dataset.cc, A = compileC(val(i)), out = app().querySelector(`[data-out="${i}"]`);
    out.innerHTML = A.ok ? '<div class="note" style="color:var(--ok)">编译通过（0 错误）。现象对不对要自己在虚拟板或 Proteus 上看</div>' : `<div class="errs"><b>编译错误：</b><br>${A.errors.map(esc).join('<br>')}</div>`;
  });
  app().querySelectorAll('[data-ref]').forEach(b => b.onclick = () => {
    const i = +b.dataset.ref, box = app().querySelector(`[data-board="${i}"]`);
    if (boards[i]) { boards[i].stop(); boards[i] = null; box.innerHTML = ''; b.textContent = '看要求的现象'; return; }
    boards[i] = makeBoard(box, { note: '这是题目要求的现象，你的程序要做到一样' }); boards[i].start(paper[i], paper[i].ref); b.textContent = '收起虚拟板';
  });
  app().querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { const i = +b.dataset.dl; downloadC(`${no}_Q${i + 1}.c`, val(i)); });
  app().querySelectorAll('[data-hex]').forEach(b => b.onclick = () => { const i = +b.dataset.hex, name = `${no}_Q${i + 1}.hex`; app().querySelector(`[data-out="${i}"]`).innerHTML = hexResultHTML(name, makeHexFile(name, val(i))); });
  $('btnBack').onclick = () => { boards.forEach(x => x && x.stop()); back ? back() : studentHome(); };
  if ($('btnSub')) $('btnSub').onclick = async () => {
    if (!confirm('交卷？收卷前还可以改了再交。')) return;
    const ans = {}; paper.forEach((v, i) => { ans[i + 1] = val(i); });
    $('btnSub').disabled = true;
    try { const t = await rpc('hx_exam_submit', { p_code: code, p_answers: ans }); $('subState').textContent = '已交卷：' + when(t) + '，收卷前可以重交'; toast('已交卷'); }
    catch (e) { toast(e.message); } finally { $('btnSub').disabled = false; }
  };
}

/* ---------------- 老师：发布、收卷、批改 ---------------- */
let CLASSES = null;
async function teacherHome(msg) {
  app().innerHTML = `<header class="ex-h"><div class="eyebrow">教师</div><h1>考试</h1><p>发布给哪几个班，学生在首页登录后输码取题</p>
    <p class="note">三步：①在「组卷与组卷码」页组好卷、复制那一串码 → ②回到本页点「发布考试」，把码粘到表单下面的「或者粘贴…」一栏，选班级、点发布 → ③课上把发布后得到的短码公布给学生。</p></header>
    ${msg ? `<div class="errs" style="margin-bottom:12px">${esc(msg)}</div>` : ''}
    <div class="row" style="margin-bottom:14px"><button class="pri" id="btnNew">发布考试</button><button id="btnTake">用码取题</button></div><div id="list">${fxLoad('加载中…')}</div>`;
  if (window.HXLoadFx) HXLoadFx.auto($('list'));
  $('btnNew').onclick = () => editExam(null);
  /* 「用码取题」只认已经发布过的考试（hx_exam_take 查的是 hx_exam 表）。
     2026-11-08 用户把「组卷与组卷码」页刚生成的组卷码粘进来，得到一句「没有这个组卷码」，
     完全不知道下一步该干什么 —— 现在把两条路的区别讲清楚，并直接把他送到发布表单、码也带过去。 */
  $('btnTake').onclick = async () => {
    const c = prompt('输入组卷码或学生短码（预览自己发布的考试）'); if (!c) return;
    const code = c.trim();
    try { const r = await rpc('hx_exam_take', { p_code: code }); room(code, r, teacherHome); }
    catch (e) {
      const unpublished = /没有这个组卷码|不存在|not found|invalid/i.test(e.message || '');
      if (!unpublished) return toast(e.message);
      const go = confirm(`「${code}」还没发布成考试，所以取不到题。\n\n`
        + `说明：「组卷与组卷码」页生成的是组卷码（稿子），只有用它发布成考试之后，学生才取得到题。\n\n`
        + `现在去发布？点「确定」跳到发布表单，这个码已经替你填好，你只要选班级、点发布。`);
      if (go) editExam(null, { paper: code });
    }
  };
  let list;
  try { [list, CLASSES] = await Promise.all([rpc('hx_exam_mine'), CLASSES || rpc('hx_my_classes')]); }
  catch (e) { $('list').innerHTML = `<div class="errs">${esc(e.message)}${/hx_exam/.test(e.message) ? '<br>数据库还没有考试表：管理员在 Supabase 运行 考试/supabase/exam-schema.sql' : ''}</div>`; return; }
  const cname = id => (CLASSES.find(c => c.id === id) || {}).name || '（已删的班）';
  $('list').innerHTML = list.length ? list.map(x => `<div class="card ex-item${x.open ? '' : ' shut'}"><div class="ex-code-big">${esc(x.code)}</div>
      <div class="ex-meta"><b>${esc(x.title)}</b><span class="note">${SUBJECTS[x.subject] || x.subject} · ${x.classes.map(cname).map(esc).join('、') || '没选班'} · ${x.subs} 人交卷 · ${x.open ? '考试中' : '已收卷'}</span><span class="note mono">${esc(x.paper)}</span></div>
      <div class="row"><button data-subs="${x.id}" class="pri">交卷与批改</button><button data-open="${x.id}">${x.open ? '收卷' : '重新开放'}</button><button data-edit="${x.id}">修改</button><button data-pre="${esc(x.code)}">预览</button><button data-del="${x.id}" class="danger">删除</button></div></div>`).join('')
    : '<div class="card"><p class="note">还没有考试。点“发布考试”：选题、选班，网页给你一个码，课上公布给学生。</p></div>';
  const byId = id => list.find(x => x.id === +id);
  $('list').querySelectorAll('[data-subs]').forEach(b => b.onclick = () => subs(byId(b.dataset.subs)));
  $('list').querySelectorAll('[data-open]').forEach(b => b.onclick = async () => { const x = byId(b.dataset.open); try { await rpc('hx_exam_open', { p_id: x.id, p_open: !x.open }); toast(x.open ? '已收卷：学生交不了了' : '已重新开放'); teacherHome(); } catch (e) { toast(e.message); } });
  $('list').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editExam(byId(b.dataset.edit)));
  $('list').querySelectorAll('[data-pre]').forEach(b => b.onclick = () => rpc('hx_exam_take', { p_code: b.dataset.pre }).then(r => room(b.dataset.pre, r, teacherHome)).catch(e => toast(e.message)));
  $('list').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { const x = byId(b.dataset.del); if (!confirm(`删除“${x.title}”和 ${x.subs} 份交卷？删了找不回来。`)) return; try { await rpc('hx_exam_delete', { p_id: x.id }); toast('已删除'); teacherHome(); } catch (e) { toast(e.message); } });
}
// 发布 / 修改：标题、题目（母题、题型、分值、全班同一题）或直接粘贴单片机里生成的组卷码、班级、可选的好记名字
function editExam(x, pre) {
  /* pre：从「用码取题」失败跳过来时带的 { paper }，把组卷码预先填进「或者粘贴…」那一栏，
     老师只要选班级就能发布（2026-11-08 加）。 */
  pre = pre || {};
  const spec = x && parseExamCode(x.paper);
  /* pin（题库里挑的第几个变式）也要带过来：以前只认 draw，老师一「修改」再保存，
     题库挑的题就被悄悄换成随机的了 —— 判分重算、学生看到的题也变了。 */
  let rows = spec ? spec.qs.map(q => ({ mid: q.mid ? q.mid.slice(1) : '0', type: ({ fill: 't', modify: 'g', fix: 'c' })[q.type], pts: q.pts, same: q.draw != null || q.pin != null, pin: q.pin })) : [{ mid: '0', type: 't', pts: 30, same: false }, { mid: '0', type: 'g', pts: 35, same: false }, { mid: '0', type: 'c', pts: 35, same: false }];
  const key = spec ? spec.key : 'Q' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const own = (CLASSES || []).filter(c => (c.tools || []).includes('exam')); // 首页点亮「考试」才算开通（空数组不再等于全开）
  const sel = new Set(x ? x.classes : []);
  const draw = () => {
    app().innerHTML = `<header class="ex-h"><div class="eyebrow">${x ? '修改考试' : '发布考试'}</div><h1>${x ? esc(x.title) : '新考试'}</h1></header>
    <div class="card"><div class="ex-form">
      <label>标题<input id="fTitle" maxlength="40" value="${esc(x ? x.title : '')}" placeholder="例如 期末上机 A 卷"></label>
      <label>科目<select id="fSub"><option value="mcu">单片机上机</option></select></label>
      <label>口令<input id="fKey" maxlength="16" value="${esc(key)}" class="mono"></label>
      <label>学生输的码<input id="fCode" maxlength="20" value="${esc(x ? x.code : '')}" placeholder="留空自动生成 6 位码，或起个名字如 期末A"></label></div>
      <h2 style="margin-top:16px">题目</h2>
      <table class="mini ex-rows"><thead><tr><th>#</th><th>母题</th><th>题型</th><th>分值</th><th>全班同一题</th><th></th></tr></thead><tbody>${rows.map((q, i) => `<tr>
        <td>${i + 1}</td><td><select data-k="mid" data-i="${i}"><option value="0">随机</option>${MOTHERS.slice(0, 6).map((m, n) => `<option value="${n + 1}" ${q.mid === String(n + 1) ? 'selected' : ''}>M${n + 1} ${esc(m.title || m.name || '')}</option>`).join('')}</select></td>
        <td><select data-k="type" data-i="${i}">${TYPES.map(([k, n]) => `<option value="${k}" ${q.type === k ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
        <td><input data-k="pts" data-i="${i}" type="number" min="1" max="100" value="${q.pts}" style="width:70px"></td>
        <td><input data-k="same" data-i="${i}" type="checkbox" ${q.same ? 'checked' : ''}></td><td><button class="sm" data-rm="${i}" ${rows.length < 2 ? 'disabled' : ''}>删</button></td></tr>`).join('')}</tbody></table>
      <div class="row" style="margin-top:8px"><button class="sm" id="addQ" ${rows.length >= 5 ? 'disabled' : ''}>加一题</button><span class="note" id="fTotal"></span></div>
      <label class="ex-paste">或者粘贴单片机里生成的组卷码<input id="fPaste" class="mono" value="${esc(pre.paper || '')}" placeholder="QM25-2t30-4g35.3-6c35"></label>
      <h2 style="margin-top:16px">考试的班级</h2>
      <div class="ex-cls">${own.length ? own.map(c => `<label><input type="checkbox" data-c="${c.id}" ${sel.has(c.id) ? 'checked' : ''}>${esc(c.name)}${c.term ? ' · ' + esc(c.term) : ''}</label>`).join('') : '<p class="note">还没有班级：在首页“班级”里导入考勤表，勾上“考试”</p>'}</div>
      <div class="errs" id="fMsg" hidden></div>
      <div class="row" style="margin-top:16px"><button class="pri big" id="fSave">${x ? '保存' : '发布'}</button><button id="fBack">返回</button></div></div>`;
    const total = () => { $('fTotal').textContent = '满分 ' + rows.reduce((a, q) => a + (+q.pts || 0), 0); };
    total();
    app().querySelectorAll('[data-k]').forEach(el => el.onchange = el.oninput = () => { const q = rows[+el.dataset.i]; q[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; total(); });
    app().querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.rm, 1); draw(); });
    app().querySelectorAll('[data-c]').forEach(b => b.onchange = () => { b.checked ? sel.add(+b.dataset.c) : sel.delete(+b.dataset.c); });
    $('addQ').onclick = () => { rows.push({ mid: '0', type: 'g', pts: 20, same: false }); draw(); };
    $('fBack').onclick = teacherHome;
    $('fSave').onclick = async () => {
      const fail = m => { $('fMsg').textContent = m; $('fMsg').hidden = false; };
      const title = $('fTitle').value.trim(); if (!title) return fail('请填标题');
      let paper = $('fPaste').value.trim();
      if (paper) { if (!parseExamCode(paper)) return fail('粘贴的组卷码格式不对'); }
      else {
        const k = $('fKey').value.trim(); if (!/^[A-Za-z0-9]{1,16}$/.test(k)) return fail('口令只能是 1～16 位字母或数字');
        paper = makeExamCode(k, rows.map(q => ({ mid: +q.mid ? 'M' + q.mid : null, type: ({ t: 'fill', g: 'modify', c: 'fix' })[q.type], pts: Math.max(1, Math.min(100, +q.pts || 0)), draw: q.same && q.pin == null ? 1 : null, pin: q.same && q.pin != null ? q.pin : null })));
      }
      if (parseExamCode(paper).fp) return fail('这套卷用到了单片机里导入的书上代码，网页考试还不支持；请只用 M1～M6 母题');
      if (!sel.size && !confirm('没选班级，学生取不到题。先保存？')) return;
      $('fSave').disabled = true;
      try { const r = await rpc('hx_exam_save', { p_id: x ? x.id : null, p_subject: $('fSub').value, p_title: title, p_paper: paper, p_classes: [...sel], p_code: $('fCode').value.trim() || null }); toast((x ? '已保存' : '已发布') + '，学生输：' + r.code); teacherHome(); }
      catch (e) { fail(e.message); $('fSave').disabled = false; }
    };
  };
  draw();
}
// 交卷与批改：逐人逐题编译 + 模拟判分（浏览器里算，不上传），导出 CSV
async function subs(x) {
  app().innerHTML = `<header class="ex-h"><div class="eyebrow">交卷与批改 · ${esc(x.code)}</div><h1>${esc(x.title)}</h1><p class="mono">${esc(x.paper)}</p></header>
    <div class="row" style="margin-bottom:12px"><button class="pri" id="btnGrade">全部批改</button><button id="btnCsv">导出成绩 CSV</button><button id="btnBack">返回</button><span class="note" id="gState"></span></div><div class="card" id="tbl">${fxLoad('加载中…')}</div><div id="detail"></div>`;
  if (window.HXLoadFx) HXLoadFx.auto($('tbl'));
  $('btnBack').onclick = teacherHome;
  let rows;
  try { rows = await rpc('hx_exam_subs_of', { p_id: x.id }); } catch (e) { $('tbl').innerHTML = `<div class="errs">${esc(e.message)}</div>`; return; }
  const n = (parseExamCode(x.paper) || { qs: [] }).qs.length;
  const draw = () => {
    $('tbl').innerHTML = rows.length ? `<table class="mini"><thead><tr><th>班级</th><th>学号</th><th>姓名</th><th>交卷时间</th>${Array.from({ length: n }, (_, i) => `<th>第${i + 1}题</th>`).join('')}<th>总分</th></tr></thead><tbody>${rows.map((r, k) => `<tr data-r="${k}" style="cursor:pointer"><td>${esc(r.class_name)}</td><td class="mono">${esc(r.student_no)}</td><td>${esc(r.name)}</td><td>${when(r.at)}</td>${Array.from({ length: n }, (_, i) => `<td>${r.res ? r.res[i].got + '/' + r.res[i].pts : '—'}</td>`).join('')}<td><b>${r.res ? r.total : '—'}</b></td></tr>`).join('')}</tbody></table>`
      : '<p class="note">还没有人交卷。</p>';
    $('tbl').querySelectorAll('[data-r]').forEach(tr => tr.onclick = () => one(rows[+tr.dataset.r]));
  };
  // 判分引擎每题按 100 分算，换成这题的分值
  const gradeOne = r => { const paper = examPaper(r.student_no, x.paper); r.res = paper.map((v, i) => { const z = gradeVariant(v, (r.answers || {})[i + 1] || ''); z.pts = v.pts; z.got = z.max ? Math.round(z.score / z.max * v.pts * 10) / 10 : 0; return z; }); r.total = Math.round(r.res.reduce((a, b) => a + b.got, 0) * 10) / 10; };
  const one = r => { if (!r.res) gradeOne(r); draw(); $('detail').innerHTML = `<div class="card"><h2>${esc(r.name)} · ${esc(r.student_no)} · ${r.total} 分</h2>${r.res.map((res, i) => `<h3>第${i + 1}题 · ${res.got}/${res.pts} 分</h3><pre class="code">${esc((r.answers || {})[i + 1] || '（没写）')}</pre>${resultHTML(res, { noText: true })}`).join('')}</div>`; mountPlayers && mountPlayers($('detail')); $('detail').scrollIntoView({ behavior: 'smooth' }); };
  draw();
  $('btnGrade').onclick = async () => {
    $('btnGrade').disabled = true;
    for (let k = 0; k < rows.length; k++) { $('gState').textContent = `批改中 ${k + 1}/${rows.length}…`; await new Promise(r => setTimeout(r, 0)); try { gradeOne(rows[k]); } catch (e) { rows[k].res = null; } }
    $('gState').textContent = '已批改 ' + rows.length + ' 份'; $('btnGrade').disabled = false; draw();
  };
  $('btnCsv').onclick = () => {
    if (rows.some(r => !r.res)) return toast('先点“全部批改”');
    const head = ['班级', '学号', '姓名', '交卷时间', ...Array.from({ length: n }, (_, i) => '第' + (i + 1) + '题'), '总分'];
    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    downloadText(x.title + '_成绩.csv', [head, ...rows.map(r => [r.class_name, '\t' + r.student_no, r.name, when(r.at), ...r.res.map(z => z.got), r.total])].map(a => a.map(q).join(',')).join('\r\n'), 'text/csv');
  };
}

/* 别处登录/退出（首页、别的标签页）才重进。同源 srcdoc 预览页也算「别处」，
   所以再加一道判断：会话里的用户没变就别白跑一遍（boot 自己也有防重入）。 */
addEventListener('storage', e => {
  if (e.key !== SKEY) return;
  const s = load();
  const uid = s && s.user ? s.user.id : null;
  if (bootDone && uid === lastUid) return;
  lastUid = uid;
  boot();
});
// 首屏闪屏（build.js 里写死的 #hxBoot）：由 src/loadfx.js 接管——canvas 随机挑一个 pixelfx 特效
// （会话内固定），播不起来就把 canvas 藏掉只留下面的药丸，绝不允许空屏。
// 2026-11-06 修时序：boot() 已挪到 build.js 产物的 #hxBoot 标记后面立刻调用（第一帧就有像素动效），
// 这里只负责内容就绪后收场，不再重复 arm（重复调用也会被 dataset.armed 挡住）。
boot().then(() => { if (window.HXLoadFx) HXLoadFx.finishBoot(); }); // boot 出结果（进应用/登录门/错误门）就收闪屏
</script>
</body>
