  function lite() { return document.documentElement.classList.contains('hx-lite'); }
  function still() { return lite() || (reduced && reduced.matches); }

  // 布局样式只注入一次：.hx-fxwrap 是「canvas + 药丸」的容器（页面内嵌版铺在 host 里，
  // full 版铺满整页给首屏闪屏用）。药丸本体样式沿用 hx-theme.js 注入的 #hx-pill-style。
  var css = ''
    + '.hx-fxwrap{display:grid;place-items:center;gap:clamp(12px,1.6vh,26px);padding:clamp(24px,4vw,56px) 12px;box-sizing:border-box}'
    + '.hx-fxwrap.full{position:fixed;inset:0;z-index:2147482000;background:var(--card-solid,#f6f6f4)}'
    + '.hx-fxcv{image-rendering:pixelated;display:block;max-width:100%}'
    // 药丸在动效下面当状态说明。字号一处 clamp、内部方块/文字全 em（全站规矩），
    // 2026-11-06 整体抬一档：1080p 上 24px 左右，不再是「动效很大、字很小」的失衡感。
    + '.hx-fxwrap .hx-loadpill{font-size:clamp(15px,1vw + 8px,28px)}'
    + '.hx-fxwrap.panel{padding:clamp(14px,2vh,28px) 12px}'
    + '.hx-fxwrap.panel .hx-loadpill{font-size:clamp(13px,.8vw + 7px,22px)}'
    + '.hx-fxwrap.out .hx-fxcv,.hx-fxwrap.out .hx-loadpill{opacity:0;transition:opacity .25s ease}'
    // 首屏闪屏（考试 / 刷题共用）：#hxBoot 是写在 HTML 里的那一层，boot() 接管 canvas。
    // 底色和页面同色，淡出时只淡整层，不会露出半成品页面再闪一下。
    + '.hx-boot{position:fixed;inset:0;z-index:2147482000;display:grid;place-items:center;'
    + 'background:var(--card-solid,#f6f6f4);transition:opacity .26s ease,visibility 0s linear .26s}'
    + '.hx-boot.out{opacity:0;visibility:hidden;pointer-events:none}'
    + '.hx-boot-card{display:grid;place-items:center;gap:clamp(14px,2vh,30px);padding:24px;text-align:center}'
    + '.hx-boot-card .hx-loadpill{font-size:clamp(16px,1.1vw + 9px,30px);box-shadow:none}'
    + '.hx-boot-title{font:600 clamp(19px,1.5vw + 8px,36px)/1.25 var(--hx-font,-apple-system,"PingFang SC","Microsoft YaHei UI",sans-serif);'
    + 'color:var(--ink,#0b1220);letter-spacing:.02em;margin:0}'
    + 'html.hx-lite .hx-boot-card canvas{display:none}'
    + '@media (prefers-reduced-motion:reduce){.hx-boot-card canvas{display:none}}';
  (function () {
    var st = document.createElement('style');
    st.id = 'hx-loadfx-style';
    st.textContent = css;
    (document.head || document.documentElement).appendChild(st);
  })();

  // 按视口算整数放大倍数（像素画非整数缩放会糊）。
  // 首屏：短边 70% 定上限（2026-11-07 用户「再放大点」，62% → 70%），3～8 倍；
  // 面板内嵌：上限收紧，2～4 倍，放进卡片不撑爆。
  function fit(cv, m, compact) {
    var vw = window.innerWidth || 960, vh = window.innerHeight || 640;
    var maxW = compact ? Math.min(vw * 0.72, 340) : vw * 0.72;
    var maxH = compact ? Math.min(vh * 0.3, 260) : vh * 0.70;
    var k = Math.floor(Math.min(maxW / m.size[0], maxH / m.size[1]));
    // 上限 12：56px 的小特效在 1080p 也能放大到 ~620px，和 128px 大特效（5 倍 640px）
    // 视觉体量接近——不然随机抽到小特效那几把，「动效明显小一圈」。
    k = Math.max(compact ? 2 : 3, Math.min(compact ? 4 : 12, k || 0));
    cv.style.width = (m.size[0] * k) + 'px';
    cv.style.height = (m.size[1] * k) + 'px';
  }

  // 抽签（2026-11-05 返修）：**每次调用都重新随机**，只排除「上一次这个工具用过的 id」，
  // 保证连开两次一定不一样。「上一次」存 sessionStorage，仅作排除项，不再用来固定本次选择；
  // 同一会话里反复打开不再永远同一个特效（旧版 hx-loadfx-<tool> 固定键废弃，读到也忽略）。
  function pickId(tool) {
    var P = window.PixelFX;
    if (!P || !P.ids || !P.ids.length) return '';
    var K = 'hx-loadfx-last-' + tool, pool = P.ids, prev = '', i, cand = [];
    try { prev = sessionStorage.getItem(K) || ''; } catch (e) { }
    if (prev) {
      for (i = 0; i < pool.length; i++) if (pool[i] !== prev) cand.push(pool[i]);
      if (cand.length) pool = cand;               // 只有 1 个特效时只能重复，不硬造空池
    }
    var id = pool[Math.floor(Math.random() * pool.length)] || '';
    try { if (id) sessionStorage.setItem(K, id); } catch (e) { }
    return id;
  }

  // 在指定 canvas 上起一个特效引擎；起不来返回 null（调用方决定回落）
  function start(cv, tool, compact) {
    var P = window.PixelFX;
    if (!cv || !cv.getContext || !P || !P.effects || !P.ids || !P.ids.length) return null;
    var id = pickId(tool);
    var mod = P.effects[id];
    if (!mod || !mod.meta) return null;
    var m = mod.meta, W = m.size[0], H = m.size[1], O = m.origin || [W / 2, H / 2];
    cv.width = W; cv.height = H;
    cv.setAttribute('data-fx', id);
    if (!cv.className) cv.className = 'hx-fxcv';
    var ctx = cv.getContext('2d');
    if (!ctx) return null;
    fit(cv, m, compact);
    addEventListener('resize', function () { fit(cv, m, compact); });
    var img = ctx.createImageData(W, H), fr = P.createFrame(W, H);
    // one-shot 特效（meta.loop === false）播完 meta.duration 就重开一个：
    // 接线仿真的 hit-spark 只有 0.5 秒，闪屏保底 0.9 秒，不重播的话后 0.4 秒是一张空画布。
    var oneShot = m.loop === false, life = +m.duration || 0, age = 0;
    function spawn() {
      age = 0;
      return P.createFx(mod, { x: O[0], y: O[1], seed: Math.floor(Math.random() * 997) });
    }
    var fx = spawn();
    var touch = window.matchMedia ? matchMedia('(hover: none), (pointer: coarse)').matches : false;
    var GAP = (touch || lite()) ? 1000 / 18 : 1000 / 30;
    var raf = 0, last = 0, stopped = false;
    function paint(dt) {
      if (dt) {
        fx.update(dt);
        if (oneShot && life) { age += dt; if (age >= life) fx = spawn(); }  // one-shot 到期重播
      }
      P.clearFrame(fr); fx.draw(fr, 'back'); fx.draw(fr, 'front');
      P.composite(fr, img.data, null);
      ctx.clearRect(0, 0, W, H); ctx.putImageData(img, 0, 0);
    }
    function step(now) {
      raf = 0; if (stopped) return;
      // 面板重新渲染（innerHTML 换掉）后 canvas 已脱离文档：停循环，别在后台白烧 GPU
      if (!cv.isConnected) { stopped = true; return; }
      if (last && now - last < GAP - 1) { raf = requestAnimationFrame(step); return; } // 帧率封顶
      var dt = last ? Math.min((now - last) / 1000, 0.12) : 0;
      last = now; paint(dt);
      raf = requestAnimationFrame(step);
    }
    // 首帧（2026-11-05 返修）：
    //   · loop 特效：不少前 0.3～0.5 秒才长出主体，先在内存里按 1/60 步长预跑 0.35 秒
    //     （只 update，不 putImageData），再把这一帧一次性上屏，第一眼就有主体且继续在动；
    //   · one-shot 特效：第 0 帧就是峰值（实测 hit-spark t=0 实心 22.5%），预跑反而把动画放完，
    //     所以直接从 0 帧开播。预跑不建 rAF、不额外上屏，性能红线不变。
    if (!oneShot) for (var t = 0; t < 0.35; t += 1 / 60) fx.update(1 / 60);
    paint(0);
    last = performance.now();   // 下一帧直接吃真实 dt，不再补一帧 dt=0 的重复画面
    raf = requestAnimationFrame(step);
    return {
      stop: function () { stopped = true; if (raf) { cancelAnimationFrame(raf); raf = 0; } },
      fx: id
    };
  }

  // 造一条「方块 + 文字」药丸（回落时也用这一条，保证屏幕上永远只有一套加载语言）
  function pillEl(text) {
    var pill = document.createElement('div');
    pill.className = 'hx-loadpill sm';
    pill.setAttribute('role', 'status');
    var px = '<span class="hx-px" aria-hidden="true">', i;
    for (i = 0; i < 7; i++) px += '<i style="--i:' + i + '"></i>';
    pill.innerHTML = px + '</span><b></b>';
    pill.querySelector('b').textContent = text || '正在载入…';
    return pill;
  }

  // 页面内嵌版：往 host 里画「canvas + 药丸(方块+文字)」，返回 { el, done() }；播不了返回 null
  // opts.compact：面板/表格里的小号（2～4 倍、留白收紧）
  function mount(host, tool, text, full, opts) {
    var compact = !!(opts && opts.compact);
    if (!host || still()) return null;                 // 关动画 / 省电：回落，由调用方画药丸
    var cv = document.createElement('canvas');
    cv.className = 'hx-fxcv';
    var eng = start(cv, tool, compact);
    if (!eng) return null;                             // 包没出来 / canvas 建不出来：回落
    var pill = pillEl(text);
    var wrap = document.createElement('div');
    wrap.className = 'hx-fxwrap' + (full ? ' full' : '') + (compact ? ' panel' : '');
    wrap.setAttribute('aria-hidden', 'true');
    wrap.appendChild(cv); wrap.appendChild(pill);
    host.appendChild(wrap);
    // 最少停留（2026-11-05：420 → 640ms）：本地题库 30ms 就回来，秒闪一下反而像故障；
    // 面板小号也给足时间，短于 0.6 秒根本看不出像素在动。
    var at = performance.now(), MIN_SHOW = 640, out = false;
    return {
      el: wrap,
      fx: eng.fx,
      done: function () {                              // 淡出并整体移除；动效要活到移除那一刻
        if (out) return; out = true;
        setTimeout(function () {
          wrap.classList.add('out');
          // 2026-11-05 五修：**stop 必须放在移除之后**。原来先 eng.stop() 再淡出，
          // 数据一就绪（手机上 0.3~0.7s）画面就冻住，淡出的那 240ms 是一张静止图 ——
          // 用户看到的正是「一个像素动效的加载画面且不会动」。
          setTimeout(function () {
            if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
            eng.stop();
          }, 240);
        }, Math.max(0, MIN_SHOW - (performance.now() - at)));
      }
    };
  }

  // 首屏闪屏版（刷题 / 考试共用）：页面里先写好
  //   <div class="hx-boot" id="hxBoot"><div class="hx-boot-card"><canvas></canvas><div class="hx-loadpill sm">…</div></div></div>
  // 解析到它时（body 开头）就调 boot()：**第一帧就是 canvas 动效 + 药丸**，不会再出现裸文字阶段。
  // canvas 播不起来就把 canvas 藏掉，只留药丸（fallback 不空屏）。
  // finishBoot() 由工具在数据就绪后调：先保底 MIN_SHOW 再整层淡出移除。
  var bootH = null;
  // 2026-11-05：520 → 900ms。接线仿真在手机上约 0.7 秒就绪就淡出，动效刚进主体就被拿走；
  // 加载本来就在等，多留这三四百毫秒用户感知不到卡，却能从「一帧」变成「看得见在动」。
  var MIN_SHOW = 900;
  function boot(tool, overlayId) {
    var ov = document.getElementById(overlayId || 'hxBoot');
    if (!ov || ov.dataset.armed) return null;
    ov.dataset.armed = '1';
    var cv = ov.querySelector('canvas');
    var eng = still() ? null : start(cv, tool, false);
    if (!eng && cv) cv.style.display = 'none';
    bootH = { ov: ov, eng: eng, at: performance.now() };
    // 兜底：任何异常路径（网络卡死 / boot 抛错没走到 finishBoot）都不许把页面盖死，
    // 最多 8 秒强制收场，和 小组加分/fx/hx-jf-load.js 的 MAX_WAIT 同一思路。
    setTimeout(function () {
      if (bootH && bootH.ov === ov) finishBoot();
    }, 8000);
    return bootH;
  }
  function finishBoot() {
    if (!bootH) return;
    var b = bootH; bootH = null;
    // 2026-11-05 五修：**别在这里 stop 引擎**。工具准备好就会调本函数（手机 0.3~0.7s），
    // 而遮罩还得亮到 MIN_SHOW（900ms）。原来这里立刻 eng.stop()，于是引擎只画了第一帧，
    // 剩下的大半秒用户盯着一张冻图 —— 这就是「永远是一个像素动效的画面且不会动」的真因
    // （实测成品页 1.4 秒内 putImageData 只被调用 1 次）。停 rAF 只允许发生在移除之后。
    setTimeout(function () {
      b.ov.classList.add('out');                       // .hx-boot.out 淡出整层
      setTimeout(function () {
        if (b.ov.parentNode) b.ov.parentNode.removeChild(b.ov);
        if (b.eng) b.eng.stop();                       // 移除之后再停：淡出全程仍在动
      }, 300);
    }, Math.max(0, MIN_SHOW - (performance.now() - b.at)));
  }
  function booting() { return !!bootH; }

  // 面板加载占位：把 <div data-fxload="正在加载排行…"> 就地升级成 canvas+药丸；
  // 播不了（省电 / 包没出来）就填回回落药丸。面板重新渲染时占位节点被换掉，canvas 随之回收。
  function auto(root) {
    root = root || document;
    var list = root.querySelectorAll('[data-fxload]'), i;
    for (i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.dataset.fxdone) continue;
      el.dataset.fxdone = '1';
      var text = el.getAttribute('data-fxload') || '正在载入…';
      el.classList.add('hx-loadwrap', 'sm');
      var h = mount(el, el.getAttribute('data-fxtool') || 'panel', text, false, { compact: true });
      if (!h) el.appendChild(pillEl(text));
    }
  }

  window.HXLoadFx = {
    pick: function (tool) {                            // 供调试 / 自查：现抽一个（并记为「上一次」）
      return pickId(tool);
    },
    mount: mount,
    boot: boot,
    finishBoot: finishBoot,
    booting: booting,
    auto: auto
  };
})();
</script>
</head>
<body>
<div id="hxBoot" class="hx-boot" aria-hidden="true"><div class="hx-boot-card"><canvas id="hxBootCv" width="96" height="96"></canvas><p class="hx-boot-title">考试</p><div class="hx-loadpill sm" role="status" aria-live="polite"><span class="hx-px" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i></span><b>正在载入…</b></div></div></div>
<script>HXLoadFx.boot('exam', 'hxBoot');</script>
<main class="ex" id="app"></main>
<script>/* ================= C51 子集解释器：预处理 / 词法 / 语法 / 名字检查 / 带硬件模型的模拟运行 ================= */
'use strict';

const SFR_HEADERS = ['REGX51.H','REG51.H','REG52.H','REGX52.H','AT89X51.H','AT89X52.H','AT89C51RC2.H','STC89C5XRC.H','STC89.H'];
const OTHER_HEADERS = ['INTRINS.H','STDIO.H','STDLIB.H','STRING.H','MATH.H','ABSACC.H','CTYPE.H'];
const KNOWN_HEADERS = new Set([...SFR_HEADERS,...OTHER_HEADERS]);
const TYPE_WORDS = new Set(['unsigned','signed','char','int','short','long','void','code','data','idata','xdata','pdata','bdata','const','static','volatile','bit','float']);
const RESERVED = new Set(['if','else','while','for','do','return','break','continue','switch','case','default','sbit','sfr','goto']);
const PORTS = ['P0','P1','P2','P3'];
const PORT_ADDR = {0x80:'P0',0x90:'P1',0xA0:'P2',0xB0:'P3'};
const SFR_NAMES = new Set([...PORTS,'TMOD','TCON','TH0','TL0','TH1','TL1','SCON','SBUF','IE','IP','PSW','ACC','B','SP','DPL','DPH','PCON']);
const INTRIN = new Set(['_crol_','_cror_','_irol_','_iror_','_nop_']);
const TICK_US = 2;                       // 一个“语句/表达式求值”约等于 2 微秒（12MHz 下的粗略换算）
const cerr = (line,msg)=>({kind:'compile',line,msg});
const fmtErr = e => e.line ? `第${e.line}行：${e.msg}` : e.msg;

/* 头文件里自带的端口位名：REGX51.H 类是 P1_0，STC 头文件是 P10 */
function headerBitNames(includes){
  const names=new Map();
  const up=includes.map(i=>i.name.toUpperCase());
  const x51=up.some(h=>/^(REGX5[12]|AT89X5[12]|AT89C51RC2)\.H$/.test(h));
  const stc=up.some(h=>/^STC/.test(h));
  for(let p=0;p<4;p++)for(let b=0;b<8;b++){
    if(x51)names.set(`P${p}_${b}`,{port:p,bit:b});
    if(stc)names.set(`P${p}${b}`,{port:p,bit:b});
  }
  return names;
}

function stripComments(src){
  let out='',i=0;const n=src.length;
  while(i<n){
    const c=src[i],d=src[i+1];
    if(c==='/'&&d==='/'){ while(i<n&&src[i]!=='\n') i++; }
    else if(c==='/'&&d==='*'){ i+=2; while(i<n&&!(src[i]==='*'&&src[i+1]==='/')){ if(src[i]==='\n') out+='\n'; i++; } i+=2; out+=' '; }
    else if(c==='"'){ out+=c; i++; while(i<n&&src[i]!=='"'&&src[i]!=='\n'){ if(src[i]==='\\'&&i+1<n){ out+=src[i++]; } out+=src[i++]; } if(i<n&&src[i]==='"'){ out+=src[i++]; } }
    else { out+=c; i++; }
  }
  return out;
}

function preprocess(raw){
  const text=stripComments(String(raw).replace(/^﻿/,'').replace(/\r\n?/g,'\n'));
  const includes=[],macros={},errors=[];
  const out=text.split('\n').map((ln,idx)=>{
    const t=ln.trim();
    if(t[0]==='#'){
      let m;
      if((m=/^#\s*include\s*[<"]\s*([^>"]*?)\s*[>"]/.exec(t))) includes.push({name:m[1],line:idx+1});
      else if(/^#\s*include/.test(t)) errors.push(cerr(idx+1,'#include 写法不正确'));
      else if((m=/^#\s*define\s+([A-Za-z_]\w*)\s*(.*)$/.exec(t))) macros[m[1]]=m[2];
      else if(!/^#\s*(pragma|ifndef|ifdef|endif|undef|if|else)\b/.test(t)) errors.push(cerr(idx+1,`无法识别的预处理指令“${t}”`));
      return '';
    }
    return ln;
  });
  return {text:out.join('\n'),includes,macros,errors};
}

function tokenize(src,macros){
  const toks=[];let i=0,line=1;
  const re=/(\s+)|(0[xX][0-9a-fA-F]+)[uUlL]*|(\d+)[uUlL]*|([A-Za-z_]\w*)|('(?:\\.|[^'\\\n])')|("(?:\\.|[^"\\\n])*")|(<<=|>>=|\+\+|--|<<|>>|<=|>=|==|!=|&&|\|\||[+\-*\/%&|^]=|[-+*\/%&|^~!<>=?:;,(){}\[\]])/y;
  while(i<src.length){
    re.lastIndex=i;const m=re.exec(src);
    if(!m){
      const ch=src[i];
      const tip=/[，；：（）【】“”‘’！？。、]/.test(ch)?'（这是中文标点，要换成英文半角符号）':'（可能是没替换的空，或多余符号）';
      throw cerr(line,`出现非法字符“${ch}”${tip}`);
    }
    i=re.lastIndex;
    if(m[1]){ line+=(m[1].match(/\n/g)||[]).length; continue; }
    if(m[2]) toks.push({t:'num',v:parseInt(m[2],16),line,hex:true});
    else if(m[3]){
      if(/[A-Za-z_]/.test(src[i]||'')){const bad=/^\d+\w*/.exec(src.slice(i-m[0].length))[0];throw cerr(line,`“${bad}”写法有误：数字后面不能直接跟字母（十六进制要加 0x 前缀，如 0x7F）`);}
      toks.push({t:'num',v:parseInt(m[3],10),line});
    }
    else if(m[4]){
      if(macros&&Object.prototype.hasOwnProperty.call(macros,m[4])) tokenize(macros[m[4]],null).forEach(x=>toks.push({t:x.t,v:x.v,line,hex:x.hex}));
      else toks.push({t:'id',v:m[4],line});
    }
    else if(m[5]){ const s=m[5].slice(1,-1); const esc={n:10,t:9,r:13,'0':0,'\\':92,"'":39}; toks.push({t:'num',v:s[0]==='\\'?(esc[s[1]]||s.charCodeAt(1)):s.charCodeAt(0),line}); }
    else if(m[6]) toks.push({t:'str',v:m[6],line});
    else toks.push({t:'op',v:m[7],line});
  }
  return toks;
}

/* ================= 语法分析 ================= */
const BIN_PREC={'||':1,'&&':2,'|':3,'^':4,'&':5,'==':6,'!=':6,'<':7,'>':7,'<=':7,'>=':7,'<<':8,'>>':8,'+':9,'-':9,'*':10,'/':10,'%':10};
const ASSIGN_OPS=new Set(['=','+=','-=','*=','/=','%=','&=','|=','^=','<<=','>>=']);

class Parser{
  constructor(toks){this.t=toks;this.p=0;this.warnings=[];this.forId=0;}
  peek(k=0){return this.t[this.p+k];}
  next(){return this.t[this.p++];}
  line(){const k=this.peek()||this.t[this.t.length-1];return k?k.line:1;}
  isOp(v,k=0){const x=this.peek(k);return !!x&&x.t==='op'&&x.v===v;}
  isId(v,k=0){const x=this.peek(k);return !!x&&x.t==='id'&&x.v===v;}
  expectOp(v){
    if(this.isOp(v)) return this.next();
    const prev=this.t[this.p-1],x=this.peek();
    const ln=(v===';'&&prev)?prev.line:this.line();
    throw cerr(ln,x?`缺少“${v}”（后面是“${x.v}”）`:`缺少“${v}”，文件意外结束`);
  }
  ident(){
    const x=this.peek();
    if(!x||x.t!=='id'||TYPE_WORDS.has(x.v)||RESERVED.has(x.v)) throw cerr(this.line(),`此处需要名字（遇到“${x?x.v:'文件结束'}”）`);
    return this.next();
  }
  typeSpec(){
    let any=false,unsigned=false,bits=null,isVoid=false,code=false,isFloat=false;
    while(this.peek()&&this.peek().t==='id'&&TYPE_WORDS.has(this.peek().v)){
      const w=this.next().v;any=true;
      if(w==='unsigned')unsigned=true;
      else if(w==='char')bits=8;
      else if(w==='int')bits=bits||16;
      else if(w==='short')bits=16;
      else if(w==='long')bits=32;
      else if(w==='float'){bits=32;isFloat=true;}
      else if(w==='void')isVoid=true;
      else if(w==='bit')bits=1;
      else if(w==='code')code=true;       // 存在程序存储器（ROM）里，只读
    }
    if(!any) return null;
    if(bits===null&&!isVoid) bits=16;
    return {bits,unsigned,isVoid,code,isFloat};
  }
  parseProgram(){
    const prog={globals:[],funcs:[],sbits:[],sfrs:[],protos:[],order:[]};
    while(this.peek()){
      if(this.isOp(';')){this.next();continue;}
      if(this.isId('sbit')){
        const line=this.next().line;const name=this.ident();this.expectOp('=');const e=this.assign();this.expectOp(';');
        prog.sbits.push({name:name.v,e,line});continue;
      }
      if(this.isId('sfr')||this.isId('sfr16')){
        this.next();const name=this.ident();this.expectOp('=');const e=this.assign();this.expectOp(';');
        prog.sfrs.push({name:name.v,e,line:name.line});continue;
      }
      const ty=this.typeSpec();
      if(!ty){
        const x=this.peek();
        if(x.t==='id'&&this.isOp('(',1)) throw cerr(x.line,`函数“${x.v}”前面缺少返回类型（例如 void ${x.v}(...)）`);
        throw cerr(this.line(),`此处语法错误（遇到“${x.v}”）`);
      }
      const nameTok=this.ident();
      if(this.isOp('(')){
        this.next();const params=[];
        if(this.isId('void')&&this.isOp(')',1)) this.next();
        else if(!this.isOp(')')){
          do{ const pt=this.typeSpec(); if(!pt) throw cerr(this.line(),'形参缺少类型'); const pn=this.ident(); params.push({type:pt,name:pn.v}); }while(this.isOp(',')&&this.next());
        }
        this.expectOp(')');
        if(this.isOp(';')){this.next();prog.protos.push({name:nameTok.v,line:nameTok.line,pos:prog.order.length});prog.order.push({proto:nameTok.v});continue;}
        if(this.isId('interrupt')){this.next();this.assign();}
        const body=this.block();
        prog.funcs.push({name:nameTok.v,params,body,ret:ty,line:nameTok.line,pos:prog.order.length});
        prog.order.push({func:nameTok.v});
      } else {
        prog.globals.push(...this.declarators(ty,nameTok));
      }
    }
    return prog;
  }
  declarators(ty,first){
    const items=[];let tok=first;
    for(;;){
      const it={name:tok.v,type:ty,isArr:false,size:null,init:null,line:tok.line};
      if(this.isOp('[')){ this.next();it.isArr=true; if(!this.isOp(']')) it.size=this.assign(); this.expectOp(']'); }
      if(this.isOp('=')){
        this.next();
        if(this.isOp('{')){ this.next();const list=[]; while(!this.isOp('}')){ list.push(this.assign()); if(this.isOp(',')) this.next(); else break; } this.expectOp('}'); it.init={list}; }
        else it.init=this.assign();
      }
      items.push(it);
      if(this.isOp(',')){ this.next(); tok=this.ident(); continue; }
      this.expectOp(';');break;
    }
    return items;
  }
  block(){
    this.expectOp('{');const body=[];let seen=false;
    while(!this.isOp('}')){
      if(!this.peek()) throw cerr(this.line(),'缺少“}”，文件意外结束');
      const s=this.stmt();
      if(s.t==='decl'){ if(seen) this.warnings.push(`第${s.line}行：变量声明写在了语句后面，Keil C51 会报错，声明要写在花括号开头`); }
      else if(s.t!=='empty') seen=true;
      body.push(s);
    }
    this.next();return {t:'block',body};
  }
  stmt(){
    const t=this.peek();
    if(!t) throw cerr(this.line(),'文件意外结束');
    if(this.isOp('{')) return this.block();
    if(this.isOp(';')){this.next();return {t:'empty'};}
    if(t.t==='id'){
      switch(t.v){
        case 'if':{this.next();this.expectOp('(');const c=this.expr();this.expectOp(')');const a=this.stmt();let b=null;if(this.isId('else')){this.next();b=this.stmt();}return {t:'if',c,a,b,line:t.line};}
        case 'while':{this.next();this.expectOp('(');const c=this.expr();this.expectOp(')');const b=this.stmt();return {t:'while',c,b,line:t.line};}
        case 'do':{this.next();const b=this.stmt();if(!this.isId('while')) throw cerr(this.line(),'do 后面缺少 while');this.next();this.expectOp('(');const c=this.expr();this.expectOp(')');this.expectOp(';');return {t:'do',c,b};}
        case 'for':{
          this.next();this.expectOp('(');let init=null,c=null,step=null;
          if(!this.isOp(';')) init=this.expr(); this.expectOp(';');
          if(!this.isOp(';')) c=this.expr(); this.expectOp(';');
          if(!this.isOp(')')) step=this.expr(); this.expectOp(')');
          const b=this.stmt();return {t:'for',init,c,step,b,id:this.forId++};
        }
        case 'switch':{
          this.next();this.expectOp('(');const e=this.expr();this.expectOp(')');this.expectOp('{');
          const labels=[],body=[];
          while(!this.isOp('}')){
            if(!this.peek()) throw cerr(this.line(),'switch 缺少“}”，文件意外结束');
            if(this.isId('case')){const ln=this.next().line;const v=this.cond();this.expectOp(':');labels.push({v,idx:body.length,line:ln});continue;}
            if(this.isId('default')){this.next();this.expectOp(':');labels.push({def:true,idx:body.length});continue;}
            if(!labels.length) throw cerr(this.line(),'switch 里的语句前面缺少 case 标号');
            body.push(this.stmt());
          }
          this.next();return {t:'switch',e,labels,body};
        }
        case 'case': case 'default': throw cerr(t.line,`“${t.v}”只能写在 switch 里面`);
        case 'return':{this.next();let e=null;if(!this.isOp(';'))e=this.expr();this.expectOp(';');return {t:'ret',e};}
        case 'break':this.next();this.expectOp(';');return {t:'brk'};
        case 'continue':this.next();this.expectOp(';');return {t:'cont'};
        case 'sbit': throw cerr(t.line,'sbit 只能写在函数外面（文件开头）');
      }
      if(TYPE_WORDS.has(t.v)){
        const line=t.line,ty=this.typeSpec(),first=this.ident();
        if(this.isOp('(')) throw cerr(line,'函数不能定义在另一个函数里面（检查前面的花括号是否配对）');
        return {t:'decl',items:this.declarators(ty,first),line};
      }
    }
    const e=this.expr();this.expectOp(';');return {t:'expr',e,line:t.line};
  }
  expr(){let e=this.assign();while(this.isOp(',')){this.next();const r=this.assign();e={t:'comma',l:e,r};}return e;}
  assign(){
    const l=this.cond();const x=this.peek();
    if(x&&x.t==='op'&&ASSIGN_OPS.has(x.v)){
      if(l.t!=='id'&&l.t!=='idx') throw cerr(x.line,'赋值号“=”左边必须是变量或端口');
      this.next();const r=this.assign();return {t:'asg',op:x.v,l,r,line:x.line};
    }
    return l;
  }
  cond(){
    const c=this.bin(1);
    if(this.isOp('?')){this.next();const a=this.assign();this.expectOp(':');const b=this.cond();return {t:'cond',c,a,b};}
    return c;
  }
  bin(min){
    let l=this.unary();
    for(;;){
      const x=this.peek();
      if(x&&x.t==='op'&&BIN_PREC[x.v]>=min){ this.next();const r=this.bin(BIN_PREC[x.v]+1);l={t:'bin',op:x.v,l,r,line:x.line}; }
      else break;
    }
    return l;
  }
  unary(){
    const x=this.peek();
    if(x&&x.t==='op'){
      if(['!','~','-','+'].includes(x.v)){this.next();return {t:'un',op:x.v,e:this.unary()};}
      if(x.v==='++'||x.v==='--'){this.next();return {t:'inc',op:x.v,pre:true,e:this.unary(),line:x.line};}
      if(x.v==='('&&this.peek(1)&&this.peek(1).t==='id'&&TYPE_WORDS.has(this.peek(1).v)){
        this.next();const ty=this.typeSpec();this.expectOp(')');return {t:'cast',type:ty,e:this.unary()};
      }
    }
    return this.postfix();
  }
  postfix(){
    let p=this.primary();
    for(;;){
      if(this.isOp('(')&&p.t==='id'){
        const line=p.line;this.next();const args=[];
        if(!this.isOp(')')){ do{ args.push(this.assign()); }while(this.isOp(',')&&this.next()); }
        this.expectOp(')');p={t:'call',n:p.n,args,line};
      } else if(this.isOp('[')){ this.next();const i=this.expr();this.expectOp(']');p={t:'idx',a:p,i,line:p.line}; }
      else if(this.isOp('++')||this.isOp('--')){ const o=this.next();p={t:'inc',op:o.v,pre:false,e:p,line:o.line}; }
      else break;
    }
    return p;
  }
  primary(){
    const x=this.peek();
    if(!x) throw cerr(this.line(),'表达式不完整，文件意外结束');
    if(x.t==='num'){this.next();return {t:'num',v:x.v,hex:!!x.hex};}
    if(x.t==='str'){this.next();return {t:'str'};}
    if(x.t==='id'){
      if(TYPE_WORDS.has(x.v)) throw cerr(x.line,`这里不应出现类型关键字“${x.v}”`);
      if(RESERVED.has(x.v)) throw cerr(x.line,`关键字“${x.v}”用法不对`);
      this.next();return {t:'id',n:x.v,line:x.line};
    }
    if(x.t==='op'&&x.v==='('){this.next();const e=this.expr();this.expectOp(')');return e;}
    throw cerr(x.line,`表达式语法错误（遇到“${x.v}”）`);
  }
}

/* sbit 的地址：P3^4 或 0xB4 */
function sbitTarget(e,sfrAlias){
  if(e.t==='bin'&&e.op==='^'&&e.l.t==='id'&&e.r.t==='num'){
    const nm=sfrAlias[e.l.n]||e.l.n;const p=PORTS.indexOf(nm);
    if(p<0) return null;
    if(e.r.v<0||e.r.v>7) return null;
    return {port:p,bit:e.r.v};
  }
  if(e.t==='num'){ const base=e.v&0xF8; const nm=PORT_ADDR[base]; if(nm) return {port:PORTS.indexOf(nm),bit:e.v&7}; }
  return null;
}

/* 常量折叠（case 标号用） */
function foldConst(e){
  switch(e.t){
    case 'num':return e.v;
    case 'cast':{   // 强制类型转换要按目标类型截断，例如 (signed char)300 = 44
      const v=foldConst(e.e);if(v===null)return null;const t=e.type;
      if(t.bits===1)return v?1:0;
      if(t.bits===8)return t.unsigned?v&0xFF:((v&0xFF)^0x80)-0x80;
      if(t.bits===16)return t.unsigned?v&0xFFFF:((v&0xFFFF)^0x8000)-0x8000;
      return v;}
    case 'un':{const v=foldConst(e.e);if(v===null)return null;return e.op==='-'?-v:e.op==='~'?~v:e.op==='!'?(v?0:1):v;}
    case 'bin':{const a=foldConst(e.l),b=foldConst(e.r);if(a===null||b===null)return null;
      switch(e.op){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '&':return a&b;case '|':return a|b;case '^':return a^b;case '<<':return a<<b;case '>>':return a>>b;}
      return null;}
  }
  return null;
}
/* ================= 名字检查（未定义标识符 = 编译错误） ================= */
function resolve(prog,includes){
  const errs=[],seen=new Set();
  const add=(line,msg)=>{const k=line+'|'+msg;if(!seen.has(k)){seen.add(k);errs.push(cerr(line,msg));}};
  const inc=new Set(includes.map(i=>i.name.toUpperCase()));
  const hasSfr=SFR_HEADERS.some(h=>inc.has(h)),hasIntr=inc.has('INTRINS.H');
  const sfrAlias={};
  prog.sfrs.forEach(s=>{ if(s.e.t==='num'&&PORT_ADDR[s.e.v]) sfrAlias[s.name]=PORT_ADDR[s.e.v]; });
  const portKnown=n=>(SFR_NAMES.has(n)&&hasSfr)||!!sfrAlias[n];
  const hbits=headerBitNames(includes);
  const sbitNames=new Set();
  prog.sbits.forEach(s=>{
    if(s.e.t==='bin'&&s.e.l.t==='id'&&SFR_NAMES.has(s.e.l.n)&&!portKnown(s.e.l.n)) add(s.line,`“${s.e.l.n}”未定义（是否漏写了 #include <reg51.h>？）`);
    else if(s.e.t==='bin'&&s.e.l.t==='id'&&!SFR_NAMES.has(s.e.l.n)&&!sfrAlias[s.e.l.n]) add(s.line,`sbit 定义里的“${s.e.l.n}”不是端口名（C 语言区分大小写，端口要大写，如 P3^4）`);
    else if(!sbitTarget(s.e,sfrAlias)) add(s.line,`sbit ${s.name} 的地址写法不对，应写成 P3^4 这种形式（位号 0～7）`);
    if(sbitNames.has(s.name)) add(s.line,`sbit ${s.name} 重复定义`);
    sbitNames.add(s.name);
  });
  const globals=new Set(prog.globals.map(g=>g.name));
  const funcs=new Map(prog.funcs.map(f=>[f.name,f]));
  const protoPos=new Map();prog.protos.forEach(p=>{if(!protoPos.has(p.name))protoPos.set(p.name,p.pos);});
  const fnames=new Set();
  prog.funcs.forEach(f=>{ if(fnames.has(f.name)) add(f.line,`函数“${f.name}”重复定义`); fnames.add(f.name); });
  prog.protos.forEach(p=>{ if(!funcs.has(p.name)) add(p.line,`函数“${p.name}”只有声明，没有定义函数体`); });
  let scopes=[],curPos=0;
  const declared=n=>{for(let i=scopes.length-1;i>=0;i--)if(scopes[i].has(n))return true;return globals.has(n)||sbitNames.has(n);};
  const undef=n=>`未定义的标识符“${n}”`+(/_{2,}/.test(n)?'（像是没填完的空）':'（C 语言区分大小写，检查拼写）');
  function ex(e){
    if(!e) return;
    switch(e.t){
      case 'id':
        if(declared(e.n)||funcs.has(e.n)) return;
        if(SFR_NAMES.has(e.n)){ if(!portKnown(e.n)) add(e.line,`“${e.n}”未定义（是否漏写了 #include <reg51.h>？）`); return; }
        if(sfrAlias[e.n]||hbits.has(e.n)) return;
        if(/^p[0-3]$/.test(e.n)) { add(e.line,`未定义的标识符“${e.n}”（端口名要大写：${e.n.toUpperCase()}）`); return; }
        add(e.line,undef(e.n));return;
      case 'call':
        if(funcs.has(e.n)){
          const f=funcs.get(e.n);
          if(f.pos>curPos&&!(protoPos.has(e.n)&&protoPos.get(e.n)<curPos)) add(e.line,`函数“${e.n}”在定义之前就被调用了：要么把它挪到 main 前面，要么在前面加一行声明，例如 void ${e.n}(unsigned int i);`);
          if(f.params.length!==e.args.length) add(e.line,`函数“${e.n}”需要 ${f.params.length} 个参数，这里给了 ${e.args.length} 个`);
        } else if(INTRIN.has(e.n)){
          if(!hasIntr) add(e.line,`函数“${e.n}”未声明（需要 #include <intrins.h>）`);
          else if(e.n!=='_nop_'&&e.args.length!==2) add(e.line,`函数“${e.n}”需要 2 个参数`);
        } else {
          const low=[...funcs.keys(),...INTRIN].find(n=>n.toLowerCase()===e.n.toLowerCase());
          add(e.line,`函数“${e.n}”未定义`+(low?`（C 语言区分大小写，应为 ${low}）`:''));
        }
        e.args.forEach(ex);return;
      case 'idx': ex(e.a);ex(e.i);return;
      case 'un': case 'cast': case 'inc': ex(e.e);return;
      case 'bin': case 'asg': case 'comma': ex(e.l);ex(e.r);return;
      case 'cond': ex(e.c);ex(e.a);ex(e.b);return;
    }
  }
  function st(s){
    if(!s) return;
    switch(s.t){
      case 'block': scopes.push(new Set());s.body.forEach(st);scopes.pop();return;
      case 'decl': s.items.forEach(it=>{ scopes[scopes.length-1].add(it.name); if(it.size)ex(it.size); if(it.init){ if(it.init.list)it.init.list.forEach(ex); else ex(it.init);} });return;
      case 'expr': ex(s.e);return;
      case 'if': ex(s.c);st(s.a);st(s.b);return;
      case 'while': case 'do': ex(s.c);st(s.b);return;
      case 'for': ex(s.init);ex(s.c);ex(s.step);st(s.b);return;
      case 'switch':{
        ex(s.e);
        const seenV=new Map();
        s.labels.forEach(l=>{ if(!l.v)return; ex(l.v); const k=foldConst(l.v);
          if(k===null)add(l.line,'case 后面必须是常量');
          else if(seenV.has(k))add(l.line,`case 的值 0x${(k&0xFF).toString(16).toUpperCase().padStart(2,'0')} 重复了（和第${seenV.get(k)}行一样）`);
          else seenV.set(k,l.line); });
        if(s.labels.filter(l=>l.def).length>1)add(0,'switch 里有两个 default');
        scopes.push(new Set());s.body.forEach(st);scopes.pop();return;
      }
      case 'ret': ex(s.e);return;
    }
  }
  prog.globals.forEach(g=>{ if(g.size)ex(g.size); if(g.init){ if(g.init.list)g.init.list.forEach(ex); else ex(g.init);} });
  prog.funcs.forEach(f=>{ curPos=f.pos; scopes=[new Set(f.params.map(p=>p.name))]; st(f.body); });
  if(!funcs.has('main')) add(0,'缺少 main 函数');
  return errs;
}

/* ================= 模拟运行（端口锁存器 + 外部按键 + 时间） =================
   hw = { keys: {S1:{port:3,bit:4},...}, watch:[0] }   按下 = 引脚被拉低
   script = { events:[{t:ms,key:'S1',down:true}], tEnd:ms }                       */
function simulate(prog,includes,hw,script){
  const LIM_OPS=6000000;
  const tEndTicks=Math.round((script.tEnd||3000)*1000/TICK_US);
  const R={status:'ok',msg:'',ops:0,trace:[[],[],[],[]],end:0,warnings:[]};
  const STOP={stop:true},HALT={halt:true};
  const rt=msg=>({kind:'runtime',msg});
  const U8={bits:8,unsigned:true};
  const latch=[0xFF,0xFF,0xFF,0xFF];
  const sfrOther={};SFR_NAMES.forEach(n=>{if(!PORTS.includes(n))sfrOther[n]=0;});
  const sfrAlias={};prog.sfrs.forEach(s=>{if(s.e.t==='num'&&PORT_ADDR[s.e.v])sfrAlias[s.name]=PORT_ADDR[s.e.v];});
  const hbits=headerBitNames(includes);
  const sbits=new Map();prog.sbits.forEach(s=>{const t=sbitTarget(s.e,sfrAlias);if(t)sbits.set(s.name,t);});
  const funcs=new Map(prog.funcs.map(f=>[f.name,f]));
  const globals=new Map();
  let scopes=[new Map()];
  let clock=0;
  const evs=(script.events||[]).map(e=>({tick:Math.round(e.t*1000/TICK_US),key:e.key,down:e.down})).sort((a,b)=>a.tick-b.tick);
  function keyDown(name,tk){let d=false;for(const e of evs){if(e.tick>tk)break;if(e.key===name)d=e.down;}return d;}
  function nextEventAfter(tk){for(const e of evs)if(e.tick>tk)return e.tick;return Infinity;}
  function pins(p){
    let v=latch[p];
    for(const k in hw.keys){const h=hw.keys[k];if(h.port===p&&keyDown(k,clock))v&=~(1<<h.bit);}
    return v&0xFF;
  }
  function setLatch(p,v){
    v&=0xFF;

/* 编译检查：返回 {ok, errors, warnings, prog, includes, stripped} */
function compileC(code){
  const A={ok:false,errors:[],warnings:[],includes:[],prog:null,stripped:''};
  let pre;
  try{pre=preprocess(code);}catch(e){A.errors.push('预处理失败');return A;}
  A.includes=pre.includes;A.stripped=pre.text;
  pre.errors.forEach(e=>A.errors.push(fmtErr(e)));
  pre.text.split('\n').forEach((ln,i)=>{if(/_{4,}/.test(ln))A.errors.push(`第${i+1}行：还留有没填的空“______”`);});
  pre.includes.forEach(inc=>{
    if(/_{3,}/.test(inc.name))A.errors.push(`第${inc.line}行：#include 里的空还没填`);
    else if(!KNOWN_HEADERS.has(inc.name.toUpperCase()))A.errors.push(`第${inc.line}行：无法打开头文件“${inc.name}”`);
  });
  if(A.errors.length)return A;
  try{
    const parser=new Parser(tokenize(pre.text,pre.macros));
    const prog=parser.parseProgram();
    A.warnings.push(...parser.warnings);
    const errs=resolve(prog,pre.includes);
    if(errs.length){errs.forEach(e=>A.errors.push(fmtErr(e)));return A;}
    if(parser.warnings.length){ /* Keil C89：声明在语句后面是编译错误 */
      parser.warnings.forEach(w=>A.errors.push(w));A.warnings=[];return A;
    }
    A.ok=true;A.prog=prog;
  }catch(e){
    if(e&&e.kind==='compile')A.errors.push(fmtErr(e));
    else A.errors.push('检测器内部错误：'+(e&&e.message||e));
  }
  return A;
}

/* 常量表达式求值：用于判断学生填的 0xFE、1、7 等 */
function constEval(text){
  try{
    const p=new Parser(tokenize(text,null));const e=p.expr();if(p.peek())return null;
    const f=x=>{
      switch(x.t){
        case 'num':return x.v;
        case 'cast':return f(x.e);
        case 'un':{const v=f(x.e);return x.op==='!'?(v?0:1):x.op==='~'?~v:x.op==='-'?-v:v;}
        case 'bin':{
          const a=f(x.l),b=f(x.r);
          switch(x.op){
            case '+':return a+b;case '-':return a-b;case '*':return a*b;
            case '/':if(!b)throw 0;return Math.trunc(a/b);case '%':if(!b)throw 0;return a%b;
            case '&':return a&b;case '|':return a|b;case '^':return a^b;
            case '<<':return a<<b;case '>>':return a>>b;
          }
        }
      }
      throw 0;
    };
    const v=f(e);return (typeof v==='number'&&!isNaN(v))?v:null;
  }catch(_){return null;}
}

function checkHex(text){
  const lines=String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length)return {ok:false,msg:'hex 文件为空'};
  let bytes=0,eof=false;
  for(let i=0;i<lines.length;i++){
    const L=lines[i];
    if(!/^:([0-9A-Fa-f]{2}){5,}$/.test(L))return {ok:false,msg:`第${i+1}行格式错误`};
    const b=[];for(let j=1;j<L.length;j+=2)b.push(parseInt(L.substr(j,2),16));
    if(b.length!==b[0]+5)return {ok:false,msg:`第${i+1}行长度字段与内容不符`};
    if(b.reduce((a,c)=>a+c,0)&0xFF)return {ok:false,msg:`第${i+1}行校验和错误`};
    if(b[3]===0)bytes+=b[0];
    if(b[3]===1)eof=true;
  }
  if(!eof)return {ok:false,msg:'缺少结束记录'};
  if(bytes===0)return {ok:false,msg:'hex 中没有程序数据'};
  return {ok:true,bytes,msg:bytes+' 字节'};
}

function looseTokens(text){
  const src=stripComments(String(text).replace(/^﻿/,'').replace(/\r\n?/g,'\n'));
  const re=/(\s+)|(_{3,}\s*\(\s*\d+\s*\)\s*_{3,})|(\u0001\w+\u0003)|(\u0002)|(0[xX][0-9a-fA-F]+|\d+)[uUlL]*|([A-Za-z_]\w*)|(<<=|>>=|\+\+|--|<<|>>|<=|>=|==|!=|&&|\|\||[+\-*\/%&|^]=)|([\s\S])/g;
  const toks=[];let m;
  while((m=re.exec(src))){
    if(m[1])continue;
    if(m[2]){toks.push({k:'B',n:+BLANK_RE.exec(m[2])[1],raw:m[2],norm:'⟪B⟫'});continue;}
    if(m[3]){toks.push({k:'MS',id:m[3].slice(1,-1)});continue;}
    if(m[4]){toks.push({k:'ME'});continue;}
    if(m[5]){const v=/^0[xX]/.test(m[5])?parseInt(m[5],16):parseInt(m[5],10);toks.push({k:'num',raw:m[5],norm:'#'+v,v});continue;}
    if(m[6]){toks.push({k:'id',raw:m[6],norm:m[6]});continue;}
    const t=m[7]||m[8];toks.push({k:'op',raw:t,norm:t});
  }
  return toks;
}
/* 把带标记的模板拆成纯 token 序列，同时记下每个空/每个出错位置在序列里的范围 */
function templateIndex(text){
  const raw=looseTokens(text),toks=[],blanks={},sites={};let open=null;
  raw.forEach(t=>{
    if(t.k==='MS'){open={id:t.id,s:toks.length};return;}
    if(t.k==='ME'){if(open){sites[open.id]={s:open.s,e:toks.length};open=null;}return;}
    if(t.k==='B')(blanks[t.n]=blanks[t.n]||[]).push({s:toks.length,e:toks.length+1});
    toks.push(t);
  });
  return {toks,blanks,sites};
}
/* 最长公共子序列对齐：返回 match[i] = 学生 token 下标 或 -1 */
function lcsAlign(a,b){
  const n=a.length,m=b.length,W=m+1;
  const dp=new Uint16Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i*W+j]=a[i].norm===b[j].norm?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  const match=new Array(n).fill(-1);let i=0,j=0;
  while(i<n&&j<m){
    if(a[i].norm===b[j].norm){match[i]=j;i++;j++;}
    else if(dp[(i+1)*W+j]>=dp[i*W+j+1])i++;else j++;
  }
  return match;
}
function joinToks(ts){
  let s='';
  ts.forEach((t,i)=>{
    const r=t.raw;
    if(i&&/[\w)\]]$/.test(s)&&/^[\w(]/.test(r)&&!/^\($/.test(r))s+=' ';
    else if(i&&/^[\w]/.test(r)&&/[\w]$/.test(s))s+=' ';
    s+=r;
  });
  return s.replace(/\s+/g,' ').trim();
}
/* 学生代码里与模板 [s,e) 对应的那一段 */
function lcsAlignBack(a,b){
  const ra=a.slice().reverse(),rb=b.slice().reverse();
  const m=lcsAlign(ra,rb),n=a.length,k=b.length;
  const out=new Array(n).fill(-1);
  m.forEach((j,i)=>{if(j>=0)out[n-1-i]=k-1-j;});
  return out;
}
/* 左边界用正向对齐，右边界用反向对齐：空里填的内容即使和后文开头一样也能被正确“吸收” */
function alignedSpan(T,match,stu,s,e,back){
  let p=s-1;while(p>=0&&match[p]<0)p--;
  const mb=back||match;
  let q=e;while(q<T.length&&mb[q]<0)q++;
  let from=p>=0?match[p]+1:0,to=q<T.length?mb[q]:stu.length;
  if(to<from&&back){ q=e;while(q<T.length&&match[q]<0)q++; to=q<T.length?match[q]:stu.length; }
  if(to<from)return {toks:[],text:'',lost:true};
  const ts=stu.slice(from,to);
  return {toks:ts,text:joinToks(ts),lost:p<0&&q>=T.length};
}
function makeAligner(templateText,code){
  const TI=templateIndex(templateText),stu=looseTokens(code);
  const match=lcsAlign(TI.toks,stu),back=lcsAlignBack(TI.toks,stu);
  const matched=match.filter(x=>x>=0).length;
  return {
    similarity:TI.toks.length?matched/TI.toks.length:0,
    blanks:n=>(TI.blanks[n]||[]).map(b=>alignedSpan(TI.toks,match,stu,b.s,b.e,back)),
    site:id=>{const b=TI.sites[id];return b?alignedSpan(TI.toks,match,stu,b.s,b.e,back):{toks:[],text:'',lost:true};},
    siteRef:id=>{const b=TI.sites[id];return b?joinToks(TI.toks.slice(b.s,b.e)):'';}
  };
}

/* ---------- 填空答案比对 ---------- */
const normText=s=>looseTokens(s).map(t=>t.norm).join(' ');
const spanNorm=sp=>sp.toks.map(t=>t.norm).join(' ');   // 直接用对齐出的 token，避免“<< =”拼回去变成“<<=”
function judgeBlank(bl,span){
  const txt=span.text;
  if(span.lost)return {pass:false,msg:'没有找到这一空所在的语句（代码结构被改动太多？）',text:''};
  if(!txt||span.toks.some(t=>t.k==='B'))return {pass:false,msg:'这一空还没填',text:txt};
  const want=bl.show||bl.ans[0],ans='应为 '+want;
  const wrongMsg=()=>{ const k=spanNorm(span); for(const w in (bl.wrong||{})) if(normText(w)===k) return bl.wrong[w]; return null; };
  switch(bl.kind){
    case 'num':{
      const v=constEval(txt);
      if(v===null){
        if(/^\d+[A-Za-z_]\w*$/.test(txt.replace(/\s/g,'')))return {pass:false,msg:`“${txt}”写法不对：十六进制数要加 0x 前缀`,ans,text:txt};
        return {pass:false,msg:`“${txt}”不是合法的数值写法`,ans,text:txt};
      }
      const mask=bl.mask==null?0xFFFF:bl.mask;
      const ok=bl.ans.some(a=>((typeof a==='number'?a:constEval(String(a)))&mask)===(v&mask));
      if(ok)return {pass:true,msg:'',text:txt};
      const wm=wrongMsg()||(bl.wrongFn&&bl.wrongFn(v));
      return {pass:false,msg:(wm?wm+'；':'')+`填的是 ${bl.hex?hx(v):v}`,ans,text:txt};
    }
    case 'nonzero':{
      const v=constEval(txt);
      if(v===null)return {pass:false,msg:`“${txt}”不能作为条件`,ans,text:txt};
      return v?{pass:true,msg:'',text:txt}:{pass:false,msg:'条件为 0，循环一次都不会执行',ans,text:txt};
    }
    case 'header':{
      const h=txt.replace(/\s/g,'').toUpperCase();
      if(bl.ans.some(a=>a.toUpperCase()===h))return {pass:true,msg:'',text:txt};
      return {pass:false,msg:(wrongMsg()?wrongMsg()+'；':'')+`填的是 ${txt}`,ans,text:txt};
    }
    default:{   // 'text'：逐 token 比较，区分大小写
      const k=spanNorm(span);
      if(bl.ans.some(a=>normText(a)===k))return {pass:true,msg:'',text:txt};
      const wm=wrongMsg();
      if(wm)return {pass:false,msg:wm,ans,text:txt};
      if(bl.ans.some(a=>normText(a).toLowerCase()===k.toLowerCase()))return {pass:false,msg:`写成了 ${txt}，C 语言区分大小写`,ans,text:txt};
      return {pass:false,msg:`填的是 ${txt}`,ans,text:txt};
    }
  }
}

/* ---------- 现象：把端口变化整理成“看得见的状态”序列 ---------- */
const MIN_MS=20;    // 持续不到 20ms 的瞬间状态人眼看不到，忽略
function segmentsOf(run,port,from,to){
  const tr=run.trace[port];
  let cur=0xFF,i=0;
  for(;i<tr.length&&tr[i].t<=from;i++)cur=tr[i].v;
  const raw=[];let t0=from;
  for(;i<tr.length&&tr[i].t<to;i++){ raw.push({v:cur,t0,t1:tr[i].t}); cur=tr[i].v; t0=tr[i].t; }
  raw.push({v:cur,t0,t1:to});
  const out=[];
  raw.forEach((s,k)=>{
    if(s.t1-s.t0<MIN_MS&&k!==raw.length-1)return;
    const last=out[out.length-1];
    if(last&&last.v===s.v)last.t1=s.t1;else out.push({...s});
  });
  if(out.length&&out[0].t0===from)out[0].carried=true;   // 这一步是从上一段延续过来的（还没来得及反应）
  return out;
}
/* 按脚本里的按键动作把时间轴切成几段 */
function scriptPhases(sc){
  const cuts=[...new Set((sc.events||[]).map(e=>e.t))].sort((a,b)=>a-b);
  const ph=[];let prev=0,label=sc.startLabel||'上电后';
  cuts.forEach(t=>{
    ph.push({from:prev,to:t,label});
    const evs=sc.events.filter(e=>e.t===t);
    label=evs.map(e=>(e.down?'按下 ':'松开 ')+e.key).join('，')+' 后';
    prev=t;
  });
  ph.push({from:prev,to:sc.tEnd,label});
  return ph.filter(p=>p.to>p.from);
}
function phaseSeqs(run,port,sc){
  return scriptPhases(sc).map(p=>({...p,segs:segmentsOf(run,port,p.from,p.to)}));
}
/* 比较一段时间内的状态序列：有限序列要完全一样；一直在变的（流水、闪烁）比较前面若干个 */
function seqMatch(refSegs,stuSegs){
  /* 按键刚按下时还停在原来的状态（比如正赶上闪烁“灭”的半拍），只是反应慢了一点，不算错：
     两边第一步不同时，去掉“从上一段延续过来”的那一步再比 */
  let R=refSegs,S=stuSegs,oR=0,oS=0;
  if(R.length&&S.length&&R[0].v!==S[0].v){
    if(S[0].carried&&S.length>1&&S[1].v===R[0].v){S=S.slice(1);oS=1;}
    else if(R[0].carried&&R.length>1&&R[1].v===S[0].v){R=R.slice(1);oR=1;}
  }
  const a=R.map(s=>s.v),b=S.map(s=>s.v);
  const res=(pass,i)=>pass?{pass:true}:{pass:false,at:i+oR,atStu:i+oS};
  const LONG=12;
  /* 最后一步明显比前面每一步都长，才算“停住了”；否则是被测试时间截断的普通一步（流水、闪烁还在继续） */
  const last=R[R.length-1];
  const maxPrev=R.length>1?Math.max(...R.slice(0,-1).map(s=>s.t1-s.t0)):0;
  const settled=!!last&&(last.t1-last.t0)>=Math.max(200,2.5*maxPrev);
  if(a.length>=LONG&&!settled){
    const n=Math.min(a.length,b.length,24);
    for(let i=0;i<n;i++)if(a[i]!==b[i])return res(false,i);   // 先找真正第一处不同
    if(b.length<Math.min(6,a.length))return res(false,b.length);
    return res(true);
  }
  for(let i=0;i<Math.max(a.length,b.length);i++)if(a[i]!==b[i])return res(false,i);
  return res(true);
}
function ledText(v){return litDesc(v);}

/* ---------- 运行 ---------- */
function runAll(A,v){
  return v.scripts.map(sc=>simulate(A.prog,A.includes,v.hw,sc));
}
function refRuns(v){
  if(!v._ref){
    const A=compileC(v.ref);
    if(!A.ok)throw new Error('标准程序编译失败：'+A.errors.join('；')+'\n'+v.ref);
    v._ref=runAll(A,v);
  }
  return v._ref;
}

/* ---------- 总评分 ---------- */
function gradeVariant(v,code,opts){
  opts=opts||{};
  const A=compileC(code);
  const ref=refRuns(v);
  let stu=null;
  if(A.ok){ try{ stu=runAll(A,v); }catch(e){ A.warnings.push('模拟运行出错：'+(e&&e.message||e)); } }
  let al=null;
  const ctx={v,A,code,ref,stu,opts,
    align(){ if(!al)al=makeAligner(v.alignTemplate||v.template,code); return al; }};
  if(stu){
    stu.forEach((r,i)=>{
      if(r.status==='timeout')A.warnings.push(`运行超时（${v.scripts[i].name||'测试'+(i+1)}）：程序可能卡在某个循环里`);
      if(r.status==='runtime')A.warnings.push('运行时错误：'+r.msg);
      r.warnings.forEach(w=>{if(!A.warnings.includes(w))A.warnings.push(w);});
    });
  }
  const items=v.items.map(it=>{
    let r;
    try{ r=it.check(ctx); }catch(e){ r={pass:false,msg:'检测出错：'+(e&&e.message||e)}; }
    return {name:it.name,cat:it.cat,pts:it.pts,pass:!!r.pass,got:r.pass?it.pts:(r.partial||0),msg:r.msg||'',ans:r.ans||'',text:r.text||''};
  });
  const score=Math.round(items.reduce((a,b)=>a+b.got,0)*10)/10;
  const max=items.reduce((a,b)=>a+b.pts,0);
  const phases=v.scripts.map((sc,i)=>({
    name:sc.name,events:sc.events||[],tEnd:sc.tEnd,
    ref:phaseSeqs(ref[i],v.port,sc),
    stu:stu?phaseSeqs(stu[i],v.port,sc):null
  }));
  return {score,max,items,compileOk:A.ok,errors:A.errors,warnings:A.warnings,phases,port:v.port,seg:!!v.seg};
}

/* ---------- 整体现象对比（结果缓存在 ctx 上） ---------- */
function fullCheck(c){
  if(c._full)return c._full;
  if(!c.stu)return (c._full={pass:false,msg:NEED_RUN});
  for(let i=0;i<c.v.scripts.length;i++){
    const sc=c.v.scripts[i],P=phaseSeqs(c.ref[i],c.v.port,sc),Q=phaseSeqs(c.stu[i],c.v.port,sc);
    for(let k=0;k<P.length;k++){
      const m=seqMatch(P[k].segs,Q[k].segs);
      if(!m.pass){
        const e=P[k].segs[m.at],q=Q[k].segs[m.atStu];
        const raw=c.stu[i].trace[c.v.port].filter(x=>x.t>=P[k].from&&x.t<P[k].to).length;
        if(raw>=3*Math.max(1,Q[k].segs.length)&&raw>=6)
          return (c._full={pass:false,msg:`${sc.name?sc.name+'：':''}${P[k].label}灯变化太快（每一步亮不到 ${MIN_MS} 毫秒，眼睛看不出来），看起来像不动或全亮，检查 delay 的参数和形参类型`});
        return (c._full={pass:false,msg:`${sc.name?sc.name+'：':''}${P[k].label}的第 ${m.at+1} 步${e?'应该是“'+c.v.desc(e.v)+'”':'应该停住不动'}，${q?'你的程序是“'+c.v.desc(q.v)+'”':'你的程序停住不动了'}`});
      }
    }
  }
  return (c._full={pass:true});
}
/* ---------- 评分项构造器（题库用） ---------- */
const NEED_RUN='编译未通过，无法运行检测';
const Item={
  compile:(pts)=>({name:'编译通过',cat:'base',pts,check:c=>{
    if(c.opts.requireHex&&!(c.opts.hex&&c.opts.hex.ok))return {pass:false,msg:c.opts.hex?'hex 无效：'+c.opts.hex.msg:'未提交 .hex'};
    return {pass:c.A.ok,msg:c.A.errors.join('；')};
  }}),
  blank:(bl)=>({name:bl.name,cat:bl.cat,pts:bl.pts,check:c=>{
    const spans=c.align().blanks(bl.n);
    if(!spans.length)return {pass:false,msg:'没有找到这一空'};
    const rs=spans.map(sp=>judgeBlank(bl,sp));
    const bad=rs.find(r=>!r.pass);
    const text=rs.map(r=>r.text).join(' / ');
    return bad?{pass:false,msg:(spans.length>1?'有一处'+'：':'')+bad.msg,ans:bad.ans,text}:{pass:true,text};
  }}),
  /* 现象完全正确 */
  full:(pts)=>({name:'整体现象完全正确',cat:'full',pts,check:c=>fullCheck(c)}),
  /* 行为性质：fn(ctx) → {pass,msg} */
  prop:(name,pts,fn,cat)=>({name,cat:cat||'change',pts,check:c=>c.stu?fn(c):{pass:false,msg:NEED_RUN}}),
  /* 代码文字检查（结构分）：fn(ctx) → {pass,msg} */
  text:(name,pts,fn,cat)=>({name,cat:cat||'base',pts,check:fn}),
  /* 改错：文字上改对了，或者对应的现象对了，都算改好 */
  bug:(bug)=>({name:bug.name,cat:'change',pts:bug.pts,check:c=>{
    const span=c.align().site(bug.id);
    const k=spanNorm(span);
    const textOk=!span.lost&&bug.fixes.some(f=>normText(f)===k);
    const stillWrong=!span.lost&&normText(bug.wrongText)===k;
    if(textOk)return {pass:true,text:span.text};
    /* 写法和参考答案不同：只有整个程序的现象完全正确，才算这处也改好了 */
    if(c.stu&&!stillWrong&&fullCheck(c).pass)return {pass:true,text:span.text,msg:'写法和参考答案不同，但整体现象完全正确'};
    if(stillWrong)return {pass:false,text:span.text,msg:'这里还没改',ans:bug.hint};
    return {pass:false,text:span.text,msg:(c.A.ok?'':'程序没编译通过；')+'没改对',ans:bug.hint};
  }})
};

/* ---------- 随机数：同一个种子永远生成同一套题 ---------- */
function hashStr(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return h>>>0;}
function makeRng(seed){
  let a=hashStr(String(seed))||1;
  const next=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const R={next,
    int:(lo,hi)=>lo+Math.floor(next()*(hi-lo+1)),
    pick:arr=>arr[Math.floor(next()*arr.length)],
    chance:p=>next()<p,
    shuffle:arr=>{const b=arr.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(next()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;},
    sample:(arr,n)=>R.shuffle(arr).slice(0,n)};
  return R;
}

/* 低电平点亮：由 P0 的值写出“哪些灯亮”，连续的写成 D1～D4 */
function litDesc(v){
  const on=[];for(let b=0;b<8;b++)if(!((v>>b)&1))on.push(b+1);
  if(!on.length)return '8 个灯全灭';
  if(on.length===8)return '8 个灯全亮';
  const parts=[];let i=0;
  while(i<on.length){let j=i;while(j+1<on.length&&on[j+1]===on[j]+1)j++;
    if(j-i>=2)parts.push('D'+on[i]+'～D'+on[j]);else for(let k=i;k<=j;k++)parts.push('D'+on[k]);i=j+1;}
  return parts.join('、')+' 亮';
}

/* ---------- 带标记的源程序 ⟦id:文字⟧ ---------- */
const MK=/⟦(\w+):([^⟧]*)⟧/g;
function markerTexts(src){const m={};let x;MK.lastIndex=0;while((x=MK.exec(src))){if(!(x[1] in m))m[x[1]]=x[2];}return m;}
function render(src,opt){
  opt=opt||{};
  const num=new Map();let k=0;
  return src.replace(MK,(all,id,text)=>{
    if(opt.blanks&&opt.blanks.has(id)){
      if(!num.has(id))num.set(id,opt.blanks.get(id));
      return `______(${num.get(id)})______`;
    }
    if(opt.bugs&&opt.bugs.has(id)){
      const w=opt.bugs.get(id);
      return opt.mark?`\u0001${id}\u0003${w}\u0002`:w;
    }
    if(opt.fill&&id in opt.fill)return opt.fill[id];
    return text;
  });
}
/* 空号按出现顺序编号 */
function blankOrder(src,ids){
  const order=[];let x;MK.lastIndex=0;
  while((x=MK.exec(src))){ if(ids.has(x[1])&&!order.includes(x[1]))order.push(x[1]); }
  return new Map(order.map((id,i)=>[id,i+1]));
}

const DELAY_W='void delay(unsigned int i)\n{\n    while(i--);\n}\n';
const DELAY_F='void delay(unsigned int i)\n{\n    unsigned int k;\n    for(k = 0; k < i; k++);\n}\n';
const HDR_ANS=SFR_HEADERS.map(h=>h.toLowerCase());

/* ---------- 现象性质 ---------- */
function phMatch(si,pi,name,id){
  return {id,name,fn:c=>{
    const P=refPhase(c,si,pi),Q=stuPhase(c,si,pi);const m=seqMatch(P.segs,Q.segs);
    if(m.pass)return {pass:true};
    const e=P.segs[m.at],g=Q.segs[m.atStu];
    return {pass:false,msg:`${P.label}的第 ${m.at+1} 步${e?'应该是“'+c.v.desc(e.v)+'”':'应该停住不动'}，${g?'你的程序是“'+c.v.desc(g.v)+'”':'你的程序停住不动了'}`};
  }};
}
function phFinal(si,pi,name,id){
  return {id,name,fn:c=>{
    const P=refPhase(c,si,pi),Q=stuPhase(c,si,pi);
    const e=P.segs[P.segs.length-1].v,g=Q.segs[Q.segs.length-1].v;
    return e===g?{pass:true}:{pass:false,msg:`${P.label}应为“${c.v.desc(e)}”，实际“${c.v.desc(g)}”`};
  }};
}
const allVals=(c,si)=>segmentsOf(c.stu[si],c.v.port,0,c.v.scripts[si].tEnd).map(s=>s.v);
const refVals=(c,si)=>segmentsOf(c.ref[si],c.v.port,0,c.v.scripts[si].tEnd).map(s=>s.v);

const PAIRS=[[0xAA,0x55],[0xF0,0x0F],[0xCC,0x33],[0x00,0xFF]].map(([a,c])=>[a,c,litDesc(a),litDesc(c)]);
const FN5={crol:'led_crol',left:'led_left',right:'led_right',jo:'jioujiaoti'};
const M5={id:'M5',name:'多个按键控制花样灯',task:'教材任务3-2',circuit:'A',
  gen(rng){
    let map;
    do{ map=rng.shuffle(['crol','left','right','jo']); }while(map.filter((f,i)=>f===['crol','left','right','jo'][i]).length>1);
    let r,c,pr;
    do{ r=rng.int(1,3);c=rng.int(3,6);pr=rng.int(0,3); }while(r===2&&c===5&&pr===0);
    return {map,r,c,pr,bl:rng.sample([0,1,2,3],2)};
  },
  fdesc(p,f){
    const P=PAIRS[p.pr];
    return {crol:`从 D1 开始循环流水 ${p.r} 圈（每次亮 1 个，向 D8 方向）`,left:'从 D1 开始向 D8 方向流水一遍（用 <<，移出去的不回来）',
            right:'从 D8 开始向 D1 方向流水一遍（用 >>）',jo:`“${P[2]}”和“${P[3]}”交替闪 ${p.c} 次`}[f]+'，做完 8 个灯全灭';
  },
  code(p){
    const P=PAIRS[p.pr];
    const ifs=p.map.map((f,j)=>`        if(S${j+1} == 0)
        {
            ⟦f${j+1}:${FN5[f]}⟧();
            while(S${j+1} == 0);
        }`).join('\n');
    return `#include <⟦h:reg51.h⟧>
#include <⟦h2:intrins.h⟧>

sbit S1 = P3^4;
sbit S2 = P3^5;
sbit S3 = P3^6;
sbit S4 = P3^7;

${DELAY_F}
void led_crol(void)
{
    unsigned char i, w;
    w = 0x01;
    for(i = 0; i < ⟦cr:${8*p.r}⟧; i++)
    {
        P0 = ~w;
        delay(10000);
        w = _crol_(w, 1);
    }
    P0 = 0xFF;
}

void led_left(void)
{
    unsigned char i, w;
    w = 0x01;
    for(i = 0; i < 8; i++)
    {
        P0 = ⟦nw:~w⟧;
        delay(10000);
        w ⟦sh:<<=⟧ 1;
    }
    P0 = 0xFF;
}

void led_right(void)
{
    unsigned char i, w;
    w = ⟦rs:0x80⟧;
    for(i = 0; i < 8; i++)
    {
        P0 = ~w;
        delay(10000);
        w >>= 1;
    }
    P0 = 0xFF;
}

void jioujiaoti(void)
{
    unsigned char i;
    for(i = 0; i < ⟦jc:${p.c}⟧; i++)
    {
        P0 = ⟦ja:${H(P[0])}⟧;

const TYPE_NAME={fill:'改编填空',modify:'按要求改程序',fix:'改错'};

/* ---------- 分值分配 ---------- */
function share(total,n){ if(!n)return []; const base=Math.floor(total*2/n)/2; const arr=new Array(n).fill(base); let rest=Math.round((total-base*n)*2); for(let i=0;rest>0;i=(i+1)%n,rest--)arr[i]+=0.5; return arr; }
const WEIGHT={fill:{compile:20,base:20,change:50,full:10},modify:{compile:20,base:20,change:50,full:10},fix:{compile:20,change:70,full:10}};

/* ---------- 由（母题, 题型, 种子）生成一道完整的题 ---------- */
function buildVariant(mid,type,seed){
  const M=MOTHER_BY_ID[mid];const rng=makeRng(mid+'|'+type+'|'+seed);
  const p=M.gen(rng,type);
  const src=M.code(p);
  const C=M.circuitObj||CIRCUITS[M.circuit];
  const v={id:mid+'-'+type+'-'+seed,mother:mid,type,seed,title:`${M.name}（${TYPE_NAME[type]}）`,task:M.task,
    circuit:M.circuit,circuitText:C.text,hw:C.hw,port:C.port,seg:!!C.seg,desc:C.desc,p,
    req:M.req(p),ref:render(src),src,items:[],answer:null,bookNote:M.bookNote};
  v.scripts=M.scripts(p);
  const props=M.props(p);const propById=Object.fromEntries(props.map(x=>[x.id,x]));
  const W=WEIGHT[type];
  v.items.push(Item.compile(W.compile));
  if(type==='fill'){
    const B=M.blanks(p),mt=markerTexts(src);
    const order=blankOrder(src,new Set(B.map(b=>b.id)));
    B.forEach(b=>{ b.n=order.get(b.id); if(!b.ans){ b.ans=b.kind==='num'?[constEval(mt[b.id])]:[mt[b.id]]; } if(!b.show)b.show=b.kind==='num'&&b.hex?H(b.ans[0]):String(b.ans[0]); });
    B.sort((a,b)=>a.n-b.n);
    const base=B.filter(b=>b.cat==='base'),chg=B.filter(b=>b.cat==='change');
    /* 没有“改动空”时（原程序没有可改的参数），改动分并进基础空，保证标准答案能拿满分 */
    share(chg.length?W.base:W.base+W.change,base.length).forEach((x,i)=>base[i].pts=x);
    share(W.change,chg.length).forEach((x,i)=>chg[i].pts=x);
    B.forEach(b=>{ b.name=`空(${b.n}) ${b.name}`; v.items.push(Item.blank(b)); });
    v.blanks=B;
    v.template=render(src,{blanks:order});
    v.answer=B.map(b=>`空(${b.n})：${b.show}`);
    v.howto='把所有 ______(n)______ 换成正确的代码（空号相同的填同样内容），其他地方不要改。';
  } else if(type==='modify'){
    /* 教材程序本来就能做到的现象（basic）算进基础分，真正要改的现象按权重分 50 分 */
    const S=M.structure(p),basic=props.filter(x=>x.basic),chg=props.filter(x=>!x.basic);
    const baseItems=S.map(s=>Item.text(s.name,0,s.fn)).concat(basic.map(x=>Item.prop(x.name,0,x.fn,'base')));
    share(W.base,baseItems.length).forEach((x,i)=>{baseItems[i].pts=x;v.items.push(baseItems[i]);});
    const w=chg.map(x=>x.w||1),tw=w.reduce((a,c)=>a+c,0);
    const pts=chg.map((x,i)=>Math.round(W.change*w[i]/tw*2)/2);pts[0]+=W.change-pts.reduce((a,c)=>a+c,0);
    chg.forEach((x,i)=>v.items.push(Item.prop(x.name,pts[i],x.fn)));
    v.template=M.book(p);
    v.howto=`下面是参考程序（${M.bookNote}），它实现的不是本题要求。请在它的基础上修改，实现上面的要求。`;
  } else {
    const bs=M.bugs(p);
    const pick=[rng.pick(bs.compile),...rng.sample(bs.logic.filter(b=>true),2)].filter(Boolean);
    const uniq=[];pick.forEach(b=>{if(!uniq.some(u=>u.id===b.id))uniq.push(b);});
    while(uniq.length<3){const more=bs.logic.find(b=>!uniq.some(u=>u.id===b.id));if(!more)break;uniq.push(more);}
    const mt=markerTexts(src);
    const bugMap=new Map(uniq.map(b=>[b.id,b.wrong]));
    share(W.change,uniq.length).forEach((x,i)=>{const b=uniq[i];
      v.items.push(Item.bug({id:b.id,name:'改错：'+b.name,pts:x,hint:b.hint,wrongText:b.wrong,fixes:b.fixes||[mt[b.id]],prop:b.prop&&propById[b.prop]?propById[b.prop].fn:null}));});
    v.bugs=uniq;
    v.template=render(src,{bugs:bugMap});
    v.alignTemplate=render(src,{bugs:bugMap,mark:true});
    v.howto=`下面的程序里有 ${uniq.length} 处错误（含会导致编译出错的），找出来改正，其他地方不用动。`;
    v.answer=uniq.map((b,i)=>`错误 ${i+1}：${b.wrong?'“'+b.wrong+'”':'（缺了一行）'} → “${(b.fixes||[mt[b.id]])[0]}”（${b.hint}）`);
  }
  v.items.push(Item.full(W.full));
  return v;
}

   每题 = 母题号（0 表示随机，1～6 对应 M1～M6）+ 题型字母（t 改编填空 / g 按要求改程序 / c 改错）+ 分值，

    case 'outidx':{const opts=range(0,site.max||0).filter(x=>x!==v);return opts.length?{[site.id]:String(rng.pick(opts))}:null;}
    case 'sbitbit':{
      const isKey=site.name&&circ.keys[site.name];
      if(isKey){   // 两个按键互换引脚
        const other=sites.filter(s=>s.kind==='sbitbit'&&s!==site&&circ.keys[s.name]&&s.text!==site.text);
        if(!other.length)return null;const o=rng.pick(other);return {[site.id]:o.text,[o.id]:site.text};
      }
      const used=new Set(sites.filter(s=>s.kind==='sbitbit').map(s=>numVal(s.text)));
      const opts=range(0,7).filter(b=>!used.has(b));return opts.length?{[site.id]:String(rng.pick(opts))}:null;}
    case 'bitval':return {[site.id]:site.text==='0'?'1':'0'};
    case 'bitname':{   // 换成同一个端口的另一位（另一个灯）
      const used=new Set(sites.filter(s=>s.kind==='bitname'&&s.text.slice(0,2)===site.text.slice(0,2)).map(s=>s.text.slice(-1)));
      const opts=range(0,7).map(String).filter(b=>!used.has(b));
      return opts.length?{[site.id]:site.text.slice(0,-1)+rng.pick(opts)}:null;}
    case 'case':{   // 两个 case 的值互换
      const other=sites.filter(s=>s.kind==='case'&&s!==site&&s.text!==site.text);
      if(!other.length)return null;const o=rng.pick(other);return {[site.id]:o.text,[o.id]:site.text};}
  }
  return null;
}

/* ---------- 测试动作：按键按多久、隔多久，按原程序的实际反应来定 ---------- */
function buildScripts(code,circ){
  const A=compileC(code);
  const keys=Object.keys(circ.keys);
  const lastChange=(run,from)=>{const tr=run.trace[circ.port].filter(x=>x.t>from);return tr.length?tr[tr.length-1].t:from;};
  if(!keys.length){
    const r=simulate(A.prog,A.includes,{keys:{}},{events:[],tEnd:12000});
    const lc=lastChange(r,0);
    const tEnd=lc>9000?7000:Math.min(9000,Math.max(2500,lc*1.6+1500));
    return [{name:'上电运行',events:[],tEnd:Math.round(tEnd)}];
  }
  const ev=[];let t=700;
  const ks=keys.length>8?keys.slice(0,8):keys;
  const valAt=(run,tt)=>{let v=0xFF;for(const x of run.trace[circ.port]){if(x.t>tt)break;v=x.v;}return v;};
  /* 同一个键连着按，直到松手后的状态开始重复（模式转了一圈），最多 6 次；“按住才亮”的程序按一次就回到原状态，自然只按一次 */
  ks.forEach(k=>{
    const hold=1200,seen=[];
    for(let j=0;j<6;j++){
      const trial=ev.concat([{t,key:k,down:true},{t:t+hold,key:k,down:false}]);
      const r=simulate(A.prog,A.includes,{keys:circ.keys},{events:trial,tEnd:t+9000});
      const busy=lastChange(r,t)-t;
      const gap=Math.round(Math.min(6000,Math.max(hold+800,busy*1.6+800)));
      if(j===0)seen.push(valAt(r,t-1));
      ev.push({t,key:k,down:true},{t:t+hold,key:k,down:false});
      const after=valAt(r,t+gap-50);
      t+=gap;
      if(seen.includes(after))break;
      seen.push(after);
    }
  });
  return [{name:'依次按键',events:ev,tEnd:t+300}];
}

/* ---------- 用现象自动写出“要求” ---------- */
function describeRuns(runs,scripts,port,desc){
  const lines=[];
  scripts.forEach((sc,si)=>{
    let prevLast=null,noChange=[];
    const flush=()=>{if(noChange.length){lines.push(`按下 ${noChange.join('、')} 后：${noChange.length>1?'都':''}没有变化`);noChange=[];}};
    phaseSeqs(runs[si],port,sc).forEach((ph,k,arr)=>{
      const vs=ph.segs.map(s=>desc(s.v));
      if(!vs.length)return;
      const unchanged=ph.segs.length===1&&prevLast!==null&&ph.segs[0].v===prevLast;
      prevLast=ph.segs[ph.segs.length-1].v;
      if(unchanged){
        if(/^按下 /.test(ph.label))noChange.push(ph.label.replace(/^按下 /,'').replace(/ 后$/,''));
        return;   // 松开后没变化就不写
      }
      flush();
      const last=ph.segs[ph.segs.length-1],settled=(last.t1-last.t0)>=Math.max(300,(ph.to-ph.from)*0.25);
      let txt;
      if(vs.length===1)txt=`保持“${vs[0]}”`;
      else if(vs.length<=6)txt=vs.map(x=>`“${x}”`).join(' → ')+(settled?'，然后保持':'……');
      else txt=vs.slice(0,6).map(x=>`“${x}”`).join(' → ')+(settled?`……共 ${vs.length} 步，最后停在“${vs[vs.length-1]}”`:'……（一直这样变下去）');
      lines.push(`${ph.label}：${txt}`);
    });
    flush();
  });
  return lines;
}

/* ---------- 自定义母题 ---------- */
const KIND_NAME={out:'输出到端口的值',val:'变量的初值',rot:'循环移位函数',shift:'移位运算符',count:'循环次数',loopinit:'循环的初值',sbitbit:'sbit 位号',case:'case 的值',cmp:'比较的值',outidx:'段码表下标',hdr:'头文件',tab:'表里的值',bitname:'端口位名',bitval:'给这一位的值'};

function makeCustomMother(cfg,index){
  const code=String(cfg.code).replace(/\r\n?/g,'\n');
  const circ={port:cfg.port,kind:cfg.kind,keys:cfg.keys||{}};
  const sites=findSites(code,circ);
  const desc=circ.kind==='seg'?segText:litDesc;
  const C={hw:{keys:circ.keys},port:circ.port,seg:circ.kind==='seg',desc,text:circuitText(circ)};
  const scripts=buildScripts(code,circ);
  const runOf=src=>{const A=compileC(src);if(!A.ok)return null;try{return scripts.map(sc=>simulate(A.prog,A.includes,C.hw,sc));}catch(e){return null;}};
  const origRuns=runOf(code);
  const offV=0xFF;
  const anyLit=runs=>runs.some((r,i)=>phaseSeqs(r,circ.port,scripts[i]).some(p=>p.segs.some(g=>g.v!==offV)));
  const visibleCount=runs=>{const s=new Set();runs.forEach((r,i)=>phaseSeqs(r,circ.port,scripts[i]).forEach(p=>p.segs.forEach(g=>s.add(g.v))));return s.size;};
  const sameRuns=(a,b)=>scripts.every((sc,i)=>{const P=phaseSeqs(a[i],circ.port,sc),Q=phaseSeqs(b[i],circ.port,sc);return P.every((p,k)=>seqMatch(p.segs,Q[k].segs).pass);});
  const okRun=runs=>runs&&runs.every(r=>r.status!=='timeout'&&r.status!=='runtime');
  const mutable=sites.filter(s=>PICK_W[s.kind]);
  const mutCache=new Map();
  const M={
    id:'C'+(index+1),letter:String.fromCharCode(65+index),name:cfg.name||('导入程序 '+(index+1)),task:'导入的书上代码',custom:true,
    circuit:'custom',circuitObj:C,bookNote:'导入的原程序：'+(cfg.name||''),code0:code,sites,scripts,origRuns,
    /* 每道题先找一组有效的参数改动：编译通过、能正常运行、现象和原程序不同、而且看得出变化 */
    gen(rng,type){
      for(let attempt=0;attempt<40;attempt++){

        if(!pool.length)break;
        const n=rng.chance(0.4)?2:1;const ch={};
        for(let j=0;j<n;j++){const s=rng.pick(pool);const m=mutateOnce(s,rng,sites,circ);if(m)Object.assign(ch,m);}
        if(!Object.keys(ch).length)continue;
        const key=JSON.stringify(ch);
        let ok=mutCache.get(key);
        if(ok===undefined){
          const runs=runOf(markSource(code,sites,ch).replace(MK,(a,id,t)=>t));
          ok=!!(okRun(runs)&&!sameRuns(origRuns,runs)&&visibleCount(runs)>=Math.min(2,visibleCount(origRuns))&&(anyLit(runs)||!anyLit(origRuns)));
          mutCache.set(key,ok);
        }
        if(ok)return {changes:ch,type,bugSeed:rng.int(1,1e9)};
      }
      return {changes:{},type,bugSeed:rng.int(1,1e9),noMutation:true};
    },
    code(p){return markSource(code,sites,p.changes);},
    req(p){
      const target=render(this.code(p));
      const runs=runOf(target);
      const lines=runs?describeRuns(runs,scripts,circ.port,desc):[];
      return [p.noMutation?'这段程序没找到能自动修改的参数，下面就是原程序的现象：':'程序要实现的现象（可以在网页上播放“目标现象”动画对照）：',...lines.map(s=>'  '+s)];
    },
    book(){return code;},
    blanks(p){
      const changed=sites.filter(s=>s.id in p.changes);
      const rng=makeRng('blanks|'+p.bugSeed);
      const others=rng.shuffle(sites.filter(s=>!(s.id in p.changes)&&['hdr','rot','count','out','val','sbitbit','shift','outidx','loopinit','bitname','bitval'].includes(s.kind)));
      const pick=changed.concat(others.slice(0,Math.max(1,5-changed.length)));
      return pick.map(s=>{
        const ansText=s.id in p.changes?p.changes[s.id]:s.text;
        const isNum=/^0[xX]|^\d/.test(ansText);
        const b={id:s.id,cat:s.id in p.changes?'change':'base',name:`第 ${s.line} 行 ${KIND_NAME[s.kind]||'这一空'}`};
        if(s.kind==='hdr'){b.kind='header';b.ans=SFR_HEADERS.includes(ansText.toUpperCase())?HDR_ANS.concat([ansText]):[ansText];b.show=ansText;}
        else if(isNum){b.kind='num';b.hex=/^0[xX]/.test(ansText);b.mask=0xFFFF;b.ans=[numVal(ansText)];b.show=ansText;}
        else{b.kind='text';b.ans=[ansText];b.show=ansText;}
        return b;
      });
    },
    bugs(p){
      const target=markSource(code,sites,p.changes);
      const tRuns=runOf(render(target));
      const rng=makeRng('bugs|'+p.bugSeed);
      const textOf=s=>s.id in p.changes?p.changes[s.id]:s.text;
      const compile=[],logic=[];
      rng.shuffle(sites).forEach(s=>{
        const cur=textOf(s);let wrong=null,isCompile=false;
        switch(s.kind){
          case 'hdr':if(/51/.test(cur)){wrong=cur.replace('51','15');isCompile=true;}break;
          case 'semi':wrong='';isCompile=true;break;
          case 'call':wrong=cur[0]===cur[0].toUpperCase()?cur[0].toLowerCase()+cur.slice(1):cur[0].toUpperCase()+cur.slice(1);isCompile=true;break;
          case 'out':wrong=fmtLike(cur,(~numVal(cur))&0xFF);break;
          case 'rot':case 'shift':wrong=mutateOnce(Object.assign({},s,{text:cur}),rng,sites,circ)[s.id];break;
          case 'count':case 'loopinit':{const v=numVal(cur);wrong=fmtLike(cur,v+(rng.chance(0.5)&&v>1?-1:1));break;}
          case 'val':{const v=numVal(cur);wrong=fmtLike(cur,v^(1<<rng.int(0,7)));break;}
          case 'bitname':{const d=+cur.slice(-1);wrong=cur.slice(0,-1)+((d+1)%8);break;}
          case 'bitval':wrong=cur==='0'?'1':'0';break;
          case 'brk':wrong='';break;
          case 'eq':wrong='!=';break;
          case 'tilde':wrong='';break;
        }
        if(wrong===null||wrong===undefined||wrong===cur)return;
        const src=render(markSource(code,sites,Object.assign({},p.changes,{[s.id]:wrong})));
        const A=compileC(src);
        if(isCompile){if(!A.ok&&compile.length<3)compile.push({id:s.id,wrong,hint:BUG_HINT[s.kind],name:`第 ${s.line} 行`,fixes:[cur]});return;}
        if(!A.ok||logic.length>=4)return;
        const runs=runOf(src);
        if(runs&&tRuns&&okRun(runs)&&!sameRuns(tRuns,runs))logic.push({id:s.id,wrong,hint:BUG_HINT[s.kind],name:`第 ${s.line} 行`,fixes:[cur]});
      });
      if(!compile.length)compile.push(...logic.splice(0,1));
      return {compile,logic};
    },
    scripts(){return scripts;},
    props(p){
      const tRuns=runOf(render(this.code(p)));
      const P=[];
      scripts.forEach((sc,si)=>{
        const T0=phaseSeqs(origRuns[si],circ.port,sc),T1=tRuns?phaseSeqs(tRuns[si],circ.port,sc):T0;
        T1.forEach((ph,pi)=>{
          const same=seqMatch(T0[pi].segs,ph.segs).pass;
          P.push(Object.assign(phMatch(si,pi,`${ph.label}的现象`,'ph'+si+'_'+pi),{basic:same}));
        });
      });
      if(P.every(x=>x.basic))P.forEach(x=>x.basic=false);
      return P;
    },
    structure(){
      const S=[];
      const A0=compileC(code);
      if(A0.includes.some(i=>SFR_HEADERS.includes(i.name.toUpperCase())))S.push({name:'包含单片机头文件',fn:c=>({pass:c.A.includes.some(i=>SFR_HEADERS.includes(i.name.toUpperCase()))})});
      if(/while\s*\(\s*1\s*\)/.test(A0.stripped))S.push({name:'有 while(1) 主循环',fn:c=>({pass:/while\s*\(\s*1\s*\)|for\s*\(\s*;\s*;\s*\)/.test(c.A.stripped)})});
      if(/\bvoid\s+\w*delay\w*\s*\(/i.test(A0.stripped))S.push({name:'有延时函数',fn:c=>({pass:/\bvoid\s+\w*delay\w*\s*\(/i.test(c.A.stripped)})});
      if(!S.length)S.push({name:'有 main 函数',fn:c=>({pass:/\bmain\s*\(/.test(c.A.stripped)})});
      return S;
    }
  };
  return M;
}
/* 检查导入的程序能不能用来出题 */
function analyzeImport(code){
  const d=detectCircuit(code);
  if(!d.ok)return d;
  const A=compileC(code);
  const tr=simulate(A.prog,A.includes,{keys:d.keys},{events:[],tEnd:3000});

/* ================= 网页内置编译器：题库范围的 C51 子集 → 8051 机器码 → Intel HEX =================
   前端（预处理、语法、名字检查）复用 core.js 的 compileC，编译错误和 Keil 判断一致。
   不支持：long/float、指针、字符串、中断函数、递归（遇到会给出明确提示）。
   所有变量静态分配在内部 RAM（地址 0x08 起，用到 bit 变量时让出 0x20）；表达式结果约定：8 位在 A，16 位在 R6(高):R7(低)。 */
'use strict';

const SFR_ADDR={P0:0x80,SP:0x81,DPL:0x82,DPH:0x83,PCON:0x87,TCON:0x88,TMOD:0x89,TL0:0x8A,TL1:0x8B,TH0:0x8C,TH1:0x8D,P1:0x90,SCON:0x98,SBUF:0x99,P2:0xA0,IE:0xA8,P3:0xB0,IP:0xB8,PSW:0xD0,ACC:0xE0,B:0xF0};
const PORT_SFR=[0x80,0x90,0xA0,0xB0];
const ACC_D=0xE0,B_D=0xF0;
const CC_CMP=new Set(['==','!=','<','>','<=','>=']);
const CC_SWAP={'<':'>','>':'<','<=':'>=','>=':'<=','==':'==','!=':'!='};
const ccErr=msg=>({cc:true,msg});

/* ---------- 汇编器：相对跳转超出 -128～127 时自动改成“反向短跳 + LJMP” ---------- */
class Asm8051{
  constructor(){this.items=[];this.k=0;}
  L(p){return (p||'L')+'_'+(this.k++);}
  at(l){this.items.push({t:'lab',l});}
  b(...x){this.items.push({t:'raw',x});}
  abs(op,l){this.items.push({t:'abs',op,l});}
  ljmp(l){this.abs(0x02,l);} lcall(l){this.abs(0x12,l);}
  sjmp(l){this.items.push({t:'br',k:'sjmp',l});}
  j1(op,l){this.items.push({t:'br',k:'j1',op,l});}            // JZ 60 / JNZ 70 / JC 40 / JNC 50
  jb(op,bit,l){this.items.push({t:'br',k:'jb',op,bit,l});}    // JB 20 / JNB 30
  cj(op,x,l){this.items.push({t:'br',k:'cj',op,x,l});}        // CJNE 系列：不相等时跳
  djnz(n,l){this.items.push({t:'br',k:'dj',op:0xD8+n,l});}
  size(it){
    if(it.t==='lab')return 0; if(it.t==='raw')return it.x.length; if(it.t==='abs')return 3;
    const L=it.long;
    switch(it.k){case 'sjmp':return L?3:2;case 'j1':return L?5:2;case 'jb':return L?6:3;case 'cj':return L?8:3;case 'dj':return L?7:2;}
  }
  assemble(){
    const lab={};let changed=true;
    while(changed){
      changed=false;let pc=0;
      this.items.forEach(it=>{it.addr=pc;if(it.t==='lab')lab[it.l]=pc;pc+=this.size(it);});
      this.items.forEach(it=>{
        if(it.t!=='br'||it.long)return;
        if(!(it.l in lab))throw new Error('未定义标号 '+it.l);
        const r=lab[it.l]-(it.addr+this.size(it));
        if(r<-128||r>127){it.long=true;changed=true;}
      });
      this.total=pc;
    }
    const out=[];
    const INV={0x60:0x70,0x70:0x60,0x40:0x50,0x50:0x40,0x20:0x30,0x30:0x20};
    this.items.forEach(it=>{
      if(it.t==='raw'){out.push(...it.x);return;}
      if(it.t==='lab')return;
      const T=lab[it.l];if(T===undefined)throw new Error('未定义标号 '+it.l);
      const hi=T>>8,lo=T&0xFF;
      if(it.t==='abs'){out.push(it.op,hi,lo);return;}
      const rel=()=>(T-(it.addr+this.size(it)))&0xFF;
      if(!it.long){
        switch(it.k){case 'sjmp':out.push(0x80,rel());break;case 'j1':out.push(it.op,rel());break;case 'jb':out.push(it.op,it.bit,rel());break;
          case 'cj':out.push(it.op,it.x,rel());break;case 'dj':out.push(it.op,rel());break;}
      } else {
        switch(it.k){
          case 'sjmp':out.push(0x02,hi,lo);break;
          case 'j1':out.push(INV[it.op],3,0x02,hi,lo);break;
          case 'jb':out.push(INV[it.op],it.bit,3,0x02,hi,lo);break;
          case 'cj':out.push(it.op,it.x,2,0x80,3,0x02,hi,lo);break;
          case 'dj':out.push(it.op,2,0x80,3,0x02,hi,lo);break;
        }
      }
    });
    return out;
  }
}

function toIntelHex(bytes){
  const h=v=>v.toString(16).toUpperCase().padStart(2,'0');
  const lines=[];
  for(let off=0;off<bytes.length;off+=16){
    const d=bytes.slice(off,off+16),rec=[d.length,(off>>8)&0xFF,off&0xFF,0,...d];
    const sum=(-rec.reduce((a,b)=>a+b,0))&0xFF;
    lines.push(':'+rec.map(h).join('')+h(sum));
  }
  lines.push(':00000001FF');
  return lines.join('\r\n')+'\r\n';
}

/* ---------- 入口：源码 → {ok, hex, size, errors} ---------- */
function compileToHex(src){
  const A=compileC(src);
  if(!A.ok)return {ok:false,errors:A.errors};
  try{
    const r=c51Codegen(A);
    return {ok:true,hex:toIntelHex(r.bytes),size:r.bytes.length,ram:r.ram};
  }catch(e){
    if(e&&e.cc)return {ok:false,errors:[e.msg]};
    return {ok:false,errors:['网页编译器内部错误：'+(e&&e.message||e)+'（请改用 Keil 编译，并把代码发给老师）']};
  }
}

function c51Codegen(A){
  const prog=A.prog,asm=new Asm8051();

  const sfrAlias={};prog.sfrs.forEach(s=>{const v=foldConst(s.e);if(v!==null)sfrAlias[s.name]=v;});
  const sbits=new Map();
  prog.sbits.forEach(s=>{const t=sbitTarget(s.e,Object.fromEntries(Object.entries(sfrAlias).filter(([k,v])=>PORT_SFR.includes(v)).map(([k,v])=>[k,PORTS[PORT_SFR.indexOf(v)]])));if(t)sbits.set(s.name,PORT_SFR[t.port]+t.bit);});
