<!doctype html>
<html lang="zh-CN" data-hx-peanut>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 设置 · 华夏工具</title>
<!-- 主题按 data-tool="ai" 分键（和刷题/排课等工具一样）：这个页面的背景 / 主题色独立存 hx-theme:s:ai，
     改这里不影响首页、也不影响别的工具。别漏了 data-tool，否则会写进 home 键、和首页互相污染。 -->
<script src="../hx-theme.js" data-tool="ai"></script>
<!-- 一个设置型页面，不是聊天工具：在哪儿配模型、在哪儿指定工具用哪套。
     配置走 hx-ai.js 的存储契约（localStorage hx-ai-v1 + 分开存的 Key），各工具引同一个脚本读同一份数据。
     2026-11-15：改成「平台 → 模型」两级。一个平台 = 一个 Key + 一个接口地址，
     它下面挂任意多个模型；Key 只填一次，模型随你加。
     为什么这么改（用户原话）：一个 Key 想多用几个模型就得重复配 N 套、填 N 次 Key；
     而且老界面里任何模型都能被选去干任何事，给 DeepSeek 设成「视频生成」默认，要到真调用才报错。 -->
<style>
:root{
  /* 浅色底跟全站标准底色走（hx-theme.js 的 --hx-page = #f5f5f7）；没引到主题时退回 #f4f6fa。
     2026-11-17：浅色底全站统一（本页与「使用说明」同源，两页一起改才不会有色差）。深色块不动。 */
  --bg:var(--hx-page,#f4f6fa); --panel:#fff; --panel2:#f7f9fc; --edge:#e3e8f0; --ink:#1b2333; --dim:#77839a; --faint:#a2adbf;
  --acc:#5e5ce6; --acc2:#7c5cff; --ok:#17a34a; --bad:#dc2626; --warn:#b45309;
  --shadow:0 14px 34px -24px rgba(23,33,58,.5);
}
/* 深浅色跟随主题：hx-theme.js 会在 <html> 上写 data-hx-mode；主题色 --acc/--acc2 由 hx-theme.js 行内覆盖，
   这里只管背景/面板/文字这些中性色。没引到主题时退回系统偏好（:not([data-hx-mode])）。 */
@media (prefers-color-scheme: dark){
  :root:not([data-hx-mode]){ --bg:#0f1420; --panel:#161d2b; --panel2:#1c2536; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
    --ok:#3ddc84; --bad:#ff6b6b; --warn:#f0b429; --shadow:0 16px 38px -26px rgba(0,0,0,.9); }
}
:root[data-hx-mode="dark"]{ --bg:#0f1420; --panel:#161d2b; --panel2:#1c2536; --edge:#25304a; --ink:#e8edf7; --dim:#94a1b8; --faint:#5d6a82;
  --ok:#3ddc84; --bad:#ff6b6b; --warn:#f0b429; --shadow:0 16px 38px -26px rgba(0,0,0,.9); }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.62 "Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 70px}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
/* .back 已随「← 回首页」一起删掉（2026-11-16）：返回统一交给总入口外壳那一颗。 */
h1{margin:0;font-size:19px;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
h1 i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;
  background:linear-gradient(140deg,var(--acc),var(--acc2));box-shadow:0 8px 18px -10px var(--acc)}
.count{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--dim);padding:5px 11px;border-radius:999px;
  background:var(--panel);border:1px solid var(--edge)}
main{padding-top:16px}
.lead{margin:0 0 16px;font-size:13.5px;line-height:1.7;color:var(--dim);background:var(--card,var(--panel));border:1px solid var(--edge);
  border-left:3px solid var(--acc);border-radius:12px;padding:12px 14px}
.lead b{color:var(--ink)}
/* ---- 矩阵骨架（2026-11-19） ----
   用户两次反馈「两边特别空、要铺满矩阵」：单栏窄条把 70% 宽度浪费在壁纸上了。
   改回宽幅 + 两列网格：左列放「平台与模型」（最重的一张），右列竖排「按能力设默认」「识别用模型」，
   底部再两列「导入导出」「注册渠道」。卡片铺满可用宽度，宽屏不再左右空。 */
.wrap{max-width:1440px;margin:0 auto;padding:0 20px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
/* 最底一排：导入导出 + 注册渠道，两列铺满。 */
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:1000px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .bottom{grid-template-columns:minmax(0,1fr)}
}
.card{background:var(--card,var(--panel));border:1px solid var(--edge);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
/* ── 有壁纸时的玻璃（2026-11-16 补：本页以前一条玻璃配方都没有）──
   用户报障「背景完全又不透明了　卡片也改不了」。实测本页所有卡片永远是 --panel 实色：
   既看不见壁纸，也完全不认外观面板的「卡片通透度」(--hx-a)，拖到底都没反应。
   配方与 hx-theme.css / help 页同源：alpha = 基础值 × --hx-a，并同样定义 --card 供别处复用。 */
:root{
  /* --card：无壁纸时的卡底。通透度 100（--hx-a=1）时就是实色，和以前一样；
     只有往「更透」拖才会真透出来。公式与 hx-theme.css 对齐。 */
  --card: rgb(255 255 255 / var(--hx-a, 1));
  --card2: rgb(247 249 252 / var(--hx-a, 1));
  --glass-card: rgb(255 255 255 / calc(var(--hx-a, 1) * .62));
}
:root[data-hx-mode="dark"]{
  --card: rgb(22 29 43 / var(--hx-a, 1));
  --card2: rgb(28 37 54 / var(--hx-a, 1));
  /* 2026-11-17 与使用说明页同一条口径：文档类页面的玻璃用**白雾**，不用黑纱。
     原来这里是 rgb(12 15 20 / .56) 在加黑，深色壁纸上暗部细节全丢，用户看到的是一块糊。
     公式：白 × (--hx-a × .12) → 150 最透 .06 / 100 默认 .12 / 0 最实 .24。
     别推广到功能页（刷题、排课那些），那边要保持加黑的可读性。 */
  --glass-card: rgb(255 255 255 / calc(var(--hx-a, 1) * .12));
}
html.hx-bg .card,
html.hx-bg .plat,
html.hx-bg .lead{
  background-color: var(--glass-card);
  border-color: rgba(18,22,30,.14);
  box-shadow: var(--glass-drop, 0 24px 48px -26px rgba(15,22,35,.38)), inset 0 .8px 0 rgba(255,255,255,.8);
}
html.hx-bg[data-hx-mode="dark"] .card,
html.hx-bg[data-hx-mode="dark"] .plat,
html.hx-bg[data-hx-mode="dark"] .lead{
  background-color: var(--glass-card);
  border-color: rgba(255,255,255,.12);
  box-shadow: var(--glass-drop, 0 22px 54px -28px rgba(0,0,0,.9)), inset 0 .8px 0 rgba(255,255,255,.12);
}
html.hx-bg .card,
html.hx-bg .plat,
html.hx-bg .lead{
  /* 2026-11-17 用户定：标准模式也不要实时模糊（原话「我现在用的就是静态图　目前还是模糊的」）。
     以前是 saturate(180%) blur(18px)，把背后的壁纸糊成一大团光晕，背景图等于白放。
     玻璃感靠半透明色纱 + 边框 + 内高光撑，背景必须清晰透出来。 */
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.card > h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > .sub{margin:0 0 12px;font-size:13px;color:var(--dim);line-height:1.65}
.card > h2 .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:10px;border:1px solid var(--edge);
  background:var(--panel);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:linear-gradient(140deg,var(--acc),var(--acc2));border-color:transparent;color:var(--on-acc,#fff);
  box-shadow:0 10px 20px -12px var(--acc)}
.btn.pri:hover{filter:brightness(1.06);color:var(--on-acc,#fff)}
.btn.sm{font-size:12.5px;padding:6px 11px;border-radius:9px}
.btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* ---- 平台卡片（2026-11-15 新增） ---- */
#plats:empty::after{content:'还没有平台。点右上角「+ 新增平台」，把 Key 和接口地址加进来 —— 同一个 Key 下的模型都挂在它下面。';
  display:block;font-size:13.5px;color:var(--faint);padding:12px 2px 4px}
.plat{border:1px solid var(--edge);border-radius:14px;background:var(--card2,var(--panel2));padding:13px;margin-bottom:12px}
.plat:last-child{margin-bottom:0}
.phead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.phead .pt{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phead .pt b{font-size:15px}
.phead .pm{flex:1 1 100%;margin:1px 0 0;font-size:12px;color:var(--dim);word-break:break-all;
  font-family:ui-monospace,Consolas,monospace}
.pacts{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.pmsg{margin:8px 0 0;font-size:12.5px;color:var(--dim)}
.pmsg.bad{color:var(--bad)} .pmsg.good{color:var(--ok)}
.mrows{margin-top:11px;border-top:1px dashed var(--edge);padding-top:2px}
/* 2026-11-19：模型列表按功能分组展示（收起后点「查看模型」才展开），组头带小计数 */
.mgrp{margin:8px 0 2px}
.mgrp-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--acc);margin:4px 0 2px}
.mgrp-h span{font-size:11px;color:var(--dim);font-weight:500;background:var(--card2,var(--panel2));border:1px solid var(--edge);
  border-radius:999px;padding:0 7px;line-height:16px}
.mgrp .mrow{border-top:1px solid var(--edge)}
.mgrp .mrow:first-child{border-top:1px solid var(--edge)}
.mempty{margin:9px 0 3px;font-size:12.5px;color:var(--faint);line-height:1.6}
.mrow{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--edge)}
.mrow:first-child{border-top:0;padding-top:8px}
.mmain{flex:1 1 240px;min-width:0}
.mmain .mt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mmain .mt b{font-size:14.5px}
.mmain .mt code{font-size:11.5px;color:var(--dim);background:var(--card,var(--panel));border:1px solid var(--edge);
  border-radius:6px;padding:1px 6px;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
.mmain .u{margin:4px 0 0;font-size:11.5px;color:var(--dim);line-height:1.55}
.mmain .u b{color:var(--ink);font-weight:700}
.macts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:none;padding-top:2px}
.rmsg{flex:1 1 100%;margin:0;font-size:12.5px;color:var(--dim);min-height:0}
.rmsg:empty{display:none}
.rmsg.bad{color:var(--bad)} .rmsg.good{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--dim);background:var(--panel)}
.chip.on{border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc)}
.pv{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:7px;color:var(--acc);
  background:color-mix(in srgb,var(--acc) 13%,transparent)}
.kst{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--edge);color:var(--faint)}
.kst.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.tl-chip{font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
/* ---- 表单 ---- */
form.pf,form.mf{border-top:1px solid var(--edge);margin-top:12px;padding-top:14px}
form.mf{border:1px solid color-mix(in srgb,var(--acc) 45%,var(--edge));border-radius:14px;padding:14px;margin-top:14px;
  background:color-mix(in srgb,var(--acc) 4%,var(--panel))}
form.pf h3,form.mf h3{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
form.pf h3 small,form.mf h3 small{font-size:11.5px;font-weight:700;color:var(--faint)}
label.fld{display:block;margin:0 0 11px;font-size:13px;font-weight:700;color:var(--dim)}
label.fld > span{display:block;margin-bottom:5px}
input[type=text],input[type=url],input[type=password],select,textarea{
  width:100%;font:inherit;font-size:14px;font-weight:400;color:var(--ink);background:var(--panel2);
  border:1px solid var(--edge);border-radius:10px;padding:9px 11px}
select{padding:8px 9px;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--panel)}
textarea{resize:vertical;line-height:1.55;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line > input,.line > select{flex:1 1 200px;min-width:0}
.caps{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:2px 0 10px;font-size:13.5px}
.caps > span{font-size:13px;font-weight:700;color:var(--dim);flex:1 0 100%}
/* 只读能力来源说明（2026-11-19）：不再勾选，改展示 + 一句「这能力哪来的」 */
.caps .capnote{font-weight:400;font-size:12px;color:var(--faint);margin:-4px 0 0;flex:1 0 100%}
.caps label,.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:400;color:var(--ink);cursor:pointer}
.chk{margin:0 0 12px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc);flex:none}
.hint{font-size:12px;color:var(--faint);font-weight:400}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.msg{margin:0;font-size:13px;color:var(--dim);flex:1 1 180px;min-width:0}
.msg.bad{color:var(--bad)} .msg.good{color:var(--ok)}
/* ---- 自定义模型下拉（替代原生 datalist：后者在某些内核里点不弹、选中不灵，见 README） ---- */
.combo{position:relative}
.mdd{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:30;max-height:264px;overflow:auto;
  background:var(--panel);border:1px solid var(--edge);border-radius:11px;box-shadow:var(--shadow);padding:4px}
.mdd .opt{display:block;width:100%;text-align:left;padding:8px 11px;font-size:13px;line-height:1.4;color:var(--ink);
  background:none;border:0;border-radius:8px;cursor:pointer;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
.mdd .opt:hover,.mdd .opt.sel{background:var(--panel2)}
.mdd .grp{padding:7px 11px 2px;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.3px}
.mdd .grp:first-child{padding-top:5px}
.mdd .empty{padding:10px 11px;font-size:12.5px;color:var(--faint)}
.mdd .tip{padding:7px 11px 3px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--edge);margin-top:4px}
/* 思考程度三档 */
input[type=radio]{width:15px;height:15px;accent-color:var(--acc);flex:none}
.thinkwrap{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.thinkwrap label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--ink);cursor:pointer;
  padding:6px 11px;border:1px solid var(--edge);border-radius:999px;background:var(--panel2)}
.thinkwrap label.on{border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc)}
/* ---- 「按能力设默认」/「按工具指定」：一行 = 名字 + 平台下拉 + 模型下拉 + 一句当前状态 ----
   2026-11-15 改两级：先平台后模型。模型下拉只列这个平台里勾了这项能力的模型，
   所以「视频生成」里根本不会出现 deepseek —— 这正是用户抱怨的那个错配。 */
.rowset .row{border-top:1px solid var(--edge);padding:11px 0}
.rowset .row:first-child{border-top:0;padding-top:2px}
.rowset .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.rowset .hd b{font-size:13.5px}
.rowset .hd em{font-style:normal;font-size:11.5px;color:var(--faint)}
.rowset .sels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:8px}
.rowset .eff{margin:7px 0 0;font-size:11.5px;color:var(--dim);line-height:1.6}
.rowset .eff b{color:var(--ink);font-weight:700}
/* 2026-11-19：缺能力 / 配错的提示统一用红（--bad）。以前是 --warn 橙，语气太像「建议」，
   真到读扫描件失败时，用户想不起来自己见过这句提醒。 */
.rowset .eff.bad{color:var(--bad)}
/* 「推荐：平台 · 模型」那一行 + 右边的「按推荐」按钮 */
.rowset .recrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 0}
.rowset .rec{margin:0;font-size:11.5px;color:var(--dim);line-height:1.6}
.rowset .rec b{color:var(--ink);font-weight:700}
/* 模型卡上的「能力不足」徽标 */
.chip.lack{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
/* ---- 工具总览（只读） ----
   复用配置列表的 .mrow / .mmain / .chips（同一套卡片语言），只补「分组标题」和两条虚线分隔：
   一块说「单独指定」，一块说「跟随默认」，别让人以为是两套不同的东西。 */
.ovg + .ovg{margin-top:12px;padding-top:12px;border-top:1px dashed var(--edge)}
.ovt{margin:0 0 2px;font-size:13px;font-weight:800;color:var(--ink)}
.ovt small{margin-left:6px;font-size:11.5px;font-weight:700;color:var(--faint)}
.ovnote{margin:0;font-size:12px;line-height:1.6;color:var(--dim)}
.ovg .mrow:first-of-type{border-top:0;padding-top:4px}
.ovg .mrow{border-top:1px solid var(--edge)}
/* ---- 导入导出 ---- */
.ioacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* ---- 注册渠道（2026-11-08 从首页 AI 弹层搬进来；2026-11-15 横跨两栏、内部两列，别拉成一条长龙） ---- */
.invs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--panel2)}
.inv-top{display:flex;gap:16px;align-items:center}
.inv-top img{flex:none;width:104px;height:104px;border-radius:12px;background:#fff;padding:6px;object-fit:contain}
.inv-top .t{min-width:0}
.inv-top .t b{display:block;margin-bottom:4px;font-size:15px}
.inv-top .t span{display:block;font-size:13px;line-height:1.5;color:var(--dim)}
.inv-url{display:flex;gap:8px;align-items:center}
.inv-url input{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid var(--edge);border-radius:9px;background:var(--panel);font-size:12.5px;color:var(--dim)}
.inv-url button{flex:none;height:34px;padding:0 14px;border:0;border-radius:9px;background:var(--acc);color:#fff;font-size:13px;font-weight:600}
.inv-tip{margin:12px 0 0;font-size:12.5px;line-height:1.6;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#1b2333;color:#fff;font-size:13.5px;font-weight:700;padding:10px 18px;border-radius:999px;
  box-shadow:0 16px 32px -18px rgba(0,0,0,.7);transition:.2s;z-index:50;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad)}
@media (max-width:820px){ .invs{grid-template-columns:1fr} }
@media (max-width:620px){
  .grid2{grid-template-columns:1fr}
  .rowset .sels{grid-template-columns:1fr}
  header.top .wrap{min-height:auto}
  .pacts,.macts{width:100%;justify-content:flex-start;gap:8px}
  /* 手指点的东西别做成 6px 内边距的小药丸：一眼看着像标签、点起来容易点空 */
  .pacts .btn.sm,.macts .btn.sm{padding:8px 12px}
  .inv-top img{width:84px;height:84px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <!-- 2026-11-16 用户：「这里回首页也多余了　这种会把我网页弄得乱飞　返回为主」。
       本页是在总入口 iframe 里打开的，外壳左上角已经有一颗「← 返回」，
       页内再放一颗「← 回首页」等于同一个位置两个出口，点错就整页跳走。删掉它，只留外壳那一颗。 -->
  <h1><i>AI</i>AI 设置</h1>
  <span class="count" id="count">0 个平台 · 0 个模型</span>
</div></header>

<main class="wrap">
  <p class="lead">配置和 Key 跟账号云端走；一个平台 = 一个 Key + 一个接口地址，加平台时自动把它的模型全加进来。</p>

  <div class="cols">
    <!-- ============ 左栏 ============ -->
    <div class="col">

      <section class="card">
        <h2>平台与模型
          <span class="right">
            <button class="btn sm pri" type="button" id="addPlat">+ 新增平台</button>
          </span>
        </h2>

        <!-- 平台表单：新增 / 编辑都用这一个，字段少，摊开比弹窗好填 -->
        <form class="pf" id="pf" hidden>
          <h3 id="pfT">新增平台</h3>
          <div class="grid2">
            <label class="fld"><span>别名</span>
              <input type="text" id="pfName" maxlength="40" placeholder="如：111 / 学校中转 / 硅基流动"></label>
            <label class="fld"><span>服务商</span><select id="pfProv"></select></label>
          </div>
          <label class="fld"><span>接口地址</span>
            <input type="url" id="pfBase" placeholder="https://api.siliconflow.cn/v1" spellcheck="false"></label>
          <label class="fld"><span>API Key</span>
            <input type="password" id="pfKey" autocomplete="off" placeholder="sk-..." spellcheck="false"></label>
          <div class="acts">
            <button class="btn pri" type="submit" id="pfSave">保存平台</button>
            <button class="btn" type="button" id="pfFetch">读取模型</button>
            <button class="btn" type="button" id="pfCancel">取消</button>
            <p class="msg" id="pfMsg"></p>
          </div>
        </form>

        <div id="plats"></div>
      </section>

    </div>

    <!-- ============ 右栏：按能力设默认 + 识别用模型（2026-11-19 矩阵铺满） ============ -->
    <div class="col">

      <section class="card">
        <h2>按能力设默认</h2>
        <div class="rowset" id="caps"></div>
      </section>

      <section class="card">
        <h2>识别用模型</h2>
        <div class="rowset" id="judge"></div>
      </section>

    </div>
  </div>

  <div class="bottom">
    <section class="card">
      <h2>导入 / 导出</h2>
      <textarea id="io" rows="7" placeholder="复制配置 / 粘贴 JSON 导入" spellcheck="false"></textarea>
      <div class="ioacts">
        <button class="btn" type="button" id="copyCfg">复制配置 JSON</button>
        <button class="btn" type="button" id="importCfg">从上面的 JSON 导入</button>
        <p class="msg" id="ioMsg"></p>
      </div>
    </section>

    <section class="card">
      <h2>AI 注册渠道与工具建议</h2>
      <div class="invs" id="channels"></div>
    </section>
  </div>
</main>
<div id="toast"></div>

<script src="../hx-ai.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var snap = null;         // HXAI.settings() 的快照，所有渲染都读它，改存储后重新取
  /* 2026-11-17：「平台选了、但还没选模型」这一步必须临时记住。
     以前没记 —— 选完平台就 renderAll()，而平台下拉是按「当前模型的平台」画的，
     于是刚切到新平台的这一下**立刻被弹回旧平台/跟随默认**，用户看到的就是
     「切不到我的新平台」。这个状态只活在本页面内存里：一旦选了模型就落库，同时清掉。
     2026-11-19：删掉「按工具指定」后 tool 桶还在（兼容），judgePlat 是识别用模型的两级联动临时态。 */
  var tmpPlat = { cap: {}, tool: {}, judgePlat: '' };
  var editingPlat = '';    // '' = 正在新增平台；有 id = 正在编辑那个平台
  var platModels = [];     // 平台表单里「读取模型」读到的候选（保存平台时一起存进去）

  // 能力名 / 提示 / 思考程度名都从 hx-ai.js 的 HXAI.caps / HXAI.thinkLevels 现取，改一处两边一致
  function capDef(c) {
    for (var i = 0; i < HXAI.caps.length; i++) if (HXAI.caps[i].id === c) return HXAI.caps[i];
    return { id: c, name: c, hint: '' };
  }
  function capName(c) { return capDef(c).name; }
  function thinkName(id) {
    for (var i = 0; i < HXAI.thinkLevels.length; i++) if (HXAI.thinkLevels[i].id === id) return HXAI.thinkLevels[i].name;
    return id || '均衡';
  }
  function provLabel(k) { var p = HXAI.providers[k]; return p ? p.label : (k || '自定义'); }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var toastTimer = 0;
  function toast(msg, bad) {
    var t = $('toast');
    t.textContent = msg;
    t.className = bad ? 'show bad' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, bad ? 4200 : 2000);
  }

  // ---------- 取数小工具（都基于 snap，别直接读 localStorage） ----------
  function platById(id) {
    var hit = null;
    (snap.plats || []).forEach(function (p) { if (p.id === id) hit = p; });
    return hit;
  }
  function profById(id) {
    if (!id) return null;
    var hit = null;
    snap.profiles.forEach(function (p) { if (p.id === id) hit = p; });
    return hit;
  }
  function profsOf(platId) {
    return snap.profiles.filter(function (p) { return p.platId === platId; });
  }
  // 口径和 hx-ai.js 的 supports() 一致：文本能力人人有，别的看勾没勾
  function supportsCap(p, cap) {
    if (cap === 'text') return true;
    return (p.caps || []).indexOf(cap) >= 0;
  }
  // 「当前：平台「111」· 模型 xxx · 思考 深度 · 能力 文本/视频」——用户点名要的那句话
  function effLine(p) {
    if (!p) return '当前：未设置';
    var pl = platById(p.platId);
    var cs = (p.caps || []).map(capName).join('/') || '未勾能力';
    return '当前：平台「' + esc(pl ? pl.name : '（平台已删）') + '」· 模型 ' + esc(p.name || p.model) +
      ' · 思考 ' + esc(thinkName(p.thinkLevel)) + ' · 能力 ' + esc(cs);
  }

  // 按功能分类展示模型：text/vision/reason/image/video/audio 六个组，每组只列勾了该能力的模型。
  // 一个模型可能出现在多个组（比如 text+reason），正常 —— 展示的是「这个功能有哪些模型可用」。
  function modelGroups(ms) {
    var groups = [];
    HXAI.caps.forEach(function (c) {
      var hit = ms.filter(function (p) { return supportsCap(p, c.id); });
      if (hit.length) groups.push({ cap: c.id, name: c.name, list: hit });
    });
    return groups;
  }

  // 模型浮窗/展开体：按功能分组，每组列「模型名 + 能力标签 + 默认标记 + 测试/删除」
  function modelRowsHtml(pl, ms) {
    if (!ms.length) {
      return '<p class="mempty">这个平台还没有模型 —— 点「同步模型」，把这个平台名下的模型自动全部加进来。</p>';
    }
    var groups = modelGroups(ms);
    return groups.map(function (g) {
      var rows = g.list.map(function (m) {
        var usedCaps = [];
        Object.keys(snap.active).forEach(function (c) { if (snap.active[c] === m.id) usedCaps.push(capName(c)); });
        var usage = usedCaps.length ? '<span class="chip on">默认 ' + esc(usedCaps.join('/')) + '</span>' : '';
        return '<div class="mrow" data-model="' + esc(m.id) + '">' +
          '<div class="mmain">' +
            '<div class="mt"><b>' + esc(m.name || m.model) + '</b>' + usage + '</div>' +
            '<div class="chips">' + (m.caps || []).map(function (c) {
              return '<span class="chip on">' + esc(capName(c)) + '</span>';
            }).join('') + '</div>' +
          '</div>' +
          '<div class="macts">' +
            '<button class="btn sm" type="button" data-act="test">测试</button>' +
            '<button class="btn sm bad" type="button" data-act="del">删除</button>' +
          '</div>' +
          '<p class="rmsg"></p>' +
        '</div>';
      }).join('');
      return '<div class="mgrp"><div class="mgrp-h">' + esc(g.name) + '<span>' + g.list.length + '</span></div>' + rows + '</div>';
    }).join('');
  }

  function renderPlats() {
    var box = $('plats');
    var s = snap;
    if (!s.plats.length) { box.innerHTML = ''; return; }
    box.innerHTML = s.plats.map(function (pl) {
      var ms = profsOf(pl.id);
      var defCaps = (pl.caps || []).map(capName);
      // 模型列表默认收起：只显示「N 个模型」+「查看模型」按钮，点开才按功能分组展示。
      // 展开状态用 data-open 记在 DOM 上（renderAll 重画会收起，但只有点「查看/收起」才重画这一块）。
      return '<div class="plat" data-plat="' + esc(pl.id) + '">' +
        '<div class="phead">' +
          '<div class="pt"><b>' + esc(pl.name) + '</b>' +
            '<span class="pv">' + esc(provLabel(pl.provider)) + '</span>' +
            '<span class="kst' + (pl.hasKey ? ' ok' : '') + '">' + (pl.hasKey ? 'Key 已填' : '没填 Key') + '</span>' +
            '<span class="chip">' + ms.length + ' 个模型</span>' +
            (defCaps.length ? '<span class="chip on">默认：' + esc(defCaps.join('/')) + '</span>' : '') +
          '</div>' +
          '<div class="pacts">' +
            '<button class="btn sm" type="button" data-act="fetch">同步模型</button>' +
            '<button class="btn sm" type="button" data-act="toggle-models">' + (ms.length ? '查看模型' : '') + '</button>' +
            '<button class="btn sm" type="button" data-act="edit">编辑 / 改 Key</button>' +
            '<button class="btn sm bad" type="button" data-act="del">删除平台</button>' +
          '</div>' +
          '<p class="pm">' + esc(pl.baseUrl || '（没填接口地址）') + '</p>' +
        '</div>' +
        '<div class="mrows" hidden>' + modelRowsHtml(pl, ms) + '</div>' +
        '<p class="pmsg"></p>' +
      '</div>';
    }).join('');
  }

  // ---------- 画：「按能力设默认」（两级：平台 → 模型） ----------
  function renderCaps() {
    $('caps').innerHTML = HXAI.caps.map(function (c) {
      var cur = snap.active[c.id] || '';
      var curP = profById(cur);
      // 当前平台：**先看「刚选过、还没选模型」的临时态**，再退回「已落库的模型所属平台」。
      // 顺序反了就等于没修：只要这个工具以前指定过模型，tmpPlat 永远不生效，切平台照样弹回。
      var curPlatId = tmpPlat.cap[c.id] || (curP ? curP.platId : '');
      // 平台下拉只列「这个平台里至少有一个能干这件事的模型」，否则选了也是空
      var platsOk = snap.plats.filter(function (pl) {
        return profsOf(pl.id).some(function (p) { return supportsCap(p, c.id); });
      });
      var platOpts = '<option value="">' + (platsOk.length ? '未设置' : '还没有能做「' + esc(c.name) + '」的平台') + '</option>' +
        platsOk.map(function (pl) {
          return '<option value="' + esc(pl.id) + '"' + (pl.id === curPlatId ? ' selected' : '') + '>' +
            esc(pl.name) + '（' + esc(provLabel(pl.provider)) + '）</option>';
        }).join('');

      // 模型下拉：只列选中平台里勾了这项能力的（文本能力不挑，任何模型都能当文本用）
      var models = curPlatId ? profsOf(curPlatId).filter(function (p) { return supportsCap(p, c.id); }) : [];
      var modelOpts;
      if (!curPlatId) modelOpts = '<option value="">先选平台</option>';
      else if (!models.length) modelOpts = '<option value="">这个平台没有可用于「' + esc(c.name) + '」的模型</option>';
      else modelOpts = '<option value="">' + (cur ? '未设置' : '选一个模型') + '</option>' +
        models.map(function (p) {
          return '<option value="' + esc(p.id) + '"' + (p.id === cur ? ' selected' : '') + '>' +
            esc(p.name || p.model) + '（' + esc(p.model) + '）</option>';
        }).join('');

      // 当前状态那句话：设了但模型没勾这项能力时，要说实话（老存档里才有这种数据）。
      // 2026-11-19：这类提示统一用红字（.eff.bad 现在是 --bad），并且说清「真调用会报错」——
      // 只写「建议重选」太软，用户会以为什么都不影响。
      var eff, bad = false;
      if (!curP) eff = '当前：未设置';
      else {
        eff = effLine(curP);
        if (!supportsCap(curP, c.id)) {
          eff += ' · <b>这个模型没勾「' + esc(c.name) + '」，真调用会直接报错，重选一个勾了的</b>';
          bad = true;
        }
      }
      return '<div class="row" data-cap="' + c.id + '">' +
        '<div class="hd"><b>' + esc(c.name) + '</b></div>' +
        '<div class="sels">' +
          '<select data-kind="plat" data-cap="' + c.id + '" aria-label="' + esc(c.name) + '用哪个平台">' + platOpts + '</select>' +
          '<select data-kind="model" data-cap="' + c.id + '" aria-label="' + esc(c.name) + '用哪个模型">' + modelOpts + '</select>' +
        '</div>' +
        '<p class="eff' + (bad ? ' bad' : '') + '">' + eff + '</p>' +
      '</div>';
    }).join('');
  }

  // ---------- 画：「识别用模型」（独立模块：识别能力 + 指定识别器） ----------
  function renderJudge() {
    var jm = HXAI.judgeModel();
    var rec = HXAI.recommendJudge();
    var jmPlatId = tmpPlat.judgePlat || (jm ? jm.platId : (snap.judge && snap.judge.platId)) || '';
    // 平台下拉：只列「至少有一个能做文本问答的模型」的平台（识别是纯文字任务，用文本模型判）
    var platsOk = snap.plats.filter(function (pl) {
      return profsOf(pl.id).some(function (p) { return supportsCap(p, 'text'); });
    });
    var platOpts = '<option value="">未设置（自动推荐）</option>' + platsOk.map(function (pl) {
      return '<option value="' + esc(pl.id) + '"' + (pl.id === jmPlatId ? ' selected' : '') + '>' +
        esc(pl.name) + '（' + esc(provLabel(pl.provider)) + '）</option>';
    }).join('');
    // 模型下拉：只列能做文本问答的模型，别把文生图 / TTS / 文生视频那些塞进来当「识别器」
    var models = jmPlatId ? profsOf(jmPlatId).filter(function (p) { return supportsCap(p, 'text'); }) : [];
    var modelOpts;
    if (!jmPlatId) modelOpts = '<option value="">先选平台</option>';
    else if (!models.length) modelOpts = '<option value="">这个平台没有可用于识别的模型</option>';
    else modelOpts = '<option value="">选一个识别模型</option>' + models.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === (jm && jm.id ? jm.id : '') ? ' selected' : '') + '>' +
        esc(p.name || p.model) + '（' + esc(p.model) + '）</option>';
    }).join('');

    // 实际生效的识别模型：设了用它，没设用推荐的那个
    var effModel = jm || rec;
    var eff, effHtml = '', recLine = '';
    if (effModel) {
      var effPl = platById(effModel.platId);
      var effTag = jm ? '' : '<span class="chip on">自动推荐</span>';
      effHtml = '识别模型：' + effTag + '平台「' + esc(effPl ? effPl.name : '（平台已删）') + '」· ' + esc(effModel.name || effModel.model);
    } else {
      effHtml = '还没有可用的文本模型，先加一个平台和模型。';
    }
    if (rec && !jm) {
      var recPl = platById(rec.platId);
      recLine = '<p class="eff">推荐用「' + esc(recPl ? recPl.name : '') + ' · ' + esc(rec.name || rec.model) +
        '」当识别器（文本+推理，判得准）。<button class="btn sm" type="button" data-act="use-rec">就用推荐</button></p>';
    }

    var totalModels = snap.profiles.length;
    $('judge').innerHTML =
      '<div class="row" data-judge="1">' +
        '<div class="hd"><b>识别用模型</b></div>' +
        '<div class="sels">' +
          '<select data-kind="jplat" aria-label="识别用哪个平台">' + platOpts + '</select>' +
          '<select data-kind="jmodel" aria-label="识别用哪个模型">' + modelOpts + '</select>' +
        '</div>' +
        recLine +
        '<p class="eff">' + effHtml + '</p>' +
        '<div class="acts">' +
          '<button class="btn pri" type="button" data-act="judge-all">让 AI 识别全部平台的模型能力</button>' +
          '<p class="msg" id="judgeMsg"></p>' +
        '</div>' +
      '</div>';
  }

  // ---------- 注册渠道（从首页 AI 弹层搬来） ----------
  var AI_CHANNELS = [
    { img: '../invite/siliconflow.png', name: '硅基流动（SiliconFlow）', desc: '注册并完成身份认证后就能开通国产模型（DeepSeek、Qwen 等）的 API Key；一个 Key 还有文生图、文生视频（Wan2.2）、语音。先拿它练手。', url: 'https://cloud.siliconflow.cn/i/aQ6Tn6dH' },
    { img: '../invite/workbuddy.png', name: 'WorkBuddy（腾讯）', desc: '注册后在网页里就能用主流大模型，适合新手第一步；熟悉了再学 Codex / Claude 这类编程助手。', url: 'https://www.workbuddy.cn/events/invite?inviteCode=u1ds11m0hxo1bgw4' }
  ];
  function renderChannels() {
    var box = $('channels'); if (!box) return;
    box.innerHTML = AI_CHANNELS.map(function (it, i) {
      return '<div class="inv"><div class="inv-top"><img src="' + esc(it.img) + '" alt="' + esc(it.name) + ' 二维码" loading="lazy" width="104" height="104">'
        + '<div class="t"><b>' + esc(it.name) + '</b><span>' + esc(it.desc) + '</span></div></div>'
        + '<div class="inv-url"><input id="aiv' + i + '" readonly value="' + esc(it.url) + '"><button type="button" id="aic' + i + '">复制</button></div></div>';
    }).join('');
    AI_CHANNELS.forEach(function (it, i) {
      var btn = $('aic' + i); if (!btn) return;
      btn.onclick = function () {
        var inp = $('aiv' + i);
        var done = function () { btn.textContent = '已复制'; setTimeout(function () { btn.textContent = '复制'; }, 1600); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(it.url).then(done, function () { inp.select(); document.execCommand('copy'); done(); });
        else { inp.select(); document.execCommand('copy'); done(); }
      };
    });
  }

  function renderAll() {
    snap = HXAI.settings();
    // 平台被删掉之后，临时记住的选中项要一起清，否则下拉会停在一个不存在的 value 上
    ['cap', 'tool'].forEach(function (k) {
      Object.keys(tmpPlat[k]).forEach(function (key) {
        var id = tmpPlat[k][key];
        if (!snap.plats.some(function (pl) { return pl.id === id; })) delete tmpPlat[k][key];
      });
    });
    if (tmpPlat.judgePlat && !snap.plats.some(function (pl) { return pl.id === tmpPlat.judgePlat; })) tmpPlat.judgePlat = '';
    $('count').textContent = snap.plats.length + ' 个平台 · ' + snap.profiles.length + ' 个模型';
    renderPlats(); renderCaps(); renderJudge(); renderChannels();
  }

  // ---------- 平台卡片上的按钮（事件委托：卡片是重画的，逐次绑太容易漏） ----------
  function onPlatAct(act, platEl, rowEl) {
    var platId = platEl ? platEl.getAttribute('data-plat') : '';
    var modelId = rowEl ? rowEl.getAttribute('data-model') : '';
    var pl = platById(platId);
    if (!pl) { renderAll(); return; }

    if (act === 'fetch' && !rowEl) {
      var msg = platEl.querySelector('.pmsg');
      msg.className = 'pmsg';
      msg.textContent = '';
      var pill = window.HXTheme && HXTheme.loadPill ? HXTheme.loadPill('正在读取「' + pl.name + '」的模型列表…') : null;
      HXAI.models({ platId: platId }).then(function (ms) {
        if (pill) pill.done();
        // 读到的模型全量挂进平台（已存在的跳过），不再让用户一个个选
        var r = HXAI.savePlatModels(platId, ms);
        renderAll();
        var again = document.querySelector('.plat[data-plat="' + platId + '"] .pmsg');
        if (again) {
          again.className = 'pmsg good';
          again.textContent = '读到 ' + ms.length + ' 个模型，自动加入 ' + r.added + ' 个' +
            (r.skipped ? '（已有 ' + r.skipped + ' 个）' : '') + '。不需要的可以逐个删除。';
        }
      }).catch(function (e) {
        if (pill) pill.done();
        var m2 = document.querySelector('.plat[data-plat="' + platId + '"] .pmsg');
        if (m2) { m2.className = 'pmsg bad'; m2.textContent = e.message; }
      });
      return;
    }
    if (act === 'toggle-models' && !rowEl) {
      var mrows = platEl.querySelector('.mrows');
      var btn = platEl.querySelector('[data-act="toggle-models"]');
      var isOpen = !mrows.hidden;
      mrows.hidden = isOpen;
      if (btn) btn.textContent = isOpen ? '查看模型' : '收起模型';
      return;
    }
    if (act === 'edit') return openPlatForm(platId);

    if (act === 'del' && !rowEl) {
      // 删平台是不可逆的：先把「连带删掉什么」数清楚给用户看
      var goneModels = profsOf(platId).length;
      var goneCaps = (pl.caps || []).map(capName);
      var goneTools = pl.tools ? HXAI.toolList.filter(function (t) { return pl.tools.indexOf(t.id) >= 0; }).map(function (t) { return t.name; }) : [];
      var warn = '删掉平台「' + pl.name + '」？\n\n' +
        '这个平台下还有 ' + goneModels + ' 个模型，会被一起删掉；' +
        '它的 Key 也会清掉。';
      if (goneCaps.length) warn += '\n正在当默认的能力：' + goneCaps.join('、') + '（会变回未设置）';
      if (goneTools.length) warn += '\n正在用它的工具：' + goneTools.join('、') + '（会退回默认）';
      if (!confirm(warn)) return;
      HXAI.removePlat(platId);
      if (editingPlat === platId) closePlatForm();
      renderAll();
      toast('已删除平台「' + pl.name + '」');
      return;
    }

    var m = modelId ? profById(modelId) : null;
    if (!m) return;
    if (act === 'del') {
      if (!confirm('删掉模型「' + (m.name || m.model) + '」？\n平台「' + pl.name + '」和它的 Key 会留着，别的模型不受影响。')) return;
      HXAI.remove(modelId);
      renderAll();
      toast('已删除模型');
      return;
    }
    if (act === 'test') {
      var rmsg = rowEl.querySelector('.rmsg');
      rmsg.className = 'rmsg';
      rmsg.textContent = '';
      var pill = window.HXTheme && HXTheme.loadPill ? HXTheme.loadPill('正在测试「' + (m.name || m.model) + '」连接…') : null;
      HXAI.test({ platId: platId, id: modelId, model: m.model, caps: m.caps, thinkLevel: m.thinkLevel }).then(function (r) {
        if (pill) pill.done();
        rmsg.className = 'rmsg good';
        rmsg.textContent = '连接成功 · ' + r.ms + ' 毫秒 · 返回「' + r.text + '」';
      }).catch(function (e) {
        if (pill) pill.done();
        rmsg.className = 'rmsg bad';
        rmsg.textContent = '连接失败：' + e.message;
      });
    }
  }

  $('plats').addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    onPlatAct(btn.getAttribute('data-act'), btn.closest('.plat'), btn.closest('.mrow'));
  });

  // ---------- 「按能力」「按工具」下拉的变化 ----------
  /* 两级联动，2026-11-15：
     选平台时如果这个平台只有一个能干这件事的模型，直接选上（少点一次）；
     有多个就留「选一个模型」，逼用户自己看一遍 —— 别替他猜，猜错了就是当初那种错配。
     2026-11-17 修：**「选了平台、还没选模型」这一步要记住**（tmpPlat）。
     以前没记，这一下 renderAll() 会按「当前模型的平台」重画，当场把平台弹回去 ——
     用户报的「切不到我新平台 / 各个工具都只能跟随默认」就是它。 */
  function bindTwoLevel(box) {
    box.addEventListener('change', function (e) {
      var sel = e.target;
      if (!sel || !sel.dataset.kind) return;
      var cap = sel.dataset.cap || '';
      var tool = sel.dataset.tool || '';
      if (!cap && !tool) return;
      var bag = cap ? tmpPlat.cap : tmpPlat.tool;
      var key = cap || tool;

      if (sel.dataset.kind === 'model') {
        // 选具体模型 = 落库；平台选择随之生效，临时态可以清了
        delete bag[key];
        if (cap) { HXAI.setActive(cap, sel.value); toast(sel.value ? '已更新默认模型' : '已清空这项默认'); }
        else { HXAI.setTool(tool, sel.value); toast(sel.value ? '已指定这个工具用的模型' : '已改回跟随默认'); }
        renderAll();
        return;
      }

      // 选了平台：找出这个平台里能干这件事的模型
      var platId = sel.value;
      if (!platId) {
        delete bag[key];
        if (cap) { HXAI.setActive(cap, ''); toast('已清空这项默认'); }
        else { HXAI.setTool(tool, ''); toast('已改回跟随默认'); }
        renderAll();
        return;
      }
      bag[key] = platId;   // 先记住，别在下一行 renderAll() 里被弹回去
      var cands = profsOf(platId).filter(function (p) { return cap ? supportsCap(p, cap) : true; });
      if (!cands.length) {
        toast(cap ? '这个平台没有能做「' + capName(cap) + '」的模型，去左边给它加一个' : '这个平台还没有模型，去左边给它加一个');
      } else if (cands.length === 1) {
        // 只有一套就替他选上（省一次点击，也不存在选错的可能）
        delete bag[key];
        if (cap) { HXAI.setActive(cap, cands[0].id); toast('已选「' + (cands[0].name || cands[0].model) + '」'); }
        else { HXAI.setTool(tool, cands[0].id); toast('这个工具改用「' + (cands[0].name || cands[0].model) + '」'); }
      }
      renderAll();   // 平台变了但没定模型：重画出来让用户在模型下拉里挑（tmpPlat 保证平台不弹回）
    });
  }
  bindTwoLevel($('caps'));

  // 「识别用模型」两级联动（平台 → 模型），选定即落库 HXAI.setJudge
  $('judge').addEventListener('change', function (e) {
    var sel = e.target;
    if (!sel || !sel.dataset.kind) return;
    if (sel.dataset.kind === 'jplat') {
      // 选了平台：先记住，重画让模型下拉列这个平台的模型
      tmpPlat.judgePlat = sel.value;
      renderAll();
      return;
    }
    if (sel.dataset.kind === 'jmodel') {
      var pid = tmpPlat.judgePlat || (HXAI.judgeModel() ? HXAI.judgeModel().platId : '');
      HXAI.setJudge(pid, sel.value);
      tmpPlat.judgePlat = '';
      renderAll();
      toast(sel.value ? '已设识别用模型' : '已清空，改用自动推荐');
    }
  });

  // 「识别用模型」卡片上的按钮（就用推荐 / 识别全部平台），事件委托
  $('judge').addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'use-rec') {
      var rec = HXAI.recommendJudge();
      if (!rec) { toast('还没有可推荐的模型，先加一个平台和模型', true); return; }
      HXAI.setJudge(rec.platId, rec.id);
      tmpPlat.judgePlat = '';
      renderAll();
      toast('已用推荐识别模型：' + (rec.name || rec.model));
      return;
    }
    if (act === 'judge-all') {
      var msg = $('judgeMsg');
      if (!snap.profiles.length) { toast('还没有模型，先加一个平台并同步模型', true); return; }
      msg.className = 'msg'; msg.textContent = '';
      // 悬浮加载框：识别要调一次识别模型，弱网下可能好几秒，光靠一行小字用户会以为卡了/没按下去
      var pill = window.HXTheme && HXTheme.loadPill ? HXTheme.loadPill('正在让 AI 识别所有平台的模型能力…') : null;
      HXAI.judgeCaps({}).then(function (r) {
        if (pill) pill.done();
        renderAll();
        var m2 = $('judgeMsg');
        if (m2) {
          if (r.src === 'ai') {
            m2.className = 'msg good';
            m2.textContent = 'AI 已识别 ' + r.judged + ' 个模型的能力。';
          } else {
            // 识别失败退回按名字猜：用红色醒目标出「为什么没识别成」，别让用户只看到「可能不准」
            m2.className = 'msg bad';
            m2.textContent = (r.warn || '已按名字猜 ' + r.judged + ' 个模型，可能不准');
          }
        }
        toast(r.src === 'ai' ? 'AI 已识别能力' : '识别没成功，已按名字猜（见下方原因）');
      }).catch(function (err) {
        if (pill) pill.done();
        var m3 = $('judgeMsg');
        if (m3) { m3.className = 'msg bad'; m3.textContent = err.message; }
      });
      return;
    }
  });

  // ---------- 平台表单 ----------
  function openPlatForm(id, noScroll) {
    editingPlat = id || '';
    platModels = [];
    var pl = id ? HXAI.getPlat(id) : null;
    $('pf').hidden = false;
    $('pfT').textContent = pl ? '编辑平台：' + pl.name : '新增平台';
    $('pfName').value = pl ? pl.name : '';
    $('pfProv').value = pl ? pl.provider : 'deepseek';
    // 新平台照服务商预设填地址；编辑时用存下来的（用户可能手改过）
    $('pfBase').value = pl ? pl.baseUrl : (HXAI.providers[$('pfProv').value].baseUrl || '');
    // Key 从不回显：留空 = 不动原来那把（一个平台只有一把，改一次全平台生效）
    $('pfKey').value = '';
    $('pfKey').placeholder = pl && pl.hasKey ? '已保存（留空表示不改）' : 'sk-...';
    $('pfMsg').textContent = '';
    $('pfMsg').className = 'msg';
    // 打开页面时（一个平台都没有）不要滚屏：一进来就把顶部说明顶掉会让人不知道自己在哪
    if (!noScroll) $('pf').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('pfName').focus();
  }

  function closePlatForm() {
    editingPlat = '';
    platModels = [];
    $('pf').hidden = true;
    $('pfMsg').textContent = '';
  }

  $('pfProv').onchange = function () {
    // 换服务商 = 换一家，地址跟着换（已经手填过的地址会被覆盖，这是有意的）
    $('pfBase').value = HXAI.providers[$('pfProv').value].baseUrl || '';
  };

  function collectPlat() {
    var c = {
      id: editingPlat || undefined,
      name: $('pfName').value.trim(),
      provider: $('pfProv').value,
      baseUrl: $('pfBase').value.trim()
    };
    var k = $('pfKey').value.trim();
    if (k) c.key = k;   // 留空 = 不改原来那把
    return c;
  }

  $('pfFetch').onclick = function () {
    var c = collectPlat(), msg = $('pfMsg');
    if (!c.baseUrl) { msg.className = 'msg bad'; msg.textContent = '先填接口地址，才能读模型列表。'; return; }
    var k = $('pfKey').value.trim() || (editingPlat ? HXAI.platKey(editingPlat) : '');
    if (!k) { msg.className = 'msg bad'; msg.textContent = '先填 API Key 才能读模型列表（Key 是服务商给的 sk- 开头那一串）。'; return; }
    msg.className = 'msg'; msg.textContent = '正在读取模型列表…';
    HXAI.models({ provider: c.provider, baseUrl: c.baseUrl, platId: editingPlat, key: k }).then(function (ms) {
      if (!ms.length) {
        msg.className = 'msg bad';
        msg.textContent = '这个服务商没有返回任何模型（可能不开放 /models 接口）。直接手填模型名也可以。';
        return;
      }
      platModels = ms;
      msg.className = 'msg good';
      msg.textContent = '读到 ' + ms.length + ' 个模型。保存平台后，加模型时下拉里就有它们。';
    }).catch(function (e) {
      msg.className = 'msg bad';
      msg.textContent = e.message;   // models() 已经把「缺什么 Key / 什么权限 / 什么地址」说清
    });
  };

  $('pf').onsubmit = function (e) {
    e.preventDefault();
    var c = collectPlat(), msg = $('pfMsg');
    if (!c.name) c.name = provLabel(c.provider);   // 别名懒得起就用服务商名，卡片上不至于空白
    if (!c.baseUrl) { msg.className = 'msg bad'; msg.textContent = '接口地址不能空（不确定就照服务商文档里的 OpenAI 兼容地址填）。'; return; }
    if (platModels.length) c.models = platModels;
    var saved;
    try {
      saved = HXAI.savePlat(c);
    } catch (err) {
      msg.className = 'msg bad'; msg.textContent = err.message; return;
    }
    closePlatForm();
    renderAll();
    // 2026-11-19：保存平台后自动读取模型并全量加入（用户不再一个个选模型）。
    // Key 有就自动同步；没 Key 就只保存平台，提示用户之后点「同步模型」。
    var k = c.key || (editingPlat ? HXAI.platKey(saved.id) : '');
    if (k) {
      toast('已保存平台「' + saved.name + '」，正在同步模型…');
      HXAI.models({ platId: saved.id }).then(function (ms) {
        var r = HXAI.savePlatModels(saved.id, ms);
        renderAll();
        toast('已自动加入 ' + r.added + ' 个模型' + (r.skipped ? '（已有 ' + r.skipped + ' 个）' : ''));
      }).catch(function (err2) {
        renderAll();
        toast('模型列表没读到：' + err2.message + '（可稍后点「同步模型」重试）', true);
      });
    } else {
      toast('已保存平台「' + saved.name + '」。填上 Key 后点「同步模型」就能自动加模型。');
    }
  };

  $('pfCancel').onclick = closePlatForm;

  $('addPlat').onclick = function () {
    if (!$('pf').hidden && !editingPlat) { closePlatForm(); return; }
    openPlatForm('');
  };

  // ---------- 导入 / 导出 ----------
  $('copyCfg').onclick = function () {
    var text = HXAI.exportJson();
    $('io').value = text;
    var done = function () {
      $('ioMsg').className = 'msg good';
      $('ioMsg').textContent = '已复制（有平台和模型，没有 Key）。';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {
        $('io').select();
        $('ioMsg').className = 'msg';
        $('ioMsg').textContent = '浏览器不给自动复制，已经选中，按 Ctrl+C。';
      });
    } else {
      $('io').select();
      $('ioMsg').className = 'msg';
      $('ioMsg').textContent = '已经选中，按 Ctrl+C 复制。';
    }
  };

  $('importCfg').onclick = function () {
    var msg = $('ioMsg');
    msg.className = 'msg';
    try {
      var r = HXAI.importJson($('io').value);
      renderAll();
      msg.className = 'msg good';
      msg.textContent = '导入完成：平台 ' + (r.plats || 0) + ' 个、新增模型 ' + r.added + ' 个、更新 ' + r.updated + ' 个。Key 要自己重新填（每个平台补一次）。';
      toast('已导入');
    } catch (e) {
      msg.className = 'msg bad';
      msg.textContent = e.message;
    }
  };

  // ---------- 启动 ----------
  function boot() {
    if (typeof HXAI === 'undefined') {
      $('plats').innerHTML = '<p class="rmsg bad">没加载到 hx-ai.js。确认它在网站根目录（/hx-ai.js），并且这个页面叫 /ai/。</p>';
      return;
    }
    // 供应商按 group 分堆（国内官方 / 国内聚合 / 海外官方 / 海外聚合 / 自定义），
    // 顺序照 HXAI.providers 里第一次出现的先后，不另维护一份名单。
    var order = [], byG = {};
    Object.keys(HXAI.providers).forEach(function (k) {
      var gname = HXAI.providers[k].group || '其他';
      if (!byG[gname]) { byG[gname] = []; order.push(gname); }
      byG[gname].push(k);
    });
    $('pfProv').innerHTML = order.map(function (gname) {
      var opts = byG[gname].map(function (k) {
        return '<option value="' + k + '">' + esc(HXAI.providers[k].label) + '</option>';
      }).join('');
      // 只有一堆就不加分组框，省得下拉里多一层没意义的缩进
      return order.length > 1 ? '<optgroup label="' + esc(gname) + '">' + opts + '</optgroup>' : opts;
    }).join('');
    renderAll();
    // 一个平台都没有就直接把平台表单摊开，别让人满页面找「新增」按钮
    if (!snap.plats.length) openPlatForm('', true);
  }

  boot();
})();
</script>
</body>
</html>
